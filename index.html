nistrative processes.\n\tImprove the efficiency and scalability of membership operations.\n\tEnsure the team effectively utilizes CRM, membership, and marketing automation platforms.\n\nTeam Leadership\n\n\tLead, coach, and develop a team of Membership Associates.\n\tEstablish clear goals, KPIs, service standards, and accountability.\n\tMonitor team productivity and member-service performance.\n\tEvaluate existing team structure, responsibilities, skills, and workflows.\n\tImplement improvements that increase efficiency and service quality.\n\tFoster a professional, responsive, and service-oriented team culture.\n\nCross-Department Collaboration\n\n\tPartner with Marketing on acquisition campaigns, segmentation, communications, renewals, and reactivation.\n\tCollaborate with Programs to better understand member engagement and connect members with relevant programs and experiences.\n\tWork closely with Finance on membership revenue, forecasting, budgeting, pricing, and financial performance.\n\tPartner with the CEO and senior leadership on membership strategy, priorities, performance, and key decisions.\n\tPresent membership results, risks, trends, and opportunities to senior leadership.\n\nKey Performance Indicators\n\nSuccess will be measured through:\n\n\tNet membership growth\n\tMembership revenue\n\tNew member acquisition\n\tProspect-to-member conversion\n\tRenewal and retention rates\n\tMember reactivation\n\tMember engagement and satisfaction\n\tPricing and package performance\n\tMembership campaign ROI\n\tCost of acquisition\n\tBudget and forecast performance\n\tTeam productivity and service quality\n\tTechnology adoption and operational efficiency\n\nQualifications\n\n\t7+ years of relevant professional experience in membership, subscription, hospitality, fitness, club, community, cultural, or another relationship-driven recurring-revenue environment.\n\tAt least 3 years of leadership experience with direct responsibility for growth, retention, revenue, and member or customer experience.\n\tExperience managing an in-person membership or customer journey, rather than exclusively digital subscription models.\n\tDemonstrated success increasing acquisition, conversion, retention, engagement, and revenue.\n\tHands-on experience with pricing, packaging, segmentation, budgeting, forecasting, and performance management.\n\tStrong financial and business acumen.\n\tProven experience leading and developing high-performing teams.\n\tStrong knowledge of KPIs, dashboards, CRM or membership platforms, and marketing automation.\n\tExperience using technology, automation, and AI to improve operations and productivity.\n\tStrong project and change-management abilities.\n\tExcellent interpersonal and communication skills.\n\tStrong discretion and ability to navigate sensitive member situations professionally.\n\tAbility to build trust and relationships within a close-knit, community-focused environment.\n\tStrong judgment and ability to evaluate and improve established processes.\n\tHigh level of accountability, ownership, and follow-through."}, {"id": "26828", "title": "Interior House Painting Instructor", "bhTitle": "Teacher", "category": "Education & Childcare", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-05", "exp": "2027-01-05", "desc": "Location: Brooklyn, NY – In Person\nEmployment Type: Part-Time / Temporary\nSchedule: 10 Total Hours – November 2026\n\nPosition Overview\n\nA Brooklyn nonprofit organization that provides free skills training to adults preparing for careers in the trades is seeking an experienced Interior House Painting Instructor to lead a short-term, hands-on training program.\n\nThe instructor will teach adult beginners the fundamentals of professional interior painting, combining demonstrations with supervised hands-on practice. The goal is to help students develop practical skills, understand job-site expectations, and prepare for paid work in the painting and home improvement trades.\n\nKey Responsibilities\n\n\tTeach the fundamentals of interior residential painting to adult learners.\n\tDemonstrate proper surface preparation techniques.\n\tTeach patching, sanding, taping, and other preparation methods.\n\tDemonstrate proper cutting-in and rolling techniques.\n\tIntroduce students to basic paint spraying techniques.\n\tTeach proper setup, breakdown, and cleanup procedures.\n\tExplain the appropriate use and care of painting tools, equipment, and materials.\n\tCover essential job-site safety procedures, including lead-safe practices.\n\tDemonstrate techniques for completing painting projects efficiently while maintaining professional-quality standards.\n\tSupervise students during hands-on practice.\n\tProvide real-time instruction, corrections, and constructive feedback.\n\tAnswer questions and explain techniques in a clear and patient manner.\n\tHelp students understand professional expectations and proper job-site conduct.\n\nQualifications\n\n\tMust be a licensed painting or home improvement contractor OR currently work under a licensed contractor.\n\tSolid professional experience performing interior house painting.\n\tStrong knowledge of surface preparation, patching, sanding, taping, cutting in, rolling, and basic spraying techniques.\n\tFamiliarity with painting tools, materials, job-site safety, and lead-safe practices.\n\tAbility to demonstrate painting techniques in a hands-on classroom environment.\n\tAbility to explain professional skills clearly and patiently to adult beginners.\n\tReliable, professional, and comfortable working directly with students on site.\n\tPrevious teaching, training, mentoring, or supervisory experience is a plus but not required."}, {"id": "26826", "title": "Controller", "bhTitle": "Controller", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-05", "exp": "", "desc": "Location: Somerset, NJ – In-Person\nEmployment Type: Part-Time to Full-Time\nSchedule: Flexible / Based on Business Needs\n\nPosition Overview\n\nA growing company in Somerset, New Jersey is seeking an experienced Controller to oversee and manage the company's day-to-day accounting and financial operations.\n\nThis is a hands-on position for an accounting professional who is comfortable taking ownership of the accounting function rather than solely providing high-level oversight. The Controller will be responsible for maintaining accurate financial records, overseeing accounts payable and receivable, completing reconciliations and month-end close, preparing financial reports, and coordinating with the company's outside CPA or accounting firm when necessary.\n\nThe position will initially be part-time, with the potential to grow into a full-time role based on the company's needs.\n\nKey Responsibilities\n\nAccounting & Financial Operations\n\n\tOversee the company's day-to-day accounting and bookkeeping functions.\n\tManage accounts receivable and collections.\n\tOversee accounts payable, including invoices and payments.\n\tMonitor outstanding customer balances and follow up on collections.\n\tMaintain accurate general ledger and financial records.\n\tReview transactions and ensure expenses are properly recorded and categorized.\n\tIdentify discrepancies and investigate accounting or financial issues.\n\tMaintain organized supporting documentation for financial transactions.\n\nReconciliations & Month-End Close\n\n\tPerform and review bank and account reconciliations.\n\tInvestigate and resolve reconciliation discrepancies.\n\tManage the month-end closing process.\n\tPrepare journal entries and adjustments as necessary.\n\tEnsure financial records are complete and accurate before closing each reporting period.\n\nFinancial Reporting\n\n\tPrepare and review financial statements and management reports.\n\tProvide accurate and timely financial information to ownership and management.\n\tMonitor expenses and identify unusual transactions, discrepancies, or opportunities for improved financial controls.\n\tAssist management in understanding the company's financial performance.\n\tMaintain accurate accounting records to support tax preparation and year-end reporting.\n\nCPA & External Accounting Coordination\n\n\tCoordinate with the company's outside CPA and accounting firm as needed.\n\tPrepare financial records and supporting documentation for tax and year-end purposes.\n\tRespond to accounting questions and provide requested reports or documentation.\n\tHelp ensure the company's internal accounting records remain organized and ready for outside review.\n\nQualifications\n\n\tPrevious Controller, senior accounting, or comparable hands-on accounting experience required.\n\tStrong accounting and bookkeeping background.\n\tHands-on experience with accounts payable, accounts receivable, and collections.\n\tExperience performing bank and account reconciliations.\n\tStrong understanding of general ledger accounting and month-end close.\n\tExperience preparing and reviewing financial statements.\n\tProficiency with accounting software.\n\tStrong Microsoft Excel skills.\n\tExcellent attention to detail and accuracy.\n\tStrong organizational and problem-solving abilities.\n\tAbility to identify and resolve financial discrepancies.\n\tComfortable working independently and taking ownership of the accounting function.\n\tDependable, professional, and capable of handling confidential financial information.\n\tExperience coordinating with outside CPAs or accounting firms preferred."}, {"id": "26825", "title": "Assistant Property Manager", "bhTitle": "Property Manager", "category": "Real Estate & Property", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-05", "exp": "2027-01-05", "desc": "Location: New York, NY\nEmployment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nA well-established New York City real estate firm is seeking a motivated and organized Assistant Property Manager to support the day-to-day management of a portfolio of residential and select commercial properties.\n\nThis position works closely with the Property Manager and ownership across tenant relations, leasing, maintenance coordination, rent collection, regulatory compliance, property inspections, and financial reporting.\n\nThe role is an excellent opportunity for someone with property management experience who is looking to expand their responsibilities and grow within an active NYC real estate organization.\n\nKey Responsibilities\n\nProperty & Tenant Management\n\n\tServe as a primary point of contact for tenant inquiries, requests, and complaints.\n\tRespond to tenant concerns professionally and ensure issues are addressed in a timely manner.\n\tMaintain positive and professional relationships with tenants.\n\tAssist with the day-to-day operations of residential and select commercial properties.\n\tMaintain accurate tenant, lease, and property records within the property management system.\n\nMaintenance & Property Operations\n\n\tCoordinate maintenance and repair requests with in-house staff and outside vendors.\n\tCreate and track work orders through completion.\n\tFollow up with tenants, maintenance staff, and vendors regarding outstanding issues.\n\tConduct periodic property inspections.\n\tIdentify maintenance concerns, violations, or deficiencies and coordinate appropriate follow-up.\n\tHelp ensure properties are properly maintained and operational issues are addressed promptly.\n\nLeasing & Rent Administration\n\n\tSupport leasing activities, including property showings, application processing, lease preparation, and renewals.\n\tMaintain accurate leasing and tenant documentation.\n\tAssist with rent collection and monitor outstanding balances.\n\tTrack arrears and conduct appropriate follow-up.\n\tPrepare notices, reports, correspondence, and other property-related documentation.\n\nCompliance\n\n\tAssist with maintaining compliance with applicable NYC and New York State housing regulations.\n\tSupport compliance related to rent stabilization and DHCR requirements.\n\tAssist with DOB, HPD, Local Law, and other regulatory requirements.\n\tTrack violations and deficiencies and follow up through resolution.\n\tMaintain organized compliance records and documentation.\n\tKnowledge of Good Cause Eviction and NYC housing compliance frameworks is strongly preferred.\n\nReporting & Administrative Support\n\n\tAssist with property and financial reporting.\n\tMaintain accurate information within Yardi or other property management software.\n\tPrepare and review routine reports, notices, and correspondence.\n\tSupport the Property Manager and ownership with special projects as needed.\n\tHelp maintain organized property files and documentation.\n\nQualifications\n\n\tMinimum 1–3 years of experience in residential property management or a related real estate role.\n\tAt least 1 year of property management experience required.\n\tFamiliarity with NYC housing regulations and compliance strongly preferred.\n\tKnowledge of rent stabilization, DHCR, Good Cause Eviction, DOB, HPD, and NYC Local Laws is a strong plus.\n\tProficiency with Microsoft Excel, Word, and Outlook.\n\tExperience with Yardi or similar property management software is a plus.\n\tStrong organizational and time-management skills.\n\tExcellent attention to detail.\n\tStrong written and verbal communication skills.\n\tProfessional and customer-service-oriented approach to tenant relations.\n\tAbility to manage multiple priorities in a fast-paced environment.\n\tAbility to work effectively with tenants, vendors, maintenance teams, management, and ownership.\n\tEnglish proficiency required.\n\tSpanish or other bilingual capabilities are a plus.\n\tBachelor's degree preferred."}, {"id": "26822", "title": "Part Time E-Commerce Growth Manager", "bhTitle": "Part Time E-Commerce Growth Manager", "category": "E-commerce, Marketing & Social Media", "type": "Part Time", "typeNote": "", "state": "NJ", "added": "2026-10-01", "exp": "2027-01-07", "desc": "Hours: 9:00 - 4:30, Monday–Wednesday\n\nLocation: Eatontown NJ\n\nDrive sales for our boutique jewelry brand by optimizing our D2C and B2B online stores, creating high quality mobile content, and deploying it across paid ads, email marketing, and organic social\n\nKey Responsibilities\n\n\tShopify Store Optimization (D2C): Maintain product listings, collection pages, homepage banners, and basic SEO to maximize conversion rates and average order value.\n\tFaire Store Optimization (B2B): Maintain product listings, collection pages, homepage banners, and basic SEO to maximize conversion rates and average order value.\n\tMobile & AI Content Creation: Shoot and edit mobile photos and vertical videos featuring jewelry styling, layering, and product launches using AI tools.\n\tPaid Ads Management: Launch, test, and optimize Meta and Google ad campaigns to drive profitable customer acquisition.\n\tEmail Marketing & Retention: Build and manage automated email flows and send promotional newsletters to drive repeat purchases and customer loyalty.\n\tInstagram Growth: Create and execute a weekly Instagram content calendar focused on driving sales, flash deals, and brand engagement.\n\nQualifications\n\n\tE-Commerce Experience: Experience managing and optimizing online product listings.\n\tContent Creation: Proficient using a phone or camera to capture quality product photos and video.\n\tAI Editing: Proficient using AI tools (Canva, Photoroom, Gemini) to create editorial-quality visuals.\n\tGrowth Marketing: Experience running profitable Meta/Google ad campaigns and setting up email flows.\n\tAesthetic Eye: Strong visual sense and interest in jewelry styling, layering, and lifestyle branding."}, {"id": "26821", "title": "Outbound Outreach Representative & Brand Specialist", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-09-30", "exp": "2026-12-30", "desc": "Location: West Long Branch, NJ (In-Office)\nJob Type: Full-time\nSchedule: Monday through Friday\n\nA fire safety company is seeking an energetic and articulate Outbound Outreach Representative to join our team in West Long Branch, NJ. In this role, your primary focus will be connecting with local homeowners over the phone to educate them on home fire safety hazards and introduce our signature 9-point Residential Fire Safety Walkthrough.\n\nThis position also offers an exciting growth track for candidates with creative talent. If you are comfortable in front of the camera and skilled in interviewing, recording, editing, and publishing social media content, you can expand your role to become the digital face of our company across local social channels.\n\nKey Responsibilities:\n\n\tConduct outbound calls to local residents to inform them about home fire safety risks and our walkthrough services.\n\n\tEducate homeowners on key risks including expired smoke detectors, carbon monoxide placement, and dryer vent lint buildup.\n\n\tSchedule residential fire safety walkthroughs for our field specialists.\n\n\tMaintain accurate, organized records of phone contacts, follow-ups, and scheduled appointments.\n\n\t(Optional) Serve as the on-camera host and brand ambassador for company social media channels.\n\n\t(Optional) Plan, record, edit, and post engaging video content, including local interviews, safety tips, and behind-the-scenes clips.\n\nQualifications:\n\n\tStrong verbal communication skills with a confident, friendly, and persuasive phone demeanor.\n\n\tComfortable making consistent outbound calls to local community members.\n\n\tAbility to clearly explain safety services and address homeowner questions.\n\n\tBasic computer literacy for tracking phone contacts and updating appointment calendars.\n\n\tPrior experience in telemarketing, outbound sales, appointment setting, or customer service is a plus.\n\n\tFor the expanded social media role: hands-on experience with video recording, editing software/apps, and managing social media accounts.\n\nWhat We Offer:\n\n\tFull-time schedule operating directly out of our West Long Branch office.\n\n\tA meaningful role helping improve safety across our local Shore community.\n\n\tOpportunities for professional growth and creative freedom in content production."}, {"id": "26820", "title": "AI Consultancy Sales Manager", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Remote / Hybrid", "typeNote": "Remote/Hybrid/PT", "state": "NY", "added": "2026-09-29", "exp": "2026-12-29", "desc": "Location: Remote\nEmployment Type: Part-Time or Full-Time\nSchedule: Flexible Hours\n\nPosition Overview\n\nAn AI education and consulting community serving businesses and entrepreneurs is seeking motivated AI Consultancy Sales Managers to grow its membership.\n\nThis is a flexible, remote sales opportunity focused on connecting with business owners, entrepreneurs, employees, and professionals who are interested in using artificial intelligence to improve their work or business.\n\nMembers receive access to AI consulting, educational content, courses, community resources, career support, and office hours. The Sales Manager will identify prospective members, explain the value of the membership, answer questions, and convert qualified prospects into paying members. Pasted markdown\n\nKey Responsibilities\n\n\tIdentify and develop prospective members through personal networks, referrals, and outbound prospecting.\n\tConnect with business owners, entrepreneurs, professionals, and employees who may benefit from AI education and consulting.\n\tConduct outreach through WhatsApp, LinkedIn, email, phone, and in-person conversations.\n\tLearn about each prospect's business or professional needs and identify ways AI may be useful to them.\n\tClearly explain the membership, resources, consulting services, and benefits available.\n\tAnswer prospective member questions and handle objections professionally and accurately.\n\tFollow up consistently with prospects throughout the sales process.\n\tMaintain organized records of leads, conversations, follow-ups, and conversions using a spreadsheet or CRM.\n\tDevelop a strong understanding of the AI community and its services in order to represent the program confidently.\n\tBuild and maintain a consistent pipeline of prospective members.\n\tRepresent the organization professionally without using aggressive sales tactics or overpromising results.\n\nQualifications\n\n\tStrong sales, communication, and relationship-building abilities.\n\tComfortable initiating conversations with new prospects and consistently following up.\n\tStrong professional written and verbal English communication skills.\n\tHighly organized and capable of managing a large pipeline of prospects.\n\tSelf-motivated and comfortable working independently in a remote environment.\n\tComfortable using AI tools such as ChatGPT or Claude, or motivated to learn AI technology quickly.\n\tAbility to understand business needs and clearly communicate how AI tools and services may provide value.\n\tProfessional, trustworthy, and ethical approach to sales.\n\tPrevious experience in sales, marketing, recruiting, business development, or community building is a strong plus but not required.\n\tExisting professional or community networks that can support business development are a plus."}, {"id": "26819", "title": "Sales Executive", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-29", "exp": "2026-12-30", "desc": "Employment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nA growing wholesale footwear company is seeking a motivated and results-driven Sales Executive to develop new business, open new accounts, and grow existing customer relationships.\n\nThe ideal candidate has previous footwear industry sales experience, understands the wholesale footwear market, and is comfortable prospecting, presenting collections to buyers, and managing accounts throughout the sales process.\n\nThis is an opportunity for a sales professional who combines strong industry knowledge with the drive to develop new business and build long-term customer relationships.\n\nKey Responsibilities\n\nNew Business Development\n\n\tIdentify and develop new wholesale footwear accounts and business opportunities.\n\tProspect and reach out to potential retail and wholesale customers.\n\tBuild relationships with buyers and key decision-makers.\n\tGenerate leads and maintain consistent outreach to prospective accounts.\n\tDevelop opportunities from initial contact through presentation, negotiation, and close.\n\tMaintain an active pipeline of new business opportunities.\n\nAccount Management & Sales\n\n\tManage and grow relationships with existing customers.\n\tIdentify opportunities to increase sales within current accounts.\n\tPresent footwear collections, new products, and seasonal offerings to buyers.\n\tUnderstand customer needs and recommend appropriate products and assortments.\n\tFollow up consistently on leads, opportunities, orders, and customer requests.\n\tWork toward individual sales, account-growth, and revenue goals.\n\tBuild long-term relationships that encourage repeat business.\n\nMarket & Product Knowledge\n\n\tDevelop a strong understanding of the company's footwear collections and product offerings.\n\tStay informed about footwear trends, competitors, pricing, and customer needs.\n\tGather buyer feedback and communicate relevant market information to internal teams.\n\tIdentify emerging sales opportunities within the wholesale footwear market.\n\nInternal Collaboration\n\n\tCoordinate with internal teams to provide strong customer service and account support.\n\tCommunicate customer needs, order information, and sales opportunities to the appropriate departments.\n\tHelp address account questions and resolve issues efficiently.\n\tAttend buyer meetings, trade shows, market appointments, and industry events as needed.\n\nQualifications\n\n\tPrevious footwear industry sales experience required.\n\tStrong understanding of the wholesale footwear market and sales process.\n\tExisting relationships with footwear buyers and retail accounts are a strong plus.\n\tDemonstrated ability to prospect and develop new business.\n\tStrong sales, negotiation, and relationship-building abilities.\n\tExcellent written and verbal communication skills.\n\tStrong presentation skills and confidence working directly with buyers.\n\tExcellent follow-up and organizational abilities.\n\tSelf-motivated, proactive, and results-oriented.\n\tAbility to manage multiple accounts and sales opportunities simultaneously.\n\tComfortable working independently while collaborating with the broader team.\n\tAbility to maintain an organized sales pipeline and consistently work toward revenue goals."}, {"id": "26818", "title": "VP of Sales", "bhTitle": "Sales- Senior Level", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-29", "exp": "2026-12-29", "desc": "Employment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nA growing wholesale footwear company is seeking an experienced Vice President of Sales to lead its sales organization, expand key accounts, and drive continued revenue growth.\n\nThis is a senior leadership position for a proven sales professional with significant footwear industry experience, established retail and wholesale relationships, and a strong track record of developing major accounts.\n\nThe VP of Sales will be responsible for setting the overall sales strategy while remaining actively involved in key customer relationships, new business development, and major sales opportunities.\n\nKey Responsibilities\n\nSales Leadership & Strategy\n\n\tDevelop and execute the company's overall sales strategy to drive revenue and profitable growth.\n\tLead, manage, and support the sales team in achieving company objectives and sales targets.\n\tEstablish sales goals, forecasts, performance expectations, and account strategies.\n\tMonitor individual and team performance and identify opportunities for improvement.\n\tProvide leadership, coaching, and direction to the sales organization.\n\tWork closely with ownership and senior management on long-term growth and business-development strategies.\n\nKey Accounts & Business Development\n\n\tBuild, maintain, and expand relationships with key retail and wholesale footwear accounts.\n\tLeverage existing industry relationships to develop new business opportunities.\n\tIdentify and pursue new retailers, accounts, channels, and strategic partnerships.\n\tManage and grow existing customer relationships.\n\tParticipate directly in major account presentations, negotiations, and sales opportunities.\n\tDevelop strategies to increase account penetration and overall sales volume.\n\tMaintain strong relationships with buyers and key decision-makers.\n\nSales Performance & Market Strategy\n\n\tDevelop accurate sales forecasts and monitor performance against established goals.\n\tAnalyze customer performance, market conditions, competitive activity, and footwear trends.\n\tIdentify opportunities for new products, customers, categories, and distribution channels.\n\tProvide leadership with regular updates regarding sales performance, opportunities, and market developments.\n\tUse sales data and market intelligence to guide account and growth strategies.\n\nCross-Functional Collaboration\n\n\tCollaborate with merchandising, product development, operations, and other departments to support customer needs and sales opportunities.\n\tCommunicate buyer feedback and market trends to internal teams.\n\tPartner with product teams to ensure assortments align with customer and market demand.\n\tCoordinate internally to address account needs, product opportunities, and business challenges.\n\tRepresent the company at customer meetings, trade shows, market appointments, and industry events as needed.\n\nQualifications\n\n\tSignificant footwear industry experience required.\n\tExtensive sales leadership experience within the wholesale footwear industry.\n\tProven track record of growing revenue and developing major retail and wholesale accounts.\n\tStrong existing relationships with footwear buyers, retailers, and wholesale accounts.\n\tDemonstrated experience leading, managing, and motivating a sales team.\n\tStrong background in account management and new business development.\n\tExcellent negotiation, presentation, and relationship-building skills.\n\tStrong understanding of sales forecasting, account planning, pricing, and performance management.\n\tAbility to identify and capitalize on new market and customer opportunities.\n\tStrategic thinker with a hands-on, results-oriented approach.\n\tStrong leadership and decision-making abilities.\n\tExcellent written and verbal communication skills.\n\tAbility to work effectively with ownership, senior management, buyers, and internal departments."}, {"id": "26817", "title": "Personal Assistant & Bookkeeper", "bhTitle": "Assistant", "category": "Accounting & Finance", "type": "Other", "typeNote": "4 Days No Friday", "state": "NY", "added": "2026-09-29", "exp": "2026-12-29", "desc": "Location: Midtown Manhattan, NY – In-Office\nEmployment Type: Part-Time / 4 Days per Week\nSchedule: 4 Days per Week\n\nPosition Overview\n\nA Midtown Manhattan office is seeking an experienced, highly organized, and discreet Personal Assistant & Bookkeeper to provide administrative support while managing bookkeeping and personal financial records.\n\nThis position requires someone with strong QuickBooks and advanced Excel skills, previous bookkeeping experience, and the ability to handle confidential personal and financial information with discretion.\n\nThe ideal candidate is detail-oriented, trustworthy, organized, and comfortable balancing bookkeeping responsibilities with day-to-day personal and administrative support.\n\nKey Responsibilities\n\nBookkeeping & Financial Support\n\n\tManage day-to-day bookkeeping and financial recordkeeping.\n\tMaintain accurate records using QuickBooks.\n\tTrack and categorize income, expenses, payments, and transactions.\n\tPerform account and bank reconciliations.\n\tAssist with accounts payable and accounts receivable as needed.\n\tMaintain and organize personal and business financial records.\n\tCreate and maintain detailed Excel spreadsheets, reports, and financial trackers.\n\tReview financial information for accuracy and identify discrepancies.\n\tOrganize documentation for accountants and other financial professionals as needed.\n\tHandle sensitive personal accounts and financial information with complete confidentiality.\n\nPersonal & Administrative Assistance\n\n\tProvide day-to-day personal and administrative support.\n\tMaintain organized files, records, documents, and correspondence.\n\tAssist with scheduling, follow-ups, and general office responsibilities.\n\tCoordinate payments, documents, and other administrative matters.\n\tTrack outstanding tasks and ensure important items are completed on time.\n\tAssist with special projects and other responsibilities as needed.\n\tMaintain a high level of professionalism and discretion at all times.\n\nQualifications\n\n\tPrevious bookkeeping experience required.\n\tStrong proficiency in QuickBooks required.\n\tAdvanced Microsoft Excel skills required.\n\tPrevious experience as a bookkeeper, personal assistant, administrative assistant, or similar position preferred.\n\tComfortable handling personal accounts and confidential financial information.\n\tExcellent attention to detail and accuracy.\n\tStrong organizational and time-management skills.\n\tAbility to work independently and manage multiple responsibilities.\n\tStrong problem-solving and follow-up skills.\n\tProfessional, dependable, and highly discreet.\n\tStrong written and verbal communication skills.\n\tComfortable working in person in Midtown Manhattan four days per week."}, {"id": "26816", "title": "Babysitter / Nanny – Newborn Care", "bhTitle": "Babysitter/Nanny", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-29", "exp": "2026-12-29", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday–Thursday, 8:00 AM–4:15 PM; Friday, 8:00 AM–1:15 PM\n\nPosition Overview\n\nA family in the Marine Park area of Brooklyn is seeking a loving, reliable, and experienced Babysitter / Nanny to provide attentive care for a newborn.\n\nThe ideal candidate is nurturing, dependable, patient, and experienced with newborns. This position will focus primarily on providing a safe and caring environment for the baby while maintaining feeding, sleep, and daily routines.\n\nKey Responsibilities\n\n\tProvide attentive, loving, and safe care for the newborn throughout the day.\n\tHandle feeding, burping, and diaper changes.\n\tFollow and maintain the baby's established daily routine.\n\tPrepare bottles and properly clean and organize feeding supplies.\n\tFollow and maintain appropriate nap and sleep routines.\n\tEngage the baby in age-appropriate developmental activities, including tummy time, reading, and sensory play.\n\tKeep the baby's areas clean, safe, and organized.\n\tWash and organize bottles, baby clothes, and other baby-related items as needed.\n\tMonitor the baby's comfort and well-being throughout the day.\n\tCommunicate regularly with the family regarding feeding, naps, activities, and the baby's overall day.\n\tPromptly communicate any questions or concerns to the family.\n\nQualifications\n\n\tPrevious newborn or infant childcare experience strongly preferred.\n\tLoving, nurturing, and patient approach to childcare.\n\tReliable and dependable.\n\tComfortable with bottle preparation, feeding, diapering, and newborn routines.\n\tUnderstanding of age-appropriate newborn activities and developmental needs.\n\tStrong communication skills.\n\tOrganized and attentive to detail.\n\tAbility to maintain a safe, clean, and comfortable environment for the baby.\n\tComfortable working in person in Marine Park, Brooklyn."}, {"id": "26815", "title": "Sales Account Executive", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-28", "exp": "2026-12-28", "desc": "Location: New York, NY\nEmployment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nA growing apparel company is seeking an experienced Sales Account Executive with strong industry relationships and a proven background in wholesale apparel sales.\n\nThis role will focus on managing and growing established accounts while also opening new retail accounts and developing new business opportunities. The Sales Account Executive will sell existing line merchandise while working closely with retail buyers and the in-house design team to develop private-label programs tailored to customer needs.\n\nThe ideal candidate is a highly motivated and commercially minded salesperson who understands the apparel market, has established buyer relationships, and can combine strong sales skills with creativity and resourcefulness.\n\nKey Responsibilities\n\nSales & Account Management\n\n\tManage and grow relationships with established retail accounts.\n\tIdentify prospects and open new retail accounts for the company.\n\tPresent and sell men's, women's, and kids' apparel merchandise to retail buyers.\n\tBuild and maintain strong relationships with buyers and other business partners.\n\tIdentify opportunities to expand business within existing accounts.\n\tDevelop a strong understanding of each customer's business, product needs, and pricing requirements.\n\tConsistently pursue new sales and revenue opportunities.\n\nPrivate Label Development\n\n\tWork closely with retail buyers to identify opportunities for private-label programs.\n\tPartner with the in-house design team to develop products based on buyer needs, trends, price points, and retail opportunities.\n\tCommunicate buyer feedback and requirements to internal teams.\n\tHelp develop creative product solutions that meet both customer expectations and company objectives.\n\tFollow private-label opportunities from initial concept through the sales and development process.\n\nPricing & Negotiations\n\n\tNegotiate pricing, terms, discounts, and allowances within established company policies.\n\tUnderstand customer margins and pricing requirements.\n\tApply a strong understanding of retail math, markup, markdowns, margins, and pricing when developing and negotiating business.\n\tTroubleshoot account issues and respond quickly to changing customer needs.\n\tAnticipate potential challenges and proactively develop solutions.\n\nInternal & External Collaboration\n\n\tBuild effective working relationships with internal associates, retail buyers, and outside business partners.\n\tWork closely with design and other internal departments to support customer programs.\n\tCommunicate account opportunities, buyer feedback, and market information to the appropriate teams.\n\tMaintain organized account information, correspondence, pricing, and sales activity.\n\nQualifications\n\n\tMinimum of 5 years of experience in a similar apparel sales position.\n\tEstablished relationships and experience within the apparel retail market strongly preferred.\n\tExperience selling men's, women's, and/or kids' apparel.\n\tExperience working with retail buyers and managing wholesale accounts.\n\tPrivate-label sales and product-development experience strongly preferred.\n\tStrong understanding of retail math, markup, markdowns, margins, pricing, and related concepts.\n\tExcellent verbal, written, presentation, and negotiation skills.\n\tProficiency in Microsoft Outlook and Excel.\n\tHighly organized with excellent attention to detail.\n\tStrong problem-solving and decision-making abilities.\n\tAbility to work independently and respond quickly to changing priorities.\n\tProfessional, personable, flexible, and highly motivated.\n\tAbility to manage multiple accounts and opportunities in a fast-paced environment.\n\tStrong ability to develop productive relationships with buyers, internal teams, and business partners."}, {"id": "26814", "title": "Sales Assistant", "bhTitle": "Sales Assistant", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-28", "exp": "2026-12-28", "desc": "Location: Midtown Manhattan, NY – In-Office\nEmployment Type: Full-Time\nSchedule: Monday–Friday, 9:00 AM–6:00 PM\n\nPosition Overview\n\nA growing wholesale company is seeking an organized and detail-oriented Sales Assistant to work closely with two key members of the sales team.\n\nThis is a hands-on support role involving buyer communication, showroom preparation, order tracking, inventory reporting, samples, line sheets, and coordination with production. The Sales Assistant will play an important role in keeping customer accounts organized and ensuring the sales team has the information and materials needed to successfully manage buyer relationships.\n\nThe position offers strong growth potential, including the opportunity to work directly with customer accounts after becoming familiar with the company, products, and sales processes.\n\nKey Responsibilities\n\nSales & Buyer Support\n\n\tProvide day-to-day support to two key salespeople.\n\tPrepare for buyer and customer showroom appointments.\n\tCommunicate professionally with buyers and their assistants, providing requested product, order, and account information.\n\tComplete and maintain customer item setup forms for purchase order creation.\n\tAssist the sales team with buyer requests and follow-up.\n\tCommunicate buyer requests, product needs, and feedback to the production department.\n\tHelp prepare the sales team for trade shows, buyer meetings, and presentations.\n\nInventory & Order Management\n\n\tRun, review, and understand Inventory ATS (Available-to-Sell) Reports.\n\tReview Open Order Reports against production deliveries.\n\tMonitor orders to help ensure products are delivered according to customer timelines.\n\tIdentify potential delivery issues and communicate updates to the appropriate team members.\n\tAssist with price ticket and UPC information.\n\tMaintain accurate product and customer information.\n\nShowroom & Sample Management\n\n\tMaintain an organized record of samples and packages sent to buyers.\n\tManage and update the company's line sheet system.\n\tOrganize samples and merchandise within the showroom.\n\tEnsure samples and sales materials are prepared for appointments and presentations.\n\tHelp maintain an organized and professional showroom environment.\n\nQualifications\n\n\tPrevious experience in sales support, wholesale, fashion, accessories, merchandising, customer service, or a related environment is preferred.\n\tStrong organizational skills and excellent attention to detail.\n\tComfortable working with reports, spreadsheets, inventory information, and order data.\n\tStrong written and verbal communication skills.\n\tProfessional and comfortable communicating directly with buyers and their assistants.\n\tAbility to manage multiple projects, requests, and deadlines simultaneously.\n\tStrong follow-up skills.\n\tComfortable learning ATS reports, open-order reporting, UPC information, line sheets, and customer item setup processes.\n\tProficiency with Microsoft Excel and other standard office software preferred.\n\tTeam-oriented with the ability to work closely with sales and production departments.\n\tDependable, proactive, and eager to learn.\n\tComfortable working five days per week in the Midtown Manhattan office."}, {"id": "26813", "title": "Sales", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-28", "exp": "2026-12-26", "desc": "Wholesale Sales for International salesperson to South America, Curacao, Panama, and Latin American countries. Apparel, Sportswear, accessories, etc..\nSalesperson can sell to all these countries!"}, {"id": "26812", "title": "Designer", "bhTitle": "Designer", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-28", "exp": "2026-12-31", "desc": "Top Designer for Apparel, Sportswear and Pajamas. Established and growing wholesale comapny."}, {"id": "26811", "title": "Manager", "bhTitle": "Manager", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-28", "exp": "", "desc": "Manager for a wholesale company selling pajamas, accessories, and apparel to set up a Live Selling TikTok and What Not Shop. Wants a leader to manage 6 salespeople. Salary plus commission."}, {"id": "26810", "title": "Sales - LiveSelling", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-28", "exp": "2026-12-31", "desc": "Live Selling: Hiring 5-6 salespeople. Selling sleepwear, shapewear, fashion tops and bottoms, and accessories. Sell on TikTok, Whatnot, and Amazon Live.\nSelling from Showroom Midtown.\nFull Time\nLooking for long-term great salespeople!\n150/ Day"}, {"id": "26809", "title": "Packaging Designer", "bhTitle": "Designer", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-28", "exp": "2026-12-28", "desc": "Employment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nA growing beauty company is seeking an experienced Packaging Designer with a strong background in skincare, cosmetics, personal care, or related beauty products.\n\nThis is a hands-on role for a designer who can take products from initial concept through final production in a fast-paced environment. The Packaging Designer will be responsible for developing compelling packaging concepts, creating production-ready artwork, collaborating with vendors and overseas manufacturers, and ensuring each project successfully balances visual impact, functionality, production requirements, and cost.\n\nThe ideal candidate is commercially minded, highly organized, and capable of taking ownership of multiple projects with minimal direction.\n\nKey Responsibilities\n\nPackaging Design & Creative Development\n\n\tDesign packaging for skincare, body care, cosmetics, personal care, and other beauty products.\n\tDevelop product concepts, positioning, naming, copy, and overall visual direction based on business and product needs.\n\tTranslate creative concepts into commercially viable, retail-ready packaging.\n\tCreate layouts and artwork using provided dielines.\n\tIncorporate product copy, ingredients, claims, specifications, and other required information into packaging designs.\n\tMaintain consistency across product lines while adapting designs to individual product and market needs.\n\tBalance strong visual design with product functionality, production feasibility, and cost considerations.\n\nProduction & Product Development\n\n\tPrepare accurate, production-ready artwork and final files.\n\tReview dielines, specifications, materials, print requirements, and production details.\n\tManage projects from initial concept through sampling, revisions, approvals, and final production.\n\tReview samples and proofs and communicate necessary revisions.\n\tTroubleshoot packaging and production issues as they arise.\n\tEnsure final packaging accurately reflects approved designs and specifications.\n\nVendor & Manufacturer Communication\n\n\tWork directly with vendors and overseas manufacturers throughout the development and production process.\n\tCommunicate packaging specifications, artwork requirements, revisions, and approvals.\n\tCoordinate samples and address production questions or issues.\n\tMaintain clear communication to keep projects moving according to schedule.\n\tIdentify opportunities to improve packaging quality, efficiency, cost, and development processes.\n\nProject Management & Collaboration\n\n\tWork cross-functionally with internal teams to move projects efficiently from concept through production.\n\tManage multiple packaging projects and deadlines simultaneously.\n\tAdapt quickly to changing priorities and evolving business needs.\n\tTake ownership of projects and proactively identify next steps.\n\tMaintain organized artwork, specifications, revisions, and project files.\n\tHelp improve internal design and product-development processes.\n\nQualifications\n\n\t4+ years of professional beauty packaging design experience.\n\tStrong portfolio demonstrating packaging work within skincare, cosmetics, beauty, or personal care.\n\tAdvanced proficiency in Adobe Illustrator and Photoshop.\n\tHands-on experience preparing final artwork for packaging production.\n\tStrong understanding of dielines, packaging materials, formats, printing methods, and production processes.\n\tExperience taking packaging projects from concept through finished production.\n\tExperience communicating directly with vendors and manufacturers.\n\tStrong creative, analytical, and problem-solving abilities.\n\tExcellent attention to detail.\n\tStrong project-management and organizational skills.\n\tAbility to manage multiple projects and deadlines in a fast-paced environment.\n\tComfortable making decisions and moving projects forward with minimal direction.\n\tStrong written and verbal communication skills.\n\tExperience with AI-powered design tools and incorporating AI into the creative workflow is a strong plus.\n\tKorean/English bilingual abilities and experience working with Korean manufacturers are a strong plus."}, {"id": "26808", "title": "Big Box Retail Sales Manager (International)", "bhTitle": "Sales- Mid Level", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-25", "exp": "2026-12-25", "desc": "Location: Flexible\nJob Type: Full time\nSchedule: Monday through Friday\n\nWe are looking for a proven sales professional with real experience placing and growing product lines inside major big box retailers, including Costco, Home Depot, Lowe's, Menards, and their equivalents across the UK, Europe, and other international markets. In this role, you will represent our brand with the professionalism these major accounts demand, driving global growth and building lasting retail partnerships.\n\nKey Responsibilities:\n\n\tBuild and manage high-level relationships with buyers at major big box and wholesale retail chains.\n\n\tDrive new product placements and expand our existing shelf presence across international target markets.\n\n\tNavigate complex retailer onboarding processes, vendor requirements, and negotiations across multiple global regions.\n\n\tRepresent our brand with the top-tier professionalism and strategic execution that major retail accounts demand.\n\nQualifications:\n\n\tProven track record of successfully selling into Costco, Home Depot, Lowe's, Menards, or similar major big box chains.\n\n\tDemonstrated international sales experience across the UK, Europe, or other global markets.\n\n\tStrong relationship-building, communication, and executive-level negotiation skills.\n\n\tA self-starter attitude with the ability to manage major accounts independently and drive results.\n\nWhat We Offer:\n\n\tA key role with significant direct impact on our brand's global market presence.\n\n\tFlexible work environment with international growth exposure."}, {"id": "26807", "title": "Livestream Studio Assistant and Packer", "bhTitle": "Assistant", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-25", "exp": "2026-12-24", "desc": "Location: Midtown Manhattan, New York\nJob Type: Full time\nSchedule: Monday through Friday\n\nWe are looking for a reliable and detail-oriented Livestream Studio Assistant and Packer to support our fast-paced children's wear broadcasting operations in Midtown Manhattan. In this role, you will work side-by-side with our livestream talent and production team to ensure every broadcast runs smoothly. You will handle everything behind the scenes, from prepping and organizing garments before going live to managing sample racks and packing items after broadcasts.\n\nKey Responsibilities:\n\n\tPrepare, organize, and rack children's apparel samples prior to each live broadcast.\n\n\tAssist the livestream host during broadcasts with seamless product handoffs and product inventory tracking.\n\n\tPack, label, and prep featured samples and items following live shopping events.\n\n\tMaintain a clean, organized studio space, keeping sample closets, props, and packing areas orderly.\n\n\tTrack sample inventory coming in and going out of the studio for scheduled streams.\n\nQualifications:\n\n\tPrevious experience in studio support, retail inventory, garment prep, or e-commerce packing preferred.\n\n\tStrong organizational skills and sharp attention to detail in a fast-moving environment.\n\n\tAbility to stay active on your feet and lift up to 30 lbs as needed for studio setup.\n\n\tA reliable, proactive team player who communicates clearly and efficiently.\n\n\tAn interest in fashion, retail, or live commerce operations is a plus.\n\nWhat We Offer:\n\n\tA hands-on role in a vibrant, supportive studio environment in Midtown Manhattan.\n\n\tComprehensive benefits package including health, dental, and vision coverage.\n\n\tPaid time off and company holidays.\n\n\tGenerous employee discounts on all of our children's wear lines.\n\n\tOpportunities for growth within our growing digital production team."}, {"id": "26806", "title": "Livestreamer", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-25", "exp": "2026-12-24", "desc": "Location: Midtown Manhattan, New York\nJob Type: Full time\nSchedule: Monday through Friday\n\nI am looking for an energetic and engaging Livestreamer to join our children's wear manufacturing brand right here in Midtown Manhattan. My team already has all the broadcast systems in place and a fully active studio. I just need the right on camera talent to step in and bring our products to life. You will be the face of our brand, hosting regular live shopping events, showcasing our latest apparel, and interacting with our community in real time.\n\nKey Responsibilities:\n\n\tHost highly engaging and interactive livestream shopping events across our social media platforms and website.\n\n\tShowcase the features, fit, and quality of our children's wear collections to our audience.\n\n\tInteract with viewers in real time, answering questions, and driving sales during live broadcasts.\n\n\tCollaborate with my marketing and production teams to plan the run of show and highlight specific promotions.\n\n\tMaintain high energy, a positive attitude, and a strong brand image throughout all broadcasts.\n\nQualifications:\n\n\tPrevious experience in livestreaming, on camera hosting, or broadcast sales is preferred.\n\n\tA charismatic, confident, and highly articulate on camera presence.\n\n\tAbility to think quickly, improvise, and engage naturally with a live audience.\n\n\tFamiliarity with social media live shopping trends and best practices.\n\n\tA passion for the fashion industry, particularly children's apparel, is a huge plus.\n\nWhat We Offer:\n\n\tA fully equipped, professional broadcast studio ready for you to use from day one.\n\n\tA supportive team to handle the technical production and logistics so you can focus on presenting.\n\n\tComprehensive benefits package including health, dental, and vision coverage.\n\n\tPaid time off and company holidays.\n\n\tGenerous employee discounts on all of our children's wear lines."}, {"id": "26805", "title": "eCommerce Manager", "bhTitle": "ECommerce Manager", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-09-24", "exp": "2026-12-25", "desc": "Location: Hillside, New Jersey\nJob Type: Full-Time\nSchedule: Monday through Friday\n\nWe are seeking an experienced eCommerce Manager to lead the digital operations for our growing electronics arbitrage business based in the Kenilworth, New Jersey area. In this lead position, you will take complete ownership of our online sales channels, driving growth, optimizing listings, and managing the entire profit and loss statement for our eCommerce division. You will oversee everything from product sourcing and market research to paid advertising, search optimization, and performance reporting. If you possess a deep understanding of the online resale landscape and a proven track record of scaling digital storefronts, we want to hear from you.\n\nLead & Develop Team:\n\n\tTrain, mentor, and coach team members.\n\tConduct performance reviews & address performance gaps.\n\tFoster a positive and productive team environment.\n\nDrive E-commerce Success:\n\n\tOptimize product listings across all marketplaces.\n\tManage inventory and pricing strategies.\n\tAnalyze sales data and identify areas for improvement.\n\nProcess Improvement:\n\n\tIdentify and implement process improvements for efficiency and accuracy.\n\tCollaborate with other departments to achieve shared goals\n\nResponsibilities:\n\n\tStrong leadership and communication skills.\n\tExperience in e-commerce operations (listing optimization, inventory management, etc.).\n\tProficiency in data analysis and reporting tools.\n\tAbility to work independently and as part of a team.\n\nQualifications:\n\n\tManage daily team operations and performance.\n\tAnalyze key performance indicators (KPIs) and report on team progress.\n\tEnsure compliance with all company policies and procedures."}, {"id": "26804", "title": "HR Coordinator", "bhTitle": "Coordinator", "category": "HR, Management & Fundraising", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-24", "exp": "2026-12-24", "desc": "Location: Williamsburg, Brooklyn, NY – In-Person\nEmployment Type: Full-Time\nSchedule: Monday–Friday, 9:00 AM–5:00 PM\nTransportation: Shuttle from Crown Heights Provided\n\nPosition Overview\n\nA growing organization is seeking an organized, personable, and detail-oriented HR Coordinator to support the employee onboarding process.\n\nThe HR Coordinator will serve as a primary point of contact for new hires, guiding them through each stage of onboarding and ensuring all required paperwork, documentation, and steps are completed accurately and on time.\n\nNo prior HR experience is required. This is a great opportunity for someone with strong communication and organizational skills who enjoys working with people, following up, and keeping multiple processes moving forward.\n\nKey Responsibilities\n\n\tGuide new hires through each step of the onboarding process.\n\tServe as a main point of contact for new employees throughout onboarding.\n\tExplain onboarding requirements and next steps clearly.\n\tFollow up on outstanding paperwork, documentation, and incomplete requirements.\n\tTrack document completion and onboarding progress for multiple new hires simultaneously.\n\tCommunicate with new hires through phone, text, and email.\n\tAnswer questions and provide assistance throughout the onboarding process.\n\tTroubleshoot onboarding issues and help resolve delays or missing information.\n\tMaintain accurate and organized employee and onboarding records.\n\tUpdate internal systems with current onboarding information and status changes.\n\tCoordinate with internal departments to ensure new hires complete all necessary requirements.\n\tIdentify potential delays and proactively follow up to keep the onboarding process moving.\n\tMaintain professional and consistent communication with new hires.\n\tEnsure sensitive employee information is handled appropriately and confidentially.\n\nQualifications\n\n\tNo previous HR experience required.\n\tExcellent written and verbal communication skills.\n\tStrong interpersonal and relationship-building abilities.\n\tHighly organized with excellent attention to detail.\n\tStrong follow-up skills and ability to keep processes moving forward.\n\tComfortable communicating frequently by phone, text, and email.\n\tAbility to manage multiple new hires and onboarding cases simultaneously.\n\tComfortable learning new systems and processes.\n\tStrong problem-solving abilities.\n\tDependable, proactive, and able to take ownership of assigned responsibilities.\n\tAbility to maintain confidentiality when handling employee information.\n\tComfortable working in a fast-paced environment.\n\tAbility to work in person in Williamsburg, Brooklyn."}, {"id": "26803", "title": "Patient Enrollment Specialist", "bhTitle": "Sales- Mid Level", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-24", "exp": "2026-12-24", "desc": "Location: Williamsburg, Brooklyn, NY – In-Person\nEmployment Type: Full-Time\nSchedule: Monday–Friday, 9:00 AM–5:00 PM\nTransportation: Shuttle from Crown Heights Provided\n\nPosition Overview\n\nA growing healthcare organization is seeking a motivated and results-driven Patient Enrollment Specialist to help prospective patients and families get started with care.\n\nThis role combines phone sales, relationship building, patient intake, and enrollment coordination. The Patient Enrollment Specialist will speak with prospective patients and families, explain available services, convert qualified leads into enrolled clients, and guide them through each step of the intake and onboarding process.\n\nThe ideal candidate is a strong phone salesperson who is goal-oriented, organized, persuasive, and committed to providing an excellent experience from the first conversation through successful enrollment.\n\nKey Responsibilities\n\nPatient Outreach & Sales\n\n\tSpeak with prospective patients and families about available services.\n\tRespond to incoming leads and conduct consistent follow-up.\n\tBuild relationships with prospective patients and understand their individual needs.\n\tClearly explain services, enrollment requirements, and next steps.\n\tConvert qualified leads into successfully enrolled clients.\n\tAddress questions and concerns that may arise during the enrollment process.\n\tMaintain consistent communication with prospective patients and families.\n\tWork toward individual enrollment and performance goals.\n\nIntake & Enrollment\n\n\tGuide patients and families through the intake and onboarding process from beginning to end.\n\tAssist with collecting necessary information and documentation.\n\tEnsure enrollment requirements are completed accurately and efficiently.\n\tTrack each prospective patient through the enrollment pipeline.\n\tFollow up on incomplete information or outstanding enrollment requirements.\n\tMaintain accurate and organized patient and lead records.\n\nCare Coordination\n\n\tCoordinate with care, staffing, and internal teams to ensure a smooth transition from enrollment to services.\n\tCommunicate important patient information to the appropriate team members.\n\tHelp prevent delays by proactively identifying and addressing enrollment issues.\n\tMaintain ownership of each enrollment until the patient is successfully transitioned to the appropriate care team.\n\nQualifications\n\n\tStrong phone sales and lead-conversion skills.\n\tExcellent verbal and written communication abilities.\n\tConfident and comfortable speaking with prospective patients and families by phone.\n\tGoal-driven and motivated by achieving enrollment and performance targets.\n\tStrong relationship-building and interpersonal skills.\n\tExcellent follow-up and organizational abilities.\n\tAbility to manage multiple leads and prospective patients simultaneously.\n\tPersistent, proactive, and solutions-oriented.\n\tStrong attention to detail.\n\tComfortable working in a fast-paced environment.\n\tAbility to work in person in Williamsburg, Brooklyn.\n\tPrevious experience in sales, enrollment, intake, customer service, healthcare, or a related role is preferred."}, {"id": "26802", "title": "Patient Outreach Coordinator", "bhTitle": "Coordinator", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-24", "exp": "2026-12-24", "desc": "Location: Williamsburg, Brooklyn, NY – In-Person\nEmployment Type: Full-Time\nSchedule: Monday–Friday, 9:00 AM–5:00 PM\n\nPosition Overview\n\nA growing healthcare organization is seeking a personable, persistent, and solutions-oriented Patient Outreach Coordinator to work directly with patients and families whose care has been paused, interrupted, or may be at risk.\n\nThis is not a typical desk-based administrative role. The position is centered around real conversations, relationship building, problem-solving, and consistent follow-up. The Patient Outreach Coordinator will identify what is preventing a patient from receiving care, work with the appropriate internal teams to address the issue, and remain involved until the case is fully resolved.\n\nNo healthcare experience is required. The ideal candidate is an excellent communicator who enjoys working with people, solving problems, and taking ownership of situations from beginning to end.\n\nKey Responsibilities\n\n\tContact patients and families whose care has been paused, interrupted, or may be at risk.\n\tIdentify the underlying reason a patient is experiencing difficulty receiving services.\n\tHave thoughtful and productive conversations with patients and families to understand their concerns.\n\tBuild trust and maintain positive relationships with patients and their families.\n\tWork closely with staffing and clinical teams to identify practical solutions.\n\tAddress concerns and help remove obstacles preventing patients from receiving consistent care.\n\tTake ownership of assigned cases from the initial outreach through final resolution.\n\tFollow up consistently with patients, families, and internal teams until each issue is resolved.\n\tMaintain accurate records of conversations, follow-ups, case updates, and resolutions.\n\tManage multiple active cases and prioritize urgent situations appropriately.\n\tEscalate complex or time-sensitive concerns to the appropriate team members when necessary.\n\tKeep patients and families informed throughout the resolution process.\n\tHelp create a positive patient experience through responsiveness, professionalism, and consistent communication.\n\nQualifications\n\n\tNo previous healthcare experience required.\n\tExcellent verbal and written communication skills.\n\tStrong interpersonal and relationship-building abilities.\n\tComfortable speaking with patients and families by phone.\n\tPersistent and willing to follow up consistently until an issue is resolved.\n\tStrong problem-solving skills and ability to think quickly.\n\tAbility to navigate challenging conversations professionally and respectfully.\n\tHighly organized with strong attention to detail.\n\tAble to manage multiple cases and follow-ups simultaneously.\n\tSelf-motivated and comfortable taking ownership of assigned cases.\n\tPatient, dependable, and solutions-oriented.\n\tGenuine interest in helping people and improving their experience.\n\tComfortable working in person in Williamsburg, Brooklyn."}, {"id": "26801", "title": "Case Manager", "bhTitle": "Case Manager", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-24", "exp": "2026-12-24", "desc": "Location: Williamsburg, Brooklyn, NY – In-Person\nEmployment Type: Full-Time\nSchedule: Monday–Friday, 9:00 AM–5:00 PM\n\nPosition Overview\n\nA growing healthcare organization is seeking an organized and proactive Case Manager to manage a caseload of patients and coordinate caregiver placement and scheduling.\n\nThe Case Manager will work closely with patients, families, and caregivers to ensure each case is appropriately staffed and that day-to-day scheduling needs are handled efficiently. This position requires someone who can communicate effectively, think quickly, stay organized, and respond to last-minute staffing changes in a fast-paced environment.\n\nKey Responsibilities\n\n\tManage an assigned caseload of patients and their ongoing caregiver needs.\n\tMatch caregivers with patients based on each family's specific needs, preferences, and scheduling requirements.\n\tCoordinate schedules between patients, families, and caregivers.\n\tQuickly re-staff cases when caregivers cancel or become unavailable.\n\tIdentify available caregivers and fill open shifts as efficiently as possible.\n\tMaintain regular communication with patients, families, and caregivers.\n\tRespond to scheduling changes, call-outs, and other time-sensitive issues.\n\tFollow up with families to ensure appropriate caregiver coverage.\n\tBuild positive working relationships with caregivers and families.\n\tMaintain accurate records of case assignments, schedules, changes, and communications.\n\tKeep internal systems updated with current patient and caregiver information.\n\tWork closely with internal teams to resolve staffing and scheduling challenges.\n\tEscalate complex case issues to management when necessary.\n\tHelp ensure continuity of care by minimizing gaps in caregiver coverage.\n\tManage multiple cases and priorities while maintaining a high level of professionalism and responsiveness.\n\nQualifications\n\n\tPrevious experience in case management, home care, healthcare staffing, scheduling, coordination, or a related role preferred.\n\tStrong verbal and written communication skills.\n\tExcellent organizational and time-management abilities.\n\tAbility to manage multiple patients, caregivers, and schedules simultaneously.\n\tStrong problem-solving skills and ability to think quickly when unexpected staffing issues arise.\n\tComfortable making and receiving frequent phone calls.\n\tStrong follow-up skills and attention to detail.\n\tAbility to remain calm and professional in a fast-paced environment.\n\tDependable, proactive, and highly responsive.\n\tComfortable working in person in Williamsburg, Brooklyn.\n\tBasic computer skills and ability to learn scheduling, CRM, or case-management systems."}, {"id": "26800", "title": "Customer Support Specialist", "bhTitle": "Customer Service", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-24", "exp": "2026-12-24", "desc": "Location: Brooklyn, NY – In-Office\nEmployment Type: Full-Time\n\nPosition Overview\n\nA growing payments technology company serving retailers is seeking a Merchant Support Specialist to be the first point of contact for its merchant customers.\n\nThis is a hands-on customer support and operations role focused on answering merchant questions, troubleshooting issues, managing follow-ups, and ensuring customers have a smooth experience using the platform. The Merchant Support Specialist will also assist newly onboarded merchants as they transition into ongoing support and work closely with product, development, and sales teams to resolve issues efficiently.\n\nThe ideal candidate is an excellent communicator who is patient, organized, tech-savvy, and solutions-oriented. This person should enjoy helping customers, learning new technology, and taking ownership of issues through resolution.\n\nKey Responsibilities\n\nMerchant Support\n\n\tServe as the first point of contact for merchants seeking assistance.\n\tRespond to merchant questions and support requests through phone, email, and chat.\n\tTroubleshoot and resolve day-to-day platform, account, and payment-related issues.\n\tProvide clear explanations and guidance to merchants who may not have a technical background.\n\tMaintain a warm, professional, and helpful approach during every customer interaction.\n\tFollow up with merchants to ensure issues are fully resolved.\n\nIssue Management & Troubleshooting\n\n\tTrack, document, and prioritize merchant issues.\n\tTroubleshoot problems and identify appropriate solutions.\n\tEscalate technical or complex issues to product or development teams when necessary.\n\tCoordinate internally to ensure escalated issues are addressed and communicated back to merchants.\n\tIdentify recurring merchant issues and share feedback with internal teams.\n\tMaintain ownership of support requests from initial contact through resolution.\n\nMerchant Onboarding & Account Support\n\n\tSupport newly onboarded merchants as they transition into regular platform usage.\n\tAssist with merchant account handoffs between sales, development, and support.\n\tHelp manage trial accounts and follow up with merchants as needed.\n\tAssist with billing details and routine account-related questions.\n\tHelp ensure merchant information and account records remain accurate and up to date.\n\nDocumentation & Systems\n\n\tMaintain accurate support and CRM records.\n\tDocument merchant conversations, issues, resolutions, and follow-up activity.\n\tCreate and maintain help center articles, FAQs, and support documentation.\n\tDevelop resources that allow merchants to quickly answer common questions and self-serve.\n\tKeep internal support documentation current as products and processes change.\n\nQualifications\n\n\tExcellent written and verbal communication skills.\n\tStrong customer service and interpersonal abilities.\n\tComfortable communicating with customers by phone, email, and chat.\n\tAbility to quickly learn new software and technology.\n\tComfortable explaining technical information clearly to non-technical users.\n\tHighly organized and capable of managing multiple merchant accounts, issues, and follow-ups simultaneously.\n\tStrong problem-solving and troubleshooting abilities.\n\tCalm and patient when handling customer questions or problems.\n\tStrong attention to detail and follow-through.\n\tComfortable working independently and taking ownership of customer issues.\n\tAble to work in-office in Brooklyn, NY.\n\tExperience in customer support, merchant services, operations, or a related role is preferred."}, {"id": "26799", "title": "Job Title: Wholesale Sales Associate", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NJ", "added": "2026-09-24", "exp": "2026-12-15", "desc": "Location: Linden or Long Branch, New Jersey\nJob Type: FT/PT\nSchedule: Monday-Friday\n\nAre you a driven, young professional looking to launch a rewarding sales career? We are a dynamic wholesale company with a unique opportunity for individuals ready to learn and grow. We specialize in acquiring a vast array of closeout products from major online retailers and selling them at highly discounted prices. We are expanding rapidly, with new offices and a capacity for over 100 new team members. This is more than just a job; it's a comprehensive training program designed to equip you with essential, lifelong skills in communication, sales, and business.\n\nKey Responsibilities:\n\n\tGenerate new sales leads and prospect for clients using our proven methods.\n\n\tEngage in both written and verbal communication to build and maintain customer relationships.\n\n\tLearn and apply ethical salesmanship and pricing strategies.\n\n\tManage the sales process from initial contact to closing the deal.\n\n\tParticipate in professional development and training sessions.\n\nQualifications:\n\n\tA strong desire to learn and grow in a fast-paced sales environment.\n\n\tExcellent communication skills, both written and verbal.\n\n\tSelf-motivated with a proactive and ethical approach to sales.\n\n\tNo prior sales experience is required; we provide all the necessary training.\n\nWhat We Offer:\n\n\tA comprehensive training program covering sales, communication, and business skills.\n\n\tThe opportunity to sell a wide range of tangible, high-demand products.\n\n\tA supportive and collaborative work environment focused on personal and professional development.\n\n\tWeekly classes led by a community leader, daily Minyanim."}, {"id": "26796", "title": "Product Development", "bhTitle": "Product Development", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-24", "exp": "2026-12-24", "desc": "Location: Midtown Manhattan, NY – On-Site\nEmployment Type: Full-Time\nPortfolio Required\nFitness and/or Accessories Experience Preferred\n\nPosition Overview\n\nA fashion-forward fitness and accessories company is seeking an experienced Product Development professional to join its team. The company designs and manufactures trend-driven yoga, fitness, beauty, and women's lifestyle accessories for the retail market.\n\nThe ideal candidate has an exceptional eye for design, strong attention to detail, and the ability to identify emerging trends and translate them into fashionable, commercially viable products.\n\nThis is a hands-on role that combines design, product development, factory communication, and collaboration with the sales team and retail buyers. You will help take products from initial concept through development and production while ensuring designs meet both the company's aesthetic and the needs of its customers.\n\nKey Responsibilities\n\n• Research fashion, fitness, lifestyle, color, print, and accessory trends and translate them into new product concepts.\n\n• Create CADs, line sheets, presentations, and detailed specifications for factories.\n\n• Develop products from initial concept through sampling and production.\n\n• Communicate directly with factories regarding product development, specifications, revisions, sample approvals, and inventory management.\n\n• Review and approve samples to ensure design intent, quality, color, materials, and construction are accurately executed.\n\n• Partner closely with the Sales Division and its buyers to understand customer needs and develop products tailored to specific retail opportunities.\n\n• Assist in interpreting buyer feedback and translating requests into commercially viable product designs.\n\n• Support packaging design and development as needed.\n\n• Assist with product photography, image retouching, and other visual content.\n\n• Contribute creative copy and design assets for marketing and sales materials.\n\n• Maintain organized design files, specifications, product information, and development timelines.\n\nQualifications\n\n• Product development experience, 3+ years, preferably within fitness, accessories, beauty, fashion, or women's lifestyle products.\n\n• Strong portfolio demonstrating excellent design sensibility and relevant product-development work.\n\n• Proficiency in Adobe Illustrator and Photoshop; broader Adobe Creative Cloud experience required.\n\n• Proficiency with Microsoft Office Suite.\n\n• Experience in creating CADs, line sheets, technical specifications, and factory-ready artwork.\n\n• Experience communicating with overseas factories and managing product development and sample approvals.\n\n• Packaging design, product photography, photo retouching, and creative copywriting experience preferred.\n\n• Shopify, Klaviyo, and social media experience are a plus.\n\n• Strong analytical and problem-solving capabilities.\n\n• Excellent attention to detail and pride in producing high-quality work.\n\n• Proactive, organized, highly motivated, and energetic.\n\n• Professional and positive attitude with strong written and verbal communication skills.\n\n• Ability to self-manage, prioritize multiple projects, and work both independently and collaboratively within a small team.\n\n• Strong understanding of current fashion and consumer trends with the ability to balance creativity with commercial needs.\n\nWork Environment\n\nThis is a full-time, on-site position in the company's Midtown Manhattan showroom. The ideal candidate will enjoy working in a fast-moving, entrepreneurial environment where design, product development, sales, and customer needs are closely connected.\n\nPortfolio submission is required for consideration."}, {"id": "26795", "title": "Automobile Warranty Sales Representative", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-09-23", "exp": "2026-12-23", "desc": "Location: Colts Neck, NJ\nJob Type: Full-time\nSchedule: In-office, Monday through Friday\n\nWe are seeking a motivated, driven Automobile Warranty Sales Representative to join our growing team in Colts Neck, NJ. In this role, you will handle a balanced mix of inbound leads, warm outbound calls, and dedicated customer service to help vehicle owners secure reliable extended coverage options.\n\nIf you thrive in a phone-based sales environment, enjoy educating clients on valuable protection products, and want an opportunity where your earning potential directly reflects your performance, we want to hear from you.\n\nKey Responsibilities:\n\n\tEngage with potential customers through a combination of warm outbound calls and incoming high-intent leads.\n\n\tGuide vehicle owners through available extended warranty and service contract options tailored to their specific needs.\n\n\tProvide exceptional customer service by answering questions, addressing concerns, and maintaining high satisfaction throughout the sales process.\n\n\tFollow up with prospect pipelines consistently to close sales and drive revenue.\n\n\tAccurately track, manage, and report daily sales activities and customer records within our CRM system.\n\nQualifications:\n\n\tPrior experience in a call center, telesales, or inside sales environment is strongly preferred.\n\n\tExperience in autom
