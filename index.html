lyn, NY is seeking a warm, compassionate, and highly organized Patient Coordinator to join its team. This position serves as an important connection between patients, the intake team, clinical providers, and outside agencies, helping ensure that each patient receives a seamless and supportive experience throughout their care.\n\nThe ideal candidate combines excellent administrative skills with an emotionally attuned approach to customer service. This person should be comfortable communicating with patients who may be navigating sensitive or stressful circumstances while maintaining professionalism, confidentiality, and careful follow-through.\n\nKey Responsibilities\n\n\tServe as a primary point of contact for patients throughout their experience with the practice.\n\tProvide warm, compassionate, and professional assistance to patients and families.\n\tCoordinate communication between the intake team, clinical care team, patients, and outside agencies as needed.\n\tAssist patients with scheduling, appointments, paperwork, and general questions.\n\tFollow up with patients to ensure outstanding administrative matters are addressed promptly.\n\tMaintain accurate and organized patient records and documentation.\n\tCommunicate important patient information to appropriate clinical and administrative team members.\n\tCoordinate with outside providers, agencies, and other professionals when necessary.\n\tHandle incoming phone calls, emails, and patient inquiries professionally and efficiently.\n\tSupport patient scheduling and help resolve appointment-related issues.\n\tMaintain appropriate confidentiality and follow HIPAA requirements when handling protected health information.\n\tTrack outstanding requests, documentation, and follow-up items to ensure completion.\n\tAssist the intake and clinical teams with administrative responsibilities as needed.\n\tHelp create a welcoming, respectful, and supportive experience for every patient.\n\nQualifications\n\n\tPrevious experience working in a therapy practice, medical office, behavioral health practice, or similar healthcare setting is strongly preferred.\n\tKnowledge of HIPAA requirements and patient confidentiality practices.\n\tExcellent interpersonal and customer service skills.\n\tWarm, compassionate, patient, and emotionally attuned communication style.\n\tStrong administrative and organizational abilities.\n\tExceptional attention to detail and follow-through.\n\tAbility to communicate professionally with patients, clinicians, families, and outside organizations.\n\tComfortable handling sensitive and confidential information.\n\tAbility to manage multiple responsibilities in a busy healthcare environment.\n\tStrong phone, email, and written communication skills.\n\tProficiency with computers, scheduling systems, and electronic records platforms.\n\tSpanish-speaking is a significant plus."}, {"id": "26606", "title": "Senior Development Assistant", "bhTitle": "Senior Development Assistant", "category": "HR, Management & Fundraising", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-11", "exp": "2026-12-11", "desc": "Location: New York, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA leading nonprofit organization in New York City is seeking a highly organized, detail-oriented Senior Development Assistant to provide essential administrative, fundraising, and research support to senior members of its philanthropic leadership team.\n\nThis position plays an important role in supporting major donor engagement, fundraising initiatives, events, and development operations. The ideal candidate is professional, proactive, comfortable interacting with senior leadership and donors, and capable of managing multiple priorities in a fast-paced environment.\n\nKey Responsibilities\n\n\tProvide administrative and project support to senior development professionals.\n\tNavigate and maintain a sophisticated donor database, ensuring accurate and current donor information.\n\tGenerate gift reports, donor reports, solicitation materials, and other development-related documentation.\n\tSupport senior staff with major donor solicitations, engagement initiatives, and relationship management.\n\tResearch prospective donors and maintain tracking documents for donor cultivation and engagement strategies.\n\tAssist with the preparation of fundraising and solicitation materials.\n\tProcess gifts and prepare related paperwork and documentation.\n\tMaintain shared inboxes and respond to donor requests and inquiries in a timely and professional manner.\n\tTrack event attendance and communicate with donors regarding RSVPs, event details, and additional information.\n\tCoordinate calendars, schedule meetings, answer phones, and provide day-to-day administrative support.\n\tPrepare materials and logistics for internal meetings, donor meetings, events, and site visits.\n\tDocument donor meetings and significant correspondence to maintain accurate records of engagement activity.\n\tAssist with mailings, filing, photocopying, correspondence, and other administrative responsibilities.\n\tBuild strong working relationships across departments to ensure projects and requests are completed efficiently.\n\tSupport team-wide fundraising and development projects as needed.\n\nEvents & Donor Engagement\n\n\tAssist with the planning and execution of fundraising, volunteer, and donor engagement events.\n\tProvide on-site support for events and programs as needed.\n\tCoordinate event logistics, materials, attendance information, and donor communications.\n\tSupport donor stewardship and engagement initiatives throughout the year.\n\tMaintain a high level of professionalism when communicating with major donors and organizational leadership.\n\tBe available for occasional events or programs outside of standard business hours.\n\nQualifications\n\n\tBachelor's degree required.\n\tPrevious administrative, development, fundraising, nonprofit, or related professional experience preferred.\n\tStrong proficiency in Microsoft Office Suite, including Excel, Word, and PowerPoint.\n\tComfortable learning and working with donor databases and other technology platforms.\n\tExcellent organizational and project management skills.\n\tStrong written and verbal communication abilities.\n\tExceptional attention to detail and accuracy.\n\tAbility to prioritize and manage multiple responsibilities in a fast-paced environment.\n\tConfident working independently while also collaborating effectively as part of a team.\n\tProfessional and comfortable supporting senior staff and interacting with donors.\n\tStrong interpersonal skills and a positive, solutions-oriented work ethic.\n\tAbility to handle sensitive and confidential donor information with discretion.\n\tFlexibility to occasionally work outside standard business hours for events and programs."}, {"id": "26605", "title": "Audio Visual Technician", "bhTitle": "Audio Visual Technician", "category": "Technology & IT", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-11", "exp": "2026-12-11", "desc": "Location: New York, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA leading nonprofit organization in New York City is seeking an experienced, hands-on Audio Visual Technician to provide day-to-day audiovisual support for conference centers, meeting rooms, executive events, and special programs.\n\nThis is a hands-on technical position requiring strong audiovisual expertise combined with exceptional customer service. The Audio Visual Technician will regularly support senior executives, board members, donors, VIP guests, employees, and external visitors and must maintain professionalism while responding quickly and effectively in high-profile environments.\n\nThe standard schedule for this position is 11:00 AM–7:00 PM. Flexibility is essential, as occasional early mornings, later evenings, and Sundays may be required based on meetings, events, and organizational needs. Reliability and punctuality are critical.\n\nKey Responsibilities\n\n\tProvide daily audiovisual support for conference rooms, executive meetings, presentations, town halls, and special events.\n\tSet up, test, operate, monitor, and break down audiovisual equipment for meetings and events.\n\tDeliver professional, white-glove technical support to senior executives, board members, donors, VIP guests, and other meeting participants.\n\tConsult with meeting organizers to understand technical requirements and recommend appropriate audiovisual solutions.\n\tOperate and support videoconferencing and collaboration platforms, including Zoom and Microsoft Teams.\n\tTroubleshoot audiovisual equipment, videoconferencing systems, networking connections, and room-control systems during live meetings and events.\n\tSupport projection systems, monitors, audio mixing boards, microphones, displays, and other AV equipment.\n\tPerform routine equipment maintenance and coordinate repairs or replacements when necessary.\n\tRespond promptly to AV service requests and technical support tickets.\n\tTest conference rooms and equipment before important meetings and events to ensure systems are functioning properly.\n\tAssist with recording, editing, and preparing video content as needed.\n\tMaintain organized AV equipment, cables, accessories, and technical supplies.\n\tMove, install, and configure audiovisual equipment as required.\n\tMaintain a professional, calm, and solutions-oriented approach when addressing technical issues during high-profile events.\n\nQualifications\n\n\tCollege degree in a related field and 3–5 years of audiovisual support experience in a corporate or professional environment, or an equivalent combination of professional AV experience and technical training.\n\tStrong hands-on audiovisual troubleshooting and technical support skills.\n\tExperience with projection systems, monitors, audio mixing boards, wireless microphones, display resolutions, and AV cabling.\n\tExperience supporting Zoom, Microsoft Teams, and other enterprise collaboration platforms.\n\tWorking knowledge of video editing software such as Adobe Premiere Pro or Final Cut Pro.\n\tProficiency with Microsoft Office and Microsoft Windows.\n\tBasic familiarity with Mac operating systems.\n\tBasic understanding of networking fundamentals and videoconferencing technologies.\n\tExcellent verbal, written, and interpersonal communication skills.\n\tStrong customer-service skills with the ability to provide professional, white-glove support.\n\tAbility to multitask, prioritize competing requests, and remain calm under pressure.\n\tHighly dependable, punctual, organized, and detail-oriented.\n\tAbility to work independently while collaborating effectively with internal teams.\n\tMust be flexible to occasionally work mornings, evenings, or Sundays based on event needs."}, {"id": "26599", "title": "Full-Time Babysitter", "bhTitle": "Babysitter/Nanny", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-11", "exp": "", "desc": "Location: Brooklyn, NY\nStart Date: September 2026\nSchedule: Monday–Friday, 8:00 AM–4:00 PM\n\nAbout the Position\n\nA family in Brooklyn is seeking a caring, responsible, and experienced full-time babysitter to care for two young children—a 12-month-old and a 2-month-old.\n\nResponsibilities\n\n\tProvide attentive and loving care for both children throughout the day.\n\tEnsure the children are safe, comfortable, and well cared for.\n\tAssist with the daily needs and routines of the children.\n\tProvide age-appropriate attention and care for an infant and young toddler.\n\tMaintain a patient, calm, and nurturing environment.\n\nQualifications\n\n\tPrevious babysitting or childcare experience is required.\n\tMust be caring, patient, responsible, and understanding.\n\tExperience caring for infants and young toddlers is preferred.\n\tMust be comfortable caring for two young children simultaneously."}, {"id": "26598", "title": "Warehouse Manager", "bhTitle": "Warehouse Manager", "category": "Warehouse, Driving & Logistics", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-08-11", "exp": "2026-11-11", "desc": "Location: Linden, NJ\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nWe are seeking an experienced, hands-on Warehouse Manager to oversee all aspects of warehouse operations, including receiving, inventory control, order fulfillment, shipping, logistics, and staff management.\n\nThe ideal candidate is a strong operational leader who understands how to run an organized, high-volume warehouse while maintaining exceptional inventory accuracy and shipping performance. This individual will be responsible for establishing efficient processes, managing and holding warehouse staff accountable, coordinating domestic and international shipments, and ensuring merchandise moves accurately from receiving through final delivery.\n\nKey Responsibilities\n\nReceiving & Inbound Shipments\n\n\tManage incoming containers, trucks, and other deliveries.\n\tVerify quantities, SKUs, and merchandise against packing lists and purchase orders.\n\tIdentify and document shortages, overages, damages, and other receiving discrepancies.\n\tEnsure incoming merchandise is received accurately and promptly entered into warehouse systems.\n\tCoordinate unloading and proper placement of incoming inventory.\n\nInventory Control\n\n\tMaintain accurate physical and system inventory across the warehouse.\n\tEstablish and oversee regular cycle counts and physical inventories.\n\tInvestigate and resolve inventory discrepancies, shortages, overages, and misplaced merchandise.\n\tMaintain accurate SKU and bin locations throughout the facility.\n\tDevelop processes that improve inventory accuracy and reduce shrinkage.\n\nOrder Fulfillment & Shipping\n\n\tOversee the complete order fulfillment process from picking through shipment.\n\tEnsure customer orders are picked, packed, labeled, palletized, and shipped accurately and on schedule.\n\tMonitor order accuracy and resolve fulfillment issues before shipments leave the warehouse.\n\tCoordinate parcel, LTL, FTL, and export shipments as applicable.\n\tEnsure shipping documentation is complete and accurate.\n\nImport, Export & Logistics\n\n\tCoordinate with freight forwarders, customs brokers, trucking companies, carriers, and internal departments.\n\tReview commercial invoices, packing lists, bills of lading, country-of-origin information, and other shipping documentation.\n\tSchedule pickups, deliveries, loading, and unloading.\n\tMonitor freight activity and proactively address delays or transportation issues.\n\tHelp control freight, detention, storage, and other logistics-related costs.\n\tEnsure import and export processes are properly documented and coordinated.\n\nWarehouse Staff Management\n\n\tHire, train, supervise, and develop warehouse employees.\n\tAssign daily responsibilities and establish clear productivity expectations.\n\tMonitor employee performance, attendance, accuracy, and efficiency.\n\tManage scheduling and overtime based on operational needs.\n\tHold team members accountable for shipping accuracy, inventory handling, productivity, and workplace standards.\n\tCreate a professional, organized, and results-driven warehouse culture.\n\nWarehouse Organization & Loss Prevention\n\n\tMaintain efficient SKU, rack, shelf, and bin organization.\n\tEnsure merchandise can be located, picked, and replenished quickly.\n\tEstablish procedures to reduce lost merchandise, inventory shrinkage, shipping errors, and product damage.\n\tContinuously evaluate warehouse layout and processes to improve efficiency.\n\tMaintain clean, organized receiving, storage, picking, packing, and shipping areas.\n\nSafety & Compliance\n\n\tMaintain a clean, safe, and professional warehouse environment.\n\tEnforce proper forklift and material-handling procedures.\n\tEnsure employees follow established workplace safety practices.\n\tMaintain compliance with applicable OSHA requirements and shipping procedures.\n\tAddress potential safety issues promptly and maintain appropriate operational documentation.\n\nReporting & Performance\n\n\tTrack key warehouse performance indicators, including receiving accuracy, inventory accuracy, order accuracy, on-time shipping, productivity, damages, returns, and freight issues.\n\tPrepare operational reports and communicate significant issues to management.\n\tIdentify recurring problems and implement corrective action.\n\tDevelop processes and accountability measures that improve warehouse performance.\n\tWork closely with management to support continued operational growth."}, {"id": "26597", "title": "Warehouse Picker / Packer", "bhTitle": "Warehouse-Picker/Packer", "category": "Warehouse, Driving & Logistics", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-08-11", "exp": "2026-11-11", "desc": "Location: Linden, NJ\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA warehouse in Linden, NJ is seeking a dependable and hardworking Warehouse Picker / Packer to join its team. This is a hands-on position responsible for accurately picking, packing, organizing, and preparing customer orders for shipment.\n\nThe ideal candidate is reliable, physically capable of lifting and carrying boxes throughout the workday, and comfortable working in a fast-paced warehouse environment.\n\nKey Responsibilities\n\n\tPick products and merchandise accurately according to customer orders.\n\tPack orders securely and prepare packages for shipment.\n\tLift, carry, move, and organize boxes and merchandise throughout the warehouse.\n\tVerify products, quantities, and order information before packing and shipping.\n\tLabel and organize packages for outgoing shipments.\n\tAssist with loading and unloading deliveries as needed.\n\tReceive incoming merchandise and place products in designated warehouse locations.\n\tMaintain accurate inventory and report missing, damaged, or incorrect merchandise.\n\tKeep warehouse shelves, workstations, and packing areas clean and organized.\n\tFollow established warehouse procedures and workplace safety guidelines.\n\tAssist with general warehouse responsibilities as needed.\n\nQualifications\n\n\tMust be physically capable of lifting and carrying boxes throughout the workday.\n\tDependable, punctual, and hardworking.\n\tStrong attention to detail and accuracy.\n\tAbility to work efficiently in a fast-paced environment.\n\tAbility to follow instructions and work independently.\n\tStrong organizational and time-management skills.\n\tComfortable standing, walking, bending, reaching, and lifting for extended periods.\n\tPositive attitude and ability to work effectively as part of a team."}, {"id": "26595", "title": "Underwriting Analyst", "bhTitle": "Real Estate Analyst", "category": "Real Estate & Property", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-08-10", "exp": "2026-11-10", "desc": "Location: On-site\nJob Type: Full-time\nSchedule: Regular business hours\n\nWe are a rapidly growing private lender specializing in fix & flip, short-term bridge, and DSCR loans, providing flexible capital for investors across residential, multifamily, commercial, and value-add real estate. As an ambitious, entrepreneurial team, we move quickly, think creatively, and reward initiative. In this role, you will work alongside our senior team to support the underwriting process, manage loan files, and play an active part in transactions from initial application through closing.\n\nKey Responsibilities:\n\n\tAnalyze borrower financials, collateral, and transaction risks to formulate data-driven credit recommendations.\n\n\tCollaborate with sales and business development teams to align underwriting with deal strategy and client goals.\n\n\tCommunicate with borrowers, brokers, attorneys, and vendors to collect outstanding loan conditions.\n\n\tPrepare loan summaries and underwriting packages for internal review.\n\n\tAssist the Senior Underwriter with underwriting bridge, construction, and DSCR loan requests.\n\n\tHelp develop and execute business plans through thorough market and competitor analysis.\n\nQualifications:\n\n\tBachelor's degree required.\n\n\t0–2 years of experience in commercial real estate, banking, underwriting, or financial analysis preferred.\n\n\tStrong analytical and organizational skills.\n\n\tExcellent written and verbal communication skills.\n\nWhat We Offer:\n\n\tComprehensive benefits package.\n\n\tClear path for advancement within a fast-growing organization.\n\n\tHands-on experience analyzing complex real estate transactions to build deep industry expertise.\n\n\tAn entrepreneurial team culture that values initiative and rewards performance."}, {"id": "26594", "title": "AutoCAD Drafter/3D Renderer & Project Manager", "bhTitle": "AutoCAD Drafter/3D Renderer & Project Manager", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-10", "exp": "2026-11-10", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA Brooklyn-based interior design firm is seeking an experienced AutoCAD Drafter / 3D Renderer & Project Manager to join its growing team. This hybrid creative and technical role is ideal for someone with a strong background in interior design, architecture, or a related field who can translate design concepts into detailed technical drawings and high-quality 3D visualizations while helping manage projects from concept through completion.\n\nThe ideal candidate combines strong drafting and rendering skills with excellent organization, communication, and project management abilities.\n\nKey Responsibilities\n\n\tCreate detailed architectural and interior design drawings using AutoCAD.\n\tPrepare floor plans, elevations, sections, details, and other technical documentation.\n\tDevelop accurate 3D models based on design concepts, plans, and specifications.\n\tProduce high-quality, photorealistic renderings for client presentations and project development.\n\tTranslate conceptual designs and sketches into accurate, production-ready drawings.\n\tUpdate drawings and renderings based on client, designer, contractor, and project feedback.\n\tAssist with project management from the design and planning stages through installation and completion.\n\tTrack project schedules, deadlines, revisions, approvals, and outstanding action items.\n\tCoordinate project details with designers, clients, vendors, contractors, and other professionals.\n\tHelp ensure design specifications are accurately communicated and executed.\n\tMaintain organized project files, drawings, renderings, specifications, and documentation.\n\tAssist in identifying and resolving design or project issues throughout the process.\n\tManage multiple projects and priorities while maintaining accuracy and meeting deadlines.\n\nQualifications\n\n\t2+ years of experience in interior design, architecture, drafting, 3D visualization, or a related field.\n\tStrong proficiency in AutoCAD is required.\n\tExperience with Rhino is required.\n\tProficiency in Adobe Creative Suite.\n\tStrong 3D modeling and photorealistic rendering capabilities.\n\tSolid understanding of architectural drawings, interior layouts, dimensions, and design documentation.\n\tStrong organizational and project management skills.\n\tAbility to manage multiple projects and deadlines simultaneously.\n\tExcellent attention to detail and accuracy.\n\tStrong verbal and written communication skills.\n\tAbility to collaborate effectively with designers, clients, vendors, and contractors.\n\tSelf-motivated with the ability to work independently and take ownership of projects.\n\tPortfolio of relevant drafting, rendering, and design work is required."}, {"id": "26593", "title": "Math & Science Teacher – 6th Grade", "bhTitle": "Math and Science Teacher – 6th Grade", "category": "Education & Childcare", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-08-10", "exp": "2026-11-10", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\nSchedule: Monday through Thursday, 1:00 PM–3:00 PM/4:00 PM\n\nPosition Overview\n\nA school in Brooklyn, NY is seeking an enthusiastic and dedicated 6th Grade Math & Science Teacher to join its educational team on a part-time basis. This position is ideal for an educator who enjoys working with middle school students and can make math and science engaging, understandable, and relevant.\n\nThe ideal candidate is patient, organized, energetic, and capable of creating a structured classroom environment that encourages students to participate, ask questions, and strengthen their academic skills.\n\nKey Responsibilities\n\n\tTeach 6th-grade math and science using engaging and age-appropriate instructional methods.\n\tPrepare and deliver structured lesson plans aligned with the school's curriculum and academic goals.\n\tExplain mathematical and scientific concepts clearly and effectively.\n\tCreate hands-on activities, demonstrations, and problem-solving exercises to reinforce classroom instruction.\n\tDifferentiate instruction to accommodate varying student learning styles and academic abilities.\n\tAssess student understanding through assignments, quizzes, projects, and classroom participation.\n\tMonitor student progress and provide additional academic support when needed.\n\tMaintain a positive, structured, and respectful classroom environment.\n\tEncourage critical thinking, curiosity, and independent problem-solving.\n\tCommunicate with school administration, colleagues, and families regarding student progress when appropriate.\n\tMaintain accurate records of assignments, assessments, and student performance."}, {"id": "26589", "title": "Project Manager", "bhTitle": "Project Manager", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-10", "exp": "2026-11-10", "desc": "Location: New York, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA growing wholesale company in New York City is seeking a smart, organized, and highly motivated Project Manager to join our team. This is an excellent opportunity for a driven individual who enjoys taking ownership of projects, staying organized, and working across multiple areas of the business.\n\nThe ideal candidate will be a strong communicator and problem-solver who can manage projects from start to finish; dealing with products, China, supplier, art department, E commerce and sales team, coordinate with internal teams and outside partners, and ensure deadlines and priorities are consistently met. The successful candidate will also have the opportunity to receive hands-on training in sales and business development and grow into a broader role within the company.\n\nKey Responsibilities\n\n\tManage projects from initial planning through completion, ensuring deadlines and deliverables are met.\n\tCoordinate with customers, vendors, suppliers, and internal departments to keep projects moving forward.\n\tTrack project timelines, approvals, orders, and outstanding action items.\n\tMaintain organized records, spreadsheets, reports, and project documentation.\n\tFollow up consistently with team members, vendors, and customers to ensure tasks are completed on time.\n\tIdentify potential issues or delays and take initiative to resolve them.\n\tAssist with product development, orders, and other wholesale business operations.\n\tHelp prioritize daily tasks and ensure important projects remain on schedule.\n\tCommunicate project updates and provide regular status reports to management.\n\tTake on additional responsibilities as the role develops and the business grows.\n\tLearn the company's products, customers, and sales processes with the opportunity to receive training and transition into sales and business development responsibilities.\n\nQualifications\n\n\tHighly organized, responsible, and detail-oriented.\n\tStrong communication and interpersonal skills.\n\tAbility to manage multiple projects and priorities simultaneously.\n\tStrong follow-up skills and a proactive approach to getting things done.\n\tComfortable working independently and taking ownership of responsibilities.\n\tStrong computer skills, including Microsoft Excel, Word, and Outlook.\n\tAbility to learn new systems, products, and processes quickly.\n\tStrong problem-solving and critical-thinking abilities.\n\tPrevious project management, operations, wholesale, sales, or administrative experience is a plus, but the right motivated candidate will be considered.\n\tMust be eager to learn and interested in developing long-term business and sales skills."}, {"id": "26588", "title": "Social Media & Digital Content Manager", "bhTitle": "Social Media and Digital Content Manager", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-07", "exp": "2026-11-09", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nWe are seeking a creative, results-driven Social Media & Digital Content Manager to lead our digital presence, grow community engagement, increase program awareness, and support membership and fundraising initiatives across all digital platforms. Reporting to the Head of Marketing, Communications & Growth, this role combines strategic planning with hands-on content creation, including social media management, video production, graphic design, copywriting, and performance analytics.\n\nThe ideal candidate is passionate about storytelling, highly organized, and experienced in creating engaging content that drives measurable results.\n\nResponsibilities\n\nSocial Media Strategy & Community Engagement\n\n\tManage and oversee all official Instagram and Facebook accounts.\n\tDevelop and execute a comprehensive social media strategy to increase engagement, membership growth, and program participation.\n\tMonitor comments, direct messages, and inquiries, responding promptly and professionally.\n\tMaintain and manage the organization's social media content calendar.\n\tResearch trends, viral content, and emerging platform features to keep content fresh and engaging.\n\tCollaborate with internal departments to promote programs, events, and organizational initiatives.\n\nContent Creation & Multimedia Production\n\n\tCreate, film, and edit high-quality short-form videos, including Reels, Stories, and other social-first content.\n\tDesign engaging graphics and promotional materials for digital platforms.\n\tCapture photography and video at events, programs, and community activities.\n\tOrganize and maintain digital photo and media libraries.\n\tWrite compelling captions, video scripts, promotional copy, and strong calls-to-action.\n\tManage SMS campaigns and WhatsApp broadcasts for event reminders, promotions, and program updates.\n\nAnalytics & Performance\n\n\tEstablish measurable goals and KPIs for engagement, reach, membership growth, fundraising, and program registrations.\n\tMonitor campaign performance and prepare regular analytics reports for leadership.\n\tUse data and audience insights to optimize future campaigns and improve digital performance.\n\tIdentify opportunities to increase online engagement and conversion rates across all digital channels.\n\nQualifications\n\n\t1–3 years of experience managing multiple social media platforms for an organization or brand.\n\tDemonstrated success using social media to increase awareness, engagement, registrations, or conversions.\n\tExperience with Instagram, Facebook, WhatsApp Business, SMS marketing platforms, and social media analytics tools.\n\tStrong skills in video production, video editing, photography, graphic design, and digital storytelling.\n\tExcellent copywriting skills with the ability to create compelling social media content and marketing messages.\n\tProficiency with Adobe Creative Suite, Canva, CapCut, or similar creative software.\n\tStrong organizational skills with the ability to manage multiple projects and deadlines simultaneously.\n\tSelf-motivated, creative, and comfortable working in a fast-paced environment.\n\tExcellent communication and collaboration skills."}, {"id": "26587", "title": "Sales Assistant", "bhTitle": "Sales Assistant", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-07", "exp": "2026-11-09", "desc": "Location: New York, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA contemporary women's fashion wholesale company is seeking a personable, fashion-forward Sales Assistant to support the sales team and help grow customer relationships. This is an excellent opportunity for someone who is passionate about fashion, has a strong eye for current trends, and enjoys working in a fast-paced showroom and wholesale environment.\n\nThe ideal candidate is professional, highly organized, confident communicating with customers, and eager to contribute to a growing fashion business.\n\nResponsibilities\n\n\tSupport the sales team with daily account management and customer communications.\n\tAssist with showroom appointments, product presentations, and buyer meetings.\n\tBuild and maintain strong relationships with existing and prospective wholesale customers.\n\tFollow up with buyers regarding orders, samples, and product availability.\n\tProcess sales orders and assist with order tracking and customer inquiries.\n\tCoordinate with production, merchandising, and operations teams to ensure timely order fulfillment.\n\tPrepare sales reports, spreadsheets, and presentations using Microsoft Excel.\n\tMaintain showroom samples and ensure merchandise is presented professionally.\n\tStay current on fashion trends, market developments, and customer preferences.\n\tAssist with additional sales and administrative projects as needed.\n\nQualifications\n\n\tExcellent interpersonal and communication skills.\n\tProfessional, polished, and personable demeanor.\n\tStrong attention to detail and organizational skills.\n\tProficiency in Microsoft Excel is required.\n\tAbility to multitask and thrive in a fast-paced wholesale environment.\n\tSelf-motivated with a positive attitude and strong work ethic.\n\tPrevious experience in wholesale fashion, apparel sales, or showroom sales is preferred but not required.\n\tSharp, fashion-conscious, and knowledgeable about current industry trends."}, {"id": "26585", "title": "Production Designer", "bhTitle": "Designer", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-08-06", "exp": "2026-11-06", "desc": "Location: Jersey City, NJ\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nWe are seeking two detail-oriented Production Designers to join our growing team. This role is focused on executing high-volume packaging production with precision, consistency, and accuracy. The ideal candidate thrives in a structured production environment, enjoys working with established design systems, and has a strong understanding of print production and packaging workflows.\n\nThis is an excellent opportunity for a production-focused designer who excels at managing multiple SKUs, maintaining brand consistency, and delivering production-ready assets.\n\nResponsibilities\n\n\tExecute packaging files with precision, ensuring all artwork is production-ready.\n\tCreate and update packaging labels, instruction manuals, inserts, and other print collateral.\n\tManage artwork revisions, version control, and rolling updates across multiple product lines.\n\tPrepare print-ready files, including bleeds, color accuracy, typography, alignment, and production specifications.\n\tMaintain organized digital file systems to support efficient production and future updates.\n\tExtend approved packaging designs across multiple SKUs while maintaining consistency.\n\tApply established visual systems while ensuring clear differentiation between product variants.\n\tCollaborate with product development, marketing, and production teams to meet project deadlines.\n\tEnsure all packaging files meet printer and manufacturing requirements.\n\tPerform quality checks to maintain accuracy across all production deliverables.\n\nQualifications\n\n\t3+ years of experience in packaging design, production design, or print production.\n\tExceptional attention to detail and organizational skills.\n\tStrong understanding of layout, typography, hierarchy, and production workflows.\n\tAbility to manage high-volume production work within structured design systems.\n\tExcellent time management skills with the ability to prioritize multiple projects simultaneously.\n\tStrong communication skills and the ability to collaborate effectively across departments."}, {"id": "26583", "title": "Pizza Store Manager", "bhTitle": "Restaurant Management", "category": "Restaurant & Food Service", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-08-06", "exp": "2026-11-05", "desc": "Location: Deal area, NJ\nJob Type: Full-Time\nSchedule: Open availability required, including evenings, weekends, and holidays\n\nWe are seeking an experienced, hands-on Pizza Store Manager to lead operations at our busy Monmouth County pizzeria. The ideal candidate will take full ownership of daily store operations, driving sales growth while maintaining our high standards for fresh food quality and exceptional guest service. You will lead by example on the floor, balancing back-of-house kitchen efficiency with front-of-house customer satisfaction.\n\nKey Responsibilities:\n\n\tOversee daily front-of-house and back-of-house operations to ensure fast, efficient service for slice counter trade, sit-down dining, takeout, and delivery.\n\n\tRecruit, train, schedule, and supervise counter staff, pizza makers, line cooks, and delivery drivers.\n\n\tMonitor inventory levels, place food and supply orders, manage food costs, and control waste.\n\n\tMaintain strict food safety, food handling, and sanitation standards throughout the kitchen, prep areas, and dining room.\n\n\tHandle customer feedback professionally and resolve service issues quickly to maintain a strong local reputation.\n\n\tManage register till drawer reconciliations, register drops, weekly labor budgets, and basic store sales reporting.\n\n\tEnsure all kitchen equipment, ovens, refrigeration, and POS hardware are properly maintained and functioning safely.\n\nQualifications:\n\n\tMinimum 2-3 years of management or supervisory experience in a high-volume pizzeria or Italian restaurant setting.\n\n\tDeep knowledge of pizzeria operations, slice production, deck ovens, and food safety practices.\n\n\tProven team leadership skills with a track record of coaching and motivating crew members.\n\n\tStrong organizational skills with the ability to manage food costs, labor, and store schedules efficiently.\n\n\tServSafe Manager Certification (or ability to obtain within 30 days of hire).\n\n\tReliable transportation within the Deal, NJ and flexibility to cover store needs.\n\n\tToast POS knowledge a PLUS!!!\n\nWhat We Offer:\n\n\tPaid time off and flexible scheduling support.\n\n\tFree shift meals and generous food discounts.\n\n\tLong-term career stability and growth opportunities within a community-focused local business."}, {"id": "26582", "title": "Pizza Counterperson / Front of House Team Member", "bhTitle": "Restaurant- Counter/Waiter", "category": "Restaurant & Food Service", "type": "Full or Part Time", "typeNote": "", "state": "NJ", "added": "2026-08-06", "exp": "2026-11-06", "desc": "Location: Deal Area, NJ\nJob Type: Full-Time / Part-Time\nSchedule: Flexible hours available (day shifts, evenings, and weekends)\n\nWe are seeking a reliable, high-energy Pizza Counterperson to join our team in Monmouth County. As the primary face of our pizzeria, you will be responsible for providing fast, friendly service to our local community. Whether customer order a quick slice on the go or sit down for a full pasta dinner, you will ensure every guest leaves happy.\n\nKey Responsibilities:\n\n\tGreet walk-in guests with a welcoming attitude and take phone orders accurately using our point-of-sale system.\n\n\tManage the slice display counter, selected slice selection, and reheat slices to perfection in the deck oven.\n\n\tServe plated foods including hot heroes, pasta dishes, appetizers, and salads with attention to presentation and temperature.\n\n\tPack takeout orders, ensuring all sauces, utensils, and extras are included before handoff or delivery dispatch.\n\n\tMaintain a clean and organized counter area, dining section, condiment station, and glass display cases.\n\n\tHandle cash and credit transactions, manage the register balance, and process tips accurately.\n\n\tRestock paper goods, beverage coolers, and box supplies throughout the shift.\n\nQualifications:\n\n\tPrior experience in a pizzeria, deli, or fast-casual food setting is preferred but not required.\n\n\tStrong communication and multitasking skills in a fast-paced environment.\n\n\tBasic math skills for register handling and transaction accuracy.\n\n\tDependable transportation within Monmouth County and a strong work ethic.\n\nWhat We Offer:\n\n\tFlexible scheduling that works with school or second jobs.\n\n\tFree shift meals and employee discounts on menu items.\n\n\tA fun, supportive team environment."}, {"id": "26581", "title": "Sales - LiveSelling", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-08-06", "exp": "", "desc": "Wholesale footwear company seeking someone to set up and sell on Whatnot. Part time, long term..."}, {"id": "26580", "title": "Full Charge Bookkeeper", "bhTitle": "Bookkeeper", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-06", "exp": "2026-11-06", "desc": "Location: New York, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nWe are seeking a highly organized and trustworthy Full Charge Bookkeeper or Junior Accountant to join our family office team. This role is ideal for an accounting professional who enjoys working in a private, detail-oriented environment and is comfortable managing personal financial records, accounts payable, and investment reporting.\n\nThe ideal candidate has strong bookkeeping and accounting experience, exceptional attention to detail, and the ability to handle sensitive financial information with complete discretion.\n\nResponsibilities\n\n\tManage day-to-day bookkeeping and accounting activities for the family office.\n\tProcess and pay personal and household bills accurately and on time.\n\tMaintain accurate financial records and reconcile bank and credit card accounts.\n\tRecord and organize financial transactions using accounting software.\n\tMonitor investment accounts and maintain records of account activity and balances.\n\tPrepare financial reports, account summaries, and supporting documentation for ownership.\n\tCoordinate with accountants, financial advisors, banks, and other professional service providers.\n\tOrganize and maintain confidential financial files and documentation.\n\tAssist with budgeting, expense tracking, and cash flow reporting.\n\tSupport additional accounting and administrative projects as needed.\n\nQualifications\n\n\tStrong understanding of bookkeeping and general accounting principles.\n\tProficiency in QuickBooks and Microsoft Excel.\n\tExcellent organizational skills with exceptional attention to detail.\n\tHigh level of integrity and ability to maintain strict confidentiality.\n\tStrong communication and problem-solving skills.\n\tAbility to manage multiple priorities while meeting deadlines."}, {"id": "26579", "title": "Data Entry", "bhTitle": "Data Entry", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-06", "exp": "2026-11-06", "desc": "Location: New York, NY\nEmployment Type: Full-Time, Hybrid\nSchedule: Monday through Thursday: In-Office | Friday: Remote\n\nPosition Overview\n\nA well-established children's apparel company in Midtown Manhattan is seeking a detail-oriented and dependable Data Entry Specialist to join our team. This role is ideal for someone who enjoys structured, process-driven work and takes pride in maintaining accuracy and organization.\n\nThe successful candidate will play an important role in supporting wholesale order processing, maintaining customer records, and ensuring orders are entered and fulfilled accurately. This position offers a consistent work environment with the flexibility to work remotely on Fridays when needed.\n\nResponsibilities\n\n\tAccurately process and enter wholesale customer orders into company systems.\n\tMaintain and update customer order records with a high degree of accuracy.\n\tCommunicate with customers regarding order status, shipping updates, inventory availability, and general inquiries.\n\tCoordinate with internal departments to ensure timely and accurate order fulfillment.\n\tReview orders for completeness and resolve discrepancies or issues as they arise.\n\tMaintain organized electronic records and documentation.\n\tAssist with data verification, reporting, and other administrative tasks as needed.\n\tEnsure all data is entered accurately and in accordance with company procedures.\n\nQualifications\n\n\tStrong attention to detail and excellent organizational skills.\n\tReliable, dependable, and committed to producing accurate work.\n\tComfortable performing repetitive, process-driven tasks.\n\tExcellent computer skills and proficiency with Microsoft Office.\n\tStrong verbal and written communication skills.\n\tPrevious experience in data entry, wholesale order entry, customer service, or administrative support is preferred.\n\tAbility to prioritize tasks and meet deadlines in a fast-paced environment.\n\tProfessional attitude with a strong work ethic and a willingness to learn."}, {"id": "26578", "title": "Sourcing Manager", "bhTitle": "Sourcing Manager", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-08-06", "exp": "2026-11-06", "desc": "Location: Woodbridge, NJ\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nWe are seeking an experienced and driven Sourcing Manager to join our growing team. As our business continues to expand with the addition of two new divisions, we are looking for a sourcing professional who can identify new products, build strong supplier relationships, and manage the sourcing process across multiple consumer product categories.\n\nThe ideal candidate has experience working with overseas manufacturers, excellent negotiation skills, and a strong understanding of consumer products, particularly electronic accessories. This is an exciting opportunity to contribute to a fast-growing organization with a broad and expanding product portfolio.\n\nResponsibilities\n\n\tSource new products, suppliers, and manufacturing partners for multiple product categories.\n\tBuild and maintain strong relationships with domestic and overseas vendors, with an emphasis on Asia-based manufacturers.\n\tNegotiate pricing, lead times, and supplier agreements to maximize profitability and product quality.\n\tManage product sourcing from initial concept through production and delivery.\n\tCommunicate daily with factories regarding pricing, samples, production schedules, packaging, and quality standards.\n\tResearch market trends, emerging products, and new sourcing opportunities.\n\tCollaborate with product development, sales, and operations teams to support new product launches.\n\tMonitor supplier performance and ensure timely delivery of products.\n\tPrepare costing sheets, sourcing reports, and vendor documentation.\n\tIdentify opportunities to improve sourcing strategies, reduce costs, and streamline supply chain operations.\n\nQualifications\n\n\tStrong vendor management skills.\n\tExcellent organizational and project management abilities.\n\tStrong analytical and problem-solving skills.\n\tProficiency in Microsoft Excel, Outlook, and other Microsoft Office applications.\n\tAbility to manage multiple projects in a fast-paced environment.\n\tExcellent written and verbal communication skills."}, {"id": "26577", "title": "Sales Representative", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-06", "exp": "2026-11-06", "desc": "Location: New York, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nWe are looking for a motivated and enthusiastic Sales Representative to join our growing team. This is an excellent opportunity for someone who is eager to build a career in sales and learn directly from experienced leadership. You will receive hands-on training, mentorship, and the opportunity to sell a wide range of products across multiple categories.\n\nThe ideal candidate is a strong communicator who enjoys building relationships, is comfortable with outreach, and is driven to grow professionally in a fast-paced sales environment.\n\nResponsibilities\n\n\tConduct outbound calls and email outreach to prospective customers.\n\tResearch companies and identify buyer and decision-maker contact information.\n\tBuild and maintain a pipeline of prospective accounts.\n\tSend introductory emails and follow up consistently to generate new business opportunities.\n\tDevelop relationships with potential customers through phone, email, and virtual meetings.\n\tMaintain accurate records of all prospecting activities within the CRM system.\n\tCollaborate with leadership to develop sales strategies and improve outreach efforts.\n\tLearn the company's product lines and effectively communicate product benefits to prospective customers.\n\tMeet or exceed daily outreach and sales activity goals.\n\tProvide exceptional customer service throughout the sales process.\n\nQualifications\n\n\tComfortable making outbound calls and sending high-volume email outreach.\n\tPositive attitude with a willingness to learn and grow.\n\tHighly motivated, self-driven, and goal-oriented.\n\tStrong organizational and time management skills.\n\tBasic computer skills, including Microsoft Office and email platforms.\n\tAbility to work independently while contributing to a collaborative team environment."}, {"id": "26576", "title": "Case Worker", "bhTitle": "Case Worker", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-05", "exp": "2026-11-05", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nWe are seeking a compassionate and dedicated Case Worker to provide comprehensive support services to Holocaust Survivors enrolled in our Homecare Program. This role is focused on assessing client needs, coordinating services, advocating for client well-being, and helping individuals maintain the highest possible quality of life.\n\nThe ideal candidate is empathetic, highly organized, and passionate about serving older adults and vulnerable populations while collaborating with families, healthcare providers, and community organizations.\n\nResponsibilities\n\n\tManage an assigned caseload of Homecare clients.\n\tConduct comprehensive home visits to assess clients' physical, emotional, social, and environmental needs.\n\tIdentify unmet needs, including healthcare, mental health, financial assistance, social support, and quality-of-life services.\n\tDevelop individualized care plans based on each client's unique circumstances and goals.\n\tMaintain regular communication with clients and their families through phone calls and in-person visits.\n\tCoordinate services with healthcare providers, community agencies, and other support organizations.\n\tAssist clients in accessing homecare services, counseling, financial assistance, and community resources.\n\tAdvocate for clients to ensure they receive compassionate, respectful, and comprehensive care.\n\tMaintain accurate, timely, and confidential case documentation in accordance with agency and regulatory requirements.\n\tPrepare reports summarizing client progress, service delivery, and ongoing needs.\n\tParticipate in staff meetings, case conferences, and professional development opportunities.\n\tPerform additional case management and administrative duties as assigned.\n\nQualifications\n\n\tHigh school diploma required.\n\tBachelor's degree in Social Work (BSW), Human Services, Psychology, or a related field is preferred.\n\tPrevious experience in case management, social services, homecare, or working with older adults is preferred.\n\tExperience supporting trauma survivors, seniors, or other vulnerable populations is highly desirable.\n\tExcellent interpersonal, written, and verbal communication skills.\n\tStrong organizational skills with the ability to manage multiple cases and priorities.\n\tAbility to work independently while collaborating effectively with multidisciplinary teams.\n\tKnowledge of community resources, healthcare systems, and social service programs.\n\tProficiency in Microsoft Word, Excel, and electronic documentation systems.\n\tBilingual Yiddish and/or Russian is preferred."}, {"id": "26575", "title": "Accounts Payable Specialist", "bhTitle": "Accounts Payable", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-05", "exp": "2026-11-05", "desc": "Location: New York, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA wholesale company in New York, NY is seeking an experienced and detail-oriented Accounts Payable Specialist to join its accounting team. The ideal candidate will have 3–7 years of accounts payable experience, strong knowledge of QuickBooks, and the ability to manage a high volume of invoices while ensuring accuracy and timely payments.\n\nThis role is ideal for someone who is organized, dependable, and enjoys working in a fast-paced wholesale environment.\n\nResponsibilities\n\n\tProcess vendor invoices accurately and in a timely manner.\n\tVerify invoices, purchase orders, and supporting documentation before payment.\n\tPrepare and process weekly check runs, ACH payments, and wire transfers.\n\tMaintain accurate vendor records and resolve invoice discrepancies.\n\tReconcile vendor statements and investigate outstanding balances.\n\tEnter accounts payable transactions into QuickBooks.\n\tCommunicate with vendors regarding payment status and account inquiries.\n\tAssist with month-end closing activities, including accounts payable reconciliations.\n\tMaintain organized digital and physical filing systems for accounting records.\n\tCollaborate with purchasing, receiving, and accounting departments to ensure accurate financial records.\n\tSupport additional accounting and administrative projects as needed.\n\nQualifications\n\n\t3–7 years of Accounts Payable experience required.\n\tStrong working knowledge of QuickBooks is required."}, {"id": "26574", "title": "Intake Coordinator", "bhTitle": "Intake", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-05", "exp": "2026-11-05", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA healthcare services center in Brooklyn, NY is seeking a compassionate, organized, and detail-oriented Intake Coordinator to join our team. As the first point of contact for new patients and referral sources, you will play a vital role in creating a positive experience while ensuring an efficient and seamless intake process.\n\nThe ideal candidate is an excellent communicator who thrives in a fast-paced healthcare environment, enjoys helping others, and is committed to providing exceptional customer service.\n\nResponsibilities\n\n\tServe as the primary point of contact for new patients, families, referral sources, and healthcare providers.\n\tReceive and process new referrals, ensuring all required information and documentation is complete.\n\tConduct intake interviews and gather demographic, insurance, and medical information.\n\tVerify insurance eligibility and obtain authorizations when required.\n\tSchedule appointments and coordinate services with clinical and administrative staff.\n\tMaintain accurate patient records and documentation within electronic medical record (EMR) systems.\n\tCommunicate with patients regarding appointments, required documentation, and program information.\n\tCoordinate with physicians, hospitals, insurance companies, and community partners to facilitate timely admissions.\n\tEnsure compliance with organizational policies, confidentiality requirements, and healthcare regulations.\n\tAssist with administrative tasks and provide support to the intake and operations teams as needed."}, {"id": "26573", "title": "Fashion & Content Creation Internship", "bhTitle": "Fashion & Content Creation Internship", "category": "E-commerce, Marketing & Social Media", "type": "Internship", "typeNote": "", "state": "NY", "added": "2026-08-05", "exp": "2026-11-26", "desc": "Location: New York City\nSchedule: Part-Time or Full-Time (Fall)\n\nA growing women's fashion company is seeking Fall interns who are passionate about fashion and content creation. This is a great opportunity to gain hands-on experience in a fast-paced, creative environment.\n\nResponsibilities:\n\n\tAssist with social media content and marketing initiatives.\n\tSupport photoshoots, product launches, and daily operations.\n\tResearch fashion trends and contribute creative ideas.\n\nQualifications:\n\n\tStrong interest in fashion and/or content creation.\n\tOrganized, creative, and eager to learn.\n\tExcellent communication skills and a positive attitude."}, {"id": "26572", "title": "Administrative Assistant", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Remote / Hybrid", "typeNote": "Remote/Hybrid/PT", "state": "NY", "added": "2026-08-05", "exp": "2026-11-05", "desc": "Location: Brooklyn, NY (Hybrid)\nEmployment Type: Part-Time\nSchedule: Flexible Hours – Work from Home with Company Cell Phone and Occasional Job Site Visits\n\nPosition Overview\n\nWe are seeking a motivated, organized, and dependable Administrative Assistant to support daily business operations in a flexible hybrid role. This is an excellent opportunity for someone who is eager to learn, takes initiative, and enjoys helping projects move from start to finish.\n\nThe ideal candidate is a strong communicator with excellent attention to detail who can work independently while staying organized in a fast-paced environment. Training will be provided for the right candidate.\n\nResponsibilities\n\n\tDraft proposals, contracts, and invoices using pre-existing templates in Canva, Outlook, and invoicing software.\n\tRespond promptly and professionally to customer inquiries via phone, email, and text.\n\tHelp manage projects from initial customer inquiry through successful completion.\n\tCoordinate communication with clients, vendors, and team members to keep projects on schedule.\n\tMaintain organized digital files, documentation, and project records.\n\tAssist with scheduling appointments, meetings, and follow-up communications.\n\tPerform general administrative and operational tasks to support day-to-day business activities.\n\tVisit local job sites as needed to assist with project coordination and administrative support.\n\tIdentify opportunities to improve workflow and help keep operations running efficiently.\n\nQualifications\n\n\tStrong organizational skills with exceptional attention to detail.\n\tExcellent written and verbal communication skills.\n\tSelf-motivated with the ability to work independently.\n\tComfortable using Microsoft Outlook, Canva, and general office software.\n\tQuick learner with strong problem-solving abilities.\n\tProfessional, reliable, and customer-service oriented.\n\nWhat We Offer\n\n\tFlexible hybrid work environment.\n\tOpportunity for long-term growth and increased responsibilities.\n\tSupportive and collaborative team environment."}, {"id": "26571", "title": "Special Education Teacher", "bhTitle": "Special Education Teacher", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-05", "exp": "2026-11-05", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA school in Brooklyn, NY is seeking a dedicated and compassionate Certified Special Education Teacher to join its team for the 2026–2027 school year. This full-time position focuses on supporting 7th-grade students by providing individualized instruction, fostering academic growth, and creating a positive, inclusive classroom environment.\n\nThe ideal candidate is passionate about helping students reach their full potential, works collaboratively with colleagues and families, and is committed to meeting the diverse learning needs of every student.\n\nResponsibilities\n\n\tDevelop and implement individualized lesson plans that align with students' IEP goals and curriculum standards.\n\tProvide engaging instruction tailored to the academic, social, and emotional needs of 7th-grade students.\n\tCreate a structured, supportive, and inclusive classroom environment that promotes student success.\n\tMonitor student progress and maintain accurate documentation of academic and behavioral performance.\n\tCollaborate with general education teachers, related service providers, administrators, and families to support student achievement.\n\tParticipate in IEP meetings, parent conferences, and multidisciplinary team meetings.\n\tImplement appropriate classroom management strategies and positive behavioral supports.\n\tDifferentiate instruction to accommodate diverse learning styles and abilities.\n\tUtilize assessments and data to guide instructional planning and student interventions.\n\tMaintain compliance with all special education regulations and school policies.\n\nQualifications\n\n\tNew York State Certification in Special Education is required.\n\tBachelor's degree in Special Education or a related field; Master's degree preferred.\n\tExperience teaching middle school students is preferred.\n\tStrong knowledge of IEP development, implementation, and progress monitoring.\n\tExcellent classroom management, communication, and organizational skills.\n\tAbility to collaborate effectively with colleagues, students, and families.\n\tPassion for supporting students with diverse learning needs."}, {"id": "26570", "title": "School Social Worker", "bhTitle": "School Social Worker", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-05", "exp": "2026-11-05", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA boys' upper school is seeking a compassionate and experienced School Social Worker / Mental Health Clinician to join its multidisciplinary team. This role provides an opportunity to make a meaningful impact by supporting adolescents with high-functioning autism and learning disabilities through individualized, strengths-based interventions that foster emotional well-being, confidence, independence, and lifelong success.\n\nThe ideal candidate is passionate about working with adolescents, values collaboration, and is committed to helping students develop the social, emotional, and executive functioning skills needed to thrive both inside and outside the classroom.\n\nResponsibilities\n\n\tProvide individual and group counseling using evidence-based therapeutic approaches, including Cognitive Behavioral Therapy (CBT) and autism-informed interventions.\n\tSupport students' social-emotional development, emotional regulation, and executive functioning skills.\n\tCollaborate closely with teachers, administrators, and related service providers to promote student success.\n\tCoordinate services and maintain effective communication with families and outside providers.\n\tProvide behavioral consultation and classroom support to assist students throughout the school day.\n\tDevelop individualized strategies that address students' emotional, behavioral, and educational needs.\n\tMaintain accurate clinical documentation and progress records.\n\tParticipate in multidisciplinary team meetings and contribute to treatment planning.\n\tFoster a safe, supportive, and inclusive school environment that promotes student growth and resilience.\n\nQualifications\n\n\tMaster's degree in Social Work, Mental Health Counseling, Psychology, or a related field.\n\tNew York State licensure or eligibility for licensure is preferred.\n\tExperience working with adolescents is required.\n\tExperience supporting students with autism spectrum disorders and/or learning disabilities is strongly preferred.\n\tStrong clinical judgment, organizational skills, and attention to detail.\n\tExcellent verbal and written communication skills.\n\tAbility to build trusting relationships with students, families, and colleagues.\n\tCollaborative, compassionate, and student-centered approach to care.\n\tStrong problem-solving skills and the ability to work effectively as part of a multidisciplinary team.\n\nWhat We Offer\n\n\tSupportive, collaborative, and mission-driven work environment.\n\tOpportunity to work alongside dedicated educators and clinicians.\n\tMeaningful work helping adolescents develop confidence, resilience, and independence.\n\tProfessional growth and ongoing development opportunities.\n\tFull-time position with the opportunity to make a lasting impact in students' lives."}, {"id": "26569", "title": "Executive Assistant", "bhTitle": "Executive Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-05", "exp": "2026-11-05", "desc": "Location: Brooklyn, NY / Lower East Side, NY (Travel Required)\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nWe are seeking a highly organized, proactive, and resourceful Executive Assistant to provide high-level administrative, operational, and project management support to the Chief Executive Officer (CEO). This individual will serve as a trusted partner, helping manage executive priorities, coordinate communications, oversee scheduling, and support strategic initiatives across the organization.\n\nThe ideal candidate is an exceptional multitasker who thrives in a fast-paced environment, exercises sound judgment, maintains strict confidentiality, and can anticipate the needs of executive leadership while ensuring day-to-day operations run smoothly.\n\nResponsibilities\n\n\tServe as the primary point of contact for internal and external communications on behalf of the CEO.\n\tScreen and manage phone calls, emails, correspondence, and other communications.\n\tCoordinate communication and follow-up with government agencies, donors, funders, community organizations, and strategic partners.\n\tManage and maintain the CEO's complex calendar, including meetings, events, travel, and scheduling priorities.\n\tCoordinate logistics for executive leadership meetings, Board of Directors meetings, donor events, and community engagements.\n\tArrange executive travel, prepare itineraries, and manage expense reports and reimbursements.\n\tAnticipate scheduling conflicts and proactively adjust priorities as needed.\n\tPrepare agendas, reports, presentations, research materials, and executive briefing documents.\n\tAttend meetings, record notes, and prepare meeting summaries with action items.\n\tDevelop project plans, dashboards, and status reports to support executive decision-making.\n\tOrganize and maintain confidential files, records, and executive documentation.\n\tSupport nonprofit governance activities and assist with reporting and compliance requirements.\n\tPerform additional administrative and operational duties as assigned.\n\nQualifications\n\n\tPrevious experience as an Executive Assistant, Personal Assistant, or similar executive support role is required.\n\tExperience in the social services, nonprofit, healthcare, or medical field is strongly preferred.\n\tOutstanding organizational, time management, and multitasking skills.\n\tExcellent verbal and written communication abilities.\n\tStrong proficiency in Microsoft Office, including Word, Excel, Outlook, and PowerPoint.\n\tAbility to work independently while managing multiple priorities and meeting deadlines.\n\tProfessional demeanor with exceptional discretion and the ability to handle confidential information.\n\tStrong problem-solving skills with a proactive, solutions-oriented mindset.\n\tFamiliarity with office technology, scheduling platforms, and standard business applications.\n\tHigh school diploma or GED required; Associate's degree preferred.\n\tBilingual (Spanish, Chinese, or Yiddish) is a plus.\n\tMust be willing and able to travel between Brooklyn and Manhattan as needed.\n\nPhysical Requirements\n\n\tAbility to lift up to 35 pounds.\n\tAbility to maintain regular and reliable attendance.\n\tAbility to communicate clearly and effectively with staff, executives, and external partners.\n\tAbility to perform the essential functions of the position in accordance with applicable federal, state, and local laws.\n\nWhat We Offer\n\n\tOpportunity to work closely with executive leadership in a dynamic organization.\n\tCollaborative and mission-driven work environment.\n\tProfessional growth and career advancement opportunities.\n\tMeaningful work supporting strategic initiatives and organizational success."}, {"id": "26568", "title": "Sales Representative", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-05", "exp": "2026-11-05", "desc": "Location: New York, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA wholesale housewares company in New York City is seeking an experienced and motivated Sales Representative to manage and grow relationships with major big-box retail accounts. This role is responsible for developing new business opportunities, expanding existing customer relationships, and driving sales growth across national retail channels.\n\nThe ideal candidate has experience selling consumer products or housewares to major retailers and is skilled at managing key accounts, negotiating programs, and identifying new opportunities for growth.\n\nResponsibilities\n\n\tDevelop and manage relationships with major big-box retailers and national accounts.\n\tIdentify and pursue new business opportunities to expand the company's retail presence.\n\tPresent product lines, seasonal assortments, and promotional programs to buyers.\n\tManage the complete sales cycle, including prospecting, account development, negotiations, and ongoing account management.\n\tPrepare sales presentations, quotations, and pricing proposals.\n\tCollaborate with merchandising, sourcing, operations, and customer service teams to ensure successful product launches and timely order fulfillment.\n\tMonitor customer inventory, sales performance, and market trends to identify opportunities for account growth.\n\tNegotiate pricing, promotional programs, and product placement while maintaining company profitability.\n\tMaintain accurate sales forecasts, customer records, and CRM updates."}, {"id": "26567", "title": "Sales Representative", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-05", "exp": "2026-11-05", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA wholesale company in Brooklyn, NY is seeking a motivated and results-driven Sales Representative to join its growing team. This role is responsible for developing new business opportunities, managing customer relationships, and driving sales growth across existing and prospective accounts.\n\nThe ideal candidate is a strong communicator with excellent relationship-building skills who enjoys working in a fast-paced wholesale environment and is committed to delivering outstanding customer service while achieving sales goals.\n\nResponsibilities\n\n\tDevelop and maintain relationships with new and existing wholesale customers.\n\tProspect and generate new business opportunities through outbound calls, emails, networking, and referrals.\n\tPresent products and promotions to customers while identifying opportunities to increase sales.\n\tManage customer accounts and provide exceptional service throughout the sales process.\n\tPrepare quotations, process orders, and follow up to ensure timely fulfillment.\n\tCollaborate with internal departments to ensure smooth order processing and customer satisfaction.\n\tMaintain accurate customer records, sales activity, and pipeline updates.\n\tMonitor market trends, customer needs, and competitor activity to identify growth opportunities.\n\tMeet or exceed individual sales goals and performance expectations.\n\tRepresent the company professionally at customer meetings and industry events as needed."}, {"id": "26566", "title": "Job Title: Warehouse Manager – Wholesale Cell Phones", "bhTitle": "Warehouse Manager", "category": "Warehouse, Driving & Logistics", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-04", "exp": "2026-11-11", "desc": "Job Summary\n\nWe are seeking an experienced Warehouse Manager to oversee the daily operations of a wholesale cell phone distribution warehouse. The ideal candidate will manage inventory, supervise warehouse staff, ensure accurate order fulfillment, and maintain efficient receiving, storage, and shipping processes while meeting company quality and productivity standards.\n\nKey Responsibilities\n\n\tManage all warehouse operations, including receiving, inventory control, order picking, packing, and shipping.\n\tSupervise, train, and schedule warehouse employees to ensure productivity and safety.\n\tMaintain accurate inventory records using warehouse management and inventory software.\n\tPerform regular inventory counts and reconcile discrepancies.\n\tEnsure timely and accurate fulfillment of customer and dealer orders.\n\tCoordinate inbound and outbound shipments with carriers and suppliers.\n\tInspect cell phones and accessories for quality and accuracy before shipment.\n\tImplement and maintain warehouse safety procedures and compliance standards.\n\tMonitor warehouse performance and recommend process improvements to increase efficiency.\n\tMaintain a clean, organized, and secure warehouse environment."}, {"id": "26565", "title": "Retail Sales", "bhTitle": "Retail Sales", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NJ", "added": "2026-08-04", "exp": "2026-11-06", "desc": "A Herbal Cafe in Long Branch, NJ is seeking a reliable retail associate to start immediately and continue working throughout the year.\n\nWe need someone for the cafe to make drinks and handle the register\n\nWednesday 9-2\nThursdays 2-7\nFridays 1-6\nSundays 11-4\n\nGreat work environment!"}, {"id": "26564", "title": "Administrative Assistant", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Part Time", "typeNote": "", "state": "NJ", "added": "2026-08-04", "exp": "2026-11-18", "desc": "A real estate firm in Oakhurst, NJ is seeking a part-time Administrative Assistant to join their team. The ideal candidate is organized, professional, and has strong communication and computer skills. Real estate experience or a willingness to obtain a real estate license is a plus.\n\nResponsibilities include:\n\n\tScheduling appointments and coordinating transactions\n\tManaging paperwork, filing, and administrative tasks\n\tCommunicating with clients and providing customer service\n\tAssisting with marketing and day-to-day office operations\n\tUsing Microsoft Office, Excel, Outlook, and other computer programs"}, {"id": "26563", "title": "Personal Assistant Needed – Five Towns, NY", "bhTitle": "Executive Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-04", "exp": "", "desc": "Private family seeking a highly organized, detail-oriented, dependable, discreet, and experienced Personal Assistant with strong multitasking abilities. Full-time position (40–50 hours per week), not remote. Candidates should live locally and be readily accessible when needed. Must have Excel experience and strong organizational skills. Must be a team player who works well with family members, staff, vendors, and other professionals. Prior experience supporting a private family or busy professional is preferred."}, {"id": "26562", "title": "Certified Medical Assistant (Phlebotomy)", "bhTitle": "Medical Assistant", "category": "Healthcare & Human Services", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-08-04", "exp": "2027-02-19", "desc": "Location: Brooklyn, NY\nSchedule: Part-Time or Full-Time (Some Sundays required)\n\nA medical office is seeking a Certified Medical Assistant with phlebotomy certification/skills. We are willing to train, but candidates must already know how to perform blood draws.\n\nSchedule: Office hours are Monday & Wednesday (8:30 AM–4:00 PM), Tuesday (1:00 PM–8:00 PM), Thursday (9:00 AM–5:00 PM), and Friday (8:30 AM–2:00 PM). Hours may vary."}, {"id": "26561", "title": "Account Manager", "bhTitle": "Account Manager", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-04", "exp": "2026-11-26", "desc": "For over 25 years, we've been a trusted supplier to dental professionals, building our business through exceptional service and lasting customer relationships. We're seeking an Account Growth Manager to help strengthen and expand those relationships by proactively connecting with existing customers, understanding their needs, and identifying opportunities for growth. This is an ideal opportunity for someone who enjoys building rapport over the phone, understands how businesses make purchasing decisions, and takes pride in becoming a trusted advisor rather than simply taking orders. If you\\'re a relationship-builder who thrives on helping customers succeed, we\\'d love to hear from you.\n\n\t\t\tHours are 9-5, but we can be flexible to start a bit later and end later. While in the office, we're open to having Fridays remote. 1 week of personal days after the first 3 months of employment, which grows in Year 2 and Year 3.\n\n\t\t\t45,000-55,000
