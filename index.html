ections to retail buyers.\n\nThe company is specifically looking for sales professionals with expertise in one or more of the following three product categories:\n\n1. Small Kitchen Electrics\n\n\tCoffee makers and espresso machines.\n\n\tToasters and toaster ovens.\n\n\tBlenders, mixers, and other small kitchen appliances.\n\n\tRelated countertop kitchen electronics.\n\n2. Cookware\n\n\tPots and pans.\n\n\tCookware sets.\n\n\tNonstick and stainless steel cookware.\n\n\tRelated kitchen and cooking products.\n\n3. Handbags & Wallets\n\n\tWomen's handbags and purses.\n\n\tWallets and small leather goods.\n\n\tFashion accessories.\n\n\tProducts sold through off-price and discount retail channels.\n\nCandidates with established relationships with buyers at off-price retailers, particularly TJ Maxx, Marshalls, and similar retail chains, are strongly preferred.\n\nThe ideal candidates are experienced wholesale sales professionals who understand their respective product categories, maintain active relationships with retail buyers, and have a proven ability to generate business.\n\nKey Responsibilities\n\nWholesale Sales & Business Development\n\n\tDevelop and expand wholesale sales within the assigned product category.\n\n\tLeverage existing relationships with retail buyers to generate new business opportunities.\n\n\tIdentify and pursue new accounts with national retailers, department stores, off-price chains, and specialty stores.\n\n\tPresent product assortments, pricing, and new merchandise to prospective buyers.\n\n\tNegotiate pricing, order quantities, and sales agreements.\n\n\tManage the sales process from initial outreach through order placement.\n\n\tDevelop strategies to increase sales volume and expand the company's retail presence.\n\nBuyer Relationships & Account Management\n\n\tMaintain and strengthen relationships with existing retail and wholesale buyers.\n\n\tUtilize established buyer connections to introduce new products and secure orders.\n\n\tBuild long-term relationships with key retail decision-makers.\n\n\tCommunicate regularly with buyers regarding product availability, pricing, and new collections.\n\n\tIdentify opportunities to expand product assortments within existing accounts.\n\n\tFollow up on prospective accounts, sales opportunities, and outstanding orders.\n\n\tProvide excellent customer service and maintain strong account relationships.\n\nProduct Knowledge & Market Development\n\n\tStay informed about market trends and customer demand within the assigned product category.\n\n\tUnderstand competitive pricing, product positioning, and retail buying requirements.\n\n\tIdentify high-demand products and new business opportunities.\n\n\tCollaborate with management regarding buyer feedback and market opportunities.\n\n\tMonitor sales performance and provide updates on account development.\n\n\tSupport the company's growth within wholesale, off-price, and national retail channels.\n\nQualifications\n\n\tPrevious wholesale sales experience in at least one of the following categories required:\n\n\t\tSmall kitchen electrics and appliances.\n\n\t\tCookware, pots, and pans.\n\n\t\tHandbags, wallets, and fashion accessories.\n\n\tEstablished relationships with retail buyers strongly preferred.\n\n\tExperience selling to off-price retailers such as TJ Maxx, Marshalls, or similar chains is highly desirable.\n\n\tProven track record of generating wholesale sales and developing retail accounts.\n\n\tStrong understanding of product pricing, merchandising, and retail buying processes.\n\n\tExcellent negotiation, presentation, and relationship-building skills.\n\n\tAbility to identify new business opportunities and convert them into sales.\n\n\tSelf-motivated, results-driven, and capable of working independently.\n\n\tStrong communication, organizational, and follow-up abilities.\n\n\tKnowledge of national retail chains, department stores, and wholesale distribution channels."}, {"id": "26916", "title": "Legal Assistant – Litigation Department", "bhTitle": "Legal Assistant", "category": "Legal", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-21", "exp": "2027-01-21", "desc": "Location: Cedarhurst, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nA sophisticated and established law firm with offices in Long Island, Brooklyn, and New Jersey is seeking a highly organized, detail-oriented, and dependable Legal Assistant to join its Litigation Department in Cedarhurst, NY.\n\nThe ideal candidate is a professional and motivated individual with strong administrative skills, excellent attention to detail, and the ability to manage multiple responsibilities in a fast-paced legal environment.\n\nThis position involves providing essential administrative support to attorneys, managing legal documents, coordinating schedules, handling correspondence, and assisting with the daily operations of the Litigation Department.\n\nThis is an excellent opportunity for someone seeking a stable, full-time position within a professional and collaborative law firm.\n\nKey Responsibilities\n\nLegal Administrative Support\n\n\tProvide daily administrative assistance to attorneys within the Litigation Department.\n\n\tManage attorneys' calendars, appointments, meetings, and scheduling needs.\n\n\tHandle incoming and outgoing correspondence, emails, and phone calls.\n\n\tScreen and direct calls, messages, and inquiries appropriately.\n\n\tPrepare, organize, and maintain legal and administrative documents.\n\n\tAssist attorneys with coordinating meetings and other case-related activities.\n\n\tMaintain accurate records and ensure timely follow-up on outstanding tasks.\n\n\tHandle confidential client and legal information with professionalism and discretion.\n\nDocument Management & Organization\n\n\tOrganize, maintain, and archive documents related to active and closed litigation matters.\n\n\tMaintain accurate electronic and physical filing systems.\n\n\tEnsure case files and supporting documents are properly labeled, organized, and accessible.\n\n\tAssist with retrieving, reviewing, and distributing legal documents as needed.\n\n\tMonitor documentation requirements and assist with maintaining organized case records.\n\n\tSupport attorneys with document preparation, formatting, and general administrative tasks.\n\nLitigation Department Coordination\n\n\tAssist with the day-to-day operations of the Litigation Department to ensure efficiency and organization.\n\n\tMonitor developments in legal regulations and procedures and communicate relevant updates to attorneys.\n\n\tCoordinate administrative tasks and maintain communication between attorneys and support staff.\n\n\tHelp track important assignments, deadlines, and follow-up items.\n\n\tAssist with preparing reports, correspondence, and other departmental materials.\n\n\tSupport department workflow and help ensure administrative responsibilities are completed accurately and on time.\n\n\tAssist with special projects and additional administrative assignments as needed.\n\nQualifications\n\n\tBachelor's degree required.\n\n\t1–2 years of previous administrative or office support experience required.\n\n\tProficiency in Microsoft Word, Excel, and Outlook.\n\n\tStrong organizational skills and exceptional attention to detail.\n\n\tExcellent written and verbal communication abilities.\n\n\tAbility to multitask, prioritize responsibilities, and meet deadlines.\n\n\tComfortable working in a fast-paced professional environment.\n\n\tStrong computer skills and ability to learn new office systems.\n\n\tProfessional telephone etiquette and interpersonal skills.\n\n\tDependable, punctual, and capable of working independently.\n\n\tAbility to handle confidential information with discretion.\n\n\tStrong proofreading, document management, and administrative skills.\n\n\tPrevious experience in a law firm or legal environment is a plus."}, {"id": "26915", "title": "Paralegal", "bhTitle": "Paralegal", "category": "Legal", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-21", "exp": "2027-01-21", "desc": "Location: Cedarhurst, NY\nEmployment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nA sophisticated and established law firm with offices in Long Island, Brooklyn, and New Jersey is seeking a highly organized, detail-oriented, and motivated Paralegal to join its Litigation Department in Cedarhurst, NY.\n\nThe ideal candidate is a dependable professional with strong research, writing, and organizational skills who can effectively manage multiple responsibilities in a fast-paced legal environment.\n\nThis position involves supporting attorneys with litigation matters, legal research, document preparation, court filings, and case management.\n\nThis is an excellent opportunity to join a collaborative legal team and gain valuable experience within a dynamic litigation practice.\n\nKey Responsibilities\n\nLitigation Support & Legal Research\n\n\tConduct legal research and investigate facts relevant to ongoing litigation matters.\n\n\tReview and summarize cases, legal documents, and supporting materials for attorneys.\n\n\tPrepare case summaries, legal reports, and research memoranda.\n\n\tAssist attorneys in developing legal strategies and preparing case materials.\n\n\tMonitor relevant changes in laws, regulations, and legal procedures.\n\n\tProvide attorneys with updates regarding legal developments and case-related matters.\n\n\tAssist with preparing litigation materials and supporting documentation.\n\nLegal Document Preparation & Court Filings\n\n\tDraft, review, and organize legal documents, including:\n\n\t\tPleadings and motions.\n\n\t\tDiscovery demands and responses.\n\n\t\tContracts and legal correspondence.\n\n\t\tDeposition summaries.\n\n\t\tCase reports and supporting documentation.\n\n\tPrepare and file legal documents with courts and administrative agencies.\n\n\tEnsure legal documents are properly formatted, organized, and submitted according to applicable requirements.\n\n\tAssist attorneys with preparing exhibits, supporting materials, and court submissions.\n\n\tMaintain accurate records of legal filings and case documentation.\n\nCase Management & Administrative Support\n\n\tOrganize, maintain, and archive litigation files and related documentation.\n\n\tAssist attorneys with managing active cases and monitoring important deadlines.\n\n\tCoordinate and organize documents needed for depositions, hearings, and trials.\n\n\tSupport trial preparation, including assembling exhibits and case materials.\n\n\tMaintain accurate electronic and physical case files.\n\n\tAssist with scheduling, correspondence, and general litigation-related administrative tasks.\n\n\tCoordinate with attorneys and other staff members to ensure efficient case management.\n\n\tHandle confidential client and legal information with professionalism and discretion.\n\nQualifications\n\n\tBachelor's degree required.\n\n\t1–2 years of experience in an administrative or office support role.\n\n\tPrevious experience in a law firm or litigation department preferred but not required.\n\n\tProficiency in Microsoft Word, Excel, and Outlook.\n\n\tStrong organizational skills and exceptional attention to detail.\n\n\tExcellent written and verbal communication skills.\n\n\tStrong research, analytical, and problem-solving abilities.\n\n\tAbility to manage multiple assignments and prioritize competing deadlines.\n\n\tComfortable working in a fast-paced professional environment.\n\n\tAbility to follow instructions carefully and work independently.\n\n\tStrong document preparation and proofreading skills.\n\n\tProfessional, dependable, and capable of maintaining confidentiality.\n\n\tAbility to collaborate effectively with attorneys and other legal professionals."}, {"id": "26914", "title": "Senior Sales Executive", "bhTitle": "Sales- Senior Level", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-21", "exp": "2027-01-21", "desc": "Employment Type: Full-Time\n\nPosition Overview\n\nA growing company specializing in women's intimate apparel, underwear, and shapewear is seeking an experienced and well-connected Senior Sales Executive to expand its wholesale business and strengthen relationships with retail buyers.\n\nThe ideal candidate has a proven background in intimate apparel sales, an established network of retail and wholesale buyers, and a strong understanding of the women's underwear and shapewear market.\n\nThis position is best suited for a sales professional who can leverage existing industry relationships to generate new business, grow key accounts, and drive revenue.\n\nKey Responsibilities\n\nWholesale Sales & Business Development\n\n\tDevelop and expand wholesale sales of women's intimate apparel, underwear, and shapewear.\n\n\tLeverage existing relationships with retail buyers to generate new business opportunities.\n\n\tIdentify and pursue new accounts with department stores, specialty retailers, chains, and other wholesale customers.\n\n\tPresent product collections, pricing, and new merchandise to prospective buyers.\n\n\tNegotiate pricing, order quantities, and sales agreements.\n\n\tManage the sales process from initial outreach through order placement and account development.\n\n\tConsistently identify opportunities to increase sales volume and expand market presence.\n\nBuyer Relationships & Account Management\n\n\tMaintain and strengthen relationships with established retail and wholesale buyers.\n\n\tUtilize an existing network of industry contacts to secure new accounts.\n\n\tBuild long-term partnerships with customers and key decision-makers.\n\n\tCommunicate regularly with buyers regarding product offerings, inventory, pricing, and upcoming collections.\n\n\tFollow up on sales opportunities, customer inquiries, and outstanding orders.\n\n\tIdentify opportunities to expand product assortments within existing accounts.\n\n\tProvide excellent customer service and maintain strong account relationships.\n\nMarket Knowledge & Sales Strategy\n\n\tStay informed about trends in women's intimate apparel, underwear, and shapewear.\n\n\tUnderstand customer preferences, market pricing, and competitive product offerings.\n\n\tIdentify high-demand products and potential growth opportunities.\n\n\tCollaborate with management and product development teams regarding buyer feedback and market demand.\n\n\tHelp develop sales strategies to increase revenue and strengthen the company's market position.\n\n\tProvide updates on sales activity, prospective accounts, and business development opportunities.\n\nQualifications\n\n\tPrevious wholesale sales experience in women's intimate apparel, underwear, or shapewear required.\n\n\tEstablished relationships and direct connections with retail and wholesale buyers required.\n\n\tStrong understanding of the women's intimates and shapewear market.\n\n\tProven ability to generate sales and develop new wholesale accounts.\n\n\tExperience working with department stores, retail chains, specialty stores, or other wholesale customers.\n\n\tExcellent negotiation, presentation, and relationship-building skills.\n\n\tStrong understanding of wholesale pricing, product assortments, and retail buying processes.\n\n\tSelf-motivated, results-driven, and comfortable working independently.\n\n\tExcellent communication and follow-up abilities.\n\n\tAbility to identify new business opportunities and convert relationships into sales.\n\n\tStrong organizational skills and professional business judgment."}, {"id": "26913", "title": "Luxury Watch Sales Associate", "bhTitle": "Luxury Watch Sales Associate", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-20", "exp": "2027-01-04", "desc": "Location: New York City (Diamond District)\nSchedule: Full-Time\n\nA growing luxury watch dealer in NYC is seeking a motivated and personable Sales Associate to join its team. The company specializes in buying, selling, consigning, and sourcing luxury timepieces from leading brands, working with collectors, clients, and industry professionals in a private showroom environment.\n\nResponsibilities\n\n\tAssist clients with buying, selling, and consigning luxury watches.\n\tBuild and maintain strong relationships with collectors, customers, and industry partners.\n\tFollow up on leads and generate new business opportunities.\n\tEducate clients on watch brands, models, market trends, and pricing.\n\tCoordinate client appointments and provide a personalized, high-end customer experience.\n\tHelp source inventory and communicate with buyers, sellers, and dealers.\n\tMaintain accurate client records and support daily showroom operations.\n\nQualifications\n\n\tPrevious sales, luxury retail, or customer service experience preferred.\n\tStrong communication, interpersonal, and relationship-building skills.\n\tSelf-motivated with a passion for sales and earning commission.\n\tProfessional appearance and demeanor.\n\tInterest in luxury watches, jewelry, or other luxury goods is a plus.\n\tOrganized, detail-oriented, and comfortable working in a fast-paced environment.\n\nThis is a great opportunity for someone looking to build a career in the luxury watch industry while working directly with high-end clients."}, {"id": "26912", "title": "Watch Photographer / E-Commerce Assistant", "bhTitle": "Ecommerce Marketing", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-20", "exp": "2027-01-04", "desc": "Location: NYC\nSchedule: Monday–Friday, 9:30 AM–5:30 PM\n\nA luxury watch company is seeking a detail-oriented Photographer to photograph watches and upload product images to their website. The ideal candidate has strong attention to detail, an interest in photography and luxury products, and the ability to work efficiently in a fast-paced environment.\n\nResponsibilities include photographing products, editing and organizing images, uploading content to the website, and assisting with e-commerce tasks as needed."}, {"id": "26911", "title": "Receptionist / Administrative Assistant", "bhTitle": "Receptionist", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-20", "exp": "2027-01-20", "desc": "Location: Great Neck, NY\nEmployment Type: Full-Time, In-Person\n\nPosition Overview\n\nA well-established company specializing in chemical importing and distribution is seeking a professional, organized, and detail-oriented Receptionist / Administrative Assistant to join its Great Neck office.\n\nThis position combines traditional front-desk responsibilities with administrative support, order processing, and logistics coordination.\n\nThe ideal candidate is personable, dependable, and comfortable managing multiple responsibilities in a busy office environment. This individual will serve as an important point of contact for customers, vendors, and internal team members while helping ensure smooth daily operations.\n\nThis is an excellent opportunity for someone seeking a stable, full-time position with exposure to international trade, distribution, and logistics.\n\nKey Responsibilities\n\nReception & Front Desk Support\n\n\tGreet visitors, customers, and vendors in a friendly and professional manner.\n\n\tAnswer incoming phone calls and direct inquiries to the appropriate departments.\n\n\tManage general office communications, including emails and correspondence.\n\n\tMaintain an organized, professional, and welcoming reception area.\n\n\tAssist customers and vendors with general questions and requests.\n\n\tCoordinate appointments, meetings, and other office activities as needed.\n\nAdministrative & Office Operations\n\n\tProvide daily administrative support to management and office staff.\n\n\tPerform accurate data entry and maintain organized business records.\n\n\tPrepare, review, and organize documents, spreadsheets, and correspondence.\n\n\tMaintain electronic and physical filing systems.\n\n\tAssist with preparing reports, invoices, and other administrative materials.\n\n\tUpdate customer, vendor, and order information in internal systems.\n\n\tMonitor outstanding administrative tasks and follow up as needed.\n\n\tSupport general office organization and operational efficiency.\n\nOrder Processing & Logistics Coordination\n\n\tAssist with processing customer orders and maintaining accurate order records.\n\n\tCoordinate with internal departments regarding order status and fulfillment.\n\n\tCommunicate with vendors, suppliers, and logistics partners as needed.\n\n\tHelp track shipments, deliveries, and outstanding orders.\n\n\tAssist with preparing and organizing shipping and distribution documentation.\n\n\tFollow up on order confirmations, delivery schedules, and shipment updates.\n\n\tMaintain accurate records of customer orders and shipping information.\n\n\tSupport the logistics team with administrative tasks related to domestic and international distribution.\n\n\tHelp identify and communicate order discrepancies or delivery issues.\n\nQualifications\n\n\tPrevious experience in reception, administrative support, customer service, or office coordination preferred.\n\n\tStrong computer skills and proficiency in Microsoft Office applications, particularly Excel and Outlook.\n\n\tExcellent verbal and written communication skills.\n\n\tProfessional and friendly telephone manner.\n\n\tStrong organizational skills and attention to detail.\n\n\tAbility to multitask and prioritize responsibilities in a busy office environment.\n\n\tAccurate data entry and recordkeeping abilities.\n\n\tDependable, punctual, and comfortable working independently.\n\n\tStrong follow-up skills and ability to meet deadlines.\n\n\tPositive attitude and willingness to learn new systems and procedures.\n\n\tExperience in importing, distribution, logistics, or order processing is a plus.\n\n\tAbility to communicate professionally with customers, vendors, and internal departments."}, {"id": "26910", "title": "Accounting & Administrative Assistant", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-20", "exp": "2027-01-20", "desc": "Employment Type: Full-Time, In-Office\n\nPosition Overview\n\nA growing company is seeking a reliable, organized, and detail-oriented Accounting & Administrative Assistant to join its team.\n\nThis position involves working closely with management to support daily accounting operations, administrative responsibilities, order coordination, and logistics.\n\nThe ideal candidate is sharp, efficient, comfortable working with numbers, and capable of managing multiple responsibilities in a fast-paced office environment.\n\nThis is an excellent opportunity for an experienced professional seeking a stable, long-term position with a supportive team and opportunities for professional growth.\n\nKey Responsibilities\n\nAccounting & Financial Support\n\n\tAssist with preparing, reviewing, and organizing invoices and payment records.\n\n\tPerform accurate daily data entry and maintain organized financial records.\n\n\tSupport accounts payable and accounts receivable processes.\n\n\tTrack incoming and outgoing payments, invoices, and outstanding balances.\n\n\tReview financial documents for accuracy and completeness.\n\n\tMaintain and update accounting spreadsheets and internal reports.\n\n\tAssist with reconciling payment information and identifying discrepancies.\n\n\tCommunicate with management regarding outstanding payments and accounting-related matters.\n\nOrder Coordination & Logistics\n\n\tAssist with processing and tracking customer and vendor orders.\n\n\tCoordinate order routing, shipping arrangements, and delivery schedules.\n\n\tCommunicate with vendors, suppliers, and shipping companies regarding order updates.\n\n\tPrepare and maintain purchase orders and shipping documentation.\n\n\tMonitor shipment progress and follow up on delayed or outstanding deliveries.\n\n\tHelp resolve order discrepancies and logistical issues.\n\n\tCoordinate with internal teams to ensure orders are processed accurately and efficiently.\n\nAdministrative & Office Support\n\n\tProvide general administrative assistance to management and office staff.\n\n\tMaintain accurate electronic and physical filing systems.\n\n\tOrganize business documents, reports, and correspondence.\n\n\tUpdate spreadsheets, databases, and internal records.\n\n\tAssist with email communications and routine office coordination.\n\n\tFollow up on outstanding assignments and ensure deadlines are met.\n\n\tSupport daily office operations and assist with special projects as needed.\n\n\tHelp maintain an organized, efficient, and professional office environment.\n\nQualifications\n\n\tMinimum 2 years of previous office or administrative experience required.\n\n\tExperience with invoicing, data entry, or basic accounting responsibilities preferred.\n\n\tProficiency in Microsoft Excel, Outlook, and general computer applications.\n\n\tStrong numerical skills and attention to detail.\n\n\tExcellent organizational and time-management abilities.\n\n\tAbility to multitask, prioritize assignments, and meet deadlines.\n\n\tStrong communication and interpersonal skills.\n\n\tDependable, responsible, and able to work independently with minimal supervision.\n\n\tStrong problem-solving skills and willingness to take initiative.\n\n\tProfessional demeanor, positive attitude, and team-oriented mindset.\n\n\tAbility to maintain accurate records and handle confidential business information.\n\n\tExperience in wholesale, distribution, e-commerce, or logistics is a plus."}, {"id": "26909", "title": "Production Coordinator", "bhTitle": "Production Coordinator", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-20", "exp": "2027-01-20", "desc": "Location: New Jersey\nEmployment Type: Full-Time, On-Site\n\nPosition Overview\n\nA growing company is seeking an organized, detail-oriented, and dependable Production Coordinator to oversee and support daily production operations.\n\nThe ideal candidate has strong organizational skills, excellent communication abilities, and experience coordinating production schedules, managing orders, and communicating with vendors and internal teams.\n\nThis position requires someone who can manage multiple responsibilities, follow up on production timelines, and ensure projects are completed accurately and on schedule.\n\nPlease Note: This is an on-site position in New Jersey. No carpool transportation is available from Brooklyn, so candidates must arrange their own reliable transportation.\n\nKey Responsibilities\n\nProduction Coordination & Management\n\n\tCoordinate daily production activities and monitor production schedules.\n\n\tTrack orders from initial processing through completion and delivery.\n\n\tCommunicate with vendors, suppliers, and internal departments regarding production updates.\n\n\tMonitor production timelines and ensure deadlines are met.\n\n\tFollow up on outstanding orders, delays, and production-related issues.\n\n\tMaintain accurate production records, order details, and status reports.\n\n\tAssist with coordinating product samples, approvals, and revisions as needed.\n\n\tIdentify potential production delays and communicate concerns to management.\n\nVendor & Department Coordination\n\n\tMaintain regular communication with vendors and suppliers.\n\n\tCoordinate with purchasing, sales, logistics, and warehouse teams.\n\n\tEnsure production requirements, specifications, and deadlines are clearly communicated.\n\n\tTrack vendor updates and follow up on outstanding items.\n\n\tAssist with resolving order discrepancies and production challenges.\n\n\tSupport smooth communication between departments to ensure efficient operations.\n\nAdministrative & Operational Support\n\n\tMaintain organized spreadsheets, production reports, and order documentation.\n\n\tUpdate production tracking systems and internal records.\n\n\tAssist with preparing reports and monitoring production progress.\n\n\tEnsure accurate documentation of production changes and approvals.\n\n\tSupport management with operational tasks and special projects.\n\n\tHelp improve production workflows and overall efficiency.\n\nQualifications\n\n\tPrevious experience in production coordination, operations, purchasing, or a related field preferred.\n\n\tStrong organizational skills and attention to detail.\n\n\tExcellent communication and follow-up abilities.\n\n\tProficiency in Microsoft Excel and general computer applications.\n\n\tAbility to manage multiple projects and deadlines simultaneously.\n\n\tStrong problem-solving and time-management skills.\n\n\tComfortable communicating with vendors and internal departments.\n\n\tAbility to work independently and collaboratively.\n\n\tDependable, proactive, and comfortable in a fast-paced environment.\n\n\tReliable transportation to the New Jersey office required."}, {"id": "26908", "title": "Supply Chain Coordinator", "bhTitle": "Coordinator", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-20", "exp": "2027-01-20", "desc": "Location: New Jersey\nEmployment Type: Full-Time, On-Site\n\nPosition Overview\n\nA growing company in the consumer goods and general merchandise industry is seeking an experienced, highly organized, and detail-oriented Supply Chain Coordinator to join its New Jersey team.\n\nThis position is responsible for overseeing purchase orders from issuance through completion, coordinating domestic and international shipments, maintaining vendor relationships, and ensuring accurate purchasing and inventory records.\n\nThe Supply Chain Coordinator will serve as a key link between purchasing, logistics, operations, and finance, ensuring that purchase orders, warehouse receipts, vendor invoices, and associated costs are properly documented and reconciled.\n\nThe ideal candidate has a strong understanding of supply chain operations, purchasing processes, inventory costing, and basic accounting principles. This role requires exceptional attention to detail, advanced Excel skills, and the ability to manage multiple vendors and deadlines in a fast-paced environment.\n\nKey Responsibilities\n\nPurchasing & Purchase Order Management\n\n\tCreate, process, and maintain purchase orders using Microsoft Excel and the company's ERP/accounting system.\n\n\tSubmit purchase orders through customer and vendor portals as required.\n\n\tManage purchase orders from initial issuance through final reconciliation and closure.\n\n\tCommunicate with vendors regarding order confirmations, pricing, lead times, and expected delivery dates.\n\n\tMonitor outstanding purchase orders and proactively follow up on delays or discrepancies.\n\n\tReview and consolidate vendor responses to ensure accuracy and compliance with company requirements.\n\n\tMaintain organized records of purchase orders, vendor correspondence, pricing, and product information.\n\n\tCollaborate with sales, operations, and finance teams to ensure purchasing information remains accurate and current.\n\nLogistics & Shipment Coordination\n\n\tCoordinate inbound and outbound shipments with vendors, freight forwarders, carriers, customs brokers, and warehouse personnel.\n\n\tMonitor shipment progress and track deliveries through completion.\n\n\tReview shipping documents, including bills of lading, commercial invoices, packing lists, and customs documentation.\n\n\tEnsure incoming shipments are properly matched to the correct purchase orders.\n\n\tCommunicate with logistics partners to resolve shipping delays and delivery issues.\n\n\tMaintain accurate shipment records and documentation.\n\n\tAssist with coordinating international imports and related customs processes.\n\n\tWork closely with warehouse teams to verify received quantities and identify discrepancies.\n\nInventory Costing & Financial Reconciliation\n\n\tPerform and support three-way matching between purchase orders, receiving documentation, and vendor invoices.\n\n\tVerify quantities, unit prices, currencies, and payment terms for accuracy.\n\n\tReconcile warehouse receipts and customs entries with corresponding purchase orders and commercial invoices.\n\n\tInvestigate and resolve discrepancies involving pricing, damaged merchandise, shortages, overages, and duplicate invoices.\n\n\tCoordinate with vendors and warehouse teams to obtain corrections and credit memos.\n\n\tTrack landed costs, including freight, customs duties, brokerage fees, insurance, and other related expenses.\n\n\tAllocate applicable costs to purchase orders and SKUs to support accurate inventory valuation.\n\n\tReview freight, logistics, and customs broker invoices against approved quotes and agreements.\n\n\tForward properly matched and approved invoices to Accounts Payable with complete supporting documentation.\n\n\tMonitor invoice due dates and payment terms.\n\n\tTrack purchase price variances and communicate significant differences to the finance team.\n\nMonth-End Close & Reporting\n\n\tMonitor open purchase orders and identify outstanding or incomplete transactions.\n\n\tTrack goods received but not yet invoiced to support accurate accounting accruals.\n\n\tPrepare open purchase order reports and goods-in-transit listings.\n\n\tAssist the finance department with month-end closing procedures.\n\n\tEnsure completed purchase orders are properly reconciled and closed.\n\n\tInvestigate aged open items and outstanding invoice discrepancies.\n\n\tMaintain complete, organized, and audit-ready documentation for each purchase order.\n\n\tSupport financial accuracy by ensuring purchasing, inventory, and payment records remain consistent.\n\nQualifications\n\n\tMinimum 3 years of experience in supply chain coordination, purchasing, or product costing required.\n\n\tExperience within consumer goods, general merchandise, importing, or distribution strongly preferred.\n\n\tAdvanced Microsoft Excel proficiency required, including PivotTables and XLOOKUP.\n\n\tWorking knowledge of the purchase-to-pay process, including three-way matching, accruals, and basic accounting principles.\n\n\tExperience using ERP or accounting software, such as NetSuite, QuickBooks, or similar systems.\n\n\tFamiliarity with international shipping and import documentation, including bills of lading, commercial invoices, packing lists, and customs entries.\n\n\tUnderstanding of Incoterms and global supply chain logistics.\n\n\tKnowledge of inventory costing, landed costs, and purchasing reconciliation.\n\n\tExceptional organizational skills and attention to detail.\n\n\tStrong analytical and problem-solving abilities.\n\n\tExcellent written and verbal communication skills.\n\n\tAbility to manage multiple vendor relationships and coordinate across departments.\n\n\tComfortable working under tight deadlines, including month-end financial cutoffs.\n\n\tAbility to work independently while collaborating effectively with purchasing, operations, logistics, and finance teams."}, {"id": "26907", "title": "Office Driver & General Office Assistant", "bhTitle": "Assistant - Office Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-19", "exp": "2027-01-19", "desc": "Employment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nA company is seeking a responsible, trustworthy, and dependable Office Driver & General Office Assistant to support daily business operations.\n\nThis hands-on position combines driving, deliveries, transportation services, errands, and general administrative responsibilities.\n\nThe ideal candidate is organized, punctual, flexible, and willing to assist with a variety of tasks to ensure the office operates efficiently.\n\nKey Responsibilities\n\nDriving & Transportation\n\n\tDrive to various locations to complete company-related deliveries and pickups.\n\n\tTransport company personnel and other individuals safely and professionally as needed.\n\n\tPick up and deliver packages, documents, supplies, and other business-related items.\n\n\tComplete errands and miscellaneous tasks outside the office.\n\n\tPlan efficient routes and manage transportation schedules.\n\n\tEnsure all deliveries and pickups are completed accurately and on time.\n\n\tMaintain a professional and courteous attitude when transporting individuals or interacting with vendors.\n\nGeneral Office & Administrative Support\n\n\tAssist with general office responsibilities when not driving.\n\n\tOrganize, file, and maintain paperwork and business documents.\n\n\tHelp prepare, sort, and distribute documents and office materials.\n\n\tPerform basic computer work and administrative tasks.\n\n\tAssist with organizing office supplies and maintaining an orderly workspace.\n\n\tSupport staff with daily office projects and operational needs.\n\n\tHelp coordinate deliveries, pickups, and other logistical tasks.\n\n\tComplete additional assignments as directed by management.\n\nCommunication & Coordination\n\n\tCommunicate professionally with employees, customers, vendors, and other contacts.\n\n\tFollow written and verbal instructions accurately.\n\n\tProvide updates regarding deliveries, transportation, and assigned tasks.\n\n\tCoordinate with office staff to ensure daily responsibilities are completed efficiently.\n\n\tHandle company documents and information with discretion and confidentiality.\n\nQualifications\n\n\tValid driver's license and clean driving record required.\n\n\tResponsible, honest, trustworthy, and dependable.\n\n\tStrong reading, writing, and communication skills.\n\n\tComfortable following written instructions and handling basic paperwork.\n\n\tBasic computer skills and ability to perform general office tasks.\n\n\tStrong organizational and time-management abilities.\n\n\tPunctual, reliable, and detail-oriented.\n\n\tProfessional, courteous, and respectful when transporting individuals.\n\n\tAbility to work independently and manage multiple responsibilities.\n\n\tFlexible attitude and willingness to assist wherever needed.\n\n\tPrevious driving, delivery, or general office experience preferred but not required."}, {"id": "26906", "title": "Live Sales & E-Commerce Associate – Brooklyn, NY", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-10-19", "exp": "2027-01-14", "desc": "A Brooklyn-based company selling custom jewelry, toys, electronics, and more is looking for a motivated, tech-savvy individual to manage online sales through platforms such as Whatnot, TikTok Shop, and LiveSelling platforms.\n\nResponsibilities & Requirements:\n\n\tHost or assist with live selling sessions, including evening hours.\n\n\tManage online sales and e-commerce operations.\n\n\tMust have experience with online selling or e-commerce.\n\n\tMust be proficient in Excel.\n\n\tOpen to part-time or full-time candidates, including students available after school.\n\nLocation: Brooklyn, NY\nSchedule: Flexible, with evening hours available"}, {"id": "26905", "title": "Driver", "bhTitle": "Driver", "category": "Warehouse, Driving & Logistics", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-19", "exp": "2026-12-31", "desc": "We are seeking a reliable, professional, and highly discreet driver to provide transportation.\n\nQualifications:\n\n\tExcellent driving record and safe driving habits\n\n\tPunctual, dependable, and professional\n\n\tMust maintain the highest level of discretion and confidentiality\n\n\tRespectful of privacy and sensitive schedules\n\n\tFlexible with scheduling as needed\n\nSchedule can vary from day to day"}, {"id": "26904", "title": "Packaging Designer", "bhTitle": "Designer", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-19", "exp": "2027-01-04", "desc": "Job Description\nA fashion accessories/consumer products company in Midtown Manhattan is seeking an experienced and creative Packaging Designer to design packaging for hair accessories, handbags, gifting products, and more. The ideal candidate is detail-oriented and has a strong eye for design.\n\nPosition Type: Full-Time\nJob Hours: In-office 4 days per week, Work from home on Fridays\n\nEssential Duties & Responsibilities\n\n\tDesign packaging for hair accessories, including product cards and displays.\n\tDesign hang tags for handbags and other fashion accessories.\n\tCreate packaging for gift items and other products.\n\tDevelop creative, visually appealing designs while maintaining brand consistency.\n\tEnsure designs are accurate and detail-oriented.\n\tCollaborate with the team to develop packaging concepts and final designs.\n\nQualifications & Requirements\n\n\tMid- to senior-level packaging design experience.\n\tStrong creativity and attention to detail.\n\tExperience designing retail packaging, product cards, hang tags, or gift packaging.\n\tStrong understanding of layout, typography, and product presentation.\n\tAbility to manage multiple projects and meet deadlines."}, {"id": "26903", "title": "Livestream Host / On-Camera Sales Representative", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Part Time", "typeNote": "", "state": "NJ", "added": "2026-10-19", "exp": "2027-01-19", "desc": "Employment Type: Part-Time\nSchedule: Flexible, Approximately 3–5 Hours per Day\nPlatforms: TikTok Live, Whatnot & eBay Live\n\nPosition Overview\n\nA growing e-commerce company is seeking a fun, energetic, and outgoing Part-Time Livestream Host / On-Camera Sales Representative to lead engaging live shopping broadcasts across TikTok, Whatnot, eBay Live, and other live-commerce platforms.\n\nThe ideal candidate is confident on camera, enjoys interacting with people, and has the personality and enthusiasm to keep viewers entertained while showcasing products and driving sales.\n\nNo previous influencer or livestream hosting experience is required. Candidates with backgrounds in sales, retail, customer service, acting, or public speaking are encouraged to apply.\n\nThis is an excellent opportunity for someone who enjoys being on camera, has strong communication skills, and wants to develop a career in the growing live-commerce industry.\n\nKey Responsibilities\n\nLivestream Hosting & Product Demonstrations\n\n\tHost engaging live shopping broadcasts for approximately 3–5 hours per day.\n\n\tPresent, demonstrate, and discuss products in an entertaining and informative manner.\n\n\tExplain product features, benefits, and key selling points to viewers.\n\n\tMaintain a confident, energetic, and professional on-camera presence.\n\n\tCreate an enjoyable and welcoming livestream shopping experience.\n\n\tKeep broadcasts engaging through conversation, demonstrations, and audience interaction.\n\n\tLearn product details and communicate information clearly and accurately.\n\nAudience Engagement & Sales\n\n\tInteract with viewers and answer questions in real time.\n\n\tEncourage audience participation and build relationships with returning viewers.\n\n\tHighlight product promotions, special offers, and featured merchandise.\n\n\tHelp convert viewer interest into purchases through effective product presentations.\n\n\tRespond quickly and confidently to audience questions and comments.\n\n\tMaintain enthusiasm and audience engagement throughout extended broadcasts.\n\nTeam Collaboration & Performance\n\n\tCollaborate with the e-commerce and sales teams to prepare for livestream sessions.\n\n\tLearn about new products and upcoming promotions.\n\n\tAssist with developing creative ideas to improve livestream content and engagement.\n\n\tWork with team members to improve broadcast performance and sales results.\n\n\tProvide feedback on customer questions, product interest, and viewer engagement.\n\nQualifications\n\n\tOutgoing, confident, and energetic personality required.\n\n\tComfortable speaking on camera for extended periods.\n\n\tExcellent verbal communication and interpersonal skills.\n\n\tAbility to think quickly, engage viewers, and maintain entertaining conversations.\n\n\tStrong enthusiasm for products, sales, and customer interaction.\n\n\tDependable, punctual, and comfortable following a livestream schedule.\n\n\tAbility to learn product information and communicate key selling points.\n\n\tPrevious experience in sales, retail, customer service, acting, hosting, or public speaking is a plus.\n\n\tFamiliarity with TikTok, Instagram, Whatnot, eBay Live, or other livestream platforms is preferred but not required.\n\n\tWillingness to learn and adapt to new livestream techniques and sales strategies."}, {"id": "26902", "title": "Brand New Brooklyn location", "bhTitle": "Manager", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-19", "exp": "2026-12-31", "desc": "Discount Store looking to hire cahiers/ assistant manager.\n\n2 different shifts available."}, {"id": "26900", "title": "Nanny / House Assistant", "bhTitle": "Babysitter/Nanny", "category": "Education & Childcare", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-19", "exp": "2027-01-19", "desc": "Employment Type: Part-Time / Flexible\nSchedule: Monday, Tuesday & Thursday\nHours: Approximately 20–28 Hours per Week\n\nPosition Overview\n\nA family is seeking a warm, responsible, and experienced Nanny / House Assistant to provide childcare and assist with daily household responsibilities.\n\nThe primary focus of this position is caring for two children, ages 6 and 3½, with occasional assistance caring for an infant. The infant is primarily cared for by the family's housekeeper.\n\nIn addition to childcare, the nanny will help with grocery shopping, meal preparation, and household organization while the children are at school.\n\nThe ideal candidate is dependable, nurturing, organized, and comfortable balancing childcare with light household responsibilities.\n\nSchedule\n\nMonday, Tuesday & Thursday:\n\n\tTypical Hours: 12:00 PM–6:00/7:00 PM\n\n\tApproximately 20–28 hours per week.\n\n\tSome days may begin as late as 3:00 PM.\n\n\tSome evenings may end around 5:00 PM, while others may extend until 8:00 PM.\n\n\tFlexibility with scheduling is important.\n\nKey Responsibilities\n\nChildcare & Daily Routines\n\n\tProvide attentive, loving, and responsible care for children ages 6 and 3½.\n\n\tPick up children from school and assist with their afternoon routines.\n\n\tPrepare and serve dinner for the children.\n\n\tAssist with bath time and evening routines.\n\n\tPlan engaging, age-appropriate activities, games, and creative projects.\n\n\tEncourage positive behavior, independence, and age-appropriate development.\n\n\tOccasionally assist with infant care when needed.\n\n\tMaintain a safe, nurturing, and supportive environment for the children.\n\nHousehold Assistance\n\n\tAssist with grocery shopping and household errands.\n\n\tHelp with cooking and meal preparation for the family.\n\n\tOrganize household items and maintain tidy living spaces.\n\n\tAssist with general household organization and daily upkeep.\n\n\tComplete household tasks while the children are at school.\n\n\tCoordinate with the family and housekeeper to ensure daily routines run smoothly.\n\nQualifications\n\n\tPrevious childcare or nanny experience required.\n\n\tExperience caring for preschool and school-aged children.\n\n\tWarm, patient, nurturing, and responsible personality.\n\n\tStrong organizational and time-management skills.\n\n\tComfortable assisting with cooking, groceries, and household organization.\n\n\tAbility to manage multiple responsibilities efficiently.\n\n\tDependable, punctual, and trustworthy.\n\n\tGood communication skills and ability to follow family routines.\n\n\tFlexibility with working hours and occasional schedule adjustments.\n\n\tExperience caring for infants is a plus."}, {"id": "26899", "title": "Job Description: Full Time Early Intervention and CPSE Intake Coordinator", "bhTitle": "Intake", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-16", "exp": "2026-12-31", "desc": "-Hours: Monday-Thursday 8:30-4:30 pm Friday 8:30-230 pm\n\nPosition Overview: We are seeking an organized, compassionate professional to coordinate intake, referrals, evaluations, and meetings for children and families receiving Early Intervention (EI) and Committee on Preschool Special Education (CPSE) services. The ideal candidate will have a background in education, social work, or a related clinical field.\n\n\tKey Responsibilities\n\n\tRespond to family and referral inquiries and guide families through the intake process.\n\tCoordinate multidisciplinary evaluations (MDEs), IFSP meetings, and IEP meetings with families, providers, evaluators, and schools.\n\tConduct evaluations and participate in meetings as permitted by professional credentials and program requirements.\n\tConduct school observations as needed.\n\tCollect and maintain intake forms, medical records, consents, and other required documentation.\n\tTrack deadlines and ensure timely completion of evaluations and paperwork.\n\tServe as a liaison among families, providers, schools, and case managers.\n\tMaintain confidentiality and compliance with applicable regulations.\n\tProvide ongoing guidance and support to families throughout the intake process.\n\n\tQualifications\n\n\tDegree in Special Education, Social Work, Occupational Therapy, Speech-Language Pathology, Physical Therapy, or  School Psychology.\n\t5 Years' experience in early childhood education, special education, or a related setting.\n\tFamiliarity with EI/CPSE services, including home- and school-based programs.\n\tStrong communication, organizational, scheduling, and time-management skills.\n\tAbility to manage sensitive information confidentially and maintain accurate records.\n\tIntake, scheduling, or coordination experience preferred.\n\tBilingual candidates are a plus.\n\n\tTraining Provided\n\tJoin a team dedicated to supporting children and families in accessing appropriate developmental and educational services."}, {"id": "26898", "title": "Job Description: Full Time School Curriculum Coordinator", "bhTitle": "Coordinator", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-16", "exp": "2026-12-31", "desc": "Hours: Monday-Thursday 8:30-4:30 pm Friday 8:30-2:30 pm\nPosition Overview: The School Curriculum Coordinator supports the daily operations, educational programming, and overall success of the school. Working closely with teachers, classroom assistants, related service providers, and school leadership, this individual ensures that classrooms are appropriately staffed, educational standards are maintained, and staff receive the guidance and resources they need to succeed. This is a hands-on leadership role requiring flexibility, initiative, and strong organizational and interpersonal skills.\nKey Responsibilities\n\n\tCurriculum & Instruction: Coordinate curriculum planning meetings, support alignment with Common Core State Standards, facilitate curriculum updates and STEAM initiatives, and review lesson plans, progress reports, and any other teacher documentation.\n\tDaily Operations & Coverage: Oversee arrivals and dismissals; coordinate substitute assignments and assistant coverage; reassign staff as needed; and provide direct classroom coverage to ensure every classroom has appropriate support.\n\tTeacher Support & Observations: Support teachers with curriculum implementation, classroom setup, behavior management, and other areas of need. Conduct classroom observations, provide constructive feedback, and follow up to support professional growth.\n\tStaff Training & Supervision: Facilitate professional development and trainings for teachers and assistants, supervise and train classroom assistants, and lead assistant PD meetings.\n\tSchool Events & Communication: Coordinate with teachers on parent events and special activities, and promote effective communication and collaboration among staff and leadership.\n\tMaterials & Resources: Coordinate classroom supplies, educational materials, resources, and food orders to meet the needs of the school.\n\tAdditional Responsibilities: Proactively respond to changing priorities and take on other responsibilities as needed to ensure the smooth and effective functioning of the school.\n\nQualifications & Skills\nRequired Qualification: NYS Special Education Teaching Certification (Birth–Grade 2).\n\n\tExperience in education, school administration, curriculum coordination, or a related field.\n\tStrong leadership, organizational, communication, and problem-solving skills.\n\tKnowledge of curriculum planning, instructional practices, and classroom management.\n\t12 days PTO"}, {"id": "26897", "title": "Office Assistant", "bhTitle": "Assistant - Office Assistant", "category": "Administrative & Office", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-15", "exp": "2027-01-18", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\nSchedule: Sundays + 2–3 Additional Days per Week\nHours: 10:00 AM–7:00 PM or 11:00 AM–7:00 PM\n\nPosition Overview\n\nA busy eye doctor's office in Boro Park is seeking a friendly, dependable, and organized Office Assistant to help with daily administrative responsibilities, customer service, insurance-related tasks, and data entry.\n\nThe office also sells eyeglasses and lenses, providing an opportunity to assist customers with their eyewear needs.\n\nThis is an excellent opportunity for someone looking for a part-time position in a pleasant and welcoming office environment. Training can be provided, and college students are welcome to apply.\n\nThe office may consider hiring two candidates to alternate workdays.\n\nKey Responsibilities\n\nFront Desk & Customer Service\n\n\tAnswer incoming phone calls and assist patients and customers professionally.\n\n\tGreet visitors and provide a friendly, welcoming experience.\n\n\tRespond to general inquiries and direct questions to the appropriate staff members.\n\n\tAssist with basic front desk and office responsibilities.\n\n\tHelp maintain an organized and efficient office environment.\n\nAdministrative & Insurance Support\n\n\tPerform basic computer work and data entry.\n\n\tEnter, update, and maintain accurate patient and customer information.\n\n\tAssist with insurance-related paperwork and administrative tasks.\n\n\tOrganize documents and maintain office records.\n\n\tSupport staff with general administrative duties as needed.\n\n\tEnsure information is handled accurately and confidentially.\n\nEyewear & Optical Assistance\n\n\tAssist customers interested in purchasing eyeglasses and lenses.\n\n\tProvide basic information about available eyewear products.\n\n\tHelp customers with general questions regarding glasses and lenses.\n\n\tCoordinate with office staff to ensure customers receive appropriate assistance.\n\n\tSupport the daily operations of the office's eyewear sales area.\n\nQualifications\n\n\tBasic computer and data entry skills required.\n\n\tGood communication and telephone skills.\n\n\tFriendly, professional, and customer-service-oriented attitude.\n\n\tStrong organizational skills and attention to detail.\n\n\tDependable, punctual, and responsible.\n\n\tWillingness to learn new office procedures and systems.\n\n\tAbility to multitask in a busy office environment.\n\n\tPrevious office, receptionist, or customer service experience preferred but not required.\n\n\tExperience with insurance or optical office operations is a plus.\n\n\tCollege students are welcome to apply."}, {"id": "26895", "title": "IT Developer Role", "bhTitle": "Computers IT", "category": "Technology & IT", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-15", "exp": "2027-01-04", "desc": "On-site Brooklyn, NY for the first 3-4 months with an opportunity to be hybrid after that. Reports to the HR Director with a dotted line reporting to the Chief Information Officer.\n\nWe are seeking a skilled, detail-oriented Internal Applications Developer to help build and maintain the internal software that supports our organization's business, HR, payroll, finance, and administrative operations.\nIn this role, you will design and develop custom web applications, internal tools, and reliable data integrations. A primary focus will be connecting our internal budget, financial and employee systems with core enterprise platforms, including ADP Payroll and NetSuite Financials.\n\nThe ideal candidate has a strong foundation in software development and systems logic, enjoys building intuitive tools for internal users, and cares deeply about data correctness, security, and system reliability. The position works the same schedule as the Business Office staff working 12 months a year and through the summer months.\n\nKey Responsibilities\n\n\tCustom Application Development: Design, prototype, and build homegrown web applications and internal utilities to streamline HR, payroll, finance, and business office workflows.\n\tAPI Integration & Architecture: Build, test, and maintain secure, reliable API integrations between our custom Student Information System (SIS), ADP, NetSuite, and other internal systems.\n\tData Validation & Reliability: Develop automated validation processes to help ensure employee, payroll, and financial data syncs accurately without duplicate entries, missing fields, or data loss.\n\tDatabase Management: Write efficient queries, manage database schemas, and map data across multiple systems.\n\tUser-Centric Tooling: Work closely with HR, finance, and administrative staff to translate business requirements into clean, practical dashboards, forms, reports, and workflows.\n\tSecurity & Auditability: Help ensure internal applications include appropriate permissions, logging, and audit trails for sensitive HR, payroll, budget, financial, and employee systems.\n\tSupport & Maintenance: Troubleshoot bugs, investigate data issues, improve existing tools, and provide technical support to internal users.\n\nQualifications & Skills\n\n\t2-3 years' experience working in a business/office environment in an application development role\n\tStrong experience with C# and the .NET platform (.NET Core / .NET 8), and modern web application development.\n\tExperience building web applications and services with ASP.NET Core (MVC, Razor Pages, or Web API).\n\tExperience working with relational databases, especially Microsoft SQL Server, including writing efficient T-SQL queries and working with stored procedures.\n\tExperience working with REST APIs, webhooks, JSON data structures, and third-party integrations.\n\tWorking knowledge of front-end web fundamentals (HTML, CSS, and JavaScript) for building clean, usable interfaces.\n\tUnderstanding of data integrity, validation, error handling, and reliable system design.\n\tAbility to collaborate with nontechnical stakeholders, gather requirements, and explain technical concepts clearly.\n\tStrong attention to detail, especially when working with sensitive or business-critical data.\n\tB.S. in Computer Science or a related field, or equivalent practical experience in software development.\n\nPreferred Qualifications\n\n\tExperience with ADP, NetSuite, payroll systems, ERP systems, HR systems, or school administration software.\n\tExperience building internal business applications, dashboards, approval workflows, or reporting tools.\n\tExperience hosting and deploying applications on IIS / Windows Server, and familiarity with Git for version control.\n\tFamiliarity with data-access approaches such as ADO.NET or Entity Framework Core.\n\tExperience modernizing or migrating older .NET applications (for example, Web Forms to ASP.NET Core) — a plus, as we are actively modernizing our systems.\n\tFamiliarity with authentication, role-based permissions, audit logs, and data privacy best practices.\n\tExperience with cloud platforms, scheduled jobs, background workers, or data pipeline tools.\n\nWe are an Equal Employment Opportunity employer offering:\n\n\tComprehensive benefits package\n\tA 403(b) retirement plan with a 5% company match\n\tTuition Reimbursement\n\tSchool paid lunch.\n\tContinuous school-wide Professional Development\n\tThe school year is consistent with the Jewish calendar and closed during the summer."}, {"id": "26894", "title": "Product Development Coordinator", "bhTitle": "Product Development", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-15", "exp": "2027-01-18", "desc": "Employment Type: Full-Time\nExperience Required: Minimum 2 Years\n\nPosition Overview\n\nA growing company specializing in consumer products is seeking a motivated, detail-oriented, and organized Product Development Coordinator to join its team.\n\nThe ideal candidate has at least 2 years of product development experience, preferably within the consumer products, apparel, or accessories industries.\n\nThis role involves coordinating the product development process from initial concept through production, communicating with overseas factories and vendors, managing samples, and ensuring that product timelines and specifications are met.\n\nThe successful candidate will be proactive, highly organized, and comfortable managing multiple projects in a fast-paced environment.\n\nKey Responsibilities\n\nProduct Development & Coordination\n\n\tAssist in developing new products from initial concept through production.\n\n\tCoordinate product development activities with overseas factories, vendors, and internal departments.\n\n\tManage product samples, revisions, approvals, and development updates.\n\n\tTrack product development timelines and ensure key deadlines are met.\n\n\tMaintain accurate product specifications, costing information, and development records.\n\n\tAssist with reviewing product quality, materials, packaging, and specifications.\n\n\tFollow up with factories and suppliers regarding product updates, changes, and outstanding requirements.\n\n\tHelp identify and resolve product development issues to keep projects moving forward.\n\nVendor & Factory Communication\n\n\tCommunicate regularly with overseas factories and suppliers regarding product development.\n\n\tCoordinate sample requests, revisions, and approvals.\n\n\tMonitor production readiness and ensure product specifications are clearly communicated.\n\n\tMaintain organized records of vendor correspondence and development progress.\n\n\tWork closely with suppliers to address delays, discrepancies, and product-related concerns.\n\nCross-Functional Collaboration & Market Research\n\n\tCollaborate with design, sales, and production teams throughout the development process.\n\n\tResearch market trends, emerging products, and competitive offerings.\n\n\tAssist in identifying new product opportunities and improvements.\n\n\tSupport the preparation of product presentations, specifications, and development materials.\n\n\tEnsure internal teams remain informed of project updates and deadlines.\n\nQualifications\n\n\tMinimum 2 years of product development experience required.\n\n\tExperience in consumer products, apparel, or accessories preferred.\n\n\tExperience coordinating with overseas factories and vendors is a plus.\n\n\tStrong organizational skills and exceptional attention to detail.\n\n\tExcellent communication, coordination, and follow-up abilities.\n\n\tProficiency in Microsoft Excel and Outlook.\n\n\tAbility to manage multiple projects and priorities simultaneously.\n\n\tStrong problem-solving skills and ability to meet deadlines.\n\n\tComfortable working in a fast-paced, deadline-driven environment.\n\n\tAbility to work independently while collaborating effectively with internal teams.\n\n\tProactive, dependable, and eager to contribute to a growing organization."}, {"id": "26893", "title": "Accounts Payable Associate", "bhTitle": "Accounts Payable", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-15", "exp": "2027-10-18", "desc": "Location: New York, NY\nEmployment Type: Full-Time, Hybrid\nSchedule: Monday–Friday | 3 Days In-Office, 2 Days Remote\n\nPosition Overview\n\nA well-established nonprofit organization is seeking a detail-oriented, dependable, and organized Accounts Payable Associate to join its finance team.\n\nThis position is responsible for ensuring the accurate and timely processing of vendor invoices, maintaining financial records, and supporting the organization's day-to-day accounting operations.\n\nIn addition to accounts payable responsibilities, the associate will provide occasional executive and administrative support to the accounting department's leadership team.\n\nThe ideal candidate is proactive, highly organized, comfortable using accounting software, and able to handle confidential information with professionalism and discretion.\n\nKey Responsibilities\n\nAccounts Payable & Accounting Operations\n\n\tProcess vendor invoices accurately and efficiently using NetSuite.\n\n\tMatch invoices with receipts and verify supporting documentation and approvals.\n\n\tPrepare and process weekly payments, including check printing, ACH transfers, and wire payments.\n\n\tAssist with foreign exchange rate reconciliations.\n\n\tMaintain accurate vendor records, invoices, and payment documentation.\n\n\tReconcile vendor statements and investigate billing discrepancies.\n\n\tRespond professionally to vendor inquiries regarding invoices and payments.\n\n\tIdentify and escalate duplicate payments, unusual transactions, or discrepancies.\n\n\tEnsure compliance with internal accounting controls and nonprofit financial policies.\n\n\tCollaborate with internal departments to ensure timely payment processing.\n\n\tAssist with additional accounting and reconciliation tasks as needed.\n\nExecutive & Administrative Support\n\n\tProvide occasional executive assistant support to accounting department leadership.\n\n\tCoordinate meetings, appointments, and departmental schedules.\n\n\tAssist with calendar management and internal communications.\n\n\tPrepare reports, spreadsheets, presentations, and supporting materials.\n\n\tHelp organize departmental initiatives and administrative projects.\n\n\tMaintain confidentiality when handling sensitive financial and organizational information.\n\n\tSupport additional administrative responsibilities as needed.\n\nQualifications\n\n\tHigh school diploma or equivalent required.\n\n\tAssociate or bachelor's degree in Accounting, Finance, or a related field preferred.\n\n\t1–3 years of accounts payable or general accounting experience.\n\n\tExperience with NetSuite preferred.\n\n\tPrevious nonprofit accounting experience is a plus.\n\n\tProficiency in Microsoft Excel and other Microsoft Office applications.\n\n\tStrong attention to detail, accuracy, and organizational skills.\n\n\tAbility to learn new accounting software and systems quickly.\n\n\tExcellent written and verbal communication skills.\n\n\tAbility to manage multiple responsibilities and meet deadlines.\n\n\tProfessional, dependable, and comfortable working independently and collaboratively.\n\n\tAbility to maintain confidentiality and exercise discretion."}, {"id": "26892", "title": "Computer Science / Technology Instructor – High School", "bhTitle": "Computer Programmer", "category": "Technology & IT", "type": "Part Time", "typeNote": "", "state": "NJ", "added": "2026-10-14", "exp": "2027-01-14", "desc": "Employment Type: Part-Time\nSchedule: Thursdays\n\nPosition Overview\n\nA high school is seeking a knowledgeable, enthusiastic, and engaging Computer Science / Technology Instructor to teach weekly computer classes to 9th and 10th grade students.\n\nThe ideal candidate is passionate about technology, enjoys working with high school students, and can make computer-related subjects interesting, interactive, and accessible.\n\nThere is also an opportunity to lead an additional after-school technology club focused on coding, computer projects, or other hands-on activities.\n\nSchedule\n\nThursdays:\n\n\t10th Grade: 1:20 PM–2:00 PM\n\n\t9th Grade: 2:05 PM–2:45 PM\n\n\tOptional Technology Club: 3:05 PM–3:50 PM\n\nKey Responsibilities\n\nComputer & Technology Instruction\n\n\tTeach engaging and age-appropriate computer classes to 9th and 10th grade students.\n\n\tIntroduce students to practical computer skills, technology concepts, and digital literacy.\n\n\tDevelop interactive lessons that encourage participation and hands-on learning.\n\n\tExplain technical concepts in a clear, approachable, and engaging manner.\n\n\tAdapt instruction to accommodate varying levels of computer knowledge and experience.\n\n\tMaintain a positive, structured, and productive classroom environment.\n\n\tEncourage curiosity, creativity, and problem-solving through technology.\n\nOptional After-School Technology Club\n\n\tLead an optional computer-related club following regular classes.\n\n\tIntroduce students to coding, programming, and technology-based projects.\n\n\tOrganize interactive activities that promote creativity and technical skills.\n\n\tDevelop engaging projects that allow students to apply what they have learned.\n\n\tExplore topics such as computer programming, digital design, or other technology-related interests.\n\nQualifications\n\n\tStrong knowledge of computers, technology, or computer science.\n\n\tPrevious teaching, tutoring, or instructional experience preferred.\n\n\tComfortable teaching and engaging high school students.\n\n\tAbility to explain technical concepts clearly and effectively.\n\n\tStrong classroom management and communication skills.\n\n\tCreative, patient, enthusiastic, and dependable.\n\n\tExperience with coding or computer programming is a plus.\n\n\tAbility to develop interactive and hands-on learning activities.\n\n\tAvailability on Thursdays during the scheduled class periods."}, {"id": "26891", "title": "Shipping and Order Routing Coordinator", "bhTitle": "Warehouse- Shipping", "category": "Warehouse, Driving & Logistics", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-14", "exp": "2027-01-14", "desc": "Location: Oakhurst, NJ\nJob Type: Full Time\nSchedule: Typical Office Hours\n\nWe are seeking an organized, detail-oriented person to handle order routing and shipping for our wholesale company. The ideal candidate has experience with EDI, retailer shipping requirements, and coordinating wholesale orders.\nKey Responsibilities:\n\n\tProcess wholesale orders and arrange shipments according to customer routing instructions.\n\tWork with EDI orders, advance ship notices (ASNs), and shipping documents.\n\tFollow retailer requirements for labeling, packaging, delivery appointments, and shipping deadlines.\n\tSchedule pickups with carriers and freight companies.\n\tCoordinate with warehouse, sales, and customer service staff to resolve shipping issues.\n\tTrack shipments, maintain accurate records, and help prevent shipping errors and chargebacks.\n\nQualifications:\n\n\tPrevious experience in wholesale shipping, order routing, or logistics.\n\tFamiliarity with EDI systems and retailer routing guides.\n\tStrong attention to detail and organizational skills.\n\tAbility to handle multiple orders and meet deadlines.\n\tBasic computer skills, including Microsoft Excel, with experience in order management software preferred.\n\nWhat We Offer:\n\n\tComprehensive benefits.\n\tOpportunities for growth within a collaborative wholesale environment."}, {"id": "26890", "title": "Associate Attorney", "bhTitle": "Attorney", "category": "Legal", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-14", "exp": "2027-01-14", "desc": "Employment Type: Full-Time\nExperience Level: Experienced Associate / Lateral Hire\n\nPosition Overview\n\nAn established law firm is seeking qualified Associate Attorneys to join its legal team through lateral hiring.\n\nThe firm is interested in experienced attorneys from the Class of 2023 or earlier who are looking to advance their legal careers in a professional and collaborative environment.\n\nCandidates will have the opportunity to meet with current attorneys as part of the initial screening and evaluation process.\n\nPlease note: This position is intended for experienced attorneys. Recent law school graduates are not being considered at this time.\n\nKey Responsibilities\n\n\tHandle legal research, analysis, and drafting assignments.\n\n\tDraft, review, and revise legal documents, agreements, motions, and correspondence as applicable.\n\n\tAssist with managing client matters and ongoing legal projects.\n\n\tCommunicate professionally with clients, colleagues, and other parties.\n\n\tCollaborate with partners and senior attorneys on legal matters.\n\n\tManage multiple assignments while meeting deadlines.\n\n\tProvide thoughtful legal analysis and practical recommendations.\n\n\tMaintain high standards of professionalism, confidentiality, and attention to detail.\n\nQualifications\n\n\tJuris Doctor (J.D.) degree from an accredited law school required.\n\n\tLaw school graduating Class of 2023 or earlier.\n\n\tPrior experience practicing law in a law firm or comparable legal environment.\n\n\tStrong legal research, writing, and analytical skills.\n\n\tExcellent communication and interpersonal abilities.\n\n\tAbility to manage assignments independently and collaborate with other attorneys.\n\n\tStrong organizational skills and attention to detail.\n\n\tProfessional judgment and commitment to high-quality legal work.\n\n\tAppropriate bar admission or eligibility for admission, depending on the firm's requirements."}, {"id": "26889", "title": "Social Media Manager", "bhTitle": "Social Media Manager", "category": "E-commerce, Marketing & Social Media", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-14", "exp": "2027-01-14", "desc": "Employment Type: Part-Time, Hybrid\nWork Arrangement: In-Office / Remote\nSchedule: Approximately 10–15 Hours per Week\n\nPosition Overview\n\nA community-based mental health agency is seeking a creative, experienced, and detail-oriented Social Media Manager to develop engaging educational videos and professional marketing materials.\n\nThe ideal candidate has a strong eye for branding, experience filming and editing short-form video content, and the ability to create visually appealing graphics for social media and digital marketing campaigns.\n\nThis position offers a flexible hybrid schedule and the opportunity to contribute to meaningful mental health education and community outreach initiatives.\n\nKey Responsibilities\n\nVideo Production & Social Media Content\n\n\tFilm and edit short-form educational videos for Instagram and other social media platforms.\n\n\tCreate engaging Instagram Reels and other video content focused on mental health awareness and education.\n\n\tCapture professional-quality video using an iPhone or other filming equipment.\n\n\tEdit videos to ensure clear messaging, professional presentation, and strong visual appeal.\n\n\tDevelop creative content ideas that align with the agency's mission and branding.\n\n\tCollaborate with team members to plan and produce educational content.\n\n\tEnsure all videos maintain a consistent and professional brand image.\n\nGraphic Design & Digital Marketing\n\n\tDesign attractive and professional advertisement graphics for email and text message campaigns.\n\n\tCreate branded promotional materials for community programs, events, and educational initiatives.\n\n\tUse Canva to develop visually appealing graphics and marketing content.\n\n\tMaintain consistent branding across social media, email campaigns, and digital advertisements.\n\n\tAssist with creative marketing projects and promotional initiatives as needed.\n\nBranding & Content Development\n\n\tDevelop creative ideas to strengthen the agency's digital presence.\n\n\tEnsure all content is visually consistent, informative, and appropriate for a mental health organization.\n\n\tStay current with Instagram trends, short-form video formats, and digital content strategies.\n\n\tWork collaboratively with agency leadership to communicate important educational messages.\n\n\tOrganize content projects and complete assignments within established deadlines.\n\nQualifications\n\n\tPrevious experience in social media management, content creation, or digital marketing required.\n\n\tProficiency in Canva and Instagram required.\n\n\tExperience filming and editing short-form videos required.\n\n\tAbility to produce professional-quality video content using an iPhone or similar equipment.\n\n\tStrong creative abilities and an excellent eye for branding, design, and visual presentation.\n\n\tExperience creating advertisement graphics and promotional materials.\n\n\tFamiliarity with Instagram Reels and current social media trends.\n\n\tStrong attention to detail and organizational skills.\n\n\tAbility to work independently and manage multiple creative projects.\n\n\tExcellent communication and collaboration skills.\n\n\tInterest in mental health education, community outreach, or nonprofit work preferred."}, {"id": "26888", "title": "Intake Coordinator", "bhTitle": "Intake", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-14", "exp": "2027-01-14", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time, In-Person\nSchedule: Monday–Friday,\n\nPosition Overview\n\nA growing organization in Brooklyn is seeking a motivated, personable, and detail-oriented Intake Coordinator to join its team.\n\nThis is an excellent opportunity for someone who enjoys working with people, providing excellent client service, and maintaining organized administrative processes.\n\nThe Intake Coordinator will be responsible for communicating with clients, assisting with intake paperwork, preparing documentation, and ensuring a smooth and efficient intake process.\n\nThe ideal candidate is friendly, organized, professional, and eager to learn and grow within a supportive office environment.\n\nKey Responsibilities\n\nClient Intake & Coordination\n\n\tCommunicate and coordinate with clients on a daily basis.\n\n\tGuide clients through the intake process and explain required forms and documentation.\n\n\tAssist clients with completing necessary paperwork accurately and efficiently.\n\n\tRespond to client inquiries and provide professional, helpful assistance.\n\n\tFollow up with clients regarding missing information or outstanding documentation.\n\n\tBuild and maintain positive, supportive relationships with clients.\n\n\tEnsure clients receive a welcoming and professional experience throughout the intake process.\n\nDocumentation & Administrative Support\n\n\tPrepare, review, and submit intake documents accurately and on time.\n\n\tMaintain organized and up-to-date client records.\n\n\tEnter and update client information in internal systems.\n\n\tReview paperwork for completeness and accuracy.\n\n\tTrack pending documentation and follow up as needed.\n\n\tCoordinate with internal team members to ensure efficient processing.\n\n\tAssist with general administrative and office responsibilities.\n\nQualifications\n\n\tEntry-level candidates are welcome to apply.\n\n\tExcellent verbal and written
