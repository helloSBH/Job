n• Experience with Amazon advertising/PPC, listing optimization, SEO, catalog management, promotions, and marketplace analytics.\n• Experience managing or supporting direct-to-consumer e-commerce websites.\n• Strong analytical skills and the ability to understand product-level economics and profitability.\n• Strong Excel skills and comfort working with reporting, dashboards, and e-commerce data.\n• Experience with Shopify or similar e-commerce platforms is a plus.\n• Comfort using AI, automation, and modern digital tools to improve performance and efficiency.\n• Strong communication, organizational, and project-management skills.\n• Entrepreneurial, proactive, and ownership-oriented mindset with the ability to work independently and\ncross-functionally.\n• Experience with consumer products, home decor, lighting, seasonal products, or related categories is a plus.\n• Bachelor's degree preferred; strong relevant experience may be considered in place of a degree.\n\nCompensation, Benefits & Growth\n• Health insurance and company benefits.\n• Paid time off (PTO).\n• 401(k) program.\n• Company-sponsored learning and professional development opportunities.\n• Opportunity to build and shape a growing e-commerce business.\n• Career growth potential as the channel expands, including the opportunity to take on broader leadership\nresponsibility.\n\nWork Environment\nThis is a full-time, in-office position based in Woodbridge, New Jersey. We believe this role benefits from close collaboration with our product, design, operations, and management teams, particularly as new products are developed and launched across our e-commerce channels.\n\nWhy Join Us?\nThis is an opportunity to step into a meaningful role with the ability to influence strategy and results. You will have access to a broad pipeline of products, work directly with the teams developing them, and have the freedom and responsibility to help build the next stage of our e-commerce business."}, {"id": "26704", "title": "National Account Executive", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-08-31", "exp": "2026-12-01", "desc": "We are a growing designer, manufacturer, and importer of home décor, lighting, and consumer accessories. Headquartered in Woodbridge, New Jersey, with showroom offices in New York City, we develop innovative products and retail programs for major retailers across multiple channels. As we continue to expand our customer base and product portfolio, we offer an entrepreneurial, fast-paced environment with opportunities for professional growth and advancement.\n\nThe Opportunity\nWe are seeking a motivated National Account Executive to help drive new retail business while managing and growing customer relationships. This is an excellent opportunity for an experienced retail salesperson or a high-potential candidate eager to learn. We are willing to train the right person and welcome candidates who bring established sales and account-management experience. Experience in home decor, lighting, accessories, or related consumer products is especially valuable. With a broad potential customer base and significant room for new account development, the earning and growth opportunity is substantial.\n\nKey Responsibilities\n• Prospect, identify, and open new retail accounts across multiple channels.\n• Build a consistent pipeline through outbound prospecting, relationship development, and follow-up.\n• Manage, service, and grow assigned retail accounts.\n• Present product assortments, new programs, and seasonal opportunities to buyers and retail partners.\n• Prepare sales proposals and work toward individual and company revenue goals.\n• Develop strong knowledge of our products, brands, retail programs, and competitive landscape.\n• Maintain organized customer information, opportunities, and follow-up activity in the company's CRM and sales systems.\n• Collaborate with product development, design, operations, and management to support customer needs and close business.\n• Attend customer meetings on-site when necessary.\n• Represent the company at occasional industry trade shows and customer events.\n\nQualifications\n• Strong communication, presentation, relationship-building, and follow-through skills.\n• Comfortable with proactive outbound prospecting and developing new business.\n• Self-motivated, organized, coachable, and able to work in a fast-paced entrepreneurial environment.\n• Experience managing and growing retail accounts is a plus.\n• Experience selling home decor, lighting, accessories, or other consumer products is strongly preferred.\n• Retail sales experience is helpful but not required for a high-potential candidate with the right drive and aptitude.\n• Ability and willingness to travel occasionally for retailer meetings and trade shows.\n• Strong, above-market uncapped commission structure.\n• Health care benefits.\n• 401(k) program.\n• Paid time off (PTO).\n• Company-sponsored learning and professional development.\n\nWhy Join Us?\nThis is an opportunity to join a growing business with a large addressable retail market and meaningful room for individual impact. For the right person, this\nrole offers both immediate earning potential and long-term career growth."}, {"id": "26701", "title": "Hallway/Lunchroom Monitor", "bhTitle": "Hallway Monitor", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-08-27", "exp": "", "desc": "Location: Ocean, NJ\nJob Type: Full-time\nSchedule: Follows the school calendar, including daily start and end times, faculty meetings, and staff in-service days\n\nWe are seeking 2 dedicated and reliable Hallway/Lunchroom Monitors to join our team. This role is essential in ensuring a safe, structured, and respectful environment for our students throughout the school day.\n\nKey Responsibilities:\n\n\tSupervise students in various areas of the school, including hallways, restrooms, cafeteria, learning center, and during field trips.\n\n\tDevelop and maintain positive relationships with students, faculty, staff, and coworkers.\n\n\tMonitor student hallway behavior to ensure a safe and respectful school environment.\n\n\tAssist with additional duties as assigned by the Head of School.\n\nQualifications:\n\n\tAbility to supervise and engage with students in a firm yet supportive manner.\n\n\tStrong communication and interpersonal skills.\n\n\tHigh school diploma or equivalent (preferred).\n\n\tAbility to follow school policies, schedules, and safety protocols.\n\nWhat We Offer:\n\n\tSchedule aligned with the traditional school calendar.\n\n\tSupportive school community and collaborative work environment.\n\n\tProfessional development opportunities during staff in-service days."}, {"id": "26695", "title": "Business Funding Sales Representative", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-26", "exp": "2026-11-26", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nA growing business funding company in Brooklyn, NY is seeking a motivated and results-driven Sales Representative to join its team.\n\nThis position is focused on connecting with small and mid-sized business owners who are seeking access to capital. The company provides leads, training, and ongoing support, making this an opportunity for candidates with strong communication skills and a desire to build a career in sales.\n\nNo previous business funding experience or college degree is required. Sales experience is helpful, but work ethic, communication skills, consistency, and willingness to learn are most important.\n\nKey Responsibilities\n\n\tSpeak with small and mid-sized business owners seeking access to capital.\n\tWork with company-provided leads and develop relationships with prospective clients.\n\tLearn about each client's business and understand their funding needs.\n\tHelp identify appropriate financing solutions based on available options.\n\tExplain the funding process clearly and professionally to prospective clients.\n\tFollow up consistently with leads and prospects throughout the sales process.\n\tBuild and maintain an organized pipeline of potential clients.\n\tMaintain accurate records of client conversations, follow-ups, and opportunities.\n\tWork closely with the internal team to move qualified opportunities through the funding process.\n\tDevelop strong, professional relationships with business owners.\n\tMaintain consistent outreach and follow-up activity.\n\tWork toward established individual sales and performance goals.\n\tParticipate in training and continue developing knowledge of business funding products and sales techniques.\n\nQualifications\n\n\tNo previous business funding experience required.\n\tNo college degree required.\n\tPrevious sales, customer service, call center, business development, or phone-based experience is a plus.\n\tStrong verbal communication and interpersonal skills.\n\tComfortable spending a significant portion of the workday on the phone.\n\tConfident communicating professionally with business owners.\n\tStrong follow-up and organizational skills.\n\tAbility to remain consistent and persistent throughout the sales process.\n\tReceptive to training, coaching, and feedback.\n\tComfortable working in a performance-driven sales environment.\n\tAbility to work independently while collaborating with a team.\n\tMotivated by commission-based compensation and measurable results.\n\tProfessional, dependable, and willing to learn."}, {"id": "26693", "title": "Sourcing & Business Development Manager", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-26", "exp": "2026-11-26", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nA growing wholesale closeout and liquidation company is seeking an experienced and results-driven Sourcing & Business Development Manager to expand its inventory supply pipeline and buyer network.\n\nThis is a hands-on, mid-level position for someone who understands the closeout, overstock, liquidation, wholesale, or secondary-market business and can begin developing opportunities from day one.\n\nThe ideal candidate is a proactive business developer who knows how to identify opportunities, build industry relationships, negotiate profitable deals, and turn those relationships into consistent, repeat business.\n\nThis is a hybrid position based in Brooklyn, with several days per week in the office and flexibility to work remotely for the remainder of the week.\n\nKey Responsibilities\n\nSourcing & Inventory Acquisition\n\n\tIdentify and develop new sources of closeout, overstock, shelf-pull, excess, and liquidation inventory.\n\tBuild relationships with retailers, manufacturers, distributors, brokers, wholesalers, and other liquidators.\n\tEvaluate potential deals based on product quality, condition, pricing, marketability, and resale potential.\n\tReview manifests, load lists, quantities, costs, and other deal information quickly and accurately.\n\tNegotiate purchasing prices, terms, and conditions with suppliers.\n\tDevelop and maintain a strong pipeline of recurring inventory sources.\n\tMonitor market pricing, demand, and resale opportunities across multiple consumer product categories.\n\tIdentify attractive purchasing opportunities while recognizing potential risks before committing to a deal.\n\tWork closely with leadership when evaluating larger or more complex opportunities.\n\nBusiness Development & Sales\n\n\tDevelop new sales channels for acquired inventory.\n\tBuild relationships with bin stores, export buyers, online resellers, regional wholesalers, discount retailers, and other secondary-market buyers.\n\tProspect for new buyers and business opportunities.\n\tDevelop and manage a book of repeat customers.\n\tMatch available inventory with the most appropriate buyers and sales channels.\n\tNegotiate sales pricing and terms while protecting company margins.\n\tConsistently follow up with prospects, suppliers, and existing accounts.\n\tDevelop repeat business and long-term industry relationships.\n\tAttend trade shows, auctions, industry events, and networking opportunities when appropriate.\n\tWork with leadership to identify new product categories, customer segments, and growth opportunities.\n\nQualifications\n\n\tPrior experience in closeouts, liquidation, overstock, wholesale, secondary-market merchandise, or a closely related industry required.\n\tProven ability to prospect, develop relationships, negotiate, and close deals.\n\tStrong understanding of closeout and liquidation transactions.\n\tComfortable reviewing manifests, load lists, inventory details, quantities, and pricing.\n\tStrong negotiation skills and commercial judgment.\n\tAbility to evaluate both the potential profitability and risks of inventory opportunities.\n\tStrong phone, communication, and relationship-building skills.\n\tHighly motivated, resourceful, persistent, and results-oriented.\n\tComfortable working in a performance-driven environment.\n\tAbility to work independently while collaborating effectively with leadership and other team members.\n\tExisting relationships with retailers, manufacturers, wholesalers, liquidators, brokers, or secondary-market buyers are a strong plus."}, {"id": "26690", "title": "Vending Machine Route Driver", "bhTitle": "Driver", "category": "Warehouse, Driving & Logistics", "type": "Part Time", "typeNote": "", "state": "NJ", "added": "2026-08-26", "exp": "2026-11-26", "desc": "Location: Monmouth County, NJ\nEmployment Type: Part-Time\nSchedule: Approximately 15–20 Hours Per Week – Flexible Based on Route Needs\n\nPosition Overview\n\nA growing vending operation in Monmouth County, NJ is seeking a reliable and self-directed Vending Machine Route Driver to service vending machine locations throughout an established route.\n\nThe Route Driver will be responsible for keeping machines properly stocked, clean, organized, and operating smoothly. This is a part-time position to start, with the opportunity for additional routes, hours, and responsibilities as the business grows.\n\nKey Responsibilities\n\n\tTravel to vending machine locations according to an established route and schedule.\n\tRestock snacks, beverages, and other products as needed.\n\tRotate inventory and maintain appropriate stock levels.\n\tCheck machines for cleanliness, damage, or mechanical issues.\n\tAddress basic issues when appropriate and promptly report problems requiring additional service.\n\tCollect and reconcile cash and/or sales information when applicable.\n\tTrack product inventory and communicate low-stock or reorder needs.\n\tKeep vending machines and surrounding areas clean and presentable.\n\tLoad, transport, and organize products efficiently.\n\tMaintain accurate records of route stops, inventory, and servicing.\n\tManage assigned routes independently and efficiently.\n\tCommunicate professionally with clients and contacts at vending locations.\n\tComplete scheduled route responsibilities consistently and on time.\n\nQualifications\n\n\tValid driver's license required.\n\tReliable personal vehicle required.\n\tSafe and responsible driving habits.\n\tAbility to lift and carry up to 50 pounds regularly.\n\tComfortable working independently with minimal supervision.\n\tDependable, trustworthy, and responsible.\n\tPunctual with consistent attendance.\n\tStrong basic organizational and time-management skills.\n\tProfessional when interacting with clients and location staff.\n\tAbility to keep track of inventory, products, and route stops.\n\tPrevious experience in vending, delivery, route driving, retail stocking, merchandising, or similar work is a plus but not required."}, {"id": "26689", "title": "Kitchen Manager", "bhTitle": "Manager", "category": "Restaurant & Food Service", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-08-26", "exp": "2026-11-26", "desc": "Location: Ocean Township, NJ\nEmployment Type: Full-Time\nSchedule: Based on Kitchen Operations and Business Needs\n\nPosition Overview\n\nA growing kosher-certified ghost kitchen in Ocean Township, NJ is seeking an experienced, hands-on Kitchen Manager to take ownership of daily kitchen operations.\n\nThe business serves wholesale accounts, a daily lunch program, meal prep, and catering, with no retail or dine-in operation. The Kitchen Manager will work closely with the owner, who focuses primarily on business development, sales, and other non-kitchen functions.\n\nThis is a leadership role for someone who wants genuine responsibility and autonomy. The Kitchen Manager will be expected to run the kitchen like their own operation, with compensation structured to reward growth through base pay plus a revenue-share opportunity.\n\nKey Responsibilities\n\nKitchen Operations & Production\n\n\tOversee daily kitchen operations across wholesale, lunch program, meal prep, and catering.\n\tActively participate in food preparation and cooking.\n\tEstablish and maintain recipes, portions, preparation methods, and production standards.\n\tStep onto the line and assist with production whenever needed.\n\tCoordinate multiple orders and production schedules with different deadlines and requirements.\n\tEnsure food is prepared accurately, consistently, and on schedule.\n\nKosher Compliance & Food Safety\n\n\tMaintain strict adherence to the kitchen's kosher certification requirements.\n\tCoordinate appropriately with the mashgiach and certifying agency.\n\tMaintain proper kosher kitchen procedures throughout food preparation, storage, and production.\n\tEnsure compliance with applicable health, sanitation, and food safety requirements.\n\tMaintain a clean, organized, and properly functioning kitchen.\n\tEnsure staff consistently follow established food safety procedures.\n\nInventory, Purchasing & Vendors\n\n\tManage food and supply inventory.\n\tPlace, track, and receive vendor orders.\n\tMonitor food costs, usage, and waste.\n\tSource products and supplies as needed.\n\tDevelop and maintain strong relationships with suppliers and vendors.\n\tIdentify opportunities for better pricing, quality, and purchasing efficiency.\n\nStaff Management\n\n\tSchedule, train, supervise, and support kitchen staff.\n\tAssign responsibilities and ensure daily production goals are met.\n\tMaintain accountability for performance, cleanliness, food quality, and safety.\n\tProvide hands-on leadership during busy production periods.\n\tHelp develop efficient kitchen procedures as the business grows.\n\nOperational Management\n\n\tPlan production across multiple simultaneous revenue streams.\n\tImprove kitchen workflow, labor utilization, and overall efficiency.\n\tIdentify opportunities to reduce waste and control costs.\n\tMaintain consistent quality across all orders and programs.\n\tTake ownership of kitchen-related challenges and resolve issues proactively.\n\tWork closely with ownership regarding production needs, growth, staffing, and operational priorities.\n\nQualifications\n\n\tProfessional kitchen management experience required.\n\tStrong hands-on cooking and food preparation skills.\n\tExperience supervising and managing kitchen staff.\n\tExperience with inventory management, purchasing, and vendor relationships.\n\tKnowledge of kosher kitchen practices.\n\tStrong understanding of food safety and sanitation procedures.\n\tAbility to coordinate multiple production streams and deadlines simultaneously.\n\tStrong organizational, leadership, and problem-solving skills.\n\tComfortable taking ownership and making day-to-day operational decisions.\n\tAbility to work independently without constant oversight.\n\tExperience with wholesale food production, catering, meal preparation, or high-volume kitchens is a plus.\n\tServSafe or equivalent food safety certification preferred."}, {"id": "26688", "title": "Delivery Driver/Vending Machine Restocker", "bhTitle": "Delivery", "category": "Warehouse, Driving & Logistics", "type": "Part Time", "typeNote": "", "state": "NJ", "added": "2026-08-25", "exp": "2026-11-25", "desc": "We're a food & vending operation locally based in Ocean Township with distribution throughout NJ (and soon NYC). We are hiring a delivery driver / vending machine restocker.\n\nThe scope of responsibilities would include:\n? Delivery fresh made food products to various locations\n? Restocking / resetting vending machines\n? General vending machine troubleshooting\n? Interfacing with customers on site as needed\n? Assist with the companies general delivery / pick up responsibilities\n\nMust have a valid drivers clean driving record and have your own car. Must be able to lift 50lbs No experience necessary.\nWilling to train the right individualry.\nWilling to train the right individual"}, {"id": "26687", "title": "Assistant", "bhTitle": "Assistant", "category": "Administrative & Office", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-08-25", "exp": "2026-11-25", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\nSchedule: 20–25 Hours Per Week / Half Days, with Opportunity for Additional Hours as Needed\n\nPosition Overview\n\nA Brooklyn-based employer is seeking a reliable, responsible, and highly organized Task Fulfillment / Personal Assistant to provide support with errands, driving, and a variety of day-to-day tasks.\n\nThis position is ideal for someone who is dependable, takes initiative, and is comfortable handling different responsibilities throughout the day. A work vehicle will be provided for job-related driving.\n\nKey Responsibilities\n\n\tComplete daily errands, pickups, drop-offs, and other assigned tasks.\n\tDrive to various locations throughout Brooklyn and surrounding areas as needed.\n\tAssist with general personal and administrative tasks.\n\tCoordinate and complete time-sensitive assignments.\n\tPick up and deliver packages, supplies, documents, and other items.\n\tHelp keep tasks, appointments, and responsibilities organized.\n\tCommunicate updates regarding completed and outstanding assignments.\n\tFollow instructions carefully and ensure tasks are completed accurately.\n\tPrioritize assignments based on urgency and scheduling needs.\n\tAssist with additional responsibilities as needed.\n\tMaintain the provided work vehicle responsibly while in use.\n\nQualifications\n\n\tValid driver's license required.\n\tMust be a safe and responsible driver.\n\tComfortable driving throughout Brooklyn and surrounding areas.\n\tReliable, punctual, and dependable.\n\tStrong organizational and time-management skills.\n\tAbility to work independently and take initiative.\n\tGood communication and follow-up skills.\n\tComfortable handling a variety of tasks and changing priorities.\n\tProfessional and responsible when handling errands and assignments."}, {"id": "26686", "title": "Babysitter/Nanny", "bhTitle": "Babysitter/Nanny", "category": "Education & Childcare", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-08-25", "exp": "2026-11-25", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\nSchedule: 6–8 Hours Per Day, 2–3 Days Per Week\n\nPosition Overview\n\nA family in Brooklyn, NY is seeking a caring, reliable, and responsible Babysitter/Nanny to provide attentive care for their 6-week-old infant.\n\nThe ideal candidate is comfortable caring for a newborn and can provide hands-on support with feeding routines, bathing, naps, developmental activities, and other daily needs. Light meal preparation assistance would also be appreciated.\n\nKey Responsibilities\n\n\tProvide attentive and nurturing care for a 6-week-old infant.\n\tAssist with bathing and general newborn care.\n\tTake the baby for walks as appropriate.\n\tProvide supervised, age-appropriate tummy time.\n\tFollow the baby's established feeding and nap routines.\n\tMaintain a daily log of feedings, diaper changes, naps, and other important information.\n\tChange diapers and keep the baby clean and comfortable.\n\tHelp soothe and settle the baby for naps.\n\tEngage in appropriate interaction and developmental activities.\n\tMaintain a clean, safe, and organized environment for the baby.\n\tClean and organize bottles and baby-related items as needed.\n\tAssist with light meal preparation when time allows.\n\tCommunicate clearly with parents regarding the baby's day, routines, and any concerns.\n\nQualifications\n\n\tPrevious newborn or infant childcare experience strongly preferred.\n\tComfortable caring for a 6-week-old baby.\n\tKnowledge of basic newborn routines and safety.\n\tCaring, patient, attentive, and dependable.\n\tStrong communication skills.\n\tAbility to follow the family's routines and instructions.\n\tOrganized and comfortable maintaining daily care logs.\n\tReliable and punctual.\n\tChildcare references preferred."}, {"id": "26684", "title": "Content Creator", "bhTitle": "Social Media Manager", "category": "E-commerce, Marketing & Social Media", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-08-25", "exp": "2026-11-25", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\nSchedule: Approximately 10 Hours Per Week – Flexible, Hours Vary by Week\n\nPosition Overview\n\nA Brooklyn-based organization is seeking a creative and reliable Content Creator / Video Editor to assist with filming and producing engaging social media content.\n\nThis is a flexible, part-time opportunity for someone with a strong eye for content and visual storytelling who is comfortable filming high-quality content using an iPhone and editing videos for social media.\n\nThe position is approximately 10 hours per week, although hours may vary depending on the week's content needs. Much of the work can be completed independently and on a flexible schedule.\n\nKey Responsibilities\n\n\tFilm high-quality photo and video content using an iPhone.\n\tCreate engaging short-form content for social media.\n\tEdit videos into polished, ready-to-post content.\n\tSelect strong shots, clips, angles, and moments from raw footage.\n\tAdd appropriate transitions, text, music, and other editing elements.\n\tHelp develop creative ideas and concepts for new content.\n\tMaintain a consistent and professional visual style.\n\tOrganize raw footage and completed content.\n\tComplete editing assignments independently and within agreed-upon deadlines.\n\tStay aware of current social media content styles and trends.\n\tCollaborate on content needs while bringing creative ideas to the table.\n\nQualifications\n\n\tStrong eye for visual content, composition, and storytelling.\n\tComfortable filming professional-looking content with an iPhone.\n\tVideo editing skills required.\n\tFamiliarity with editing platforms such as CapCut, Adobe Premiere Pro, Final Cut Pro, or similar software is a plus.\n\tUnderstanding of short-form social media content.\n\tCreative and detail-oriented.\n\tAble to work independently and manage time effectively.\n\tReliable and responsive when coordinating projects.\n\tPrevious content creation, social media, photography, or video experience is preferred.\n\tPortfolio or examples of previous content are a plus."}, {"id": "26683", "title": "School Driver", "bhTitle": "Driver", "category": "Warehouse, Driving & Logistics", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-25", "exp": "2026-11-25", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday through Thursday – 9:00 AM Drop-Off & 3:25 PM Pick-Up Friday 9am drop off and 12:15 pick up.\n\nPosition Overview\n\nA school in Brooklyn, NY is seeking a reliable and responsible School Driver to provide safe and dependable transportation for students.\n\nKey Responsibilities\n\n\tProvide reliable transportation for students to and from school.\n\tFollow designated routes and schedules.\n\tEnsure students enter and exit the vehicle safely.\n\tMaintain punctual and dependable attendance.\n\tFollow all applicable traffic and transportation safety requirements.\n\tMaintain a clean and safe vehicle.\n\tCommunicate professionally regarding scheduling or transportation issues.\n\tNotify the appropriate contact promptly of unexpected delays or emergencies.\n\tPrioritize student safety throughout every trip.\n\nQualifications\n\n\tValid driver's license and clean driving record.\n\tSafe and responsible driving habits.\n\tReliable and punctual.\n\tProfessional and courteous demeanor.\n\tAbility to consistently follow the required morning and afternoon schedule."}, {"id": "26682", "title": "Intake Coordinator", "bhTitle": "Intake", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-25", "exp": "2026-11-25", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time, In-Person\n\nPosition Overview\n\nA growing organization in Brooklyn, NY is seeking a motivated and personable Intake Coordinator to join its team. This is an excellent opportunity for someone who enjoys working with people and wants to be part of a supportive, collaborative, and professional office environment.\n\nThe Intake Coordinator will work directly with clients, assist with the intake process, and ensure required documentation is completed accurately and efficiently.\n\nKey Responsibilities\n\n\tConnect and coordinate with clients on a daily basis.\n\tBuild professional and supportive relationships with clients.\n\tGuide clients through the intake process from initial contact through completion.\n\tAssist clients with completing required forms and documentation.\n\tReview paperwork for accuracy and completeness.\n\tPrepare and submit documentation accurately and efficiently.\n\tFollow up with clients regarding missing information or required documents.\n\tMa ghts, Brooklyn is seeking a compassionate, knowledgeable, and experienced Career Counselor to provide career guidance and workforce support to young women transitioning from seminary into the workforce.\n\nThis is a meaningful opportunity for a professional who enjoys mentoring young adults and helping them identify their strengths, explore career options, and develop practical plans for entering the workforce.\n\nThe ideal candidate has experience in career counseling, workforce development, recruiting, human resources, or a related field and maintains a strong understanding of today's job market and hiring practices.\n\nKey Responsibilities\n\n\tMeet one-on-one with participants to discuss career interests, strengths, skills, and professional goals.\n\tHelp participants identify career paths that align with their interests and abilities.\n\tDevelop realistic and achievable career and employment plans.\n\tEducate participants about different industries, positions, and professional opportunities.\n\tProvide guidance throughout the job-search process.\n\tAssist with resume development and improvement.\n\tHelp participants prepare for interviews and develop strong interviewing skills.\n\tProvide guidance on workplace expectations, professional communication, and appropriate workplace conduct.\n\tHelp participants develop confidence as they transition into professional environments.\n\tStay informed about current employment trends, hiring practices, and career opportunities.\n\tProvide practical guidance on navigating today's job market.\n\tBuild supportive and encouraging relationships with participants.\n\tMonitor progress and provide continued guidance as participants work toward their career goals.\n\tCollaborate with nonprofit staff to support participants and strengthen career programming.\n\tConnect participants with appropriate employment opportunities and professional resources when available.\n\nQualifications\n\n\tRelevant experience in career counseling, workforce development, recruiting, human resources, employment services, or a related field.\n\tStrong understanding of the current job market and hiring practices.\n\tExperience providing career guidance, mentorship, or professional development support.\n\tStrong knowledge of resume writing, interviewing, and job-search strategies.\n\tExcellent interpersonal and communication skills.\n\tPersonable, approachable, patient, and encouraging.\n\tAbility to build positive relationships with young adults.\n\tStrong listening skills and ability to understand each participant's individual goals and circumstances.\n\tAbility to provide practical and realistic career guidance.\n\tOrganized, dependable, and able to work independently.\n\tComfortable collaborating with a nonprofit team.\n\tExperience working with young adults is a plus.\n\tUnderstanding of the transition from seminary into the professional workforce is strongly preferred."}, {"id": "26666", "title": "Live Selling Host – Part-Time to Full-Time", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-08-20", "exp": "", "desc": "We are looking for outgoing, energetic, and personable individuals to host live shopping events and help grow our online kids clothing store.\n\nResponsibilities:\n\n\tHost live sales on Whatnot\n\tPresent products and interact with customers\n\tAnswer questions and create an engaging shopping experience\n\tHelp drive sales and grow our online presence\n\tBe comfortable and confident on camera\n\nIdeal Candidate:\n\n\tFun, outgoing, and energetic personality\n\tComfortable speaking on camera\n\tStrong communication and people skills\n\tSocial-media savvy\n\tReliable and flexible with scheduling\n\tSales-oriented and motivated\n\nSchedule & Compensation:\n\n\tPart-time to start with varying hours\n\tPotential to grow into a full-time position"}, {"id": "26656", "title": "Administrative Assistant", "bhTit ager to learn, dependable, and interested in developing their skills in pediatric healthcare.\n\nKey Responsibilities\n\n\tAssist physicians and clinical staff with day-to-day pediatric patient care.\n\tWelcome children and their families and help create a comfortable, friendly environment.\n\tPrepare examination rooms before patient visits.\n\tEscort patients to examination rooms and assist with the intake process.\n\tObtain and document vital signs, height, weight, and other required patient information.\n\tPrepare supplies and equipment for examinations and routine procedures.\n\tAssist providers during examinations and procedures as directed.\n\tMaintain clean, organized, and properly stocked examination rooms.\n\tUpdate patient information and maintain accurate documentation.\n\tAssist with scheduling, patient communication, and general administrative responsibilities when needed.\n\tFollow established infection-control, safety, and patient confidentiality procedures.\n\tCommunicate professionally and compassionately with children, parents, guardians, and staff.\n\tSupport the clinical and administrative teams with additional responsibilities as needed."}, {"id": "26611", "title": "Assistant", "bhTitle": "Assistant", "category": "Administrative & Office", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-08-11", "exp": "2026-11-30", "desc": "Part-time assistant.  Tech-savvy. Serious. Also will help post ads in print and online on Instagram.\nA real estate company is looking for a reliable, organized, and tech-savvy Personal Assistant to provide in-person administrative and personal support. The ideal candidate is efficient, comfortable managing multiple tasks, has strong phone skills, and is familiar with Instagram and basic graphic design/Canva.\nJob Hours:\nMonday–Thursday, approximately 4 hours per day. Schedule options include 11:00 AM–3:00 PM, 12:00–4:00 PM, or 1:00–5:00 PM. Candidate must be available at least Monday–Wednesday. This is an in-person position; remote work is not available.\n\nEssential Duties and Responsibilities:\n\n\tProvide day-to-day administrative and personal assistance\n\tManage multiple tasks and priorities efficiently\n\tAnswer and make phone calls professionally\n\tAssist with scheduling, organization, and general coordination\n\tAssist with Instagram and social media tasks\n\tCreate and edit basic graphics and social media content using Canva\n\tProvide general administrative support as needed\n\nSpecific Qualifications and/or Requirements:\n\n\tHighly organized, reliable, and efficient\n\tStrong multitasking and time-management skills\n\tExcellent phone and communication skills\n\tTech-savvy and comfortable learning new tools\n\tComfortable using Instagram and social media\n\tBasic graphic design skills and Canva knowledge\n\tMust be comfortable working in person\n\tAble to work independently and take initiative\n\tMust be available at least Monday–Wednesday\n\nAdditional Information:\n\n\tLong-term opportunity\n\tPart-time position\n\tImmediate start available\n\tIn-person position only; no remote option\n\tFlexible scheduling within the available time slots"}, {"id": "26606", "title": "Senior Development Assistant", "bhTitle": "Senior Development Assistant", "category": "HR, Management & Fundraising", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-11", "exp": "2026-12-11", "desc": "Location: New York, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA leading nonprofit organization in New York City is seeking a highly organized, detail-oriented Senior Development Assistant to provide essential administrative, fundraising, and research support to senior members of its philanthropic leadership team.\n\nThis position plays an important role in supporting major donor engagement, fundraising initiatives, events, and development operations. The ideal candidate is professional, proactive, comfortable interacting with senior leadership and donors, and capable of managing multiple priorities in a fast-paced environment.\n\nKey Responsibilities\n\n\tProvide administrative and project support to senior development professionals.\n\tNavigate and maintain a sophisticated donor database, ensuring accurate and current donor information.\n\tGenerate gift reports, donor reports, solicitation materials, and other development-related documentation.\n\tSupport senior staff with major donor solicitations, engagement initiatives, and relationship management.\n\tResearch prospective donors and maintain tracking documents for donor cultivation and engagement strategies.\n\tAssist with the preparation of fundraising and solicitation materials.\n\tProcess gifts and prepare related paperwork and documentation.\n\tMaintain shared inboxes and respond to donor requests and inquiries in a timely and professional manner.\n\tTrack event attendance and communicate with donors regarding RSVPs, event details, and additional information.\n\tCoordinate calendars, schedule meetings, answer phones, and provide day-to-day administrative support.\n\tPrepare materials and logistics for internal meetings, donor meetings, events, and site visits.\n\tDocument donor meetings and significant correspondence to maintain accurate records of engagement activity.\n\tAssist with mailings, filing, photocopying, correspondence, and other administrative responsibilities.\n\tBuild strong working relationships across departments to ensure projects and requests are completed efficiently.\n\tSupport team-wide fundraising and development projects as needed.\n\nEvents & Donor Engagement\n\n\tAssist with the planning and execution of fundraising, volunteer, and donor engagement events.\n\tProvide on-site support for events and programs as needed.\n\tCoordinate event logistics, materials, attendance information, and donor communications.\n\tSupport donor stewardship and engagement initiatives throughout the year.\n\tMaintain a high level of professionalism when communicating with major donors and organizational leadership.\n\tBe available for occasional events or programs outside of standard business hours.\n\nQualifications\n\n\tBachelor's degree required.\n\tPrevious administrative, development, fundraising, nonprofit, or related professional experience preferred.\n\tStrong proficiency in Microsoft Office Suite, including Excel, Word, and PowerPoint.\n\tComfortable learning and working with donor databases and other technology platforms.\n\tExcellent organizational and project management skills.\n\tStrong written and verbal communication abilities.\n\tExceptional attention to detail and accuracy.\n\tAbility to prioritize and manage multiple responsibilities in a fast-paced environment.\n\tConfident working independently while also collaborating effectively as part of a team.\n\tProfessional and comfortable supporting senior staff and interacting with donors.\n\tStrong interpersonal skills and a positive, solutions-oriented work ethic.\n\tAbility to handle sensitive and confidential donor information with discretion.\n\tFlexibility to occasionally work outside standard business hours for events and programs."}, {"id": "26605", "title": "Audio Visual Technician", "bhTitle": "Audio Visual Technician", "category": "Technology & IT", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-11", "exp": "2026-12-11", "desc": "Location: New York, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA leading nonprofit organization in New York City is seeking an experienced, hands-on Audio Visual Technician to provide day-to-day audiovisual support for conference centers, meeting rooms, executive events, and special programs.\n\nThis is a hands-on technical position requiring strong audiovisual expertise combined with exceptional customer service. The Audio Visual Technician will regularly support senior executives, board members, donors, VIP guests, employees, and external visitors and must maintain professionalism while responding quickly and effectively in high-profile environments.\n\nThe standard schedule for this position is 11:00 AM–7:00 PM. Flexibility is essential, as occasional early mornings, later evenings, and Sundays may be required based on meetings, events, and organizational needs. Reliability and punctuality are critical.\n\nKey Responsibilities\n\n\tProvide daily audiovisual support for conference rooms, executive meetings, presentations, town halls, and special events.\n\tSet up, test, operate, monitor, and break down audiovisual equipment for meetings and events.\n\tDeliver professional, white-glove technical support to senior executives, board members, donors, VIP guests, and other meeting participants.\n\tConsult with meeting organizers to understand technical requirements and recommend appropriate audiovisual solutions.\n\tOperate and support videoconferencing and collaboration platforms, including Zoom and Microsoft Teams.\n\tTroubleshoot audiovisual equipment, videoconferencing systems, networking connections, and room-control systems during live meetings and events.\n\tSupport projection systems, monitors, audio mixing boards, microphones, displays, and other AV equipment.\n\tPerform routine equipment maintenance and coordinate repairs or replacements when necessary.\n\tRespond promptly to AV service requests and technical support tickets.\n\tTest conference rooms and equipment before important meetings and events to ensure systems are functioning properly.\n\tAssist with recording, editing, and preparing video content as needed.\n\tMaintain organized AV equipment, cables, accessories, and technical supplies.\n\tMove, install, and configure audiovisual equipment as required.\n\tMaintain a professional, calm, and solutions-oriented approach when addressing technical issues during high-profile events.\n\nQualifications\n\n\tCollege degree in a related field and 3–5 years of audiovisual support experience in a corporate or professional environment, or an equivalent combination of professional AV experience and technical training.\n\tStrong hands-on audiovisual troubleshooting and technical support skills.\n\tExperience with projection systems, monitors, audio mixing boards, wireless microphones, display resolutions, and AV cabling.\n\tExperience supporting Zoom, Microsoft Teams, and other enterprise collaboration platforms.\n\tWorking knowledge of video editing software such as Adobe Premiere Pro or Final Cut Pro.\n\tProficiency with Microsoft Office and Microsoft Windows.\n\tBasic familiarity with Mac operating systems.\n\tBasic understanding of networking fundamentals and videoconferencing technologies.\n\tExcellent verbal, written, and interpersonal communication skills.\n\tStrong customer-service skills with the ability to provide professional, white-glove support.\n\tAbility to multitask, prioritize competing requests, and remain calm under pressure.\n\tHighly dependable, punctual, organized, and detail-oriented.\n\tAbility to work independently while collaborating effectively with internal teams.\n\tMust be flexible to occasionally work mornings, evenings, or Sundays based on event needs."}, {"id": "26599", "title": "Full-Time Babysitter", "bhTitle": "Babysitter/Nanny", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-11", "exp": "", "desc": "Location: Brooklyn, NY\nStart Date: September 2026\nSchedule: Monday–Friday, 8:00 AM–4:00 PM\n\nAbout the Position\n\nA family in Brooklyn is seeking a caring, responsible, and experienced full-time babysitter to care for two young children—a 12-month-old and a 2-month-old.\n\nResponsibilities\n\n\tProvide attentive and loving care for both children throughout the day.\n\tEnsure the children are safe, comfortable, and well cared for.\n\tAssist with the daily needs and routines of the children.\n\tProvide age-appropriate attention and care for an infant and young toddler.\n\tMaintain a patient, calm, and nurturing environment.\n\nQualifications\n\n\tPrevious babysitting or childcare experience is required.\n\tMust be caring, patient, responsible, and understanding.\n\tExperience caring for infants and young toddlers is preferred.\n\tMust be comfortable caring for two young children simultaneously."}, {"id": "26581", "title": "Sales - LiveSelling", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-08-06", "exp": "", "desc": "Wholesale footwear company seeking someone to set up and sell on Whatnot. Part time, long term..."}, {"id": "26573", "title": "Fashion & Content Creation Internship", "bhTitle": "Fashion & Content Creation Internship", "category": "E-commerce, Marketing & Social Media", "type": "Internship", "typeNote": "", "state": "NY", "added": "2026-08-05", "exp": "2026-11-26", "desc": "Location: New York City\nSchedule: Part-Time or Full-Time (Fall)\n\nA growing women's fashion company is seeking Fall interns who are passionate about fashion and content creation. This is a great opportunity to gain hands-on experience in a fast-paced, creative environment.\n\nResponsibilities:\n\n\tAssist with social media content and marketing initiatives.\n\tSupport photoshoots, product launches, and daily operations.\n\tResearch fashion trends and contribute creative ideas.\n\nQualifications:\n\n\tStrong interest in fashion and/or content creation.\n\tOrganized, creative, and eager to learn.\n\tExcellent communication skills and a positive attitude."}, {"id": "26563", "title": "Personal Assistant Needed – Five Towns, NY", "bhTitle": "Executive Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-04", "exp": "", "desc": "Private family seeking a highly organized, detail-oriented, dependable, discreet, and experienced e\\'d love to hear from you.\n\n\t\t\tHours are 9-5, but we can be flexible to start a bit later and end later. While in the office, we're open to having Fridays remote. 1 week of personal days after the first 3 months of employment, which grows in Year 2 and Year 3.\n\n\t\t\t45,000-55,000"}, {"id": "26551", "title": "Sales", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-07-30", "exp": "", "desc": "Brooklyn location with option to work in NJ for the summer.\n\nHigh-Intent Leads: Reps receive exclusive, pre-qualified leads from marketing spend, eliminating cold calling and enabling a commission structure of 25–35%.\n\nIn-Office Requirement: New hires must work in the office for training on the proprietary CRM and sales process."}];

function openSheet() { drawSheet(); $("sheet").hidden = false; $("scrim").hidden = false; $("sdone").focus(); }
function closeSheet() { $("sheet").hidden = true; $("scrim").hidden = true; $("fbtn").focus(); }
$("fbtn").onclick = openSheet; $("scrim").onclick = closeSheet; $("sdone").onclick = closeSheet;
$("sclear").onclick = () => { st.cat = st.type = st.state = ""; update(); drawSheet(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });

// ---- search ----
const qEl = $("q");
qEl.oninput = () => { st.q = qEl.value; $("qclear").hidden = !qEl.value; update(); };
$("qclear").onclick = () => { qEl.value = ""; st.q = ""; $("qclear").hidden = true; update(); qEl.focus(); };
$("sform").onsubmit = e => { e.preventDefault(); qEl.blur(); $("status").scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" }); };
let ex = 0;
function placeholder() { const w = EXAMPLES[ex % EXAMPLES.length]; qEl.placeholder = phone() ? `Try "${w}"` : `Search jobs, e.g. "${w}"`; }
placeholder();
if (!reduced()) setInterval(() => { if (!qEl.value && document.activeElement !== qEl) { ex++; placeholder(); } }, 2600);

function filtered() {
  const words = st.q.toLowerCase().split(/\s+/).filter(Boolean).map(w => w.replace(/^#/, "")).filter(w => w !== "job");
  return JOBS.filter((j, i) => (!st.cat || j.category === st.cat) && (!st.type || j.type === st.type) && (!st.state || j.state === st.state) && words.every(w => hay[i].includes(w)));
}

// ---- your info ----
const info = () => ({ name: store.get("name"), phone: store.get("phone"), email: store.get("email"), jd: JDS[store.get("jd")] || null });
const infoOk = m => m.name && (m.phone || m.email);
let editing = false;

// ---- render list ----
function fmt(d) { const [y, m, dd] = d.split("-"); return new Date(+y, +m - 1, +dd).toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
function paras(t) {
  const lines = t.split("\n").map(l => l.trim()).filter(Boolean);
  const isSub = l => l.length < 60 && /:$/.test(l) || /^(position overview|job summary|about (the|us|the role)|responsibilities|key responsibilities|qualifications|requirements|what we offer|benefits|overview)$/i.test(l);
  let inList = false;
  return lines.map(l => {
    if (isSub(l)) { inList = !/^(position overview|job summary|about|overview)/i.test(l); return `<p class="sub">${esc(l)}</p>`; }
    const bullet = /^[•\-*·▪]/.test(l) || (inList && l.length < 220);
    return bullet ? `<p class="li">${esc(l.replace(/^[•\-*·▪]\s*/, ""))}</p>` : `<p>${esc(l)}</p>`;
  }).join("");
}
function excerpt(t) { return t.split("\n").filter(l => !/^\W*(location|job type|employment type|schedule|hours|position|start date|reports to|work arrangement|classification)\b[^:]*:/i.test(l)).join(" ").replace(/\b(position overview|job summary|job description|about the role|overview)\b:?/gi, " ").replace(/\s+/g, " ").trim().slice(0, 320); }

function update(keepPage) {
  if (!keepPage) st.shown = PAGE;
  const rows = filtered();
  // status + chips
  const chips = [];
  if (st.q.trim()) chips.push(["q", `Search: "${st.q.trim()}"`]);
  if (st.cat) chips.push(["cat", st.cat]);
  if (st.type) chips.push(["type", st.type]);
  if (st.state) chips.push(["state", st.state]);
  $("status").innerHTML = `<span class="count"><b>${rows.length}</b> ${rows.length === 1 ? "job" : "jobs"}</span>` +
    chips.map(([k, l]) => `<button class="chip" type="button" data-k="${k}" aria-label="Remove ${esc(l)}">${esc(l)}<span aria-hidden="true">✕</span></button>`).join("") +
    (chips.length > 1 ? `<button class="linkbtn" type="button" data-k="all">Clear all</button>` : "");
  ["cat", "type", "state"].forEach(k => { const el = $("f-" + (k === "cat" ? "cat" : k)); el.value = st[k]; el.classList.toggle("on", !!st[k]); });
  const nf = [st.cat, st.type, st.state].filter(Boolean).length;
  $("fbadge").hidden = !nf; $("fbadge").textContent = nf;

  const list = $("list");
  if (!rows.length) {
    list.innerHTML = `<li class="empty"><strong>No jobs match yet</strong><span>Try a shorter word, or remove a filter.</span>
      <div class="row">${st.q ? `<button class="copy" type="button" data-k="q">Clear search</button>` : ""}${nf ? `<button class="copy" type="button" data-k="filters">Clear filters</button>` : ""}</div></li>`;
    $("more").hidden = true;
    if (!phone()) renderDetail(null);
    return;
  }
  list.innerHTML = rows.slice(0, st.shown).map(j => `
    <li><button class="item" type="button" data-id="${esc(j.id)}" aria-current="${st.cur === j.id}">
      <h3>${esc(j.title)}</h3>
      <div class="meta"><span class="cat">${esc(j.category)}</span><span>${esc(j.typeNote || j.type)}</span><span>${esc(j.state)}</span></div>
      ${j.desc ? `<p class="ex">${esc(excerpt(j.desc))}</p>` : ""}
      <div class="meta"><span>Job #${esc(j.id)}</span><span>Posted ${fmt(j.added)}</span></div>
    </button></li>`).join("");
  $("more").hidden = rows.length <= st.shown;
  $("more").textContent = `Show more jobs (${rows.length - st.shown} more)`;
  if (!phone() && (!st.cur || !rows.some(j => j.id === st.cur))) select(rows[0].id, false);
}
$("more").onclick = () => { st.shown += PAGE; update(true); };
document.addEventListener("click", e => {
  const c = e.target.closest("[data-k]"); if (!c || c.closest(".sheet")) return;
  const k = c.dataset.k;
  if (k === "q") { qEl.value = ""; st.q = ""; $("qclear").hidden = true; }
  else if (k === "filters") { st.cat = st.type = st.state = ""; }
  else if (k === "all") { qEl.value = ""; st.q = ""; $("qclear").hidden = true; st.cat = st.type = st.state = ""; }
  else if (["cat", "type", "state"].includes(k)) st[k] = "";
  else return;
  update();
});
$("list").addEventListener("click", e => { const b = e.target.closest(".item"); if (b) select(b.dataset.id, true); });

// ---- detail ----
function select(id, user) {
  st.cur = id; editing = false;
  document.querySelectorAll(".item").forEach(b => b.setAttribute("aria-current", b.dataset.id === id));
  renderDetail(JOBS.find(j => j.id === id));
  $("detail").scrollTop = 0;
  if (user && phone()) { if (location.hash !== "#job-" + id) location.hash = "job-" + id; else openView(); }
}
function openView() { document.body.classList.add("viewing"); $("detail").scrollTop = 0; $("back").focus({ preventScroll: true }); }
function closeView() { document.body.classList.remove("viewing"); const b = document.querySelector(`.item[data-id="${st.cur}"]`); if (b) b.focus({ preventScroll: true }); }
$("back").onclick = () => { if (location.hash.startsWith("#job-")) history.back(); else closeView(); };
addEventListener("hashchange", route);
function route() {
  const m = location.hash.match(/^#job-(\d+)$/);
  if (m && JOBS.some(j => j.id === m[1])) {
    if (st.cur !== m[1]) { st.cur = m[1]; renderDetail(JOBS.find(j => j.id === m[1])); document.querySelectorAll(".item").forEach(b => b.setAttribute("aria-current", b.dataset.id === m[1])); }
    if (phone()) openView();
  } else if (document.body.classList.contains("viewing")) closeView();
}

function infoForm(m, j) {
  const cur = store.get("jdset") ? store.get("jd") : null;
  const btn = (v, text) => `<button class="jdbtn${v === "" ? " none" : ""}" type="button" role="radio" data-jd="${v}" aria-checked="${cur === v}">${text}</button>`;
  return `<div class="step">
    <h5 class="step-h"><span class="step-n">1</span>Do you work with an SBH job developer?</h5>
    <p class="lead">If you already have a job developer at SBH, tap their name so your application goes straight to them. New to SBH or not sure? Tap <b>I don't have one</b> and our team will take it from there.</p>
    <div class="jdgrid" role="radiogroup" aria-label="Your job developer">${JDS.map((d, i) => btn(String(i), esc(d[1]))).join("")}${btn("", "I don't have one / not sure")}</div>
  </div>
  <div class="step">
    <h5 class="step-h"><span class="step-n">2</span>Your contact info</h5>
    <p class="hint">We use this to find you in our system. This device remembers it, so you only fill it in once.</p>
    <div class="fields">
      <label>Full name<input id="i-name" autocomplete="name" value="${esc(m.name)}" placeholder="First and last name"></label>
      <label>Phone<input id="i-phone" type="tel" autocomplete="tel" value="${esc(m.phone)}" placeholder="718-555-1234"></label>
      <label>Email<input id="i-email" type="email" autocomplete="email" value="${esc(m.email)}" placeholder="The email SBH has for you"></label>
    </div>
  </div>`;
}
function label(m) { return m.jd ? `Apply &amp; notify ${esc(m.jd[0])}` : "Apply to this job"; }
function renderDetail(j) {
  if (!j) { $("dbody").innerHTML = `<p class="hint">Choose a job to see the full description.</p>`; return; }
  const m = info(); const ok = infoOk(m) && !editing;
  $("dbody").innerHTML = `
    <h2>${esc(j.title)}</h2>
    <div class="pills"><span class="pill">${esc(j.category)}</span><span class="pill">${esc(j.typeNote || j.type)}</span><span class="pill">${esc(j.state)}</span><span class="pill q">Job #${esc(j.id)}</span><span class="pill q">Posted ${fmt(j.added)}</span></div>
    <section class="applybox" id="applybox" aria-label="Apply">
      <h4>Interested? Apply through SBH</h4>
      ${ok ? `<div class="who"><span class="jdline">Your job developer: <b>${m.jd ? esc(m.jd[1]) : "None / not sure"}</b></span><span>Applying as <b>${esc(m.name)}</b></span><span>${esc(m.phone || m.email)}</span><button class="editbtn" type="button" id="edit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Change job developer or info</button></div>` : infoForm(m, j)}
      <a class="apply inbox" href="#" id="apply" role="button">${label(m)}</a>
      <div id="slot"></div>
    </section>
    ${j.desc ? `<h3 class="desc-h">About the job</h3><div class="desc">${paras(j.desc)}</div>` : ""}`;
  $("papply").innerHTML = label(m);
  if (!ok) ["i-name", "i-phone", "i-email"].forEach(id => {
    const el = $(id); el.addEventListener("input", () => {
      store.set(id.slice(2), el.value.trim()); el.classList.remove("bad");
      const mm = info(); $("apply").innerHTML = label(mm); $("papply").innerHTML = label(mm);
    });
  });
  const ed = $("edit"); if (ed) ed.onclick = () => { editing = true; renderDetail(j); $("i-name").focus(); };
}

// ---- apply ----
function message(j, m) {
  const subject = `Applying for Job #${j.id} - ${j.title}` + (m.jd ? ` (JD: ${m.jd[0]})` : "");
  const body = [`Hi SBH team,`, ``, `I would like to apply for Job #${j.id}: ${j.title}.`, ``,
    `Name: ${m.name}`, `Phone: ${m.phone || "-"}`, `Email on file: ${m.email || "-"}`,
    `My job developer: ${m.jd ? m.jd[1] : "None / not sure"}`, ``, `I have attached my resume if I have an updated one.`, ``, `Thank you!`].join("\n");
  return m.jd ? { subject, body, to: m.jd[2], bcc: [] } : { subject, body, to: INTAKE, bcc: INTAKE_BCC };
}
const mailto = g => `mailto:${g.to}?` + (g.bcc.length ? `bcc=${encodeURIComponent(g.bcc.join(","))}&` : "") + `subject=${encodeURIComponent(g.subject)}&body=${encodeURIComponent(g.body)}`;
const plain = g => `To: ${g.to}\n` + (g.bcc.length ? `BCC: ${g.bcc.join(", ")}\n` : "") + `Subject: ${g.subject}\n\n${g.body}`;
function doApply(e, link) {
  const j = JOBS.find(x => x.id === st.cur); if (!j) return;
  const m = info(); const slot = $("slot");
  if (!infoOk(m)) {
    if (e) e.preventDefault();
    if (!$("i-name")) { editing = true; renderDetail(j); }
    const need = !m.name ? ["i-name"] : ["i-phone", "i-email"];
    need.forEach(id => $(id).classList.add("bad"));
    $("slot").innerHTML = `<p class="warnmsg">Please add your name and a phone number or email above, then tap Apply again.</p>`;
    $("applybox").scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" });
    setTimeout(() => $(need[0]).focus({ preventScroll: true }), 300);
    return;
  }
  const g = message(j, m);
  if (editing) { editing = false; renderDetail(j); if (e) e.preventDefault(); location.href = mailto(g); }
  else if (link) link.href = mailto(g); else location.href = mailto(g);
  $("slot").innerHTML = `<div class="after"><p>Your email app should open with this message ready. Attach your resume if you have a new one, then press Send.</p>
    <p>If no email opened, copy this message and send it to <span class="sel">${g.to}</span>${g.bcc.length ? `, with <span class="sel">${g.bcc.join(", ")}</span> on BCC` : ""}.</p>
    <pre id="msgtext">${esc(plain(g))}</pre><button class="copy" type="button" id="copy">Copy message</button></div>`;
  $("copy").onclick = async () => {
    const b = $("copy");
    try { await navigator.clipboard.writeText(plain(g)); b.textContent = "Copied"; }
    catch (err) { const r = document.createRange(); r.selectNodeContents($("msgtext")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected. Press Copy"; }
    setTimeout(() => { b.textContent = "Copy message"; }, 2500);
  };
  if (phone()) $("slot").scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "center" });
}
$("dbody").addEventListener("click", e => {
  const jb = e.target.closest(".jdbtn");
  if (jb) {
    store.set("jd", jb.dataset.jd); store.set("jdset", "1");
    document.querySelectorAll(".jdbtn").forEach(b => b.setAttribute("aria-checked", b === jb));
    const mm = info(); $("apply").innerHTML = label(mm); $("papply").innerHTML = label(mm);
    return;
  }
  const a = e.target.closest("#apply"); if (a) doApply(e, a);
});
$("papply").onclick = () => doApply(null, null);

// ---- sticky toolbar: hide on scroll down, show on scroll up (phones) ----
let lastY = scrollY;
addEventListener("scroll", () => {
  const y = scrollY, tb = $("toolbar"), top = tb.getBoundingClientRect().top;
  tb.classList.toggle("stuck", top <= 1 && y > 40);
  if (phone() && y > 260 && y > lastY + 6 && document.activeElement !== qEl) tb.classList.add("hide");
  else if (y < lastY - 6 || y < 260) tb.classList.remove("hide");
  lastY = y;
}, { passive: true });
addEventListener("resize", () => { if (!phone()) { document.body.classList.remove("viewing"); if (!st.cur) update(true); } });

update();
route();
</script>

</body>
</html>
