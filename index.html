obile warranty, extended service contract, or auto sales is a major plus.\n\n\tStrong communication and active listening skills with a dynamic, customer-focused phone presence.\n\n\tProven ability to build rapport quickly and overcome client objections effectively.\n\n\tReliable, detail-oriented, and capable of working productively in a full-time, in-office setup.\n\nWhat We Offer:\n\n\tConsistent flow of warm, high-quality inbound and outbound lead opportunities.\n\n\tA collaborative and supportive in-office environment located in Colts Neck, NJ.\n\n\tOngoing training and professional growth opportunities within a fast-paced market."}, {"id": "26794", "title": "AGGRESSIVE COMMERCIAL RETAIL LEASING AGENT - NYC & THE BOROS", "bhTitle": "Real Estate Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-23", "exp": "2026-12-30", "desc": "Some Experience Preferred - WILL TRAIN THE SUPERSTAR. We Lease NYC Retail. Stores, Restaurants, Salons, Medical, etc.. .We are a NYC-based commercial real estate brokerage/ownership group with 100s of retail spaces across Manhattan, Brooklyn, Queens, Bronx, Long Island & NJ. We move fast and we close.\nThe Role:\nYou will lease vacant retail spaces - from 500 SF mom-and-pop shops to 5,000 SF flagship spaces. Lease retail storefronts, shopping centers, mixed-use buildings. Show spaces to prospective tenants - restaurant owners, franchisees, retail chains, medical, etc. Canvas neighborhoods - cold call, walk the block, find tenants before they find you. Work directly with landlords to price and market vacancies. Close deals - we need CLOSERS, not tour guides. You Are: AGGRESSIVE SELF-STARTER - you don't wait for listings, you HUNT Money-motivated, ambitious, This is NOT a desk job. Commission"}, {"id": "26793", "title": "E-Commerce Account Manager", "bhTitle": "ECommerce Manager", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-09-23", "exp": "2026-12-28", "desc": "An e-commerce retailer based in New Brunswick, NJ, is seeking an E-Commerce Account Manager to handle day-to-day operations across major online marketplaces. The role covers competitive pricing, deal submissions, listing optimization, sales reporting, and coordinating inventory shipments to fulfillment centers. Ideal for someone with hands-on marketplace experience who is comfortable working with data and moving quickly in a fast-paced online retail environment.\n\nFull Time / Part Time: Full Time\nJob Hours: 9AM-6PM\nAdditional Information: There is a van ride to the office everyday\n\nEssential Duties and Responsibilities:\n\n\tManage day-to-day pricing across major online marketplaces\n\tPrepare and submit deals and promotional offers\n\tOptimize product listings, including titles, descriptions, images, and keywords\n\tGenerate and review sales reports to track performance and identify trends\n\tCoordinate and send inventory shipments to fulfillment centers\n\tMonitor marketplace account health and address listing or compliance issues as they arise\n\nSpecific Qualifications and/or Requirements:\n\n\tPrior experience managing seller accounts on Amazon, Walmart, and eBay strongly preferred\n\tWorking knowledge of marketplace seller platforms (Amazon Seller Central, Walmart Seller Center, eBay Seller Hub)\n\tComfort with spreadsheets and sales data; ability to build and interpret basic reports\n\tStrong attention to detail and accuracy with pricing and product information\n\tAbility to manage multiple listings and deadlines independently\n\tFamiliarity with FBA/WFS or third-party fulfillment processes a plus"}, {"id": "26792", "title": "Personal / Sales Assistant", "bhTitle": "Sales Assistant", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NJ", "added": "2026-09-22", "exp": "2026-12-15", "desc": "Location: Eatontown, NJ\nSchedule: Part-Time or Full-Time (Full-time preferred)\n\nA growing community-based business is looking for a reliable, flexible, and hardworking individual to provide general support with whatever comes up day to day. This could include personal assistant tasks, sales support, organizing, errands, customer communication, and other hands-on business needs.\n\nThe ideal candidate is someone who is motivated, dependable, personable, and willing to jump in wherever needed. The role can start part-time with the potential to grow into a larger or full-time position based on fit and performance."}, {"id": "26789", "title": "Livestream Sales Representative – Whatnot & TikTok Shop", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-22", "exp": "2026-12-22", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time, In-Person / On-Site\nSchedule: Flexible, Approximately 20–30 Hours per Week\n\nPosition Overview\n\nA Brooklyn-based e-commerce company is seeking an energetic, personable, and sales-driven Livestream Sales Representative to sell a variety of products through Whatnot, TikTok Shop, and other live-selling platforms.\n\nProducts may include electronics, handbags, accessories, jewelry, and other consumer merchandise.\n\nThis is a highly interactive, on-camera sales position for someone who enjoys engaging with customers, presenting products, creating excitement, and closing sales. The ideal candidate is confident, enthusiastic, comfortable speaking live on camera, and capable of creating an engaging shopping experience that converts viewers into customers.\n\nThe position will begin with base pay during training while the candidate learns the merchandise, selling techniques, and live-commerce platforms. Compensation may increase based on experience and demonstrated sales performance.\n\nKey Responsibilities\n\nLivestream Sales\n\n\tHost engaging, entertaining, and sales-focused live streams on Whatnot, TikTok Shop, and other relevant platforms.\n\tPresent and demonstrate a variety of products, including electronics, handbags, accessories, jewelry, and other merchandise.\n\tClearly communicate product features, benefits, pricing, and key selling points.\n\tBuild excitement around products and confidently encourage viewers to make purchases.\n\tCreate an energetic and professional shopping experience throughout each broadcast.\n\tMaintain audience engagement during extended live-selling sessions.\n\nCustomer Engagement\n\n\tInteract directly with viewers during live broadcasts.\n\tAnswer product questions and respond to comments in real time.\n\tBuild rapport with viewers and develop relationships with repeat customers.\n\tHelp grow and maintain a loyal online following.\n\tUse effective sales techniques to overcome objections and close sales.\n\tMaintain a friendly, enthusiastic, and professional on-camera presence.\n\nProduct Knowledge & Preparation\n\n\tLearn detailed information about the company's merchandise, including features, specifications, styles, materials, pricing, and selling points.\n\tPrepare and organize merchandise before each live broadcast.\n\tWork with the team to select products for upcoming streams.\n\tAssist with developing promotions, special offers, product bundles, and livestream themes.\n\tEnsure products are presented accurately and professionally.\n\nSales Performance & Growth\n\n\tWork toward established sales and performance goals.\n\tReview sales results and audience engagement to identify opportunities for improvement.\n\tTest different presentation styles and selling techniques to improve conversions.\n\tStay current on Whatnot, TikTok Shop, social media, e-commerce, and live-shopping trends.\n\tProvide feedback on products and promotions based on customer questions and live audience reactions.\n\nQualifications\n\n\tStrong sales ability and enthusiasm for interacting with customers.\n\tConfident and comfortable speaking and selling live on camera.\n\tEnergetic, personable, outgoing, and engaging communication style.\n\tStrong verbal communication and presentation skills.\n\tAbility to maintain energy and audience engagement throughout a live broadcast.\n\tInterest in electronics, handbags, accessories, jewelry, fashion, e-commerce, and consumer products.\n\tAbility to quickly learn detailed product information and explain it clearly to customers.\n\tSelf-motivated, dependable, and results-oriented.\n\tComfortable working in person in Brooklyn, NY.\n\tPrevious experience in retail sales, e-commerce, social media, live streaming, electronics, accessories, handbags, or jewelry sales is a plus.\n\tExperience with Whatnot, TikTok Shop, or another live-selling platform is strongly preferred but not required."}, {"id": "26787", "title": "Tax Accountant", "bhTitle": "Accountant", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-17", "exp": "2026-12-16", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nA large multi-location retail organization is seeking an experienced Tax Accountant to support its tax compliance, reporting, reconciliation, and payment functions.\n\nThe Tax Accountant will have primary responsibility for sales tax returns, corporate tax filings, tax account reconciliations, electronic tax payments, and multi-state tax compliance. This position will work closely with the Tax and Accounting teams to ensure federal, state, and local tax obligations are completed accurately and on schedule.\n\nThe ideal candidate has a strong accounting and tax background, experience working with multi-state tax requirements, and the ability to manage a high volume of filings, payments, and deadlines with accuracy.\n\nKey Responsibilities\n\nTax Compliance & Filings\n\n\tPrepare and assist with filing federal, state, and local corporate tax returns.\n\tPrepare and file monthly, quarterly, and annual sales tax returns in accordance with applicable regulations.\n\tRespond to state and local jurisdictions regarding sales tax notices and inquiries.\n\tMonitor filing requirements and deadlines across multiple jurisdictions.\n\tPrepare annual Puerto Rico personal property tax returns and coordinate quarterly payments.\n\tPrepare information required for annual Puerto Rico municipal tax returns.\n\tMaintain accurate supporting documentation for tax filings and regulatory requirements.\n\nTax Payments & Reconciliations\n\n\tProcess and monitor Electronic Funds Transfers (EFTs) for tax payments to state and local taxing authorities.\n\tManage electronic sales tax payments across multiple jurisdictions.\n\tEnsure tax payments are processed accurately and within required deadlines.\n\tReconcile sales tax accounts and investigate discrepancies.\n\tMaintain accurate supporting records for tax balances and payments.\n\tReview purchase journal activity and prepare required entries related to electronic tax payments and tax reporting.\n\nTax Systems & Data Management\n\n\tMaintain sales tax rates, vendor codes, jurisdictional information, and other tax-related system records.\n\tMaintain and administer tax automation and reporting systems, including Vertex or similar tax software.\n\tHelp ensure the accuracy and integrity of tax data across internal systems.\n\tIdentify and assist with resolving tax system or reporting discrepancies.\n\nReporting, Audits & Research\n\n\tSupport month-end, quarter-end, and year-end tax reporting and reconciliation processes.\n\tAssist with tax research, account analysis, and compliance projects.\n\tPrepare documentation and supporting information for tax audits and regulatory inquiries.\n\tMaintain organized tax records to support internal controls and compliance requirements.\n\tResearch tax-related questions and assist with resolving compliance issues.\n\nCross-Functional Support\n\n\tCollaborate with Accounting, Payroll, Finance, and external agencies regarding tax-related matters.\n\tCommunicate professionally with taxing authorities and other external parties.\n\tAssist with special projects and additional tax or accounting responsibilities as needed.\n\nQualifications\n\n\tBachelor's degree in Accounting, Finance, Taxation, or a related field required.\n\tMinimum of 5 years of accounting or tax experience, preferably involving sales tax, corporate tax, and multi-state tax compliance.\n\tStrong knowledge of sales tax and corporate tax reporting, tax compliance, reconciliations, and electronic tax payments.\n\tExperience preparing or supporting federal, state, and local tax filings.\n\tExperience working with tax software and Microsoft Excel.\n\tFamiliarity with Vertex and Thomson Reuters ONESOURCE preferred.\n\tStrong analytical and problem-solving abilities.\n\tExcellent attention to detail and accuracy.\n\tStrong organizational and time-management skills.\n\tAbility to manage multiple tax deadlines and priorities in a fast-paced environment.\n\tStrong written and verbal communication skills.\n\tAbility to collaborate effectively across multiple departments.\n\tHigh level of professionalism and discretion when handling sensitive financial information."}, {"id": "26784", "title": "Senior Activities Companion", "bhTitle": "Companion", "category": "Healthcare & Human Services", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-17", "exp": "2026-12-16", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\n\nPosition Overview\n\nA senior-focused program in Brooklyn is seeking a caring, energetic, and dependable Senior Activities Companion to spend time with older adults and help keep them socially engaged through games, conversation, and recreational activities.\n\nThe ideal candidate is a hard worker who genuinely enjoys spending time with seniors, has a positive attitude, and can create a fun and welcoming environment. Similar senior-companion roles commonly emphasize conversation, hobbies, games, and social engagement.\n\nKey Responsibilities\n\n\tSpend quality time with seniors and provide friendly companionship.\n\tPlay board games, card games, puzzles, and other recreational games.\n\tEngage seniors in conversation and encourage social interaction.\n\tHelp organize and participate in fun, age-appropriate activities.\n\tEncourage seniors to stay mentally and socially active.\n\tAssist with arts and crafts, music, group activities, and other recreational programs.\n\tHelp set up and clean up activities and games.\n\tEncourage participation while respecting each individual's interests and abilities.\n\tMaintain a positive, patient, and respectful environment.\n\tBuild friendly and professional relationships with seniors.\n\tWork cooperatively with staff and assist with activities as needed.\n\tBe reliable and consistently arrive on time for scheduled shifts.\n\nQualifications\n\n\tCaring, patient, friendly, and dependable.\n\tMust enjoy interacting and spending time with seniors.\n\tHard-working with a positive attitude and strong work ethic.\n\tOutgoing and comfortable starting conversations and activities.\n\tAble to engage seniors in games and recreational activities.\n\tStrong communication and interpersonal skills.\n\tResponsible and able to work independently when needed.\n\tPrevious experience working with seniors, recreation programs, senior centers, companionship, or caregiving is preferred but not required."}, {"id": "26783", "title": "Senior Graphic & Package Designer", "bhTitle": "Graphic Design", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-09-17", "exp": "2026-12-16", "desc": "Location: Eatontown, NJ\nEmployment Type: Full-Time\nSchedule: Monday–Friday, 9:00 AM–5:00 PM or 10:00 AM–6:00 PM\n\nPosition Overview\n\nAn accessories wholesaler is seeking an experienced Senior Graphic & Package Designer to lead the visual design and packaging development of its consumer accessory products.\n\nThis is a senior-level, hands-on role responsible for developing retail-ready packaging, new product concepts, brand assets, and marketing materials from initial concept through final production. The designer will work across multiple product lines and collaborate closely with product development, sales, vendors, and overseas manufacturing partners.\n\nThe ideal candidate combines strong creative abilities with deep technical knowledge of packaging production, print, dielines, Adobe Creative Suite, and AI-powered design tools. This individual should be comfortable working independently, developing new ideas, and managing multiple projects simultaneously.\n\nKey Responsibilities\n\nPackaging & Graphic Design\n\n\tDesign compelling, retail-ready packaging from initial concept through final print-ready production.\n\tDevelop dielines, packaging layouts, mockups, and prototypes for new and existing product lines.\n\tCreate packaging concepts that effectively communicate product features, benefits, and brand positioning.\n\tAdapt designs across multiple products, SKUs, sizes, and retail requirements.\n\tCreate catalogs, sell sheets, digital content, presentations, and other marketing materials.\n\tMaintain consistent branding across packaging, products, and promotional materials.\n\nProduct Development & Innovation\n\n\tCollaborate with the product development team to conceptualize and develop new consumer products.\n\tContribute creative ideas for new products, packaging formats, features, and visual direction.\n\tTranslate product concepts into compelling visual presentations and prototypes.\n\tWork with sales and product teams to understand retailer needs and market opportunities.\n\tSupport new-product development from early-stage concept through production.\n\tUse AI tools and emerging design technologies to accelerate ideation, concept development, visualization, and creative workflows.\n\nProduction & Pre-Press\n\n\tPrepare accurate print-ready production files for printers and manufacturers.\n\tReview dielines, proofs, artwork, and color specifications before production.\n\tApply strong knowledge of pre-press requirements, color management, typography, image preparation, and print production.\n\tReview production samples and proofs for quality and accuracy.\n\tIdentify and resolve artwork or production issues before manufacturing.\n\tCommunicate directly with printers, vendors, and overseas manufacturing partners.\n\nProject Management & Collaboration\n\n\tWork closely with product development, sales, and manufacturing teams.\n\tManage multiple design and product-development projects simultaneously.\n\tMaintain organized artwork, design files, production assets, and version control.\n\tEnsure projects remain on schedule and meet production deadlines.\n\tIncorporate feedback from internal teams, retailers, vendors, and manufacturing partners.\n\tIndependently manage projects from initial creative direction through final execution.\n\nQualifications\n\n\tSeveral years of professional graphic design experience, with significant experience in consumer product packaging.\n\tStrong portfolio demonstrating high-quality retail packaging and consumer product design.\n\tExpert-level proficiency in Adobe Illustrator, Photoshop, and InDesign.\n\tStrong experience using AI tools within the creative and design process is highly important.\n\tStrong understanding of dielines, print production, color management, and pre-press requirements.\n\tExperience preparing production-ready artwork for commercial printing and manufacturing.\n\tStrong typography, layout, branding, and visual-design abilities.\n\tExperience contributing to new product development and product conceptualization preferred.\n\tExperience designing for mass-market or big-box retail environments preferred.\n\tAbility to manage multiple projects and meet demanding production deadlines.\n\tStrong attention to detail and organizational skills.\n\tAbility to work independently while collaborating effectively with multiple departments and external partners."}, {"id": "26782", "title": "Social Media Engagement Assistant – Part-Time", "bhTitle": "Social Media Engagement Assistant – Part-Time", "category": "E-commerce, Marketing & Social Media", "type": "Remote / Hybrid", "typeNote": "Remote/Hybrid/PT", "state": "Not listed", "added": "2026-09-17", "exp": "2026-12-17", "desc": "Location: Remote\nSchedule: 5 hours/week, flexible\n\nLove Instagram and naturally find yourself liking, commenting, and interacting with people online? A growing events company is looking for a fun, social, and creative person to help build its Instagram presence and get more people engaging with the brand.\n\nYou'll spend about 5 hours a week engaging with relevant accounts, leaving thoughtful comments, interacting with followers and potential customers, and helping create buzz around upcoming events and activities.\n\nThe best part? Work whenever it fits your schedule! We're looking for someone who is naturally outgoing online, knows Instagram, is proactive, and can bring their own ideas and personality to the role."}, {"id": "26781", "title": "Event Assistant – Part-Time / Flexible", "bhTitle": "Event Assistant", "category": "Administrative & Office", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-17", "exp": "2026-12-04", "desc": "Location: NYC/Brooklyn\nSchedule: Flexible; varies by event\n\nLove being around people and having fun? A growing events company is looking for fun, outgoing, and reliable Event Assistants to join its team and help bring events to life! You'll help with setup, booths, guest interaction, and fun activities like bracelet making, sweatpant customization, and more.\n\nThe schedule is super flexible—some weeks may have multiple events and other weeks may have none. Events are shared in a group chat, so you can let the team know when you're available. It's a great way to make extra money while doing something social and fun!\n\nLooking for someone who is energetic, personable, dependable, and takes initiative. If you're interested in marketing, there may also be opportunities to help with social media and other marketing projects."}, {"id": "26780", "title": "Babysitter/Nanny", "bhTitle": "Babysitter/Nanny", "category": "Education & Childcare", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-17", "exp": "2026-12-17", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\nSchedule: 8:00 AM–4:00 PM\n\nPosition Overview\n\nA family in the Boro Park/Flatbush area of Brooklyn is seeking a reliable, caring, and responsible Nanny to provide attentive care for an 8-month-old baby through June.\n\nThe primary schedule is Monday, Tuesday, and Thursday from 8:00 AM–4:00 PM. There is also an opportunity for a five-day schedule for a nanny who is comfortable caring for two babies. Under the five-day arrangement, three days would involve caring for two babies, while two days would involve caring for one baby.\n\nSchedule Options\n\nPart-Time Option:\n\n\tMonday, Tuesday & Thursday\n\t8:00 AM–4:00 PM\n\tCare for one 8-month-old baby\n\nFive-Day Option:\n\n\tMonday–Friday\n\t8:00 AM–4:00 PM\n\tThree days caring for two babies\n\tTwo days caring for one baby\n\nKey Responsibilities\n\n\tProvide attentive and nurturing care for the baby throughout the day.\n\tHandle feeding, bottles, diaper changes, and nap routines.\n\tEngage the baby in age-appropriate play and developmental activities.\n\tMaintain a safe, clean, and comfortable environment.\n\tFollow established feeding and sleeping schedules.\n\tAssist with basic baby-related cleanup and organization.\n\tProvide regular updates to parents regarding feeding, naps, activities, and the baby's day.\n\tComfort and respond appropriately to the baby's needs.\n\tFor the five-day position, safely and attentively manage the care of two babies on designated days.\n\nQualifications\n\n\tPrevious infant-care or nanny experience strongly preferred.\n\tComfortable caring for an 8-month-old baby.\n\tComfortable caring for two babies simultaneously if interested in the five-day schedule.\n\tReliable, punctual, patient, and caring.\n\tStrong understanding of infant safety and daily routines.\n\tGood communication skills.\n\tAbility to follow parents' instructions and established routines.\n\tReferences from previous families or childcare positions preferred."}, {"id": "26779", "title": "Business Manager – Beauty & Skincare", "bhTitle": "Manager", "category": "Sales & Live Selling", "type": "Remote / Hybrid", "typeNote": "Remote/Hybrid/FT", "state": "NY", "added": "2026-09-16", "exp": "2026-12-16", "desc": "Location: Remote\nEmployment Type: Full-Time\n\nPosition Overview\n\nA growing beauty and skincare brand is seeking an experienced and results-driven Business Manager to support the continued growth and development of the business.\n\nThis role will work closely with sales, marketing, operations, and product teams to drive revenue, strengthen key retail and wholesale partnerships, and execute strategic business initiatives. The Business Manager will also help identify new market opportunities and support the overall expansion of the brand.\n\nThe ideal candidate has previous experience in the beauty, cosmetics, or skincare industry, strong business and analytical skills, and the ability to manage multiple projects and priorities in a fast-paced environment.\n\nKey Responsibilities\n\n\tDrive business growth and support overall sales and revenue goals.\n\tDevelop and execute strategies to expand the brand's presence in the beauty and skincare market.\n\tBuild and maintain strong relationships with retail and wholesale partners, including Sephora and other key accounts.\n\tIdentify opportunities to develop new retail, wholesale, and strategic partnerships.\n\tWork closely with marketing, sales, operations, and product teams on business initiatives.\n\tHelp plan and execute strategic initiatives supporting brand development and expansion.\n\tAnalyze sales performance, market trends, customer behavior, and competitive activity.\n\tIdentify new business and market opportunities that can contribute to continued growth.\n\tSupport account strategy, product launches, promotions, and other key initiatives.\n\tAssist with sales forecasting, business planning, and performance reporting.\n\tMonitor business performance and provide recommendations based on sales and market data.\n\tMaintain strong communication with internal teams and external business partners.\n\tManage multiple projects, accounts, and priorities simultaneously.\n\tSupport negotiations and business discussions with retail and wholesale partners.\n\tStay current on trends and developments within the beauty, cosmetics, skincare, and clean-beauty industries.\n\nQualifications\n\n\tPrevious professional experience in the beauty, cosmetics, or skincare industry required.\n\tExperience working with retail or wholesale accounts strongly preferred.\n\tExisting knowledge of major beauty retailers and the broader beauty market.\n\tStrong business acumen and analytical skills.\n\tExcellent communication, presentation, and negotiation abilities.\n\tStrong relationship-building and account-management skills.\n\tAbility to analyze market trends and identify growth opportunities.\n\tHighly organized with the ability to manage multiple projects and priorities.\n\tResults-driven and comfortable working toward sales and revenue objectives.\n\tAbility to collaborate effectively across sales, marketing, operations, and product teams.\n\tStrong interest in beauty, skincare, clean beauty, and product innovation."}, {"id": "26778", "title": "Dance Class Assistant", "bhTitle": "Dance Class Assistant", "category": "Education & Childcare", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-16", "exp": "2026-12-03", "desc": "Dance company seeking a friendly, reliable individual to assist during weekday dance classes. Responsibilities include helping the instructor, working with students, and providing general classroom support. Dance experience is needed."}, {"id": "26777", "title": "Sales Specialist", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-16", "exp": "2026-12-16", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time, In-Office\nSchedule: Monday–Friday\n\nPosition Overview\n\nA growing national service company is seeking a motivated and results-driven Sales Specialist to join its expanding sales team.\n\nThe Sales Specialist will engage with prospective customers, identify their needs, explain available service options, and convert qualified leads into new customers. This position involves a combination of inbound sales opportunities and outbound follow-up, with responsibility for guiding prospects through the sales process from initial conversation through enrollment.\n\nThe ideal candidate is confident, persuasive, customer-focused, and motivated by achieving sales goals and earning commission.\n\nKey Responsibilities\n\nSales & Customer Engagement\n\n\tRespond promptly to inbound leads and inquiries.\n\tConduct outbound calls and follow up with prospective customers.\n\tBuild rapport and identify each prospect's needs, concerns, and priorities.\n\tEducate prospective customers about available plans, services, coverage options, and benefits.\n\tRecommend appropriate solutions based on individual customer needs.\n\tClearly communicate the value and benefits of available services.\n\tAnswer questions and confidently address customer objections.\n\tGuide prospects through the entire sales process from initial contact through enrollment.\n\tProvide a professional and positive customer experience throughout the sales process.\n\nPipeline & Performance\n\n\tMaintain an active pipeline of prospective customers.\n\tFollow up consistently with leads to maximize conversion opportunities.\n\tWork toward and achieve individual sales goals and performance metrics.\n\tIdentify opportunities to improve conversion rates and overall sales performance.\n\tMaintain persistence and professionalism throughout the follow-up process.\n\tParticipate in ongoing sales coaching, training, and performance-development activities.\n\nCRM & Documentation\n\n\tAccurately document customer interactions and sales activity within the company's CRM system.\n\tMaintain accurate records of leads, follow-ups, enrollments, and sales outcomes.\n\tKeep prospect information and pipeline activity current.\n\tStay informed about products, services, pricing, promotions, and company policies.\n\tFollow established sales processes, compliance requirements, and company procedures.\n\tCollaborate with other departments to help ensure a smooth transition from prospect to customer.\n\nQualifications\n\n\t1+ year of experience in sales, customer service, call center, or a related role preferred.\n\tStrong verbal and written communication skills.\n\tConfident and professional phone presence.\n\tStrong persuasion, negotiation, and objection-handling abilities.\n\tAbility to quickly build rapport and establish trust with prospective customers.\n\tSelf-motivated, competitive, and goal-oriented.\n\tComfortable working in a fast-paced, performance-driven sales environment.\n\tStrong follow-up, organizational, and time-management skills.\n\tComfortable working with CRM systems and other sales technology.\n\tAbility to quickly learn products and clearly explain their features and benefits.\n\tProfessional, accountable, dependable, and detail-oriented."}, {"id": "26776", "title": "Senior Performance Marketing Manager", "bhTitle": "Marketing", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-16", "exp": "2026-12-16", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time, In-Office\nSchedule: Monday–Friday\n\nPosition Overview\n\nA growing national service company is seeking an experienced Senior Performance Marketing Manager to lead the strategy, execution, optimization, and measurement of its paid acquisition programs.\n\nThis is a highly hands-on role responsible for Paid Search, Paid Social, Digital Video, Connected TV (CTV), and multi-touch attribution. Paid search will be a major focus of the position, while the Senior Performance Marketing Manager will also develop upper-funnel channels and ensure marketing investments are accurately measured for performance and incrementality.\n\nThe ideal candidate combines strategic thinking, advanced analytics, and hands-on campaign management. This individual should be equally comfortable working directly inside advertising platforms, analyzing complex performance data, managing significant media budgets, and presenting actionable recommendations to senior leadership.\n\nKey Responsibilities\n\nPaid Search & Acquisition\n\n\tDevelop, execute, manage, and optimize paid search campaigns across Google Ads, Microsoft Advertising, and other relevant platforms.\n\tManage paid media budgets exceeding $100,000 per month.\n\tDevelop acquisition strategies across multiple service lines, geographic markets, audiences, and business objectives.\n\tMonitor and optimize key performance metrics, including CTR, conversion rate, CPL, CPA, lead quality, and ROAS.\n\tConduct keyword research, competitive analysis, audience segmentation, and bidding optimization.\n\tContinuously test campaign structures, ad copy, creative concepts, landing pages, audiences, and bidding strategies.\n\tIdentify opportunities to improve lead quality, conversion rates, acquisition costs, and overall return on advertising spend.\n\nPaid Social, Video & CTV\n\n\tPlan, launch, and optimize paid social campaigns across Meta and additional platforms such as TikTok and Pinterest when appropriate.\n\tManage digital video campaigns across YouTube and other relevant platforms.\n\tPlan, buy, and optimize Connected TV campaigns through a DSP.\n\tManage CTV targeting, inventory, reach and frequency, creative rotation, pacing, and spend.\n\tDevelop strategies for expanding upper-funnel acquisition while maintaining measurable business outcomes.\n\tEvaluate emerging advertising platforms and channels for potential growth opportunities.\n\nAttribution & Analytics\n\n\tOwn and maintain multi-touch attribution and conversion tracking across marketing channels.\n\tEnsure accurate tracking of online, offline, and phone-sale conversions.\n\tDesign and analyze incrementality testing, including geo holdouts, lift studies, and related methodologies.\n\tUtilize tools such as GA4, Google Tag Manager, Looker Studio, Hyros, and other analytics platforms.\n\tEvaluate performance across channels and determine the incremental impact of marketing investments.\n\tIdentify meaningful performance trends while distinguishing them from normal fluctuations in data.\n\nReporting & Strategy\n\n\tBuild weekly and monthly paid-media reports.\n\tAnalyze campaign and channel performance and translate complex data into clear business recommendations.\n\tPresent performance results, insights, opportunities, and recommendations to senior leadership.\n\tDevelop forecasting, budget allocation, and performance models.\n\tRecommend changes to channel strategy based on performance, attribution, and incrementality data.\n\tMonitor competitive activity and evolving digital advertising trends.\n\nCross-Functional Collaboration\n\n\tPartner with SEO, creative, web development, sales, and leadership teams on integrated marketing initiatives.\n\tProvide recommendations for landing pages, creative assets, messaging, and conversion optimization.\n\tManage relationships with media platforms, agency partners, and measurement vendors.\n\tStay current on developments in paid search, AI-driven advertising, automation, social media, streaming video, and performance-marketing technology.\n\nQualifications\n\n\t5+ years of hands-on PPC, Paid Search, and performance marketing experience required.\n\tProven experience successfully managing $100,000+ in monthly paid media spend.\n\tDeep hands-on experience with Google Ads and Microsoft Advertising.\n\tStrong working knowledge of Google Analytics 4 (GA4), Google Tag Manager, Looker Studio, and Meta Ads Manager.\n\tHands-on experience managing paid social campaigns, including Meta.\n\tExperience managing YouTube or other digital video campaigns.\n\tHands-on experience planning, buying, and optimizing Connected TV campaigns through a DSP.\n\tStrong understanding of attribution models, incrementality measurement, bidding strategies, audience targeting, conversion optimization, and campaign automation.\n\tExperience implementing or managing a multi-touch attribution platform such as Hyros, Northbeam, Triple Whale, or a comparable platform.\n\tStrong analytical and quantitative skills.\n\tAdvanced Microsoft Excel or Google Sheets skills for modeling, reporting, and analysis.\n\tExcellent written and verbal communication skills.\n\tStrong project-management and organizational abilities.\n\tAbility to manage multiple campaigns, channels, budgets, and initiatives simultaneously in a fast-paced environment."}, {"id": "26775", "title": "Customer Service Specialist", "bhTitle": "Customer Service", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-16", "exp": "2026-12-16", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time, In-Office\nSchedule: Monday–Friday\n\nPosition Overview\n\nA growing national service company is seeking a detail-oriented and customer-focused Customer Service Specialist – Billing to join its team.\n\nThis position combines customer service, billing, payment processing, and financial coordination. The specialist will communicate directly with customers and service providers to answer billing questions, process payments and reimbursements, resolve payment issues, and ensure transactions are handled accurately and efficiently.\n\nThe ideal candidate is a strong communicator who is comfortable discussing billing and financial matters, solving problems independently, and maintaining accuracy in a fast-paced environment.\n\nKey Responsibilities\n\nCustomer Service & Billing Support\n\n\tServe as a primary point of contact for customers and service providers regarding billing, payments, reimbursements, and other financial matters.\n\tRespond professionally to customer and vendor inquiries by phone, email, and internal communication platforms.\n\tAnswer billing questions and explain payment information clearly and professionally.\n\tConduct outbound calls and follow-up communications regarding invoices, outstanding payments, and transaction status.\n\tProvide timely updates and maintain a high level of customer service throughout each interaction.\n\nPayments & Reimbursements\n\n\tProcess customer payments, refunds, reimbursements, and service-provider payments.\n\tManage failed, declined, or outstanding payments.\n\tWork with customers to establish appropriate payment arrangements when necessary.\n\tCoordinate payments for authorized services.\n\tVerify required information and documentation before processing transactions.\n\tAssist with refunds, payment-plan changes, collections, and other routine billing requests.\n\tEnsure all payments and financial transactions are processed accurately.\n\nVendor & Service Provider Coordination\n\n\tCommunicate with service providers regarding invoices and payments.\n\tConfirm completion of authorized services when necessary.\n\tVerify invoice details and supporting information.\n\tResearch and resolve payment discrepancies.\n\tFollow up with service providers regarding outstanding documentation or payment issues.\n\nDocumentation & Issue Resolution\n\n\tMaintain accurate records of billing activity, payments, customer interactions, and vendor transactions.\n\tDocument transactions and communications within internal systems.\n\tResolve routine billing and payment issues independently.\n\tEscalate complex or unusual financial matters to the appropriate department.\n\tFollow established billing procedures, company policies, and compliance requirements.\n\tMeet established service and performance metrics while maintaining accuracy and professionalism.\n\nQualifications\n\n\tPrevious experience in billing, Accounts Receivable, Accounts Payable, customer service, or a related position preferred.\n\tExperience processing payments or handling financial transactions is a plus.\n\tStrong customer service and interpersonal skills.\n\tProfessional and confident phone presence.\n\tExcellent written and verbal communication skills.\n\tStrong attention to detail and accuracy.\n\tComfortable discussing billing and payment matters with customers and vendors.\n\tStrong problem-solving and decision-making abilities.\n\tAbility to manage multiple responsibilities and changing priorities.\n\tComfortable working independently and recognizing when an issue requires escalation.\n\tComfortable using electronic payment systems, email, phone systems, and other business technology.\n\tDependable, organized, and able to meet deadlines.\n\tAbility to maintain professionalism in a fast-paced environment."}, {"id": "26774", "title": "Bookkeeper & Payroll Specialist", "bhTitle": "Bookkeeper", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-16", "exp": "2026-12-16", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time, In-Office\nSchedule: Monday–Friday\n\nPosition Overview\n\nA growing national service company is seeking an experienced Bookkeeper & Payroll Specialist to join its Accounting and Finance team.\n\nThis hands-on position will be responsible for maintaining accurate financial records, managing Accounts Payable and Accounts Receivable, processing payroll, completing reconciliations, and supporting financial reporting.\n\nThe Bookkeeper & Payroll Specialist will work closely with the Controller and senior leadership to ensure financial information is accurate, organized, timely, and compliant. This is an excellent opportunity for an accounting professional who wants to play an important role in strengthening and improving financial processes within a growing organization.\n\nKey Responsibilities\n\nBookkeeping & Accounting\n\n\tMaintain accurate and up-to-date accounting records for sales, purchases, receipts, payments, and other financial transactions.\n\tRecord and properly categorize transactions in QuickBooks Online.\n\tMaintain accurate general ledger records.\n\tReceive, verify, process, and organize invoices, receipts, and supporting financial documentation.\n\tAssist with journal entries, accruals, adjustments, and other accounting activities.\n\tPerform account and bank reconciliations.\n\tAssist the Controller with month-end closing activities.\n\tMaintain organized and accurate financial documentation and records.\n\nAccounts Payable & Accounts Receivable\n\n\tManage the full cycle of Accounts Payable (AP) and Accounts Receivable (AR).\n\tProcess vendor invoices and payments accurately and on schedule.\n\tMonitor outstanding receivables and follow up on overdue accounts.\n\tMaintain AP and AR aging reports.\n\tResearch and resolve billing, payment, and account discrepancies.\n\tEnsure transactions are properly documented and categorized.\n\nPayroll\n\n\tProcess payroll accurately and on schedule.\n\tCoordinate with HR and department leaders to verify employee hours and payroll information.\n\tProcess applicable bonuses, commissions, deductions, and other payroll adjustments.\n\tReview payroll information for accuracy before processing.\n\tMaintain organized payroll records and documentation.\n\tHandle employee and payroll information with a high level of confidentiality.\n\tAssist with payroll processing across multiple regions as needed.\n\tHelp ensure compliance with applicable payroll requirements and company policies.\n\nFinancial Reporting & Support\n\n\tAssist with preparing Profit & Loss statements, balance sheets, cash flow summaries, and other financial reports.\n\tMonitor and categorize company expenses.\n\tHelp ensure expenses are properly recorded and aligned with departmental budgets.\n\tProvide accounting information and reports to the Controller and senior leadership as needed.\n\tAssist with improving and streamlining accounting, bookkeeping, and payroll procedures.\n\tSupport additional Accounting and Finance projects as the organization continues to grow.\n\nQualifications\n\n\t3–7 years of professional bookkeeping or accounting experience.\n\tProficiency in QuickBooks Online required.\n\tStrong knowledge of Microsoft Excel and financial reporting tools.\n\tExperience with Accounts Payable, Accounts Receivable, reconciliations, and general bookkeeping.\n\tPrevious payroll processing experience required.\n\tUnderstanding of accounting principles, including GAAP, IFRS, or similar standards.\n\tStrong attention to detail and commitment to accuracy.\n\tExcellent organizational and time-management skills.\n\tAbility to manage multiple responsibilities and meet deadlines in a fast-paced environment.\n\tHigh level of professionalism, discretion, and confidentiality.\n\tBachelor's degree in Accounting, Finance, or a related field preferred."}, {"id": "26772", "title": "Staffing Coordinator", "bhTitle": "Coordinator", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-16", "exp": "2026-12-16", "desc": "Location: Queens, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nAn Early Intervention and CPSE program is seeking a highly organized and dependable Staffing Coordinator to join its Queens office.\n\nThe Staffing Coordinator will help coordinate staffing needs for the Early Intervention and CPSE programs, ensuring cases are appropriately staffed and communication between providers, families, and the internal team remains organized and timely.\n\nThis is a full-time, in-office position in Queens.\n\nKey Responsibilities\n\n\tCoordinate staffing for Early Intervention and CPSE cases.\n\tMatch available providers with open cases based on scheduling and program needs.\n\tCommunicate with providers regarding available cases and assignments.\n\tFollow up consistently on open and pending cases.\n\tMaintain accurate and organized staffing records.\n\tTrack provider availability and case status.\n\tCommunicate with families and internal team members regarding staffing updates as needed.\n\tAssist with onboarding and coordinating newly assigned providers.\n\tMaintain organized documentation and update internal systems.\n\tMonitor outstanding staffing needs and prioritize urgent cases.\n\tWork closely with program staff to ensure cases are staffed efficiently.\n\tProvide general administrative and coordination support as needed.\n\nQualifications\n\n\tStrong organizational and time-management skills.\n\tExcellent written and verbal communication skills.\n\tAbility to manage multiple cases and priorities simultaneously.\n\tStrong attention to detail and follow-up skills.\n\tComfortable communicating with providers, families, and internal staff.\n\tProficient with computers, email, and general office systems.\n\tDependable, professional, and proactive.\n\tPrevious experience in staffing, scheduling, coordination, Early Intervention, CPSE, healthcare, education, or a related environment is preferred."}, {"id": "26771", "title": "Paralegal", "bhTitle": "Paralegal", "category": "Legal", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-15", "exp": "2026-12-15", "desc": "Location: Cedarhurst, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nA growing law firm in Cedarhurst, NY is seeking a motivated and detail-oriented Paralegal or Title Coordinator to join its team.\n\nThis position offers the opportunity to work on sophisticated transactions across areas including real estate, title, corporate, healthcare, and general business matters. Candidates at various experience levels will be considered.\n\nThe ideal candidate is highly organized, communicates effectively, and can manage multiple transactions and responsibilities in a professional and collaborative legal environment.\n\nKey Responsibilities\n\n\tAssist attorneys with transactional legal matters.\n\tSupport real estate, title, corporate, healthcare, and business-related transactions.\n\tAssist with the preparation, review, and organization of transaction documents.\n\tCoordinate documentation and information throughout the transaction process.\n\tMaintain organized electronic and physical matter files.\n\tTrack transaction requirements, outstanding items, and important deadlines.\n\tCommunicate professionally with attorneys, clients, title companies, and other parties involved in transactions.\n\tAssist with due diligence and document collection.\n\tFollow up on outstanding documents and transaction-related matters.\n\tHelp ensure transactions progress efficiently from opening through closing.\n\tManage multiple active matters and priorities simultaneously.\n\tProvide general paralegal and administrative support to attorneys as needed.\n\nQualifications\n\n\tPrior experience in real estate, healthcare, title, corporate, business transactions, or related legal work is helpful.\n\tCandidates at various experience levels will be considered.\n\tParalegal certificate is not required.\n\tStrong organizational and time-management skills.\n\tExcellent attention to detail.\n\tStrong written and verbal communication skills.\n\tAbility to manage multiple transactions and deadlines simultaneously.\n\tProfessional, dependable, and motivated.\n\tAbility to work effectively both independently and collaboratively.\n\tInterest in developing professionally while working on sophisticated legal transactions."}, {"id": "26770", "title": "Drayage Sales Representative", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-09-15", "exp": "2026-12-15", "desc": "Location: Bayonne, NJ\nJob Type: Full-time\nSchedule: Standard Business Hours\n\nHelp grow a reliable drayage operation by connecting importers, freight forwarders, customs brokers, and logistics companies with dependable container transportation services. We are seeking a motivated, self driven salesperson who can identify new opportunities, build strong customer relationships, and bring in new business. This is an excellent opportunity for someone who understands the transportation industry and is ready to grow their sales career.\n\nKey Responsibilities:\n\n\tIdentify new business opportunities and prospect potential clients including importers, freight forwarders, and customs brokers.\n\n\tBuild, maintain, and strengthen long term customer relationships.\n\n\tSell dependable container transportation services to meet client logistics needs.\n\n\tDrive revenue growth and expand our market presence through proactive sales strategies.\n\nQualifications:\n\n\tDrayage, trucking, or logistics sales experience preferred.\n\n\tStrong communication, negotiation, and prospecting skills.\n\n\tExisting industry contacts and network are a plus.\n\n\tSelf motivated, results driven, and eager to build a successful sales career.\n\nWhat We Offer:\n\n\tOpportunity to grow your sales career with a reliable, expanding drayage operation.\n\n\tSupportive environment focused on building lasting client partnerships."}, {"id": "26769", "title": "Door-to-Door Campaign Outreach", "bhTitle": "Door-to-Door Campaign Outreach", "category": "Sales & Live Selling", "type": "Temporary", "typeNote": "", "state": "NY", "added": "2026-09-15", "exp": "2026-12-15", "desc": "Location: NYS Assembly District 45, Brooklyn\nSchedule: Flexible / Part-Time\nRequirement: Must be 18+\n\nAn independent organization is hiring friendly, outgoing individuals to conduct door-to-door outreach in support of a campaign for New York State Assembly District 45. The role involves knocking on doors and speaking with residents, with a simple one-hour training provided on how to use the campaign app."}, {"id": "26768", "title": "Associate Attorney", "bhTitle": "Attorney", "category": "Legal", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-15", "exp": "2026-12-15", "desc": "Location: Monsey, NY\nEmployment Type: Full-Time, In-Person\n\nPosition Overview\n\nA boutique commercial real estate law firm in the Monsey, NY area is seeking a motivated and detail-oriented Associate Attorney to join its growing practice.\n\nThis is an excellent opportunity for an attorney who has a strong interest in transactional commercial real estate law and wants to develop their skills within a focused and professional legal environment.\n\nThe ideal candidate is highly organized, attentive to detail, and possesses strong legal research, writing, and communication skills.\n\nKey Responsibilities\n\n\tAssist attorneys with transactional commercial real estate matters.\n\tDraft, review, and revise legal documents and agreements.\n\tConduct legal research related to commercial real estate transactions.\n\tPrepare correspondence, memoranda, and other legal materials.\n\tReview transaction documents for accuracy, completeness, and legal issues.\n\tAssist with due diligence and document organization.\n\tSupport attorneys throughout various stages of commercial real estate transactions.\n\tCommunicate professionally with clients, attorneys, and other parties involved in transactions.\n\tMaintain organized and accurate matter files and documentation.\n\tTrack deadlines and ensure assigned matters move forward efficiently.\n\tHandle multiple matters and priorities while maintaining strong attention to detail.\n\tAssist with additional transactional legal matters as needed.\n\nQualifications\n\n\tJuris Doctor (J.D.) degree required.\n\tAdmission to practice law in New York, or eligibility to practice as required for the position.\n\tStrong interest in transactional commercial real estate law.\n\tExcellent legal research and writing skills.\n\tExceptional attention to detail.\n\tStrong organizational and time-management abilities.\n\tExcellent written and verbal communication skills.\n\tAbility to manage multiple assignments and deadlines simultaneously.\n\tProfessional, dependable, and proactive.\n\tAbility to work effectively both independently and collaboratively.\n\tPrior commercial real estate or transactional experience is a plus."}, {"id": "26766", "title": "School Route Driver", "bhTitle": "Driver", "category": "Warehouse, Driving & Logistics", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-15", "exp": "2026-12-15", "desc": "Location: Brooklyn, NY / Five Towns, NY / Crown Heights, Brooklyn\nEmployment Type: Part-Time\nSchedule: Morning Pickup Route and/or Afternoon Dismissal Route\n\nPosition Overview\n\nA reliable and responsible Driver is needed to handle a morning pickup route and/or afternoon dismissal route, transporting passengers between Brooklyn, the Five Towns, and Crown Heights.\n\nCandidates may be available for the morning route, afternoon route, or both. The ideal candidate is punctual, dependable, safety-conscious, and familiar with driving throughout Brooklyn and the Five Towns area.\n\nKey Responsibilities\n\n\tComplete scheduled morning pickups and/or afternoon dismissal transportation.\n\tSafely transport passengers between designated pickup and drop-off locations.\n\tFollow an established daily route and schedule.\n\tArrive at pickup locations on time and maintain consistent attendance.\n\tEnsure passengers enter and exit the vehicle safely.\n\tMaintain professional and courteous communication with families and staff.\n\tMonitor traffic and road conditions and plan accordingly to maintain the schedule.\n\tMaintain a clean, safe, and organized vehicle.\n\tFollow all applicable traffic and transportation safety requirements.\n\tCommunicate promptly regarding delays, route issues, or other concerns.\n\nQualifications\n\n\tValid driver's license required.\n\tClean and safe driving record preferred.\n\tReliable, responsible, and punctual.\n\tStrong commitment to passenger safety.\n\tFamiliarity with Brooklyn, Crown Heights, and the Five Towns preferred.\n\tComfortable driving during morning and/or afternoon school transportation hours.\n\tStrong communication and time-management skills.\n\tPrevious experience as a school driver, route driver, transportation driver, or similar position is preferred"}, {"id": "26765", "title": "Direct Support Professional (DSP)", "bhTitle": "Direct Support Professional", "category": "Healthcare & Human Services", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-15", "exp": "2026-12-10", "desc": "Schedule: Afternoon/Evening Hours\n\nOrganization is seeking Direct Support Professionals (DSPs) to provide support and assistance to individuals with special needs. Ideal candidates are caring, responsible, and patient, with a desire to make a positive impact."}, {"id": "26763", "title": "Office Administrator", "bhTitle": "Administration", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-15", "exp": "2026-12-15", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time, In-Office\nPosition Overview\nA growing national home services company is seeking a proactive, organized, and detail-oriented Office Administrator to support day-to-day office operations and help maintain an efficient, professional, and welcoming workplace.\nThis is a hands-on administrative role for someone who enjoys keeping things organized, anticipating needs, solving problems, and supporting multiple departments. The Office Administrator will coordinate office logistics, supplies, vendors, meetings, onboarding needs, workplace amenities, and a variety of administrative projects.\nThe ideal candidate is dependable, resourceful, highly organized, and comfortable taking ownership of the many details that keep a busy office running smoothly.\nKey Responsibilities\n\n\tSupport day-to-day office operations and ensure administrative needs are handled efficiently across departments.\n\tMaintain office supplies and inventory, including ordering, storage, and vendor coordination.\n\tCoordinate mail, deliveries, office equipment, and facility-related requests.\n\tHelp maintain a clean, organized, professional, and welcoming office environment.\n\tManage workplace amenities, refreshments, supplies, and other hospitality needs.\n\tServe as a point of contact for employees regarding general office and administrative requests.\n\tCoordinate meetings, conference rooms, and office spaces for internal and external meetings.\n\tSupport new-hire onboarding logistics, including workspace setup, supplies, badges, and equipment coordination.\n\tAssist with company events, team-building activities, office celebrations, and internal meetings.\n\tCoordinate company apparel, merchandise, office materials, and related inventory as needed.\n\tMaintain organized administrative records, documentation, and tracking systems.\n\tAssist various departments with data entry, administrative projects, and operational coordination.\n\tCommunicate professionally with employees, leadership, vendors, visitors, and clients.\n\tAssist leadership and department managers with administrative tasks and special projects.\n\tCoordinate routine approvals, signatures, invoices, and other administrative workflows.\n\tProactively monitor office needs and identify opportunities to improve organization, efficiency, and the overall workplace experience.\n\tHandle sensitive company and employee information with professionalism, discretion, and confidentiality.\n\nQualifications\n\n\tStrong organizational and multitasking skills with the ability to manage competing priorities.\n\tExcellent attention to detail and accuracy.\n\tReliable, punctual, and highly accountable.\n\tStrong written and verbal communication skills.\n\tProfessional and personable with strong interpersonal skills and a service-oriented mindset.\n\tComfortable working in a fast-paced environment where priorities may change.\n\tProactive problem-solver who can work independently while collaborating effectively with a team.\n\tProficiency with Google Workspace, Microsoft Office, and general office technology.\n\tAbility to interact professionally with employees at all levels, as well as vendors and visitors.\n\tWillingness to handle both routine administrative responsibilities and broader operational projects.\n\tInterest in growing within operations, administration, or related business functions is a plus."}, {"id": "26762", "title": "Procurement Manager", "bhTitle": "Manager", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-15", "exp": "2026-12-15", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nA growing national home services company is seeking an experienced and hands-on Procurement Manager to lead its procurement operations, purchasing activities, and supplier network.\n\nThe Procurement Manager will be responsible for sourcing appliances, systems, equipment, replacement parts, and other materials needed to support service requests nationwide. This position will oversee the daily performance of the procurement team while developing strategies to reduce costs, improve purchasing efficiency, strengthen supplier relationships, and ensure timely fulfillment.\n\nThe ideal candidate combines strong procurement and vendor management experience with analytical skills, operational leadership, and a continuous-improvement mindset. This is a hands-on management position requiring someone who can effectively oversee both the strategic and day-to-day aspects of a high-volume procurement operation.\n\nKey Responsibilities\n\nProcurement & Supplier Management\n\n\tLead the Procurement Department and ensure purchasing activities align with company objectives, service standards, and budget requirements.\n\tDevelop and execute procurement strategies focused on cost savings, supplier performance, fulfillment speed, and operational efficiency.\n\tSource, evaluate, negotiate with, onboard, and manage suppliers across a national vendor network.\n\tNegotiate competitive pricing, purchasing terms, service levels, and other favorable supplier arrangements.\n\tConduct regular supplier performance reviews.\n\tEvaluate suppliers based on pricing, reliability, delivery times, returns, order accuracy, and overall service.\n\tIdentify opportunities to reduce purchasing costs and improve supplier terms.\n\tExpand and diversify the supplier network to strengthen sourcing capabilities.\n\tManage escalated supplier, purchasing, and fulfillment issues.\n\nProcurement Operations\n\n\tOversee daily procurement activity, including purchasing queues, assignments, team workflows, and escalations.\n\tEnsure orders are processed accurately and efficiently.\n\tIdentify bottlenecks and implement solutions to improve purchasing and fulfillment processes.\n\tMaintain and improve procurement workflows within proprietary internal systems.\n\tImprove purchasing accuracy, internal communication, and fulfillment efficiency.\n\tAnticipate staffing, resource, technology, and operational needs as purchasing volume increases.\n\tDevelop solutions to complex procurement and operational challenges.\n\nReporting & Performance Management\n\n\tDevelop, monitor, and evaluate departmental KPIs and performance metrics.\n\tAnalyze purchasing activity, costs, supplier performance, and fulfillment data.\n\tIdentify trends, weaknesses, and opportunities for improvement.\n\tPrepare reports and provide data-driven recommendations to leadership.\n\tTrack cost-saving initiatives and procurement performance.\n\tUse reporting and operational data to drive purchasing decisions and process improvements.\n\nSystems & Process Improvement\n\n\tPartner with internal technology teams to improve procurement systems and workflows.\n\tAssist with developing Business Requirement Documents (BRDs) for system enhancements.\n\tParticipate in testing and implementation of new processes, tools, and functionality.\n\tIdentify opportunities to automate or streamline repetitive procurement processes.\n\tCollaborate with operations and technical service teams to improve sourcing capabilities and reduce overall service costs.\n\nTeam Leadership\n\n\tLead, mentor, and develop procurement team members.\n\tEstablish clear expectations and promote accountability and strong performance.\n\tConduct performance evaluations and provide ongoing coaching and feedback.\n\tSupport succession planning and professional development initiatives.\n\tPartner with Learning & Development to create and improve training programs.\n\tEnsure new and existing team members receive appropriate training on procurement processes and systems.\n\tFoster a collaborative, accountable, and results-oriented team environment.\n\nQualifications\n\n\tProven experience in procurement, purchasing, sourcing, supply chain, vendor management, or a related operational role.\n\tPrevious experience managing or supervising a team in a high-volume environment.\n\tStrong supplier negotiation and relationship-management skills.\n\tDemonstrated ability to identify and execute cost-saving opportunities.\n\tStrong analytical skills with experience utilizing KPIs, reporting, and performance data.\n\tExcellent problem-solving and decision-making abilities.\n\tStrong organizational and time-management skills.\n\tAbility to manage multiple priorities and deadlines simultaneously.\n\tExcellent written and verbal communication skills.\n\tComfortable presenting recommendations and performance information to leadership.\n\tExperience improving operational workflows, systems, and processes.\n\tComfortable learning and working with proprietary business systems and technology.\n\tProficiency with Windows-based systems; familiarity with macOS is a plus.\n\tExperience forecasting staffing and resource requirements during high-volume periods preferred.\n\tStrong leadership skills with the ability to coach, motivate, and develop team members.\n\tProactive, adaptable, detail-oriented, and comfortable working in a rapidly evolving environment.\n\tHigh level of professionalism, accountability, integrity, and discretion."}, {"id": "26761", "title": "Paralegal / Office Assistant", "bhTitle": "Legal Assistant", "category": "Legal", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-15", "exp": "2026-12-10", "desc": "Location: Brooklyn\nSchedule: Part-Time, ideally 4 days/week (no Fridays)\n\nLaw office seeking a Paralegal or Office Assistant with strong organizational skills and the ability to manage emails, communicate with clients, and use Microsoft Office and Adobe Acrobat. Previous experience is a plus, but willing to train the right candidate."}, {"id": "26757", "title": "Paraprofessional", "bhTitle": "Shadow/ Paraprofessional", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-14", "exp": "2026-12-14", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: 10-Month Position, September–June\n\nPosition Overview\n\nA school-based program in Brooklyn, NY is seeking dedicated and compassionate Paraprofessionals to provide individualized support to students and work alongside a team of educational and therapeutic professionals.\n\n This is an excellent opportunity for someone who enjoys working with children and wants to make a meaningful impact on students' academic, social, and developmental growth.\n\nKey Responsibilities\n\n\tProvide one-on-one or classroom-based support to students.\n\tAssist students with academic activities and daily classroom routines.\n\tReinforce skills and strategies established by teachers and therapists.\n\tEncourage student participation, independence, and positive behavior.\n\tHelp students remain engaged and focused during classroom activities.\n\tSupport students with transitions and other school-day activities.\n\tCollaborate with teachers, therapists, supervisors, and other educational professionals.\n\tObserve student progress and communicate relevant information to the appropriate team members.\n\tComplete required session notes and documentation accurately and on time.\n\tUtilize the provided user-friendly platform for billing and session-note documentation.\n\tMaintain a supportive, professional, and positive environment for students.\n\nQualifications\n\n\tHigh School Diploma required.\n\tPrevious experience working with children or in an educational setting is preferred.\n\tPatient, compassionate, responsible, and dependable.\n\tStrong communication and interpersonal skills.\n\tAbility to follow instructions and collaborate with teachers, therapists, and supervisors.\n\tComfortable providing individualized support to students.\n\tStrong organizational skills and attention to documentation requirements.\n\tCommitment to helping students develop greater confidence and independence."}, {"id": "26756", "title": "Marketing & Social Media Intern", "bhTitle": "Maketing & Social Media Intern", "category": "E-commerce, Marketing & Social Media", "type": "Internship", "typeNote": "", "state": "NJ", "added": "2026-09-14", "exp": "2026-12-09", "desc": "Location: Deal, NJ | Remote possible for social media\n\nCreative company in Deal is seeking a motivated intern to assist with marketing and social media. Great opportunity for someone looking to gain hands-on experience, learn, and contribute creatively. Social media work can be done remotely."}, {"id": "26755", "title": "E-Commerce Listing Assistant", "bhTitle": "E commerce Maintenance", "category": "E-commerce, Marketing & Social Media", "type": "Part Time", "typeNote": "", "state": "NJ", "added": "2026-09-14", "exp": "2026-12-14", "desc": "Location: In-Person, South Plainfield, NJ\nJob Type: Part-Time\nSchedule: Flexible weekday hours\n\nWe are seeking a motivated, detail-oriented team member to assist with our online product listings. If you love shopping, taking photos, and working online, this is a great opportunity to turn those skills into a flexible part-time role! Every day is different and always interesting. We sell a variety of merchandise, including beauty products, jewelry, clothing and accessories, collectibles, household products, and other consumer goods.\n\nThis role is a great fit for college students, stay at home parents, resellers, or anyone seeking flexible part-time work.\n\nKey Responsibilities:\n\n\tPhotograph products for online listings.\n\n\tIdentify and research items to prepare for sale.\n\n\tLook up comparable selling prices across platforms.\n\n\tWrite accurate titles and descriptive text for listings.\n\n\tList products on platform channels including eBay, Poshmark, Mercari, Depop, and others.\n\n\tMeasure items as needed for listing specifications.\n\n\tKeep physical merchandise organized and tracked.\n\n\tManage and update active product listings.\n\nQualifications:\n\n\tComfortable using computers and smartphones.\n\n\tStrong skill set in basic photography and technology.\n\n\tHighly organized, dependable, and detail-oriented.\n\n\tAbility to work independently and manage time effectively.\n\n\tFamiliarity with online shopping or reselling is a plus, but we are willing to train the right candidate.\n\nWhat We Offer:\n\n\tFlexible weekday scheduling to fit your availability.\n\n\tHands-on training in e-commerce, digital marketing, and product pricing.\n\n\tA dynamic, engaging work environment where no two days are the same."}, {"id": "26754", "title": "Babysitter / Nanny", "bhTitle": "Babysitter/Nanny", "category": "Education & Childcare", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-11", "exp": "2026-12-14", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\nSchedule: 12:00 PM–4:30 PM\n\nPosition Overview\n\nA family in Brooklyn, NY is seeking a friendly, caring, and dependable Babysitter / Nanny to provide afternoon care for two young babies, approximately 4 months and 6 months old.\n\nThe ideal candidate is comfortable caring for infants and can provide attentive, nurturing care while helping establish healthy routines as the babies grow.\n\nKey Responsibilities\n\n\tProvide attentive and responsible care for two infants.\n\tFeed the babies according to their established schedules and routines.\n\tChange diapers and assist with general infant care.\n\tPut the babies down for naps and maintain appropriate sleep routines.\n\tEngage the babies in safe, play and activities.\n\tHelp maintain consistent feeding and sleeping schedules.\n\tAssist with introducing and developing new routines as the babies grow.\n\tSupport age-appropriate development and milestones.\n\tHelp with transitions such as introducing solid foods and developing nap routines.\n\tMaintain a safe, clean, and comfortable environment for the babies.\n\tCommunicate with the family regarding feeding, naps, activities, and any concerns.\n\nQualifications\n\n\tPrevious experience caring for infants strongly preferred.\n\tComfortable caring for two young babies.\n\tKnowledge of infant feeding, diapering, naps, and general care.\n\tFriendly, patient, caring, and dependable.\n\tComfortable helping establish new routines as the babies develop.\n\tAttentive and able to manage the needs of both babies.\n\tStrong communication skills.\n\tReliable and punctual."}, {"id": "26752", "title": "Direct Support Professional (DSP)", "bhTitle": "Companion", "category": "Healthcare & Human Services", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-10", "exp": "2026-12-10", "desc": "Location: Boro Park, Brooklyn, NY\nEmployment Type: Part-Time\nSchedule: Weekend Hours\n\nPosition Overview\n\nA caring, motivated, and dependable Direct Support Professional (DSP) is needed to provide one-on-one companionship and support to an adult individual with an intellectual disability in Boro Park, Brooklyn.\n\nThe DSP will spend time with the individual while providing companionship, encouragement, and support with life skills. The goal of the position is to promote independence, social engagement, and overall quality of life in a positive and supportive environment.\n\nKey Responsibilities\n\n\tProvide one-on-one companionship and support.\n\tEngage in appropriate social and recreational activities.\n\tEncourage the development and practice of everyday life skills.\n\tPromote independence with daily activities and routines.\n\tHelp strengthen social, communication, and interpersonal skills.\n\tEncourage participation in meaningful and enjoyable activities.\n\tProvide positive reinforcement, motivation, and encouragement.\n\tHelp the individual build confidence and greater independence.\n\tMaintain a safe, respectful, and supportive environment.\n\tCommunicate appropriately with family members and the support team.\n\tProvide consistent and dependable support during scheduled hours.\n\nQualifications\n\n\tCaring, patient, responsible, and dependable.\n\tStrong interpersonal and communication skills.\n\tComfortable providing one-on-one support to an adult with an intellectual disability.\n\tAbility to encourage independence while providing appropriate assistance.\n\tPositive, engaging, and supportive personality.\n\tReliable and able to maintain a consistent schedule.\n\tPrevious experience as a DSP, companion, mentor, caregiver, paraprofessional, or in a similar support role is preferred but not required."}, {"id": "26751", "title": "Direct Support Professional (DSP)", "bhTitle": "Companion", "category": "Healthcare & Human Services", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-10", "exp": "2026-12-10", "desc": "Location: Midwood, Brooklyn, NY\nEmployment Type: Part-Time\nSchedule: Monday–Friday, 7:00 AM–8:00 AM\n\nPosition Overview\n\nA family in Midwood, Brooklyn is seeking a caring, dependable, and patient Direct Support Professional (DSP) to provide morning assistance and support to an adult individual.\n\nThe DSP will assist with essential morning routines while helping maintain the individual's comfort, dignity, safety, and overall well-being.\n\nKey Responsibilities\n\n\tAssist with morning routines and daily living activities.\n\tProvide assistance with dressing and getting ready for the day.\n\tAssist with toileting and personal care as needed.\n\tProvide assistance with feeding and morning meals.\n\tEncourage participation and independence with daily routines whenever appropriate.\n\tProvide patient, respectful, and attentive one-on-one support.\n\tHelp maintain a comfortable and supportive environment.\n\tPromote the individual's dignity, comfort, and overall well-being.\n\tCommunicate appropriately with family members or the support team regarding any concerns.\n\tMaintain a consistent and dependable morning routine.\n\nQualifications\n\n\tCaring, patient, responsible, and dependable.\n\tComfortable assisting with personal care, toileting, dressing, and feeding.\n\tStrong interpersonal and communication skills.\n\tAbility to provide support in a respectful and dignified manner.\n\tReliable and punctual, with the ability to consistently maintain an early-morning schedule.\n\tPrevious experience as a DSP, caregiver, home health aide, personal care assistant, or similar support role is preferred."}, {"id": "26750", "title": "Direct Support Professional (DSP) / Community Support Worker", "bhTitle": "Companion", "category": "Healthcare & Human Services", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-10", "exp": "2026-12-10", "desc": "Location: Crown Heights, Brooklyn, NY\nEmployment Type: Part-Time\nSchedule: Monday–Thursday, 9:30 AM–3:00 PM\n\nPosition Overview\n\nA caring and reliable Direct Support Professional (DSP) / Community Support Worker is needed to provide one-on-one assistance to an individual in Crown Heights, Brooklyn.\n\nThe primary focus of this position is to provide day-to-day support, companionship, and encouragement while helping develop greater independence and organizational skills. The ideal candidate is patient, responsible, supportive, and comfortable assisting with practical daily living activities.\n\nKey Responsibilities\n\n\tAssist with daily routines and activities.\n\tProvide support with grocery shopping and meal preparation.\n\tHelp develop and strengthen organizational skills.\n\tEncourage greater independence with everyday responsibilities.\n\tSupport the development of independent living skills.\n\tAssist with basic money-management skills.\n\tHelp create, organize, and follow a personal budget.\n\tProvide companionship, encouragement, and positive reinforcement.\n\tHelp establish and maintain productive daily routines.\n\tEncourage the individual to complete tasks as independently as possible while providing appropriate support.\n\tAssist with community-based activities and errands as needed.\n\tMaintain professional and respectful communication with the individual and support team.\n\nQualifications\n\n\tCaring, patient, responsible, and dependable.\n\tStrong organizational and communication skills.\n\tComfortable providing one-on-one support.\n\tAbility to encourage independence rather than completing every task for the individual.\n\tComfortable assisting with grocery shopping, meal preparation, budgeting, and other everyday activities.\n\tPrevious experience as a DSP, community support worker, companion, mentor, caregiver, or similar role is preferred.\n\tReliable and able to consistently maintain the required sch
