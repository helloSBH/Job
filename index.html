offerings.\n\n\t \tBecome familiar with blankets, loveys, plush soothers, robes, towels, swaddles, bibs, and gift bundles.\n\n\t \tPrepare products and organize merchandise before live shows.\n\n\t \tCollaborate with the team to plan engaging product presentations.\n\n\t \tAssist with organizing featured items, auctions, and promotional bundles.\n\n\t \tMaintain a professional and organized live-streaming environment.\n\n\t \tContribute creative ideas to improve live selling performance.\n\n  Qualifications\n\n\t \tStrong communication and interpersonal skills required.\n\n\t \tMust be confident, energetic, and comfortable appearing on camera.\n\n\t \tPrevious Whatnot, TikTok Live, or other live-selling experience is a strong plus.\n\n\t \tPrevious sales or customer service experience preferred.\n\n\t \tNo prior live-streaming experience required for candidates with strong presentation and sales skills.\n\n\t \tEnthusiastic, outgoing, and engaging personality.\n\n\t \tGenuine interest in baby products, accessories, and gift items.\n\n\t \tAbility to interact naturally with viewers and maintain audience engagement.\n\n\t \tStrong sales instincts and ability to present products persuasively.\n\n\t \tReliable, punctual, and professional.\n\n\t \tComfortable learning new products and online selling platforms.\n\n\t \tAbility to work independently and collaboratively with a team.\n\n\t \tFlexible availability for daytime, evening, and weekend shifts.\n\n\t \tMust be able to work on-site in Ocean Township, NJ."}, {"id": "27058", "title": "Bookkeeper / Account Manager", "bhTitle": "Bookkeeper", "category": "Accounting & Finance", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-11-20", "exp": "2027-02-22", "desc": "Location: Brooklyn, NY\n Employment Type: Part-Time\n\n  Job Description\n\n  An established Brooklyn law firm with affiliated real estate management operations is seeking an experienced, highly organized, and detail-oriented Part-Time Bookkeeper / Account Manager to oversee daily bookkeeping and financial reporting for multiple business entities.\n\n  The ideal candidate has strong QuickBooks and Excel skills, experience managing multiple accounts, and the ability to independently handle financial transactions, reconciliations, and reporting.\n\n  This position requires someone who is accurate, trustworthy, dependable, and comfortable managing bookkeeping responsibilities across both legal and real estate operations.\n\n  Key Responsibilities\n\n  Bookkeeping & Financial Management\n\n\t \tMaintain accurate and organized financial records for the law firm and affiliated real estate entities.\n\n\t \tManage daily bookkeeping activities across multiple business accounts.\n\n\t \tHandle bank deposits, check writing, invoices, and bill payments.\n\n\t \tOversee accounts payable and accounts receivable.\n\n\t \tRecord and categorize financial transactions accurately.\n\n\t \tReconcile bank accounts and credit card statements.\n\n\t \tReview transactions to ensure accuracy and proper allocation among business entities.\n\n\t \tMaintain organized financial documentation and supporting records.\n\n  Financial Reporting & Reconciliation\n\n\t \tPrepare monthly profit-and-loss statements and financial reports.\n\n\t \tMonitor income, expenses, and financial activity across multiple entities.\n\n\t \tReconcile transactions and identify discrepancies.\n\n\t \tMaintain accurate records for multiple bank accounts.\n\n\t \tPrepare financial information and supporting documentation for accountants.\n\n\t \tAssist with maintaining accurate and up-to-date financial reporting.\n\n  Real Estate & Property Management Bookkeeping\n\n\t \tTrack rental income, property expenses, and tenant payments.\n\n\t \tMaintain accurate financial records for real estate management operations.\n\n\t \tMonitor outstanding tenant balances and payment activity.\n\n\t \tRecord property-related expenses and allocate transactions appropriately.\n\n\t \tAssist with financial reporting for affiliated real estate entities.\n\n  Payroll & Administrative Accounting\n\n\t \tCoordinate payroll-related financial information and records.\n\n\t \tOrganize invoices, receipts, statements, and financial documents.\n\n\t \tAssist with financial record preparation for accountants and management.\n\n\t \tMaintain confidentiality of sensitive financial information.\n\n\t \tEnsure bookkeeping responsibilities are completed accurately and on schedule.\n\n  Qualifications\n\n\t \tPrevious bookkeeping experience required.\n\n\t \tProficiency in QuickBooks and Microsoft Excel required.\n\n\t \tExperience managing multiple business entities and bank accounts.\n\n\t \tStrong understanding of accounts payable, accounts receivable, and bank reconciliations.\n\n\t \tExperience preparing profit-and-loss statements and financial reports.\n\n\t \tFamiliarity with payroll coordination and financial recordkeeping.\n\n\t \tLaw firm and/or real estate bookkeeping experience preferred.\n\n\t \tStrong organizational skills and exceptional attention to detail.\n\n\t \tAbility to independently manage daily bookkeeping responsibilities.\n\n\t \tHigh level of accuracy, integrity, and confidentiality.\n\n\t \tStrong time-management and problem-solving abilities.\n\n\t \tDependable, trustworthy, and professional.\n\n\t \tAbility to prioritize responsibilities and meet deadlines.\n\n\t \tComfortable working in a professional legal and real estate business environment."}, {"id": "27057", "title": "Receptionist", "bhTitle": "Receptionist", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-20", "exp": "2027-02-22", "desc": "Location: New York, NY\n Employment Type: Full-Time\n Schedule: Monday–Thursday, 9:15 AM–6:00 PM; Friday, Shorter Hours\n\n  Job Description\n\n  An established office is seeking a friendly, organized, and dependable Receptionist / Secretary to assist with daily administrative tasks and general office operations.\n\n  The ideal candidate is personable, detail-oriented, and comfortable using a computer to complete various responsibilities throughout the day.\n\n  This is a versatile position for someone who enjoys handling different tasks, staying organized, and helping ensure the office runs smoothly.\n\n  Key Responsibilities\n\n\t \tAnswer incoming phone calls and direct inquiries appropriately.\n\n\t \tGreet visitors and provide friendly, professional assistance.\n\n\t \tPerform general receptionist and secretarial duties.\n\n\t \tAssist with data entry, filing, and maintaining organized office records.\n\n\t \tUse computers to complete daily administrative tasks.\n\n\t \tManage emails, correspondence, and basic office communications.\n\n\t \tAssist with scheduling and coordinating appointments as needed.\n\n\t \tOrganize paperwork, documents, and office files.\n\n\t \tProvide administrative support to office staff and management.\n\n\t \tHandle various office responsibilities as assigned.\n\n\t \tHelp maintain an organized and efficient office environment.\n\n  Qualifications\n\n\t \tBasic computer knowledge and proficiency required.\n\n\t \tStrong communication and interpersonal skills.\n\n\t \tFriendly, professional, and approachable personality.\n\n\t \tGood organizational skills and attention to detail.\n\n\t \tAbility to multitask and manage various office responsibilities.\n\n\t \tComfortable answering phones and interacting with visitors.\n\n\t \tReliable, punctual, and dependable.\n\n\t \tWillingness to learn new tasks and office procedures.\n\n\t \tAbility to work independently and as part of a team.\n\n\t \tPositive attitude and strong work ethic."}, {"id": "27056", "title": "Barista / Smoothie Maker", "bhTitle": "Restaurant- Counter/Waiter", "category": "Restaurant & Food Service", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-11-20", "exp": "2027-02-22", "desc": "Location: Brooklyn, NY\n Employment Type: Part-Time / Full-Time Opportunities\n Schedule: Flexible,\n\n  Job Description\n\n  A growing wellness-focused café in Brooklyn, NY, is seeking two friendly, energetic, and customer-oriented Baristas / Smoothie Makers to join its team.\n\n  The café specializes in organic ingredients, nourishing smoothies, freshly prepared coffee, teas, juices, functional beverages, and wellness-inspired drinks.\n\n  The ideal candidates are personable, reliable, and passionate about providing excellent customer service while preparing high-quality beverages.\n\n  This is an excellent opportunity for individuals who enjoy working in a fast-paced café environment, appreciate healthy ingredients, and take pride in creating a welcoming and enjoyable customer experience.\n\n  Key Responsibilities\n\n  Beverage Preparation & Quality\n\n\t \tPrepare coffee, smoothies, fresh juices, teas, and specialty wellness beverages.\n\n\t \tFollow established recipes to ensure consistency in taste, quality, and presentation.\n\n\t \tPrepare beverages using fresh, organic, and high-quality ingredients.\n\n\t \tMaintain proper portioning, preparation techniques, and presentation standards.\n\n\t \tLearn the café's menu, ingredients, and specialty beverage offerings.\n\n\t \tEnsure drinks are prepared accurately and efficiently.\n\n\t \tMaintain high standards of food safety, cleanliness, and hygiene.\n\n  Customer Service\n\n\t \tGreet customers warmly and provide friendly, attentive service.\n\n\t \tAssist customers with menu selections and beverage recommendations.\n\n\t \tExplain ingredients, drink options, and wellness-inspired offerings.\n\n\t \tRespond professionally to customer questions and special requests.\n\n\t \tEnsure orders are prepared accurately and delivered promptly.\n\n\t \tCreate a positive and welcoming café experience.\n\n\t \tBuild friendly relationships with regular customers.\n\n  Café Operations & Team Support\n\n\t \tMaintain clean, organized, and fully stocked workstations.\n\n\t \tAssist with daily café opening and closing responsibilities.\n\n\t \tMonitor ingredient levels and replenish supplies as needed.\n\n\t \tAssist with inventory management, stocking, and product organization.\n\n\t \tKeep beverage preparation areas, equipment, and customer spaces clean.\n\n\t \tFollow café procedures and maintain a safe working environment.\n\n\t \tWork collaboratively with team members to ensure smooth daily operations.\n\n\t \tSupport the team during busy periods and maintain efficient service.\n\n\t \tHelp maintain the café's high standards of quality and presentation.\n\n  Qualifications\n\n\t \tPrevious barista, smoothie preparation, café, or food-service experience preferred.\n\n\t \tStrong customer service and interpersonal skills required.\n\n\t \tFriendly, outgoing, and personable personality.\n\n\t \tAbility to work efficiently in a fast-paced environment.\n\n\t \tInterest in healthy food, nutrition, organic ingredients, and wellness.\n\n\t \tStrong attention to detail and beverage presentation.\n\n\t \tAbility to follow recipes and maintain consistent quality.\n\n\t \tReliable, punctual, and dependable.\n\n\t \tStrong organizational and multitasking skills.\n\n\t \tComfortable working independently and as part of a team.\n\n\t \tWillingness to learn new recipes, ingredients, and preparation techniques.\n\n\t \tPositive attitude and strong work ethic.\n\n\t \tAvailability to work early morning and/or evening shifts required."}, {"id": "27055", "title": "Studio Instructors", "bhTitle": "Other", "category": "Other", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-11-20", "exp": "2027-02-22", "desc": "Location: Brooklyn, NY\n Employment Type: Part-Time\n Schedule: Based on Class Availability\n\n  Job Description\n\n  A growing movement and wellness studio in Brooklyn, NY, is seeking passionate, experienced, and certified Studio Instructors specializing in Pilates, Yoga, Barre, Breathwork, and Sound Bath.\n\n  The studio is looking to build a talented team of instructors who can bring their individual expertise, creativity, and teaching styles to a welcoming, community-focused wellness environment.\n\n  The ideal candidates are enthusiastic about movement, holistic wellness, and helping others improve their physical and mental well-being through engaging and thoughtfully designed classes.\n\n  This is an excellent opportunity for instructors who enjoy teaching, building meaningful relationships with participants, and contributing to a growing wellness studio.\n\n  Areas of Instruction\n\n  The studio is seeking instructors specializing in one or more of the following:\n\n\t \tPilates\n\n\t \tYoga\n\n\t \tBarre\n\n\t \tBreathwork\n\n\t \tSound Bath\n\n  Instructors with experience in multiple disciplines are encouraged to apply.\n\n  Key Responsibilities\n\n\t \tLead engaging, professional, and thoughtfully structured wellness classes.\n\n\t \tDevelop and deliver classes appropriate for participants with varying experience levels.\n\n\t \tCreate a welcoming, supportive, and inclusive environment for all participants.\n\n\t \tMaintain high standards of instruction, safety, and professionalism.\n\n\t \tProvide clear guidance and instruction throughout each class.\n\n\t \tBuild meaningful relationships with studio members and encourage community engagement.\n\n\t \tCollaborate with studio management on special events, workshops, and wellness programs.\n\n\t \tDevelop creative class concepts and contribute new ideas to studio offerings.\n\n\t \tMaintain a positive and professional atmosphere during classes.\n\n\t \tEnsure classes are organized, engaging, and conducted according to studio standards.\n\n\t \tWork collaboratively with other instructors to create a cohesive wellness experience.\n\n\t \tContribute to the development and growth of the studio's wellness community.\n\n  Qualifications\n\n\t \tRelevant certifications in Pilates, Yoga, Barre, Breathwork, Sound Bath, or a related discipline required.\n\n\t \tPrevious professional teaching or instructional experience required.\n\n\t \tStrong knowledge and understanding of the applicable wellness discipline.\n\n\t \tPassion for movement, mindfulness, holistic wellness, and community building.\n\n\t \tExcellent communication and interpersonal skills.\n\n\t \tAbility to confidently lead and engage groups of participants.\n\n\t \tFriendly, approachable, and encouraging personality.\n\n\t \tStrong organizational and time-management skills.\n\n\t \tReliable, punctual, and professional.\n\n\t \tAbility to adapt instruction to different experience levels.\n\n\t \tCreative approach to class planning and wellness programming.\n\n\t \tComfortable working independently and collaborating with a team.\n\n\t \tStrong commitment to participant safety and overall class experience.\n\n\t \tInterest in growing alongside a new wellness studio."}, {"id": "27054", "title": "Furniture Showroom Manager", "bhTitle": "Manager", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-20", "exp": "2027-02-22", "desc": "Location: Brooklyn, NY\n Employment Type: Full-Time, On-Site\n\n  Job Description\n\n  An established interior design business in Brooklyn, NY, is seeking a personable, creative, and motivated Furniture Showroom Manager to oversee its high-end furniture and home décor showroom.\n\n  The showroom features a carefully curated collection of vintage furniture, unique artwork, decorative accessories, and contemporary furniture pieces.\n\n  The ideal candidate has a strong appreciation for furniture and interior design, excellent customer service and communication skills, and experience with social media marketing.\n\n  This is a hands-on, customer-facing management position that combines showroom operations, furniture sales, merchandising, and digital marketing.\n\n  The company is seeking someone who is organized, creative, self-motivated, and passionate about helping customers discover unique furniture and home décor pieces.\n\n  Key Responsibilities\n\n  Showroom Management & Operations\n\n\t \tOversee daily showroom operations and ensure a professional, welcoming environment.\n\n\t \tMaintain an organized, attractive, and visually appealing showroom.\n\n\t \tArrange furniture, artwork, and decorative accessories to create engaging displays.\n\n\t \tCoordinate inventory organization, product placement, and showroom presentation.\n\n\t \tMonitor available inventory and maintain accurate product information.\n\n\t \tCoordinate customer orders, deliveries, and related logistics.\n\n\t \tCommunicate with vendors, delivery providers, and customers as needed.\n\n\t \tWork directly with ownership to support daily operations and business growth.\n\n  Furniture Sales & Customer Relations\n\n\t \tWelcome customers and provide personalized assistance with furniture and décor selections.\n\n\t \tUnderstand customer preferences, design needs, and style requirements.\n\n\t \tPresent furniture collections, vintage pieces, artwork, and decorative accessories.\n\n\t \tBuild and maintain relationships with customers, interior designers, and industry professionals.\n\n\t \tRespond to customer inquiries regarding products, availability, pricing, and orders.\n\n\t \tManage sales transactions and coordinate customer follow-ups.\n\n\t \tProvide excellent customer service throughout the purchasing process.\n\n\t \tIdentify opportunities to increase showroom sales and develop repeat business.\n\n  Social Media & Digital Marketing\n\n\t \tManage and maintain the showroom's social media presence, particularly Instagram.\n\n\t \tCreate engaging content highlighting furniture collections, artwork, and new arrivals.\n\n\t \tPhotograph furniture and decorative accessories for online promotion.\n\n\t \tDevelop creative posts, stories, and other social media content.\n\n\t \tRespond to online inquiries and engage with prospective customers.\n\n\t \tPromote new inventory, showroom displays, and featured products.\n\n\t \tAssist with marketing initiatives designed to increase showroom visibility.\n\n\t \tGenerate customer interest and potential sales leads through social media.\n\n  Merchandising & Business Development\n\n\t \tMaintain attractive furniture displays that reflect the showroom's design aesthetic.\n\n\t \tAssist with introducing new inventory and updating showroom arrangements.\n\n\t \tIdentify customer preferences and emerging interior design trends.\n\n\t \tCollaborate with ownership on creative merchandising and marketing ideas.\n\n\t \tDevelop relationships with interior designers and other industry professionals.\n\n\t \tSupport initiatives to attract new customers and expand the showroom's presence.\n\n  Qualifications\n\n\t \tStrong communication, interpersonal, and customer service skills required.\n\n\t \tExperience with social media marketing, particularly Instagram, required.\n\n\t \tComfortable creating content and photographing products for social media.\n\n\t \tPrevious experience in furniture sales, retail management, showroom management, or interior design preferred.\n\n\t \tStrong appreciation for high-end vintage furniture, artwork, and contemporary design.\n\n\t \tExcellent organizational and time-management skills.\n\n\t \tCreative mindset and strong visual presentation skills.\n\n\t \tAbility to build relationships with customers and industry professionals.\n\n\t \tComfortable handling sales transactions and customer inquiries.\n\n\t \tStrong attention to detail and problem-solving abilities.\n\n\t \tAbility to manage multiple responsibilities independently.\n\n\t \tSelf-motivated, dependable, and proactive.\n\n\t \tComfortable working directly with business ownership.\n\n\t \tMust be available to work full-time, on-site in Brooklyn, NY."}, {"id": "27052", "title": "Import Coordinator / Accounts Payable", "bhTitle": "Import Manager", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-11-19", "exp": "2027-02-18", "desc": "Home decor and lighting company in Woodbridge, NJ, is hiring an Import Coordinator / Accounts Payable specialist. The role manages imported merchandise from purchase order to warehouse receipt and processes vendor payments accurately and on time, connecting purchasing, logistics and finance.\n\n\tTrack purchase orders and shipments from overseas and domestic suppliers through warehouse delivery.\n\tCoordinate with suppliers, freight forwarders, customs brokers and carriers on production, shipping and arrival dates.\n\tCollect and file import documents (commercial invoices, packing lists, bills of lading, certificates of origin) and support customs clearance.\n\tMonitor container arrivals, schedule warehouse deliveries and keep purchasing, sales and warehouse teams informed of status and delays.\n\tMaintain the import log and review freight, duty and customs charges before payment.\n\tProcess supplier, freight, duty and service invoices using three-way matching, and resolve discrepancies.\n\tCode invoices to the general ledger and obtain required approvals.\n\tProcess payments by check, ACH and international wire on schedule.\n\tMaintain vendor files (W-9s, banking details, payment terms) and reconcile vendor statements.\n\tPrepare AP aging reports to support cash flow planning.\n\n Qualifications\n\tExperience in bookkeeping or import/logistics coordination.\n\tWorking knowledge of AP processes and import documents such as commercial invoices, packing lists and bills of lading.\n\tProficiency in Microsoft Excel (VLOOKUP, pivot tables) and Outlook.\n\tKnowledge of customs procedures, HTS codes, duties and Incoterms.\n\tExperience with international wire payments, foreign-currency invoices and ERP or inventory management systems.\n\tExperience in home decor, furniture, consumer goods or another import-driven business a plus."}, {"id": "27051", "title": "Event Coordinator", "bhTitle": "Event Coordinator", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-19", "exp": "2027-02-18", "desc": "Position Summary: The Event Coordinator/Administrative Assistant at a synagogue will plan, manage, and execute engaging community events and programs. This is a fast-paced role that demands exceptional organizational skills and the ability to coordinate many different functions throughout the week, from events and holiday seating to communications and administrative support. The ideal candidate is highly proficient with multiple computer programs and platforms.\n Core Responsibilities:\n Event Planning:\n\tPlan, organize, budget, and manage various synagogue events such as lectures, youth activities, Shabbat meals, singles gatherings, holiday seating and holiday celebrations.\n\tOversee and arrange weekly Kiddush and special holiday meals (e.g., Sukkot, Pesach, Purim). Order food and supplies for kitchen and maintenance staff.\n\tCoordinate milestone lifecycle events (Brit Milah, Bar/Bat Mitzvah, Weddings) with families and organizations.\n\tCoordinate logistics for synagogue events in collaboration with outside organizations. File for street permits.\n\n Public Relations and Communications:\n\tServe as a welcoming and personable representative at synagogue events and activities.\n\tEngage with congregants proactively, addressing suggestions and concerns with attentiveness and care.\n\tRecruit and coordinate volunteers to support event execution and promotion.\n\tUtilize social media (Instagram, Facebook, WhatsApp), Constant Contact, and Canva for promoting synagogue programs and maintaining community engagement.\n\tPrepare and distribute synagogue bulletins and announcements.\n\n Administrative Support:\n\tAssist with administrative tasks, managing correspondence, and maintaining organized records and files.\n\tManage the synagogue calendar, including scheduling and holiday seating arrangements.\n\tJuggle and coordinate multiple events, deadlines, and departments simultaneously throughout the week, prioritizing effectively and following through on every detail.\n\tEnsure smooth operational support for synagogue leadership and staff.\n\n Qualifications:\n\tExceptionally high level of organization and attention to detail, with a proven ability to coordinate many functions and competing priorities throughout the week.\n\tExperience in event coordination, community engagement, or similar administrative roles, preferably within a Jewish community or synagogue.\n\tStrong communication skills, both written and verbal.\n\tWell versed in multiple computer programs: proficient in Microsoft Outlook, Word, Excel, and PowerPoint; social media platforms (Instagram, Facebook, WhatsApp); Constant Contact; and Canva. Able to quickly learn ShulCloud for reports and account information.\n\tHighly organized, detail-oriented, and personable, with a strong ability to manage multiple tasks and functions at once and meet deadlines in a busy, ever-changing schedule.\n\tKnowledge of Jewish traditions and customs preferred. Able to attend the synagogue on Shabbat and holidays without breaking Shabbat.\n\n The ideal candidate is friendly, approachable, and highly organized, thrives on coordinating many moving parts each week, is comfortable working across multiple software programs, and is committed to fostering a welcoming and vibrant synagogue environment through engaging events and strong administrative support."}, {"id": "27050", "title": "Office & Administrative Assistant (Part-Time to Full-Time)", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Full or Part Time", "typeNote": "", "state": "NJ", "added": "2026-11-19", "exp": "2027-02-19", "desc": "Location: Eatontown, NJ (In-Office)\n Job Type: Part-Time with short term potential to transition to Full-Time\n Schedule: To be determined / Standard business hours\n\n Our busy Eatontown law firm is seeking a reliable, highly organized all-around assistant to support daily office operations. This position starts on a part-time basis with strong potential to transition into a full-time role in the short term. Key Responsibilities:\n\n\tProcess, sort, and distribute a high volume of weekly incoming and outgoing mail.\n\tOrganize and file client records and legal documents in physical filing cabinets.\n\tHandle daily scanning, printing, and mailing operations.\n\tAssist with general office organization and pitch in wherever needed to support the firm.\n\n  Qualifications:\n\n\tStrong organizational skills and exceptional attention to detail.\n\tDependable and adaptable with a strong, hands-on, willing-to-help attitude.\n\tProven ability to handle confidential legal documents with high professionalism.\n\tComfortable operating basic office equipment (printers, scanners) and general computer systems.\n\n  What We Offer:\n\n\tOpportunity for rapid growth from a part-time to a full-time role.\n\tCollaborative and supportive professional law firm environment.\n\tStable work location with consistent daily office operations."}, {"id": "27049", "title": "Retail Leasing and Advisory Agent", "bhTitle": "Real Estate Analyst", "category": "Real Estate & Property", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-19", "exp": "2027-02-08", "desc": "Real Estate Investment Services company is looking to expand its Retail Leasing and Advisory Division at its Manhattan office and is seeking highly motivated individuals who are eager to learn and build a career in commercial real estate. The division is led by an experienced professional with extensive experience in both landlord and tenant representation throughout Manhattan, Brooklyn, the Bronx, and Queens.\n The team works with a diverse range of clients, from publicly traded REITs and private family offices to national credit tenants and independent small businesses.\n\n This is an excellent opportunity for someone who is driven, personable, and interested in learning the commercial real estate business. Training, hands-on field experience, and direct personal mentorship will be provided. A strong work ethic, motivation, and willingness to learn are the most important qualifications.\n\n Key Responsibilities\n\tAssist with retail leasing and commercial real estate advisory activities.\n\tSupport landlord and tenant representation assignments.\n\tHelp identify and develop relationships with property owners, landlords, tenants, and prospective clients.\n\tResearch retail properties, available spaces, and market opportunities.\n\tAssist with property tours, client meetings, and negotiations.\n\tBuild and maintain professional relationships with clients and industry contacts.\n\tLearn the fundamentals of retail leasing, deal-making, and commercial real estate through hands-on training and mentorship.\n\n Qualifications\n\tHighly motivated, ambitious, and eager to learn.\n\tStrong communication and interpersonal skills.\n\tProfessional, personable, and comfortable interacting with clients.\n\tSelf-starter with a strong work ethic and willingness to take initiative.\n\tOrganized, reliable, and able to manage multiple responsibilities.\n\tInterest in commercial real estate and retail leasing.\n\tPrevious real estate experience is helpful but not required.\n\tReal estate license big plus but not required but candidate will need to obtain one after starting\n\n Training and personal mentorship will be provided."}, {"id": "27048", "title": "Summer 2027 Finance Internship", "bhTitle": "Intern", "category": "Accounting & Finance", "type": "Internship", "typeNote": "", "state": "NY", "added": "2026-11-19", "exp": "2027-03-05", "desc": "Infrastructure Investment & Finance\n\n  An exciting opportunity for a motivated undergraduate student to gain hands-on experience in the world of infrastructure investing and finance.\n\n  We are seeking bright, analytical and detail-oriented students currently completing their sophomore or junior year of college who are interested in finance, investment management and the infrastructure sector.\n\n  Responsibilities may include:\n\n\t \tAssisting with financial analysis, modeling and investment research.\n\n\t \tReviewing financial statements and evaluating investment opportunities.\n\n\t \tSupporting due diligence on infrastructure projects and potential investments.\n\n\t \tConducting industry, market and company research.\n\n\t \tPreparing financial presentations, reports and investment materials.\n\n\t \tWorking with team members on ongoing investment projects.\n\n  Qualifications:\n\n\t \tCurrently pursuing a bachelor's degree in Finance, Economics, Accounting, Business or a related field.\n\n\t \tStrong analytical, quantitative and problem-solving skills.\n\n\t \tProficiency in Excel and PowerPoint.\n\n\t \tExcellent written and verbal communication skills.\n\n\t \tStrong attention to detail and organizational skills.\n\n\t \tGenuine interest in investments, financial markets and infrastructure.\n\n  Internship Details:\n\n\t \tSummer 2027\n\n\t \tFull-time summer internship\n\n\t \tIdeal for students between their sophomore and junior years or junior and senior years.\n\n  This is an excellent opportunity to gain exposure to institutional investing, work alongside experienced investment professionals and develop valuable skills in a sophisticated financial environment"}, {"id": "27047", "title": "Social Worker (MSW/LMSW/SW student)", "bhTitle": "Social Worker", "category": "Healthcare & Human Services", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-11-19", "exp": "2027-01-25", "desc": "Location: Crown Heights, Brooklyn, NY\n Employment Type: Part-Time\n Schedule: During school hours and/or after school\n\n SEE NOTES\n\n  An organization is seeking a compassionate, patient, and dedicated provider to work with children experiencing mental health challenges in the Crown Heights community.\n\n  The role involves providing mentorship, guidance, and counseling support to children during school hours and/or after school. The ideal candidate will have a background in social work, counseling, psychology, or a related field and be comfortable working with children who need additional emotional and behavioral support.\n\n  Responsibilities\n\n\t \tProvide one-on-one mentoring and counseling support to children with mental health challenges.\n\n\t \tOffer guidance, encouragement, and emotional support in a safe and supportive environment.\n\n\t \tHelp children develop positive coping skills and build confidence.\n\n\t \tSupport children's social, emotional, and behavioral development.\n\n\t \tBuild trusting relationships with children and communicate appropriately with families and relevant professionals.\n\n\t \tMaintain professionalism, patience, and confidentiality.\n\n  Qualifications\n\n\t \tSocial Work student, MSW, LMSW, or a related educational background.\n\n\t \tExperience working with children, particularly those facing mental health or emotional challenges, is preferred.\n\n\t \tCompassionate, patient, and strong communication skills.\n\n\t \tAbility to build positive relationships and provide individualized support.\n\n\t \tMust be able to work in the Crown Heights area."}, {"id": "27046", "title": "Office Manager – HR, Bookkeeping & Logistics", "bhTitle": "Office Manager", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-11-19", "exp": "2027-02-22", "desc": "Location: NJ\n Employment Type: Full-Time\n Work Arrangement: On-Site\n\n  Job Description\n\n  A growing wholesale company in Moonachie, NJ, is seeking a highly organized, detail-oriented, and dependable Office Manager to oversee daily office operations while assisting with human resources, bookkeeping, and logistics coordination.\n\n  The ideal candidate is a proactive, resourceful, and hands-on professional who can manage multiple responsibilities, maintain organized business operations, and support management across various departments.\n\n  This position is ideal for someone who enjoys taking ownership of administrative responsibilities and thrives in a fast-paced, growing business environment.\n\n  Key Responsibilities\n\n  Office Management & Administration\n\n\t \tOversee daily office operations and administrative activities.\n\n\t \tMaintain organized office records, files, and procedures.\n\n\t \tCoordinate communication between management, employees, customers, and vendors.\n\n\t \tManage office supplies and general administrative needs.\n\n\t \tEnsure office operations run smoothly and efficiently.\n\n\t \tAssist management with special projects and operational responsibilities.\n\n\t \tIdentify opportunities to improve office organization and workflows.\n\n  Human Resources & Employee Coordination\n\n\t \tAssist with employee onboarding and maintaining personnel records.\n\n\t \tTrack employee attendance, time off, and related documentation.\n\n\t \tCoordinate payroll information with management or payroll providers.\n\n\t \tAssist with recruiting, scheduling interviews, and hiring-related administrative tasks.\n\n\t \tMaintain accurate and confidential employee information.\n\n\t \tSupport general human resources responsibilities as needed.\n\n  Bookkeeping & Financial Administration\n\n\t \tAssist with accounts payable and accounts receivable.\n\n\t \tProcess invoices, payments, and expense records.\n\n\t \tMaintain accurate and organized financial documentation.\n\n\t \tAssist with bank reconciliations and general bookkeeping tasks.\n\n\t \tSupport bookkeeping activities using QuickBooks or similar accounting software.\n\n\t \tPrepare basic financial reports and assist with financial recordkeeping.\n\n\t \tCommunicate with management regarding accounting discrepancies or outstanding payments.\n\n  Logistics & Shipping Coordination\n\n\t \tCoordinate incoming and outgoing shipments.\n\n\t \tCommunicate with freight carriers, suppliers, and customers.\n\n\t \tTrack shipments and follow up on deliveries.\n\n\t \tMaintain accurate shipping documentation and inventory-related records.\n\n\t \tAssist with coordinating transportation and delivery schedules.\n\n\t \tHelp resolve shipping delays, discrepancies, and logistical issues.\n\n\t \tCollaborate with warehouse and operations teams to ensure efficient order fulfillment.\n\n  Qualifications\n\n\t \tPrevious experience in office administration, office management, or a related position preferred.\n\n\t \tStrong organizational and multitasking skills required.\n\n\t \tBasic bookkeeping knowledge and familiarity with QuickBooks preferred.\n\n\t \tProficiency in Microsoft Excel and general office software.\n\n\t \tExcellent written and verbal communication skills.\n\n\t \tStrong attention to detail and accuracy.\n\n\t \tAbility to manage multiple responsibilities and prioritize tasks effectively.\n\n\t \tComfortable working independently and taking initiative.\n\n\t \tStrong problem-solving and time-management skills.\n\n\t \tExperience with employee administration, payroll coordination, or HR support is a plus.\n\n\t \tExperience with shipping, logistics, or wholesale operations is a plus.\n\n\t \tReliable, professional, and dependable.\n\n\t \tAbility to maintain confidentiality when handling financial and employee information.\n\n\t \tMust be available to work full-time, on-site in Moonachie, NJ."}, {"id": "27045", "title": "Wholesale Sales Representative", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-11-19", "exp": "2027-02-22", "desc": "Location: NJ\n Employment Type: Full-Time, On-Site\n Schedule: Monday–Friday\n\n  Job Description\n\n  A growing wholesale company specializing in refurbished cell phones and mobile devices is seeking a highly motivated, energetic, and ambitious Wholesale Sales Representative to join its team.\n\n  No previous sales experience is required! The company is looking for someone who is hungry to succeed, eager to learn, and willing to put in the effort to develop a successful sales career.\n\n  The ideal candidate is outgoing, confident, persistent, and results-driven, with excellent communication skills and the ability to build strong relationships with wholesale customers.\n\n  This is an excellent opportunity for an entry-level candidate interested in developing sales skills, gaining experience in the wholesale electronics industry, and building a long-term career in sales.\n\n  Key Responsibilities\n\n  Sales & Business Development\n\n\t \tIdentify and contact potential wholesale customers and business accounts.\n\n\t \tConduct outbound sales calls to introduce products and generate new business.\n\n\t \tResearch and identify prospective buyers in the refurbished cell phone market.\n\n\t \tFollow up consistently with leads and prospective customers.\n\n\t \tPresent available inventory, product specifications, and pricing.\n\n\t \tNegotiate pricing and close wholesale sales transactions.\n\n\t \tDevelop new business opportunities and expand the customer base.\n\n\t \tWork toward achieving individual and company sales goals.\n\n  Customer Relationship Management\n\n\t \tBuild and maintain strong relationships with new and existing wholesale customers.\n\n\t \tCommunicate professionally with buyers regarding product availability and pricing.\n\n\t \tRespond to customer inquiries promptly and efficiently.\n\n\t \tFollow up with customers to encourage repeat business.\n\n\t \tUnderstand customer needs and recommend appropriate products.\n\n\t \tMaintain organized records of customer communications and sales activity.\n\n  Product Knowledge & Sales Coordination\n\n\t \tLearn about refurbished cell phones, product conditions, pricing, and inventory.\n\n\t \tStay informed about available inventory and current market trends.\n\n\t \tCoordinate with management regarding pricing and sales opportunities.\n\n\t \tMaintain accurate records of leads, customer interactions, and sales transactions.\n\n\t \tAssist with general sales-related responsibilities as needed.\n\n  Qualifications\n\n\t \tNo prior sales experience required.\n\n\t \tNo previous cell phone or electronics industry experience required.\n\n\t \tStrong motivation to succeed and build a career in sales.\n\n\t \tEnergetic, ambitious, and self-motivated personality.\n\n\t \tExcellent verbal communication and interpersonal skills.\n\n\t \tConfident making outbound calls and speaking with prospective customers.\n\n\t \tPersistent and comfortable handling rejection.\n\n\t \tStrong negotiation and relationship-building abilities.\n\n\t \tWillingness to learn new products, sales techniques, and industry knowledge.\n\n\t \tBasic computer and organizational skills.\n\n\t \tAbility to follow up consistently and manage multiple sales opportunities.\n\n\t \tResults-driven attitude and strong work ethic.\n\n\t \tAbility to work independently and collaboratively.\n\n\t \tMust be available to work full-time, on-site in Moonachie, NJ."}, {"id": "27044", "title": "PRODUCTION", "bhTitle": "Production Coordinator", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-19", "exp": "2027-02-12", "desc": "DISNEY PRODUCTS AND ACCESSORIES\n\n Overview\n Our company is a NYC based industry leader in the design, import, and distribution of apparel and accessories for infants, children and pets.  We are seeking a dynamic, organized and talented Production Manager to join our team.  The successful candidate will be responsible for coordinating and managing product needs between sales, design, overseas factories and customers.\n\n Responsibilities\n •    Negotiate FOB prices with suppliers and comply with MOQ's and lead times.  Place production orders and follow up on timely delivery status.\n •    Create, manage, and assume ownership of time and action calendars for each order and style.  Assure timely delivery and approval of product, label and packaging samples.  Communicate timeline changes to management, sales, replenishment and design teams.\n •    Understand, coordinate and approve government, licensor, product and customer requirements, including labels, tickets, packaging, certifications, testing and quality control.\n •    Supervise overseas production team in the entry of item and order information into our ERP system (Envision.)\n •    Track and coordinate samples and testing with factories and design teams, maintaining production schedule to assure on-time deliveries.  Elevate risks and collaborate on solutions.\n •    Calculate pricing needed to attain desired profit margins.  Track import cost variances.\n •    Manage Disney's Facility and Merchandise Authorization (FAMA) and Online Product Approval (OPA) systems to ascertain that Disney products are approved.  Update design and production teams on status.\n •    Manage product image library.\n\n Qualifications\n •    Bachelor's degree preferred.\n •    3 to 5 years of experience in similar position and industry.\n •    Strong Microsoft Office suite computer knowledge.\n •    Excellent organization and communication skills.\n •    Knowledge of retail math.\n •    Envision ERP experience a plus.\n\n Other\n •    One day of remote work per week.\n •    No travel anticipated."}, {"id": "27042", "title": "2 Levels of Designer Opportunities", "bhTitle": "Designer", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-19", "exp": "2027-01-23", "desc": "Assistant / Junior Footwear Designer\n\n  Seeking a creative and detail-oriented Assistant or Junior Footwear Designer to join a growing design team.\n\n  This is an opportunity for someone with a background in footwear design who is interested in developing commercially successful footwear collections and working closely with an experienced team.\n\n  Responsibilities:\n\n\t \tAssist with designing and developing seasonal footwear collections.\n\n\t \tResearch fashion trends, colors, materials and silhouettes.\n\n\t \tCreate design concepts, sketches and technical specifications.\n\n\t \tAssist with preparing presentations and product boards.\n\n\t \tCommunicate with factories and vendors regarding samples and product development.\n\n\t \tReview samples and provide feedback on design, materials and construction.\n\n\t \tHelp ensure products meet design, quality and cost requirements.\n\n  Qualifications:\n\n\t \tPrevious footwear design experience is required.\n\n\t \tKnowledge of shoe construction, materials and manufacturing processes.\n\n\t \tProficiency in Adobe Illustrator and Photoshop.\n\n\t \tStrong creative eye and understanding of commercial footwear trends.\n\n\t \tExcellent organizational and communication skills.\n\n\t \tAbility to manage multiple projects and deadlines.\n\n  5. Experienced Footwear Designer\n\n  Seeking an accomplished Footwear Designer with strong industry experience and a proven ability to develop compelling, commercially successful shoe collections.\n\n  The ideal candidate combines creativity with a strong understanding of the footwear business, from trend research and concept development to product execution and manufacturing.\n\n  Responsibilities:\n\n\t \tLead the creative development of seasonal footwear collections.\n\n\t \tIdentify emerging trends, consumer preferences, colors and materials.\n\n\t \tDevelop original footwear concepts, sketches and technical designs.\n\n\t \tOversee product development from concept through final sample approval.\n\n\t \tWork directly with factories and vendors on materials, construction and specifications.\n\n\t \tCollaborate with sales and merchandising teams to develop products that meet market demand.\n\n\t \tEvaluate samples for quality, fit, construction and overall design.\n\n\t \tHelp establish and maintain a cohesive brand identity across collections.\n\n  Qualifications:\n\n\t \tSignificant professional footwear design experience required.\n\n\t \tStrong portfolio demonstrating successful footwear collections.\n\n\t \tExtensive knowledge of shoe construction, materials and manufacturing.\n\n\t \tProficiency in Adobe Illustrator and relevant design software.\n\n\t \tUnderstanding of retail trends, pricing and commercial product development.\n\n\t \tStrong communication, leadership and organizational skills.\n\n\t \tAbility to work independently and lead projects from concept to completion."}, {"id": "27041", "title": "Order Processing & Routing Administrator", "bhTitle": "Order Expeditor", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-19", "exp": "2027-01-15", "desc": "Seeking an experienced and highly organized Order Processing & Routing Administrator to oversee the accurate processing and coordination of wholesale orders.\n\n  The ideal candidate understands retail routing requirements, shipping procedures and the importance of keeping orders moving efficiently from placement through delivery.\n\n  Responsibilities:\n\n\t \tProcess wholesale customer orders accurately and efficiently.\n\n\t \tManage retail routing requirements and ensure compliance with customer-specific guidelines.\n\n\t \tCoordinate shipping schedules, deliveries and distribution requirements.\n\n\t \tCommunicate with warehouses, freight carriers, vendors and retail customers.\n\n\t \tMonitor order status and proactively address delays or discrepancies.\n\n\t \tPrepare shipping documents, labels, routing instructions and related paperwork.\n\n\t \tMaintain accurate order records and update internal systems.\n\n\t \tWork closely with sales, purchasing and warehouse teams to ensure smooth operations.\n\n  Qualifications:\n\n\t \tPrevious experience in order processing, wholesale operations or retail routing.\n\n\t \tUnderstanding of major retailers' routing and shipping requirements.\n\n\t \tStrong knowledge of order management systems and Microsoft Excel.\n\n\t \tExcellent attention to detail and follow-through.\n\n\t \tStrong organizational and problem-solving skills.\n\n\t \tAbility to work in a fast-paced wholesale environment."}, {"id": "27040", "title": "Sales Assistant", "bhTitle": "Sales Assistant", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-19", "exp": "2027-02-04", "desc": "Seeking an organized, energetic and detail-oriented Sales Assistant to support a busy wholesale sales team. This is an excellent opportunity for someone who enjoys working in a fast-paced environment and wants to grow within the footwear and fashion industry.\n\n  Responsibilities:\n\n\t \tProvide administrative and day-to-day support to the sales team.\n\n\t \tAssist with customer inquiries, order follow-up and account maintenance.\n\n\t \tPrepare sales materials, presentations and product information.\n\n\t \tCommunicate with customers regarding product availability, pricing and delivery.\n\n\t \tTrack orders and follow up with internal departments to ensure timely processing.\n\n\t \tMaintain accurate customer records and sales reports.\n\n\t \tAssist with samples, showroom preparation and seasonal sales presentations.\n\n  Qualifications:\n\n\t \tPrevious sales support or administrative experience preferred.\n\n\t \tFootwear, fashion or wholesale industry experience is a plus.\n\n\t \tExcellent communication and organizational skills.\n\n\t \tStrong computer skills, including Microsoft Excel.\n\n\t \tAbility to multitask and manage competing priorities.\n\n\t \tProfessional, personable and customer-service oriented."}, {"id": "27039", "title": "Wholesale Footwear Salesperson", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-19", "exp": "2027-02-05", "desc": "This is an excellent opportunity for a proven sales professional who understands the footwear industry, has strong retailer relationships, and knows how to develop and grow business.\n\n  Responsibilities:\n\n\t \tDevelop and maintain relationships with existing and prospective retail accounts.\n\n\t \tLeverage established industry connections to generate new business.\n\n\t \tPresent footwear collections and negotiate wholesale orders.\n\n\t \tIdentify new sales opportunities and expand the company's customer base.\n\n\t \tManage accounts from initial presentation through order placement and follow-up.\n\n\t \tMonitor market trends, customer needs and competitive activity.\n\n\t \tWork closely with merchandising, design and operations teams to maximize sales.\n\n  Qualifications:\n\n\t \tProven wholesale footwear sales experience.\n\n\t \tEstablished relationships and connections within the OPP shoe market.\n\n\t \tStrong understanding of footwear retailers, buying cycles and wholesale distribution.\n\n\t \tExcellent presentation, negotiation and relationship-building skills.\n\n\t \tEntrepreneurial, driven and results-oriented."}, {"id": "27038", "title": "Seeking a bright, motivated and ambitious intern to join its team!", "bhTitle": "Intern", "category": "Accounting & Finance", "type": "Internship", "typeNote": "", "state": "NY", "added": "2026-11-19", "exp": "", "desc": "This is an excellent opportunity for a college student or recent graduate interested in finance, investments and wealth management to gain hands-on experience in a professional financial services environment.\n\n  The intern will work alongside experienced professionals, gain exposure to the wealth management industry, and participate in meaningful projects that provide valuable insight into the business.\n\n  Responsibilities\n\n\t \tAssist with research and gathering financial and market information.\n\n\t \tSupport the team with client-related projects and administrative tasks.\n\n\t \tHelp prepare presentations, reports and financial materials.\n\n\t \tAssist with organizing client information and maintaining accurate records.\n\n\t \tConduct research on investment trends and financial markets.\n\n\t \tSupport business development and special projects as needed.\n\n  Qualifications\n\n\t \tCurrently pursuing a college degree or a recent graduate.\n\n\t \tInterest in finance, investments, economics or wealth management."}, {"id": "27037", "title": "Security Guard", "bhTitle": "Security Guard", "category": "Other", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-11-19", "exp": "2027-02-18", "desc": "Senior Housing Building seeking 2 security guards (one person per shift).\n\n Monitor cameras.\n Open and close doors at scheduled times.\n Greet Visitors\n Respond to emergency situations.\n 8am-4pm\n 4pm-12am\n 12am-8am"}, {"id": "27036", "title": "Sales - LiveSelling", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-11-19", "exp": "2027-02-19", "desc": "Location: Kenilworth, NJ\n Job Type: Full-Time / Part-Time\n Schedule: 3 to 5 hours per streaming shift\n\n We are looking for a fun, energetic, and outgoing personality to host live shopping streams on TikTok and other live-commerce platforms. No influencer experience is required; we are looking for someone comfortable on camera who enjoys talking with people and keeping broadcasts entertaining and engaging. Key Responsibilities:\n\n\tHost live shopping streams for 3 to 5 hours per day, engaging viewers, demonstrating products, and driving sales during live broadcasts.\n\tInteract with viewers, answer real-time questions, and communicate key product selling points with high energy and enthusiasm.\n\tMaintain a fun, welcoming live stream environment and learn product details thoroughly.\n\tCollaborate with the team to analyze and improve stream performance and sales conversion.\n\n  Qualifications:\n\n\tOutgoing, confident, and energetic personality with the ability to think quickly and engage a live audience.\n\tComfortable speaking on camera for extended periods with strong communication and interpersonal skills.\n\tPrior experience in sales, retail, customer service, acting, hosting, or public speaking is a plus.\n\tFamiliarity with TikTok, Instagram, Whatnot, or other livestream platforms is a bonus but not required.\n\n  What We Offer:\n\n\tEmployee discount and flexible schedule."}, {"id": "27035", "title": "Event Coordinator Full-Time or Hired By The Project", "bhTitle": "Event Coordinator", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-19", "exp": "2027-02-18", "desc": "Join a wonderful team and become part of an organization that is truly making a difference in the community!  Brooklyn, NY (Winter) | Deal, NJ (Summer)\n\n  A well-established, warm, and welcoming nonprofit community organization is seeking a professional, personable, and highly organized Development Assistant to join its team.\n\n  This is a wonderful opportunity for someone who enjoys working with people, is comfortable interacting with high-net-worth donors and community leaders, and takes pride in providing excellent support. The ideal candidate is polished, discreet, detail-oriented, and enjoys being part of a team dedicated to making a difference in the community.\n\n  Responsibilities\n\n\t \tProvide administrative and organizational support to the Development team.\n\n\t \tAssist with fundraising initiatives, campaigns, and donor outreach.\n\n\t \tMaintain and update donor databases, records, and contribution information.\n\n\t \tPrepare correspondence, thank-you letters, invitations, presentations, and other donor communications.\n\n\t \tAssist with coordinating fundraising events, meetings, and community initiatives.\n\n\t \tCommunicate professionally and graciously with donors, high-net-worth individuals, community leaders, and other important contacts.\n\n\t \tHelp manage donor follow-ups and ensure timely, thoughtful communication.\n\n\t \tAssist with mailings, acknowledgments, reports, and special projects.\n\n\t \tHandle confidential donor and organizational information with the utmost discretion.\n\n\t \tProvide general administrative support and help keep daily operations running smoothly.\n\n  Qualifications\n\n\t \tPolished, professional, and personable, with excellent communication and interpersonal skills.\n\n\t \tComfortable and confident interacting with high-net-worth donors, community leaders, and prominent members of the community.\n\n\t \tDiscreet, trustworthy, and able to handle sensitive information with professionalism.\n\n\t \tExcellent organizational skills and strong attention to detail.\n\n\t \tAble to multitask, prioritize, and follow through in a busy environment.\n\n\t \tStrong computer skills, including Microsoft Word, Excel, and Outlook.\n\n\t \tComfortable working with databases and learning new technology.\n\n\t \tProactive, resourceful, dependable, and a team player.\n\n\t \tPrevious experience in development, fundraising, or high-level administrative support is a plus.\n\n  Location\n\n\t \tBrooklyn, NY during the winter months.\n\n\t \tDeal, NJ during the summer months."}, {"id": "27034", "title": "Commercial Property Manager & Leasing Agent", "bhTitle": "Property Manager", "category": "Real Estate & Property", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-18", "exp": "2027-02-11", "desc": "Location: Brooklyn, NY (with travel to New York and Philadelphia properties)\n Schedule: Full-Time, In-Office\n\n  Position Overview\n\n  A well-established real estate ownership group is seeking an experienced Commercial Property Manager & Leasing Agent to oversee the day-to-day operations, management, and leasing of its commercial real estate portfolio throughout New York and Philadelphia.\n\n  This is a hands-on position working directly with ownership and overseeing multiple properties. The ideal candidate is equally comfortable managing property operations, dealing with tenants, coordinating maintenance, negotiating leases, and identifying opportunities to maximize occupancy and property performance.\n\n  Key Responsibilities\n\n  Commercial Property Management\n\n\t \tOversee the day-to-day operations of a portfolio of commercial properties in New York and Philadelphia.\n\n\t \tServe as the primary point of contact for commercial tenants and address their needs and concerns.\n\n\t \tManage tenant relationships, lease compliance, renewals, rent collections, and delinquent accounts.\n\n\t \tCoordinate maintenance, repairs, renovations, and capital improvement projects.\n\n\t \tSupervise and coordinate contractors, vendors, building personnel, and service providers.\n\n\t \tConduct regular property inspections to ensure buildings are properly maintained.\n\n\t \tAddress tenant complaints, building issues, and operational challenges in a timely manner.\n\n\t \tMonitor property expenses, operating budgets, and maintenance costs.\n\n\t \tEnsure properties comply with applicable building codes, safety regulations, and local requirements.\n\n  Leasing & Business Development\n\n\t \tMarket available commercial spaces and actively source prospective tenants.\n\n\t \tHandle the leasing process from initial inquiry through negotiation and execution.\n\n\t \tConduct property tours and show available spaces to prospective tenants.\n\n\t \tNegotiate rental rates, lease terms, renewals, and extensions.\n\n\t \tPrepare and review letters of intent and coordinate lease documentation with legal counsel.\n\n\t \tBuild relationships with commercial real estate brokers and local business owners.\n\n\t \tIdentify opportunities to increase occupancy and maximize rental income.\n\n\t \tMonitor local market conditions, rental rates, and competing properties.\n\n  Reporting & Ownership Communication\n\n\t \tProvide regular updates to ownership regarding property operations, occupancy, leasing activity, and outstanding issues.\n\n\t \tMaintain accurate records of leases, tenants, vendors, expenses, and property-related matters.\n\n\t \tTrack lease expirations, renewal dates, vacancies, and upcoming capital projects.\n\n\t \tProactively identify issues and recommend solutions to improve property performance.\n\n  Qualifications\n\n\t \t5+ years of commercial property management and/or commercial leasing experience.\n\n\t \tExperience managing multiple commercial properties.\n\n\t \tStrong knowledge of commercial leases, tenant relations, and property operations.\n\n\t \tProven ability to negotiate leases and secure tenants.\n\n\t \tExperience working with contractors, vendors, maintenance personnel, and brokers."}, {"id": "27033", "title": "Real Estate Attorney", "bhTitle": "Attorney", "category": "Legal", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-18", "exp": "2027-02-01", "desc": "A well-established company is seeking an experienced Real Estate Attorney to oversee and manage a broad range of legal matters relating to its retail operations and the owners' extensive real estate portfolio.\n\n  This is a hands-on position working directly with ownership and management, providing legal guidance and handling transactions, negotiations, contracts, leases, and ongoing property-related matters. The ideal candidate has strong commercial real estate experience, excellent negotiation skills, and the ability to independently manage multiple matters from start to finish.\n\n  Key Responsibilities\n\n  Commercial Real Estate & Retail Operations\n\n\t \tDraft, review, negotiate, and oversee commercial leases for retail locations.\n\n\t \tHandle new store leases, renewals, extensions, assignments, subleases, and lease terminations.\n\n\t \tNegotiate lease terms, rent escalations, options, CAM charges, and other provisions.\n\n\t \tReview and negotiate purchase and sale agreements for commercial properties.\n\n\t \tConduct and oversee due diligence, title reviews, surveys, and closing documentation.\n\n\t \tAddress landlord-tenant disputes, defaults, lease enforcement, and other real estate issues.\n\n\t \tWork with brokers, landlords, property managers, and outside counsel.\n\n  Private Real Estate Portfolio\n\n\t \tHandle legal matters involving the owners' substantial portfolio of commercial and residential properties.\n\n\t \tDraft and review purchase and sale agreements, deeds, mortgages, and other property-related documents.\n\n\t \tOversee acquisitions, dispositions, refinancing, and property transfers.\n\n\t \tReview and negotiate management agreements, vendor contracts, and construction agreements.\n\n\t \tAddress tenant matters, lease disputes, violations, and property-related litigation.\n\n\t \tCoordinate with title companies, lenders, government agencies, and outside attorneys.\n\n  General Legal Support\n\n\t \tProvide practical legal advice directly to ownership and senior management.\n\n\t \tIdentify potential legal risks and recommend solutions.\n\n\t \tMaintain organized records of contracts, leases, transactions, and important deadlines.\n\n\t \tCoordinate with outside law firms when specialized legal expertise is required.\n\n  Qualifications\n\n\t \tJ.D. from an accredited law school.\n\n\t \tActive New York State Bar admission in good standing.\n\n\t \t5+ years of relevant real estate law experience.\n\n\t \tStrong background in commercial real estate transactions and leasing"}, {"id": "27032", "title": "Customer Service", "bhTitle": "Customer Service", "category": "Administrative & Office", "type": "Remote / Hybrid", "typeNote": "Remote/Hybrid/PT", "state": "NJ", "added": "2026-11-18", "exp": "2027-02-05", "desc": "Remote. Customer Service rep 4-5 hours a day. Flexible to work within the person's schedule.\n Answer emails from customers about products and orders for live selling platform. Must have good written communication skills and computer savvy."}, {"id": "27031", "title": "Merchandiser – Fashion & Accessories", "bhTitle": "Merchandising", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "Not listed", "added": "2026-11-17", "exp": "2027-02-17", "desc": "Location: New York, NY\n Employment Type: Full-Time, On-Site\n Schedule: 5 Days per Week (4 Office Days May Be Considered)\n\n  Job Description\n\n  An established fashion and accessories company is seeking a highly organized, personable, and experienced Merchandiser to join its team.\n\n  The ideal candidate will have a strong understanding of fashion trends, accessories, merchandising, and customer relationships, with the ability to coordinate product assortments, communicate effectively with customers, and support daily merchandising operations.\n\n  This position requires someone who is detail-oriented, fashion-conscious, and comfortable working directly with customers.\n\n  Previous merchandising or related industry experience is required; however, candidates do not need to have worked specifically in accessories.\n\n  The position is generally five days per week, with flexibility to consider candidates who can work four days per week in the office.\n\n  Key Responsibilities\n\n  Merchandising & Product Management\n\n\t \tAssist in developing and managing fashion and accessories product assortments.\n\n\t \tOrganize and maintain product collections, samples, and merchandising materials.\n\n\t \tStay informed about current fashion trends, styles, and customer preferences.\n\n\t \tEnsure product assortments are organized, attractive, and aligned with customer expectations.\n\n\t \tCoordinate product presentations and merchandising activities.\n\n\t \tSupport seasonal collection planning and product selection.\n\n\t \tMonitor product availability and communicate merchandising needs to internal teams.\n\n\t \tMaintain accurate product information and organized merchandising records.\n\n  Customer Relations & Communication\n\n\t \tCommunicate directly with customers regarding products, collections, and merchandise inquiries.\n\n\t \tBuild and maintain strong, professional customer relationships.\n\n\t \tUnderstand customer preferences and provide appropriate product recommendations.\n\n\t \tRespond to customer questions and requests promptly and professionally.\n\n\t \tAssist with presenting merchandise and new collections to customers.\n\n\t \tCoordinate with internal departments to ensure customer needs are addressed.\n\n\t \tMaintain a friendly, professional, and service-oriented approach.\n\n  Administrative & Merchandising Coordination\n\n\t \tManage multiple merchandising projects and daily responsibilities.\n\n\t \tMaintain organized product samples, records, and customer information.\n\n\t \tCoordinate with sales, purchasing, and product development teams.\n\n\t \tTrack merchandising deadlines and ensure timely completion of assignments.\n\n\t \tAssist with product presentations, showroom organization, and customer meetings as needed.\n\n\t \tIdentify opportunities to improve merchandising processes and organization.\n\n\t \tSupport general merchandising and administrative responsibilities.\n\n  Qualifications\n\n\t \tPrevious experience in merchandising, fashion, retail, wholesale, or a related field required.\n\n\t \tFamiliarity with fashion trends, accessories, and product assortments.\n\n\t \tAccessories-specific experience is not required.\n\n\t \tExcellent organizational and time-management skills.\n\n\t \tStrong interpersonal and customer communication abilities.\n\n\t \tPersonable, friendly, and professional demeanor.\n\n\t \tAbility to build and maintain positive customer relationships.\n\n\t \tStrong attention to detail and accuracy.\n\n\t \tAbility to manage multiple responsibilities and meet deadlines.\n\n\t \tComfortable working independently and collaboratively.\n\n\t \tStrong problem-solving skills and a proactive attitude.\n\n\t \tAbility to work in a fast-paced environment.\n\n\t \tBasic computer and administrative skills."}, {"id": "27030", "title": "Sales", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-17", "exp": "2027-02-17", "desc": "Company selling supplies seeking someone for phone sales. They will be trained and gived leads."}, {"id": "27029", "title": "PCA Coordinator", "bhTitle": "Coordinator", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-17", "exp": "2027-02-17", "desc": "Location: Brooklyn, NY\n Employment Type: Full-Time, On-Site\n Schedule: Monday–Thursday, 9:00 AM–5:00 PM; Friday, 9:00 AM–12:00/1:00 PM\n\n  Job Description\n\n  An established home care agency in Brooklyn, NY, is seeking a highly organized, compassionate, and detail-oriented PCA Coordinator to oversee patient caseloads and ensure the smooth delivery of home care services.\n\n  The ideal candidate will be responsible for coordinating caregivers, managing patient needs, maintaining accurate documentation, and ensuring compliance with healthcare regulations.\n\n  This position requires strong communication, organizational, and problem-solving skills, along with the ability to manage multiple responsibilities in a fast-paced healthcare environment.\n\n  Key Responsibilities\n\n  Patient & Caregiver Coordination\n\n\t \tManage an assigned caseload of home care patients.\n\n\t \tServe as the primary point of contact for patients, caregivers, and family members.\n\n\t \tCoordinate caregiver staffing and scheduling based on patient needs and authorized service hours.\n\n\t \tAddress and resolve patient and caregiver concerns professionally and efficiently.\n\n\t \tEnsure continuity of care by maintaining appropriate caregiver coverage.\n\n\t \tProvide ongoing support and guidance to patients and caregivers.\n\n\t \tMaintain positive relationships with patients, families, and healthcare staff.\n\n  Compliance & Documentation\n\n\t \tMaintain accurate patient records, caregiver documentation, and scheduling information.\n\n\t \tEnsure compliance with applicable healthcare regulations and organizational policies.\n\n\t \tPrepare and maintain required reports and documentation.\n\n\t \tSupport quality assurance initiatives and internal audits.\n\n\t \tEnsure records are organized, accurate, and ready for regulatory review.\n\n\t \tIdentify documentation discrepancies and coordinate necessary corrections.\n\n  Administrative & Operational Support\n\n\t \tCollaborate with internal departments regarding payroll, benefits, and operational processes.\n\n\t \tAssist with daily administrative responsibilities related to patient care coordination.\n\n\t \tMonitor scheduling changes and communicate updates to appropriate parties.\n\n\t \tMaintain organized records and ensure timely completion of assigned tasks.\n\n\t \tAssist with resolving operational challenges and improving workflow efficiency.\n\n\t \tPerform additional coordination and administrative duties as needed.\n\n  Qualifications\n\n\t \tHigh school diploma required; some college or business education preferred.\n\n\t \tStrong organizational and time-management skills.\n\n\t \tExcellent verbal and written communication abilities.\n\n\t \tAbility to coordinate schedules and manage multiple responsibilities.\n\n\t \tStrong attention to detail and accuracy.\n\n\t \tProfessional, compassionate, and patient-focused attitude.\n\n\t \tAbility to resolve issues efficiently and communicate with patients, caregivers, and families.\n\n\t \tComfortable working in a fast-paced healthcare environment.\n\n\t \tAbility to maintain confidential patient information.\n\n\t \tStrong computer and administrative skills.\n\n\t \tAbility to work independently and collaboratively with internal teams.\n\n\t \tPrevious experience in home care coordination, patient scheduling, or healthcare administration is a plus."}, {"id": "27028", "title": "Designer", "bhTitle": "Designer", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-17", "exp": "2027-02-05", "desc": "We are looking for a Senior Designer to join our Legwear team. This is a great opportunity for those looking to be a part of an energetic, creative, and collaborative group. Our designers have been shaping our department for the better season after season.\n\n  Role and Responsibilities:\n\n\tDesign ownership over brands, assigned based on aesthetic and creative strengths, responsible for creating digital CADs for full seasonal collections\n\tCreate and then present tech packages with information necessary in order to communicate design specific detail necessary to hand off to the design team and factories\n\tPLM knowledge and management\n\tProvide direction as well as design alongside a team of designers, prepare sample requests, review, critique, test, and approve submitted samples while adhering to product, color, and material standards\n\tStrong eye for trend, conducting valuable market research, bringing ideas to bi-weekly meeting and inspiring other members of design team\n\tWorks closely with Design Director and Manager with creative freedom throughout process\n\tWorks with our overseas team to solve PD problems when technical or timing setbacks arise\n\tWork cross-functionally and professionally with product development team, communicating clearly to ensure the design is produced how you envisioned\n\tPrimarily design in Illustrator with minimal retouching in Photoshop\n\tBring new ideas and concepts to table regularly each season\n\tAdjust product styling and features as needed after receiving feedback.\n\tEnsure designs align with brand and licensing standards, preparing materials for approvals when required.\n\tAssist in building trend packets\n\tHelp to create pitches for new licenses\n\tParticipate in meetings with licensors and buyers if needed.\n\tPerform comp shopping and store shopping activities to monitor the competitive landscape and identify opportunities for product differentiation and innovation.\n\tUtilize all resources available to get the latest direction on forward trends ie; WGSN\n\tSpecial projects as assigned\n\n  Qualifications:\n\n\t5+ years' experience in Legwear.\n\tExperience in working for a wholesale company managing multiple licenses a plus\n\tCreative edge, bringing new ideas and trends to the table\n\tExcellent time management skills\n\tExcellent project management skills\n\tPositive team player\n\tAbility to work in a fast-paced and deadline-driven environment\n\tProficient Illustrator & working knowledge of Photoshop\n\tExcellent written and verbal communication skills\n\tStrong knowledge of customers and buyers' expectations\n\tPerform other related duties as assigned by management to support the department's business needs\n\tUnderstand and follow Gina's employee policies and procedures\n\n  Benefits and Perks:\n\n\tHybrid work schedule & early Fridays\n\tGenerous PTO and paid holidays\n\tComprehensive health, dental and vision coverage with FSA options\n\tPre-tax commuter benefits\n\tProfessional development\n\tTeam building and Company events"}, {"id": "27027", "title": "Administrative Assistant / Guest Services Representative", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Full or Part Time", "typeNote": "", "state": "NJ", "added": "2026-11-17", "exp": "2027-01-18", "desc": "A year-round private members-only beach club and community center, is looking for a friendly, organized, and customer-service-oriented individual to join its team as an Administrative Assistant / Guest Services Representative.\n\n  This person will serve as a main point of contact for members, guests, and prospective members, while assisting with daily administrative tasks, guest services, and event coordination. The ideal candidate is personable, professional, dependable, and comfortable handling a variety of responsibilities.\n\n  Responsibilities\n\n\t \tAnswer incoming phone calls, respond to inquiries, and direct calls to the appropriate departments.\n\n\t \tAssist members and guests with questions, requests, and general information.\n\n\t \tWelcome prospective members and assist with facility tours.\n\n\t \tRespond to emails and maintain professional communication.\n\n\t \tHelp coordinate, prepare, and set up small events and community activities.\n\n\t \tPrepare and distribute the monthly property calendar to relevant departments.\n\n\t \tHandle general administrative duties, including filing, data entry, and office organization.\n\n\t \tCommunicate updates regarding club activities, events, schedules, and operations.\n\n\t \tProvide general support to management and assist with daily operations as needed.\n\n  Qualifications\n\n\t \tExcellent communication and customer service skills.\n\n\t \tFriendly, professional, and welcoming personality.\n\n\t \tStrong organizational skills and attention to detail.\n\n\t \tAbility to multitask and manage different responsibilities.\n\n\t \tComfortable answering phones, responding to emails, and using basic computer programs.\n\n\t \tAble to work independently and as part of a team.\n\n\t \tDependable, punctual, and flexible with scheduling.\n\n\t \tReliable transportation required.\n\n\t \tAvailable to work occasional evenings and weekends.\n\n  Ideal Candidate: Someone who enjoys working with people, takes initiative, and is willing to jump in wherever needed to help create a welcoming environment and keep daily operations running smoothly."}, {"id": "27025", "title": "JOB DESCRIPTION", "bhTitle": "Sourcing Manager", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-16", "exp": "2027-02-16", "desc": "- Send inquiry packages to overseas manufacturers or agents for price and delivery quotation.\n\n  - Daily communication with overseas manufacturers and agents regarding production details for all confirmed orders.\n\n  - Daily communication with Shanghai office regarding production details for all confirmed orders\n\n  - Work with designer for sample fitting comments and approvals.\n\n  - Work with sales for order details\n\n  - Work with product managers for order delivery details\n\n  - Work with Quality Assurance Department for lab and sample approval.\n\n  QUALIFICATIONS:\n\n  - Formal education (College Degree)\n\n  - Knowledge of Fabric and Garment Construction\n\n  - Minimum of 3 or more years experience in production\n\n  - PC Proficiency with word and excel.\n\n  - Bilingual Chinese (Mandarin or Cantonese)\n\n  - US Citizenship or Green card\n\n  - Have experience for Ladies sportswear customers: Costco, Walmart, Kohl's, Fred Meyer, Meijer is preferred.\n\n … more\n\n Featured benefits\n\n  Medical insurance, Vision insurance, Dental insurance, 401(k), Commuter benefits\n\n Requirements added by the job poster\n\n  • 1+ years of work experience with Microsoft Excel"}, {"id": "27024", "title": "Part-Time Marketing & Community Engagement Manager", "bhTitle": "Marketing", "category": "E-commerce, Marketing & Social Media", "type": "Remote / Hybrid", "typeNote": "Remote/Hybrid/PT", "state": "NY", "added": "2026-11-16", "exp": "2027-02-08", "desc": "A dating app serving the community, is seeking a creative and organized Part-Time Marketing & Community Engagement Manager to oversee social media, coordinate email and SMS marketing campaigns, and help grow the platform. The ideal candidate will bring fresh ideas for community engagement, events, and marketing initiatives, and have the ability to turn those ideas into action.\n\n Position Type: Part-Time\n\n  Job Hours: Flexible schedule; hours to be discussed.\n\n Essential Duties and Responsibilities:\n\n\t \tManage and create social media content and posts across relevant
