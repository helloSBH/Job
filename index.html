ting young children.\n\tPatient, attentive, and professional when interacting with students.\n\tStrong commitment to passenger safety.\n\tExcellent communication and time-management skills.\n\tFamiliarity with Brooklyn and surrounding areas preferred.\n\tPrevious experience as a school driver, family driver, transportation driver, or similar role is a plus.\n\tAbility to maintain a consistent weekday schedule."}, {"id": "26649", "title": "Accountant", "bhTitle": "Accountant", "category": "Accounting & Finance", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-08-18", "exp": "2026-11-18", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time or Full-Time, In-Person\n\nPosition Overview\n\nA nonprofit organization in Brooklyn, NY is seeking an experienced and detail-oriented Accountant to join its team. The primary focus of this role will be managing accounting responsibilities related to city and state grants, including financial reporting, documentation, submissions, and ongoing grant compliance.\n\nThe ideal candidate has a strong accounting background with experience working with government grants. Previous experience in the nonprofit sector is highly preferred, and CPA credentials are a plus.\n\nThis position can begin on a part-time basis with the opportunity to transition into a full-time role.\n\nKey Responsibilities\n\n\tManage accounting and financial responsibilities related to city and state grants.\n\tPrepare and submit required financial documentation for government-funded programs.\n\tTrack grant revenue, expenses, reimbursements, and budget allocations.\n\tPrepare grant-related financial reports and reimbursement requests.\n\tMonitor grant expenditures against approved budgets.\n\tEnsure expenses are properly documented and allocated to the appropriate grants and programs.\n\tMaintain complete and organized supporting documentation for grant submissions.\n\tMonitor grant reporting requirements, deadlines, and financial compliance.\n\tMaintain accurate accounting and general ledger records.\n\tPrepare journal entries, account reconciliations, and financial reports.\n\tAssist with accounts payable and accounts receivable as needed.\n\tSupport budgeting and financial planning activities.\n\tPrepare documentation for audits and grant reviews.\n\tWork closely with leadership and program staff to obtain required financial information.\n\tHelp ensure compliance with applicable nonprofit and government funding requirements.\n\tMaintain accurate and organized financial records.\n\tAssist with additional accounting and finance responsibilities as needed.\n\nQualifications\n\n\tPrevious professional accounting experience required.\n\tExperience working with city and/or state grants strongly preferred.\n\tKnowledge of government grant reporting, documentation, and financial requirements.\n\tBackground in nonprofit accounting or nonprofit financial operations is highly preferred.\n\tCPA preferred but not required.\n\tStrong knowledge of accounting principles and financial reporting.\n\tExperience with general ledger accounting, reconciliations, budgeting, and financial documentation.\n\tStrong Microsoft Excel skills.\n\tExperience with accounting software preferred.\n\tExceptional attention to detail and accuracy.\n\tStrong organizational and time-management abilities.\n\tAbility to manage multiple reporting requirements and deadlines.\n\tStrong written and verbal communication skills.\n\tAbility to work independently and take ownership of responsibilities."}, {"id": "26648", "title": "Intake Coordinator", "bhTitle": "Coordinator", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-18", "exp": "2026-11-18", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time, In-Person\n\nPosition Overview\n\nA growing organization in Brooklyn, NY is seeking a motivated, personable, and highly organized Intake Coordinator to join its team. This position is ideal for someone who enjoys working directly with people, providing excellent client service, and ensuring important documentation and intake processes are completed accurately and efficiently.\n\nThe ideal candidate is warm, professional, detail-oriented, and an excellent communicator who can help clients navigate the intake process while maintaining consistent follow-up.\n\nKey Responsibilities\n\n\tServe as a primary point of contact for clients throughout the intake process.\n\tCommunicate with clients daily and develop strong, professional relationships.\n\tGuide clients through required intake procedures and next steps.\n\tAssist clients with completing forms, applications, and other required documentation.\n\tExplain paperwork and requirements clearly and patiently.\n\tReview documentation for accuracy and completeness.\n\tPrepare and submit intake paperwork accurately and within required timelines.\n\tFollow up with clients regarding missing or outstanding information.\n\tMaintain accurate and organized client records.\n\tTrack intake progress and ensure cases continue moving through the process.\n\tRespond to client phone calls, emails, and questions in a timely and professional manner.\n\tCoordinate with internal team members to ensure smooth client onboarding.\n\tMaintain confidentiality and professionalism when handling client information.\n\tAssist with general administrative and intake-related responsibilities as needed.\n\tContribute to a positive, collaborative, and supportive office environment.\n\nQualifications\n\n\tExcellent verbal and written communication skills.\n\tStrong interpersonal and customer service abilities.\n\tWarm, friendly, patient, and professional demeanor.\n\tExceptional attention to detail and accuracy.\n\tStrong organizational and time-management skills.\n\tAbility to manage multiple clients, documents, and priorities simultaneously.\n\tExcellent follow-up skills.\n\tComfortable communicating with clients by phone, email, and in person.\n\tAbility to learn new systems and processes quickly.\n\tDependable and able to work effectively in a fast-paced environment.\n\tTeam-oriented attitude with a willingness to assist coworkers when needed.\n\tPrevious experience in intake coordination, client services, healthcare, administrative support, or a related position is a plus."}, {"id": "26647", "title": "Intake Manager", "bhTitle": "Intake", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-18", "exp": "2026-11-18", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time, In-Person\n\nPosition Overview\n\nA growing organization in Brooklyn, NY is seeking an organized, motivated, and professional Intake Manager to lead and oversee its daily intake operations. This is an excellent opportunity for a strong leader who enjoys managing processes, supporting and developing staff, and ensuring clients receive a professional and seamless experience from their initial point of contact.\n\nThe Intake Manager will be responsible for overseeing the intake team, coordinating client onboarding, monitoring workflow and productivity, ensuring documentation is completed accurately and on time, and providing regular updates to the Director of Operations.\n\nKey Responsibilities\n\n\tOversee the day-to-day operations of the intake department.\n\tManage and support intake team members to maintain an efficient and accurate workflow.\n\tCoordinate the complete client intake process from initial contact through completion.\n\tEnsure clients receive professional, responsive, and supportive service throughout the intake process.\n\tMaintain strong relationships with clients, referral sources, and internal team members.\n\tAssist clients with completing required forms, applications, and supporting documentation.\n\tReview intake paperwork for completeness and accuracy before submission.\n\tEnsure all required documentation is prepared, processed, and submitted within established timelines.\n\tTrack outstanding documentation and follow up with clients and team members as needed.\n\tMonitor intake volume, team productivity, pending cases, and overall departmental workflow.\n\tIdentify bottlenecks or operational issues and implement solutions to improve efficiency.\n\tEstablish clear expectations and hold team members accountable for accuracy, productivity, and follow-through.\n\tProvide ongoing training, guidance, and support to intake staff.\n\tAssist with onboarding and training new team members.\n\tPrepare and review weekly and monthly intake and productivity reports.\n\tTrack departmental performance and ensure established goals are consistently met.\n\tMaintain accurate and organized client records and intake documentation.\n\tCollaborate with other departments to ensure smooth handoffs and continuity throughout the client process.\n\tProvide the Director of Operations with regular updates regarding performance, workflow, staffing, client matters, and other important departmental developments.\n\tHandle escalated client or intake-related issues professionally and efficiently.\n\tSupport continued growth by developing and improving intake processes, procedures, and systems.\n\nQualifications\n\n\tPrevious experience in healthcare, client services, intake coordination, office management, or a related environment is preferred.\n\tPrevious supervisory, management, or team leadership experience is strongly preferred.\n\tStrong leadership and people-management abilities.\n\tExcellent organizational and time-management skills.\n\tExceptional attention to detail and accuracy.\n\tStrong verbal, written, and interpersonal communication skills.\n\tAbility to manage multiple priorities and deadlines in a fast-paced environment.\n\tStrong problem-solving and critical-thinking abilities.\n\tComfortable reviewing reports, tracking performance, and holding team members accountable.\n\tProfessional and confident when communicating with clients, referral sources, employees, and leadership.\n\tStrong follow-up skills with the ability to take ownership of responsibilities.\n\tComfortable learning and working with intake systems, databases, and general office technology.\n\tPositive, professional, and team-oriented attitude."}, {"id": "26645", "title": "Live Streamer / Account & Warehouse Associate", "bhTitle": "Assistant", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-08-18", "exp": "2026-11-18", "desc": "Location: On-site\nJob Type: Full-time or Part-time\nSchedule: Flexible shifts available; open to evening hours past 7:00 PM for extra compensation\n\nWe are a leading e-commerce and streaming company looking for an energetic Live Streamer to represent our brand and connect with our audience live on camera. Whether you are looking for a focused part-time streaming gig or a full-time role with additional operational responsibilities, we have a position that fits your goals.\n\nKey Responsibilities:\n\n\tHost engaging, high-energy live streams to showcase products, demonstrate features, and interact with our online community.\n\n\tManage stream setups, maintain interactive chat engagement, and promote active viewer participation.\n\n\tFor Full-Time Applicants: Assist with daily warehouse operations, fulfillment, inventory maintenance, and account management across our multiple brand channels.\n\n\tOptionally host evening stream sessions past 7:00 PM for additional earnings.\n\nQualifications:\n\n\tComfortable, confident, and charismatic in front of a camera.\n\n\tStrong communication skills with the ability to keep an audience entertained and engaged.\n\n\tReliable, self-motivated, and eager to grow within a fast-paced e-commerce environment.\n\n\tAbility to multitask and adapt quickly between live presentation and back-end tasks (for full-time team members).\n\nWhat We Offer:\n\n\tFlexible employment options tailored to your availability (Part-time or Full-time).\n\n\tHigher pay rates for extended evening streaming hours past 7:00 PM.\n\n\tHands-on experience in dynamic live-commerce and cross-channel account management.\n\n\tA collaborative and supportive team environment with clear room for growth."}, {"id": "26644", "title": "Sales", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-18", "exp": "", "desc": "Wholesale food company seeking sales person. plus if experience in the food industry.\n\nSeeking someone with strong relationships and experience selling into big-box retailers, major department stores, supermarket chains, and food distributors."}, {"id": "26643", "title": "Head of Production", "bhTitle": "Production Manager", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-18", "exp": "2026-11-18", "desc": "Location: Manhattan, New York\nEmployment Type: Full-Time\n\nPosition Overview\n\nA growing apparel company in Manhattan is seeking an experienced Head of Production & Merchandising to lead and take ownership of the complete apparel production process, from initial product development and costing through bulk production and final delivery.\n\nThis is a senior, hands-on leadership position for an apparel professional who understands every aspect of the business, including product development, sourcing, factory management, costing, merchandising, quality, compliance, logistics, and customer requirements.\n\nThe ideal candidate is highly organized, commercially minded, and comfortable managing multiple factories, programs, customers, and deadlines simultaneously. This person must be able to identify problems early, make decisions quickly, negotiate effectively, and ensure products are delivered correctly, on time, and at the right cost.\n\nKey Responsibilities\n\nProduction Management\n\n\tOversee the complete production lifecycle from initial development through bulk production and final shipment.\n\tManage multiple apparel programs simultaneously while maintaining quality, cost, and delivery expectations.\n\tCommunicate directly with overseas factories and suppliers on a daily basis.\n\tManage production timelines and ensure all programs remain on schedule.\n\tMaintain and oversee WIP reports, T&A calendars, purchase orders, production status reports, and delivery schedules.\n\tIdentify potential production delays or issues early and work directly with factories to develop solutions.\n\tEnsure bulk production accurately reflects approved samples and customer specifications.\n\tEstablish accountability across factories, vendors, and internal production teams.\n\nProduct Development & Approvals\n\n\tReview and manage tech packs, BOMs, garment construction, fabric specifications, trims, artwork, labeling, and packaging.\n\tOversee development samples, fit samples, pre-production samples, TOP samples, and final approvals.\n\tManage fabric, trim, color, wash, print, embroidery, packaging, and other production approvals.\n\tWork closely with design and product development teams to ensure concepts can be executed commercially and efficiently.\n\tEnsure specifications and production requirements are communicated clearly to factories.\n\nSourcing, Costing & Factory Management\n\n\tManage product costing, factory negotiations, margins, and production pricing.\n\tNegotiate with overseas factories to achieve competitive pricing while maintaining quality standards.\n\tMaintain strong relationships with existing factories and suppliers.\n\tContinuously identify opportunities for better pricing, fabrics, capabilities, lead times, and manufacturing options.\n\tEvaluate factory capabilities and determine the appropriate production partners for individual programs.\n\tIdentify opportunities to improve margins without compromising product quality or customer expectations.\n\nMerchandising & Commercial Strategy\n\n\tPartner closely with sales on new programs, customer requests, costing opportunities, and product development.\n\tHelp merchandise collections according to customer needs, price points, trends, and market opportunities.\n\tUnderstand what products are commercially viable for off-price, mass-market, mid-tier, and department-store customers.\n\tEvaluate product opportunities from both a merchandising and production perspective.\n\tHelp ensure assortments balance trend, quality, customer requirements, manufacturing capabilities, and target margins.\n\tSupport the development of private-label and retailer-specific programs.\n\nQuality, Testing & Compliance\n\n\tEstablish and maintain appropriate quality standards across production programs.\n\tEnsure bulk merchandise meets approved specifications and samples.\n\tCoordinate product testing, inspections, compliance requirements, and customer-specific standards.\n\tWork with factories to resolve quality issues before they impact delivery.\n\tMonitor production execution to minimize defects, claims, delays, and costly rework.\n\nLogistics & Delivery\n\n\tCoordinate closely with logistics teams regarding cargo-ready dates and shipment requirements.\n\tMonitor bookings, containers, air shipments, and final delivery schedules.\n\tEnsure production timelines align with customer delivery requirements.\n\tAddress production and logistics issues that could impact delivery dates.\n\tMaintain visibility into programs through final shipment and delivery.\n\nTeam Leadership\n\n\tLead, organize, and develop the production and merchandising team.\n\tEstablish clear processes, responsibilities, and accountability.\n\tWork cross-functionally with sales, design, product development, logistics, customers, factories, and senior leadership.\n\tImprove production systems and processes as the business continues to scale.\n\tTake ownership of major programs and ensure consistent follow-through from beginning to end.\n\nQualifications\n\n\t7+ years of apparel production and/or merchandising experience.\n\tSignificant experience working directly with overseas apparel factories.\n\tStrong understanding of the complete apparel development and production lifecycle.\n\tExtensive knowledge of garment construction, fabrics, trims, printing, embroidery, washes, packaging, and manufacturing techniques.\n\tStrong apparel costing, margin management, and factory negotiation experience.\n\tExperience managing production calendars and large-volume programs.\n\tExperience with major U.S. retailers, off-price retailers, department stores, mass merchants, or private-label programs is strongly preferred.\n\tExperience with Men's, Young Men's, Juniors, Kids, or related apparel categories is a plus.\n\tStrong merchandising instincts and understanding of commercially viable product.\n\tExceptional organizational skills with the ability to manage numerous programs simultaneously.\n\tStrong negotiation, analytical, and problem-solving abilities.\n\tExcellent communication skills and confidence communicating with overseas factories daily.\n\tAbility to operate effectively in a fast-paced environment with changing priorities.\n\tStrong leadership skills and ability to hold teams and vendors accountable.\n\tWillingness to take complete ownership of programs from development through delivery.\n\tAbility to travel internationally as needed."}, {"id": "26642", "title": "Showroom Assistant", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-08-18", "exp": "2026-11-18", "desc": "Location: Ocean, New Jersey\nJob Type: Full-Time / Part-Time\nSchedule: Flexible / Standard Showroom Hours\n\nWe are a full-service kitchen, bath, and closet design studio seeking a welcoming and organized Showroom Assistant to join our team. The ideal candidate will be the face of our showroom, greeting clients, assisting our design team, and helping keep our day-to-day operations running smoothly.\n\nKey Responsibilities:\n\n\tWelcome showroom visitors, answer incoming calls, and respond to client inquiries.\n\n\tAssist clients with initial walk-ins, introducing them to our products and services.\n\n\tMaintain showroom presentation, ensuring samples and displays are clean, organized, and up to date.\n\n\tSupport designers with administrative tasks, client scheduling, and sample management.\n\n\tCoordinate sample orders and deliveries with vendors and sales representatives.\n\n\tManage general office tasks, including filing, inventory tracking, and client correspondence.\n\nQualifications:\n\n\tPrevious experience in a retail, showroom, or customer service environment preferred.\n\n\tStrong interpersonal and verbal communication skills with a client-focused attitude.\n\n\tExcellent organizational skills and strong attention to detail.\n\n\tBasic computer skills and familiarity with standard office software.\n\n\tAn interest in interior design, home improvement, or kitchen and bath trends is a plus.\n\n\tAbility to work on-site at our Ocean, NJ showroom.\n\nWhat We Offer:\n\n\tFlexible full-time or part-time work schedules.\n\n\tA creative, supportive, and collaborative team environment.\n\n\tOpportunities for growth within the home design industry."}, {"id": "26641", "title": "Kitchen Designer", "bhTitle": "Designer", "category": "Design & Creative", "type": "Full or Part Time", "typeNote": "", "state": "NJ", "added": "2026-08-18", "exp": "2026-11-18", "desc": "Location: Ocean, New Jersey\nJob Type: Freelance\nSchedule: Full OR Part-Time\n\nWe are a full-service kitchen, bath, and closet design studio seeking an experienced full- or part-time freelance kitchen designer to join our team.\nThe ideal candidate has experience designing residential kitchens, preparing professional layouts and renderings, and working directly with homeowners, contractors, and interior designers. This position offers potential for additional work as our business grows.\n\nKey Responsibilities:\n\n\tMeet with clients to understand their needs, style, and budget.\n\n\tCreate functional and attractive kitchen designs.\n\n\tPrepare floor plans, elevations, renderings, and cabinet specifications.\n\n\tRevise designs based on client feedback.\n\n\tCoordinate with our sales and project teams.\n\n\tReview measurements and help ensure orders are accurate.\n\nQualifications:\n\n\tPrevious kitchen design experience required.\n\n\tProficiency with kitchen design software, preferably 2020 Design or a similar program.\n\n\tStrong knowledge of cabinetry, appliances, countertops, and kitchen layouts.\n\n\tExcellent communication and organizational skills.\n\n\tAbility to manage projects independently and meet deadlines.\n\n\tAvailability for occasional client meetings at our Ocean, NJ showroom.\n\nWhat We Offer:\n\n\tFlexible part-time schedule tailored to your workflow.\n\n\tOpportunity for growth and increased project volume as our business expands."}, {"id": "26639", "title": "Account and Warehouse Manager", "bhTitle": "Manager", "category": "Warehouse, Driving & Logistics", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-17", "exp": "2026-11-17", "desc": "Location: On-site\nJob Type: Full-time\nSchedule: 9:30 AM – 6:30 PM\n\nWe are a leading e-commerce and streaming company looking for a dedicated Account and Warehouse Manager to join our growing team. This role is ideal for a driven individual ready to manage warehouse operations while supporting key client accounts in a fast-paced environment.\n\nKey Responsibilities:\n\n\tOversee daily warehouse operations, inventory control, and fulfillment processes.\n\n\tManage client accounts, ensuring strong communication and prompt resolution of inquiries.\n\n\tBring a strong work ethic, high motivation, and a commitment to growing within the company.\n\nQualifications:\n\n\tBrings good energy, positivity, and a collaborative spirit to the workplace.\n\n\tStrong organizational skills with the ability to multitask effectively.\n\n\tSelf-motivated with a desire to learn and take on new challenges.\n\nWhat We Offer:\n\n\tOpportunities for long-term career growth and professional development.\n\n\tA dynamic, engaging team culture in the e-commerce industry."}, {"id": "26638", "title": "Production Manager", "bhTitle": "Production Manager", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-17", "exp": "", "desc": "Home Textile company seeking Production/Sourcing manager."}, {"id": "26637", "title": "Teacher Assistant", "bhTitle": "Assistant", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-17", "exp": "2026-11-17", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday–Thursday, 8:45 AM–4:00 PM; Friday: 8:45 AM–1:15 PM\n\nPosition Overview\n\nA preschool in Brooklyn, NY is seeking warm, responsible, and dedicated Teacher Assistants to join its 2- and 3-year-old program. This is an excellent opportunity for someone who enjoys working with young children and wants to be part of a nurturing and supportive classroom environment.\n\nThe ideal candidate is patient, caring, attentive, and dependable. The Teacher Assistant will work closely with the lead teacher to support classroom routines, learning activities, playtime, meals, and the overall social and emotional well-being of the children.\n\nKey Responsibilities\n\n\tAssist the lead teacher with daily classroom activities, lessons, and routines.\n\tProvide attentive care and supervision to children throughout the school day.\n\tHelp create a warm, safe, nurturing, and positive classroom environment.\n\tSupport age-appropriate learning activities, crafts, games, and creative play.\n\tEngage with children during structured activities and free play.\n\tAssist with meals, snacks, transitions, and other daily routines.\n\tHelp prepare classroom materials and activities.\n\tMaintain a clean, organized, and welcoming classroom.\n\tSupport children as they develop social, emotional, communication, and independence skills.\n\tObserve children's needs and communicate relevant information to the lead teacher.\n\tAssist with classroom organization and cleanup throughout the day.\n\tWork collaboratively with the lead teacher and other school staff.\n\tHelp maintain consistent classroom routines and expectations.\n\tProvide additional classroom support wherever needed.\n\nQualifications\n\n\tPrevious experience working with young children is preferred.\n\tGenuine interest in early childhood education and child development.\n\tWarm, caring, patient, and nurturing personality.\n\tResponsible, dependable, and punctual.\n\tStrong communication and interpersonal skills.\n\tAbility to work collaboratively as part of a classroom team.\n\tAttentive and responsive to children's individual needs.\n\tAbility to follow classroom routines and instructions.\n\tComfortable working with 2- and 3-year-old children in an active preschool environment.\n\tPositive attitude and willingness to assist wherever needed."}, {"id": "26636", "title": "Administrative Coordinator", "bhTitle": "Administration", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-17", "exp": "2026-11-17", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule:  Monday through Thursday, 9:00 AM–3:00 PM, Friday- Flexible hours\n\nPosition Overview\n\nA Yeshiva in Brooklyn, NY is seeking a responsible, highly organized, and capable Administrative Coordinator to help manage day-to-day school operations. This is a hands-on role for someone who can keep multiple responsibilities organized, communicate effectively with staff, parents, vendors, and service providers, and ensure important tasks are completed accurately and on time.\n\nThe ideal candidate is proactive, dependable, comfortable taking ownership, and able to anticipate needs rather than waiting for direction. Familiarity with the Yeshiva and frum community is important for understanding the school's environment, families, and values.\n\nKey Responsibilities\n\n\tSupport the day-to-day administrative operations of the Yeshiva.\n\tCommunicate with vendors, service providers, and outside organizations.\n\tManage scheduling, appointments, meetings, and school calendars.\n\tCoordinate school trips, transportation, and related logistics.\n\tArrange transportation and communicate schedules and changes with appropriate parties.\n\tAssist with facilities coordination and ensure operational needs are addressed.\n\tOversee student enrollment processes and maintain accurate student records.\n\tCommunicate professionally with parents regarding school-related matters.\n\tAssist with student, parent, teacher, and staff communications.\n\tMaintain organized administrative records, files, and documentation.\n\tSupport staff with HR-related administrative needs, payroll coordination, and compliance documentation.\n\tFollow up on outstanding paperwork, requests, and operational matters.\n\tAssist with office management and ensure supplies and resources are available as needed.\n\tCoordinate multiple projects, schedules, and deadlines simultaneously.\n\tUse technology and administrative systems to improve organization and efficiency.\n\tProvide general administrative support to Yeshiva leadership.\n\tHelp ensure school operations are consistent with the Yeshiva's mission, standards, and values.\n\tTake ownership of additional administrative and operational responsibilities as needed.\n\nQualifications\n\n\tStrong organizational and time-management skills.\n\tExceptional attention to detail and follow-through.\n\tResponsible, dependable, and professional.\n\tExcellent written and verbal communication skills.\n\tProactive with the ability to take initiative and solve problems independently.\n\tComfortable making phone calls and communicating with vendors, parents, and service providers.\n\tStrong technology skills and ability to learn new systems quickly.\n\tAbility to manage multiple responsibilities, priorities, and deadlines.\n\tStrong judgment and ability to handle sensitive information appropriately.\n\tAbility to work independently while collaborating effectively with school leadership and staff.\n\tFamiliarity with the Yeshiva and frum community.\n\tPrevious experience in Yeshiva administration, school administration, office management, executive assistance, or a similar role is a plus."}, {"id": "26635", "title": "Paralegal – Litigation Department", "bhTitle": "Paralegal", "category": "Legal", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-14", "exp": "2026-11-16", "desc": "Location: Cedarhurst, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA sophisticated law firm in Cedarhurst, NY is seeking a highly organized and detail-oriented Paralegal to join its Litigation Department. This position offers the opportunity to work closely with attorneys on a variety of litigation matters while providing substantive legal, research, drafting, and case-management support.\n\nThe ideal candidate is professional, dependable, and capable of managing multiple priorities and deadlines in a fast-paced legal environment. This is an excellent opportunity to join a collaborative team and gain meaningful experience within a dynamic litigation practice.\n\nKey Responsibilities\n\n\tAssist attorneys with all phases of litigation and case management.\n\tReview case materials and prepare case summaries and reports for attorneys.\n\tConduct legal research and assist with investigating relevant facts and issues.\n\tSupport attorneys in developing case strategies and preparing matters for litigation.\n\tDraft and prepare legal documents, including pleadings, motions, discovery demands, and discovery responses.\n\tAssist with preparing contracts and other legal documentation as needed.\n\tReview and prepare deposition summaries and organize supporting materials.\n\tPrepare, organize, and file documents with courts and administrative agencies.\n\tTrack court deadlines, filing requirements, discovery obligations, and other important case dates.\n\tOrganize, maintain, and archive litigation files and supporting documentation.\n\tAssist with document production and discovery management.\n\tMaintain accurate electronic and physical case files.\n\tMonitor developments in laws, regulations, court rules, and legal procedures and provide relevant updates.\n\tAssist attorneys with trial preparation, including organizing exhibits, documents, and case materials.\n\tCoordinate with attorneys, clients, courts, opposing counsel, and other parties as needed.\n\tProvide additional litigation and administrative support to the legal team.\n\nQualifications\n\n\tBachelor's degree required.\n\t1–2 years of administrative, office support, legal, or related professional experience preferred.\n\tProficiency in Microsoft Word, Excel, and Outlook.\n\tStrong organizational and time-management skills.\n\tExceptional attention to detail and accuracy.\n\tStrong written and verbal communication skills.\n\tAbility to manage multiple cases, assignments, and deadlines simultaneously.\n\tStrong research, writing, and document-management abilities.\n\tAbility to handle confidential and sensitive information professionally.\n\tComfortable working independently while collaborating closely with attorneys and other team members.\n\tAbility to work effectively in a fast-paced legal environment.\n\tPrevious law firm or litigation experience is a plus."}, {"id": "26633", "title": "Paralegal", "bhTitle": "Paralegal", "category": "Legal", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-14", "exp": "2026-11-16", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA growing law firm in Brooklyn NY, is seeking a motivated and detail-oriented Paralegal or Title Coordinator to join its team. This position offers the opportunity to work on sophisticated transactions across real estate, corporate, healthcare, title, and business-related matters.\n\nThe firm is open to candidates at various experience levels and is looking for someone who is organized, professional, and eager to grow their career. A paralegal certificate is not required.\n\nKey Responsibilities\n\n\tAssist attorneys with real estate, corporate, healthcare, title, and business transactions.\n\tSupport transactional matters from initial documentation through closing and post-closing.\n\tPrepare, organize, review, and maintain legal and transaction-related documents.\n\tAssist with real estate and title-related documentation and coordination.\n\tTrack transaction deadlines, outstanding documents, approvals, and closing requirements.\n\tPrepare and maintain closing checklists and transaction files.\n\tCoordinate with attorneys, clients, title companies, lenders, counterparties, and other professionals.\n\tAssist with corporate documents, organizational records, agreements, and supporting materials.\n\tSupport due diligence and document review processes.\n\tFollow up with clients and outside parties regarding outstanding information and documentation.\n\tMaintain organized and accurate electronic and physical matter files.\n\tAssist with closing and post-closing documentation.\n\tManage multiple active transactions while maintaining accuracy and meeting deadlines.\n\tProvide additional legal and administrative support as needed.\n\nQualifications\n\n\tPrevious experience in real estate, title, corporate, healthcare, business transactions, or related legal work is helpful.\n\tParalegal, title coordination, legal assistant, or similar experience is preferred.\n\tStrong organizational and time-management abilities.\n\tExceptional attention to detail and accuracy.\n\tExcellent written and verbal communication skills.\n\tAbility to manage multiple transactions, deadlines, and priorities simultaneously.\n\tStrong follow-up and problem-solving skills.\n\tProfessional and comfortable communicating with attorneys, clients, and outside parties.\n\tAbility to work independently while collaborating effectively with attorneys and other team members.\n\tMotivated to learn and develop professionally within a sophisticated transactional practice.\n\tParalegal certificate is not required."}, {"id": "26632", "title": "Paralegal", "bhTitle": "Paralegal", "category": "Legal", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-08-14", "exp": "2026-11-16", "desc": "Location: Lakewood, NJ\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA growing law firm in Lakewood, NJ is seeking a motivated and detail-oriented Paralegal or Title Coordinator to join its team. This position offers the opportunity to work on sophisticated transactions across real estate, corporate, healthcare, title, and business-related matters.\n\nThe firm is open to candidates at various experience levels and is looking for someone who is organized, professional, and eager to grow their career. A paralegal certificate is not required.\n\nKey Responsibilities\n\n\tAssist attorneys with real estate, corporate, healthcare, title, and business transactions.\n\tSupport transactional matters from initial documentation through closing and post-closing.\n\tPrepare, organize, review, and maintain legal and transaction-related documents.\n\tAssist with real estate and title-related documentation and coordination.\n\tTrack transaction deadlines, outstanding documents, approvals, and closing requirements.\n\tPrepare and maintain closing checklists and transaction files.\n\tCoordinate with attorneys, clients, title companies, lenders, counterparties, and other professionals.\n\tAssist with corporate documents, organizational records, agreements, and supporting materials.\n\tSupport due diligence and document review processes.\n\tFollow up with clients and outside parties regarding outstanding information and documentation.\n\tMaintain organized and accurate electronic and physical matter files.\n\tAssist with closing and post-closing documentation.\n\tManage multiple active transactions while maintaining accuracy and meeting deadlines.\n\tProvide additional legal and administrative support as needed.\n\nQualifications\n\n\tPrevious experience in real estate, title, corporate, healthcare, business transactions, or related legal work is helpful.\n\tParalegal, title coordination, legal assistant, or similar experience is preferred.\n\tStrong organizational and time-management abilities.\n\tExceptional attention to detail and accuracy.\n\tExcellent written and verbal communication skills.\n\tAbility to manage multiple transactions, deadlines, and priorities simultaneously.\n\tStrong follow-up and problem-solving skills.\n\tProfessional and comfortable communicating with attorneys, clients, and outside parties.\n\tAbility to work independently while collaborating effectively with attorneys and other team members.\n\tMotivated to learn and develop professionally within a sophisticated transactional practice.\n\tParalegal certificate is not required."}, {"id": "26631", "title": "Paralegal", "bhTitle": "Paralegal", "category": "Legal", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-14", "exp": "2026-11-16", "desc": "Location: Cedarhurst, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA growing law firm in Cedarhurst, NY is seeking a motivated and detail-oriented Paralegal to join its transactional practice. This position offers the opportunity to work on sophisticated matters involving real estate, corporate, healthcare, title, and business transactions.\n\nThe firm is open to candidates at various experience levels. A formal paralegal certificate is not required. Candidates with experience as a paralegal, title coordinator, legal assistant, or in a related transactional role are encouraged to apply.\n\nThe ideal candidate is highly organized, professional, and capable of managing multiple transactions and deadlines in a collaborative, fast-paced legal environment.\n\nKey Responsibilities\n\n\tAssist attorneys with real estate, corporate, healthcare, title, and other business transactions.\n\tSupport transactions from initial documentation through closing and post-closing.\n\tPrepare, organize, review, and maintain transaction-related documents and files.\n\tAssist with real estate and title-related documentation and coordination.\n\tTrack transaction deadlines, outstanding documents, approvals, and closing requirements.\n\tCoordinate with attorneys, clients, title companies, lenders, counterparties, and other professionals.\n\tAssist with corporate documents, organizational records, agreements, and transaction materials.\n\tConduct document review and help ensure files are complete and accurate.\n\tPrepare closing checklists and assist with closing and post-closing documentation.\n\tMaintain organized electronic and physical matter files.\n\tFollow up with relevant parties regarding outstanding information and documentation.\n\tAssist attorneys with due diligence and transaction-related research.\n\tManage multiple active matters while maintaining accuracy and meeting deadlines.\n\tProvide additional legal and administrative support as needed.\n\nQualifications\n\n\tPrevious experience in real estate, title, corporate, healthcare, business transactions, or related legal work is helpful.\n\tCandidates with paralegal or title coordination experience are encouraged to apply.\n\tStrong organizational and time-management skills.\n\tExceptional attention to detail and accuracy.\n\tStrong written and verbal communication skills.\n\tAbility to manage multiple transactions, priorities, and deadlines simultaneously.\n\tProfessional and comfortable communicating with attorneys, clients, and outside parties.\n\tStrong follow-up and problem-solving skills.\n\tAbility to work independently while collaborating effectively with attorneys and other team members.\n\tComfortable working in a fast-paced professional environment.\n\tParalegal certificate is not required."}, {"id": "26630", "title": "Target Account Manager", "bhTitle": "Account Manager", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-13", "exp": "2026-11-12", "desc": "Location: New York, NY (Onsite 5 days)\nJob Type: Full-time\nSchedule: Monday - Friday\n\nNYC based CPG company in business for 80 years is seeking a results driven Target Account Manager. This role will own the Target relationship, drive sales and profitability, and partner cross functionally to execute successful product launches, promotions, and assortment strategies. The ideal candidate is a commercially minded, entrepreneurial account leader who combines strong retailer relationships with analytical rigor and a hands on approach to growing the business.\n\nKey Responsibilities:\n\n\tOwn the Target account strategy, sales plan, forecasts, and annual business goals.\n\n\tBuild strong relationships with Target buyers and internal stakeholders.\n\n\tIdentify opportunities to grow distribution, sales, market share, and profitability.\n\n\tLead product launches, assortment reviews, promotions, and retail programs.\n\n\tAnalyze sales, inventory, pricing, and market trends to develop actionable recommendations.\n\n\tPartner with Marketing, Supply Chain, Finance, and Product teams to ensure strong execution.\n\n\tPrepare and present compelling business reviews and sales presentations.\n\nQualifications:\n\n\t4 to 5+ years of account management or sales experience in CPG or consumer products.\n\n\tExperience working directly with Target strongly preferred.\n\n\tStrong analytical, negotiation, presentation, and relationship management skills.\n\n\tProven ability to manage multiple priorities in a fast paced environment.\n\n\tBachelor's degree preferred.\n\nWhat We Offer:\n\n\tHigh impact role with direct ownership over a major growth channel for an established industry leader.\n\n\tDirect exposure to senior leadership and key retail decision makers.\n\n\tAn entrepreneurial, collaborative, and fast paced NYC based work environment.\n\n\tOpportunities for career growth and professional development"}, {"id": "26628", "title": "Marketing Manager / Account Manager", "bhTitle": "Account Manager", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-08-13", "exp": "2026-11-13", "desc": "Location: Edison, NJ\nJob Type: Full-time\nSchedule: Monday - Friday\n\nEdison, NJ based Home Textiles company specializing in kitchen, tabletop, bedding, and bath is seeking a dynamic and client-focused Marketing Manager / Account Manager to serve as the primary liaison between the company and key client accounts. The ideal candidate will manage day-to-day client relationships, coordinate marketing initiatives, ensure flawless project execution, and drive account growth through exceptional service and strategic thinking.\n\nKey Responsibilities:\n\n\tServe as the primary point of contact for assigned client accounts.\n\n\tBuild and maintain strong client relationships through regular communication and proactive problem-solving.\n\n\tCoordinate client initiatives from concept through execution.\n\n\tManage project timelines, deliverables, and internal resources to ensure client satisfaction.\n\n\tIdentify opportunities to expand existing business and support new business development efforts.\n\n\tMonitor market trends, customer needs, and competitive activity.\n\nQualifications:\n\n\t4+ years of account management, client services, marketing, or related experience.\n\n\tStrong project management and organizational skills.\n\n\tExcellent written, verbal, and presentation skills.\n\n\tAbility to manage multiple priorities in a fast-paced environment.\n\n\tStrong analytical and problem-solving abilities.\n\n\tProficiency in Microsoft Office Suite.\n\n\tStrong relationship-building skills with a sense of urgency and accountability.\n\n\tDetail-oriented with excellent follow-through.\n\n\tAbility to work independently while collaborating effectively with team members.\n\nWhat We Offer:\n\n\tOpportunities for professional growth and career advancement.\n\n\tA collaborative, creative, and supportive team environment.\n\n\tGenerous paid time off and holiday package."}, {"id": "26626", "title": "Social Sales Manager", "bhTitle": "ECommerce Manager", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-13", "exp": "2026-11-05", "desc": "A New York City-based apparel company is seeking a Social Sales Manager to drive sales across social media platforms and help grow its online presence. This role is ideal for someone who is comfortable working in a fast-paced environment, understands social commerce, and is excited about fashion and e-commerce.\n\nResponsibilities:\n\n\tManage and drive sales through social media platforms, including Whatnot and TikTok\n\tEngage with customers and help build relationships through social platforms\n\tOversee day-to-day social selling activities and sales performance\n\tManage and develop the company's e-commerce website\n\tHelp reactivate and grow the online store\n\tIdentify opportunities to increase online sales and customer engagement\n\nSchedule: Monday–Friday, 9:00 AM–6:00 PM"}, {"id": "26625", "title": "Receptionist", "bhTitle": "Receptionist", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-13", "exp": "2026-11-13", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday, Tuesday, and Thursday – 9:00 AM–6:00 PM\n\nPosition Overview\n\nA professional office in Brooklyn, NY is seeking a friendly, dependable, and organized Receptionist to join its team. This individual will be responsible for managing front desk responsibilities, assisting with general office tasks, and helping ensure daily operations run smoothly.\n\nThe ideal candidate is personable, professional, and reliable with strong communication skills. Basic computer skills are preferred for assisting with office work, but they are not required, and the right candidate can be trained.\n\nKey Responsibilities\n\n\tGreet visitors and provide a welcoming and professional front desk experience.\n\tAnswer incoming phone calls and direct calls to the appropriate staff members.\n\tRespond to general inquiries and take accurate messages.\n\tAssist with scheduling and other basic administrative responsibilities.\n\tHandle incoming and outgoing correspondence.\n\tAssist with data entry, filing, scanning, copying, and document organization.\n\tMaintain an organized and professional reception and office area.\n\tProvide general administrative support to office staff.\n\tHelp organize paperwork, records, and other office materials.\n\tCommunicate professionally with clients, visitors, and team members.\n\tAssist with additional office and administrative tasks as needed.\n\nQualifications\n\n\tFriendly, professional, and personable demeanor.\n\tStrong communication and interpersonal skills.\n\tDependable, punctual, and responsible.\n\tGood organizational skills and attention to detail.\n\tAbility to multitask and manage routine office responsibilities.\n\tComfortable answering phones and interacting with visitors.\n\tBasic computer and office software skills are preferred but not mandatory.\n\tPrevious receptionist, administrative, or office experience is a plus but not required.\n\tWillingness to learn and assist wherever needed."}, {"id": "26623", "title": "Creative & Social Media Assistant", "bhTitle": "Creative & Social Media Assistant", "category": "E-commerce, Marketing & Social Media", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-08-13", "exp": "2026-11-19", "desc": "A growing wholesale business is seeking a creative and social media-savvy individual to assist with the creative and marketing side of the business. Responsibilities may include creating social media content, developing creative ideas, assisting with posts, and supporting day-to-day marketing initiatives.\n\nIdeal Candidate:\n\n\tCreative and organized\n\tSocial media savvy\n\tStrong communication skills\n\tInterested in fashion, marketing, or content creation\n\nSchedule: Part-time, flexible"}, {"id": "26622", "title": "Wholesale Sales Intern", "bhTitle": "Wholesale Intern", "category": "Sales & Live Selling", "type": "Internship", "typeNote": "", "state": "NY", "added": "2026-08-13", "exp": "2026-11-12", "desc": "A growing wholesale business is seeking motivated, outgoing college students/recent graduates to join the team and assist with customer outreach and sales. Interns will connect with potential customers, build relationships, and generate sales while earning high commissions.\n\nIdeal Candidate:\n\n\tMotivated, ambitious, and personable\n\tComfortable communicating with customers\n\tInterested in developing sales and business skills\n\tDriven by earning potential\n\nSchedule: Flexible hours\n\nntial"}, {"id": "26621", "title": "Account Support Specialist", "bhTitle": "Sales Assistant", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-13", "exp": "2026-11-13", "desc": "Location: Brooklyn, NY (In-Office)\nJob Type: Full-Time\nSchedule: Full-Time, In-Office\n\nWe are a growing B2B supplier and distributor specializing in poly packaging, expanding at roughly 30% per year across direct sales, ecommerce, and marketplace channels. We are a close-knit, collaborative team known for delivering high quality products and excellent customer satisfaction. As an Account Support Specialist, you will be a core part of our customer service delivery. Paired with a Senior Account Representative in a pod structure, you will own smaller accounts end to end while serving as the operational engine managing order processing, customer communications, and workflow execution. This role offers real ownership, direct relationship building, and strong team support in a fast-paced environment.\n\nKey Responsibilities:\n\n\tOwn a set of assigned B2B accounts and serve as their primary point of contact for day to day needs.\n\n\tHandle inbound inquiries and opportunities for your account base via phone and email with speed and professionalism.\n\n\tProcess and manage orders accurately while keeping customers informed at every step.\n\n\tConduct proactive outreach to existing customers to check in, confirm upcoming needs, flag reorder opportunities, and keep relationships warm.\n\n\tResolve product, order, or delivery issues by coordinating internally and communicating clearly with customers.\n\n\tProvide product knowledge and guidance to help customers make smart purchasing decisions.\n\n\tMaintain accurate records of customer interactions and order details in the CRM.\n\n\tCollaborate closely with your Senior Rep partner and internal teams to ensure smooth execution across service and delivery.\n\nQualifications:\n\n\tPrior experience in B2B customer service, account support, or a client-facing role.\n\n\tStrong communication skills, comfortable and confident on the phone as well as professional over email.\n\n\tExcellent attention to detail and organizational skills to ensure nothing falls through the cracks.\n\n\tA proactive mindset with the drive to follow up and stay on top of priorities independently.\n\n\tAbility to manage multiple accounts and prioritize effectively in a fast-moving environment.\n\n\tExperience using CRM or order management systems.\n\n\tAbility to work full-time in-office in Brooklyn, NY.\n\n\tFamiliarity with packaging supplies or a related product-based business is nice to have.\n\n\tTech-savvy orientation and ability to learn new tools and systems quickly.\n\nWhat We Offer:\n\n\tPaid time off for major holidays and standard holidays.\n\n\tOne week of paid vacation annually, accruing after the first six months.\n\n\tA supportive pod working structure paired with experienced senior account guidance.\n\n\tA collaborative culture built on core values of putting others first, taking ownership, staying adaptable, and expecting excellence."}, {"id": "26620", "title": "Administrative Assistant", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-13", "exp": "2026-11-13", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nAn early childhood school in Brooklyn, NY is seeking a dependable, organized, and personable Administrative Assistant to join its dedicated team. This individual will play a vital role in supporting the school's daily operations while providing exceptional service to staff, students, and families.\n\nThe ideal candidate is highly organized, detail-oriented, and comfortable managing multiple administrative responsibilities in a busy school environment. We are looking for someone who communicates professionally, takes initiative, and enjoys being part of a collaborative educational community.\n\nKey Responsibilities\n\n\tSupport the school's daily administrative and office operations.\n\tServe as a welcoming and professional point of contact for families, staff, and visitors.\n\tAssist with student enrollment, registration, and related administrative processes.\n\tMaintain accurate and organized student records and documentation.\n\tCommunicate with families regarding school information, schedules, documentation, and general inquiries.\n\tMaintain staff files, compliance records, and required documentation.\n\tEnsure records are accurate, organized, confidential, and up to date.\n\tCoordinate calendars, appointments, meetings, and school schedules.\n\tAssist with planning and coordinating school events, programs, and activities.\n\tAnswer phone calls, respond to emails, and handle general office correspondence.\n\tPrepare documents, reports, forms, and other administrative materials.\n\tAssist school leadership and staff with day-to-day administrative needs.\n\tMaintain organized digital and physical filing systems.\n\tFollow up on outstanding paperwork and documentation.\n\tHelp ensure smooth communication between administration, teachers, staff, and families.\n\tPerform additional administrative responsibilities as needed to support the school.\n\nQualifications\n\n\tHigh school diploma or equivalent required.\n\t2+ years of administrative, office, or related experience preferred.\n\tPrevious experience in a school, early childhood program, daycare, or educational environment is a plus.\n\tStrong organizational and time-management skills.\n\tExcellent attention to detail and follow-through.\n\tStrong written and verbal communication skills.\n\tProfessional, warm, and customer-service oriented.\n\tComfortable communicating with parents, staff, and school leadership.\n\tAbility to maintain confidential student and staff information.\n\tStrong computer skills and proficiency with general office software.\n\tAbility to manage multiple responsibilities and priorities in a fast-paced environment.\n\tDependable, responsible, and able to work effectively both independently and as part of a team."}, {"id": "26619", "title": "Production Assistant", "bhTitle": "Production Assistant", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-12", "exp": "2026-11-12", "desc": "Location: New York, NY\nJob Type: Full-Time\nSchedule: Monday – Friday\n\nWe are a growing New York City textile company looking for a detail-oriented, proactive Production Assistant to join our team. This role is ideal for a multi-tasker who thrives in a fast-paced fashion/textiles environment and excels at cross-functional communication.\n\nWorking alongside our Production Manager and Data Entry team, you will take direct ownership of pre-production processes while supporting daily operations across design, sales, and overseas factories.\n\nKey Responsibilities:\n\n\tRequest, track, and follow up on fabric and trim samples from factories and vendors to keep development timelines on schedule.\n\n\tRequest detailed costing information from production partners and maintain clean, organized cost sheets for internal review.\n\n\tServe as a daily liaison between Design, Sales, and overseas factories to ensure accurate information flow regarding garment/textile specs and development status.\n\n\tManage independent daily workflow tasks while assisting the Production Manager with pre-production milestones.\n\n\tMaintain physical and digital sample libraries, ensuring all swatches, lab dips, and approvals are organized and easily accessible.\n\n\tCollaborate with the Data Entry Clerk to ensure seamless transitions from development stage to active order creation.\n\nQualifications:\n\n\t1–3 years of experience in textile, apparel, or fashion production/development.\n\n\tStrong understanding of garment/textile development processes, sample tracking, and costing components.\n\n\tExceptional organizational skills with strict attention to detail.\n\n\tStrong verbal and written communication skills for clear daily interaction with domestic teams and international factories.\n\n\tProficiency in Microsoft Excel and general office software (PLM software experience is a plus).\n\n\tAbility to prioritize workload, multi-task, and problem-solve in a fast-moving environment.\n\nWhat We Offer:\n\n\tPaid time off and holiday coverage.\n\n\tCollaborative work environment with clear opportunities for professional growth in production management."}, {"id": "26618", "title": "Receptionist", "bhTitle": "Receptionist", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-12", "exp": "2026-11-23", "desc": "Position Type: Full-Time\nJob Hours: Monday–Friday, 9:00-5:30pm\n\nJob Description:\nWholesale apparel/fashion comany is seeking a professional, organized, and personable Receptionist to serve as the first point of contact for the company. The ideal candidate will have strong communication and organizational skills and be comfortable working in a fast-paced, professional environment.\n\nEssential Duties and Responsibilities:\n\n\tGreet and assist visitors in a professional and welcoming manner\n\tAnswer and direct incoming phone calls\n\tManage emails, messages, and general correspondence\n\tProvide administrative and clerical support to the office\n\tCoordinate appointments, meetings, and calendars as needed\n\tMaintain an organized and professional reception area\n\tAssist with filing, data entry, and other general office tasks\n\tCommunicate with internal teams, vendors, and visitors as needed\n\tHandle multiple priorities while maintaining a high level of professionalism\n\nSpecific Qualifications and/or Requirements:\n\n\tPrevious receptionist, administrative, or customer service experience preferred\n\tExcellent verbal and written communication skills\n\tProfessional, friendly, and personable demeanor\n\tStrong organizational and multitasking abilities\n\tProficiency with Microsoft Office and basic computer applications\n\tAbility to work independently and as part of a team\n\tStrong attention to detail and follow-through\n\tReliable, punctual, and professional\n\nAdditional Information:\nPrivately held company that manages a diversified portfolio of active, fashion, and lifestyle brands across apparel, home, beauty, electronics, and consumer products. The company works with leading licensing and operating partners worldwide to expand and maximize brand presence across retail and e-commerce channels."}, {"id": "26615", "title": "Medical Assistant", "bhTitle": "Medical Assistant", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-12", "exp": "2026-12-14", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Sundays: 11:00 AM–6:00 PM; Monday through Wednesday: 11:00 AM–9:00 PM\n\nPosition Overview\n\nA medical office in Brooklyn, NY is seeking a dependable, compassionate, and motivated Medical Assistant to join its Pediatrics Department. This is an excellent opportunity for someone who enjoys working with children and families and is interested in gaining hands-on experience in a professional healthcare environment.\n\nTraining will be provided for the right candidate, making this position a great opportunity for someone who is eager to learn, dependable, and interested in developing their skills in pediatric healthcare.\n\nKey Responsibilities\n\n\tAssist physicians and clinical staff with day-to-day pediatric patient care.\n\tWelcome children and their families and help create a comfortable, friendly environment.\n\tPrepare examination rooms before patient visits.\n\tEscort patients to examination rooms and assist with the intake process.\n\tObtain and document vital signs, height, weight, and other required patient information.\n\tPrepare supplies and equipment for examinations and routine procedures.\n\tAssist providers during examinations and procedures as directed.\n\tMaintain clean, organized, and properly stocked examination rooms.\n\tUpdate patient information and maintain accurate documentation.\n\tAssist with scheduling, patient communication, and general administrative responsibilities when needed.\n\tFollow established infection-control, safety, and patient confidentiality procedures.\n\tCommunicate professionally and compassionately with children, parents, guardians, and staff.\n\tSupport the clinical and administrative teams with additional responsibilities as needed."}, {"id": "26613", "title": "Production Assistant / Production Coordinator", "bhTitle": "Production Assistant", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-12", "exp": "2026-11-12", "desc": "Location: New York, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA growing apparel company in New York, NY is seeking a motivated, highly organized, and hands-on Production Assistant / Production Coordinator to join its team. This position plays an important role in supporting the apparel production process and ensuring products move efficiently from development through final production and delivery.\n\nThe ideal candidate has a strong understanding of all aspects of apparel production, excellent follow-up skills, and the ability to manage multiple projects simultaneously. We are looking for someone who takes ownership, communicates effectively, and is comfortable wearing many hats in a fast-paced environment.\n\nKey Responsibilities\n\n\tSupport and coordinate the apparel production process from development through final delivery.\n\tCommunicate and follow up regularly with factories, vendors, suppliers, and internal teams.\n\tTrack production schedules, samples, approvals, and delivery deadlines.\n\tMonitor production status and proactively follow up on outstanding items.\n\tCoordinate fabric, trims, colors, packaging, labels, and other production components.\n\tAssist with sample development and track fit samples, pre-production samples, and production approvals.\n\tReview production details to ensure specifications and requirements are being followed accurately.\n\tMaintain organized production calendars, tracking sheets, purchase orders, and related documentation.\n\tWork closely with design, sales, product development, sourcing, and production teams.\n\tCommunicate production updates, delays, and potential issues to the appropriate team members.\n\tHelp identify and resolve production issues to keep projects on schedule.\n\tCoordinate with factories and vendors regarding quantities, pricing, timelines, and shipment information.\n\tMaintain accurate product and production information across internal systems and spreadsheets.\n\tManage multiple styles, projects, and deadlines simultaneously.\n\tAssist with additional production and operational responsibilities as needed."}, {"id": "26612", "title": "Babysitter / Nanny", "bhTitle": "Babysitter/Nanny", "category": "Education & Childcare", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-08-12", "exp": "2026-11-12", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\nSchedule: Flexible / Occasional Hours\n\nPosition Overview\n\nA family in the Midwood area of Brooklyn is seeking a responsible, reliable, and caring Babysitter / Nanny to provide occasional care for their sweet 7-year-old daughter.\n\nThis is a great opportunity for a mature older high school student, college student, or other dependable individual who enjoys spending time with children and is looking for flexible, occasional babysitting hours.\n\nThe ideal candidate is warm, trustworthy, punctual, and able to keep a child engaged in a safe, positive, and fun environment.\n\nSchedule\n\nThis is an occasional, part-time position with hours that may include:\n\n\tFridays after school – Meet the child at the bus stop and stay with her at home for approximately one hour until the parents return from work.\n\tErev Yom Tov – Full-day coverage on certain days when school is closed.\n\tChol Hamoed – Occasional daytime babysitting as needed.\n\tAdditional occasional babysitting opportunities may be available based on the family's needs and the candidate's availability.\n\nResponsibilities\n\n\tMeet the child at the bus stop and safely accompany her home when scheduled.\n\tProvide attentive and responsible supervision.\n\tKeep the child engaged through age-appropriate activities, games, reading, crafts, and play.\n\tMaintain a safe, comfortable, and positive environment.\n\tFollow the family's routines and instructions.\n\tPrepare or provide simple snacks when needed.\n\tMaintain clear communication with parents regarding scheduling and any important updates.\n\tEnsure the child's safety and well-being at all times.\n\tProvide occasional full-day care when school is closed."}, {"id": "26611", "title": "Assistant", "bhTitle": "Assistant", "category": "Administrative & Office", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-08-11", "exp": "2026-11-30", "desc": "Part-time assistant.  Tech-savvy. Serious. Also will help post ads in print and online on Instagram.\nA real estate company is looking for a reliable, organized, and tech-savvy Personal Assistant to provide in-person administrative and personal support. The ideal candidate is efficient, comfortable managing multiple tasks, has strong phone skills, and is familiar with Instagram and basic graphic design/Canva.\nJob Hours:\nMonday–Thursday, approximately 4 hours per day. Schedule options include 11:00 AM–3:00 PM, 12:00–4:00 PM, or 1:00–5:00 PM. Candidate must be available at least Monday–Wednesday. This is an in-person position; remote work is not available.\n\nEssential Duties and Responsibilities:\n\n\tProvide day-to-day administrative and personal assistance\n\tManage multiple tasks and priorities efficiently\n\tAnswer and make phone calls professionally\n\tAssist with scheduling, organization, and general coordination\n\tAssist with Instagram and social media tasks\n\tCreate and edit basic graphics and social media content using Canva\n\tProvide general administrative support as needed\n\nSpecific Qualifications and/or Requirements:\n\n\tHighly organized, reliable, and efficient\n\tStrong multitasking and time-management skills\n\tExcellent phone and communication skills\n\tTech-savvy and comfortable learning new tools\n\tComfortable using Instagram and social media\n\tBasic graphic design skills and Canva knowledge\n\tMust be comfortable working in person\n\tAble to work independently and take initiative\n\tMust be available at least Monday–Wednesday\n\nAdditional Information:\n\n\tLong-term opportunity\n\tPart-time position\n\tImmediate start available\n\tIn-person position only; no remote option\n\tFlexible scheduling within the available time slots"}, {"id": "26610", "title": "Live Streamer Sales Assistant", "bhTitle": "livestream sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-11", "exp": "2026-11-11", "desc": "Location: Brooklyn Army Terminal (On-site)\nJob Type: Full-time\nSchedule: Regular business hours / Shift-based (Must align with live streaming schedule)\n\nWe are a fast-growing jewelry retailer located in the Brooklyn Army Terminal, specializing in fashion-forward to mid-level timepieces and brand name jewelry. We are seeking a organized, tech-savvy, and proactive Live Stream Sales Assistant to support our on-camera hosts and keep our digital broadcasts running seamlessly. In this role, you will work behind the scenes to manage live product staging, track real-time inventory, moderate live viewer chats, and ensure every live stream runs without a hitch.\n\nKey Responsibilities:\n\n\tAssist the Live Stream Host before, during, and after broadcasts to ensure smooth studio operations.\n\n\tPrepare, clean, tag, and display featured watches and brand name jewelry prior to going live.\n\n\tHand off products, display stands, and promotional materials to the host in real time during the stream.\n\n\tMonitor and moderate live chat rooms, answering customer inquiries, pinning key product details, and driving engagement.\n\n\tManage real-time inventory tracking and claim logs as sales are completed on-air.\n\n\tSet up and maintain studio equipment, including lighting, smartphones, cameras, microphoning, and internet connections.\n\n\tPackage, organize, and transition sold items to the fulfillment team post-stream.\n\nQualifications:\n\n\tPrior experience in retail support, studio production, live stream moderation, or e-commerce operations preferred.\n\n\tStrong organizational skills with high attention to detail and ability to multitask in a fast-paced environment.\n\n\tComfortable working with basic studio technology, social media platforms, and e-commerce selling software.\n\n\tAppreciation for or familiarity with fashion accessories, timepieces, and jewelry.\n\n\tStrong communication skills and a team-first, proactive attitude.\n\nWhat We Offer:\n\n\tHands-on experience in the rapidly growing field of live stream e-commerce.\n\n\tA collaborative, creative studio work environment at the iconic Brooklyn Army Terminal.\n\n\tOpportunities for career growth in studio management, digital marketing, or retail operations."}, {"id": "26609", "title": "Live Stream Sales Specialist", "bhTitle": "livestream sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-11", "exp": "2026-11-10", "desc": "Location: Brooklyn Army Terminal (On-site)\nJob Type: Full-time\nSchedule: Regular business hours / Shift-based (Must be flexible for scheduled live events)\n\nWe are a dynamic jewelry retailer based in the vibrant Brooklyn Army Terminal, specializing in fashion-forward to mid-level timepieces and brand name jewelry. We are seeking an energetic, engaging, and sales-driven Live Stream Sales Specialist to serve as the face of our brand across our digital platforms. In this role, you will showcase our luxury and fashion products, interact with a live audience in real time, and convert viewers into loyal customers through authentic, entertaining, and informative presentations.\n\nKey Responsibilities:\n\n\tHost engaging live stream sales events across social media and specialized e-commerce platforms.\n\n\tPresent, demonstrate, and highlight features of fashion timepieces, mid-level watches, and brand name jewelry.\n\n\tInteract directly with online viewers, answering product questions and creating an interactive, high-energy shopping experience.\n\n\tDrive real-time sales and meet hourly and monthly sales targets.\n\n\tCollaborate with the marketing and inventory teams to plan featured product lineups, promotions, and show scripts.\n\n\tAssist with setting up the live stream studio, managing lighting and audio equipment, and displaying inventory professionally.\n\nQualifications:\n\n\tPrior experience in live stream hosting, retail sales, broadcast media, or video content creation.\n\n\tStrong interest in or working knowledge of fashion, mid-level watches, and brand name jewelry.\n\n\tExceptional on-camera presence, high energy, and articulate communication skills.\n\n\tAbility to improvise, think on your feet, and maintain enthusiasm throughout live broadcasts.\n\n\tStrong sales acumen with a proven track record of closing sales or driving customer engagement.\n\nWhat We Offer:\n\n\tFull-time, stable hours within a creative studio environment at the Brooklyn Army Terminal.\n\n\tAccess to high-demand, trendy product lines in fashion timepieces and fine jewelry.\n\n\tA collaborative work culture with room for professional growth in the digital commerce space."}, {"id": "26608", "title": "Director of Development", "bhTitle": "Director of Development", "category": "HR, Management & Fundraising", "type": "Remote / Hybrid", "typeNote": "Remote/Hybrid/PT", "state": "NY", "added": "2026-08-11", "exp": "2026-11-11", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time (Remote Option Available)\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA community school in Brooklyn, NY is seeking an experienced, strategic, and relationship-driven Director of Development to lead and expand its fundraising and development efforts.\n\nThe Director of Development will oversee the school's overall fundraising strategy, donor cultivation and stewardship, campaigns, and high-impact events. This individual will play a key leadership role in strengthening relationships with current supporters, identifying new donors, and developing creative initiatives that increase philanthropic support for the school.\n\nThe ideal candidate is a strong fundraiser and relationship builder who can combine high-level strategy with hands-on execution. This role offers the flexibility to work remotely while maintaining an active presence for donor meetings, fundraising events, and other in-person initiatives as needed.\n\nKey Responsibilities\n\nFundraising Strategy & Leadership\n\n\tDevelop and execute a comprehensive annual and long-term fundraising strategy.\n\tEstablish fundraising goals, priorities, timelines, and measurable performance targets.\n\tIdentify opportunities to expand and diversify the school's donor base.\n\tDevelop strategies to increase annual giving and strengthen long-term donor relationships.\n\tWork closely with school leadership to align development initiatives with organizational priorities.\n\tMonitor fundraising performance and provide regular updates to leadership.\n\nDonor Cultivation & Stewardship\n\n\tBuild and maintain strong relationships with current and prospective donors.\n\tIdentify, cultivate, solicit, and steward major gift prospects.\n\tDevelop personalized donor engagement and solicitation strategies.\n\tConduct donor meetings and maintain consistent follow-up with supporters.\n\tIdentify opportunities to upgrade existing donors and increase overall giving.\n\tCreate meaningful stewardship initiatives that keep donors connected to the school's mission and impact.\n\tMaintain accurate donor records, communications, and follow-up activity.\n\nCampaigns & Development Initiatives\n\n\tLead fundraising campaigns across digital, direct outreach, and in-person channels.\n\tDevelop compelling fundraising messaging and donor communications.\n\tCoordinate campaign strategy, timelines, solicitation efforts, and follow-up.\n\tOversee fundraising journals, sponsorship opportunities, donor recognition, and related initiatives.\n\tCollaborate with marketing and communications resources to strengthen fundraising campaigns.\n\tTrack campaign results and identify opportunities to improve donor participation and revenue.\n\nFundraising Events\n\n\tPlan and execute high-impact fundraising and donor engagement events.\n\tLead parlor meetings, fundraising events, donor gatherings, journal campaigns, and other development initiatives.\n\tDevelop sponsorship packages and identify potential event sponsors.\n\tCoordinate invitations, donor outreach, event logistics, and post-event follow-up.\n\tWork with vendors, volunteers, school leadership, and community stakeholders to ensure successful events.\n\tUse events strategically to cultivate prospective donors and deepen existing relationships.\n\nCommunity & Relationship Development\n\n\tServe as a professional representative of the school within the community.\n\tDevelop relationships with community leaders, families, supporters, foundations, and prospective donors.\n\tIdentify new partnerships and fundraising opportunities.\n\tEngage key stakeholders in advancing the school's fundraising goals.\n\tBuild a strong culture of philanthropy and community involvement around the school."}, {"id": "26607", "title": "Patient Coordinator", "bhTitle": "Patient Coordinator", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-11", "exp": "2026-11-11", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nA therapy and healthcare practice in Brook
