 with direct responsibility for influencer, creator, ambassador, or community marketing programs.\n\n\tDemonstrated experience developing or growing successful creator or influencer marketing initiatives.\n\n\tStrong understanding of digital marketing, customer acquisition, and campaign performance.\n\n\tExperience managing influencer partnerships, campaign budgets, and marketing deliverables.\n\n\tConfident and engaging on-camera presence, with the ability to host live selling events and explain products effectively.\n\n\tFamiliarity with social media platforms, including Instagram, Facebook, YouTube, and TikTok.\n\n\tStrong understanding of e-commerce marketing and the relationship between content, engagement, and sales.\n\n\tExperience managing freelancers, agencies, vendors, or creative production teams.\n\n\tExcellent written and verbal communication skills.\n\n\tStrong organizational, project-management, and time-management abilities.\n\n\tAnalytical mindset with the ability to interpret marketing data and make strategic recommendations.\n\n\tSelf-motivated, proactive, and comfortable taking ownership of marketing initiatives.\n\n\tAbility to collaborate closely with senior leadership and cross-functional teams.\n\n\tGenuine interest in outdoor activities, apparel, and outdoor lifestyle culture.\n\n\tAbility to work on-site in Brooklyn five days per week."}, {"id": "26944", "title": "Receptionist / Administrative Assistant", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-27", "exp": "2027-01-26", "desc": "Location: Colts Neck, NJ\nJob Type: Full-Time\nSchedule: In-Office, Full-Time with Early Fridays\n\nTele-sales office is looking for candidates to fill the role of a Receptionist / Administrative Assistant to join our team in Colts Neck, NJ. In this full time, in-office role, you will serve as the first point of contact for our business, handling front desk operations, essential data entry, and proactive customer document collection.\n\nKey Responsibilities:\n\n\tGreet visitors and manage incoming calls professionally.\n\n\tPerform daily data input and maintain accurate office records.\n\n\tCoordinate with customers to request, collect, and organize necessary documentation.\n\n\tTrack document collection progress to help meet team and bonus milestones.\n\n\tHandle general administrative and receptionist duties as assigned.\n\nQualifications:\n\n\tStrong organizational and communication skills.\n\n\tProficient in basic computer tasks and data entry.\n\n\tReliable, professional, and customer-oriented.\n\n\tPrior receptionist or administrative experience is a plus.\n\nWhat We Offer:\n\n\tAttractive bonus structure tied to document collection performance.\n\n\tStandard full-time schedule with early Fridays."}, {"id": "26943", "title": "Sourcing & Product Development Specialist", "bhTitle": "Product Development", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-27", "exp": "2027-01-04", "desc": "A wholesale home décor and electronics company in downtown Manhattan is seeking an experienced Hardlines Sourcing & Product Development Specialist. The ideal candidate will have experience sourcing products from Asia, negotiating costs, developing new products, and coordinating with overseas suppliers to meet retailer requirements.\n\nEssential Duties & Responsibilities\n\n\tWork with production and sourcing managers to expand product categories and assortments.\n\n\tResearch retail trends, conduct market analysis, and negotiate product costs.\n\n\tCollaborate with sales teams to identify buyer needs and product trends.\n\n\tAssist the design team with packaging details, product features, and dielines.\n\n\tCommunicate regularly with overseas offices and suppliers, particularly in China.\n\n\tCoordinate special customer orders and communicate specific requirements to factories.\n\n\tEnsure suppliers meet product quality and safety standards required by major retailers.\n\n\tIdentify and develop relationships with new suppliers and manufacturers.\n\n\tSource new products and categories to meet retailer needs.\n\n\tReview vendor packaging and compliance requirements and communicate specifications to factories.\n\n\tCoordinate product development and manufacturing timelines to support on-time production and delivery.\n\nQualifications & Requirements\n\n\tMinimum of 3–5 years of experience in a hardlines wholesale or import company.\n\n\tMinimum of 3–5 years of experience sourcing hardlines products from China.\n\n\tExperience working with overseas suppliers and manufacturing offices in Asia.\n\n\tStrong knowledge of product development, sourcing, cost negotiation, and manufacturing processes.\n\n\tProficiency in Microsoft Office.\n\n\tExcellent organizational, time-management, and prioritization skills.\n\n\tStrong communication and interpersonal skills.\n\n\tAbility to collaborate effectively with sales, production, and design teams.\n\n\tUnderstanding of the manufacturing cycle, from product development through final delivery.\n\nAdditional Information\n\nThis is an opportunity to join a growing product development and sourcing team working with major retailers throughout the United States and Canada. The role offers exposure to a broad range of home décor, electronics, and other hardlines product categories."}, {"id": "26939", "title": "Accounting & Administrative Assistant", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-26", "exp": "2027-01-26", "desc": "Location: In-Office\nJob Type: Full-Time\nSchedule: Regular business hours\n\nWe are seeking a reliable, organized, and detail-oriented Accounting & Administrative Assistant to join our growing team! This position involves working closely with management to assist with daily accounting-related tasks, administrative responsibilities, order coordination, and logistics. We are looking for someone who is sharp, efficient, comfortable working with numbers, and capable of managing multiple tasks in a busy office environment. This is an excellent opportunity for an experienced individual seeking a stable, long-term position with a great team and room for professional growth.\n\nKey Responsibilities:\n\n\tAssist with preparing, reviewing, and organizing invoices and payment records.\n\n\tPerform daily data entry and maintain accurate business records.\n\n\tAssist with accounts payable and receivable documentation.\n\n\tTrack payments, invoices, and outstanding balances.\n\n\tCoordinate order routing, shipping, and logistics-related tasks.\n\n\tCommunicate with vendors, suppliers, and shipping companies as needed.\n\n\tMaintain and update spreadsheets, reports, and internal records.\n\n\tAssist with purchase orders, shipment tracking, and delivery coordination.\n\n\tOrganize and maintain electronic and physical filing systems.\n\n\tProvide general administrative support to management.\n\n\tFollow up on outstanding tasks and help ensure daily operations run smoothly.\n\nQualifications:\n\n\tMinimum 2 years of previous office or administrative experience required.\n\n\tExperience with invoicing, data entry, or basic accounting-related tasks preferred.\n\n\tProficiency in Microsoft Excel, Outlook, and general computer applications.\n\n\tStrong attention to detail and accuracy when working with numbers.\n\n\tExcellent organizational and time-management skills.\n\n\tAbility to multitask, prioritize responsibilities, and meet deadlines.\n\n\tDependable, responsible, and able to work independently with minimal supervision.\n\n\tStrong communication and problem-solving skills.\n\n\tPositive attitude, professional demeanor, and team-oriented mindset.\n\n\tExperience in wholesale, distribution, e-commerce, or logistics is a plus.\n\nWhat We Offer:\n\n\tDaily carpool is available from Brooklyn\n\tA fantastic office environment with a friendly, supportive team.\n\n\tLong-term stability and valuable hands-on experience in a growing company.\n\n\tOpportunities to take on additional responsibilities and build your career as the company continues to grow."}, {"id": "26938", "title": "Live Stream Host / E-Commerce Presenter", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-23", "exp": "2027-01-22", "desc": "Location: Monmouth County, New Jersey / Remote\nJob Type: Full-Time / Part-Time\nSchedule: 3 to 5 hours per streaming shift\nWe are a wholesale electronics company specializing in top-tier technology, including Apple iPhones, MacBooks, iPads, smartwatches, and more, with all of our live auctions starting at just $1. We are looking for a fun, energetic, and outgoing personality to host live shopping streams on TikTok and other live-commerce platforms. No influencer experience is required; we are looking for someone comfortable on camera who enjoys talking with people and keeping broadcasts entertaining and engaging.\nKey Responsibilities:\n\n\tHost live shopping streams for 3 to 5 hours per day, engaging viewers, demonstrating products, and driving sales during live broadcasts.\n\tInteract with viewers, answer real-time questions, and communicate key product selling points with high energy and enthusiasm.\n\tMaintain a fun, welcoming live stream environment and learn product details thoroughly.\n\tCollaborate with the team to analyze and improve stream performance and sales conversion.\n\nQualifications:\n\n\tOutgoing, confident, and energetic personality with the ability to think quickly and engage a live audience.\n\tComfortable speaking on camera for extended periods with strong communication and interpersonal skills.\n\tPrior experience in sales, retail, customer service, acting, hosting, or public speaking is a plus.\n\tFamiliarity with TikTok, Instagram, Whatnot, or other livestream platforms is a bonus but not required.\n\nWhat We Offer:\n\n\tEmployee discount and flexible schedule.\n\tComprehensive health insurance and paid time off.\n\tProfessional development assistance and referral program."}, {"id": "26937", "title": "Administrative Assistant & Social Media Coordinator", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Full or Part Time", "typeNote": "", "state": "NJ", "added": "2026-10-23", "exp": "2027-01-22", "desc": "Location: Monmouth County, New Jersey (New office expansion)\nJob Type: Full-Time\nSchedule: Monday through Friday, standard business hours\nWe are a growing construction development and property management firm expanding our operations into a brand-new regional office in Monmouth County, New Jersey. We are seeking a highly organized, tech-savvy Administrative Assistant to keep our office running smoothly while also taking charge of our digital presence and social media channels.\nIn this multifaceted role, you will be the backbone of our daily office operations—handling documentation, scheduling, vendor communication, and client inquiries—while also capturing and promoting our projects online to help drive our local brand growth.\nKey Responsibilities:\n\n\tManage general office operations for our new Monmouth County branch, including answering phones, greeting visitors, managing correspondence, and ordering office supplies.\n\tHandle administrative support tasks for construction and property management projects, such as preparing contracts, organizing project files, tracking insurance certificates, and processing vendor invoices.\n\tAssist with scheduling appointments, coordinating site visits, and maintaining executive and project calendars.\n\tPlan, create, and schedule engaging social media content across platforms like Instagram, LinkedIn, and Facebook to showcase our active construction sites, completed developments, and property management services.\n\tCapture photo and video content of ongoing projects, team milestones, and property transformations to build our brand identity and community engagement.\n\tMonitor online reviews, respond to digital inquiries, and help execute local marketing and outreach initiatives to support our regional office launch.\n\nQualifications:\n\n\tProven experience working in an administrative, office management, or coordination role, preferably within the construction, real estate, or property management sectors.\n\tDemonstrated proficiency in managing active social media accounts and creating basic digital content for business growth.\n\tStrong organizational skills with exceptional attention to detail and the ability to manage multiple priorities in a fast-paced environment.\n\tProficiency in modern office software, including Microsoft Office suite, Google Workspace, and basic graphic design or social media management tools (such as Canva).\n\tExcellent written and verbal communication skills with a professional, customer-first demeanor.\n\tReliable transportation for local errands or occasional visits to active job sites for content capture.\n\nWhat We Offer:\n\n\tAn exciting opportunity to join a growing regional office from the ground floor and help shape its local brand identity.\n\tA collaborative and dynamic work environment that values initiative and creativity.\n\tOpportunities for career growth as our Monmouth County operations continue to expand."}, {"id": "26936", "title": "Business Development & Project Manager (Construction & Property Management)", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-23", "exp": "2027-01-22", "desc": "Location: Monmouth County, New Jersey (New office expansion)\nJob Type: Full-Time\nSchedule: Monday through Friday, standard business hours\n\nWe are a rapidly expanding construction development and property management firm currently scaling our footprint across New York and New Jersey. We are seeking a dynamic, results-driven professional to spearhead the launch and growth of our new Monmouth County, New Jersey office.\nThis hybrid role requires a high-energy individual who can seamlessly bridge the gap between business development and operational execution. You will act as the face of our company in the local market, driving revenue growth through strategic sales and relationship-building while simultaneously overseeing project coordination, scheduling, and on-site team management.\nKey Responsibilities:\n\n\tDrive new business growth across Monmouth County and surrounding New Jersey regions by executing proactive outbound prospecting, warm and cold calling, and strategic networking with property owners, real estate developers, and commercial clients.\n\tManage the full sales lifecycle from initial outreach and client consultations to proposal generation, contract negotiation, and close.\n\tServe as the primary liaison between clients, field crews, subcontractors, and management, ensuring clear communication and alignment from project inception to completion.\n\tCoordinate project schedules, material deliveries, and on-site construction teams to ensure projects are completed on time, within scope, and to the highest quality standards.\n\tMaintain meticulous oversight of daily job site operations, safety compliance, and quality control protocols.\n\tCollaborate with executive leadership to establish regional sales targets, operational milestones, and growth strategies for the new Monmouth County branch.\n\nQualifications:\n\n\tProven professional experience in a combined sales, business development, and construction project management capacity.\n\tDeep familiarity with the Monmouth County and New Jersey real estate, construction, or property management markets.\n\tDemonstrated track record of success in outbound sales, cold and warm calling, and client acquisition.\n\tStrong working knowledge of construction sequencing, scheduling, subcontractor management, and site logistics.\n\tExceptional communication, negotiation, and interpersonal skills with the ability to build rapport with clients and lead field teams effectively.\n\tValid driver's license and reliable transportation for regular travel between client meetings and job sites across the region.\n\nWhat We Offer:\n\n\tThe unique ground-floor opportunity to lead and shape a brand-new regional office expansion in Monmouth County.\n\tComprehensive professional growth and leadership development within an established, multi-state construction and property management organization.\n\tA collaborative, fast-paced work environment that rewards initiative, autonomy, and results."}, {"id": "26935", "title": "Administrative Assistant", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-23", "exp": "2027-01-25", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time, On-Site\n\nPosition Overview\n\nAn established school and clinical services organization in Brooklyn is seeking a highly organized, detail-oriented, and dependable Administrative Assistant to support daily administrative operations.\n\nThe ideal candidate is a professional, compassionate, and efficient individual who enjoys working in a collaborative environment and communicating with families, educators, therapists, and healthcare professionals.\n\nThis position involves coordinating appointments, managing schedules, maintaining accurate records, assisting families and staff, and ensuring the smooth operation of school and clinical services.\n\nThis is an excellent opportunity for someone seeking a stable, full-time position within a supportive educational and healthcare-related environment.\n\nKey Responsibilities\n\nAdministrative & Office Support\n\n\tProvide daily administrative assistance to school and clinical staff.\n\n\tAnswer incoming phone calls, respond to emails, and greet visitors professionally.\n\n\tManage general office correspondence and direct inquiries to the appropriate departments.\n\n\tPerform accurate data entry and maintain organized business and student records.\n\n\tPrepare, review, and organize documents, reports, and administrative materials.\n\n\tMaintain electronic and physical filing systems.\n\n\tAssist with general office coordination and administrative projects.\n\n\tSupport efficient daily operations and maintain a welcoming, professional office environment.\n\nScheduling & Appointment Coordination\n\n\tCoordinate appointments for families, students, staff, and service providers.\n\n\tManage calendars and assist with daily scheduling requirements.\n\n\tCommunicate appointment details, schedule changes, and updates to relevant parties.\n\n\tAssist with coordinating meetings and service-related appointments.\n\n\tMaintain accurate scheduling records and follow up on outstanding appointments.\n\n\tHelp resolve scheduling conflicts and ensure smooth communication between departments.\n\nFamily, Staff & Provider Communication\n\n\tServe as a professional and welcoming point of contact for families, visitors, and service providers.\n\n\tRespond to inquiries and provide courteous, helpful customer service.\n\n\tCommunicate with teachers, therapists, healthcare professionals, and administrative staff.\n\n\tCoordinate with external providers regarding scheduling and administrative matters.\n\n\tAssist families with general questions, documentation, and office procedures.\n\n\tMaintain positive and professional relationships with staff, families, and visitors.\n\n\tEnsure timely communication and follow-up on administrative requests.\n\nRecords Management & Confidentiality\n\n\tMaintain accurate student, family, and service-related records.\n\n\tOrganize and update documentation in accordance with established office procedures.\n\n\tEnsure accurate data entry and proper recordkeeping.\n\n\tHandle confidential student, medical, and family information with professionalism and discretion.\n\n\tFollow applicable privacy policies and confidentiality requirements.\n\n\tAssist with maintaining organized documentation for administrative and operational purposes.\n\n\tIdentify and correct recordkeeping discrepancies as needed.\n\nQualifications\n\n\tHigh school diploma or equivalent required.\n\n\tPrevious administrative or office experience preferred.\n\n\tExperience in healthcare, education, clinical services, or a related administrative setting is a strong plus.\n\n\tStrong organizational, time-management, and multitasking abilities.\n\n\tExcellent verbal and written communication skills.\n\n\tProfessional and friendly customer service skills.\n\n\tProficiency in data entry, filing, document preparation, and records management.\n\n\tStrong computer skills and ability to learn administrative software systems.\n\n\tAccurate typing skills and exceptional attention to detail.\n\n\tAbility to manage multiple responsibilities and adapt to changing priorities.\n\n\tDependable, punctual, and capable of working independently.\n\n\tStrong interpersonal skills and ability to collaborate with multidisciplinary teams.\n\n\tProfessionalism, discretion, and ability to maintain confidentiality.\n\n\tPatient, compassionate, and comfortable communicating with families and service providers."}, {"id": "26934", "title": "Sales Assistant", "bhTitle": "Sales Assistant", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-22", "exp": "2027-01-11", "desc": "2 roles available\n\nConsumer electronics/fashion accessories wholesaler is looking for two experienced and organized Sales Assistants to support the VP of Sales and an Account Executive. The ideal candidates will have strong administrative skills, attention to detail, and experience supporting a sales team.\n\nEssential Duties & Responsibilities\n\n\tAssist the VP of Sales and Account Executive with day-to-day tasks.\n\n\tPrepare and update spreadsheets and sales reports.\n\n\tHelp create and process customer orders.\n\n\tPrepare sales presentations and organize samples.\n\n\tAttend sales meetings and assist with follow-up tasks.\n\n\tCommunicate with overseas suppliers and follow up on outstanding items.\n\n\tProvide general administrative support to the sales team.\n\nQualifications & Requirements\n\n\tPrevious experience in a sales support or sales assistant role REQUIRED - do not send if they do not have prior experience\n\n\tStrong spreadsheet and computer skills.\n\n\tExcellent organizational skills and attention to detail.\n\n\tStrong communication and follow-up skills.\n\n\tAbility to multitask and work in a fast-paced environment.\n\n\tExperience coordinating orders and communicating with suppliers is a plus.\n\nBased on experience."}, {"id": "26929", "title": "Assistant Teacher – Lower School", "bhTitle": "Teacher Assistant", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-22", "exp": "2027-01-25", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\n\nPosition Overview\n\nAn established private school in Brooklyn is seeking a motivated, compassionate, and dedicated Assistant Teacher to join its Lower School team.\n\nThe school's Lower School program focuses on inspiring a love of learning, encouraging curiosity, and supporting the academic, social, and emotional development of young students.\n\nThe ideal candidate is patient, enthusiastic, and passionate about education, with a strong desire to help students succeed in a positive and supportive classroom environment.\n\nThis position involves working closely with the lead classroom teacher to implement engaging lessons, provide individualized student support, and maintain an organized and inclusive learning environment.\n\nKey Responsibilities\n\nClassroom & Instructional Support\n\n\tAssist the lead teacher with daily classroom instruction and educational activities.\n\n\tSupport the implementation of lesson plans and learning objectives.\n\n\tWork with individual students and small groups to reinforce classroom lessons.\n\n\tHelp students understand assignments and complete educational activities.\n\n\tPrepare classroom materials, instructional resources, and learning activities.\n\n\tProvide additional academic support to students who need individualized attention.\n\n\tEncourage student participation, curiosity, and engagement in classroom activities.\n\n\tCollaborate with the lead teacher to support effective instructional strategies.\n\nStudent Development & Support\n\n\tSupport students' academic, social, and emotional development.\n\n\tEncourage positive classroom behavior and respectful interactions.\n\n\tHelp students develop independence, confidence, and strong learning habits.\n\n\tProvide patient and individualized assistance based on students' needs.\n\n\tReinforce classroom expectations and positive behavior.\n\n\tAssist students with transitions between activities and daily routines.\n\n\tFoster an inclusive, nurturing, and supportive classroom atmosphere.\n\n\tHelp students build communication, collaboration, and problem-solving skills.\n\nClassroom Management & Organization\n\n\tAssist with maintaining a structured, organized, and positive classroom environment.\n\n\tSupport the lead teacher with classroom management and student supervision.\n\n\tHelp prepare and organize classroom supplies, materials, and learning spaces.\n\n\tSupervise students during classroom activities and designated transitions.\n\n\tAssist with maintaining classroom routines and daily schedules.\n\n\tHelp ensure students remain engaged, focused, and supported throughout the school day.\n\n\tSupport classroom safety and follow established school procedures.\n\nTeacher & School Collaboration\n\n\tWork closely with the lead teacher and Lower School staff.\n\n\tCommunicate observations regarding student progress and classroom needs.\n\n\tParticipate in planning and coordinating classroom activities as directed.\n\n\tSupport school programs, educational initiatives, and classroom projects.\n\n\tFollow guidance from the lead teacher and Lower School Director.\n\n\tMaintain professionalism and confidentiality when working with students and families.\n\n\tContribute to a collaborative and supportive educational environment.\n\nQualifications\n\n\tPrevious experience working with children in a classroom, school, or educational setting preferred.\n\n\tStrong interest in elementary education and child development.\n\n\tPatient, compassionate, and enthusiastic approach to working with young learners.\n\n\tExcellent communication and interpersonal skills.\n\n\tStrong organizational abilities and attention to detail.\n\n\tAbility to work collaboratively with teachers and school administrators.\n\n\tPositive attitude and willingness to take initiative.\n\n\tAbility to provide individualized support to students with different learning needs.\n\n\tStrong classroom management and student engagement skills.\n\n\tDependable, responsible, and professional.\n\n\tAbility to follow instructions and adapt to classroom needs.\n\n\tPassion for creating a positive and encouraging learning environment."}, {"id": "26926", "title": "Sales & Merchandising Specialist – Apparel", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-10-22", "exp": "2027-01-25", "desc": "Industry: Apparel / Fashion\nEmployment Type: To Be Determined\n\nPosition Overview\n\nAn established apparel company is seeking a highly motivated, results-driven, and organized Sales & Merchandising Specialist to develop customer relationships, merchandise apparel collections, and drive sales growth.\n\nThe ideal candidate is an ambitious self-starter with strong sales instincts, excellent communication skills, and a keen eye for product presentation.\n\nThis position combines sales, account management, and apparel merchandising, making it an excellent opportunity for someone who enjoys working with customers, presenting merchandise, and identifying new business opportunities.\n\nThe company is looking for an individual who is proactive, persistent, and capable of taking ownership of customer relationships while contributing to overall business growth.\n\nKey Responsibilities\n\nSales & Business Development\n\n\tIdentify and pursue new business opportunities within the apparel industry.\n\n\tDevelop and grow a portfolio of customers through proactive outreach and relationship building.\n\n\tPresent apparel collections and product offerings to prospective and existing customers.\n\n\tBuild and maintain strong relationships with customers and retail buyers.\n\n\tUnderstand customer needs and recommend appropriate products and merchandise.\n\n\tFollow up consistently on sales opportunities, customer inquiries, and outstanding orders.\n\n\tNegotiate product selections and pricing in coordination with management.\n\n\tIdentify opportunities to increase sales volume and expand existing accounts.\n\n\tMaintain a proactive, results-oriented approach to generating new business.\n\nApparel Merchandising & Product Presentation\n\n\tMerchandise apparel collections to create attractive and effective product presentations.\n\n\tOrganize and present product lines based on customer preferences and market demand.\n\n\tAssist customers with selecting merchandise and developing product assortments.\n\n\tCoordinate product selections, pricing information, and presentations.\n\n\tMaintain an understanding of current apparel trends, styles, and customer preferences.\n\n\tCollaborate with internal teams regarding product availability and customer requirements.\n\n\tProvide feedback on customer demand, product performance, and merchandising opportunities.\n\n\tHelp ensure product presentations are organized, professional, and aligned with sales objectives.\n\nAccount Management & Customer Relations\n\n\tMaintain regular communication with existing customers and prospective accounts.\n\n\tBuild long-term relationships through consistent follow-up and excellent service.\n\n\tTrack customer preferences, product interests, and sales opportunities.\n\n\tCoordinate with internal departments to ensure customer needs are addressed.\n\n\tAssist with resolving customer questions and order-related concerns.\n\n\tMaintain organized records of customer communications and sales activity.\n\n\tIdentify opportunities to strengthen customer relationships and generate repeat business.\n\nAdministrative & Sales Coordination\n\n\tMaintain accurate sales records, customer information, and product documentation.\n\n\tPrepare and update spreadsheets, product lists, and sales reports.\n\n\tUtilize Microsoft Excel and Outlook for daily communication and organization.\n\n\tManage multiple customer accounts and follow-up schedules efficiently.\n\n\tCoordinate with management regarding sales activity, opportunities, and priorities.\n\n\tExplore opportunities to use AI tools to improve productivity, customer outreach, and sales processes.\n\nQualifications\n\n\tExperience in apparel sales, merchandising, or a related field preferred, or a strong desire to develop a career in the industry.\n\n\tHighly motivated, assertive, and results-driven personality with strong sales instincts.\n\n\tExcellent organizational and time-management skills.\n\n\tStrong verbal and written communication abilities.\n\n\tAbility to develop customer relationships and identify new business opportunities.\n\n\tStrong attention to detail and an eye for merchandise presentation.\n\n\tComfortable working independently and taking initiative.\n\n\tAbility to multitask and manage multiple customer relationships.\n\n\tProficiency in Microsoft Excel and Outlook.\n\n\tFamiliarity with AI tools and their business applications is a strong plus.\n\n\tStrong follow-up skills and a proactive approach to customer service.\n\n\tProfessional, dependable, and comfortable working in a fast-paced environment.\n\n\tWillingness to learn product lines, customer preferences, and apparel market trends."}, {"id": "26925", "title": "Sales - LiveSelling", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-10-22", "exp": "2027-01-04", "desc": "We are looking for energetic, confident, and engaging TikTok Shop LIVE Hosts to showcase products, connect with viewers, and drive sales through live shopping sessions!\n\nWe are looking for individuals who are comfortable on camera, enjoy interacting with an audience, and can create an engaging shopping experience that turns viewers into customers.\n\nResponsibilities\n\n\tHost TikTok Shop LIVE sessions to showcase and promote products.\n\tEngage with viewers in real time by answering questions and responding to comments.\n\tDemonstrate product features, benefits, and uses.\n\tEncourage purchases through authentic product recommendations and calls to action.\n\tMaintain a positive, professional, and engaging on-camera presence.\n\tFollow prepared talking points, promotional guidelines, and livestream schedules.\n\tWork with our team to improve engagement, product presentation, and sales performance.\n\nQualifications\n\n\tComfortable speaking on camera and interacting with a live audience.\n\tEnergetic, personable, and able to hold viewers' attention.\n\tStrong communication and presentation skills.\n\tReliable, punctual, and willing to learn.\n\tPrevious livestreaming, sales, hosting, or TikTok Shop experience is a plus, but not required for the right candidate.\n\tMust be comfortable learning product details and answering customer questions."}, {"id": "26924", "title": "Manager", "bhTitle": "Manager", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-22", "exp": "2027-01-04", "desc": "We are seeking a highly organized, detail-oriented, and experienced TikTok Shop Manager to oversee the backend operations of our TikTok Shop. The ideal candidate will be responsible for managing product listings, monitoring orders, maintaining inventory accuracy, coordinating fulfillment, handling customer service workflows, and ensuring the shop operates efficiently.\n\nWe are looking for someone who understands TikTok Shop Seller Center, is comfortable managing e-commerce operations, and can proactively identify and resolve issues to keep the business running smoothly."}, {"id": "26923", "title": "Office & E-Commerce Assistant (Jewelry Company) notes", "bhTitle": "Assistant - Office Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-22", "exp": "2026-12-30", "desc": "About Us:\nWe're a growing jewelry e-commerce business seeking a reliable, detail-oriented person to assist with daily office operations.\n\nResponsibilities:\n\n\tOrganize inventory and office space\n\tPack and label customer orders\n\tAssist with light computer work (website updates, labels, simple spreadsheets)\n\tReceive and check incoming shipments\n\tSupport general day-to-day tasks as needed\n\nRequirements:\n\n\tBasic computer skills (Email, Excel/Sheets)\n\tStrong organizational skills and attention to detail\n\tReliable, punctual, and eager to learn\n\tPositive attitude"}, {"id": "26922", "title": "Sales Assistant – Wholesale Company", "bhTitle": "Sales Assistant", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-22", "exp": "2027-01-25", "desc": "Employment Type: Full-Time\n\nPosition Overview\n\nA growing wholesale company is seeking an experienced, organized, and detail-oriented Sales Assistant to support its sales team and assist with daily wholesale operations.\n\nThe ideal candidate has previous experience working within a wholesale company and understands the processes involved in managing customer accounts, processing orders, coordinating with buyers, and supporting sales representatives.\n\nThis position requires someone who is proactive, efficient, and comfortable managing multiple responsibilities in a fast-paced wholesale environment.\n\nKey Responsibilities\n\nSales Support & Order Processing\n\n\tProvide daily administrative and operational support to the sales team.\n\n\tAssist with processing wholesale customer orders accurately and efficiently.\n\n\tPrepare and update sales orders, purchase orders, and related documentation.\n\n\tMonitor order status and follow up on outstanding orders.\n\n\tCommunicate with customers regarding product availability, pricing, and delivery updates.\n\n\tAssist sales representatives with preparing quotes, product information, and sales materials.\n\n\tMaintain accurate customer account information and sales records.\n\n\tHelp ensure orders are processed and fulfilled according to customer requirements.\n\nCustomer & Buyer Coordination\n\n\tCommunicate professionally with wholesale customers, retail buyers, and sales representatives.\n\n\tRespond to customer inquiries regarding orders, products, and availability.\n\n\tFollow up with buyers regarding pending orders and outstanding information.\n\n\tAssist with maintaining strong relationships with existing customer accounts.\n\n\tCoordinate with internal departments to resolve customer concerns and order discrepancies.\n\n\tSupport the sales team with account management and customer follow-up.\n\nInventory & Logistics Coordination\n\n\tMonitor inventory availability and communicate stock updates to the sales team.\n\n\tCoordinate with warehouse, purchasing, and logistics departments regarding customer orders.\n\n\tTrack shipments and assist with delivery coordination.\n\n\tFollow up on shipping delays, order discrepancies, and fulfillment issues.\n\n\tMaintain accurate records of order status and shipping information.\n\n\tAssist with ensuring timely and accurate order fulfillment.\n\nAdministrative & Reporting Support\n\n\tMaintain and update sales spreadsheets, reports, and internal records.\n\n\tPerform accurate data entry and organize sales documentation.\n\n\tAssist with preparing sales reports and tracking order activity.\n\n\tMaintain organized electronic and physical filing systems.\n\n\tSupport management with daily administrative tasks and special projects.\n\n\tHelp improve communication and efficiency between sales, operations, and warehouse teams.\n\nQualifications\n\n\tPrevious experience working within a wholesale company required.\n\n\tPrior experience as a Sales Assistant, Sales Coordinator, or in a similar wholesale support role preferred.\n\n\tStrong understanding of wholesale sales processes and order management.\n\n\tExperience communicating with wholesale customers and retail buyers.\n\n\tProficiency in Microsoft Excel, Outlook, and general computer applications.\n\n\tExperience with order entry systems, inventory software, or ERP platforms preferred.\n\n\tStrong organizational skills and exceptional attention to detail.\n\n\tExcellent written and verbal communication skills.\n\n\tAbility to multitask, prioritize responsibilities, and meet deadlines.\n\n\tStrong follow-up skills and ability to resolve issues efficiently.\n\n\tDependable, professional, and capable of working independently.\n\n\tComfortable working in a fast-paced, deadline-driven environment.\n\n\tStrong customer service and problem-solving abilities."}, {"id": "26921", "title": "Production Manager", "bhTitle": "Production Manager", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-22", "exp": "2027-01-25", "desc": "Location: New York\nEmployment Type: Full-Time\n\nPosition Overview\n\nA growing company is seeking an experienced and highly organized Production Manager to oversee production operations, manage timelines, coordinate with vendors and internal teams, and ensure products are completed accurately and on schedule.\n\nThe ideal candidate is a proactive problem-solver with strong leadership, communication, and organizational skills who can effectively manage multiple projects in a fast-paced environment.\n\nKey Responsibilities\n\n\tOversee day-to-day production operations from initial order through completion.\n\n\tDevelop and manage production schedules, timelines, and priorities.\n\n\tMonitor production progress and ensure deadlines are consistently met.\n\n\tCoordinate with vendors, suppliers, factories, and internal departments.\n\n\tTrack purchase orders, production status, and delivery schedules.\n\n\tIdentify potential production delays and proactively resolve issues.\n\n\tEnsure products meet required specifications and quality standards.\n\n\tManage vendor communication and follow up on outstanding production matters.\n\n\tCoordinate closely with purchasing, sales, logistics, warehouse, and management teams.\n\n\tMonitor inventory and material requirements related to production.\n\n\tReview production reports and maintain accurate records.\n\n\tResolve production, quality, delivery, and vendor-related issues.\n\n\tHelp improve production processes, workflows, and overall operational efficiency.\n\n\tManage multiple projects simultaneously while maintaining accuracy and organization.\n\n\tProvide management with regular updates regarding production status and potential concerns.\n\nQualifications\n\n\tPrevious experience in production management or a related production role required.\n\n\tStrong understanding of production processes, scheduling, and vendor coordination.\n\n\tExcellent organizational and project-management skills.\n\n\tStrong leadership and problem-solving abilities.\n\n\tAbility to manage multiple deadlines and priorities simultaneously.\n\n\tExcellent communication and follow-up skills.\n\n\tStrong attention to detail and accuracy.\n\n\tAbility to work effectively with vendors, suppliers, and cross-functional teams.\n\n\tProficiency with Microsoft Excel and general business applications.\n\n\tSelf-motivated, dependable, and capable of working independently.\n\n\tComfortable working in a fast-paced and deadline-driven environment."}, {"id": "26920", "title": "Assistant", "bhTitle": "Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-22", "exp": "2027-01-25", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nA growing company in Brooklyn, NY, is seeking a reliable, organized, and detail-oriented Assistant to support daily business operations and provide general administrative assistance.\n\nThe ideal candidate is a motivated, dependable, and efficient individual who can manage multiple responsibilities, communicate professionally, and help ensure smooth day-to-day operations.\n\nThis is an excellent opportunity for someone seeking a stable, full-time position with opportunities for professional growth.\n\nKey Responsibilities\n\n\tProvide general administrative and operational support to management and staff.\n\n\tAssist with daily office tasks, scheduling, and coordination.\n\n\tAnswer phone calls, respond to emails, and handle routine correspondence.\n\n\tPerform data entry and maintain accurate business records.\n\n\tOrganize and maintain electronic and physical filing systems.\n\n\tPrepare and update spreadsheets, reports, and documents.\n\n\tFollow up on outstanding tasks and ensure deadlines are met.\n\n\tCommunicate with customers, vendors, and team members as needed.\n\n\tAssist with organizing appointments, meetings, and daily schedules.\n\n\tSupport management with special projects and additional responsibilities.\n\n\tHelp maintain an organized and efficient work environment.\n\nQualifications\n\n\tPrevious administrative or office experience preferred.\n\n\tStrong organizational and time-management skills.\n\n\tExcellent communication and interpersonal abilities.\n\n\tBasic computer proficiency, including Microsoft Office applications.\n\n\tAbility to multitask and prioritize responsibilities effectively.\n\n\tStrong attention to detail and accuracy.\n\n\tDependable, punctual, and professional.\n\n\tAbility to work independently and collaboratively.\n\n\tPositive attitude and willingness to learn.\n\n\tStrong problem-solving skills and ability to take initiative."}, {"id": "26919", "title": "Sales Associate", "bhTitle": "Retail Sales", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-10-21", "exp": "2027-01-21", "desc": "Employment Type: Full-Time\nSchedule: Sunday–Friday\nHours: Sunday–Thursday, 11:00 AM–6:00 PM | Friday, 11:00 AM–2:00 PM\n\nPosition Overview\n\nA growing retail business is seeking a friendly, motivated, and dependable Retail Sales Associate to join its team.\n\nThe ideal candidate is personable, customer-focused, and comfortable working in a busy retail environment. This position involves assisting customers, promoting merchandise, processing transactions, and maintaining an organized and welcoming store.\n\nWe are looking for someone with strong communication skills, a positive attitude, and a willingness to contribute to the overall success of the business.\n\nKey Responsibilities\n\nSales & Customer Service\n\n\tGreet customers and provide friendly, professional assistance.\n\n\tHelp customers find products that meet their needs and preferences.\n\n\tExplain product features, pricing, and availability.\n\n\tRecommend merchandise and identify opportunities to increase sales.\n\n\tAnswer customer questions and address concerns professionally.\n\n\tBuild positive relationships with customers and encourage repeat business.\n\n\tAssist with processing purchases, returns, and exchanges.\n\nStore Operations & Merchandising\n\n\tMaintain a clean, organized, and attractive sales floor.\n\n\tRestock merchandise and ensure products are properly displayed.\n\n\tAssist with organizing inventory and monitoring product availability.\n\n\tEnsure merchandise is accurately priced and labeled.\n\n\tSupport daily opening and closing procedures as needed.\n\n\tAssist with receiving and organizing new merchandise.\n\n\tWork with team members to maintain efficient store operations.\n\nQualifications\n\n\tPrevious retail or sales experience preferred but not required.\n\n\tStrong customer service and interpersonal skills.\n\n\tFriendly, outgoing, and professional demeanor.\n\n\tExcellent communication and listening abilities.\n\n\tAbility to work independently and collaboratively.\n\n\tDependable, punctual, and responsible.\n\n\tStrong organizational skills and attention to detail.\n\n\tComfortable working in a fast-paced retail environment.\n\n\tWillingness to learn about products and assist customers.\n\n\tAbility to work the required Sunday–Friday schedule."}, {"id": "26918", "title": "Bookkeeper", "bhTitle": "Bookkeeper", "category": "Accounting & Finance", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-21", "exp": "2027-01-21", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\nWork Arrangement: Primarily In-Office\nSchedule: Flexible Hours\n\nPosition Overview\n\nAn established retail business in Brooklyn is seeking an experienced, organized, and detail-oriented Bookkeeper to manage daily bookkeeping activities and maintain accurate financial records.\n\nThe ideal candidate has strong QuickBooks experience, a solid understanding of bookkeeping procedures, and the ability to work independently while managing multiple financial responsibilities.\n\nThis position offers flexible part-time hours, provided the candidate can effectively manage the workload, meet deadlines, and complete all required bookkeeping tasks.\n\nThis is an excellent opportunity for a dependable bookkeeping professional seeking a flexible position within an established retail business.\n\nKey Responsibilities\n\nBookkeeping & Financial Management\n\n\tManage daily bookkeeping activities using QuickBooks.\n\n\tMaintain accurate and up-to-date financial records.\n\n\tRecord financial transactions and ensure proper documentation.\n\n\tPerform regular bank reconciliations.\n\n\tMonitor financial activity and identify discrepancies.\n\n\tAssist with maintaining organized financial reports and supporting documentation.\n\n\tEnsure bookkeeping records are accurate, complete, and properly maintained.\n\nAccounts Payable & Receivable\n\n\tEnter vendor bills and process payments accurately and on time.\n\n\tTrack vendor balances and outstanding accounts payable.\n\n\tMonitor customer accounts, payments, and outstanding balances.\n\n\tMaintain accurate accounts receivable records.\n\n\tReview invoices and payment information for accuracy.\n\n\tIdentify and resolve billing or payment discrepancies.\n\n\tFollow up on outstanding balances and payment-related matters as needed.\n\nPurchase Orders & Retail Operations\n\n\tTrack purchase orders and verify pricing accuracy.\n\n\tReview purchase order details against vendor invoices.\n\n\tMonitor order-related financial transactions and documentation.\n\n\tCommunicate with vendors regarding billing questions and discrepancies.\n\n\tAssist with maintaining accurate purchasing and payment records.\n\n\tSupport management with bookkeeping-related operational tasks.\n\nAdministrative & Recordkeeping Support\n\n\tOrganize and maintain electronic and physical financial records.\n\n\tUpdate spreadsheets and internal bookkeeping reports.\n\n\tAssist with preparing financial documentation as needed.\n\n\tMaintain confidentiality of financial and business information.\n\n\tProvide additional bookkeeping and administrative support as required.\n\nQualifications\n\n\tPrevious bookkeeping experience required.\n\n\tProficiency in QuickBooks is essential.\n\n\tMid-level bookkeeping knowledge and practical experience.\n\n\tStrong understanding of accounts payable, accounts receivable, and bank reconciliations.\n\n\tExperience tracking invoices, vendor payments, and customer balances.\n\n\tFamiliarity with purchase orders and pricing verification preferred.\n\n\tStrong attention to detail and accuracy when working with numbers.\n\n\tExcellent organizational and time-management skills.\n\n\tAbility to work independently with minimal supervision.\n\n\tComfortable managing multiple responsibilities and meeting deadlines.\n\n\tStrong communication and problem-solving abilities.\n\n\tProficiency in Microsoft Excel and general computer applications preferred.\n\n\tPrevious bookkeeping experience in a retail or wholesale business is a plus."}, {"id": "26917", "title": "Wholesale Sales Representatives", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-21", "exp": "2027-01-21", "desc": "Employment Type: Full-Time\n\nPosition Overview\n\nA growing wholesale company is seeking experienced Sales Representatives with established industry relationships and strong connections to retail buyers.\n\nThe company is specifically looking for sales professionals with expertise in one or more of the following three product categories:\n\n1. Small Kitchen Electrics\n\n\tCoffee makers and espresso machines.\n\n\tToasters and toaster ovens.\n\n\tBlenders, mixers, and other small kitchen appliances.\n\n\tRelated countertop kitchen electronics.\n\n2. Cookware\n\n\tPots and pans.\n\n\tCookware sets.\n\n\tNonstick and stainless steel cookware.\n\n\tRelated kitchen and cooking products.\n\n3. Handbags & Wallets\n\n\tWomen's handbags and purses.\n\n\tWallets and small leather goods.\n\n\tFashion accessories.\n\n\tProducts sold through off-price and discount retail channels.\n\nCandidates with established relationships with buyers at off-price retailers, particularly TJ Maxx, Marshalls, and similar retail chains, are strongly preferred.\n\nThe ideal candidates are experienced wholesale sales professionals who understand their respective product categories, maintain active relationships with retail buyers, and have a proven ability to generate business.\n\nKey Responsibilities\n\nWholesale Sales & Business Development\n\n\tDevelop and expand wholesale sales within the assigned product category.\n\n\tLeverage existing relationships with retail buyers to generate new business opportunities.\n\n\tIdentify and pursue new accounts with national retailers, department stores, off-price chains, and specialty stores.\n\n\tPresent product assortments, pricing, and new merchandise to prospective buyers.\n\n\tNegotiate pricing, order quantities, and sales agreements.\n\n\tManage the sales process from initial outreach through order placement.\n\n\tDevelop strategies to increase sales volume and expand the company's retail presence.\n\nBuyer Relationships & Account Management\n\n\tMaintain and strengthen relationships with existing retail and wholesale buyers.\n\n\tUtilize established buyer connections to introduce new products and secure orders.\n\n\tBuild long-term relationships with key retail decision-makers.\n\n\tCommunicate regularly with buyers regarding product availability, pricing, and new collections.\n\n\tIdentify opportunities to expand product assortments within existing accounts.\n\n\tFollow up on prospective accounts, sales opportunities, and outstanding orders.\n\n\tProvide excellent customer service and maintain strong account relationships.\n\nProduct Knowledge & Market Development\n\n\tStay informed about market trends and customer demand within the assigned product category.\n\n\tUnderstand competitive pricing, product positioning, and retail buying requirements.\n\n\tIdentify high-demand products and new business opportunities.\n\n\tCollaborate with management regarding buyer feedback and market opportunities.\n\n\tMonitor sales performance and provide updates on account development.\n\n\tSupport the company's growth within wholesale, off-price, and national retail channels.\n\nQualifications\n\n\tPrevious wholesale sales experience in at least one of the following categories required:\n\n\t\tSmall kitchen electrics and appliances.\n\n\t\tCookware, pots, and pans.\n\n\t\tHandbags, wallets, and fashion accessories.\n\n\tEstablished relationships with retail buyers strongly preferred.\n\n\tExperience selling to off-price retailers such as TJ Maxx, Marshalls, or similar chains is highly desirable.\n\n\tProven track record of generating wholesale sales and developing retail accounts.\n\n\tStrong understanding of product pricing, merchandising, and retail buying processes.\n\n\tExcellent negotiation, presentation, and relationship-building skills.\n\n\tAbility to identify new business opportunities and convert them into sales.\n\n\tSelf-motivated, results-driven, and capable of working independently.\n\n\tStrong communication, organizational, and follow-up abilities.\n\n\tKnowledge of national retail chains, department stores, and wholesale distribution channels."}, {"id": "26916", "title": "Legal Assistant – Litigation Department", "bhTitle": "Legal Assistant", "category": "Legal", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-21", "exp": "2027-01-21", "desc": "Location: Cedarhurst, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nA sophisticated and established law firm with offices in Long Island, Brooklyn, and New Jersey is seeking a highly organized, detail-oriented, and dependable Legal Assistant to join its Litigation Department in Cedarhurst, NY.\n\nThe ideal candidate is a professional and motivated individual with strong administrative skills, excellent attention to detail, and the ability to manage multiple responsibilities in a fast-paced legal environment.\n\nThis position involves providing essential administrative support to attorneys, managing legal documents, coordinating schedules, handling correspondence, and assisting with the daily operations of the Litigation Department.\n\nThis is an excellent opportunity for someone seeking a stable, full-time position within a professional and collaborative law firm.\n\nKey Responsibilities\n\nLegal Administrative Support\n\n\tProvide daily administrative assistance to attorneys within the Litigation Department.\n\n\tManage attorneys' calendars, appointments, meetings, and scheduling needs.\n\n\tHandle incoming and outgoing correspondence, emails, and phone calls.\n\n\tScreen and direct calls, messages, and inquiries appropriately.\n\n\tPrepare, organize, and maintain legal and administrative documents.\n\n\tAssist attorneys with coordinating meetings and other case-related activities.\n\n\tMaintain accurate records and ensure timely follow-up on outstanding tasks.\n\n\tHandle confidential client and legal information with professionalism and discretion.\n\nDocument Management & Organization\n\n\tOrganize, maintain, and archive documents related to active and closed litigation matters.\n\n\tMaintain accurate electronic and physical filing systems.\n\n\tEnsure case files and supporting documents are properly labeled, organized, and accessible.\n\n\tAssist with retrieving, reviewing, and distributing legal documents as needed.\n\n\tMonitor documentation requirements and assist with maintaining organized case records.\n\n\tSupport attorneys with document preparation, formatting, and general administrative tasks.\n\nLitigation Department Coordination\n\n\tAssist with the day-to-day operations of the Litigation Department to ensure efficiency and organization.\n\n\tMonitor developments in legal regulations and procedures and communicate relevant updates to attorneys.\n\n\tCoordinate administrative tasks and maintain communication between attorneys and support staff.\n\n\tHelp track important assignments, deadlines, and follow-up items.\n\n\tAssist with preparing reports, correspondence, and other departmental materials.\n\n\tSupport department workflow and help ensure administrative responsibilities are completed accurately and on time.\n\n\tAssist with special projects and additional administrative assignments as needed.\n\nQualifications\n\n\tBachelor's degree required.\n\n\t1–2 years of previous administrative or office support experience required.\n\n\tProficiency in Microsoft Word, Excel, and Outlook.\n\n\tStrong organizational skills and exceptional attention to detail.\n\n\tExcellent written and verbal communication abilities.\n\n\tAbility to multitask, prioritize responsibilities, and meet deadlines.\n\n\tComfortable working in a fast-paced professional environment.\n\n\tStrong computer skills and ability to learn new office systems.\n\n\tProfessional telephone etiquette and interpersonal skills.\n\n\tDependable, punctual, and capable of working independently.\n\n\tAbility to handle confidential information with discretion.\n\n\tStrong proofreading, document management, and administrative skills.\n\n\tPrevious experience in a law firm or legal environment is a plus."}, {"id": "26915", "title": "Paralegal", "bhTitle": "Paralegal", "category": "Legal", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-21", "exp": "2027-01-21", "desc": "Location: Cedarhurst, NY\nEmployment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nA sophisticated and established law firm with offices in Long Island, Brooklyn, and New Jersey is seeking a highly organized, detail-oriented, and motivated Paralegal to join its Litigation Department in Cedarhurst, NY.\n\nThe ideal candidate is a dependable professional with strong research, writing, and organizational skills who can effectively manage multiple responsibilities in a fast-paced legal environment.\n\nThis position involves supporting attorneys with litigation matters, legal research, document preparation, court filings, and case management.\n\nThis is an excellent opportunity to join a collaborative legal team and gain valuable experience within a dynamic litigation practice.\n\nKey Responsibilities\n\nLitigation Support & Legal Research\n\n\tConduct legal research and investigate facts relevant to ongoing litigation matters.\n\n\tReview and summarize cases, legal documents, and supporting materials for attorneys.\n\n\tPrepare case summaries, legal reports, and research memoranda.\n\n\tAssist attorneys in developing legal strategies and preparing case materials.\n\n\tMonitor relevant changes in laws, regulations, and legal procedures.\n\n\tProvide attorneys with updates regarding legal developments and case-related matters.\n\n\tAssist with preparing litigation materials and supporting documentation.\n\nLegal Document Preparation & Court Filings\n\n\tDraft, review, and organize legal documents, including:\n\n\t\tPleadings and motions.\n\n\t\tDiscovery demands and responses.\n\n\t\tContracts and legal correspondence.\n\n\t\tDeposition summaries.\n\n\t\tCase reports and supporting documentation.\n\n\tPrepare and file legal documents with courts and administrative agencies.\n\n\tEnsure legal documents are properly formatted, organized, and submitted according to applicable requirements.\n\n\tAssist attorneys with preparing exhibits, supporting materials, and court submissions.\n\n\tMaintain accurate records of legal filings and case documentation.\n\nCase Management & Administrative Support\n\n\tOrganize, maintain, and archive litigation files and related documentation.\n\n\tAssist attorneys with managing active cases and monitoring important deadlines.\n\n\tCoordinate and organize documents needed for depositions, hearings, and trials.\n\n\tSupport trial preparation, including assembling exhibits and case materials.\n\n\tMaintain accurate electronic and physical case files.\n\n\tAssist with scheduling, correspondence, and general litigation-related administrative tasks.\n\n\tCoordinate with attorneys and other staff members to ensure efficient case management.\n\n\tHandle confidential client and legal information with professionalism and discretion.\n\nQualifications\n\n\tBachelor's degree required.\n\n\t1–2 years of experience in an administrative or office support role.\n\n\tPrevious experience in a law firm or litigation department preferred but not required.\n\n\tProficiency in Microsoft Word, Excel, and Outlook.\n\n\tStrong organizational skills and exceptional attention to detail.\n\n\tExcellent written and verbal communication skills.\n\n\tStrong research, analytical, and problem-solving abilities.\n\n\tAbility to manage multiple assignments and prioritize competing deadlines.\n\n\tComfortable working in a fast-paced professional environment.\n\n\tAbility to follow instructions carefully and work independently.\n\n\tStrong document preparation and proofreading skills.\n\n\tProfessional, dependable, and capable of maintaining confidentiality.\n\n\tAbility to collaborate effectively with attorneys and other legal professionals."}, {"id": "26914", "title": "Senior Sales Executive", "bhTitle": "Sales- Senior Level", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-21", "exp": "2027-01-21", "desc": "Employment Type: Full-Time\n\nPosition Overview\n\nA growing company specializing in women's intimate apparel, underwear, and shapewear is seeking an experienced and well-connected Senior Sales Executive to expand its wholesale business and strengthen relationships with retail buyers.\n\nThe ideal candidate has a proven background in intimate apparel sales, an established network of retail and wholesale buyers, and a strong understanding of the women's underwear and shapewear market.\n\nThis position is best suited for a sales professional who can leverage existing industry relationships to generate new business, grow key accounts, and drive revenue.\n\nKey Responsibilities\n\nWholesale Sales & Business Development\n\n\tDevelop and expand wholesale sales of women's intimate apparel, underwear, and shapewear.\n\n\tLeverage existing relationships with retail buyers to generate new business opportunities.\n\n\tIdentify and pursue new accounts with department stores, specialty retailers, chains, and other wholesale customers.\n\n\tPresent product collections, pricing, and new merchandise to prospective buyers.\n\n\tNegotiate pricing, order quantities, and sales agreements.\n\n\tManage the sales process from initial outreach through order placement and account development.\n\n\tConsistently identify opportunities to increase sales volume and expand market presence.\n\nBuyer Relationships & Account Management\n\n\tMaintain and strengthen relationships with established retail and wholesale buyers.\n\n\tUtilize an existing network of industry contacts to secure new accounts.\n\n\tBuild long-term partnerships with customers and key decision-makers.\n\n\tCommunicate regularly with buyers regarding product offerings, inventory, pricing, and upcoming collections.\n\n\tFollow up on sales opportunities, customer inquiries, and outstanding orders.\n\n\tIdentify opportunities to expand product assortments within existing accounts.\n\n\tProvide excellent customer service and maintain strong account relationships.\n\nMarket Knowledge & Sales Strategy\n\n\tStay informed about trends in women's intimate apparel, underwear, and shapewear.\n\n\tUnderstand customer preferences, market pricing, and competitive product offerings.\n\n\tIdentify high-demand products and potential growth opportunities.\n\n\tCollaborate with management and product development teams regarding buyer feedback and market demand.\n\n\tHelp develop sales strategies to increase revenue and strengthen the company's market position.\n\n\tProvide updates on sales activity, prospective accounts, and business development opportunities.\n\nQualifications\n\n\tPrevious wholesale sales experience in women's intimate apparel, underwear, or shapewear required.\n\n\tEstablished relationships and direct connections with retail and wholesale buyers required.\n\n\tStrong understanding of the women's intimates and shapewear market.\n\n\tProven ability to generate sales and develop new wholesale accounts.\n\n\tExperience working with department stores, retail chains, specialty stores, or other wholesale customers.\n\n\tExcellent negotiation, presentation, and relationship-building skills.\n\n\tStrong understanding of wholesale pricing, product assortments, and retail buying processes.\n\n\tSelf-motivated, results-driven, and comfortable working independently.\n\n\tExcellent communication and follow-up abilities.\n\n\tAbility to identify new business opportunities and convert relationships into sales.\n\n\tStrong organizational skills and professional business judgment."}, {"id": "26913", "title": "Luxury Watch Sales Associate", "bhTitle": "Luxury Watch Sales Associate", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-20", "exp": "2027-01-04", "desc": "Location: New York City (Diamond District)\nSchedule: Full-Time\n\nA growing luxury watch dealer in NYC is seeking a motivated and personable Sales Associate to join its team. The company specializes in buying, selling, consigning, and sourcing luxury timepieces from leading brands, working with collectors, clients, and industry professionals in a private showroom environment.\n\nResponsibilities\n\n\tAssist clients with buying, selling, and consigning luxury watches.\n\tBuild and maintain strong relationships with collectors, customers, and industry partners.\n\tFollow up on leads and generate new business opportunities.\n\tEducate clients on watch brands, models, market trends, and pricing.\n\tCoordinate client appointments and provide a personalized, high-end customer experience.\n\tHelp source inventory and communicate with buyers, sellers, and dealers.\n\tMaintain accurate client records and support daily showroom operations.\n\nQualifications\n\n\tPrevious sales, luxury retail, or customer service experience preferred.\n\tStrong communication, interpersonal, and relationship-building skills.\n\tSelf-motivated with a passion for sales and earning commission.\n\tProfessional appearance and demeanor.\n\tInterest in luxury watches, jewelry, or other luxury goods is a plus.\n\tOrganized, detail-oriented, and comfortable working in a fast-paced environment.\n\nThis is a great opportunity for someone looking to build a career in the luxury watch industry while working directly with high-end clients."}, {"id": "26912", "title": "Watch Photographer / E-Commerce Assistant", "bhTitle": "Ecommerce Marketing", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-20", "exp": "2027-01-04", "desc": "Location: NYC\nSchedule: Monday–Friday, 9:30 AM–5:30 PM\n\nA luxury watch company is seeking a detail-oriented Photographer to photograph watches and upload product images to their website. The ideal candidate has strong attention to detail, an interest in photography and luxury products, and the ability to work efficiently in a fast-paced environment.\n\nResponsibilities include photographing products, editing and organizing images, uploading content to the website, and assisting with e-commerce tasks as needed."}, {"id": "26911", "title": "Receptionist / Administrative Assistant", "bhTitle": "Receptionist", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-20", "exp": "2027-01-20", "desc": "Location: Great Neck, NY\nEmployment Type: Full-Time, In-Person\n\nPosition Overview\n\nA well-established company specializing in chemical importing and distribution is seeking a professional, organized, and detail-oriented Receptionist / Administrative Assistant to join its Great Neck office.\n\nThis position combines traditional front-desk responsibilities with administrative support, order processing, and logistics coordination.\n\nThe ideal candidate is personable, dependable, and comfortable managing multiple responsibilities in a busy office environment. This individual will serve as an important point of contact for customers, vendors, and internal team members while helping ensure smooth daily operations.\n\nThis is an excellent opportunity for someone seeking a stable, full-time position with exposure to international trade, distribution, and logistics.\n\nKey Responsibilities\n\nReception & Front Desk Support\n\n\tGreet visitors, customers, and vendors in a friendly and professional manner.\n\n\tAnswer incoming phone calls and direct inquiries to the appropriate departments.\n\n\tManage general office communications, including emails and correspondence.\n\n\tMaintain an organized, professional, and welcoming reception area.\n\n\tAssist customers and vendors with general questions and requests.\n\n\tCoordinate appointments, meetings, and other office activities as needed.\n\nAdministrative & Office Operations\n\n\tProvide daily administrative support to management and office staff.\n\n\tPerform accurate data entry and maintain organized business records.\n\n\tPrepare, review, and organize documents, spreadsheets, and correspondence.\n\n\tMaintain electronic and physical filing systems.\n\n\tAssist with preparing reports, invoices, and other administrative materials.\n\n\tUpdate customer, vendor, and order information in internal systems.\n\n\tMonitor outstanding administrative tasks and follow up as needed.\n\n\tSupport general office organization and operational efficiency.\n\nOrder Processing & Logistics Coordination\n\n\tAssist with processing customer orders and maintaining accurate order records.\n\n\tCoordinate with internal departments regarding order status and fulfillment.\n\n\tCommunicate with vendors, suppliers, and logistics partners as needed.\n\n\tHelp track shipments, deliveries, and outstanding orders.\n\n\tAssist with preparing and organizing shipping and distribution documentation.\n\n\tFollow up on order confirmations, delivery schedules, and shipment updates.\n\n\tMaintain accurate records of customer orders and shipping information.\n\n\tSupport the logistics team with administrative tasks related to domestic and international distribution.\n\n\tHelp identify and communicate order discrepancies or delivery issues.\n\nQualifications\n\n\tPrevious experience in reception, administrative support, customer service, or office coordination preferred.\n\n\tStrong computer skills and proficiency in Microsoft Office applications, particularly Excel and Outlook.\n\n\tExcellent verbal and written communication skills.\n\n\tProfessional and friendly telephone manner.\n\n\tStrong organizational skills and attention to detail.\n\n\tAbility to multitask and prioritize responsibilities in a busy office environment.\n\n\tAccurate data entry and recordkeeping abilities.\n\n\tDependable, punctual, and comfortable working independently.\n\n\tStrong follow-up skills and ability to meet deadlines.\n\n\tPositive attitude and willingness to learn new systems and procedures.\n\n\tExperience in importing, distribution, logistics, or order processing is a plus.\n\n\tAbility to communicate professionally with customers, vendors, and internal departments."}, {"id": "26909", "title": "Production Coordinator", "bhTitle": "Production Coordinator", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-20", "exp": "2027-01-20", "desc": "Location: New Jersey\nEmployment Type: Full-Time, On-Site\n\nPosition Overview\n\nA growing company is seeking an organized, detail-oriented, and dependable Production Coordinator to oversee and support daily production operations.\n\nThe ideal candidate has strong organizational skills, excellent communication abilities, and experience coordinating production schedules, managing orders, and communicating with vendors and internal teams.\n\nThis position requires someone who can manage multiple responsibilities, follow up on production timelines, and ensure projects are completed accurately and on schedule.\n\nPlease Note: This is an on-site position in New Jersey. No carpool transportation is available from Brooklyn, so candidates must arrange their own reliable transportation.\n\nKey Responsibilities\n\nProduction Coordination & Management\n\n\tCoordinate daily production activities and monitor production schedules.\n\n\tTrack orders from initial processing through completion and delivery.\n\n\tCommunicate with vendors, suppliers, and internal departments regarding production updates.\n\n\tMonitor production timelines and ensure deadlines are met.\n\n\tFollow up on outstanding orders, delays, and production-related issues.\n\n\tMaintain accurate production records, order details, and status reports.\n\n\tAssist with coordinating product samples, approvals, and revisions as needed.\n\n\tIdentify potential production delays and communicate concerns to management.\n\nVendor & Department Coordination\n\n\tMaintain regular communication with vendors and suppliers.\n\n\tCoordinate with purchasing, sales, logistics, and warehouse teams.\n\n\tEnsure production requirements, specifications, and deadlines are clearly communicated.\n\n\tTrack vendor updates and follow up on outstanding items.\n\n\tAssist with resolving order discrepancies and production challenges.\n\n\tSupport smooth communication between departments to ensure efficient operations.\n\nAdministrative & Operational Support\n\n\tMaintain organized spreadsheets, production reports, and order documentation.\n\n\tUpdate production tracking systems and internal records.\n\n\tAssist with preparing reports and monitoring production progress.\n\n\tEnsure accurate documentation of production changes and approvals.\n\n\tSupport management with operational tasks and special projects.\n\n\tHelp improve production workflows and overall efficiency.\n\nQualifications\n\n\tPrevious experience in production coordination, operations, purchasing, or a related field preferred.\n\n\tStrong organizational skills and attention to detail.\n\n\tExcellent communication and follow-up abilities.\n\n\tProficiency in Microsoft Excel and general computer applications.\n\n\tAbility to manage multiple projects and deadlines simultaneously.\n\n\tStrong problem-solving and time-management skills.\n\n\tComfortable communicating with vendors and internal departments.\n\n\tAbility to work independently and collaboratively.\n\n\tDependable, proactive, and comfortable in a fast-paced environment.\n\n\tReliable transportation to the New Jersey office required."}, {"id": "26908", "title": "Supply Chain Coordinator", "bhTitle": "Coordinator", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-20", "exp": "2027-01-20", "desc": "Location: New Jersey\nEmployment Type: Full-Time, On-Site\n\nPosition Overview\n\nA growing company in the consumer goods and general merchandise industry is seeking an experienced, highly organized, and detail-oriented Supply Chain Coordinator to join its New Jersey team.\n\nThis position is responsible for overseeing purchase orders from issuance through completion, coordinating domestic and international shipments, maintaining vendor relationships, and ensuring accurate purchasing and inventory records.\n\nThe Supply Chain Coordinator will serve as a key link between purchasing, logistics, operations, and finance, ensuring that purchase orders, warehouse receipts, vendor invoices, and associated costs are properly documented and reconciled.\n\nThe ideal candidate has a strong understanding of supply chain operations, purchasing processes, inventory costing, and basic accounting principles. This role requires exceptional attention to detail, advanced Excel skills, and the ability to manage multiple vendors and deadlines in a fast-paced environment.\n\nKey Responsibilities\n\nPurchasing & Purchase Order Management\n\n\tCreate, process, and maintain purchase orders using Microsoft Excel and the company's ERP/accounting system.\n\n\tSubmit purchase orders through customer and vendor portals as required.\n\n\tManage purchase orders from initial issuance through final reconciliation and closure.\n\n\tCommunicate with vendors regarding order confirmations, pricing, lead times, and expected delivery dates.\n\n\tMonitor outstanding purchase orders and proactively follow up on delays or discrepancies.\n\n\tReview and consolidate vendor responses to ensure accuracy and compliance with company requirements.\n\n\tMaintain organized records of purchase orders, vendor correspondence, pricing, and product information.\n\n\tCollaborate with sales, operations, and finance teams to ensure purchasing information remains accurate and current.\n\nLogistics & Shipment Coordination\n\n\tCoordinate inbound and outbound shipments with vendors, freight forwarders, carriers, customs brokers, and warehouse personnel.\n\n\tMonitor shipment progress and track deliveries through completion.\n\n\tReview shipping documents, including bills of lading, commercial invoices, packing lists, and customs documentation.\n\n\tEnsure incoming shipments are properly matched to the correct purchase orders.\n\n\tCommunicate with logistics partners to resolve shipping delays and delivery issues.\n\n\tMaintain accurate shipment records and documentation.\n\n\tAssist with coordinating international imports and related customs processes.\n\n\tWork closely with warehouse teams to verify received quantities and identify discrepancies.\n\nInventory Costing & Financial Reconciliation\n\n\tPerform and support three-way matching between purchase orders, receiving documentation, and vendor invoices.\n\n\tVerify quantities, unit prices, currencies, and payment terms for accuracy.\n\n\tReconcile warehouse receipts and customs entries with corres
