"}, {"id": "26560", "title": "Office Manager", "bhTitle": "Office Manager", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-04", "exp": "2026-11-01", "desc": "Growing apparel company is seeking a responsible, organized, and discreet Office Manager to oversee daily office operations while supporting the company's HR functions. This role is ideal for someone who enjoys wearing multiple hats, maintaining confidentiality, and ensuring the office runs smoothly in a fast-paced environment.\n\nPosition Type: Full-Time\n\nJob Hours: Monday–Friday, In Office (5 days per week). Some flexibility may be available on Fridays.\n\nEssential Duties and Responsibilities:\n\n\tAssist with payroll processing and employee attendance tracking.\n\tCoordinate new hire onboarding and maintain employee records.\n\tManage PTO requests and assist with employee benefits administration.\n\tProvide employee support and handle HR-related administrative tasks under the direction of the COO.\n\tOversee daily office operations and ensure an organized, efficient workplace.\n\tServe as a backup for the front desk and reception as needed.\n\tMaintain confidentiality when handling employee and company information.\n\tAssist with general administrative and operational projects as assigned.\n\nSpecific Qualifications and/or Requirements:\n\n\tPrior office management, administrative, or HR support experience preferred.\n\tHighly organized with excellent attention to detail.\n\tResponsible, dependable, and able to maintain strict confidentiality.\n\tStrong communication and interpersonal skills.\n\tProficient with Microsoft Office and standard office technology.\n\tAbility to prioritize tasks and work independently in a fast-paced environment.\n\nAdditional Information:\n\n\tOffice is located in Midtown Manhattan.\n\tThis is a fully in-office position.\n\tThe company is seeking someone who is dependable, proactive, and comfortable supporting both office operations and HR administration."}, {"id": "26558", "title": "General Manager - Amazon Business", "bhTitle": "ECommerce Manager", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-04", "exp": "2026-11-03", "desc": "Location: Brooklyn, NY\nJob Type: Full-time\nSchedule: Standard office hours\n\nWe are seeking a highly organized, results-driven General Manager - Amazon Business to oversee the day-to-day performance of our established Amazon business. This person will be responsible for ensuring our current product catalog continues to grow, all departments stay aligned, and key performance goals are consistently met.\n\nThis is an ownership role, not a task management role. You will be expected to identify issues before they become problems, hold internal teams and outside partners accountable, and keep the business operating at a high level every day. Your mission is to ensure our established Amazon business remains strong, efficient, and consistently growing while successfully executing new product launches developed by our product team. Success in this role means protecting and strengthening our existing business while executing every new product launch with excellence, creating sustainable long-term growth for the company.\n\nKey Responsibilities:\n\n\tOwn the day-to-day performance of our Amazon business.\n\n\tMonitor sales, profitability, inventory health, account health, and listing performance.\n\n\tCoordinate with our logistics team, PPC agency, customer service, and other vendors to ensure all goals are met.\n\n\tIdentify opportunities and problems quickly, then drive solutions to completion.\n\n\tTrack and report on weekly KPIs and business performance.\n\n\tEnsure launches, promotions, inventory planning, and operational projects stay on schedule.\n\n\tEscalate only high-level strategic decisions while independently managing day-to-day operations.\n\nQualifications:\n\n\tProven ughout New Jersey.\n\tMaintain accurate records of prospect interactions, opportunities, and sales activities.\n\tFollow up consistently with leads to move opportunities through the sales process.\n\tCollaborate with internal teams to ensure a smooth transition from prospect to customer.\n\tMeet or exceed individual activity, pipeline, and sales development goals.\n\tRepresent the company professionally during client meetings and networking events.\n\nQualifications\n\n\tStrong verbal and written communication skills.\n\tHighly motivated, goal-oriented, and self-driven.\n\tExcellent relationship-building and interpersonal skills.\n\tComfortable making outbound calls and engaging prospective customers.\n\tStrong organizational skills with the ability to manage multiple opportunities simultaneously."}, {"id": "26552", "title": "Office Administrator", "bhTitle": "Office Administrator", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-07-31", "exp": "2026-11-02", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overview\n\nWe are seeking a highly organized and detail-oriented Office Administrator to join our team in Brooklyn. This role is responsible for supporting daily office operations by managing administrative processes, coordinating documentation, maintaining organized records, and ensuring efficient communication with clients, vendors, and internal staff.\n\nThe ideal candidate is proactive, dependable, and able to manage multiple priorities while maintaining a high level of accuracy and professionalism.\n\nResponsibilities\n\n\tPrepare, organize, and manage proposals, contracts, and administrative paperwork.\n\tCoordinate and maintain insurance documentation and related records.\n\tHandle incoming phone calls, emails, and other communications in a professional and timely manner.\n\tMaintain organized digital and physical filing systems for company records and documentation.\n\tAssist with billing coordination, invoice tracking, and administrative support for accounting functions.\n\tMonitor deadlines and ensure all required documentation is completed accurately and on time.\n\tSupport day-to-day office operations and provide administrative assistance to management as needed.\n\tCoordinate with clients, vendors, and team members to ensure smooth workflow and communication.\n\tMaintain confidentiality while handling sensitive business information.\n\tIdentify opportunities to improve office processes and administrative efficiency.\n\nQualifications\n\n\tExceptional organizational skills with strong attention to detail.\n\tExcellent follow-through and ability to manage multiple tasks simultaneously.\n\tProficiency with Microsoft Office (Word, Excel, Outlook) and other office software.\n\tStrong verbal and written communication skills.\n\tAbility to prioritize work independently in a fast-paced environment.\n\tProfessional, dependable, and customer-service oriented."}, {"id": "26551", "title": "Sales", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-07-30", "exp": "", "desc": "Brooklyn location with option to work in NJ for the summer.\n\nHigh-Intent Leads: Reps receive exclusive, pre-qualified leads from marketing spend, eliminating cold calling and enabling a commission structure of 25–35%.\n\nIn-Office Requirement: New hires must work in the office for training on the proprietary CRM and sales process."}, {"id": "26548", "title": "Product Development", "bhTitle": "Product Development", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-07-30", "exp": "2026-10-30", "desc": "Product Development and MUST HAVE FASHION SENSE.\n\nLocation: New York, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nPosition Overvie erience in apparel production or product development is not required.\n\tFIT graduate preferred."}];
// Addresses are stored scrambled so bots reading the page code cannot collect them; they are put together only in the browser.
const AT = s => s.split("").reverse().join("") + String.fromCharCode(64) + "gro.reerachbs".split("").reverse().join("");
const TO = AT("tnemyolpme");
const JDS = [
  ["David", "David Salem", AT("melasd")],
  ["Guila", "Guila Sakkal", AT("lakkasg")],
  ["Martin", "Martin Salama", AT("amalasm")],
  ["Nathan", "Nathan Rudy", AT("ydurn")],
  ["Sheri", "Sheri Solomon", AT("nomoloss")],
  ["Shirley", "Shirley Massres", AT("yelrihs")],
  ["Sofia", "Sofia Sutton", AT("aifos")],
  ["Yola", "Yola Haber", AT("aloy")]
];
const TYPE_ORDER = ["Full Time", "Part Time", "Full or Part Time", "Remote / Hybrid", "Internship", "Temporary", "Other"];
const EXAMPLES = ["receptionist", "Brooklyn", "part time", "sales", "bookkeeper", "teacher", "Job #26946", "warehouse", "social media"];
const PAGE = 40;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem("sbhjobs." + k) || ""; } catch (e) { return ""; } },
  set(k, v) { try { localStorage.setItem("sbhjobs." + k, v); } catch (e) {} }
};
const phone = () => matchMedia("(max-width: 899px)").matches;
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

const st = { q: "", cat: "", type: "", state: "", shown: PAGE, cur: null };
const count = (k, v) => JOBS.filter(j => j[k] === v).length;
const CATS = [...new Set(JOBS.map(j => j.category))].sort((a, b) => count("category", b) - count("category", a));
const TYPES = TYPE_ORDER.filter(t => JOBS.some(j => j.type === t));
const STATES = [...new Set(JOBS.map(j => j.state))].sort((a, b) => (a === "Not listed") - (b === "Not listed") || a.localeCompare(b));
const hay = JOBS.map(j => [j.title, j.bhTitle, j.category, j.type, j.typeNote, j.state, j.id, j.desc].join(" ").toLowerCase());
$("total").textContent = JOBS.length;
document.querySelectorAll("[data-mail]").forEach(el => { el.textContent = TO; });

// ---- filters (desktop selects + phone sheet) ----
function fillSelect(el, all, list, key) {
  el.innerHTML = `<option value="">${all}</option>` + list.map(v => `<option value="${esc(v)}">${esc(v)} (${count(key, v)})</option>`).join("");
}
fillSelect($("f-cat"), "All categories", CATS, "category");
fillSelect($("f-type"), "All job types", TYPES, "type");
fillSelect($("f-state"), "All states", STATES, "state");
[["f-cat", "cat"], ["f-type", "type"], ["f-state", "state"]].forEach(([id, k]) => $(id).onchange = e => { st[k] = e.target.value; update(); });
function sheetOpts(el, list, key, k) {
  el.innerHTML = [["", "All"], ...list.map(v => [v, v])].map(([v, l]) => `<button class="opt" type="button" data-k="${k}" data-v="${esc(v)}" aria-pressed="${st[k] === v}">${esc(l)}${v ? `<span class="n">${count(key, v)}</span>` : ""}</button>`).join("");
}
function drawSheet() { sheetOpts($("o-cat"), CATS, "category", "cat"); sheetOpts($("o-type"), TYPES, "type", "type"); sheetOpts($("o-state"), STATES, "state", "state"); $("sdone").textContent = `Show ${filtered().length} jobs`; }
$("sheet").addEventListener("click", e => { const b = e.target.closest(".opt"); if (!b) return; st[b.dataset.k] = b.dataset.v; update(); drawSheet(); });
function openSheet() { drawSheet(); $("sheet").hidden = false; $("scrim").hidden = false; $("sdone").focus(); }
function closeSheet() { $("sheet").hidden = true; $("scrim").hidden = true; $("fbtn").focus(); }
$("fbtn").onclick = openSheet; $("scrim").onclick = closeSheet; $("sdone").onclick = closeSheet;
$("sclear").onclick = () => { st.cat = st.type = st.state = ""; update(); drawSheet(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });

// ---- search ----
const qEl = $("q");
qEl.oninput = () => { st.q = qEl.value; $("qclear").hidden = !qEl.value; update(); };
$("qclear").onclick = () => { qEl.value = ""; st.q = ""; $("qclear").hidden = true; update(); qEl.focus(); };
$("sform").onsubmit = e => { e.preventDefault(); qEl.blur(); $("status").scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" }); };
let ex = 0;
function placeholder() { const w = EXAMPLES[ex % EXAMPLES.length]; qEl.placeholder = phone() ? `Try "${w}"` : `Search jobs, e.g. "${w}"`; }
placeholder();
if (!reduced()) setInterval(() => { if (!qEl.value && document.activeElement !== qEl) { ex++; placeholder(); } }, 2600);

function filtered() {
  const words = st.q.toLowerCase().split(/\s+/).filter(Boolean).map(w => w.replace(/^#/, "")).filter(w => w !== "job");
  return JOBS.filter((j, i) => (!st.cat || j.category === st.cat) && (!st.type || j.type === st.type) && (!st.state || j.state === st.state) && words.every(w => hay[i].includes(w)));
}

// ---- your info ----
const info = () => ({ name: store.get("name"), phone: store.get("phone"), email: store.get("email"), jd: JDS[store.get("jd")] || null });
const infoOk = m => m.name && (m.phone || m.email);
let editing = false;

// ---- render list ----
function fmt(d) { const [y, m, dd] = d.split("-"); return new Date(+y, +m - 1, +dd).toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
function paras(t) {
  const lines = t.split("\n").map(l => l.trim()).filter(Boolean);
  const isSub = l => l.length < 60 && /:$/.test(l) || /^(position overview|job summary|about (the|us|the role)|responsibilities|key responsibilities|qualifications|requirements|what we offer|benefits|overview)$/i.test(l);
  let inList = false;
  return lines.map(l => {
    if (isSub(l)) { inList = !/^(position overview|job summary|about|overview)/i.test(l); return `<p class="sub">${esc(l)}</p>`; }
    const bullet = /^[•\-*·▪]/.test(l) || (inList && l.length < 220);
    return bullet ? `<p class="li">${esc(l.replace(/^[•\-*·▪]\s*/, ""))}</p>` : `<p>${esc(l)}</p>`;
  }).join("");
}
function excerpt(t) { return t.split("\n").filter(l => !/^\W*(location|job type|employment type|schedule|hours|position|start date|reports to|work arrangement|classification)\b[^:]*:/i.test(l)).join(" ").replace(/\b(position overview|job summary|job description|about the role|overview)\b:?/gi, " ").replace(/\s+/g, " ").trim().slice(0, 320); }

function update(keepPage) {
  if (!keepPage) st.shown = PAGE;
  const rows = filtered();
  // status + chips
  const chips = [];
  if (st.q.trim()) chips.push(["q", `Search: "${st.q.trim()}"`]);
  if (st.cat) chips.push(["cat", st.cat]);
  if (st.type) chips.push(["type", st.type]);
  if (st.state) chips.push(["state", st.state]);
  $("status").innerHTML = `<span class="count"><b>${rows.length}</b> ${rows.length === 1 ? "job" : "jobs"}</span>` +
    chips.map(([k, l]) => `<button class="chip" type="button" data-k="${k}" aria-label="Remove ${esc(l)}">${esc(l)}<span aria-hidden="true">✕</span></button>`).join("") +
    (chips.length > 1 ? `<button class="linkbtn" type="button" data-k="all">Clear all</button>` : "");
  ["cat", "type", "state"].forEach(k => { const el = $("f-" + (k === "cat" ? "cat" : k)); el.value = st[k]; el.classList.toggle("on", !!st[k]); });
  const nf = [st.cat, st.type, st.state].filter(Boolean).length;
  $("fbadge").hidden = !nf; $("fbadge").textContent = nf;

  const list = $("list");
  if (!rows.length) {
    list.innerHTML = `<li class="empty"><strong>No jobs match yet</strong><span>Try a shorter word, or remove a filter.</span>
      <div class="row">${st.q ? `<button class="copy" type="button" data-k="q">Clear search</button>` : ""}${nf ? `<button class="copy" type="button" data-k="filters">Clear filters</button>` : ""}</div></li>`;
    $("more").hidden = true;
    if (!phone()) renderDetail(null);
    return;
  }
  list.innerHTML = rows.slice(0, st.shown).map(j => `
    <li><button class="item" type="button" data-id="${esc(j.id)}" aria-current="${st.cur === j.id}">
      <h3>${esc(j.title)}</h3>
      <div class="meta"><span class="cat">${esc(j.category)}</span><span>${esc(j.typeNote || j.type)}</span><span>${esc(j.state)}</span></div>
      ${j.desc ? `<p class="ex">${esc(excerpt(j.desc))}</p>` : ""}
      <div class="meta"><span>Job #${esc(j.id)}</span><span>Posted ${fmt(j.added)}</span></div>
    </button></li>`).join("");
  $("more").hidden = rows.length <= st.shown;
  $("more").textContent = `Show more jobs (${rows.length - st.shown} more)`;
  if (!phone() && (!st.cur || !rows.some(j => j.id === st.cur))) select(rows[0].id, false);
}
$("more").onclick = () => { st.shown += PAGE; update(true); };
document.addEventListener("click", e => {
  const c = e.target.closest("[data-k]"); if (!c || c.closest(".sheet")) return;
  const k = c.dataset.k;
  if (k === "q") { qEl.value = ""; st.q = ""; $("qclear").hidden = true; }
  else if (k === "filters") { st.cat = st.type = st.state = ""; }
  else if (k === "all") { qEl.value = ""; st.q = ""; $("qclear").hidden = true; st.cat = st.type = st.state = ""; }
  else if (["cat", "type", "state"].includes(k)) st[k] = "";
  else return;
  update();
});
$("list").addEventListener("click", e => { const b = e.target.closest(".item"); if (b) select(b.dataset.id, true); });

// ---- detail ----
function select(id, user) {
  st.cur = id; editing = false;
  document.querySelectorAll(".item").forEach(b => b.setAttribute("aria-current", b.dataset.id === id));
  renderDetail(JOBS.find(j => j.id === id));
  $("detail").scrollTop = 0;
  if (user && phone()) { if (location.hash !== "#job-" + id) location.hash = "job-" + id; else openView(); }
}
function openView() { document.body.classList.add("viewing"); $("detail").scrollTop = 0; $("back").focus({ preventScroll: true }); }
function closeView() { document.body.classList.remove("viewing"); const b = document.querySelector(`.item[data-id="${st.cur}"]`); if (b) b.focus({ preventScroll: true }); }
$("back").onclick = () => { if (location.hash.startsWith("#job-")) history.back(); else closeView(); };
addEventListener("hashchange", route);
function route() {
  const m = location.hash.match(/^#job-(\d+)$/);
  if (m && JOBS.some(j => j.id === m[1])) {
    if (st.cur !== m[1]) { st.cur = m[1]; renderDetail(JOBS.find(j => j.id === m[1])); document.querySelectorAll(".item").forEach(b => b.setAttribute("aria-current", b.dataset.id === m[1])); }
    if (phone()) openView();
  } else if (document.body.classList.contains("viewing")) closeView();
}

  </div>
  <div class="step">

function renderDetail(j) {

  $("dbody").innerHTML = `

      <a class="apply inbox" href="#" id="apply" role="button">${label(m)}</a>

  $("papply").innerHTML = label(m);
  if (!ok) ["i-name", "i-phone", "i-email"].forEach(id => {
    const el = $(id); el.addEventListener("input", () => {
      store.set(id.slice(2), el.value.trim()); el.classList.remove("bad");
      const mm = info(); $("apply").innerHTML = label(mm); $("papply").innerHTML = label(mm);
    });
  });
  const ed = $("edit"); if (ed) ed.onclick = () => { editing = true; renderDetail(j); $("i-name").focus(); };
}

// ---- apply ----
function message(j, m) {
  const subject = `Applying for Job #${j.id} - ${j.title}` + (m.jd ? ` (JD: ${m.jd[0]})` : "");
  const body = [`Hi SBH team,`, ``, `I would like to apply for Job #${j.id}: ${j.title}.`, ``,
    `Name: ${m.name}`, `Phone: ${m.phone || "-"}`, `Email on file: ${m.email || "-"}`,
    `My job developer: ${m.jd ? m.jd[1] : "None / not sure"}`, ``, `I have attached my resume if I have an updated one.`, ``, `Thank you!`].join("\n");
  return m.jd ? { subject, body, to: m.jd[2], cc: TO } : { subject, body, to: TO, cc: "" };
}
const mailto = g => `mailto:${g.to}?` + (g.cc ? `cc=${encodeURIComponent(g.cc)}&` : "") + `subject=${encodeURIComponent(g.subject)}&body=${encodeURIComponent(g.body)}`;
const plain = g => `To: ${g.to}\n` + (g.cc ? `CC: ${g.cc}\n` : "") + `Subject: ${g.subject}\n\n${g.body}`;
function doApply(e, link) {
  const j = JOBS.find(x => x.id === st.cur); if (!j) return;
  const m = info(); const slot = $("slot");
  if (!infoOk(m)) {
    if (e) e.preventDefault();
    if (!$("i-name")) { editing = true; renderDetail(j); }
    const need = !m.name ? ["i-name"] : ["i-phone", "i-email"];
    need.forEach(id => $(id).classList.add("bad"));
    $("slot").innerHTML = `<p class="warnmsg">Please add your name and a phone number or email above, then tap Apply again.</p>`;
    $("applybox").scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" });
    setTimeout(() => $(need[0]).focus({ preventScroll: true }), 300);
    return;
  }
  const g = message(j, m);
  if (editing) { editing = false; renderDetail(j); if (e) e.preventDefault(); location.href = mailto(g); }
  else if (link) link.href = mailto(g); else location.href = mailto(g);
  $("slot").innerHTML = `<div class="after"><p>Your email app should open with this message ready. Attach your resume if you have a new one, then press Send.</p>
    <p>If no email opened, copy this message and send it to <span class="sel">${g.to}</span>${g.cc ? `, with <span class="sel">${g.cc}</span> on CC` : ""}.</p>
    <pre id="msgtext">${esc(plain(g))}</pre><button class="copy" type="button" id="copy">Copy message</button></div>`;
  $("copy").onclick = async () => {
    const b = $("copy");
    try { await navigator.clipboard.writeText(plain(g)); b.textContent = "Copied"; }
    catch (err) { const r = document.createRange(); r.selectNodeContents($("msgtext")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected. Press Copy"; }
    setTimeout(() => { b.textContent = "Copy message"; }, 2500);
  };
  if (phone()) $("slot").scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "center" });
}
$("dbody").addEventListener("click", e => {
  const jb = e.target.closest(".jdbtn");
  if (jb) {
    store.set("jd", jb.dataset.jd); store.set("jdset", "1");
    document.querySelectorAll(".jdbtn").forEach(b => b.setAttribute("aria-checked", b === jb));
    const mm = info(); $("apply").innerHTML = label(mm); $("papply").innerHTML = label(mm);
    return;
  }
  const a = e.target.closest("#apply"); if (a) doApply(e, a);
});
$("papply").onclick = () => doApply(null, null);

// ---- sticky toolbar: hide on scroll down, show on scroll up (phones) ----
let lastY = scrollY;
addEventListener("scroll", () => {
  const y = scrollY, tb = $("toolbar"), top = tb.getBoundingClientRect().top;
  tb.classList.toggle("stuck", top <= 1 && y > 40);
  if (phone() && y > 260 && y > lastY + 6 && document.activeElement !== qEl) tb.classList.add("hide");
  else if (y < lastY - 6 || y < 260) tb.classList.remove("hide");
  lastY = y;
}, { passive: true });
addEventListener("resize", () => { if (!phone()) { document.body.classList.remove("viewing"); if (!st.cur) update(true); } });

update();
route();
</script>
