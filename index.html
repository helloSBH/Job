ponding purchase orders and commercial invoices.\n\n\tInvestigate and resolve discrepancies involving pricing, damaged merchandise, shortages, overages, and duplicate invoices.\n\n\tCoordinate with vendors and warehouse teams to obtain corrections and credit memos.\n\n\tTrack landed costs, including freight, customs duties, brokerage fees, insurance, and other related expenses.\n\n\tAllocate applicable costs to purchase orders and SKUs to support accurate inventory valuation.\n\n\tReview freight, logistics, and customs broker invoices against approved quotes and agreements.\n\n\tForward properly matched and approved invoices to Accounts Payable with complete supporting documentation.\n\n\tMonitor invoice due dates and payment terms.\n\n\tTrack purchase price variances and communicate significant differences to the finance team.\n\nMonth-End Close & Reporting\n\n\tMonitor open purchase orders and identify outstanding or incomplete transactions.\n\n\tTrack goods received but not yet invoiced to support accurate accounting accruals.\n\n\tPrepare open purchase order reports and goods-in-transit listings.\n\n\tAssist the finance department with month-end closing procedures.\n\n\tEnsure completed purchase orders are properly reconciled and closed.\n\n\tInvestigate aged open items and outstanding invoice discrepancies.\n\n\tMaintain complete, organized, and audit-ready documentation for each purchase order.\n\n\tSupport financial accuracy by ensuring purchasing, inventory, and payment records remain consistent.\n\nQualifications\n\n\tMinimum 3 years of experience in supply chain coordination, purchasing, or product costing required.\n\n\tExperience within consumer goods, general merchandise, importing, or distribution strongly preferred.\n\n\tAdvanced Microsoft Excel proficiency required, including PivotTables and XLOOKUP.\n\n\tWorking knowledge of the purchase-to-pay process, including three-way matching, accruals, and basic accounting principles.\n\n\tExperience using ERP or accounting software, such as NetSuite, QuickBooks, or similar systems.\n\n\tFamiliarity with international shipping and import documentation, including bills of lading, commercial invoices, packing lists, and customs entries.\n\n\tUnderstanding of Incoterms and global supply chain logistics.\n\n\tKnowledge of inventory costing, landed costs, and purchasing reconciliation.\n\n\tExceptional organizational skills and attention to detail.\n\n\tStrong analytical and problem-solving abilities.\n\n\tExcellent written and verbal communication skills.\n\n\tAbility to manage multiple vendor relationships and coordinate across departments.\n\n\tComfortable working under tight deadlines, including month-end financial cutoffs.\n\n\tAbility to work independently while collaborating effectively with purchasing, operations, logistics, and finance teams."}, {"id": "26907", "title": "Office Driver & General Office Assistant", "bhTitle": "Assistant - Office Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-19", "exp": "2027-01-19", "desc": "Employment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nA company is seeking a responsible, trustworthy, and dependable Office Driver & General Office Assistant to support daily business operations.\n\nThis hands-on position combines driving, deliveries, transportation services, errands, and general administrative responsibilities.\n\nThe ideal candidate is organized, punctual, flexible, and willing to assist with a variety of tasks to ensure the office operates efficiently.\n\nKey Responsibilities\n\nDriving & Transportation\n\n\tDrive to various locations to complete company-related deliveries and pickups.\n\n\tTransport company personnel and other individuals safely and professionally as needed.\n\n\tPick up and deliver packages, documents, supplies, and other business-related items.\n\n\tComplete errands and miscellaneous tasks outside the office.\n\n\tPlan efficient routes and manage transportation schedules.\n\n\tEnsure all deliveries and pickups are completed accurately and on time.\n\n\tMaintain a professional and courteous attitude when transporting individuals or interacting with vendors.\n\nGeneral Office & Administrative Support\n\n\tAssist with general office responsibilities when not driving.\n\n\tOrganize, file, and maintain paperwork and business documents.\n\n\tHelp prepare, sort, and distribute documents and office materials.\n\n\tPerform basic computer work and administrative tasks.\n\n\tAssist with organizing office supplies and maintaining an orderly workspace.\n\n\tSupport staff with daily office projects and operational needs.\n\n\tHelp coordinate deliveries, pickups, and other logistical tasks.\n\n\tComplete additional assignments as directed by management.\n\nCommunication & Coordination\n\n\tCommunicate professionally with employees, customers, vendors, and other contacts.\n\n\tFollow written and verbal instructions accurately.\n\n\tProvide updates regarding deliveries, transportation, and assigned tasks.\n\n\tCoordinate with office staff to ensure daily responsibilities are completed efficiently.\n\n\tHandle company documents and information with discretion and confidentiality.\n\nQualifications\n\n\tValid driver's license and clean driving record required.\n\n\tResponsible, honest, trustworthy, and dependable.\n\n\tStrong reading, writing, and communication skills.\n\n\tComfortable following written instructions and handling basic paperwork.\n\n\tBasic computer skills and ability to perform general office tasks.\n\n\tStrong organizational and time-management abilities.\n\n\tPunctual, reliable, and detail-oriented.\n\n\tProfessional, courteous, and respectful when transporting individuals.\n\n\tAbility to work independently and manage multiple responsibilities.\n\n\tFlexible attitude and willingness to assist wherever needed.\n\n\tPrevious driving, delivery, or general office experience preferred but not required."}, {"id": "26906", "title": "Live Sales & E-Commerce Associate – Brooklyn, NY", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-10-19", "exp": "2027-01-14", "desc": "A Brooklyn-based company selling custom jewelry, toys, electronics, and more is looking for a motivated, tech-savvy individual to manage online sales through platforms such as Whatnot, TikTok Shop, and LiveSelling platforms.\n\nResponsibilities & Requirements:\n\n\tHost or assist with live selling sessions, including evening hours.\n\n\tManage online sales and e-commerce operations.\n\n\tMust have experience with online selling or e-commerce.\n\n\tMust be proficient in Excel.\n\n\tOpen to part-time or full-time candidates, including students available after school.\n\nLocation: Brooklyn, NY\nSchedule: Flexible, with evening hours available"}, {"id": "26905", "title": "Driver", "bhTitle": "Driver", "category": "Warehouse, Driving & Logistics", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-19", "exp": "2026-12-31", "desc": "We are seeking a reliable, professional, and highly discreet driver to provide transportation.\n\nQualifications:\n\n\tExcellent driving record and safe driving habits\n\n\tPunctual, dependable, and professional\n\n\tMust maintain the highest level of discretion and confidentiality\n\n\tRespectful of privacy and sensitive schedules\n\n\tFlexible with scheduling as needed\n\nSchedule can vary from day to day"}, {"id": "26904", "title": "Packaging Designer", "bhTitle": "Designer", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-19", "exp": "2027-01-04", "desc": "Job Description\nA fashion accessories/consumer products company in Midtown Manhattan is seeking an experienced and creative Packaging Designer to design packaging for hair accessories, handbags, gifting products, and more. The ideal candidate is detail-oriented and has a strong eye for design.\n\nPosition Type: Full-Time\nJob Hours: In-office 4 days per week, Work from home on Fridays\n\nEssential Duties & Responsibilities\n\n\tDesign packaging for hair accessories, including product cards and displays.\n\tDesign hang tags for handbags and other fashion accessories.\n\tCreate packaging for gift items and other products.\n\tDevelop creative, visually appealing designs while maintaining brand consistency.\n\tEnsure designs are accurate and detail-oriented.\n\tCollaborate with the team to develop packaging concepts and final designs.\n\nQualifications & Requirements\n\n\tMid- to senior-level packaging design experience.\n\tStrong creativity and attention to detail.\n\tExperience designing retail packaging, product cards, hang tags, or gift packaging.\n\tStrong understanding of layout, typography, and product presentation.\n\tAbility to manage multiple projects and meet deadlines."}, {"id": "26903", "title": "Livestream Host / On-Camera Sales Representative", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Part Time", "typeNote": "", "state": "NJ", "added": "2026-10-19", "exp": "2027-01-19", "desc": "Employment Type: Part-Time\nSchedule: Flexible, Approximately 3–5 Hours per Day\nPlatforms: TikTok Live, Whatnot & eBay Live\n\nPosition Overview\n\nA growing e-commerce company is seeking a fun, energetic, and outgoing Part-Time Livestream Host / On-Camera Sales Representative to lead engaging live shopping broadcasts across TikTok, Whatnot, eBay Live, and other live-commerce platforms.\n\nThe ideal candidate is confident on camera, enjoys interacting with people, and has the personality and enthusiasm to keep viewers entertained while showcasing products and driving sales.\n\nNo previous influencer or livestream hosting experience is required. Candidates with backgrounds in sales, retail, customer service, acting, or public speaking are encouraged to apply.\n\nThis is an excellent opportunity for someone who enjoys being on camera, has strong communication skills, and wants to develop a career in the growing live-commerce industry.\n\nKey Responsibilities\n\nLivestream Hosting & Product Demonstrations\n\n\tHost engaging live shopping broadcasts for approximately 3–5 hours per day.\n\n\tPresent, demonstrate, and discuss products in an entertaining and informative manner.\n\n\tExplain product features, benefits, and key selling points to viewers.\n\n\tMaintain a confident, energetic, and professional on-camera presence.\n\n\tCreate an enjoyable and welcoming livestream shopping experience.\n\n\tKeep broadcasts engaging through conversation, demonstrations, and audience interaction.\n\n\tLearn product details and communicate information clearly and accurately.\n\nAudience Engagement & Sales\n\n\tInteract with viewers and answer questions in real time.\n\n\tEncourage audience participation and build relationships with returning viewers.\n\n\tHighlight product promotions, special offers, and featured merchandise.\n\n\tHelp convert viewer interest into purchases through effective product presentations.\n\n\tRespond quickly and confidently to audience questions and comments.\n\n\tMaintain enthusiasm and audience engagement throughout extended broadcasts.\n\nTeam Collaboration & Performance\n\n\tCollaborate with the e-commerce and sales teams to prepare for livestream sessions.\n\n\tLearn about new products and upcoming promotions.\n\n\tAssist with developing creative ideas to improve livestream content and engagement.\n\n\tWork with team members to improve broadcast performance and sales results.\n\n\tProvide feedback on customer questions, product interest, and viewer engagement.\n\nQualifications\n\n\tOutgoing, confident, and energetic personality required.\n\n\tComfortable speaking on camera for extended periods.\n\n\tExcellent verbal communication and interpersonal skills.\n\n\tAbility to think quickly, engage viewers, and maintain entertaining conversations.\n\n\tStrong enthusiasm for products, sales, and customer interaction.\n\n\tDependable, punctual, and comfortable following a livestream schedule.\n\n\tAbility to learn product information and communicate key selling points.\n\n\tPrevious experience in sales, retail, customer service, acting, hosting, or public speaking is a plus.\n\n\tFamiliarity with TikTok, Instagram, Whatnot, eBay Live, or other livestream platforms is preferred but not required.\n\n\tWillingness to learn and adapt to new livestream techniques and sales strategies."}, {"id": "26902", "title": "Brand New Brooklyn location", "bhTitle": "Manager", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-19", "exp": "2026-12-31", "desc": "Discount Store looking to hire cahiers/ assistant manager.\n\n2 different shifts available."}, {"id": "26900", "title": "Nanny / House Assistant", "bhTitle": "Babysitter/Nanny", "category": "Education & Childcare", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-19", "exp": "2027-01-19", "desc": "Employment Type: Part-Time / Flexible\nSchedule: Monday, Tuesday & Thursday\nHours: Approximately 20–28 Hours per Week\n\nPosition Overview\n\nA family is seeking a warm, responsible, and experienced Nanny / House Assistant to provide childcare and assist with daily household responsibilities.\n\nThe primary focus of this position is caring for two children, ages 6 and 3½, with occasional assistance caring for an infant. The infant is primarily cared for by the family's housekeeper.\n\nIn addition to childcare, the nanny will help with grocery shopping, meal preparation, and household organization while the children are at school.\n\nThe ideal candidate is dependable, nurturing, organized, and comfortable balancing childcare with light household responsibilities.\n\nSchedule\n\nMonday, Tuesday & Thursday:\n\n\tTypical Hours: 12:00 PM–6:00/7:00 PM\n\n\tApproximately 20–28 hours per week.\n\n\tSome days may begin as late as 3:00 PM.\n\n\tSome evenings may end around 5:00 PM, while others may extend until 8:00 PM.\n\n\tFlexibility with scheduling is important.\n\nKey Responsibilities\n\nChildcare & Daily Routines\n\n\tProvide attentive, loving, and responsible care for children ages 6 and 3½.\n\n\tPick up children from school and assist with their afternoon routines.\n\n\tPrepare and serve dinner for the children.\n\n\tAssist with bath time and evening routines.\n\n\tPlan engaging, age-appropriate activities, games, and creative projects.\n\n\tEncourage positive behavior, independence, and age-appropriate development.\n\n\tOccasionally assist with infant care when needed.\n\n\tMaintain a safe, nurturing, and supportive environment for the children.\n\nHousehold Assistance\n\n\tAssist with grocery shopping and household errands.\n\n\tHelp with cooking and meal preparation for the family.\n\n\tOrganize household items and maintain tidy living spaces.\n\n\tAssist with general household organization and daily upkeep.\n\n\tComplete household tasks while the children are at school.\n\n\tCoordinate with the family and housekeeper to ensure daily routines run smoothly.\n\nQualifications\n\n\tPrevious childcare or nanny experience required.\n\n\tExperience caring for preschool and school-aged children.\n\n\tWarm, patient, nurturing, and responsible personality.\n\n\tStrong organizational and time-management skills.\n\n\tComfortable assisting with cooking, groceries, and household organization.\n\n\tAbility to manage multiple responsibilities efficiently.\n\n\tDependable, punctual, and trustworthy.\n\n\tGood communication skills and ability to follow family routines.\n\n\tFlexibility with working hours and occasional schedule adjustments.\n\n\tExperience caring for infants is a plus."}, {"id": "26899", "title": "Job Description: Full Time Early Intervention and CPSE Intake Coordinator", "bhTitle": "Intake", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-16", "exp": "2026-12-31", "desc": "-Hours: Monday-Thursday 8:30-4:30 pm Friday 8:30-230 pm\n\nPosition Overview: We are seeking an organized, compassionate professional to coordinate intake, referrals, evaluations, and meetings for children and families receiving Early Intervention (EI) and Committee on Preschool Special Education (CPSE) services. The ideal candidate will have a background in education, social work, or a related clinical field.\n\n\tKey Responsibilities\n\n\tRespond to family and referral inquiries and guide families through the intake process.\n\tCoordinate multidisciplinary evaluations (MDEs), IFSP meetings, and IEP meetings with families, providers, evaluators, and schools.\n\tConduct evaluations and participate in meetings as permitted by professional credentials and program requirements.\n\tConduct school observations as needed.\n\tCollect and maintain intake forms, medical records, consents, and other required documentation.\n\tTrack deadlines and ensure timely completion of evaluations and paperwork.\n\tServe as a liaison among families, providers, schools, and case managers.\n\tMaintain confidentiality and compliance with applicable regulations.\n\tProvide ongoing guidance and support to families throughout the intake process.\n\n\tQualifications\n\n\tDegree in Special Education, Social Work, Occupational Therapy, Speech-Language Pathology, Physical Therapy, or  School Psychology.\n\t5 Years' experience in early childhood education, special education, or a related setting.\n\tFamiliarity with EI/CPSE services, including home- and school-based programs.\n\tStrong communication, organizational, scheduling, and time-management skills.\n\tAbility to manage sensitive information confidentially and maintain accurate records.\n\tIntake, scheduling, or coordination experience preferred.\n\tBilingual candidates are a plus.\n\n\tTraining Provided\n\tJoin a team dedicated to supporting children and families in accessing appropriate developmental and educational services."}, {"id": "26898", "title": "Job Description: Full Time School Curriculum Coordinator", "bhTitle": "Coordinator", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-16", "exp": "2026-12-31", "desc": "Hours: Monday-Thursday 8:30-4:30 pm Friday 8:30-2:30 pm\nPosition Overview: The School Curriculum Coordinator supports the daily operations, educational programming, and overall success of the school. Working closely with teachers, classroom assistants, related service providers, and school leadership, this individual ensures that classrooms are appropriately staffed, educational standards are maintained, and staff receive the guidance and resources they need to succeed. This is a hands-on leadership role requiring flexibility, initiative, and strong organizational and interpersonal skills.\nKey Responsibilities\n\n\tCurriculum & Instruction: Coordinate curriculum planning meetings, support alignment with Common Core State Standards, facilitate curriculum updates and STEAM initiatives, and review lesson plans, progress reports, and any other teacher documentation.\n\tDaily Operations & Coverage: Oversee arrivals and dismissals; coordinate substitute assignments and assistant coverage; reassign staff as needed; and provide direct classroom coverage to ensure every classroom has appropriate support.\n\tTeacher Support & Observations: Support teachers with curriculum implementation, classroom setup, behavior management, and other areas of need. Conduct classroom observations, provide constructive feedback, and follow up to support professional growth.\n\tStaff Training & Supervision: Facilitate professional development and trainings for teachers and assistants, supervise and train classroom assistants, and lead assistant PD meetings.\n\tSchool Events & Communication: Coordinate with teachers on parent events and special activities, and promote effective communication and collaboration among staff and leadership.\n\tMaterials & Resources: Coordinate classroom supplies, educational materials, resources, and food orders to meet the needs of the school.\n\tAdditional Responsibilities: Proactively respond to changing priorities and take on other responsibilities as needed to ensure the smooth and effective functioning of the school.\n\nQualifications & Skills\nRequired Qualification: NYS Special Education Teaching Certification (Birth–Grade 2).\n\n\tExperience in education, school administration, curriculum coordination, or a related field.\n\tStrong leadership, organizational, communication, and problem-solving skills.\n\tKnowledge of curriculum planning, instructional practices, and classroom management.\n\t12 days PTO"}, {"id": "26897", "title": "Office Assistant", "bhTitle": "Assistant - Office Assistant", "category": "Administrative & Office", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-15", "exp": "2027-01-18", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\nSchedule: Sundays + 2–3 Additional Days per Week\nHours: 10:00 AM–7:00 PM or 11:00 AM–7:00 PM\n\nPosition Overview\n\nA busy eye doctor's office in Boro Park is seeking a friendly, dependable, and organized Office Assistant to help with daily administrative responsibilities, customer service, insurance-related tasks, and data entry.\n\nThe office also sells eyeglasses and lenses, providing an opportunity to assist customers with their eyewear needs.\n\nThis is an excellent opportunity for someone looking for a part-time position in a pleasant and welcoming office environment. Training can be provided, and college students are welcome to apply.\n\nThe office may consider hiring two candidates to alternate workdays.\n\nKey Responsibilities\n\nFront Desk & Customer Service\n\n\tAnswer incoming phone calls and assist patients and customers professionally.\n\n\tGreet visitors and provide a friendly, welcoming experience.\n\n\tRespond to general inquiries and direct questions to the appropriate staff members.\n\n\tAssist with basic front desk and office responsibilities.\n\n\tHelp maintain an organized and efficient office environment.\n\nAdministrative & Insurance Support\n\n\tPerform basic computer work and data entry.\n\n\tEnter, update, and maintain accurate patient and customer information.\n\n\tAssist with insurance-related paperwork and administrative tasks.\n\n\tOrganize documents and maintain office records.\n\n\tSupport staff with general administrative duties as needed.\n\n\tEnsure information is handled accurately and confidentially.\n\nEyewear & Optical Assistance\n\n\tAssist customers interested in purchasing eyeglasses and lenses.\n\n\tProvide basic information about available eyewear products.\n\n\tHelp customers with general questions regarding glasses and lenses.\n\n\tCoordinate with office staff to ensure customers receive appropriate assistance.\n\n\tSupport the daily operations of the office's eyewear sales area.\n\nQualifications\n\n\tBasic computer and data entry skills required.\n\n\tGood communication and telephone skills.\n\n\tFriendly, professional, and customer-service-oriented attitude.\n\n\tStrong organizational skills and attention to detail.\n\n\tDependable, punctual, and responsible.\n\n\tWillingness to learn new office procedures and systems.\n\n\tAbility to multitask in a busy office environment.\n\n\tPrevious office, receptionist, or customer service experience preferred but not required.\n\n\tExperience with insurance or optical office operations is a plus.\n\n\tCollege students are welcome to apply."}, {"id": "26894", "title": "Product Development Coordinator", "bhTitle": "Product Development", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-15", "exp": "2027-01-18", "desc": "Employment Type: Full-Time\nExperience Required: Minimum 2 Years\n\nPosition Overview\n\nA growing company specializing in consumer products is seeking a motivated, detail-oriented, and organized Product Development Coordinator to join its team.\n\nThe ideal candidate has at least 2 years of product development experience, preferably within the consumer products, apparel, or accessories industries.\n\nThis role involves coordinating the product development process from initial concept through production, communicating with overseas factories and vendors, managing samples, and ensuring that product timelines and specifications are met.\n\nThe successful candidate will be proactive, highly organized, and comfortable managing multiple projects in a fast-paced environment.\n\nKey Responsibilities\n\nProduct Development & Coordination\n\n\tAssist in developing new products from initial concept through production.\n\n\tCoordinate product development activities with overseas factories, vendors, and internal departments.\n\n\tManage product samples, revisions, approvals, and development updates.\n\n\tTrack product development timelines and ensure key deadlines are met.\n\n\tMaintain accurate product specifications, costing information, and development records.\n\n\tAssist with reviewing product quality, materials, packaging, and specifications.\n\n\tFollow up with factories and suppliers regarding product updates, changes, and outstanding requirements.\n\n\tHelp identify and resolve product development issues to keep projects moving forward.\n\nVendor & Factory Communication\n\n\tCommunicate regularly with overseas factories and suppliers regarding product development.\n\n\tCoordinate sample requests, revisions, and approvals.\n\n\tMonitor production readiness and ensure product specifications are clearly communicated.\n\n\tMaintain organized records of vendor correspondence and development progress.\n\n\tWork closely with suppliers to address delays, discrepancies, and product-related concerns.\n\nCross-Functional Collaboration & Market Research\n\n\tCollaborate with design, sales, and production teams throughout the development process.\n\n\tResearch market trends, emerging products, and competitive offerings.\n\n\tAssist in identifying new product opportunities and improvements.\n\n\tSupport the preparation of product presentations, specifications, and development materials.\n\n\tEnsure internal teams remain informed of project updates and deadlines.\n\nQualifications\n\n\tMinimum 2 years of product development experience required.\n\n\tExperience in consumer products, apparel, or accessories preferred.\n\n\tExperience coordinating with overseas factories and vendors is a plus.\n\n\tStrong organizational skills and exceptional attention to detail.\n\n\tExcellent communication, coordination, and follow-up abilities.\n\n\tProficiency in Microsoft Excel and Outlook.\n\n\tAbility to manage multiple projects and priorities simultaneously.\n\n\tStrong problem-solving skills and ability to meet deadlines.\n\n\tComfortable working in a fast-paced, deadline-driven environment.\n\n\tAbility to work independently while collaborating effectively with internal teams.\n\n\tProactive, dependable, and eager to contribute to a growing organization."}, {"id": "26892", "title": "Computer Science / Technology Instructor – High School", "bhTitle": "Computer Programmer", "category": "Technology & IT", "type": "Part Time", "typeNote": "", "state": "NJ", "added": "2026-10-14", "exp": "2027-01-14", "desc": "Employment Type: Part-Time\nSchedule: Thursdays\n\nPosition Overview\n\nA high school is seeking a knowledgeable, enthusiastic, and engaging Computer Science / Technology Instructor to teach weekly computer classes to 9th and 10th grade students.\n\nThe ideal candidate is passionate about technology, enjoys working with high school students, and can make computer-related subjects interesting, interactive, and accessible.\n\nThere is also an opportunity to lead an additional after-school technology club focused on coding, computer projects, or other hands-on activities.\n\nSchedule\n\nThursdays:\n\n\t10th Grade: 1:20 PM–2:00 PM\n\n\t9th Grade: 2:05 PM–2:45 PM\n\n\tOptional Technology Club: 3:05 PM–3:50 PM\n\nKey Responsibilities\n\nComputer & Technology Instruction\n\n\tTeach engaging and age-appropriate computer classes to 9th and 10th grade students.\n\n\tIntroduce students to practical computer skills, technology concepts, and digital literacy.\n\n\tDevelop interactive lessons that encourage participation and hands-on learning.\n\n\tExplain technical concepts in a clear, approachable, and engaging manner.\n\n\tAdapt instruction to accommodate varying levels of computer knowledge and experience.\n\n\tMaintain a positive, structured, and productive classroom environment.\n\n\tEncourage curiosity, creativity, and problem-solving through technology.\n\nOptional After-School Technology Club\n\n\tLead an optional computer-related club following regular classes.\n\n\tIntroduce students to coding, programming, and technology-based projects.\n\n\tOrganize interactive activities that promote creativity and technical skills.\n\n\tDevelop engaging projects that allow students to apply what they have learned.\n\n\tExplore topics such as computer programming, digital design, or other technology-related interests.\n\nQualifications\n\n\tStrong knowledge of computers, technology, or computer science.\n\n\tPrevious teaching, tutoring, or instructional experience preferred.\n\n\tComfortable teaching and engaging high school students.\n\n\tAbility to explain technical concepts clearly and effectively.\n\n\tStrong classroom management and communication skills.\n\n\tCreative, patient, enthusiastic, and dependable.\n\n\tExperience with coding or computer programming is a plus.\n\n\tAbility to develop interactive and hands-on learning activities.\n\n\tAvailability on Thursdays during the scheduled class periods."}, {"id": "26891", "title": "Shipping and Order Routing Coordinator", "bhTitle": "Warehouse- Shipping", "category": "Warehouse, Driving & Logistics", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-14", "exp": "2027-01-14", "desc": "Location: Oakhurst, NJ\nJob Type: Full Time\nSchedule: Typical Office Hours\n\nWe are seeking an organized, detail-oriented person to handle order routing and shipping for our wholesale company. The ideal candidate has experience with EDI, retailer shipping requirements, and coordinating wholesale orders.\nKey Responsibilities:\n\n\tProcess wholesale orders and arrange shipments according to customer routing instructions.\n\tWork with EDI orders, advance ship notices (ASNs), and shipping documents.\n\tFollow retailer requirements for labeling, packaging, delivery appointments, and shipping deadlines.\n\tSchedule pickups with carriers and freight companies.\n\tCoordinate with warehouse, sales, and customer service staff to resolve shipping issues.\n\tTrack shipments, maintain accurate records, and help prevent shipping errors and chargebacks.\n\nQualifications:\n\n\tPrevious experience in wholesale shipping, order routing, or logistics.\n\tFamiliarity with EDI systems and retailer routing guides.\n\tStrong attention to detail and organizational skills.\n\tAbility to handle multiple orders and meet deadlines.\n\tBasic computer skills, including Microsoft Excel, with experience in order management software preferred.\n\nWhat We Offer:\n\n\tComprehensive benefits.\n\tOpportunities for growth within a collaborative wholesale environment."}, {"id": "26890", "title": "Associate Attorney", "bhTitle": "Attorney", "category": "Legal", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-14", "exp": "2027-01-14", "desc": "Employment Type: Full-Time\nExperience Level: Experienced Associate / Lateral Hire\n\nPosition Overview\n\nAn established law firm is seeking qualified Associate Attorneys to join its legal team through lateral hiring.\n\nThe firm is interested in experienced attorneys from the Class of 2023 or earlier who are looking to advance their legal careers in a professional and collaborative environment.\n\nCandidates will have the opportunity to meet with current attorneys as part of the initial screening and evaluation process.\n\nPlease note: This position is intended for experienced attorneys. Recent law school graduates are not being considered at this time.\n\nKey Responsibilities\n\n\tHandle legal research, analysis, and drafting assignments.\n\n\tDraft, review, and revise legal documents, agreements, motions, and correspondence as applicable.\n\n\tAssist with managing client matters and ongoing legal projects.\n\n\tCommunicate professionally with clients, colleagues, and other parties.\n\n\tCollaborate with partners and senior attorneys on legal matters.\n\n\tManage multiple assignments while meeting deadlines.\n\n\tProvide thoughtful legal analysis and practical recommendations.\n\n\tMaintain high standards of professionalism, confidentiality, and attention to detail.\n\nQualifications\n\n\tJuris Doctor (J.D.) degree from an accredited law school required.\n\n\tLaw school graduating Class of 2023 or earlier.\n\n\tPrior experience practicing law in a law firm or comparable legal environment.\n\n\tStrong legal research, writing, and analytical skills.\n\n\tExcellent communication and interpersonal abilities.\n\n\tAbility to manage assignments independently and collaborate with other attorneys.\n\n\tStrong organizational skills and attention to detail.\n\n\tProfessional judgment and commitment to high-quality legal work.\n\n\tAppropriate bar admission or eligibility for admission, depending on the firm's requirements."}, {"id": "26889", "title": "Social Media Manager", "bhTitle": "Social Media Manager", "category": "E-commerce, Marketing & Social Media", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-14", "exp": "2027-01-14", "desc": "Employment Type: Part-Time, Hybrid\nWork Arrangement: In-Office / Remote\nSchedule: Approximately 10–15 Hours per Week\n\nPosition Overview\n\nA community-based mental health agency is seeking a creative, experienced, and detail-oriented Social Media Manager to develop engaging educational videos and professional marketing materials.\n\nThe ideal candidate has a strong eye for branding, experience filming and editing short-form video content, and the ability to create visually appealing graphics for social media and digital marketing campaigns.\n\nThis position offers a flexible hybrid schedule and the opportunity to contribute to meaningful mental health education and community outreach initiatives.\n\nKey Responsibilities\n\nVideo Production & Social Media Content\n\n\tFilm and edit short-form educational videos for Instagram and other social media platforms.\n\n\tCreate engaging Instagram Reels and other video content focused on mental health awareness and education.\n\n\tCapture professional-quality video using an iPhone or other filming equipment.\n\n\tEdit videos to ensure clear messaging, professional presentation, and strong visual appeal.\n\n\tDevelop creative content ideas that align with the agency's mission and branding.\n\n\tCollaborate with team members to plan and produce educational content.\n\n\tEnsure all videos maintain a consistent and professional brand image.\n\nGraphic Design & Digital Marketing\n\n\tDesign attractive and professional advertisement graphics for email and text message campaigns.\n\n\tCreate branded promotional materials for community programs, events, and educational initiatives.\n\n\tUse Canva to develop visually appealing graphics and marketing content.\n\n\tMaintain consistent branding across social media, email campaigns, and digital advertisements.\n\n\tAssist with creative marketing projects and promotional initiatives as needed.\n\nBranding & Content Development\n\n\tDevelop creative ideas to strengthen the agency's digital presence.\n\n\tEnsure all content is visually consistent, informative, and appropriate for a mental health organization.\n\n\tStay current with Instagram trends, short-form video formats, and digital content strategies.\n\n\tWork collaboratively with agency leadership to communicate important educational messages.\n\n\tOrganize content projects and complete assignments within established deadlines.\n\nQualifications\n\n\tPrevious experience in social media management, content creation, or digital marketing required.\n\n\tProficiency in Canva and Instagram required.\n\n\tExperience filming and editing short-form videos required.\n\n\tAbility to produce professional-quality video content using an iPhone or similar equipment.\n\n\tStrong creative abilities and an excellent eye for branding, design, and visual presentation.\n\n\tExperience creating advertisement graphics and promotional materials.\n\n\tFamiliarity with Instagram Reels and current social media trends.\n\n\tStrong attention to detail and organizational skills.\n\n\tAbility to work independently and manage multiple creative projects.\n\n\tExcellent communication and collaboration skills.\n\n\tInterest in mental health education, community outreach, or nonprofit work preferred."}, {"id": "26888", "title": "Intake Coordinator", "bhTitle": "Intake", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-14", "exp": "2027-01-14", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time, In-Person\nSchedule: Monday–Friday,\n\nPosition Overview\n\nA growing organization in Brooklyn is seeking a motivated, personable, and detail-oriented Intake Coordinator to join its team.\n\nThis is an excellent opportunity for someone who enjoys working with people, providing excellent client service, and maintaining organized administrative processes.\n\nThe Intake Coordinator will be responsible for communicating with clients, assisting with intake paperwork, preparing documentation, and ensuring a smooth and efficient intake process.\n\nThe ideal candidate is friendly, organized, professional, and eager to learn and grow within a supportive office environment.\n\nKey Responsibilities\n\nClient Intake & Coordination\n\n\tCommunicate and coordinate with clients on a daily basis.\n\n\tGuide clients through the intake process and explain required forms and documentation.\n\n\tAssist clients with completing necessary paperwork accurately and efficiently.\n\n\tRespond to client inquiries and provide professional, helpful assistance.\n\n\tFollow up with clients regarding missing information or outstanding documentation.\n\n\tBuild and maintain positive, supportive relationships with clients.\n\n\tEnsure clients receive a welcoming and professional experience throughout the intake process.\n\nDocumentation & Administrative Support\n\n\tPrepare, review, and submit intake documents accurately and on time.\n\n\tMaintain organized and up-to-date client records.\n\n\tEnter and update client information in internal systems.\n\n\tReview paperwork for completeness and accuracy.\n\n\tTrack pending documentation and follow up as needed.\n\n\tCoordinate with internal team members to ensure efficient processing.\n\n\tAssist with general administrative and office responsibilities.\n\nQualifications\n\n\tEntry-level candidates are welcome to apply.\n\n\tExcellent verbal and written communication skills.\n\n\tStrong organizational skills and attention to detail.\n\n\tWarm, friendly, and professional attitude.\n\n\tAbility to communicate effectively with clients and coworkers.\n\n\tStrong follow-up skills and ability to manage multiple responsibilities.\n\n\tComfortable working with forms, documentation, and computer systems.\n\n\tDependable, responsible, and eager to learn.\n\n\tAbility to work independently while contributing to a team environment.\n\n\tPrevious intake, customer service, or administrative experience is a plus but not required."}, {"id": "26887", "title": "Graphic Designer & Social Media Manager", "bhTitle": "Graphic Design", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-13", "exp": "2027-01-04", "desc": ""}, {"id": "26883", "title": "Special Education Teacher", "bhTitle": "Teacher", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-13", "exp": "2027-01-13", "desc": "Employment Type: Full-Time\nSchedule: Monday–Thursday, 9:00 AM–3:00 PM | Friday, 9:00 AM–12:30 PM\n\nPosition Overview\n\nA welcoming and supportive school is seeking a dedicated and compassionate Special Education Teacher to join its team.\n\nThis is an excellent opportunity for an educator who is passionate about working with children with diverse learning needs and making a meaningful difference in their academic, social, and emotional development.\n\nThe ideal candidate is patient, creative, organized, and committed to creating a positive and engaging learning environment where every student can thrive.\n\nKey Responsibilities\n\n\tDevelop and implement individualized lesson plans tailored to students' learning needs and abilities.\n\n\tProvide specialized instruction and support to students with diverse developmental and educational needs.\n\n\tCreate a structured, nurturing, and inclusive classroom environment.\n\n\tAdapt teaching methods and classroom materials to accommodate different learning styles.\n\n\tSupport students in developing academic, social, communication, and independent living skills.\n\n\tMonitor student progress and adjust instructional strategies as needed.\n\n\tImplement Individualized Education Programs (IEPs) and track student goals.\n\n\tCollaborate with teachers, therapists, support staff, and school administration.\n\n\tMaintain open and professional communication with parents and families.\n\n\tEncourage positive behavior, independence, and student engagement.\n\n\tMaintain accurate student records and progress documentation.\n\n\tParticipate in staff meetings and professional development activities.\n\nQualifications\n\n\tMaster's degree in Special Education or a related field required.\n\n\tPrevious experience working with students with special needs preferred.\n\n\tStrong understanding of special education teaching methods and individualized instruction.\n\n\tFamiliarity with IEP development and implementation.\n\n\tExcellent classroom management and organizational skills.\n\n\tPatient, compassionate, and adaptable teaching approach.\n\n\tStrong written and verbal communication skills.\n\n\tAbility to collaborate effectively with other educators and support professionals.\n\n\tPassion for helping students reach their full potential.\n\n\tDependable, professional, and committed to student success."}, {"id": "26882", "title": "Shipping & Office Operations Associate", "bhTitle": "Warehouse Assistant Manager", "category": "Warehouse, Driving & Logistics", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-12", "exp": "2027-01-04", "desc": "Flatiron District, NYC, Full-Time | In-Person\n\nA creative jewelry, accessories, and home décor company, is seeking a hardworking, reliable, and highly organized team member to support their daily shipping, packing, and office operations.\n\nThis is a hands-on, physically active position for someone who enjoys staying busy, working efficiently, and keeping things running smoothly.\n\nResponsibilities\n\n\tPick, pack, and prepare daily customer orders\n\tPack and ship bulk wholesale orders to retailers\n\tProcess orders and print shipping labels, packing slips, and documentation\n\tTransport and drop off packages at UPS, FedEx, and USPS\n\tLift, carry, move, and organize boxes and merchandise\n\tReceive deliveries and assist with inventory management\n\tMaintain a clean, organized, and efficient workspace\n\tSupport general office operations and organizational tasks\n\nQualifications\n\n\tComputer savvy, comfortable navigating order systems, processing shipments, and printing shipping documents\n\tExcellent organizational skills and strong attention to detail\n\tPhysically capable of lifting, carrying, and moving boxes throughout the workday\n\tHonest, reliable, punctual, and responsible\n\tEfficient, proactive, and able to multitask\n\tPositive attitude, good energy, and strong work ethic\n\tTeam player willing to jump in wherever needed\n\tPrevious shipping, packing, or warehouse experience is a plus\n\nThe Ideal Candidate\nSomeone who is dependable, resourceful, organized, and takes pride in their work. We value initiative, efficiency, attention to detail, and a positive, can-do attitude."}, {"id": "26881", "title": "Job Title: Administrative Assistant", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Full or Part Time", "typeNote": "", "state": "NJ", "added": "2026-10-12", "exp": "2027-01-12", "desc": "Location: North Brunswick, NJ\nJob Type: Part-Time to Full-Time (25 - 35 Hours / Week)\nSchedule: Monday through Friday (Flexible daytime hours)\n\nWe are seeking an articulate, organized, and reliable Administrative Assistant to join our office team in North Brunswick, NJ. This role is essential to keeping our day-to-day business operations and financial processes running smoothly.\nThe ideal candidate possesses strong written and verbal communication skills, a high level of professionalism, and hands-on experience handling basic accounting tasks in QuickBooks and Microsoft Excel. If you are detail-oriented, comfortable managing accounts payable and receivable, and excel at drafting clear business correspondence, we would love to connect with you.\nKey Responsibilities:\n\n\tManage accounts payable and accounts receivable processes, including entering bills, issuing invoices, and tracking incoming payments.\n\tUtilize QuickBooks to log daily transactions, reconcile accounts, and support financial recordkeeping.\n\tMaintain accurate Microsoft Excel spreadsheets for tracking orders, client accounts, and internal logs.\n\tDraft, proofread, and send professional, clear, and articulate email communications to clients, vendors, and team members.\n\tAssist with general office administration tasks, including filing, answering inquiries, and organizing records.\n\tCollaborate closely with management and department heads to support daily workflow and operational needs.\n\nQualifications:\n\n\tProven experience working with QuickBooks and Microsoft Excel.\n\tDemonstrated experience handling accounts payable (A/P) and accounts receivable (A/R).\n\tExceptional written communication skills with the ability to write polished, professional emails.\n\tArticulate, professional verbal communication skills for phone and in-person interactions.\n\tHigh attention to detail, accuracy with numbers, and strong organizational skills.\n\tAbility to work independently and manage daily office tasks efficiently.\n\n What We Offer:\n\n\tFree commuter transportation via company van service providing round-trip transit from two locations in Brooklyn directly to the warehouse facility.\n\tFlexible schedule within a 25 to 35 hour work week.\n\tA clean, professional, and supportive office environment.\n\tOpportunities to build and expand administrative and financial skill sets."}, {"id": "26880", "title": "Shipping Supervisor – Shipping Department", "bhTitle": "Warehouse- Shipping", "category": "Warehouse, Driving & Logistics", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-12", "exp": "2027-01-12", "desc": "Location: North Brunswick, NJ\nJob Type: Full-Time\nSchedule: Monday through Friday\n\nWe are seeking a reliable, articulate, and trustworthy shipping supervosor to join our shipping team in North Brunswick, NJ. In this role, you will play a vital part in our daily operations by coordinating and overseeing the smooth loading of outbound orders onto transport trucks.\n\nThis position focuses on accuracy, communication, and order verification rather than physical heavy lifting. If you are dependable, detail-oriented, and possess basic computer skills, we encourage you to apply.\n\nKey Responsibilities:\n\n\tCoordinate with drivers and internal logistics teams to manage daily outbound loading schedules.\n\n\tVerify order manifests, shipping labels, and paperwork for high accuracy before goods are loaded.\n\n\tAssist truck drivers with the smooth and organized loading process of outgoing shipments.\n\n\tUse basic computer applications and inventory software to log loaded orders and update shipping statuses.\n\n\tMaintain clear, polite, and professional communication with delivery drivers, warehouse staff, and management.\n\n\tEnsure all warehouse safety and operational guidelines are strictly followed during the loading process.\n\nQualifications:\n\n\tStrong, articulate verbal communication skills with a professional demeanor.\n\n\tHigh level of personal integrity, reliability, and trustworthiness.\n\n\tBasic computer skills, including comfort using data entry software, spreadsheets, or shipping portals.\n\n\tStrong attention to detail with an emphasis on inventory and order accuracy.\n\n\tPrior experience in a warehouse, shipping, or logistics environment is a plus, but not required.\n\n\tNo heavy lifting required for this position.\n\nWhat We Offer:\n\n\tA clean, safe, and supportive team environment\n\tVans available from 2 locations in BRooklyn\n\n\tPaid time off and holiday pay.\n\n\tOpportunities for career growth and ongoing skill development within the company."}, {"id": "26879", "title": "Influencer Marketing Manager", "bhTitle": "Social Media Manager", "category": "E-commerce, Marketing & Social Media", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-10-12", "exp": "2027-01-13", "desc": "Luxury Jewelry Brand | Part-Time | Potential to Grow into Full-Time\n\nWhat We're Looking For\n\nWe want someone who is already connected to the influencer world and understands what makes a collaboration successful. You should be able to identify the right people, open doors, negotiate deals, and develop creative campaigns that feel authentic to both the influencer and the brand.\n\nThis is an exciting opportunity for a motivated influencer marketing professional to take ownership of a growing program and make a measurable impact on a premium jewelry brand.\n\nAbout the Company\n\nWe are a high-end jewelry brand specializing in fine gold jewelry, combining exceptional quality, timeless design, and accessible luxury. With more than 65 years of industry experience, we are committed to using genuine precious metals, maintaining ethical sourcing practices, and delivering outstanding value directly to our customers.\n\nAs we continue to grow our online presence and retail business, we are looking for a creative, entrepreneurial, and well-connected Influencer Marketing Manager to help expand our brand awareness and drive sales through strategic influencer partnerships.\n\nThe Opportunity\n\nWe are seeking someone who genuinely lives and breathes the world of influencers, fashion, beauty, lifestyle, and luxury jewelry. The ideal candidate understands the influencer landscape, knows how to identify the right creators for a premium brand, and has experience building relationships and negotiating successful brand collaborations.\n\nThis is a hands-on role for someone who can turn creative ideas into impactful campaigns, develop mutually beneficial influencer partnerships, and create engaging content that brings the brand to life.\n\nThe position is initially part-time, with the potential to grow into a full-time opportunity as the business expands.\n\nKey Responsibilities\n\n\tInfluencer Partnerships & Brand Deals: Identify, approach, and negotiate collaborations with influencers, content creators, and brand ambassadors across relevant social media platforms.\n\n\tRelationship Building: Develop and maintain strong relationships with influencers, agents, and talent managers to establish ongoing partnerships.\n\n\tCampaign Development: Create and execute influencer marketing campaigns that increase brand awareness, engagement, website traffic, and sales.\n\n\tContent Strategy: Collaborate with influencers to develop compelling content featuring the brand's fine jewelry, including Instagram Reels, TikTok videos, social posts, and other digital content.\n\n\tInfluencer Research: Identify creators whose audiences, aesthetic, and personal brands align with the company's luxury positioning and target customers.\n\n\tNegotiation & Budget Management: Negotiate fees, gifted collaborations, affiliate arrangements, and other partnership terms to maximize campaign value.\n\n\tCampaign Management: Coordinate product gifting, content timelines, deliverables, approvals, and campaign execution.\n\n\tPerformance Tracking: Monitor campaign results, engagement, conversions, and return on investment to identify successful partnerships and opportunities for growth.\n\n\tTrend Awareness: Stay current on social media trends, emerging influencers, luxury fashion, fine jewelry, and digital marketing strategies.\n\nQualifications\n\n\tPrior experience in influencer marketing is required, including developing and executing influencer collaborations or brand deals.\n\n\tAn established understanding of the influencer ecosystem, including how creators, agents, and brand partnerships operate.\n\n\tStrong networking, communication, and negotiation skills, with the confidence to initiate outreach and build relationships.\n\n\tA genuine interest in fine jewelry, luxury fashion, beauty, lifestyle, and social media culture.\n\n\tCreative instincts and the ability to develop engaging content ideas that align with a premium brand.\n\n\tFamiliarity with Instagram, TikTok, and other relevant social media platforms.\n\n\tA results-oriented mindset with the ability to connect influencer activity to brand growth and sales.\n\n\tHighly organized, self-motivated, resourceful, and comfortable working independently in a growing business.\n\nPosition: Part-Time, with potential to grow into Full-Time"}, {"id": "26878", "title": "Chef/ Cook", "bhTitle": "Chef/ Cook", "category": "Restaurant & Food Service", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-10-12", "exp": "", "desc": "Energetic and motivated Grill man needed for a restaurant in Brooklyn.\n12pm-10pm. Can be divided into 2 shifts."}, {"id": "26877", "title": "Mother's Helper / Infant Caregiver", "bhTitle": "Babysitter/Nanny", "category": "Education & Childcare", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-12", "exp": "2027-01-12", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time / Schedule to Be Discussed\n\nPosition Overview\n\nA family in Brooklyn is seeking a warm, responsible, and dependable Mother's Helper / Infant Caregiver to assist with caring for their 3-month-old baby while the mother is working.\n\nThe ideal candidate is patient, nurturing, and experienced with infants. This position focuses on providing attentive, loving care while ensuring the baby's safety, comfort, and daily needs are met.\n\nKey Responsibilities\n\n\tProvide attentive and nurturing care for a 3-month-old infant.\n\n\tPrepare and feed bottles according to the baby's feeding schedule.\n\n\tChange diapers and maintain proper infant hygiene.\n\n\tEngage the baby in age-appropriate play, interaction, and developmental activities.\n\n\tFollow the baby's established feeding and nap routines.\n\n\tSoothe and comfort the baby as needed.\n\n\tPut the baby down for naps following safe sleep practices.\n\n\tMaintain a clean and organized environment in areas used for infant care.\n\n\tCommunicate with the mother regarding the baby's needs, routines, and activities.\n\n\tEnsure the baby's safety and well-being at all times.\n\nQualifications\n\n\tPrevious experience caring for infants, particularly newborns or young babies, preferred.\n\n\tPatient, gentle, nurturing, and responsible.\n\n\tComfortable with bottle feeding, diaper changes, and infant nap routines.\n\n\tKnowledge of basic infant safety and development.\n\n\tReliable, punctual, and trustworthy.\n\n\tStrong communication skills.\n\n\tAbility to follow parental instructions and established routines.\n\n\tInfant CPR and First Aid certification preferred."}, {"id": "26876", "title": "Head of Sales", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-12", "exp": "2027-01-12", "desc": "Employment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nA growing company is seeking an experienced and results-driven Head of Sales – Beauty Industry to lead its sales efforts, develop new business opportunities, and drive revenue growth.\n\nThe ideal candidate has a strong background in the beauty, cosmetics, personal care, or beauty accessories industry, along with proven experience developing customer relationships, managing key accounts, and leading sales initiatives.\n\nThis is an excellent opportunity for a motivated sales leader who understands the beauty market, has established industry relationships, and can take ownership of the company's sales strategy and growth.\n\nKey Responsibilities\n\nSales Leadership & Business Development\n\n\tLead and oversee the company's sales efforts within the beauty industry.\n\n\tDevelop and execute sales strategies to increase revenue and expand market presence.\n\n\tIdentify new business opportunities with retailers, distributors, wholesalers, and beauty industry buyers.\n\n\tBuild and maintain strong relationships with key accounts and prospective customers.\n\n\tProspect for new business and open new retail and wholesale accounts.\n\n\tNegotiate pricing, contracts, and sales agreements.\n\n\tManage the sales pipeline and oversee opportunities from initial outreach through closing.\n\n\tEstablish sales goals and monitor performance against revenue targets.\n\n\tProvide leadership, guidance, and support to sales team members as applicable.\n\nAccount Management & Industry Relationships\n\n\tDevelop and maintain relationships with major beauty retailers, distributors, and industry partners.\n\n\tLeverage existing industry connections to generate new sales opportunities.\n\n\tManage key customer accounts and identify opportunities for account expansion.\n\n\tMaintain regular communication with buyers and decision-makers.\n\n\tAttend buyer meetings, industry events, and trade shows as needed.\n\n\tStay informed about beauty industry trends, competitors, and market developments.\n\nSales Strategy & Growth\n\n\tCollaborate with management, product development, and merchandising teams to identify market opportunities.\n\n\tProvide feedback on customer demand, product trends, pricing, and assortment opportunities.\n\n\tHelp develop sales presentations and proposals for prospective accounts.\n\n\tAnalyze sales performance and identify areas for improvement.\n\n\tDevelop strategies to strengthen customer retention and increase repeat business.\n\n\tSupport the introduction of new products and expansion into additional retail channels.\n\nQualifications\n\n\tPrevious sales experience in the beauty industry required.\n\n\tStrong background in beauty, cosmetics, personal care, beauty tools, or related consumer products.\n\n\tProven ability to generate new business and grow sales revenue.\n\n\tExperience managing key accounts and developing retailer or distributor relationships.\n\n\tExisting relationships with beauty industry buyers and retailers strongly preferred.\n\n\tStrong leadership, negotiation, and business development skills.\n\n\tExcellent communication and interpersonal abilities.\n\n\tUnderstanding of wholesale sales, pricing, margins, and retail distribution.\n\n\tSelf-motivated, strategic, and results-oriented.\n\n\tAbility to work independently and take ownership of sales growth.\n\n\tStrong organizational, analytical, and follow-up skills.\n\n\tPrevious sales management or team leadership experience preferred."}, {"id": "26875", "title": "Investment Sales Associate", "bhTitle": "Investment Sales Associate", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-12", "exp": "2027-01-05", "desc": "Location: Brooklyn, NY\nPosition Type: Full-Time\nSchedule: Monday through Friday, 8:45 AM–6:00 PM\n\nAbout the Role\nA real estate brokerage in Brooklyn is seeking a highly motivated, self-driven individual to join the team as an Investment Sales Associate. This is an excellent opportunity to launch or grow a career in real estate investment sales within a fast-paced, performance-driven environment.\n\nNo prior experience is required, though backgrounds in sales, real estate, finance, or investments are a plus. Comprehensive training is provided to equip candidates with the tools, knowledge, and support needed to succeed.\n\nKey Responsibilities\nAssist in sourcing and identifying industrial investment properties across the U.S.\nSupport senior team members with market research and investment analysis\nDevelop and maintain relationships with clients, investors, and property owners\nConduct outreach, follow-ups, and relationship-building initiatives\nAssist in preparing sales materials, financial analyses, and investment presentations\nTrack deal activity and support transaction processes from start to finish\nStay informed on market trends, pricing, and investment opportunities\n\nQualifications\nHighly motivated, self-driven, and eager to grow professionally\nStrong communication, negotiation, and interpersonal skills\nExcellent organizational and time-management abilities\nComfortable working in a fast-paced, goal-oriented environment\nWillingness to learn and take initiative\nPrior experience in sales, real estate, or investments is a plus, but not required\n\nWhy This Opportunity\nHands-on training and mentorship in real estate investment sales\nExposure to national industrial real estate markets\nClear path for professional growth and advancement\nDynamic, entrepreneurial work environment"}, {"id": "26873", "title": "Sales Representative", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-12", "exp": "2027-01-12", "desc": "Employment Type: Full-Time\nSchedule: Monday–Friday, Standard Business Hours\n\nPosition Overview\n\nA growing company is seeking a motivated, hardworking, and results-driven Sales Representative to join its team.\n\nThe ideal candidate is a confident and personable sales professional who enjoys building relationships, developing new business, and identifying opportunities for growth.\n\nThis position is ideal for someone with strong communication skills, a positive attitude, and the drive to succeed in a fast-paced sales environment.\n\nKey Responsibilities\n\n\tIdentify and develop new business opportunities.\n\n\tReach out to prospective customers through phone calls, emails, and other outreach methods.\n\n\tBuild and maintain strong relationships with new and existing clients.\n\n\tGenerate leads, follow up with prospects, and convert opportunities into sales.\n\n\tUnderstand customer needs and recommend appropriate products or services.\n\n\tPresent offerings, negotiate pricing, and close sales.\n\n\tMaintain consistent communication with customers to encourage repeat business.\n\n\tManage and organize a pipeline of prospective and existing accounts.\n\n\tWork closely with management to develop sales strategies and identify growth opportunities.\n\n\tMeet and exceed individual sales goals and revenue targets.\n\n\tProvide excellent customer service throughout the sales process.\n\nQualifications\n\n\tPrevious sales experience preferred.\n\n\tStrong communication, negotiation, and interpersonal skills.\n\n\tSelf-motivated, ambitious, and results-oriented.\n\n\tStrong work ethic and willingness to actively pursue new business.\n\n\tConfident and comfortable speaking with prospective customers.\n\n\tExcellent relationship-building and follow-up skills.\n\n\tOrganized, dependable, and detail-oriented.\n\n\tAbility to work independently while contributing to a team environment.\n\n\tPositive attitude and willingness to learn.\n\n\tAbility to manage multiple customers and sales opportunities simultaneously."}, {"id": "26872", "title": "Executive & Personal Assistant to Founder", "bhTitle": "Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-12", "exp": "2027-01-12", "desc": "Employment Type: Full-Time, In-Person\nSchedule: Monday–Friday, Full Workdays (Exact Hours to Be Discussed)\n\nPosition Overview\n\nA growing luxury real estate company is seeking a highly organized, proactive, and dependable Executive & Personal Assistant to work directly with its founder.\n\nThis position combines executive administrative support, personal assistance, scheduling, client communication, and business operations. The ideal candidate is detail-oriented, resourceful, professional, and comfortable managing multiple responsibilities in a fast-paced environment.\n\nThis is an excellent opportunity for a motivated individual or recent graduate looking to gain hands-on experience in business operations, client relations, executive management, and luxury real estate while working closely with company leadership.\n\nKey Responsibilities\n\nExecutive & Administrative Support\n\n\tManage and coordinate the founder's calendar, appointments, meetings, and daily schedule.\n\n\tOrganize emails, correspondence, and routine communications.\n\n\tDraft professional emails and assist with written communications.\n\n\tTrack important deadlines, action items, and follow-ups.\n\n\tMaintain organized files, contact records, and task lists.\n\n\tUtilize Google Workspace and Monday.com to manage schedules, projects, and administrative responsibilities.\n\n\tAssist with research, presentations, client materials, and special projects.\n\n\tHelp prioritize daily responsibilities and ensure important tasks are completed on time.\n\nPersonal Assistance & Coordination\n\n\tCoordinate travel arrangements, reservations, and personal appointments.\n\n\tAssist with personal scheduling and errands as needed.\n\n\tAnticipate upcoming needs and proactively address scheduling conflicts or outstanding tasks.\n\n\tMaintain confidentiality when handling personal and professional information.\n\n\tProvide flexible support to help the founder manage a busy schedule efficiently.\n\nClient & Business Operations Support\n\n\tCommunicate professionally with clients, vendors, and internal team members.\n\n\tAssist with coordinating meetings and client-related activities.\n\n\tSupport administrative projects related to luxury real estate operations.\n\n\tMaintain accurate records and ensure timely follow-up on outstanding matters.\n\n\tWork closely with the founder to support business priorities and daily operations.\n\n\tIdentify opportunities to improve organization, efficiency, and workflow.\n\nQualifications\n\n\tEntry-level candidates and recent college graduates are encouraged to apply.\n\n\tPrevious executive assistant or real estate experience is not required.\n\n\tExcellent organizational skills and strong attention to detail.\n\n\tStrong written and verbal communication skills.\n\n\tAbility to manage multiple priorities and adapt to changing schedules.\n\n\tProfessional, dependable, and resourceful.\n\n\tStrong follow-through and ability to complete tasks independently.\n\n\tAbility to handle confidential information with discretion and sound judgment.\n\n\tComfortable using technology and learning new software.\n\n\tFamiliarity with Google Workspace and Monday.com is a plus.\n\n\tPrevious internship, administrative, customer service, or campus leadership experience is valued.\n\n\tStrong work ethic, positive attitude, and willingness to learn.\n\n\tAbility to anticipate needs, take initiative, and solve problems proactively."}, {"id": "26871", "title": "Account Executive (Women's Wholesale Apparel)", "bhTitle": "Sales- Mid Level", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-09", "exp": "2027-01-08", "desc": "Location: New York, NY\nJob Type: Full-time\nSchedule: Standard Business Hours\n\nWe are seeking a proven Account Executive with an established network in women's wholesale apparel to drive growth and expand our retail footprint. This role offers a dedicated sales professional full ownership of their accounts, direct influence over growth strategy, and the opportunity to scale alongside a growing fashion brand. In this position, you will showcase branded and private label wholesale collections to fashion-forward retailers who value quality product, reliable delivery, and strong, long-term partnerships.\nKey Responsibilities:\n\n\tBuild and maintain client relationships, bringing in new accounts from your existing network.\n\tDeliver compelling sales presentations showcasing the latest women's wholesale apparel collections.\n\tMeet and exceed sales targets through the execution of effective sales strategies.\n\tProvide exceptional customer service by assisting clients with product selection and handling inquiries.\n\tUtilize strong negotiation skills to secure favorable terms and agreements with clients.\n\tCollaborate with internal teams to ensure accurate, timely delivery and high levels of customer satisfaction.\n\nQualifications:\n\n\tMinimum of 2 years of experience in wholesale ladies apparel sales, preferably within the Junior, Missy, or Girls fashion industry.\n\tProven track record of consistently meeting or exceeding sales targets.\n\tStrong existing network and established client base within the fashion industry.\n\tExcellent communication, interpersonal, and negotiation skills.\n\tSelf-motivated and results-oriented with a passion for sales and fashion.\n\nWhat We Offer:\n\n\tHealth benefits package.\n\tPaid time off.\n\tDirect ownership of accounts and substantial opportunity for career growth."}, {"id": "26870", "title": "Administrative Assistant", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Full or Part Time", "typeNote": "", "state": "NJ", "added": "2026-10-09", "exp": "2027-01-06", "desc": "Location: Ocean Township, NJ\nJob Type: Full-Time or Part-Time\nSchedule: Monday through Friday (Flexible hours available)\n\nWe are seeking a reliable, organized, and detail-oriented Administrative Assistant to join our team in Ocean Township, NJ. This position is ideal for an individual who excels at routine administrative workflows, data entry, and day-to-day office organization. Whether you are seeking a full-time position or a flexible part-time schedule, this role provides a supportive work environment where your precision directly contributes to smooth daily operations.\n\nKey Responsibilities:\n\n\tBuild, update, and manage detailed listings across internal databases and online platforms.\n\n\tFormat, verify, and print mailing, shipping, and product labels accurately.\n\n\tMaintain accurate digital and physical records to keep office files organized.\n\n\tPerform routine data entry and assist with basic document preparation.\n\n\tAudit listings and label queues regularly to catch and correct discrepancies promptly.\n\n\tProvide general administrative support to management and team members as needed.\n\nQualifications:\n\n\tHigh school diploma or equivalent required; prior office or administrative experience preferred.\n\n\tProficiency with basic computer systems, Microsoft Office (Word, Excel), and web platforms.\n\n\tStrong attention to detail with an emphasis on accuracy and quality control.\n\n\tSolid organizational skills and the ability to manage time effectively.\n\n\tGood communication skills and a reliable work ethic.\n\n\tAbility to work independently as well as collaboratively with a team.\n\nWhat We Offer:\n\n\tFlexible full-time or part-time scheduling options.\n\n\tPaid time off and holiday pay for eligible schedules.\n\n\tA clean, professional, and welcoming work environment.\n\n\tOngoing training and support."}, {"id": "26869", "title": "Product Developer / Merchandiser", "bhTitle": "Product Development", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-11", "desc": "Location: New York, NY\nEmployment Type: Full-Time\nWork Arrangement: In-Office\n\nPosition Overview\n\nA growing beauty and consumer products company is seeking a creative, detail-oriented, and highly organized Product Developer / Merchandiser to join its New York City team.\n\nThe company specializes in developing and importing hair tools, beauty tools, mirrors, and cosmetic accessories for major national retailers.\n\nThis position combines product development, trend research, merchandising, sourcing, and overseas factory coordination. The ideal candidate has a strong understanding of consumer products, retail trends, pricing, and packaging, with the ability to manage product development from initial concept through sampling, approvals, and production.\n\nKey Responsibilities\n\nProduct Development & Merchandising\n\n\tResearch market trends, competitor products, and emerging opportunities in the beauty and consumer products industry.\n\n\tConduct competitive shopping and identify new product ideas.\n\n\tDevelop product assortments based on retailer needs, target pricing, brand positioning, and seasonal trends.\n\n\tCollaborate with designers to develop product concepts, colors, packaging, and presentations.\n\n\tIdentify opportunities to introduce new products and expand existing product categories.\n\n\tEnsure products align with customer expectations, retail trends, and target price points.\n\nSourcing & Factory Coordination\n\n\tCommunicate directly with overseas factories regarding product sourcing, pricing, specifications, and development.\n\n\tCoordinate product samples, revisions, and production requirements.\n\n\tReview product samples and provide feedback to factories.\n\n\tWork with suppliers to ensure product quality, functionality, and design expectations are met.\n\n\tCoordinate product and packaging approvals.\n\n\tFollow up with factories to maintain development timelines and resolve outstanding issues.\n\nProduct Management & Buyer Support\n\n\tMaintain accurate costing sheets, product specifications, and development records.\n\n\tTrack product development calendars and ensure projects remain on schedule.\n\n\tCoordinate with internal teams to prepare product assortments and samples.\n\n\tAssist in preparing buyer presentations and product proposals.\n\n\tOrganize merchandise and samples for buyer meetings and trade shows.\n\n\tManage multiple product development projects simultaneously.\n\n\tEnsure accurate communication between design, sourcing, merchandising, and production teams.\n\nQualifications\n\n\t3+ years of experience in product development, merchandising, or a related field preferred.\n\n\tExperience in beauty, personal care, accessories, or consumer products strongly preferred.\n\n\tExperience communicating and coordinating directly with overseas factories.\n\n\tStrong understanding of product development, sourcing, pricing, and retail merchandising.\n\n\tExcellent eye for product trends, packaging, colors, and design.\n\n\tAbility to develop commercially viable products within target price points.\n\n\tProficiency in Microsoft Excel, including costing sheets and product tracking.\n\n\tStrong organizational and project management skills.\n\n\tExcellent written and verbal communication skills.\n\n\tExceptional attention to detail and follow-up.\n\n\tAbility to manage multiple projects and deadlines in a fast-paced environment.\n\n\tCreative, proactive, and comfortable working independently and collaboratively."}, {"id": "26868", "title": "Preschool Paraprofessional", "bhTitle": "Shadow/ Paraprofessional", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-11", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday–Friday, 9:00 AM–4:00 PM\n\nPosition Overview\n\nA preschool in Brooklyn is seeking two dedicated and compassionate Paraprofessionals / ABA Support Staff to work with children ages 3–6 on the autism spectrum.\n\nThe position involves supporting children in a structured classroom environment while working closely with teachers, Board Certified Behavior Analysts (BCBAs), and other educational professionals.\n\nThe ideal candidate is patient, energetic, dependable, and comfortable following guidance from supervising teachers and clinical professionals.\n\nKey Responsibilities\n\n\tProvide individualized classroom support to children ages 3–6 with Autism Spectrum Disorder (ASD).\n\n\tAssist children with classroom activities, daily routines, and transitions.\n\n\tSupport the development of communication, social, behavioral, and independent living skills.\n\n\tImplement individualized educational and behavioral strategies under the direction of teachers and BCBAs.\n\n\tEncourage positive interactions and participation in classroom activities.\n\n\tAssist with structured learning activities, play, and skill development.\n\n\tFollow established behavior support plans and classroom procedures.\n\n\tCollaborate closely with teachers, BCBAs, and other staff members.\n\n\tMaintain a safe, supportive, and positive learning environment.\n\n\tCommunicate observations and student progress to supervising professionals.\n\nQualifications\n\n\tExperience working with children with autism or developmental disabilities preferred.\n\n\tFamiliarity with ABA principles is a plus.\n\n\tPatient, compassionate, energetic, and dependable.\n\n\tStrong communication and interpersonal skills.\n\n\tAbility to follow instructions and accept constructive feedback from supervisors.\n\n\tComfortable working collaboratively with teachers and BCBAs.\n\n\tStrong interest in early childhood education and special education.\n\n\tWillingness to learn and develop professionally."}, {"id": "26867", "title": "Preschool Paraprofessional", "bhTitle": "Shadow/ Paraprofessional", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-11", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday–Friday, 9:00 AM–4:00 PM\n\nPosition Overview\n\nA preschool in Brooklyn is seeking two dedicated and compassionate Paraprofessionals / ABA Support Staff to work with children ages 3–6 on the autism spectrum.\n\nThe position involves supporting children in a structured classroom environment while working closely with teachers, Board Certified Behavior Analysts (BCBAs), and other educational professionals.\n\nThe ideal candidate is patient, energetic, dependable, and comfortable following guidance from supervising teachers and clinical professionals.\n\nKey Responsibilities\n\n\tProvide individualized classroom support to children ages 3–6 with Autism Spectrum Disorder (ASD).\n\n\tAssist children with classroom activities, daily routines, and transitions.\n\n\tSupport the development of communication, social, behavioral, and independent living skills.\n\n\tImplement individualized educational and behavioral strategies under the direction of teachers and BCBAs.\n\n\tEncourage positive interactions and participation in classroom activities.\n\n\tAssist with structured learning activities, play, and skill development.\n\n\tFollow established behavior support plans and classroom procedures.\n\n\tCollaborate closely with teachers, BCBAs, and other staff members.\n\n\tMaintain a safe, supportive, and positive l
