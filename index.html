nding of fit, grading, pattern-making, sewing, garment construction, and fabrications.\n\nKey Responsibilities\n\n\tCreate accurate size specifications for children's apparel ranging from 12 months through size 16.\n\tDevelop specifications for boys' and girls' sleepwear, swimwear, and intimates.\n\tPerform grading across applicable size ranges.\n\tEvaluate fit samples and provide detailed fit and construction comments.\n\tIdentify fit, measurement, and garment construction issues.\n\tCommunicate corrections and revisions clearly to factories.\n\tCreate diagrams and technical instructions showing factories how garment construction should be corrected.\n\tReview garments for proper fit, proportion, construction, and consistency.\n\tWork with design, production, and factory teams throughout the development process.\n\tMaintain accurate technical specifications and product documentation.\n\tEnsure corrections and approvals are communicated accurately and in a timely manner.\n\nQualifications\n\n\tMinimum 5 years of direct experience in the budget children's sleepwear market required.\n\tStrong product knowledge of children's sleepwear.\n\tExperience working with both boys' and girls' sleepwear.\n\tStrong knowledge of pattern-making, sewing, grading, and garment construction.\n\tExperience creating and maintaining garment size specifications.\n\tStrong understanding of both knit and woven fabrications.\n\tExperience working with a variety of fabrics and fabric finishes.\n\tAbility to evaluate fit samples and provide clear, detailed technical comments.\n\tAbility to communicate garment corrections effectively to overseas factories.\n\tIntermediate proficiency in Microsoft Excel and Adobe Illustrator required.\n\tKnowledge of FileMaker Pro is a plus.\n\tStrong computer skills with the ability to learn new systems quickly.\n\tHighly organized and detail-oriented.\n\tExcellent written and verbal communication skills.\n\tAbility to manage multiple styles and deadlines in a fast-paced apparel environment."}, {"id": "26845", "title": "Lead Designer / Merchandiser", "bhTitle": "Designer", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-07", "exp": "2027-01-07", "desc": "Employment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nA growing apparel company is seeking an experienced Lead Designer / Merchandiser – Children's Apparel to lead the merchandising and design of children's fashion apparel across multiple categories.\n\nThe position will focus on boys' and girls' newborn, infant, and toddler sportswear, as well as Toddler–20 sleepwear, swimwear, and intimates. The Lead Designer / Merchandiser will oversee products throughout the design and development lifecycle, from initial trend research, fabric selection, and body development through style creation, line adoption, and pre-production approval.\n\nThis role requires a strong combination of creative design, merchandising, technical apparel knowledge, trend awareness, and product development expertise.\n\nKey Responsibilities\n\nDesign & Merchandising\n\n\tIdentify market and fashion trends and translate them into commercially viable children's apparel.\n\tDesign branded, licensed, and private-label collections for mass merchants and specialty retailers.\n\tDevelop products across newborn, infant, toddler, and children's categories, including sportswear, sleepwear, swimwear, and intimates.\n\tSelect trend-right fabrics, silhouettes, colors, prints, graphics, and garment bodies.\n\tEnsure designs are appropriate for the intended age group, customer, price point, and retail channel.\n\tMaintain awareness of children's trends, including relevant toys, entertainment, movies, shows, graphics, and cultural influences.\n\tManage seasonal projects and help build cohesive product assortments.\n\nProduct Development\n\n\tWork closely with the Sales team and other designers to conceptualize complete garment designs and develop seasonal product lines.\n\tPrepare materials for design overview meetings, fabric meetings, and seasonal presentations.\n\tPresent and review trends, styles, fabrics, artwork, and product concepts with Sales and Sourcing.\n\tPartner with the Sourcing team to ensure fabrics, garment bodies, and constructions meet the requirements and price points of each line.\n\tPrepare detailed production packages containing garment specifications, trims, labeling, artwork, and other required information.\n\tEnsure designs and development materials are properly uploaded to the company database and server.\n\nSamples, Approvals & Production\n\n\tReview and approve fabrics, lab dips, artwork, garments, trims, and other development submissions.\n\tCommunicate comments, corrections, and approvals directly to factories.\n\tWork with Technical Design to evaluate garment construction, styling, and execution.\n\tMaintain strong technical knowledge of fabrics, garment construction, printing, and washing techniques.\n\tManage development schedules to ensure approvals are completed with sufficient lead time for production.\n\tMonitor projects from initial concept through pre-production approval.\n\nQualifications\n\n\t3–5 years of experience in children's apparel within a similar market required.\n\tBachelor's degree in Art, Design, Fashion Design, or a related field preferred.\n\tExperience designing for boys' and girls' newborn, infant, toddler, and children's apparel.\n\tAbility to develop a broad range of designs while working within customer and price-point requirements.\n\tStrong knowledge of children's fashion, graphics, prints, typography, illustration, and market trends.\n\tExperience with branded, licensed, and/or private-label apparel preferred.\n\tStrong technical understanding of garment construction, fabrics, printing, and washing techniques.\n\tProficiency in Adobe Illustrator, Photoshop, and InDesign required.\n\tExperience with Acrobat, Excel, FileMaker Pro, or additional design and digital tools is a plus.\n\tStrong organizational skills and exceptional attention to detail.\n\tAbility to manage multiple seasonal projects and priorities simultaneously.\n\tAbility to work effectively in a fast-paced, deadline-driven environment.\n\tAbility to take creative direction while bringing strong independent judgment and design intuition.\n\tExcellent written and verbal communication skills.\n\tStrong collaborative and team-oriented approach."}, {"id": "26844", "title": "Associate Designer", "bhTitle": "Designer", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-07", "exp": "2027-01-07", "desc": "Employment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nA fashion company is seeking an experienced and highly organized Associate Designer to support the Graphic Designer in developing and executing seasonal product lines for a graphic-focused fashion brand.\n\nThe Associate Designer will collaborate closely with the Sales, Design, Sourcing, Production, and Technical Design teams throughout the product development process. This role requires a strong understanding of fashion, graphics, color, trends, garment construction, and production, along with excellent organizational and follow-up skills.\n\nKey Responsibilities\n\nDesign & Product Development\n\n\tPartner with the Sales team and Graphic Designer to conceptualize complete garment designs and develop seasonal product lines.\n\tConduct trend shopping and research seasonal fashion trends, graphics, artwork, colors, fabrics, and styling.\n\tHelp translate seasonal concepts and trends into commercially viable apparel designs.\n\tPrepare materials for design overview meetings, fabric meetings, and seasonal product reviews.\n\tPresent and organize information related to styles, graphics, artwork, fabrics, and trends.\n\tCollaborate with Sales and Sourcing throughout the development process.\n\nSourcing & Production\n\n\tWork closely with the Sourcing team to ensure fabrics, body types, and garment constructions are appropriate and achievable for each product line.\n\tPrepare detailed production packages containing all required garment specifications.\n\tDevelop and maintain tech packs, color cards, artwork, trims, labeling, and garment details.\n\tEnsure designs, artwork, tech packs, and development materials are accurately uploaded to the company database and server.\n\tCommunicate development comments and updates directly with factories.\n\nSamples & Approvals\n\n\tReview and approve fabrics, lab dips, artwork, garments, trims, and strike-offs.\n\tProvide clear and timely comments to factories regarding required revisions.\n\tPartner with the Technical Design team to evaluate garment construction, fit, and styling.\n\tFollow samples and development materials through the approval process.\n\tMaintain accuracy and consistency across designs and production specifications.\n\nTimeline Management\n\n\tManage development schedules and track multiple styles simultaneously.\n\tEnsure approvals are completed according to established deadlines.\n\tMaintain sufficient lead time for garment production.\n\tFollow up with internal teams and factories to keep projects moving forward.\n\tIdentify potential delays and communicate issues proactively.\n\nQualifications\n\n\t3–5 years of fashion design, graphic design, apparel design, or product development experience.\n\tStrong understanding of fashion, graphics, color, trends, and apparel.\n\tExperience creating and maintaining detailed tech packs and production materials.\n\tKnowledge of garment construction, fabrics, trims, artwork, and product development.\n\tProficiency in Adobe Illustrator and Photoshop.\n\tExcellent organizational and follow-up skills.\n\tStrong attention to detail.\n\tAbility to manage multiple styles, projects, and deadlines simultaneously.\n\tAbility to collaborate effectively across Sales, Design, Sourcing, Production, and Technical Design teams.\n\tComfortable working in a fast-paced fashion environment."}, {"id": "26843", "title": "Social Media & Creative Studio Intern – Brooklyn/NYC", "bhTitle": "Art & Creative Intern", "category": "Design & Creative", "type": "Internship", "typeNote": "", "state": "NY", "added": "2026-10-07", "exp": "2027-01-21", "desc": "Creative studio in Brooklyn/NYC is looking for a motivated, creative intern to join their team! This is a great opportunity for a college student interested in social media, branding, content creation, marketing, or the creative industry to gain hands-on experience in a fun and collaborative environment.\n\nThe intern will have the opportunity to assist with social media, branding projects, content creation, creative brainstorming, and day-to-day studio projects while learning how a creative business operates. 5–10 hours per week, with flexibility around a student's schedule. This can be completed for college credit or as an unpaid internship.\n\nLocation: Brooklyn/NYC\nHours: 5–10 hours/week\nIdeal Candidate: Creative, motivated, organized, and interested in social media, branding, and the creative industry."}, {"id": "26842", "title": "Intake Coordinator", "bhTitle": "Intake", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-06", "exp": "2027-01-06", "desc": "Location: Flatbush, Brooklyn, NY\nEmployment Type: Full-Time, In-Person\nExperience Level: Entry Level\n\nPosition Overview\n\nA growing organization in Brooklyn is seeking a motivated and personable Intake Coordinator to join its team. This is an excellent entry-level opportunity for someone who is organized, friendly, and interested in building a career in a supportive professional environment.\n\nThe Intake Coordinator will work directly with clients, assist with forms and documentation, and help ensure the intake process is handled accurately and efficiently. The ideal candidate is a strong communicator who enjoys helping people and can maintain excellent attention to detail.\n\nKey Responsibilities\n\n\tCommunicate and coordinate with clients on a daily basis.\n\tGuide clients through the intake process from start to completion.\n\tAssist clients with completing required forms and paperwork.\n\tReview documentation for accuracy and completeness.\n\tPrepare and submit required documents in a timely manner.\n\tFollow up with clients regarding missing information or outstanding paperwork.\n\tMaintain accurate and organized client records.\n\tRespond to client questions and provide clear, professional assistance.\n\tBuild positive and supportive relationships with clients.\n\tCoordinate with other team members to ensure client needs are addressed.\n\tAssist with general administrative and intake-related responsibilities as needed.\n\nQualifications\n\n\tEntry-level candidates are welcome to apply.\n\tExcellent verbal and written communication skills.\n\tStrong organizational abilities and attention to detail.\n\tFriendly, professional, and personable approach when working with clients.\n\tAbility to accurately handle forms, documentation, and client information.\n\tStrong follow-up skills.\n\tComfortable communicating with clients by phone, email, and in person.\n\tAbility to manage multiple responsibilities efficiently.\n\tTeam-oriented attitude with a willingness to learn.\n\tDependable, responsible, and motivated to grow professionally."}, {"id": "26841", "title": "Office Manager", "bhTitle": "Office Manager", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-06", "exp": "2027-01-06", "desc": "Employment Type: Full-Time\nSchedule: Monday–Friday, with Flexibility for the Right Candidate\n\nPosition Overview\n\nA nonprofit organization is seeking an experienced, highly organized, and tech-savvy Office Manager to oversee day-to-day office operations and work closely with the Finance, Development, and Executive teams.\n\nThis is more than a traditional Office Manager position. The role offers an opportunity for a proactive self-starter to take ownership of office operations, improve internal processes, support donor and fundraising activities, and contribute across multiple areas of a growing nonprofit organization.\n\nThe ideal candidate is detail-oriented, technologically capable, an excellent communicator, and comfortable working in a small-team environment where responsibilities may overlap.\n\nKey Responsibilities\n\nOffice Management & Operations\n\n\tOversee the smooth day-to-day operation of the office.\n\tManage the office space and maintain relationships with building service providers.\n\tCoordinate office technology, equipment, and technical support.\n\tOrganize and maintain electronic and physical files.\n\tDevelop, maintain, and improve office policies and procedures.\n\tIdentify opportunities to streamline processes and improve organizational efficiency.\n\tManage relationships with external vendors and service providers.\n\tMonitor and replenish office supplies and equipment.\n\tHelp ensure the office remains organized, professional, and fully operational.\n\nFinancial & Administrative Support\n\n\tProcess checks, wire transfers, and credit card donations.\n\tEnter and maintain accurate credit card expense information.\n\tCoordinate with Finance on financial and administrative matters.\n\tMaintain accurate records and supporting documentation.\n\tAssist with additional administrative and financial responsibilities as needed.\n\nDonor Communications & Database Management\n\n\tPrepare and monitor communications with donors.\n\tMaintain accurate digital and direct-mail donor lists.\n\tUpdate and further customize the organization's donor database.\n\tMaintain the accuracy and integrity of donor information.\n\tPerform data entry and database maintenance.\n\tWork closely with the Development team to support donor engagement and fundraising initiatives.\n\nBoard & Event Support\n\n\tSchedule and organize Board meetings.\n\tAttend Board meetings and prepare meeting minutes.\n\tAssist with meeting materials and follow-up as needed.\n\tProvide logistical and on-site support for fundraising events.\n\tCoordinate with staff, vendors, and other stakeholders to support successful events.\n\nCommunications & Marketing Support\n\n\tAssist with placing advertisements and press releases in relevant publications.\n\tSupport organizational communications and outreach initiatives.\n\tProvide basic social media and digital support as needed.\n\tAssist with additional projects across the organization.\n\nQualifications\n\n\tMinimum 5 years of relevant professional experience required.\n\tBachelor's degree required.\n\tPrevious office management, administration, nonprofit operations, or related experience.\n\tExcellent organizational skills and attention to detail.\n\tStrong writing and professional communication skills.\n\tProficiency with Microsoft Office 365.\n\tStrong general technology skills and ability to learn new systems.\n\tExperience with CRM systems and data entry.\n\tExperience with Donorbox, Stripe, PayPal, NetSuite, or similar platforms is a plus.\n\tComfortable working with databases, digital systems, and social media.\n\tAbility to develop and improve processes rather than simply follow existing procedures.\n\tStrong work ethic and ability to take ownership of responsibilities.\n\tCreative, resourceful, and solutions-oriented.\n\tAbility to manage multiple priorities in a fast-paced environment.\n\tCollaborative team player who is willing to assist across different areas of the organization."}, {"id": "26840", "title": "Social Media Manager", "bhTitle": "Social Media Manager", "category": "E-commerce, Marketing & Social Media", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-06", "exp": "2027-01-06", "desc": "Employment Type: Part-Time\nSchedule: Flexible / Part-Time Hours\n\nPosition Overview\n\nA community-based nonprofit organization is seeking a creative and thoughtful Part-Time Social Media Manager to develop engaging, informative, and educational content focused on mental health and community awareness.\n\nThis role is ideal for someone who understands social media, enjoys creating meaningful content, and can communicate sensitive mental health topics in a clear, respectful, and approachable way. The Social Media Manager will help strengthen the organization's online presence while providing useful resources and education to the community.\n\nKey Responsibilities\n\n\tDevelop and manage the organization's social media content and presence.\n\tCreate informative and educational content related to mental health, wellness, and community resources.\n\tDevelop posts, graphics, short-form videos, stories, and other engaging social content.\n\tCreate and maintain a consistent social media content calendar.\n\tWrite clear, engaging, and audience-appropriate captions and messaging.\n\tTranslate complex or sensitive mental health topics into accessible and easy-to-understand content.\n\tEnsure content is respectful, responsible, and aligned with the nonprofit's mission.\n\tCollaborate with organizational leadership and mental health professionals when developing content.\n\tPromote programs, events, educational initiatives, and community resources.\n\tMonitor engagement and respond or escalate messages and comments appropriately.\n\tTrack social media performance and identify opportunities to improve reach and engagement.\n\tStay current on social media trends and identify appropriate ways to incorporate them into the organization's content.\n\tMaintain a consistent and professional voice across social platforms.\n\nQualifications\n\n\tPrevious experience in social media management, content creation, digital marketing, communications, or a related area preferred.\n\tStrong writing and communication skills.\n\tAbility to create engaging social media content for different audiences.\n\tComfortable creating or coordinating graphics, videos, reels, and other digital content.\n\tStrong understanding of major social media platforms and current content trends.\n\tExcellent judgment when communicating about sensitive topics.\n\tOrganized, creative, dependable, and able to work independently.\n\tStrong attention to detail and ability to maintain a consistent content schedule.\n\tInterest or experience in mental health, nonprofit, community, or educational content is strongly preferred.\n\tFamiliarity with Canva or similar content-creation tools is a plus."}, {"id": "26838", "title": "Sales Operations Specialist", "bhTitle": "Sales Operations Specialist", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-06", "exp": "2027-01-21", "desc": "Location: Brooklyn, NY\nSchedule: Monday - Thursday in-office, Fridays generally remote.\n\nAn established beauty and personal care company is seeking a highly organized, hands-on Sales Operations Specialist to help coordinate our growing retail and e-commerce business. This person will work closely with our sales and operations teams to ensure incoming orders are entered accurately, inventory and product availability are coordinated, and retail buyers and planners receive timely follow-up and support. The role will also help manage new item launches, pricing updates, sell sheets, and broker communications.\n\nKey responsibilities include:\n\n\tCoordinate sales orders with Operations, including inventory and product availability\n\tEnter and maintain orders and sales information using our internal systems and AI tools\n\tFollow up with retail buyers and planners regarding orders, new items, pricing and other needs\n\tCoordinate with independent sales brokers on new products, updated pricing, presentations and sell sheets\n\tConduct targeted outreach to prospective retail accounts and manage virtual assistants supporting outreach\n\tOversee virtual assistants handling routine buyer and consumer customer-service inquiries, including Amazon-related inquiries\n\tHelp prepare for and occasionally attend trade shows, including booth setup, customer meetings and selling\n\tMaintain accurate sales information and ensure follow-ups don't fall through the cracks\n\nWhat we're looking for: A highly organized, detail-oriented self-starter with strong computer skills who is comfortable using AI and learning new technology. The ideal candidate has experience in sales operations, consumer products or retail/wholesale sales and is comfortable communicating directly with buyers, brokers and internal teams. Beauty, skincare or personal-care experience is strongly preferred but not required. Experience managing or delegating work to virtual assistants is a plus."}, {"id": "26837", "title": "IT Specialist / Senior IT Specialist", "bhTitle": "Computers IT", "category": "Technology & IT", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-06", "exp": "2027-01-06", "desc": "Location: New York, NY – In Person\nEmployment Type: Full-Time\nSchedule: Monday–Friday, On-Site 5 Days per Week; On-Call Outside Business Hours as Needed\n\n\tIT Specialist: Based on Experience\n\tSenior IT Specialist: Based on Experience\n\nPosition Overview\n\nA New York City law firm is seeking an experienced IT Specialist or Senior IT Specialist to support and maintain the firm's technology environment.\n\nThis is a hands-on, in-person position responsible for IT infrastructure, end-user support, Microsoft 365 administration, cybersecurity support, user onboarding and offboarding, hardware and software management, vendor relationships, and technology projects.\n\nThe ideal candidate combines strong technical troubleshooting abilities with excellent customer service and communication skills. The individual must be comfortable supporting users directly while also contributing to larger technology, security, and infrastructure initiatives.\n\nKey Responsibilities\n\nIT Setup & Maintenance\n\n\tAdminister and maintain on-premises and cloud-based IT environments.\n\tConfigure, deploy, and maintain computers, printers, scanners, phones, and other technology.\n\tSet up new workstations and configure required software and SaaS applications.\n\tApply system updates and maintain technology configurations.\n\tAssist with A/V equipment and conference room technology.\n\tMaintain reliable day-to-day technology operations throughout the office.\n\nUser Onboarding & Offboarding\n\n\tSet up user accounts, devices, permissions, and system access for new employees.\n\tConfigure access according to firm security standards.\n\tMaintain accurate hardware and SaaS inventories.\n\tModify system access when employees change roles or responsibilities.\n\tPromptly disable accounts and system access for departing employees.\n\tRecover firm-owned devices and equipment.\n\tPreserve email and documents in accordance with firm retention policies.\n\nTechnical Support\n\n\tDiagnose and resolve issues involving computers, printers, phones, networks, and other office technology.\n\tLog, track, and resolve support requests through help desk software.\n\tTroubleshoot email, document management systems, VPNs, legal technology platforms, SaaS applications, and other firm systems.\n\tIdentify root causes and implement effective solutions.\n\tTrack systemwide outages and technology issues.\n\tProvide clear, real-time updates to employees regarding outages, repairs, and service interruptions.\n\nCybersecurity Support\n\n\tConfigure and maintain multifactor authentication and user-access security controls.\n\tConfigure, maintain, and monitor backups of firm data.\n\tSupport the firm's cybersecurity practices and technology controls.\n\tMonitor technology vendors for compliance with internal data-protection policies, industry standards, and applicable requirements.\n\tWork closely with the Manager of Cybersecurity and Technology Strategy on security-related initiatives.\n\nAsset & Information Management\n\n\tMaintain an accurate inventory of computers, devices, hardware, and other technology equipment.\n\tMaintain accurate records of SaaS applications and account holders.\n\tTrack equipment assignments and technology assets throughout their lifecycle.\n\tMaintain organized technology documentation and records.\n\nInternal Communications & Documentation\n\n\tDevelop internal IT procedures, documentation, and how-to guides for employees.\n\tTranslate technical concepts into clear instructions for nontechnical users.\n\tDraft and distribute notifications regarding system outages, repairs, maintenance, and other technology issues.\n\nTechnology Projects\n\n\tPartner with the Manager of Cybersecurity and Technology Strategy to develop technology projects and initiatives.\n\tResearch and evaluate new legal, office, SaaS, and AI technologies.\n\tMake technology recommendations to firm leadership.\n\tCoordinate and organize vendor demonstrations.\n\tAssist with technology selection and implementation.\n\tOversee the rollout and adoption of new tools and systems.\n\nVendor Management\n\n\tServe as the primary operational point of contact for external technology vendors and outside IT providers.\n\tManage the evaluation, selection, and onboarding of new IT hardware, SaaS platforms, and service providers.\n\tCoordinate vendor support and troubleshoot service issues.\n\tTrack and resolve vendor escalations, service failures, and disputes.\n\tMonitor vendor compliance with security and data-protection requirements.\n\tReview and process IT vendor invoices.\n\nQualifications\n\n\tStrong knowledge of Microsoft 365 administration, including Entra ID, Exchange Online, and related Microsoft 365 tools.\n\tSolid understanding of IT fundamentals, including networking, switches, Wi-Fi, endpoints, and general troubleshooting.\n\tStrong working knowledge of Microsoft Office, particularly Outlook and Word.\n\tExcellent technical troubleshooting and problem-solving skills.\n\tAbility to identify the root cause of technical problems and efficiently test solutions.\n\tStrong customer-service orientation and ability to support users professionally.\n\tAbility to explain technical concepts clearly to nontechnical employees.\n\tExcellent written and verbal communication skills.\n\tExceptional attention to detail.\n\tStrong organizational and project-management abilities.\n\tProfessional demeanor with excellent judgment, discretion, and confidentiality.\n\tReliable and punctual with the ability to work independently and collaboratively.\n\tAbility to manage multiple projects, support requests, and deadlines simultaneously.\n\tComfortable adapting to emerging SaaS, cybersecurity, and AI technologies."}, {"id": "26836", "title": "Vice President of Human Resources", "bhTitle": "Human Resources", "category": "HR, Management & Fundraising", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-06", "exp": "2027-01-06", "desc": "Location: Manhattan, New York, NY\nEmployment Type: Full-Time\nWork Arrangement: Hybrid – In Office 4 Days per Week\n\nPosition Overview\n\nA healthcare organization specializing in payment integrity and clinical review solutions is seeking an accomplished Vice President of Human Resources to lead the HR function and serve as a strategic partner to senior leadership.\n\nThe organization partners with health plans and other healthcare payers nationwide to improve claims accuracy, reduce unnecessary healthcare spending, and identify opportunities for cost savings.\n\nThis is a senior leadership position with broad responsibility across employee relations, performance management, compensation, Talent Acquisition, employee engagement, compliance, HR technology, and organizational effectiveness.\n\nThe ideal candidate is a strategic HR leader who is equally comfortable advising executives, developing an HR team, and taking a hands-on approach to complex day-to-day HR matters.\n\nKey Responsibilities\n\nHR Strategy & Executive Partnership\n\n\tServe as a trusted strategic HR partner to senior executives and business leaders.\n\tDevelop and execute HR strategies aligned with organizational objectives and growth.\n\tAdvise leadership on workforce planning, organizational structure, employee performance, and talent needs.\n\tProvide HR leadership and guidance during periods of organizational growth and change.\n\tIdentify opportunities to strengthen HR operations, policies, processes, and organizational effectiveness.\n\nEmployee Relations & Performance Management\n\n\tLead complex employee relations matters and workplace investigations.\n\tProvide guidance to managers regarding employee performance, disciplinary matters, and workplace concerns.\n\tOversee performance management programs and processes.\n\tDevelop strategies to improve accountability, employee performance, and manager effectiveness.\n\tEnsure employee matters are handled consistently, professionally, and appropriately documented.\n\nTalent Acquisition & Workforce Planning\n\n\tOversee the organization's Talent Acquisition and recruiting operations.\n\tPartner with leadership to identify current and future hiring needs.\n\tEvaluate recruiting strategies, processes, and performance.\n\tEnsure the organization attracts and retains high-quality talent.\n\tDevelop and improve onboarding and employee integration processes.\n\tMonitor recruiting metrics and identify opportunities to improve efficiency and hiring outcomes.\n\nCompensation & Employee Programs\n\n\tLead and evaluate compensation programs and practices.\n\tPartner with leadership on compensation planning and related workforce decisions.\n\tHelp ensure compensation practices remain competitive, consistent, and aligned with business objectives.\n\tSupport employee retention and recognition strategies.\n\tEvaluate HR programs and recommend improvements based on organizational needs and workforce data.\n\nEmployee Engagement & Organizational Effectiveness\n\n\tDevelop initiatives that strengthen employee engagement, communication, and organizational culture.\n\tPartner with leadership to identify employee experience opportunities and organizational challenges.\n\tUse employee feedback and HR data to guide decisions and initiatives.\n\tDevelop managers and HR team members to strengthen leadership capabilities throughout the organization.\n\tLead organizational initiatives designed to improve effectiveness, collaboration, and employee retention.\n\nCompliance & HR Operations\n\n\tEnsure compliance with applicable federal, state, and local employment laws and HR requirements.\n\tOversee HR policies, procedures, documentation, and employment practices.\n\tIdentify and address potential HR and employment-related risks.\n\tMaintain appropriate standards for confidentiality, documentation, and employee information.\n\tEnsure HR processes are consistent, scalable, and aligned with organizational requirements.\n\nHR Technology & Analytics\n\n\tEvaluate and optimize HR technology, systems, and workflows.\n\tIdentify opportunities to automate and streamline HR processes.\n\tEnsure HR systems provide accurate and useful workforce information.\n\tDevelop and monitor HR metrics and reporting.\n\tUse workforce data to support executive decision-making and identify trends or areas requiring attention.\n\nTeam Leadership\n\n\tLead, coach, and develop the HR team.\n\tEstablish clear responsibilities, priorities, and performance expectations.\n\tBuild a high-performing, responsive, and service-oriented HR function.\n\tPromote accountability, professional development, and strong collaboration across the team.\n\nQualifications\n\n\tSignificant progressive Human Resources leadership experience, including experience at a senior or executive level.\n\tDemonstrated experience leading and developing HR teams.\n\tStrong experience advising senior executives and business leaders.\n\tExtensive experience managing complex employee relations matters and workplace investigations.\n\tExperience leading performance management and compensation programs.\n\tStrong knowledge of Talent Acquisition and recruiting operations.\n\tExperience developing employee engagement and organizational effectiveness initiatives.\n\tStrong understanding of employment law, HR compliance, policies, and employee relations best practices.\n\tExperience evaluating and implementing HR technology and systems.\n\tStrong business judgment and ability to balance employee needs with organizational objectives.\n\tExcellent leadership, communication, interpersonal, and problem-solving skills.\n\tAbility to operate strategically while remaining comfortable with hands-on execution.\n\tHealthcare or healthcare-services industry experience is a plus."}, {"id": "26835", "title": "Sales Representative – Pet Apparel", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-06", "exp": "2027-01-06", "desc": "We are looking for an experienced Sales Representative with strong Pet Apparel experience and established industry relationships to help us develop and grow our business.\n\nWe currently have two exciting opportunities in the Pet category and are looking for the right person to bring their expertise, relationships, and sales experience to help build these businesses.\n\nResponsibilities\n\n\tDevelop and grow sales within the pet apparel and pet products market\n\n\tLeverage existing relationships with pet retailers, specialty stores, distributors, wholesalers, and buyers\n\n\tIdentify and develop new accounts and business opportunities\n\n\tPresent products to buyers and retail partners\n\n\tManage the sales process from initial outreach through order placement\n\n\tBuild and maintain strong, long-term customer relationships\n\n\tProvide market feedback and insight on trends, pricing, products, and customer needs\n\n\tWork closely with the company to develop sales strategies and expand the business\n\nIdeal Candidate\n\n\tProven experience in pet apparel, pet products, or a closely related category\n\n\tEstablished relationships with pet-industry buyers and retailers\n\n\tStrong wholesale sales and business-development background"}, {"id": "26833", "title": "Retail Sales Associate", "bhTitle": "Retail Sales", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-10-05", "exp": "2027-01-05", "desc": "Employment Type: Full-Time or Part-Time\nSchedule: Flexible Schedule – Business Open 7 Days a Week, 9:00 AM–6:00 PM\n\nPosition Overview\n\nA retail business is seeking a responsible, friendly, and dependable Retail Sales Associate to join its team. Both full-time and part-time opportunities are available.\n\nThis is a customer-facing position ideal for someone who enjoys interacting with people, provides excellent service, and can be trusted to handle day-to-day responsibilities independently. Previous retail experience is preferred but not required.\n\nKey Responsibilities\n\n\tGreet customers and provide friendly, professional service.\n\tAssist customers with questions and product selections.\n\tHelp create a welcoming and positive shopping experience.\n\tMaintain an organized and presentable retail environment.\n\tAssist with basic sales transactions and customer purchases.\n\tAnswer customer questions in person and over the phone as needed.\n\tHelp organize and maintain merchandise.\n\tAssist with general day-to-day store responsibilities.\n\tCommunicate professionally with customers and coworkers.\n\tProvide dependable coverage during scheduled shifts.\n\tAssist with additional store responsibilities as needed.\n\nQualifications\n\n\tPrevious retail or customer service experience is preferred but not required.\n\tFriendly, personable, and comfortable interacting with customers.\n\tResponsible, reliable, and punctual.\n\tStrong communication and interpersonal skills.\n\tProfessional and customer-service oriented.\n\tAbility to work independently and as part of a team.\n\tWillingness to learn store procedures and product information.\n\tComfortable working a flexible schedule based on store needs."}, {"id": "26832", "title": "Executive Assistant", "bhTitle": "Executive Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-05", "exp": "", "desc": "Employment Type: Full-Time\n\nPosition Overview\n\nA growing wholesale company is seeking a highly organized, professional, and proactive Executive Assistant to provide direct support to senior management.\n\nThe ideal candidate is dependable, detail-oriented, and an excellent communicator who can effectively manage multiple priorities in a fast-paced environment. This individual should be comfortable taking initiative, anticipating executive needs, and handling both routine responsibilities and time-sensitive matters with discretion and professionalism.\n\nKey Responsibilities\n\n\tProvide day-to-day administrative and organizational support to senior management.\n\tManage executive calendars, appointments, meetings, and scheduling.\n\tCoordinate meetings and ensure timely follow-up on outstanding items.\n\tManage emails, correspondence, phone calls, and other communications as needed.\n\tPrepare documents, reports, presentations, and other business materials.\n\tMaintain organized files, records, and important information.\n\tCoordinate travel arrangements, itineraries, reservations, and related logistics as needed.\n\tTrack deadlines, priorities, projects, and action items to ensure timely completion.\n\tCommunicate and coordinate with employees, customers, vendors, and other business contacts.\n\tHandle confidential and sensitive business information with discretion.\n\tAssist with special projects and additional administrative responsibilities as needed.\n\tAnticipate executive needs and proactively address issues before they arise.\n\tHelp ensure day-to-day executive and office operations run efficiently.\n\nQualifications\n\n\tPrevious experience as an Executive Assistant, Administrative Assistant, or in a similar professional support role.\n\tExcellent organizational skills and strong attention to detail.\n\tStrong written and verbal communication skills.\n\tExcellent follow-up and time-management abilities.\n\tAbility to prioritize and manage multiple responsibilities simultaneously.\n\tProfessional, dependable, and comfortable working in a fast-paced business environment.\n\tProactive problem-solver who takes initiative and follows through on responsibilities.\n\tStrong computer skills, including Microsoft Office and general business applications.\n\tAbility to communicate professionally with internal and external contacts.\n\tAbility to maintain confidentiality and exercise sound judgment.\n\tComfortable working independently while collaborating with senior management and other team members."}, {"id": "26831", "title": "E-Commerce Operations Associate", "bhTitle": "ECommerce Manager", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-05", "exp": "2027-01-05", "desc": "Location: Brooklyn, NY – In Office\nEmployment Type: Full-Time\nSchedule: Monday–Thursday, 9:30 AM–6:30 PM\n\nPosition Overview\n\nA growing e-commerce linen company in Brooklyn is seeking a reliable and organized E-Commerce Operations Associate to join its team full-time.\n\nThis is a hands-on position that combines e-commerce operations, order management, general office responsibilities, and occasional warehouse support. The ideal candidate is comfortable working on a computer throughout the day while also being willing to assist with packaging and preparing products for shipment when needed.\n\nKey Responsibilities\n\n\tAssist with the day-to-day operation of the company's e-commerce business.\n\tProcess and manage online customer orders.\n\tReview orders for accuracy and ensure they are properly prepared for fulfillment.\n\tUpdate product, order, customer, and inventory information as needed.\n\tAssist with general e-commerce administrative responsibilities.\n\tMonitor orders and help resolve fulfillment or shipping issues.\n\tCoordinate with the warehouse to ensure orders are processed and shipped accurately.\n\tAssist with inventory and product organization.\n\tOccasionally package, label, and prepare products for shipment in the warehouse.\n\tHelp maintain an organized and efficient order fulfillment process.\n\tProvide general office and operational support as needed.\n\tAssist the team with additional e-commerce projects and responsibilities as the business grows.\n\nQualifications\n\n\tPrevious experience in e-commerce, online retail, order processing, fulfillment, or office operations is preferred.\n\tComfortable working with computers and learning e-commerce platforms and systems.\n\tStrong organizational skills and attention to detail.\n\tAbility to accurately process orders and maintain records.\n\tReliable, punctual, and responsible.\n\tAbility to manage multiple responsibilities in a fast-paced environment.\n\tComfortable assisting with hands-on packaging and warehouse tasks when necessary.\n\tStrong communication and problem-solving skills.\n\tAbility to work effectively both independently and as part of a team."}, {"id": "26830", "title": "Director of Development", "bhTitle": "Development/ Fundraiser", "category": "HR, Management & Fundraising", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-05", "exp": "2027-01-05", "desc": "Location: Brooklyn, NY – On-Site\nEmployment Type: Full-Time, Exempt\nSchedule: Monday–Friday, Standard Business Hours\n\nPosition Overview\n\nA vibrant community-based nonprofit organization is seeking a commercially minded Director of Development to build and lead a disciplined, data-driven, and accountable fundraising operation.\n\nThe Director will have two primary mandates: strengthen the strategy, infrastructure, and support that enable Board and lay leadership to successfully raise significant funds within the community, while also developing new revenue from corporations, foundations, family offices, government funding, sponsorships, institutional partners, and other opportunities.\n\nThis is both a leadership and hands-on individual contributor role. The Director will own the organization's development strategy and fundraising goals while personally researching prospects, developing proposals, managing the fundraising pipeline, and participating in donor and partner conversations.\n\nKey Responsibilities\n\nFundraising Strategy & Growth\n\n\tOwn the annual and multi-year development plan and take accountability for achieving fundraising goals.\n\tBuild and manage a disciplined fundraising pipeline from prospect identification through cultivation, solicitation, commitment, and collection.\n\tDevelop a diversified fundraising strategy that strengthens community giving while expanding outside revenue sources.\n\tDesign and manage digital donor acquisition funnels across email, social media, and web landing pages.\n\tDevelop strategies to convert prospective donors into recurring contributors.\n\tEvaluate fundraising opportunities based on potential revenue, probability, required investment, and strategic fit.\n\tPartner with Finance to maintain visibility into pledges, payments, and outstanding commitments.\n\tDevelop strategies to reduce the time between donor pledges and payment.\n\nBoard & Community Fundraising\n\n\tDevelop the strategy, structure, tools, and accountability needed to support successful Board and lay-led fundraising.\n\tTranslate existing relationships and community connections into actionable fundraising plans.\n\tEstablish clear prospect ownership, recommended asks, next steps, and follow-up.\n\tPartner with the CEO, Board President, and other leadership to identify and prioritize prospective donors.\n\tDetermine the appropriate strategy and solicitor for major fundraising opportunities.\n\tPrepare Board members and other solicitors for donor conversations with research, giving history, relationship context, talking points, and recommended ask strategies.\n\tTrack fundraising activity and ensure opportunities continue moving through the pipeline.\n\tParticipate in and, when appropriate, directly lead fundraising conversations.\n\nInstitutional Giving & New Revenue\n\n\tDevelop new revenue opportunities with corporations, foundations, family offices, government agencies, and other funding partners.\n\tManage the complete grant lifecycle, including prospecting, qualification, applications, submissions, reporting, and renewals.\n\tIdentify and pursue appropriate government funding opportunities.\n\tCoordinate government applications, relationships, reporting, and compliance as needed.\n\tDevelop sponsorship opportunities around programs, events, facilities, audiences, and community reach.\n\tCollaborate with program and organizational leaders to identify initiatives that may attract outside funding.\n\tContinuously identify new partnerships and revenue opportunities.\n\nDevelopment Operations, Data & Technology\n\n\tEstablish and maintain the CRM, prospect data, and reporting infrastructure needed to effectively manage fundraising.\n\tImplement consistent processes for prospect management, gift tracking, and donor follow-up.\n\tBuild and manage a disciplined pledge collection process.\n\tTrack outstanding commitments, aging, follow-up, and escalation.\n\tDevelop a consistent donor stewardship and engagement strategy designed to strengthen relationships and improve retention.\n\tUse technology, automation, and AI to improve prospect research, relationship mapping, grant discovery, reporting, and team productivity.\n\tEstablish meaningful fundraising KPIs.\n\tMaintain accurate fundraising forecasts and identify potential performance gaps early.\n\tRegularly report fundraising performance, pipeline activity, collections, risks, and opportunities to senior leadership.\n\nLeadership & Cross-Functional Partnership\n\n\tServe as the organization's internal leader on fundraising strategy and development.\n\tPartner closely with the CEO, Board leadership, Finance, Marketing, and program teams.\n\tBring coordination, structure, and accountability to fundraising efforts across the organization.\n\tBuild strong relationships with donors, prospective donors, partners, and community stakeholders.\n\tNavigate a close-knit, relationship-driven community with discretion, cultural sensitivity, and sound judgment.\n\tOperate effectively as both a strategic leader and hands-on contributor.\n\nKey Performance Indicators\n\nSuccess in this position will be measured through:\n\n\tAchievement of annual fundraising goals\n\tCash collections against fundraising commitments\n\tGrowth and quality of the fundraising pipeline\n\tBoard and lay leadership fundraising effectiveness\n\tCorporate and institutional revenue growth\n\tFoundation and family office funding\n\tGovernment funding\n\tSponsorship revenue\n\tDonor retention and stewardship\n\tPledge collection rates\n\tAging of outstanding commitments\n\tAverage time between pledge and payment\n\tFundraising ROI and pipeline conversion\n\tForecasting accuracy\n\tCRM and technology utilization\n\nQualifications\n\n\t7+ years of relevant experience in development, fundraising, institutional advancement, partnerships, business development, or a related field.\n\tDemonstrated success building and executing fundraising or revenue-growth strategies.\n\tExperience supporting Board members, executives, senior leaders, or volunteers in successful fundraising efforts.\n\tDemonstrated experience managing multi-channel digital fundraising campaigns.\n\tExperience with institutional giving, corporate partnerships, sponsorships, grants, and major gifts.\n\tStrong financial and analytical skills.\n\tExperience with pipeline management, forecasting, budgeting, and performance measurement.\n\tStrong project-management and organizational abilities.\n\tExcellent follow-through and accountability.\n\tExperience with nonprofit CRM platforms such as Bloomerang or comparable systems.\n\tComfortable using data, technology, automation, AI, and modern fundraising tools.\n\tExcellent writing, presentation, and communication skills.\n\tProfessional presence and sound judgment when working with significant donors and partners.\n\tEntrepreneurial approach with the ability to identify and develop new revenue opportunities.\n\tAbility to introduce structure and accountability into a relationship-driven environment.\n\tWillingness to personally execute fundraising activities rather than solely managing or delegating them."}, {"id": "26829", "title": "Director of Membership", "bhTitle": "Director", "category": "HR, Management & Fundraising", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-05", "exp": "2027-01-05", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday–Friday, Standard Business Hours\n\nPosition Overview\n\nA community-based nonprofit organization is seeking an experienced Director of Membership to lead the full membership lifecycle, from acquisition and onboarding through engagement, renewal, retention, and reactivation.\n\nThis is a senior leadership role with responsibility for membership growth, revenue, pricing, member experience, technology, operations, and team performance. The Director will evaluate the current membership function, identify opportunities for improvement, and build scalable systems that strengthen both membership growth and the overall member experience.\n\nThe ideal candidate combines strong business and operational judgment with an understanding of how to build trust and relationships within a close-knit community.\n\nKey Responsibilities\n\nMembership Growth & Revenue\n\n\tOwn annual goals for membership growth, acquisition, retention, renewals, reactivation, and revenue.\n\tDevelop and execute membership growth and acquisition strategies in partnership with Marketing and senior leadership.\n\tBuild and manage a structured prospect pipeline from initial inquiry through conversion.\n\tDevelop targeted prospect segments and consistent follow-up strategies.\n\tCreate and optimize digital recruitment funnels across email, social media, and web landing pages.\n\tEvaluate membership pricing, categories, packages, and promotional strategies.\n\tAnalyze the financial and membership impact of pricing and packaging changes.\n\tOwn the membership budget and forecast membership units, revenue, retention, and pipeline performance.\n\tMonitor campaign performance, acquisition costs, conversion rates, and ROI.\n\nMember Experience & Retention\n\n\tOversee the complete member journey from initial inquiry and onboarding through engagement, renewal, retention, and reactivation.\n\tDevelop strategies that make joining and participating in the organization easier and more welcoming.\n\tBuild strong relationships with members, prospective members, community stakeholders, and organizational leadership.\n\tUse member feedback, data, and direct outreach to identify changing needs and opportunities.\n\tDevelop strategies to increase member engagement and satisfaction.\n\tIdentify members at risk of leaving and develop appropriate retention and reactivation strategies.\n\tOversee membership policies, categories, eligibility standards, and exception processes.\n\tEnsure membership policies are applied consistently and professionally.\n\nTechnology, Data & AI\n\n\tOversee the organization's membership technology platforms, systems, and workflows.\n\tEnsure membership data is accurate, organized, and useful for decision-making.\n\tDevelop and maintain dashboards and reporting for key membership metrics.\n\tUse technology, automation, and AI to improve lead management, communications, reporting, personalization, and member service.\n\tIdentify opportunities to automate repetitive administrative processes.\n\tImprove the efficiency and scalability of membership operations.\n\tEnsure the team effectively utilizes CRM, membership, and marketing automation platforms.\n\nTeam Leadership\n\n\tLead, coach, and develop a team of Membership Associates.\n\tEstablish clear goals, KPIs, service standards, and accountability.\n\tMonitor team productivity and member-service performance.\n\tEvaluate existing team structure, responsibilities, skills, and workflows.\n\tImplement improvements that increase efficiency and service quality.\n\tFoster a professional, responsive, and service-oriented team culture.\n\nCross-Department Collaboration\n\n\tPartner with Marketing on acquisition campaigns, segmentation, communications, renewals, and reactivation.\n\tCollaborate with Programs to better understand member engagement and connect members with relevant programs and experiences.\n\tWork closely with Finance on membership revenue, forecasting, budgeting, pricing, and financial performance.\n\tPartner with the CEO and senior leadership on membership strategy, priorities, performance, and key decisions.\n\tPresent membership results, risks, trends, and opportunities to senior leadership.\n\nKey Performance Indicators\n\nSuccess will be measured through:\n\n\tNet membership growth\n\tMembership revenue\n\tNew member acquisition\n\tProspect-to-member conversion\n\tRenewal and retention rates\n\tMember reactivation\n\tMember engagement and satisfaction\n\tPricing and package performance\n\tMembership campaign ROI\n\tCost of acquisition\n\tBudget and forecast performance\n\tTeam productivity and service quality\n\tTechnology adoption and operational efficiency\n\nQualifications\n\n\t7+ years of relevant professional experience in membership, subscription, hospitality, fitness, club, community, cultural, or another relationship-driven recurring-revenue environment.\n\tAt least 3 years of leadership experience with direct responsibility for growth, retention, revenue, and member or customer experience.\n\tExperience managing an in-person membership or customer journey, rather than exclusively digital subscription models.\n\tDemonstrated success increasing acquisition, conversion, retention, engagement, and revenue.\n\tHands-on experience with pricing, packaging, segmentation, budgeting, forecasting, and performance management.\n\tStrong financial and business acumen.\n\tProven experience leading and developing high-performing teams.\n\tStrong knowledge of KPIs, dashboards, CRM or membership platforms, and marketing automation.\n\tExperience using technology, automation, and AI to improve operations and productivity.\n\tStrong project and change-management abilities.\n\tExcellent interpersonal and communication skills.\n\tStrong discretion and ability to navigate sensitive member situations professionally.\n\tAbility to build trust and relationships within a close-knit, community-focused environment.\n\tStrong judgment and ability to evaluate and improve established processes.\n\tHigh level of accountability, ownership, and follow-through."}, {"id": "26828", "title": "Interior House Painting Instructor", "bhTitle": "Teacher", "category": "Education & Childcare", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-05", "exp": "2027-01-05", "desc": "Location: Brooklyn, NY – In Person\nEmployment Type: Part-Time / Temporary\nSchedule: 10 Total Hours – November 2026\n\nPosition Overview\n\nA Brooklyn nonprofit organization that provides free skills training to adults preparing for careers in the trades is seeking an experienced Interior House Painting Instructor to lead a short-term, hands-on training program.\n\nThe instructor will teach adult beginners the fundamentals of professional interior painting, combining demonstrations with supervised hands-on practice. The goal is to help students develop practical skills, understand job-site expectations, and prepare for paid work in the painting and home improvement trades.\n\nKey Responsibilities\n\n\tTeach the fundamentals of interior residential painting to adult learners.\n\tDemonstrate proper surface preparation techniques.\n\tTeach patching, sanding, taping, and other preparation methods.\n\tDemonstrate proper cutting-in and rolling techniques.\n\tIntroduce students to basic paint spraying techniques.\n\tTeach proper setup, breakdown, and cleanup procedures.\n\tExplain the appropriate use and care of painting tools, equipment, and materials.\n\tCover essential job-site safety procedures, including lead-safe practices.\n\tDemonstrate techniques for completing painting projects efficiently while maintaining professional-quality standards.\n\tSupervise students during hands-on practice.\n\tProvide real-time instruction, corrections, and constructive feedback.\n\tAnswer questions and explain techniques in a clear and patient manner.\n\tHelp students understand professional expectations and proper job-site conduct.\n\nQualifications\n\n\tMust be a licensed painting or home improvement contractor OR currently work under a licensed contractor.\n\tSolid professional experience performing interior house painting.\n\tStrong knowledge of surface preparation, patching, sanding, taping, cutting in, rolling, and basic spraying techniques.\n\tFamiliarity with painting tools, materials, job-site safety, and lead-safe practices.\n\tAbility to demonstrate painting techniques in a hands-on classroom environment.\n\tAbility to explain professional skills clearly and patiently to adult beginners.\n\tReliable, professional, and comfortable working directly with students on site.\n\tPrevious teaching, training, mentoring, or supervisory experience is a plus but not required."}, {"id": "26826", "title": "Controller", "bhTitle": "Controller", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-05", "exp": "", "desc": "Location: Somerset, NJ – In-Person\nEmployment Type: Part-Time to Full-Time\nSchedule: Flexible / Based on Business Needs\n\nPosition Overview\n\nA growing company in Somerset, New Jersey is seeking an experienced Controller to oversee and manage the company's day-to-day accounting and financial operations.\n\nThis is a hands-on position for an accounting professional who is comfortable taking ownership of the accounting function rather than solely providing high-level oversight. The Controller will be responsible for maintaining accurate financial records, overseeing accounts payable and receivable, completing reconciliations and month-end close, preparing financial reports, and coordinating with the company's outside CPA or accounting firm when necessary.\n\nThe position will initially be part-time, with the potential to grow into a full-time role based on the company's needs.\n\nKey Responsibilities\n\nAccounting & Financial Operations\n\n\tOversee the company's day-to-day accounting and bookkeeping functions.\n\tManage accounts receivable and collections.\n\tOversee accounts payable, including invoices and payments.\n\tMonitor outstanding customer balances and follow up on collections.\n\tMaintain accurate general ledger and financial records.\n\tReview transactions and ensure expenses are properly recorded and categorized.\n\tIdentify discrepancies and investigate accounting or financial issues.\n\tMaintain organized supporting documentation for financial transactions.\n\nReconciliations & Month-End Close\n\n\tPerform and review bank and account reconciliations.\n\tInvestigate and resolve reconciliation discrepancies.\n\tManage the month-end closing process.\n\tPrepare journal entries and adjustments as necessary.\n\tEnsure financial records are complete and accurate before closing each reporting period.\n\nFinancial Reporting\n\n\tPrepare and review financial statements and management reports.\n\tProvide accurate and timely financial information to ownership and management.\n\tMonitor expenses and identify unusual transactions, discrepancies, or opportunities for improved financial controls.\n\tAssist management in understanding the company's financial performance.\n\tMaintain accurate accounting records to support tax preparation and year-end reporting.\n\nCPA & External Accounting Coordination\n\n\tCoordinate with the company's outside CPA and accounting firm as needed.\n\tPrepare financial records and supporting documentation for tax and year-end purposes.\n\tRespond to accounting questions and provide requested reports or documentation.\n\tHelp ensure the company's internal accounting records remain organized and ready for outside review.\n\nQualifications\n\n\tPrevious Controller, senior accounting, or comparable hands-on accounting experience required.\n\tStrong accounting and bookkeeping background.\n\tHands-on experience with accounts payable, accounts receivable, and collections.\n\tExperience performing bank and account reconciliations.\n\tStrong understanding of general ledger accounting and month-end close.\n\tExperience preparing and reviewing financial statements.\n\tProficiency with accounting software.\n\tStrong Microsoft Excel skills.\n\tExcellent attention to detail and accuracy.\n\tStrong organizational and problem-solving abilities.\n\tAbility to identify and resolve financial discrepancies.\n\tComfortable working independently and taking ownership of the accounting function.\n\tDependable, professional, and capable of handling confidential financial information.\n\tExperience coordinating with outside CPAs or accounting firms preferred."}, {"id": "26825", "title": "Assistant Property Manager", "bhTitle": "Property Manager", "category": "Real Estate & Property", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-05", "exp": "2027-01-05", "desc": "Location: New York, NY\nEmployment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nA well-established New York City real estate firm is seeking a motivated and organized Assistant Property Manager to support the day-to-day management of a portfolio of residential and select commercial properties.\n\nThis position works closely with the Property Manager and ownership across tenant relations, leasing, maintenance coordination, rent collection, regulatory compliance, property inspections, and financial reporting.\n\nThe role is an excellent opportunity for someone with property management experience who is looking to expand their responsibilities and grow within an active NYC real estate organization.\n\nKey Responsibilities\n\nProperty & Tenant Management\n\n\tServe as a primary point of contact for tenant inquiries, requests, and complaints.\n\tRespond to tenant concerns professionally and ensure issues are addressed in a timely manner.\n\tMaintain positive and professional relationships with tenants.\n\tAssist with the day-to-day operations of residential and select commercial properties.\n\tMaintain accurate tenant, lease, and property records within the property management system.\n\nMaintenance & Property Operations\n\n\tCoordinate maintenance and repair requests with in-house staff and outside vendors.\n\tCreate and track work orders through completion.\n\tFollow up with tenants, maintenance staff, and vendors regarding outstanding issues.\n\tConduct periodic property inspections.\n\tIdentify maintenance concerns, violations, or deficiencies and coordinate appropriate follow-up.\n\tHelp ensure properties are properly maintained and operational issues are addressed promptly.\n\nLeasing & Rent Administration\n\n\tSupport leasing activities, including property showings, application processing, lease preparation, and renewals.\n\tMaintain accurate leasing and tenant documentation.\n\tAssist with rent collection and monitor outstanding balances.\n\tTrack arrears and conduct appropriate follow-up.\n\tPrepare notices, reports, correspondence, and other property-related documentation.\n\nCompliance\n\n\tAssist with maintaining compliance with applicable NYC and New York State housing regulations.\n\tSupport compliance related to rent stabilization and DHCR requirements.\n\tAssist with DOB, HPD, Local Law, and other regulatory requirements.\n\tTrack violations and deficiencies and follow up through resolution.\n\tMaintain organized compliance records and documentation.\n\tKnowledge of Good Cause Eviction and NYC housing compliance frameworks is strongly preferred.\n\nReporting & Administrative Support\n\n\tAssist with property and financial reporting.\n\tMaintain accurate information within Yardi or other property management software.\n\tPrepare and review routine reports, notices, and correspondence.\n\tSupport the Property Manager and ownership with special projects as needed.\n\tHelp maintain organized property files and documentation.\n\nQualifications\n\n\tMinimum 1–3 years of experience in residential property management or a related real estate role.\n\tAt least 1 year of property management experience required.\n\tFamiliarity with NYC housing regulations and compliance strongly preferred.\n\tKnowledge of rent stabilization, DHCR, Good Cause Eviction, DOB, HPD, and NYC Local Laws is a strong plus.\n\tProficiency with Microsoft Excel, Word, and Outlook.\n\tExperience with Yardi or similar property management software is a plus.\n\tStrong organizational and time-management skills.\n\tExcellent attention to detail.\n\tStrong written and verbal communication skills.\n\tProfessional and customer-service-oriented approach to tenant relations.\n\tAbility to manage multiple priorities in a fast-paced environment.\n\tAbility to work effectively with tenants, vendors, maintenance teams, management, and ownership.\n\tEnglish proficiency required.\n\tSpanish or other bilingual capabilities are a plus.\n\tBachelor's degree preferred."}, {"id": "26822", "title": "Part Time E-Commerce Growth Manager", "bhTitle": "Part Time E-Commerce Growth Manager", "category": "E-commerce, Marketing & Social Media", "type": "Part Time", "typeNote": "", "state": "NJ", "added": "2026-10-01", "exp": "2027-01-07", "desc": "Hours: 9:00 - 4:30, Monday–Wednesday\n\nLocation: Eatontown NJ\n\nDrive sales for our boutique jewelry brand by optimizing our D2C and B2B online stores, creating high quality mobile content, and deploying it across paid ads, email marketing, and organic social\n\nKey Responsibilities\n\n\tShopify Store Optimization (D2C): Maintain product listings, collection pages, homepage banners, and basic SEO to maximize conversion rates and average order value.\n\tFaire Store Optimization (B2B): Maintain product listings, collection pages, homepage banners, and basic SEO to maximize conversion rates and average order value.\n\tMobile & AI Content Creation: Shoot and edit mobile photos and vertical videos featuring jewelry styling, layering, and product launches using AI tools.\n\tPaid Ads Management: Launch, test, and optimize Meta and Google ad campaigns to drive profitable customer acquisition.\n\tEmail Marketing & Retention: Build and manage automated email flows and send promotional newsletters to drive repeat purchases and customer loyalty.\n\tInstagram Growth: Create and execute a weekly Instagram content calendar focused on driving sales, flash deals, and brand engagement.\n\nQualifications\n\n\tE-Commerce Experience: Experience managing and optimizing online product listings.\n\tContent Creation: Proficient using a phone or camera to capture quality product photos and video.\n\tAI Editing: Proficient using AI tools (Canva, Photoroom, Gemini) to create editorial-quality visuals.\n\tGrowth Marketing: Experience running profitable Meta/Google ad campaigns and setting up email flows.\n\tAesthetic Eye: Strong visual sense and interest in jewelry styling, layering, and lifestyle branding."}, {"id": "26821", "title": "Outbound Outreach Representative & Brand Specialist", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-09-30", "exp": "2026-12-30", "desc": "Location: West Long Branch, NJ (In-Office)\nJob Type: Full-time\nSchedule: Monday through Friday\n\nA fire safety company is seeking an energetic and articulate Outbound Outreach Representative to join our team in West Long Branch, NJ. In this role, your primary focus will be connecting with local homeowners over the phone to educate them on home fire safety hazards and introduce our signature 9-point Residential Fire Safety Walkthrough.\n\nThis position also offers an exciting growth track for candidates with creative talent. If you are comfortable in front of the camera and skilled in interviewing, recording, editing, and publishing social media content, you can expand your role to become the digital face of our company across local social channels.\n\nKey Responsibilities:\n\n\tConduct outbound calls to local residents to inform them about home fire safety risks and our walkthrough services.\n\n\tEducate homeowners on key risks including expired smoke detectors, carbon monoxide placement, and dryer vent lint buildup.\n\n\tSchedule residential fire safety walkthroughs for our field specialists.\n\n\tMaintain accurate, organized records of phone contacts, follow-ups, and scheduled appointments.\n\n\t(Optional) Serve as the on-camera host and brand ambassador for company social media channels.\n\n\t(Optional) Plan, record, edit, and post engaging video content, including local interviews, safety tips, and behind-the-scenes clips.\n\nQualifications:\n\n\tStrong verbal communication skills with a confident, friendly, and persuasive phone demeanor.\n\n\tComfortable making consistent outbound calls to local community members.\n\n\tAbility to clearly explain safety services and address homeowner questions.\n\n\tBasic computer literacy for tracking phone contacts and updating appointment calendars.\n\n\tPrior experience in telemarketing, outbound sales, appointment setting, or customer service is a plus.\n\n\tFor the expanded social media role: hands-on experience with video recording, editing software/apps, and managing social media accounts.\n\nWhat We Offer:\n\n\tFull-time schedule operating directly out of our West Long Branch office.\n\n\tA meaningful role helping improve safety across our local Shore community.\n\n\tOpportunities for professional growth and creative freedom in content production."}, {"id": "26820", "title": "AI Consultancy Sales Manager", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Remote / Hybrid", "typeNote": "Remote/Hybrid/PT", "state": "NY", "added": "2026-09-29", "exp": "2026-12-29", "desc": "Location: Remote\nEmployment Type: Part-Time or Full-Time\nSchedule: Flexible Hours\n\nPosition Overview\n\nAn AI education and consulting community serving businesses and entrepreneurs is seeking motivated AI Consultancy Sales Managers to grow its membership.\n\nThis is a flexible, remote sales opportunity focused on connecting with business owners, entrepreneurs, employees, and professionals who are interested in using artificial intelligence to improve their work or business.\n\nMembers receive access to AI consulting, educational content, courses, community resources, career support, and office hours. The Sales Manager will identify prospective members, explain the value of the membership, answer questions, and convert qualified prospects into paying members. Pasted markdown\n\nKey Responsibilities\n\n\tIdentify and develop prospective members through personal networks, referrals, and outbound prospecting.\n\tConnect with business owners, entrepreneurs, professionals, and employees who may benefit from AI education and consulting.\n\tConduct outreach through WhatsApp, LinkedIn, email, phone, and in-person conversations.\n\tLearn about each prospect's business or professional needs and identify ways AI may be useful to them.\n\tClearly explain the membership, resources, consulting services, and benefits available.\n\tAnswer prospective member questions and handle objections professionally and accurately.\n\tFollow up consistently with prospects throughout the sales process.\n\tMaintain organized records of leads, conversations, follow-ups, and conversions using a spreadsheet or CRM.\n\tDevelop a strong understanding of the AI community and its services in order to represent the program confidently.\n\tBuild and maintain a consistent pipeline of prospective members.\n\tRepresent the organization professionally without using aggressive sales tactics or overpromising results.\n\nQualifications\n\n\tStrong sales, communication, and relationship-building abilities.\n\tComfortable initiating conversations with new prospects and consistently following up.\n\tStrong professional written and verbal English communication skills.\n\tHighly organized and capable of managing a large pipeline of prospects.\n\tSelf-motivated and comfortable working independently in a remote environment.\n\tComfortable using AI tools such as ChatGPT or Claude, or motivated to learn AI technology quickly.\n\tAbility to understand business needs and clearly communicate how AI tools and services may provide value.\n\tProfessional, trustworthy, and ethical approach to sales.\n\tPrevious experience in sales, marketing, recruiting, business development, or community building is a strong plus but not required.\n\tExisting professional or community networks that can support business development are a plus."}, {"id": "26819", "title": "Sales Executive", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-29", "exp": "2026-12-30", "desc": "Employment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nA growing wholesale footwear company is seeking a motivated and results-driven Sales Executive to develop new business, open new accounts, and grow existing customer relationships.\n\nThe ideal candidate has previous footwear industry sales experience, understands the wholesale footwear market, and is comfortable prospecting, presenting collections to buyers, and managing accounts throughout the sales process.\n\nThis is an opportunity for a sales professional who combines strong industry knowledge with the drive to develop new business and build long-term customer relationships.\n\nKey Responsibilities\n\nNew Business Development\n\n\tIdentify and develop new wholesale footwear accounts and business opportunities.\n\tProspect and reach out to potential retail and wholesale customers.\n\tBuild relationships with buyers and key decision-makers.\n\tGenerate leads and maintain consistent outreach to prospective accounts.\n\tDevelop opportunities from initial contact through presentation, negotiation, and close.\n\tMaintain an active pipeline of new business opportunities.\n\nAccount Management & Sales\n\n\tManage and grow relationships with existing customers.\n\tIdentify opportunities to increase sales within current accounts.\n\tPresent footwear collections, new products, and seasonal offerings to buyers.\n\tUnderstand customer needs and recommend appropriate products and assortments.\n\tFollow up consistently on leads, opportunities, orders, and customer requests.\n\tWork toward individual sales, account-growth, and revenue goals.\n\tBuild long-term relationships that encourage repeat business.\n\nMarket & Product Knowledge\n\n\tDevelop a strong understanding of the company's footwear collections and product offerings.\n\tStay informed about footwear trends, competitors, pricing, and customer needs.\n\tGather buyer feedback and communicate relevant market information to internal teams.\n\tIdentify emerging sales opportunities within the wholesale footwear market.\n\nInternal Collaboration\n\n\tCoordinate with internal teams to provide strong customer service and account support.\n\tCommunicate customer needs, order information, and sales opportunities to the appropriate departments.\n\tHelp address account questions and resolve issues efficiently.\n\tAttend buyer meetings, trade shows, market appointments, and industry events as needed.\n\nQualifications\n\n\tPrevious footwear industry sales experience required.\n\tStrong understanding of the wholesale footwear market and sales process.\n\tExisting relationships with footwear buyers and retail accounts are a strong plus.\n\tDemonstrated ability to prospect and develop new business.\n\tStrong sales, negotiation, and relationship-building abilities.\n\tExcellent written and verbal communication skills.\n\tStrong presentation skills and confidence working directly with buyers.\n\tExcellent follow-up and organizational abilities.\n\tSelf-motivated, proactive, and results-oriented.\n\tAbility to manage multiple accounts and sales opportunities simultaneously.\n\tComfortable working independently while collaborating with the broader team.\n\tAbility to maintain an organized sales pipeline and consistently work toward revenue goals."}, {"id": "26818", "title": "VP of Sales", "bhTitle": "Sales- Senior Level", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-29", "exp": "2026-12-29", "desc": "Employment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nA growing wholesale footwear company is seeking an experienced Vice President of Sales to lead its sales organization, expand key accounts, and drive continued revenue growth.\n\nThis is a senior leadership position for a proven sales professional with significant footwear industry experience, established retail and wholesale relationships, and a strong track record of developing major accounts.\n\nThe VP of Sales will be responsible for setting the overall sales strategy while remaining actively involved in key customer relationships, new business development, and major sales opportunities.\n\nKey Responsibilities\n\
