edule.\n\nSchedule"}, {"id": "26749", "title": "Direct Support Professional (DSP)", "bhTitle": "Companion", "category": "Healthcare & Human Services", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-10", "exp": "2026-12-10", "desc": "Location: Crown Heights, NY\nEmployment Type: Part-Time\nSchedule: Monday–Thursday, 5:00 PM–8:00 PM , Fridays 1:00 PM - 3:00 PM\n\nPosition Overview\n\nA family in Brooklyn, NY is seeking a caring, energetic, and dependable Direct Support Professional (DSP) to provide companionship and support to an individual during afternoons, evenings, and Sundays.\n\nThe primary focus of this role is to provide positive social interaction, recreational activities, and encouragement toward greater independence. The ideal candidate is engaging, patient, active, and enjoys participating in sports, games, and other recreational activities.\n\nKey Responsibilities\n\n\tSpend quality one-on-one time with the individual.\n\tEngage in sports, games, and recreational activities based on his interests.\n\tPlan enjoyable and appropriate activities during scheduled hours.\n\tEncourage independence with everyday activities and routines.\n\tHelp build confidence and reinforce positive decision-making.\n\tEncourage social interaction and participation in activities.\n\tProvide companionship and a consistent, supportive presence.\n\tPromote the development of age-appropriate independent living and social skills.\n\tEncourage physical activity and an active routine.\n\tMaintain appropriate communication with the family regarding activities and progress.\n\tProvide support in a patient, respectful, and encouraging manner.\n\nQualifications\n\n\tPrevious experience as a DSP, mentor, companion, paraprofessional, caregiver, or similar support role is preferred but not required.\n\tEnergetic and comfortable participating in sports and games.\n\tPatient, encouraging, responsible, and dependable.\n\tStrong interpersonal and communication skills.\n\tAbility to build a positive and supportive relationship.\n\tComfortable encouraging independence while providing appropriate support.\n\tReliable and able to maintain the scheduled hours consistently."}, {"id": "26748", "title": "Sales Representative", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-10", "exp": "2026-12-10", "desc": "Location: New York, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nA new and growing company is seeking an energetic, motivated, and personable Sales Representative to help build its customer base and grow the business.\n\nThis is an excellent opportunity for someone who is early in their sales career and hungry to build a book of business. Entry-level candidates will be considered, although some previous sales experience is preferred.\n\nBecause the company is new, accounts and territories are largely open, giving the right salesperson significant opportunity to develop new relationships, bring in accounts, and grow alongside the business.\n\nKey Responsibilities\n\n\tProspect and develop new customer accounts.\n\tBuild a pipeline of potential clients and business opportunities.\n\tConduct outreach through phone, email, networking, and other sales channels.\n\tIntroduce the company's products and services to prospective customers.\n\tDevelop strong relationships with new and existing accounts.\n\tFollow up consistently with prospects and customers.\n\tIdentify new markets, accounts, and opportunities for growth.\n\tManage the sales process from initial outreach through closing.\n\tMaintain organized records of leads, conversations, and opportunities.\n\tWork closely with management to develop sales strategies.\n\tMeet and exceed individual sales and revenue goals.\n\tHelp establish the company's customer base as the business grows.\n\nQualifications\n\n\tEntry-level candidates are welcome to apply.\n\tSome previous sales, business development, retail, wholesale, or customer-facing experience is preferred.\n\tEnergetic, motivated, and eager to develop a career in sales.\n\tStrong communication and interpersonal skills.\n\tComfortable prospecting and approaching new customers.\n\tConfident speaking with prospective clients and decision-makers.\n\tPersistent and comfortable following up with leads.\n\tStrong relationship-building abilities.\n\tSelf-motivated and results-oriented.\n\tOrganized and able to manage multiple leads and opportunities.\n\tWillingness to learn and take coaching.\n\tEntrepreneurial mindset and excitement about joining a new and growing company."}, {"id": "26747", "title": "Livestream Sales Representative – Whatnot & TikTok Shop", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-10", "exp": "2026-12-10", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time In-Person / On-Site\nSchedule: Flexible, Approximately 20–30 Hours per Week\n\nPosition Overview\n\nA Brooklyn-based jewelry company is seeking an energetic, personable, and sales-driven Live Sales Representative to sell jewelry through Whatnot, TikTok Shop, and other live-selling platforms.\n\nThis is a highly interactive, on-camera sales position for someone who enjoys engaging with customers, presenting products, and closing sales. The ideal candidate is confident, enthusiastic, comfortable speaking live on camera, and able to create an engaging shopping experience that converts viewers into customers.\n\nThe position will begin with base pay during training while the candidate learns the jewelry collection, selling techniques, and live-commerce platforms.\n\nKey Responsibilities\n\n\tHost engaging, entertaining, and sales-focused live streams on Whatnot, TikTok Shop, and other relevant platforms.\n\tPresent and demonstrate jewelry in an appealing, informative, and enthusiastic manner.\n\tLearn the company's jewelry collection, including materials, styles, pricing, product features, and key selling points.\n\tEngage directly with viewers during live broadcasts.\n\tAnswer product questions and respond to comments in real time.\n\tBuild excitement around products and confidently guide viewers toward purchases.\n\tDevelop relationships with repeat viewers and customers.\n\tHelp build and maintain a loyal online following.\n\tWork with the team to select products, promotions, special offers, and themes for upcoming live streams.\n\tStay current on jewelry, social media, e-commerce, and live-shopping trends.\n\tReview sales and audience engagement to identify opportunities to improve performance.\n\tAssist with organizing and preparing merchandise before live broadcasts.\n\tMaintain a professional, energetic, and engaging on-camera presence.\n\nQualifications\n\n\tStrong sales ability and genuine enthusiasm for interacting with customers.\n\tConfident and comfortable speaking and selling on camera.\n\tEnergetic, personable, outgoing, and engaging communication style.\n\tStrong verbal communication and presentation skills.\n\tAbility to maintain enthusiasm and audience engagement throughout a live broadcast.\n\tInterest in jewelry, fashion, e-commerce, and current trends.\n\tComfortable learning detailed product information and communicating it clearly to customers.\n\tSelf-motivated, dependable, and results-oriented.\n\tComfortable working in person in Brooklyn.\n\tExperience in jewelry sales, retail sales, e-commerce, social media, or live streaming is a plus.\n\tExperience with Whatnot, TikTok Shop, or another live-selling platform is strongly preferred but not required."}, {"id": "26746", "title": "Real Estate Salesperson", "bhTitle": "Real Estate Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-09", "exp": "2026-12-04", "desc": "Location: Midtown Manhattan\nSchedule: Full-Time\n\nA fast-paced real estate investment sales firm is seeking a driven, hardworking salesperson to join their team. This is a great opportunity for someone motivated by sales and interested in building a career in commercial real estate.\n\nResponsibilities:\n\n\tGenerate and pursue new sales opportunities\n\n\tBuild and maintain client relationships\n\n\tAssist with real estate transactions and investment sales\n\n\tWork closely with the team on active properties and deals\n\nIdeal candidate: Motivated, personable, persistent, and comfortable working in a commission-based environment. Real estate experience or a license is a plus."}, {"id": "26743", "title": "Construction Manager - Boutique Luxury Condominium Redevelopment", "bhTitle": "Construction", "category": "Warehouse, Driving & Logistics", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-09", "exp": "2026-12-09", "desc": "Location: Lower Manhattan, NY\nJob Type: Full-Time\nSchedule: Onsite\n\nWe are seeking a full-time, onsite Construction Manager to oversee a boutique luxury condominium redevelopment located in Lower Manhattan. The project involves the adaptive reuse of a historic building into a limited collection of high-end residential units, integrating classical architecture with contemporary design and modern systems.\n\nThe Construction Manager will be responsible for day-to-day coordination of the project, including oversight of general contractors, consultants, and trades, ensuring the project remains on schedule, on budget, and executed to the highest level of quality. This is a hands-on role that requires consistent onsite presence, proactive problem-solving, and a deep understanding of construction sequencing, site logistics, and coordination with design and development teams.\n\nKey Responsibilities:\n\n\tManage and coordinate all aspects of construction, from pre-construction through project closeout.\n\n\tSupervise contractors, subcontractors, and field operations on a daily basis.\n\n\tTrack and manage project schedules, budgets, RFIs, submittals, and change orders.\n\n\tCollaborate closely with ownership, architects, engineers, and consultants.\n\n\tConduct regular site inspections to monitor progress, safety, and quality control.\n\n\tMaintain clear communication and reporting with ownership and the development team.\n\nQualifications:\n\n\t5 to 10 years of experience in construction management, preferably with ground-up or redevelopment projects in New York City.\n\n\tStrong understanding of building systems, DOB procedures, and luxury residential standards.\n\n\tExcellent communication, leadership, and organizational skills.\n\n\tAbility to read and interpret architectural and engineering drawings.\n\n\tFamiliarity with Procore, Microsoft Project, or similar project management tools is a plus.\n\nWhat We Offer:\n\n\tOpportunity to lead a high-profile boutique luxury redevelopment in Lower Manhattan.\n\n\tCollaborative and dynamic work environment with experienced real estate development professionals."}, {"id": "26742", "title": "Assistant Cook", "bhTitle": "Assistant Cook", "category": "Restaurant & Food Service", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-09", "exp": "2026-12-09", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: 35–40 Hours per Week\n\nPosition Overview\n\nA senior center in the Sheepshead Bay area of Brooklyn is seeking an experienced and dependable Assistant Cook to join its Dietary Department.\n\nThe Assistant Cook will work closely with the Cook and other kitchen staff to prepare and serve high-quality, nutritious meals for seniors. The ideal candidate has previous commercial kitchen experience, understands proper food preparation and sanitation practices, and can work efficiently as part of a team.\n\nKey Responsibilities\n\n\tAssist the Cook and kitchen staff with daily food preparation and meal service.\n\tPrepare and cook meals according to established menus, recipes, and dietary requirements.\n\tAssist with portioning, plating, and serving meals.\n\tPrepare ingredients and complete other food-preparation tasks as needed.\n\tHelp maintain a clean, safe, sanitary, and organized kitchen.\n\tFollow established food safety and sanitation procedures.\n\tAssist with proper food storage, labeling, and rotation.\n\tHelp monitor kitchen and food inventory.\n\tReceive and properly store food and supply deliveries.\n\tClean and maintain kitchen equipment, workstations, and food-preparation areas.\n\tFollow dietary department procedures and established kitchen standards.\n\tWork collaboratively with cooks and other dietary staff.\n\tPerform additional kitchen-related responsibilities as assigned.\n\nQualifications\n\n\tPrevious experience as an Assistant Cook, Cook, or working in a commercial kitchen is required.\n\tExperience preparing meals for seniors or in an institutional food-service environment is a plus.\n\tKnowledge of proper food handling, safety, and sanitation practices preferred.\n\tReliable, responsible, punctual, and able to work effectively as part of a team.\n\tAbility to follow recipes, menus, and dietary instructions.\n\tComfortable working in a busy commercial kitchen environment.\n\tAbility to lift and carry food, supplies, and kitchen items as required for the position."}, {"id": "26739", "title": "Vice President of Sales", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-08", "exp": "2026-12-08", "desc": "Location: New York, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nA growing apparel company is seeking a highly accomplished Vice President of Sales to lead and expand its sales organization across multiple clothing categories.\n\nThis is a senior leadership position for a proven apparel sales executive who combines strong industry relationships with the ability to lead a team, drive revenue, develop strategy, and identify new business opportunities.\n\nThe ideal candidate is sharp, highly motivated, tech-savvy, and results-driven, with a strong recent track record in the apparel industry.\n\nKey Responsibilities\n\n\tLead, manage, and develop the company's sales team.\n\tDevelop and execute sales strategies focused on significant revenue growth.\n\tManage and expand relationships with key retail and wholesale accounts.\n\tIdentify and pursue new accounts, channels, and business opportunities.\n\tEstablish sales goals, KPIs, forecasts, and performance expectations.\n\tCoach and mentor sales representatives to improve individual and team performance.\n\tMaintain a strong understanding of the apparel market, customers, competitors, and emerging opportunities.\n\tWork across multiple apparel and clothing categories.\n\tOversee sales pipelines and ensure consistent account follow-up.\n\tUtilize CRM systems, reporting tools, and technology to improve sales performance and visibility.\n\tPartner with ownership and senior leadership on pricing, strategy, forecasting, and growth initiatives.\n\tCollaborate with merchandising, production, operations, and other departments.\n\tNegotiate high-level deals and maintain strong relationships with key decision-makers.\n\tRecruit and develop sales talent as the organization grows.\n\tTake ownership of overall sales performance and results.\n\nQualifications\n\n\tMinimum 5 years of relevant apparel sales experience required.\n\tRelevant industry experience must include substantial experience within the past 5 years.\n\tProven success in a senior sales or sales leadership position.\n\tStrong background in apparel, clothing, wholesale, or related categories.\n\tDemonstrated ability to lead, motivate, and develop a high-performing sales team.\n\tProven track record of generating revenue and growing major accounts.\n\tStrong relationships and understanding of the apparel marketplace.\n\tExcellent negotiation, communication, and relationship-building skills.\n\tStrong leadership and decision-making abilities.\n\tSharp, strategic, and commercially minded.\n\tTech-savvy and comfortable utilizing CRM systems, reporting platforms, and modern sales technology.\n\tAbility to analyze sales performance and translate data into actionable strategies.\n\tHighly driven, accountable, and focused on results."}, {"id": "26738", "title": "Executive Assistant", "bhTitle": "Executive Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-08", "exp": "2026-12-08", "desc": "Location: Cedarhurst, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nA sophisticated law firm is seeking a highly organized and proactive Executive Assistant to join its Litigation Department in Cedarhurst, NY.\n\nThis position is ideal for a detail-oriented professional with strong administrative, communication, and multitasking skills who can effectively support attorneys and contribute to the day-to-day operations of a busy litigation practice.\n\nThe firm offers a collaborative and professional work environment focused on excellence, teamwork, and client service.\n\nKey Responsibilities\n\n\tProvide comprehensive administrative support to attorneys within the Litigation Department.\n\tManage calendars, appointments, meetings, and scheduling.\n\tCoordinate internal and external communications.\n\tPrepare, organize, proofread, and maintain correspondence and documents.\n\tAssist with organizing litigation-related files and materials.\n\tMaintain accurate and organized electronic and physical records.\n\tTrack deadlines and assist attorneys with staying organized and prepared.\n\tHandle incoming calls, emails, and other correspondence professionally.\n\tCoordinate meetings and assist with meeting preparation.\n\tAssist with document management, filing, scanning, and administrative projects.\n\tMaintain confidentiality when handling sensitive client and legal information.\n\tPrioritize multiple assignments and deadlines in a fast-paced professional environment.\n\tProvide additional administrative support to the department as needed.\n\nQualifications\n\n\tPrevious administrative or executive assistant experience preferred.\n\tExperience within a law firm or legal environment is a plus.\n\tExcellent organizational and time-management skills.\n\tStrong attention to detail and accuracy.\n\tExcellent written and verbal communication skills.\n\tAbility to manage multiple priorities and deadlines simultaneously.\n\tProactive and resourceful approach to responsibilities.\n\tStrong computer and general office technology skills.\n\tProfessional demeanor and strong interpersonal skills.\n\tAbility to handle confidential and sensitive information appropriately.\n\tAbility to work effectively both independently and as part of a team."}, {"id": "26737", "title": "TikTok Shop Livestreamer Host", "bhTitle": "Livestream Sales", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-09-08", "exp": "2026-12-08", "desc": "Location: Brooklyn, NY (In-Person / On-Site)\nJob Type: Full-time or Part-time\nSchedule: Flexible hours, including afternoons, evenings, or weekends depending on live streaming schedules\n\nAre you energetic, charismatic, and passionate about fashion and loungewear? We are a Brooklyn-based apparel brand offering comfortable, high-quality loungewear, sleepwear, and everyday essentials. We are seeking a dynamic TikTok Shop Live Host to represent our brand, connect with our audience in real time, and drive sales through engaging live streams.\n\nIn this role, you will be the face and voice of our brand on TikTok, presenting our collection, showcasing fit and fabric, answering viewer questions, and building a loyal community of shoppers.\n\nKey Responsibilities:\n\n\tHost energetic, engaging, and high-converting TikTok Shop live streams on a regular schedule.\n\n\tModel and demonstrate our loungewear, sleepwear, and apparel, highlighting product features, fit, fabric quality, and styling options.\n\n\tInteract directly with viewers, answering questions in real time, responding to comments, and building an active, enthusiastic community.\n\n\tPlan, prepare, and execute live stream run-of-shows, including setting up product displays, managing pin lists, and running flash sales or promotions.\n\n\tCollaborate with the marketing team to brainstorm creative content ideas, promotional offers, and live stream concepts that align with current trends.\n\n\tTrack and review live stream metrics such as viewership, engagement, and direct revenue to continually refine and optimize future broadcasts.\n\n\tMaintain a clean, organized, and aesthetically appealing studio space for all broadcasts.\n\nQualifications:\n\n\tOn-camera experience, preferably as a live streamer, content creator, video host, or brand ambassador.\n\n\tPrior experience with TikTok Shop, live shopping platforms, or social commerce is strongly preferred.\n\n\tPassion for fashion, cozy loungewear, and current apparel trends.\n\n\tOutgoing personality with exceptional verbal communication skills and the ability to hold an audience's attention for extended periods.\n\n\tStrong multitasking skills to manage live interactions, maintain energy, and track product showcases simultaneously.\n\n\tComfortable working on-site at our Brooklyn studio.\n\nWhat We Offer:\n\n\tFlexible part-time or full-time schedules.\n\n\tGenerous employee discount on all loungewear, sleepwear, and apparel products.\n\n\tOpportunity to grow your personal brand and social presence alongside an expanding apparel company.\n\n\tA fun, creative, and fast-paced workplace culture in Brooklyn."}, {"id": "26734", "title": "Administrative Assistant", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Full or Part Time", "typeNote": "", "state": "NJ", "added": "2026-09-08", "exp": "2026-12-08", "desc": "Location: Jersey Shore, NJ\nJob Type: Part-time (Off-season) / Full-time (Summer)\nSchedule: 5 to 15 hours/week (Off-season); Full-time hours during summer and holiday peak periods\n\nA vibrant synagogue on the Jersey Shore is seeking a reliable and organized Administrative Assistant to support our Office Manager. This dynamic role plays a vital part in maintaining smooth daily operations, assisting with member accounts, and driving creative community communication.\n\nWork hours follow a seasonal workflow, offering flexible part-time hours throughout the off-season with full-time hours required during the summer and peak holiday seasons. This position offers a supportive environment with room for professional growth within the organization.\n\nKey Responsibilities:\n\n\tAssist the Office Manager with daily administrative tasks, correspondence, and office coordination.\n\n\tHandle incoming and outgoing telephone calls professionally, with a primary focus on handling donations and general inquiries.\n\n\tManage billing and record-keeping utilizing the synagogue's specialized software system.\n\n\tExecute year-round Accounts Receivable (AR) tasks and conduct outreach for payment collections.\n\n\tDesign and produce flyers, announcements, and promotional marketing materials for community events and services.\n\n\tProvide elevated operational support during peak summer months and religious holiday seasons.\n\nQualifications:\n\n\tPrior office administrative or secretarial experience preferred.\n\n\tStrong verbal and written communication skills with a courteous, service-oriented phone manner.\n\n\tProficiency with basic office software, computer billing platforms, and graphic design tools for flyer creation.\n\n\tStrong organizational skills and comfortable managing Accounts Receivable and collections outreach.\n\n\tFlexibility to work increased hours during summer months and high holiday seasons.\n\nWhat We Offer:\n\n\tA supportive, community-focused working environment on the Jersey Shore.\n\n\tFlexible off-season hours with predictable full-time summer employment.\n\n\tDirect mentorship from the Office Manager with explicit room for career growth."}, {"id": "26733", "title": "General Studies Teacher Assistant", "bhTitle": "Teacher Assistant", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-08", "exp": "2026-12-08", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday–Thursday, 12:00 PM–4:00 PM; Friday, 10:30 AM–12:00 PM\n\nPosition Overview\n\nA school in Brooklyn, NY is seeking a dependable, patient, and enthusiastic General Studies Teacher Assistant to support classroom instruction and daily student activities.\n\nThe Teacher Assistant will work closely with the lead teacher to help maintain an organized and positive learning environment, provide students with academic support, and assist with day-to-day classroom responsibilities.\n\nThis is an excellent opportunity for someone who enjoys working with students and wants to gain additional experience in an educational setting.\n\nKey Responsibilities\n\n\tAssist the lead teacher with daily classroom instruction and activities.\n\tProvide individual and small-group academic support to students.\n\tHelp students complete assignments and understand classroom material.\n\tAssist with general studies subjects as needed.\n\tPrepare classroom materials, worksheets, and instructional resources.\n\tHelp maintain an organized, structured, and welcoming classroom environment.\n\tReinforce classroom expectations and assist with classroom management.\n\tMonitor students during lessons, transitions, and other school activities.\n\tProvide additional support to students who may need extra academic assistance.\n\tAssist with grading, recordkeeping, and classroom organization as directed by the lead teacher.\n\tHelp set up and clean up classroom activities and materials.\n\tCommunicate student needs or concerns to the lead teacher.\n\tCollaborate with teachers, support staff, and school administration.\n\tAssist with school programs, activities, and events as needed.\n\nQualifications\n\n\tPrevious experience working with children or students preferred.\n\tPrevious classroom or teacher assistant experience is a plus.\n\tStrong communication and interpersonal skills.\n\tPatient, responsible, dependable, and professional.\n\tStrong organizational skills and attention to detail.\n\tAbility to follow teacher instructions and classroom procedures.\n\tComfortable providing academic support to students.\n\tAbility to work effectively both independently and as part of a teaching team.\n\tPositive attitude and willingness to learn.\n\tCommitment to creating a supportive and productive learning environment."}, {"id": "26732", "title": "General Studies Middle School Teacher", "bhTitle": "Teacher", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-08", "exp": "2026-12-08", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday–Thursday, 12:00 PM–4:00 PM; Friday, 10:30 AM–12:00 PM\n\nPosition Overview\n\nA school in Brooklyn, NY is seeking a dedicated and engaging General Studies Middle School Teacher to join its educational team.\n\nThe teacher will be responsible for providing high-quality, age-appropriate instruction while creating a structured, supportive, and engaging classroom environment. The ideal candidate is an effective communicator who can connect with middle school students, maintain strong classroom management, and help students develop academically and personally.\n\nKey Responsibilities\n\n\tPlan and deliver engaging, grade-appropriate general studies lessons.\n\tTeach assigned subjects based on the school's curriculum and academic standards.\n\tDevelop lesson plans, assignments, assessments, and instructional materials.\n\tCreate a structured and positive classroom environment.\n\tMaintain effective classroom management and clear behavioral expectations.\n\tDifferentiate instruction to accommodate varying student learning needs and abilities.\n\tAssess and monitor student academic progress.\n\tProvide constructive feedback and additional academic support when needed.\n\tEncourage critical thinking, problem-solving, and independent learning.\n\tMaintain accurate student records, grades, and classroom documentation.\n\tCommunicate professionally with parents regarding student progress and classroom matters.\n\tCollaborate with fellow teachers, support staff, and school administration.\n\tParticipate in faculty meetings, professional development, and school activities.\n\tSupport students' academic, social, and emotional development.\n\nQualifications\n\n\tPrevious middle school teaching experience preferred.\n\tBachelor's degree in Education or a related field preferred.\n\tTeaching certification is a plus.\n\tStrong classroom management skills.\n\tAbility to develop engaging and age-appropriate lessons.\n\tStrong written and verbal communication skills.\n\tExcellent organizational and time-management abilities.\n\tAbility to connect effectively with middle school students.\n\tPatient, dependable, professional, and collaborative.\n\tAbility to differentiate instruction for students with varying academic needs.\n\tComfortable working independently while collaborating with the broader school team."}, {"id": "26729", "title": "Livestream Sales Host", "bhTitle": "Livestream Sales", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NJ", "added": "2026-09-08", "exp": "2026-12-08", "desc": "Location: Carteret, NJ\nJob Type: Full-time (Part-time options considered)\nSchedule: Flexible shift options\n\nWe are seeking energetic, engaging, and outgoing individuals to join our team as Livestream Sales Hosts in Carteret, NJ. In this camera-facing role, you will represent our clothing and t-shirt brands, present featured merchandise, interact with viewers in real time, and drive live sales through dynamic video broadcasts.\n\nWhether you are looking for full-time employment or prefer a flexible part-time schedule, we welcome your application. No prior experience is necessary, as we provide complete, hands-on training to set you up for success.\n\nKey Responsibilities:\n\n\tHost live sales broadcasts, presenting t-shirts and apparel line items to a growing online audience.\n\n\tEngage directly with viewers in real time through video, answering questions about fit, fabric, and styling.\n\n\tDemonstrate product features, highlight promotional offers, and create an exciting, fun shopping experience.\n\n\tMaintain high energy and enthusiasm throughout scheduled livestream sessions.\n\n\tCollaborate with the studio team on set presentation, product organization, and rundown prep before going live.\n\nQualifications:\n\n\tComfortable being on camera and speaking in front of a live digital audience.\n\n\tStrong verbal communication skills with a friendly, high-energy personality.\n\n\tReliable, punctual, and able to work on site at our Carteret, NJ location.\n\n\tAbility to improvise, keep conversations flowing naturally, and multitask while interacting with live chat feeds.\n\n\tPrior retail, customer service, or public-facing experience is helpful, but no prior streaming experience is required.\n\nWhat We Offer:\n\n\tW2 employee status with structured support and reliable payment.\n\n\tPaid training program covering camera confidence, livestream tools, and retail host techniques.\n\n\tOpportunity to work with a fast-growing clothing brand in a modern, studio environment.\n\n\tPotential for scheduling flexibility with both full-time and part-time tracks available."}, {"id": "26728", "title": "Live Stream Host – Children's Clothing & Accessories", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NJ", "added": "2026-09-04", "exp": "2026-12-04", "desc": "Location: Central New Jersey (On-Site Studio)\nJob Type: Part-Time / Full-Time\nSchedule: Flexible shifts including mornings, evenings, and weekends\n\nWe are seeking an energetic, outgoing, and articulate Livestream Host to represent our products across popular shopping and social platforms including TikTok Shop, Whatnot, Instagram Live, and Facebook Live. In this role, you will be the face and voice of our online boutique, hosting interactive sales broadcasts, showcasing our latest children's clothing and accessory collections, and engaging directly with parents and gift shoppers in real time.\nWe have everything ready to go, all we need is someone to be our host and \"flip the switch\"!\n\nKey Responsibilities:\n\n\tHost engaging, high-energy live streaming sales broadcasts across platforms like TikTok Shop, Whatnot, and Instagram Live.\n\n\tPresent and demonstrate children's apparel, footwear, and accessories, clearly highlighting fabric quality, sizing, fit, styling ideas, and special pricing.\n\n\tInteract with live audiences in real time by answering viewer questions about sizing, materials, shipping, and order status.\n\n\tDrive live sales conversions by introducing exclusive promotions, flash sales, giveaway auctions, and call-to-action prompts.\n\n\tPrepare the studio studio layout, display products on hangers or mannequins, and test audio, camera, and lighting setups prior to going live.\n\n\tCollaborate with the e-commerce inventory team to curate product lineups and verify inventory counts prior to scheduled streams.\n\n\tMonitor live stream metrics such as concurrent viewers, engagement rate, sales conversion, and order volume to continuously refine stream performance.\n\n\tMaintain a welcoming, positive, and brand-aligned environment while upholding platform community guidelines.\n\nQualifications:\n\n\tDemonstrated experience hosting live streams, creating video content, performing on stage, or working in retail sales.\n\n\tStrong familiarity with live streaming mechanics on platforms like TikTok Shop, Whatnot, Instagram, and Facebook.\n\n\tHigh energy, excelente verbal communication skills, and comfort appearing on camera for extended periods.\n\n\tKnowledge of children's fashion, sizing standards, fabrics, or general retail merchandising is strongly preferred.\n\n\tAbility to multitask effectively while reading live chat comments, managing stream controls, and demonstrating physical products simultaneously.\n\n\tBasic technical proficiency with mobile smartphones, wireless microphones, studio lighting, and stream management applications.\n\n\tReliable transportation to our studio location in Central New Jersey.\n\nWhat We Offer:\n\n\tEmployee discount on all children's apparel, accessories, and products.\n\n\tHands-on experience in the rapidly growing field of livestream commerce and social shopping.\n\n\tFlexible scheduling options tailored around broadcast peak traffic hours.\n\n\tA fun, creative studio environment supported by dedicated inventory and technical team members."}, {"id": "26727", "title": "Jewelry Wholesale Assistant & Live Streamer", "bhTitle": "Jewelry Wholesale Assistant & Live Streamer", "category": "Sales & Live Selling", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-03", "exp": "2026-12-03", "desc": "A jewelry wholesale company is seeking a motivated, outgoing individual to join its team. This is a great opportunity for a college student or someone with a flexible schedule who is interested in sales, jewelry, live streaming, and growing with a business.\n\nResponsibilities\n\n\tHost and participate in live jewelry streams and showcase products to customers\n\tEngage with customers and help drive sales\n\tAssist with merchandise and inventory\n\tHandle deposits, payments, and other day-to-day business tasks\n\tSupport the owner with general administrative and operational needs\n\nIdeal Candidate\n\n\tOutgoing, personable, and comfortable on camera\n\tMotivated, reliable, and driven to succeed\n\tInterested in sales, jewelry, and live streaming\n\tEager to learn and take on additional responsibilities\n\tCollege students with flexible schedules are encouraged to apply"}, {"id": "26726", "title": "Account Executive", "bhTitle": "Account Manager", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-03", "exp": "2026-12-03", "desc": "Location: New York, NY\nEmployment Type: Full-Time, In-Person\n\nPosition Overview\n\nA growing fashion and accessories company in New York City is seeking a highly organized, creative, and detail-oriented Account Executive to manage and support a key retail account across both private-label and branded business.\n\nThis is a hands-on role at the intersection of sales, account management, product development, design, and production. The ideal candidate combines a strong understanding of fashion and product with exceptional organization, follow-through, communication, and numerical skills.\n\nThe Account Executive will work closely with retail buyers and internal design and production teams to move products from initial concept through development, approval, production, and delivery.\n\nKey Responsibilities\n\nAccount Management & Buyer Relations\n\n\tManage day-to-day communication and follow-up with retail buyers.\n\tBuild and maintain strong relationships with key account contacts.\n\tServe as the primary liaison between buyers and internal design and production teams.\n\tCommunicate buyer requests, feedback, approvals, and changes clearly to internal teams.\n\tMaintain consistent follow-up to ensure projects and orders continue moving forward.\n\tSupport the continued development and growth of both private-label and branded business.\n\nProduct Development & Production\n\n\tTrack products throughout the development process from concept through delivery.\n\tCoordinate private-label and branded product development.\n\tOrganize, prepare, and send product samples to buyers.\n\tMaintain detailed records of styles, samples, pricing, orders, quantities, and development status.\n\tAssist with costing, pricing, quantities, and order details.\n\tFollow up with design and production teams regarding outstanding samples, approvals, and deadlines.\n\tHelp ensure buyer feedback is accurately incorporated into product development.\n\tSupport production and help prevent important details or deadlines from being missed.\n\nReporting & Organization\n\n\tCreate and maintain detailed Excel trackers, reports, and product records.\n\tTrack multiple products, orders, samples, and deadlines simultaneously.\n\tMaintain organized records of account activity and product development.\n\tMonitor outstanding action items and ensure timely follow-up.\n\tWork with detailed pricing, costing, quantities, and order information.\n\nPresentations & Visual Content\n\n\tPhotograph product samples for buyer presentations and approvals.\n\tCreate polished presentations and visual materials using Canva.\n\tHelp present products in a way that aligns with the customer's aesthetic and expectations.\n\tSupport internal and external presentations with clear and professional visual materials.\n\nQualifications\n\n\tExperience in fashion, accessories, wholesale, private label, account management, production, or product development strongly preferred.\n\tStrong understanding of fashion, accessories, product trends, and retail customers.\n\tExcellent communication and relationship-building skills.\n\tExceptional organizational skills and attention to detail.\n\tStrong follow-up skills and ability to keep multiple projects moving simultaneously.\n\tAdvanced Microsoft Excel skills.\n\tComfortable working with numbers, pricing, costing, quantities, and detailed order information.\n\tProficiency with Canva.\n\tStrong visual and creative eye.\n\tComfortable photographing products and samples for professional presentations.\n\tAbility to manage multiple projects, products, and deadlines simultaneously.\n\tProactive, resourceful, and hands-on approach to work.\n\tAbility to collaborate effectively with buyers, designers, production teams, and management."}, {"id": "26723", "title": "Retail Sales", "bhTitle": "Retail Sales", "category": "Sales & Live Selling", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-03", "exp": "2026-12-23", "desc": "Seeking a reliable and personable Sales & Assistant to join our retail gift shop team in Brooklyn, NY.\n\nSchedule: Monday–Friday, with availability for at least 11:00 AM–4:00 PM\nLocation: Brooklyn, NY\n\nResponsibilities\n\n\tAssist customers with sales and provide friendly, helpful service\n\tOpen merchandise and assist with pricing and product preparation\n\tHelp with the day-to-day operations of the shop\n\tOrganize and maintain merchandise and displays\n\tAssist with gift wrapping and preparing gifts for customers\n\tSupport the store with various tasks as needed\n\nQualifications\n\n\tReliable, responsible, and organized\n\tFriendly and comfortable interacting with customers\n\tAble to work independently and as part of a small team\n\tStrong attention to detail\n\tWillingness to assist with a variety of retail and administrative tasks\n\tPrior retail or customer-service experience is a plus\n\nSeeking a reliable and personable Sales & Assistant to join our retail gift shop team in Brooklyn, NY.\n\nSchedule: Monday–Friday, with availability for at least 11:00 AM–4:00 PM\nLocation: Brooklyn, NY\n\nResponsibilities\n\n\tAssist customers with sales and provide friendly, helpful service\n\tOpen merchandise and assist with pricing and product preparation\n\tHelp with the day-to-day operations of the shop\n\tOrganize and maintain merchandise and displays\n\tAssist with gift wrapping and preparing gifts for customers\n\tSupport the store with various tasks as needed\n\nQualifications\n\n\tReliable, responsible, and organized\n\tFriendly and comfortable interacting with customers\n\tAble to work independently and as part of a small team\n\tStrong attention to detail\n\tWillingness to assist with a variety of retail and administrative tasks\n\tPrior retail or customer-service experience is a plus"}, {"id": "26722", "title": "Beauty Sales Professional", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-03", "exp": "2026-12-03", "desc": "Location: New York, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nAn established company expanding into the beauty category is seeking an experienced and well-connected Beauty Sales Professional to play a key role in launching and growing a new beauty division.\n\nThis is an opportunity for a proven sales professional who understands the beauty market, has established relationships with off-price retail buyers, and can help build a new division from the ground up.\n\nThe ideal candidate has a strong track record in beauty sales and is comfortable opening doors, developing accounts, and turning buyer relationships into long-term business.\n\nKey Responsibilities\n\n\tDevelop and grow sales for a newly established beauty division.\n\tLeverage existing relationships with off-price retailers and retail buyers.\n\tProspect and open new wholesale accounts.\n\tDevelop relationships with buyers and key decision-makers.\n\tPresent products and opportunities across cosmetics, skincare, beauty accessories, haircare, and related categories.\n\tManage the sales process from initial outreach through negotiation, order placement, and follow-up.\n\tIdentify new customers, channels, and opportunities for growth.\n\tBuild and maintain a strong pipeline of prospective accounts.\n\tDevelop repeat business with new and existing customers.\n\tWork closely with leadership to develop the division's sales strategy.\n\tProvide insight into buyer demand, market trends, pricing, and competitive activity.\n\tAttend buyer meetings, trade shows, and industry events as needed.\n\tMeet and exceed established sales and revenue goals.\n\nQualifications\n\n\tPrevious beauty industry sales experience required.\n\tEstablished buyer relationships, particularly within the off-price retail channel, required.\n\tExperience selling cosmetics, skincare, haircare, beauty accessories, or related beauty products strongly preferred.\n\tStrong understanding of the beauty and retail landscape.\n\tProven ability to open new accounts and develop new business.\n\tStrong wholesale sales and account management skills.\n\tExcellent negotiation, presentation, and relationship-building abilities.\n\tStrong communication and follow-up skills.\n\tEntrepreneurial mindset and ability to take ownership of new opportunities.\n\tComfortable helping build a new business division from its early stages.\n\tMotivated by both individual sales performance and long-term division growth."}, {"id": "26721", "title": "Whatnot Livestream Jewelry Seller Wanted", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-02", "exp": "2026-11-26", "desc": "Seeking an energetic and personable Jewelry Seller to host live sales on Whatnot. The ideal candidate is comfortable speaking on camera, engaging with customers, showcasing jewelry, and creating an exciting livestream shopping experience.\n\nResponsibilities:\n\n\tHost and participate in Whatnot livestreams\n\tPresent and sell jewelry products\n\tEngage with viewers and answer questions\n\tHighlight product features, styles, and pricing\n\tHelp drive sales and build a loyal customer base\n\nQualifications:\n\n\tStrong communication and sales skills\n\tComfortable and confident on camera\n\tOutgoing, energetic personality\n\tJewelry or retail sales experience is a plus\n\tPrevious Whatnot livestream experience is preferred but not required\n\nSchedule and compensation: Flexible/negotiable based on experience."}, {"id": "26719", "title": "Sales Representative", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-02", "exp": "2026-12-02", "desc": "Location: New York, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nA growing wholesale company in New York, NY is seeking an experienced Wholesale Sales Representative to manage and grow a portfolio of mid-level to high-level retail accounts.\n\nThis position is ideal for a proven wholesale sales professional who understands how to develop strong customer relationships, manage established accounts, identify new opportunities, and consistently drive revenue.\n\nThe ideal candidate has previous wholesale sales experience, strong industry relationships, and the ability to confidently work with larger and more established accounts.\n\nKey Responsibilities\n\n\tManage and grow a portfolio of mid-level and high-level wholesale accounts.\n\tDevelop strong, long-term relationships with buyers and retail partners.\n\tIdentify and pursue new wholesale business opportunities.\n\tProspect and develop relationships with new accounts.\n\tPresent products, collections, and new opportunities to buyers.\n\tManage the sales process from initial outreach through order placement and follow-up.\n\tNegotiate pricing, terms, and order opportunities as appropriate.\n\tMaintain consistent communication with existing accounts.\n\tIdentify opportunities to increase sales within current customers.\n\tReactivate and develop underperforming or inactive accounts.\n\tWork closely with internal teams to ensure orders and customer needs are handled efficiently.\n\tMaintain an organized pipeline of current and prospective business.\n\tMonitor account performance and identify opportunities for additional growth.\n\tStay informed on market trends, customer needs, and competitive activity.\n\tAttend meetings, trade shows, and other industry events as needed.\n\tMeet and exceed established sales and revenue goals.\n\nQualifications\n\n\tPrevious wholesale sales experience required.\n\tExperience managing mid-level and/or high-level retail accounts.\n\tProven ability to develop relationships with buyers and decision-makers.\n\tStrong track record of generating and growing wholesale business.\n\tExcellent sales, negotiation, and relationship-building skills.\n\tStrong verbal and written communication skills.\n\tComfortable prospecting and developing new accounts.\n\tAbility to independently manage an established book of business.\n\tStrong follow-up and organizational skills.\n\tResults-driven and comfortable working toward sales goals.\n\tExisting relationships within the wholesale or retail industry are a strong plus.\n\tAbility to work independently while collaborating effectively with internal teams."}, {"id": "26718", "title": "Marketing, Social Media & Management Intern", "bhTitle": "Marketing", "category": "E-commerce, Marketing & Social Media", "type": "Internship", "typeNote": "", "state": "NJ", "added": "2026-09-02", "exp": "2026-12-02", "desc": "Location: Oakhurst, NJ\nEmployment Type: Internship\nSchedule: Flexible\n\nPosition Overview\n\nA growing supplement startup preparing to launch a new product is seeking a creative, organized, and motivated Marketing, Social Media & Management Intern to help build its online presence from the ground up.\n\nThis is a hands-on opportunity to be involved in a real product launch from its early stages, with exposure to social media, digital marketing, e-commerce, email marketing, AI tools, and general business operations.\n\nThe ideal candidate is resourceful, comfortable learning new platforms independently, and excited to take ownership of projects. Practical skills, creativity, and initiative are valued more than an extensive resume or previous experience.\n\nKey Responsibilities\n\nSocial Media & Content\n\n\tCreate and post content for Instagram, TikTok, and WhatsApp.\n\tHelp develop engaging social media content around the upcoming product launch.\n\tAssist with short-form videos, graphics, captions, and promotional content.\n\tHelp maintain a consistent posting schedule and brand presence.\n\tResearch trends and identify creative content opportunities.\n\tAssist with community engagement and social media growth.\n\nDigital Marketing & AI\n\n\tUse AI tools to assist with content creation, copywriting, research, and marketing tasks.\n\tHelp create and manage email marketing lists.\n\tAssist with setting up landing pages and lead-generation campaigns.\n\tBuild and maintain basic email marketing automations.\n\tHelp develop follow-up and promotional email campaigns.\n\tLearn and implement new marketing tools and platforms as needed.\n\nE-Commerce & Business Support\n\n\tAssist with managing the online store.\n\tCreate and update product pages and online content.\n\tHelp monitor and process customer orders.\n\tAssist with customer follow-up emails and communications.\n\tSupport the founder with launch-related projects and general business needs.\n\tHelp organize projects, deadlines, and marketing initiatives.\n\tTake on additional responsibilities as the company and role develop.\n\nQualifications\n\n\tStrong organizational and time-management skills.\n\tCreative and comfortable working with social media.\n\tFamiliarity with Instagram, TikTok, and other digital platforms.\n\tInterest in marketing, e-commerce, social media, or entrepreneurship.\n\tComfortable using or learning AI-powered tools.\n\tAbility to independently learn new software and platforms.\n\tStrong written communication skills.\n\tResourceful and willing to troubleshoot problems independently.\n\tDependable and able to follow through on assigned projects.\n\tMotivated to learn and take initiative.\n\tPrevious professional marketing experience is not required."}, {"id": "26717", "title": "Finance Manager", "bhTitle": "Finance", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-02", "exp": "2026-12-02", "desc": "Location: Manhattan, New York\nEmployment Type: Full-Time\n\nPosition Overview\n\nA growing organization in Midtown Manhattan is seeking an experienced and highly dependable Finance Manager / Controller to oversee the daily financial operations of two related businesses while also supporting essential office administration.\n\nThis is a hands-on role for someone who is comfortable taking ownership of accounting, cash flow, accounts receivable, accounts payable, financial reporting, and overall financial organization. The Finance Manager / Controller will work closely with ownership and provide clear, accurate, and timely visibility into the financial health of the businesses.\n\nThe ideal candidate is highly organized, detail-oriented, proactive, and comfortable working within a small team where responsibilities may extend beyond traditional accounting functions.\n\nKey Responsibilities\n\nAccounting & Financial Operations\n\n\tOversee daily accounting and financial operations for two related businesses.\n\tMaintain accurate and up-to-date financial records.\n\tEnsure transactions are properly recorded and categorized.\n\tReview bank activity, deposits, payments, and credit card transactions.\n\tPerform and review bank and credit card reconciliations.\n\tMaintain proper financial documentation and organized records.\n\tMonitor financial activity across both businesses and identify discrepancies or issues requiring attention.\n\tHelp establish and maintain effective accounting procedures and internal controls.\n\nAccounts Receivable & Accounts Payable\n\n\tManage accounts receivable and accounts payable.\n\tMonitor outstanding client balances, open memos, invoices, and payment schedules.\n\tEnsure consistent and timely follow-up on outstanding receivables.\n\tAssist with collection efforts and resolve payment discrepancies.\n\tProcess and track vendor payments and other financial obligations.\n\tMaintain accurate A/R and A/P aging reports.\n\tProvide ownership with regular updates regarding outstanding balances and payment activity.\n\nCash Flow & Financial Reporting\n\n\tMonitor company cash flow across both businesses.\n\tProvide ownership with clear visibility into available capital and upcoming financial obligations.\n\tPrepare monthly financial reports, including:\n\n\t\tProfit and loss statements.\n\t\tBalance sheets.\n\t\tCash flow reports.\n\t\tAccounts receivable and payable aging reports.\n\n\tProvide regular updates on receivables, cash position, expenses, and overall financial performance.\n\tIdentify financial trends, potential issues, and areas requiring management attention.\n\tAssist ownership with financial planning and decision-making.\n\nExpense Management & Financial Controls\n\n\tTrack and review business expenses.\n\tIdentify opportunities to improve cost management and financial efficiency.\n\tReview financial processes and implement systems that improve accuracy and organization.\n\tMaintain appropriate documentation for purchases, sales, inventory, memos, returns, and payments.\n\tEnsure financial records and supporting documentation are complete and easily accessible.\n\nExternal Accounting & Financial Coordination\n\n\tWork closely with outside accountants, bookkeepers, tax professionals, banks, and other financial partners.\n\tProvide outside professionals with accurate financial records and supporting documentation.\n\tAssist with year-end accounting and tax preparation.\n\tCoordinate financial requests and ensure required information is provided accurately and on time.\n\tServe as a primary internal point of contact for routine accounting and financial matters.\n\nAdministrative Support\n\n\tAssist ownership with essential administrative and operational responsibilities as needed.\n\tMaintain organized business and financial documentation.\n\tSupport special projects and other office needs.\n\tWork collaboratively within a small team and be willing to assist outside of traditional finance responsibilities when necessary.\n\nQualifications\n\n\tPrevious experience in accounting, finance management, controllership, bookkeeping, or a related financial role.\n\tStrong understanding of accounts receivable, accounts payable, cash flow management, and financial reporting.\n\tExperience preparing and reviewing P&L statements, balance sheets, cash flow reports, and aging reports.\n\tStrong understanding of bank and credit card reconciliations.\n\tExperience working with outside accountants and tax professionals.\n\tStrong organizational skills and exceptional attention to detail.\n\tAbility to manage multiple financial responsibilities and deadlines.\n\tStrong analytical and problem-solving abilities.\n\tAbility to maintain accurate and confidential financial records.\n\tComfortable working directly with business ownership.\n\tProactive and able to work independently with minimal oversight.\n\tComfortable working within a small team and assisting with administrative responsibilities as needed.\n\tStrong Excel and accounting software skills preferred."}, {"id": "26716", "title": "Accountant", "bhTitle": "Accountant", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-09-02", "exp": "2026-12-02", "desc": "Location: Oakhurst, NJ\nEmployment Type: Full-Time\n\nPosition Overview\n\nA growing organization with multiple affiliated entities, including a portfolio of rental properties and other partner-owned businesses, is seeking an experienced Accountant to help bring its accounting and bookkeeping functions in-house.\n\nThis is a newly created, hands-on position with responsibility for day-to-day bookkeeping, cash management, accounts payable and receivable, recurring financial reporting, and tax filing support across multiple entities.\n\nDuring the first several months, the Accountant will work closely with the current outside accounting provider to learn the existing chart of accounts, cost-code structure, and work-in-progress (WIP) methodology before assuming full ownership of the accounting function.\n\nThis is an opportunity for someone who enjoys building systems and processes rather than simply stepping into an established accounting department. The ideal candidate is comfortable taking ownership, creating structure, solving problems independently, and working as part of a small, fast-moving team.\n\nKey Responsibilities\n\nBookkeeping & Accounting\n\n\tManage full-cycle bookkeeping across multiple companies, rental properties, and affiliated entities.\n\tEnter and properly code receipts, bills, invoices, and other transactions.\n\tMaintain accurate job and cost-code classifications.\n\tCreate and issue customer invoices and vendor bills.\n\tPerform bank and credit card reconciliations.\n\tMaintain accurate and up-to-date general ledgers.\n\tEnsure transactions are properly classified across entities and accounts.\n\tAssist with month-end and year-end accounting processes.\n\tMaintain organized financial records and supporting documentation.\n\tWork with QuickBooks, Buildertrend, DoorLoop, and other accounting or property management systems.\n\nAccounts Payable, Receivable & Cash Management\n\n\tManage accounts payable and accounts receivable from start to finish.\n\tMaintain A/P and A/R aging schedules.\n\tFollow up on outstanding receivables and other unresolved items.\n\tProcess vendor and other bill payments.\n\tAccurately record cash inflows and outflows across multiple entities and bank accounts.\n\tMonitor cash positions across entities.\n\tProactively identify and communicate potential cash flow concerns to ownership.\n\tMaintain accurate documentation for payments, receipts, and transfers.\n\nConstruction & Real Estate Accounting\n\n\tMaintain accurate job-cost accounting records.\n\tAssist with WIP reporting and percentage-of-completion accounting.\n\tTrack costs across construction projects and affiliated entities.\n\tMaintain accounting records for rental and investment properties.\n\tSupport recurring reporting related to individual properties, projects, and entities.\n\tHelp ensure financial information is properly allocated across jobs, properties, and cost codes.\n\nTax & Annual Filing Support\n\n\tPrepare and file simpler recurring returns, including applicable quarterly filings, sales/use tax filings, and annual filings for investment properties.\n\tAssemble and organize year-end books, schedules, and supporting documentation for outside tax accountants.\n\tCoordinate with external tax and accounting professionals as needed.\n\tResearch potentially applicable tax credits, deductions, and planning opportunities.\n\tIdentify potential opportunities involving areas such as R&D credits, cost segregation, and entity-level elections for review by outside tax advisors.\n\tMaintain organized documentation to support tax preparation and annual filings.\n\nAccounting Systems & Process Development\n\n\tHelp transition bookkeeping and accounting responsibilities from an outsourced provider to an internal function.\n\tLearn and maintain the existing chart of accounts, cost-code structure, and WIP methodology.\n\tDevelop workflows, controls, and accounting procedures where formal processes do not yet exist.\n\tImprove the accuracy, organization, and efficiency of financial reporting.\n\tCreate repeatable processes for bookkeeping, reconciliations, reporting, and documentation.\n\tTake ownership of accounting-related issues and proactively identify solutions.\n\nQualifications\n\n\t3+ years of bookkeeping or accounting experience in construction, real estate, trades, or a closely related industry required.\n\tActive CPA license strongly preferred.\n\tStrong hands-on proficiency with QuickBooks Online.\n\tExperience managing accounting and bookkeeping for multiple entities and/or properties.\n\tWorking knowledge of WIP reporting, percentage-of-completion accounting, and job-cost accounting.\n\tExperience independently preparing bank reconciliations, A/P and A/R aging reports, and monthly financial statements.\n\tComfortable preparing or assisting with quarterly and straightforward annual tax filings.\n\tAbility to research potential tax credits and planning opportunities for review by tax professionals.\n\tStrong Microsoft Excel and spreadsheet skills.\n\tExcellent attention to detail and financial accuracy.\n\tStrong organizational and time-management abilities.\n\tReliable follow-through and ability to meet recurring deadlines.\n\tExperience with Buildertrend, DoorLoop, or similar construction/property management platforms is a significant plus.\n\tExperience developing or improving accounting processes within a small or growing organization is strongly preferred.\n\tExperience transitioning accounting or bookkeeping functions from an outsourced provider to an in-house operation is a plus."}, {"id": "26712", "title": "Fall Paid Internship – Social Media Company (Brooklyn, NY)", "bhTitle": "Marketing", "category": "E-commerce, Marketing & Social Media", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-01", "exp": "2026-12-04", "desc": "Location: Brooklyn, NY\n\nSchedule:\n\n\t4 days/week, 10:00 AM–4:00 PM\n\tFlexible schedule around college classes (part-time/half days available)\n\nResponsibilities:\n\n\tEmail outreach to potential clients\n\tLearn prospecting and lead generation strategies\n\tSupport business development initiatives\n\nRequirements:\n\n\tStrong email communication skills\n\tOrganized, professional, and eager to learn\n\tInterest in social media, marketing, or sales preferred\n\nThis is a great opportunity for a college student to gain hands-on experience in client outreach, business development, and the fast-paced social media industry!"}, {"id": "26710", "title": "Marketing, Social Media & Management Intern — Fall 2026", "bhTitle": "Marketing", "category": "E-commerce, Marketing & Social Media", "type": "Remote / Hybrid", "typeNote": "Remote/Hybrid/PT", "state": "NJ", "added": "2026-09-01", "exp": "2026-12-04", "desc": "Oakhurst, NJ (Remote possible)\n\nWe're a supplement startup preparing to launch Freeze Formula, a first-of-its-kind product for cold plunge enthusiasts. We're building from the ground up, so you'll have a hands-on role from day one.\n\nPosition Overview:\n\n\tCreate and post content for Instagram, TikTok, & WhatsApp\n\tUse AI tools to create content and work more efficiently\n\tSet up email lists, landing pages, and automations\n\tHelp manage the online store, including product pages, orders, and follow-up emails\n\nSeeking:\n\nSomeone organized, driven, creative, and able to learn new tools independently. We care more about your skills and initiative than your resume.\n\nWhat You'll Gain:\n\nHands-on experience with a real product launch, direct mentorship from the founder, and work you can showcase. Potential to become a paid position based on performance and fit.\n\nTo apply: Send a short message about yourself and any content you've created.\n\nWe're a supplement startup about to launch Freeze Formula a first-of-its-kind product for people who cold plunge. We're not launched yet, so you'd be helping build it from the start.\n\nPosition Overview:\n\n    •    Make and post content for Instagram, Tik Tok, & WhatsApp\n\n    •    Use AI tools to help write and create faster\n\n    •    Set up email lists, landing pages, and automations\n\n    •    Help run the online store — product pages, orders, follow-up emails\n\nSeeking:\n\nSomeone organized, driven, and able to figure out a new tool on their own. We care more about your skills than what's on your resume.\n\nWhat you'll gain:\n\nA front-row seat to a real product launch, direct mentorship from the founder, and work you can actually show people. Open to becoming a paid position if it's a good fit.\n\nTo apply, send a short message about yourself and any content that you created.\n\nIt would be an unpaid internship; however, open to paying if they do well together down the road..."}, {"id": "26709", "title": "Controller Junior", "bhTitle": "Controller Junior", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-01", "exp": "2026-12-02", "desc": "Location: New York, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nA New York City-based multi-divisional wholesale footwear, accessories, and apparel company is seeking an experienced Financial Analyst to support the CFO across internal reporting, managerial reporting, financial planning and analysis, and general finance operations.\n\nThe Financial Analyst will work closely with the CFO and provide proactive, detail-oriented, and analytical support in a fast-paced wholesale environment. This position will have ownership of recurring financial reporting and month-end processes while also assisting with budgeting, forecasting, expense management, inventory analysis, and special projects.\n\nKey Responsibilities\n\nFinancial Analysis & Planning\n\n\tOwn weekly, monthly, and quarterly financial reporting responsibilities across multiple divisions and entities.\n\tAssist with the annual budgeting and ongoing forecasting processes.\n\tMaintain and update financial projections.\n\tPrepare Open-to-Buy (OTB) reporting and budgeting.\n\tMonitor inventory costing and related financial activity.\n\tPerform ad hoc financial analysis as requested by the CFO.\n\tTrack key economic indicators and provide relevant updates to the CFO.\n\tFollow quarterly retailer earnings reports and identify relevant business and industry trends.\n\tSupport financial planning and decision-making with accurate and timely analysis.\n\nMonth-End & Accounting Support\n\n\tTake ownership of the month-end closing process.\n\tPerform month-end follow-up and ensure outstanding items are addressed.\n\tPrepare and review aged accounts payable statements.\n\tAssist with light bookkeeping and general accounting functions.\n\tSupport inventory costing and reconciliation.\n\tAssist with data entry and expense management.\n\tPrepare quarterly royalty reporting for multiple brands.\n\nReporting\n\n\tPrepare month-end aged inventory reports in Excel.\n\tMaintain sales projection worksheets.\n\tPrepare OTB and inventory reporting.\n\tProduce weekly aged accounts payable reports.\n\tPrepare monthly credit card and expense reports.\n\tMaintain monthly aged inventory reporting.\n\tAssist with duty drawback reporting.\n\tDevelop recurring management reports for the CFO and finance department.\n\tAssist with business intelligence datasets and dashboarding.\n\nExpense Tracking\n\n\tMaintain accurate credit card records and supporting documentation.\n\tMonitor warehouse-related spending.\n\tTrack shipping and logistics expenses, including UPS spending.\n\tIdentify unusual spending patterns or potential areas for cost control.\n\tMaintain accurate and organized expense records.\n\nCFO & Department Support\n\n\tProvide general administrative support to the CFO and finance department.\n\tComplete special assignments and projects involving finance, operations, and marketing.\n\tAssist with preparation of presentations, reports, and other management materials.\n\tSupport press releases and other marketing-related projects when needed.\n\tWork across departments and divisions to gather financial and operational information.\n\tServe as a reliable extension of the CFO when communicating with internal and external partners.\n\nQualifications\n\n\tMinimum of 3 years of experience in the wholesale industry required.\n\tAdvanced proficiency in Microsoft Excel required.\n\tStrong numerical, financial, and analytical skills.\n\tExperience with financial reporting, budgeting, forecasting, and month-end processes.\n\tStrong understanding of inventory and expense reporting.\n\tExcellent organizational skills and attention to detail.\n\tAbility to manage recurring deadlines and multiple priorities simultaneously.\n\tStrong interpersonal and communication skills.\n\tAbility to develop effective working relationships across multiple levels of an organization.\n\tComfortable working directly with senior financial leadership.\n\tAbility to perform effectively in a complex, fast-paced environment.\n\tProactive, resourceful, and capable of working independently."}, {"id": "26708", "title": "Administrative Specialist", "bhTitle": "Administration", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-01", "exp": "2026-12-02", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday–Thursday, 9:00 AM–6:00 PM In-Office; Friday Remote as Needed\n\nPosition Overview\n\nA financial services and insurance office is seeking a highly organized and detail-oriented New Business & Administrative Specialist to support new business processing, compliance, client service, and general office operations.\n\nThis position requires someone who can manage multiple responsibilities efficiently, including reviewing new business applications, resolving outstanding documentation issues, preparing reports and correspondence, supporting client accounts, and handling day-to-day administrative functions.\n\nThe ideal candidate is organized, professional, comfortable working with financial and insurance documentation, and proficient with a variety of business software and technology.\n\nKey Responsibilities\n\nNew Business & Compliance\n\n\tReview and analyze new business applications to ensure accuracy, completeness, and adherence to applicable regulatory and internal guidelines.\n\tReview applications and supporting documentation to determine whether submissions are in good order.\n\tProcess, track, and complete new business administrative tasks.\n\tResearch outstanding application issues and communicate with agents to obtain necessary information or documentation.\n\tWork closely with internal departments to resolve pending new business matters.\n\tReview incoming and outgoing correspondence for applicable compliance requirements.\n\tManage presales materials and documentation in accordance with established compliance procedures.\n\tMaintain accurate records and ensure new business matters are processed in a timely and efficient manner.\n\tPrepare management reports and identify trends, outstanding issues, and areas requiring attention.\n\nInsurance & Client Support\n\n\tAssist with preparing and analyzing insurance needs for high-net-worth clients.\n\tPrepare sales illustration reports and maintain documentation for existing accounts.\n\tProvide professional customer service to clients.\n\tIdentify and communicate potential sales opportunities when appropriate.\n\tAssist with ongoing account maintenance and client requests.\n\tSupport the development of solutions for individual and business clients.\n\nAdministrative Support\n\n\tPrepare and draft professional correspondence for office management.\n\tCoordinate and prepare presentations, reports, and other business materials.\n\tManage calendars, phones, mail, filing, copying, and general office organization.\n\tOrder office supplies and assist with expense reports.\n\tRun administrative reports and distribute forms, bulletins, and internal communications.\n\tMaintain organized electronic and physical records.\n\tAssist with scheduling and other day-to-day administrative responsibilities.\n\tPrepare documents and presentations using Microsoft Word, Excel, and PowerPoint.\n\nTechnical Support\n\n\tProvide basic technical support to users within the division.\n\tAssist with hardware and software troubleshooting.\n\tHelp resolve routine technology issues or coordinate additional support when necessary.\n\nQualifications\n\n\tStrong organizational, multitasking, and time-management skills.\n\tExcellent attention to detail and accuracy.\n\tStrong written and verbal communication skills.\n\tAbility to manage multiple priorities and deadlines.\n\tProfessional and comfortable communicating with clients, agents, management, and internal departments.\n\tAbility to work independently while collaborating effectively with a team.\n\tExperience with insurance, financial services, new business processing, compliance, or administrative support is strongly preferred.\n\tComfortable handling confidential financial and client information."}, {"id": "26707", "title": "Bookkeeper", "bhTitle": "Bookkeeper", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-31", "exp": "2026-12-01", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nA school in Brooklyn, NY is seeking a dependable and detail-oriented Bookkeeper to join its team. The Bookkeeper will be responsible for maintaining accurate financial records, assisting with payroll, and supporting the school's day-to-day accounting and financial operations.\n\nThe ideal candidate is organized, accurate, comfortable working independently, and experienced with QuickBooks and Microsoft Excel.\n\nKey Responsibilities\n\n\tMaintain accurate and up-to-date financial records.\n\tProcess and assist with payroll accurately and on schedule.\n\tRecord financial transactions and maintain appropriate documentation.\n\tManage accounts payable and accounts receivable as needed.\n\tProcess invoices, payments, deposits, and other financial transactions.\n\tPerform bank and account reconciliations.\n\tMaintain organized bookkeeping and financial files.\n\tTrack expenses and assist with financial reporting.\n\tReview records for accuracy and resolve discrepancies.\n\tUtilize QuickBooks for day-to-day bookkeeping and accounting functions.\n\tPrepare and maintain spreadsheets using Microsoft Excel.\n\tCommunicate with school administration regarding financial matters as needed.\n\tMaintain confidentiality when handling financial and employee information.\n\tAssist with additional bookkeeping and administrative responsibilities as needed.\n\nQualifications\n\n\tPrevious bookkeeping or accounting experience required.\n\tPayroll processing experience required.\n\tProficiency in QuickBooks.\n\tProficiency in Microsoft Excel.\n\tStrong attention to detail and accuracy.\n\tExcellent organizational and recordkeeping skills.\n\tStrong written and verbal communication skills.\n\tAbility to manage multiple responsibilities and deadlines.\n\tAbility to work independently and take ownership of assigned responsibilities.\n\tDependable, professional, and consistent.\n\tPrevious school bookkeeping or accounting experience is a plus."}, {"id": "26706", "title": "E-Commerce Manager", "bhTitle": "ECommerce Manager", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-08-31", "exp": "2026-12-01", "desc": "Growing home products company focused on developing, sourcing, and bringing innovative consumer products to market. Our categories include lighting, home decor, seasonal products, and related consumer goods. We are based in Woodbridge, New Jersey, with showroom offices in New York City, and we are building an increasingly important e-commerce business alongside our established retail business.\n\nThe Opportunity\nWe are looking for a hands-on E-Commerce Manager to own, operate, and grow our online business, with Amazon as a major focus along with our direct-to-consumer websites and additional e-commerce opportunities. This role is for someone who wants to build a business, not simply maintain listings. The right candidate will combine marketplace expertise, merchandising, advertising, analytics, inventory planning, and commercial judgment to drive profitable growth.\n\nKey Responsibilities\n• Own the day-to-day management and growth of our Amazon business, including Seller Central.\n• Manage product listings, catalog structure, titles, bullets, keywords, images, A+ content, SEO, variations, and overall content quality.\n• Manage and optimize Amazon advertising/PPC, promotions, pricing, and other traffic and conversion\ninitiatives.\n• Monitor account health, reviews, listing issues, suppressed listings, chargebacks, returns, and marketplace compliance.\n• Plan FBA and e-commerce inventory needs, replenishment, forecasting, and stock levels in coordination with operations and production.\n• Manage and grow our direct-to-consumer websites, including merchandising, product launches, promotions, content, and site performance.\n• Analyze sales, traffic, conversion, advertising spend, fees, fulfillment costs, returns, promotions, and\nproduct-level profitability.\n• Develop regular reporting and clear KPIs for sales, margin, advertising efficiency, inventory, and channel\nperformance.\n• Work closely with product, design, sales, operations, and management to launch products effectively online.\n• Research competitors, pricing, trends, keywords, marketplace opportunities, and new e-commerce channels.\n• Identify and test opportunities to expand the company's online presence beyond current channels.\n• Use AI and modern digital tools for research, content development, competitive analysis, reporting, workflow improvement, and productivity.\n• Take ownership of problems and opportunities and continually look for ways to improve both revenue and\nprofitability.\n\nWhat Success Looks Like\nSuccess in this position is not measured by sales alone. We are looking for someone who understands profitable growth and can balance revenue with advertising efficiency, marketplace fees, fulfillment costs, inventory, returns, promotions, and contribution margin. The E-Commerce Manager should be able to use data to make decisions and clearly explain what is working, what is not, and where the next growth opportunity exists.\n\nQualifications\n• 3-5 years of relevant hands-on e-commerce experience.\n• Strong Amazon marketplace experience; practical experience working in Amazon Seller Central is strongly required.\
