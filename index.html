nSales Leadership & Strategy\n\n\tDevelop and execute the company's overall sales strategy to drive revenue and profitable growth.\n\tLead, manage, and support the sales team in achieving company objectives and sales targets.\n\tEstablish sales goals, forecasts, performance expectations, and account strategies.\n\tMonitor individual and team performance and identify opportunities for improvement.\n\tProvide leadership, coaching, and direction to the sales organization.\n\tWork closely with ownership and senior management on long-term growth and business-development strategies.\n\nKey Accounts & Business Development\n\n\tBuild, maintain, and expand relationships with key retail and wholesale footwear accounts.\n\tLeverage existing industry relationships to develop new business opportunities.\n\tIdentify and pursue new retailers, accounts, channels, and strategic partnerships.\n\tManage and grow existing customer relationships.\n\tParticipate directly in major account presentations, negotiations, and sales opportunities.\n\tDevelop strategies to increase account penetration and overall sales volume.\n\tMaintain strong relationships with buyers and key decision-makers.\n\nSales Performance & Market Strategy\n\n\tDevelop accurate sales forecasts and monitor performance against established goals.\n\tAnalyze customer performance, market conditions, competitive activity, and footwear trends.\n\tIdentify opportunities for new products, customers, categories, and distribution channels.\n\tProvide leadership with regular updates regarding sales performance, opportunities, and market developments.\n\tUse sales data and market intelligence to guide account and growth strategies.\n\nCross-Functional Collaboration\n\n\tCollaborate with merchandising, product development, operations, and other departments to support customer needs and sales opportunities.\n\tCommunicate buyer feedback and market trends to internal teams.\n\tPartner with product teams to ensure assortments align with customer and market demand.\n\tCoordinate internally to address account needs, product opportunities, and business challenges.\n\tRepresent the company at customer meetings, trade shows, market appointments, and industry events as needed.\n\nQualifications\n\n\tSignificant footwear industry experience required.\n\tExtensive sales leadership experience within the wholesale footwear industry.\n\tProven track record of growing revenue and developing major retail and wholesale accounts.\n\tStrong existing relationships with footwear buyers, retailers, and wholesale accounts.\n\tDemonstrated experience leading, managing, and motivating a sales team.\n\tStrong background in account management and new business development.\n\tExcellent negotiation, presentation, and relationship-building skills.\n\tStrong understanding of sales forecasting, account planning, pricing, and performance management.\n\tAbility to identify and capitalize on new market and customer opportunities.\n\tStrategic thinker with a hands-on, results-oriented approach.\n\tStrong leadership and decision-making abilities.\n\tExcellent written and verbal communication skills.\n\tAbility to work effectively with ownership, senior management, buyers, and internal departments."}, {"id": "26817", "title": "Personal Assistant & Bookkeeper", "bhTitle": "Assistant", "category": "Accounting & Finance", "type": "Other", "typeNote": "4 Days No Friday", "state": "NY", "added": "2026-09-29", "exp": "2026-12-29", "desc": "Location: Midtown Manhattan, NY – In-Office\nEmployment Type: Part-Time / 4 Days per Week\nSchedule: 4 Days per Week\n\nPosition Overview\n\nA Midtown Manhattan office is seeking an experienced, highly organized, and discreet Personal Assistant & Bookkeeper to provide administrative support while managing bookkeeping and personal financial records.\n\nThis position requires someone with strong QuickBooks and advanced Excel skills, previous bookkeeping experience, and the ability to handle confidential personal and financial information with discretion.\n\nThe ideal candidate is detail-oriented, trustworthy, organized, and comfortable balancing bookkeeping responsibilities with day-to-day personal and administrative support.\n\nKey Responsibilities\n\nBookkeeping & Financial Support\n\n\tManage day-to-day bookkeeping and financial recordkeeping.\n\tMaintain accurate records using QuickBooks.\n\tTrack and categorize income, expenses, payments, and transactions.\n\tPerform account and bank reconciliations.\n\tAssist with accounts payable and accounts receivable as needed.\n\tMaintain and organize personal and business financial records.\n\tCreate and maintain detailed Excel spreadsheets, reports, and financial trackers.\n\tReview financial information for accuracy and identify discrepancies.\n\tOrganize documentation for accountants and other financial professionals as needed.\n\tHandle sensitive personal accounts and financial information with complete confidentiality.\n\nPersonal & Administrative Assistance\n\n\tProvide day-to-day personal and administrative support.\n\tMaintain organized files, records, documents, and correspondence.\n\tAssist with scheduling, follow-ups, and general office responsibilities.\n\tCoordinate payments, documents, and other administrative matters.\n\tTrack outstanding tasks and ensure important items are completed on time.\n\tAssist with special projects and other responsibilities as needed.\n\tMaintain a high level of professionalism and discretion at all times.\n\nQualifications\n\n\tPrevious bookkeeping experience required.\n\tStrong proficiency in QuickBooks required.\n\tAdvanced Microsoft Excel skills required.\n\tPrevious experience as a bookkeeper, personal assistant, administrative assistant, or similar position preferred.\n\tComfortable handling personal accounts and confidential financial information.\n\tExcellent attention to detail and accuracy.\n\tStrong organizational and time-management skills.\n\tAbility to work independently and manage multiple responsibilities.\n\tStrong problem-solving and follow-up skills.\n\tProfessional, dependable, and highly discreet.\n\tStrong written and verbal communication skills.\n\tComfortable working in person in Midtown Manhattan four days per week."}, {"id": "26816", "title": "Babysitter / Nanny – Newborn Care", "bhTitle": "Babysitter/Nanny", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-29", "exp": "2026-12-29", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday–Thursday, 8:00 AM–4:15 PM; Friday, 8:00 AM–1:15 PM\n\nPosition Overview\n\nA family in the Marine Park area of Brooklyn is seeking a loving, reliable, and experienced Babysitter / Nanny to provide attentive care for a newborn.\n\nThe ideal candidate is nurturing, dependable, patient, and experienced with newborns. This position will focus primarily on providing a safe and caring environment for the baby while maintaining feeding, sleep, and daily routines.\n\nKey Responsibilities\n\n\tProvide attentive, loving, and safe care for the newborn throughout the day.\n\tHandle feeding, burping, and diaper changes.\n\tFollow and maintain the baby's established daily routine.\n\tPrepare bottles and properly clean and organize feeding supplies.\n\tFollow and maintain appropriate nap and sleep routines.\n\tEngage the baby in age-appropriate developmental activities, including tummy time, reading, and sensory play.\n\tKeep the baby's areas clean, safe, and organized.\n\tWash and organize bottles, baby clothes, and other baby-related items as needed.\n\tMonitor the baby's comfort and well-being throughout the day.\n\tCommunicate regularly with the family regarding feeding, naps, activities, and the baby's overall day.\n\tPromptly communicate any questions or concerns to the family.\n\nQualifications\n\n\tPrevious newborn or infant childcare experience strongly preferred.\n\tLoving, nurturing, and patient approach to childcare.\n\tReliable and dependable.\n\tComfortable with bottle preparation, feeding, diapering, and newborn routines.\n\tUnderstanding of age-appropriate newborn activities and developmental needs.\n\tStrong communication skills.\n\tOrganized and attentive to detail.\n\tAbility to maintain a safe, clean, and comfortable environment for the baby.\n\tComfortable working in person in Marine Park, Brooklyn."}, {"id": "26815", "title": "Sales Account Executive", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-28", "exp": "2026-12-28", "desc": "Location: New York, NY\nEmployment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nA growing apparel company is seeking an experienced Sales Account Executive with strong industry relationships and a proven background in wholesale apparel sales.\n\nThis role will focus on managing and growing established accounts while also opening new retail accounts and developing new business opportunities. The Sales Account Executive will sell existing line merchandise while working closely with retail buyers and the in-house design team to develop private-label programs tailored to customer needs.\n\nThe ideal candidate is a highly motivated and commercially minded salesperson who understands the apparel market, has established buyer relationships, and can combine strong sales skills with creativity and resourcefulness.\n\nKey Responsibilities\n\nSales & Account Management\n\n\tManage and grow relationships with established retail accounts.\n\tIdentify prospects and open new retail accounts for the company.\n\tPresent and sell men's, women's, and kids' apparel merchandise to retail buyers.\n\tBuild and maintain strong relationships with buyers and other business partners.\n\tIdentify opportunities to expand business within existing accounts.\n\tDevelop a strong understanding of each customer's business, product needs, and pricing requirements.\n\tConsistently pursue new sales and revenue opportunities.\n\nPrivate Label Development\n\n\tWork closely with retail buyers to identify opportunities for private-label programs.\n\tPartner with the in-house design team to develop products based on buyer needs, trends, price points, and retail opportunities.\n\tCommunicate buyer feedback and requirements to internal teams.\n\tHelp develop creative product solutions that meet both customer expectations and company objectives.\n\tFollow private-label opportunities from initial concept through the sales and development process.\n\nPricing & Negotiations\n\n\tNegotiate pricing, terms, discounts, and allowances within established company policies.\n\tUnderstand customer margins and pricing requirements.\n\tApply a strong understanding of retail math, markup, markdowns, margins, and pricing when developing and negotiating business.\n\tTroubleshoot account issues and respond quickly to changing customer needs.\n\tAnticipate potential challenges and proactively develop solutions.\n\nInternal & External Collaboration\n\n\tBuild effective working relationships with internal associates, retail buyers, and outside business partners.\n\tWork closely with design and other internal departments to support customer programs.\n\tCommunicate account opportunities, buyer feedback, and market information to the appropriate teams.\n\tMaintain organized account information, correspondence, pricing, and sales activity.\n\nQualifications\n\n\tMinimum of 5 years of experience in a similar apparel sales position.\n\tEstablished relationships and experience within the apparel retail market strongly preferred.\n\tExperience selling men's, women's, and/or kids' apparel.\n\tExperience working with retail buyers and managing wholesale accounts.\n\tPrivate-label sales and product-development experience strongly preferred.\n\tStrong understanding of retail math, markup, markdowns, margins, pricing, and related concepts.\n\tExcellent verbal, written, presentation, and negotiation skills.\n\tProficiency in Microsoft Outlook and Excel.\n\tHighly organized with excellent attention to detail.\n\tStrong problem-solving and decision-making abilities.\n\tAbility to work independently and respond quickly to changing priorities.\n\tProfessional, personable, flexible, and highly motivated.\n\tAbility to manage multiple accounts and opportunities in a fast-paced environment.\n\tStrong ability to develop productive relationships with buyers, internal teams, and business partners."}, {"id": "26814", "title": "Sales Assistant", "bhTitle": "Sales Assistant", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-28", "exp": "2026-12-28", "desc": "Location: Midtown Manhattan, NY – In-Office\nEmployment Type: Full-Time\nSchedule: Monday–Friday, 9:00 AM–6:00 PM\n\nPosition Overview\n\nA growing wholesale company is seeking an organized and detail-oriented Sales Assistant to work closely with two key members of the sales team.\n\nThis is a hands-on support role involving buyer communication, showroom preparation, order tracking, inventory reporting, samples, line sheets, and coordination with production. The Sales Assistant will play an important role in keeping customer accounts organized and ensuring the sales team has the information and materials needed to successfully manage buyer relationships.\n\nThe position offers strong growth potential, including the opportunity to work directly with customer accounts after becoming familiar with the company, products, and sales processes.\n\nKey Responsibilities\n\nSales & Buyer Support\n\n\tProvide day-to-day support to two key salespeople.\n\tPrepare for buyer and customer showroom appointments.\n\tCommunicate professionally with buyers and their assistants, providing requested product, order, and account information.\n\tComplete and maintain customer item setup forms for purchase order creation.\n\tAssist the sales team with buyer requests and follow-up.\n\tCommunicate buyer requests, product needs, and feedback to the production department.\n\tHelp prepare the sales team for trade shows, buyer meetings, and presentations.\n\nInventory & Order Management\n\n\tRun, review, and understand Inventory ATS (Available-to-Sell) Reports.\n\tReview Open Order Reports against production deliveries.\n\tMonitor orders to help ensure products are delivered according to customer timelines.\n\tIdentify potential delivery issues and communicate updates to the appropriate team members.\n\tAssist with price ticket and UPC information.\n\tMaintain accurate product and customer information.\n\nShowroom & Sample Management\n\n\tMaintain an organized record of samples and packages sent to buyers.\n\tManage and update the company's line sheet system.\n\tOrganize samples and merchandise within the showroom.\n\tEnsure samples and sales materials are prepared for appointments and presentations.\n\tHelp maintain an organized and professional showroom environment.\n\nQualifications\n\n\tPrevious experience in sales support, wholesale, fashion, accessories, merchandising, customer service, or a related environment is preferred.\n\tStrong organizational skills and excellent attention to detail.\n\tComfortable working with reports, spreadsheets, inventory information, and order data.\n\tStrong written and verbal communication skills.\n\tProfessional and comfortable communicating directly with buyers and their assistants.\n\tAbility to manage multiple projects, requests, and deadlines simultaneously.\n\tStrong follow-up skills.\n\tComfortable learning ATS reports, open-order reporting, UPC information, line sheets, and customer item setup processes.\n\tProficiency with Microsoft Excel and other standard office software preferred.\n\tTeam-oriented with the ability to work closely with sales and production departments.\n\tDependable, proactive, and eager to learn.\n\tComfortable working five days per week in the Midtown Manhattan office."}, {"id": "26813", "title": "Sales", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-28", "exp": "2026-12-26", "desc": "Wholesale Sales for International salesperson to South America, Curacao, Panama, and Latin American countries. Apparel, Sportswear, accessories, etc..\nSalesperson can sell to all these countries!"}, {"id": "26812", "title": "Designer", "bhTitle": "Designer", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-28", "exp": "2026-12-31", "desc": "Top Designer for Apparel, Sportswear and Pajamas. Established and growing wholesale comapny."}, {"id": "26811", "title": "Manager", "bhTitle": "Manager", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-28", "exp": "", "desc": "Manager for a wholesale company selling pajamas, accessories, and apparel to set up a Live Selling TikTok and What Not Shop. Wants a leader to manage 6 salespeople. Salary plus commission."}, {"id": "26810", "title": "Sales - LiveSelling", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-28", "exp": "2026-12-31", "desc": "Live Selling: Hiring 5-6 salespeople. Selling sleepwear, shapewear, fashion tops and bottoms, and accessories. Sell on TikTok, Whatnot, and Amazon Live.\nSelling from Showroom Midtown.\nFull Time\nLooking for long-term great salespeople!\n150/ Day"}, {"id": "26809", "title": "Packaging Designer", "bhTitle": "Designer", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-28", "exp": "2026-12-28", "desc": "Employment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nA growing beauty company is seeking an experienced Packaging Designer with a strong background in skincare, cosmetics, personal care, or related beauty products.\n\nThis is a hands-on role for a designer who can take products from initial concept through final production in a fast-paced environment. The Packaging Designer will be responsible for developing compelling packaging concepts, creating production-ready artwork, collaborating with vendors and overseas manufacturers, and ensuring each project successfully balances visual impact, functionality, production requirements, and cost.\n\nThe ideal candidate is commercially minded, highly organized, and capable of taking ownership of multiple projects with minimal direction.\n\nKey Responsibilities\n\nPackaging Design & Creative Development\n\n\tDesign packaging for skincare, body care, cosmetics, personal care, and other beauty products.\n\tDevelop product concepts, positioning, naming, copy, and overall visual direction based on business and product needs.\n\tTranslate creative concepts into commercially viable, retail-ready packaging.\n\tCreate layouts and artwork using provided dielines.\n\tIncorporate product copy, ingredients, claims, specifications, and other required information into packaging designs.\n\tMaintain consistency across product lines while adapting designs to individual product and market needs.\n\tBalance strong visual design with product functionality, production feasibility, and cost considerations.\n\nProduction & Product Development\n\n\tPrepare accurate, production-ready artwork and final files.\n\tReview dielines, specifications, materials, print requirements, and production details.\n\tManage projects from initial concept through sampling, revisions, approvals, and final production.\n\tReview samples and proofs and communicate necessary revisions.\n\tTroubleshoot packaging and production issues as they arise.\n\tEnsure final packaging accurately reflects approved designs and specifications.\n\nVendor & Manufacturer Communication\n\n\tWork directly with vendors and overseas manufacturers throughout the development and production process.\n\tCommunicate packaging specifications, artwork requirements, revisions, and approvals.\n\tCoordinate samples and address production questions or issues.\n\tMaintain clear communication to keep projects moving according to schedule.\n\tIdentify opportunities to improve packaging quality, efficiency, cost, and development processes.\n\nProject Management & Collaboration\n\n\tWork cross-functionally with internal teams to move projects efficiently from concept through production.\n\tManage multiple packaging projects and deadlines simultaneously.\n\tAdapt quickly to changing priorities and evolving business needs.\n\tTake ownership of projects and proactively identify next steps.\n\tMaintain organized artwork, specifications, revisions, and project files.\n\tHelp improve internal design and product-development processes.\n\nQualifications\n\n\t4+ years of professional beauty packaging design experience.\n\tStrong portfolio demonstrating packaging work within skincare, cosmetics, beauty, or personal care.\n\tAdvanced proficiency in Adobe Illustrator and Photoshop.\n\tHands-on experience preparing final artwork for packaging production.\n\tStrong understanding of dielines, packaging materials, formats, printing methods, and production processes.\n\tExperience taking packaging projects from concept through finished production.\n\tExperience communicating directly with vendors and manufacturers.\n\tStrong creative, analytical, and problem-solving abilities.\n\tExcellent attention to detail.\n\tStrong project-management and organizational skills.\n\tAbility to manage multiple projects and deadlines in a fast-paced environment.\n\tComfortable making decisions and moving projects forward with minimal direction.\n\tStrong written and verbal communication skills.\n\tExperience with AI-powered design tools and incorporating AI into the creative workflow is a strong plus.\n\tKorean/English bilingual abilities and experience working with Korean manufacturers are a strong plus."}, {"id": "26808", "title": "Big Box Retail Sales Manager (International)", "bhTitle": "Sales- Mid Level", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-25", "exp": "2026-12-25", "desc": "Location: Flexible\nJob Type: Full time\nSchedule: Monday through Friday\n\nWe are looking for a proven sales professional with real experience placing and growing product lines inside major big box retailers, including Costco, Home Depot, Lowe's, Menards, and their equivalents across the UK, Europe, and other international markets. In this role, you will represent our brand with the professionalism these major accounts demand, driving global growth and building lasting retail partnerships.\n\nKey Responsibilities:\n\n\tBuild and manage high-level relationships with buyers at major big box and wholesale retail chains.\n\n\tDrive new product placements and expand our existing shelf presence across international target markets.\n\n\tNavigate complex retailer onboarding processes, vendor requirements, and negotiations across multiple global regions.\n\n\tRepresent our brand with the top-tier professionalism and strategic execution that major retail accounts demand.\n\nQualifications:\n\n\tProven track record of successfully selling into Costco, Home Depot, Lowe's, Menards, or similar major big box chains.\n\n\tDemonstrated international sales experience across the UK, Europe, or other global markets.\n\n\tStrong relationship-building, communication, and executive-level negotiation skills.\n\n\tA self-starter attitude with the ability to manage major accounts independently and drive results.\n\nWhat We Offer:\n\n\tA key role with significant direct impact on our brand's global market presence.\n\n\tFlexible work environment with international growth exposure."}, {"id": "26807", "title": "Livestream Studio Assistant and Packer", "bhTitle": "Assistant", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-25", "exp": "2026-12-24", "desc": "Location: Midtown Manhattan, New York\nJob Type: Full time\nSchedule: Monday through Friday\n\nWe are looking for a reliable and detail-oriented Livestream Studio Assistant and Packer to support our fast-paced children's wear broadcasting operations in Midtown Manhattan. In this role, you will work side-by-side with our livestream talent and production team to ensure every broadcast runs smoothly. You will handle everything behind the scenes, from prepping and organizing garments before going live to managing sample racks and packing items after broadcasts.\n\nKey Responsibilities:\n\n\tPrepare, organize, and rack children's apparel samples prior to each live broadcast.\n\n\tAssist the livestream host during broadcasts with seamless product handoffs and product inventory tracking.\n\n\tPack, label, and prep featured samples and items following live shopping events.\n\n\tMaintain a clean, organized studio space, keeping sample closets, props, and packing areas orderly.\n\n\tTrack sample inventory coming in and going out of the studio for scheduled streams.\n\nQualifications:\n\n\tPrevious experience in studio support, retail inventory, garment prep, or e-commerce packing preferred.\n\n\tStrong organizational skills and sharp attention to detail in a fast-moving environment.\n\n\tAbility to stay active on your feet and lift up to 30 lbs as needed for studio setup.\n\n\tA reliable, proactive team player who communicates clearly and efficiently.\n\n\tAn interest in fashion, retail, or live commerce operations is a plus.\n\nWhat We Offer:\n\n\tA hands-on role in a vibrant, supportive studio environment in Midtown Manhattan.\n\n\tComprehensive benefits package including health, dental, and vision coverage.\n\n\tPaid time off and company holidays.\n\n\tGenerous employee discounts on all of our children's wear lines.\n\n\tOpportunities for growth within our growing digital production team."}, {"id": "26806", "title": "Livestreamer", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-25", "exp": "2026-12-24", "desc": "Location: Midtown Manhattan, New York\nJob Type: Full time\nSchedule: Monday through Friday\n\nI am looking for an energetic and engaging Livestreamer to join our children's wear manufacturing brand right here in Midtown Manhattan. My team already has all the broadcast systems in place and a fully active studio. I just need the right on camera talent to step in and bring our products to life. You will be the face of our brand, hosting regular live shopping events, showcasing our latest apparel, and interacting with our community in real time.\n\nKey Responsibilities:\n\n\tHost highly engaging and interactive livestream shopping events across our social media platforms and website.\n\n\tShowcase the features, fit, and quality of our children's wear collections to our audience.\n\n\tInteract with viewers in real time, answering questions, and driving sales during live broadcasts.\n\n\tCollaborate with my marketing and production teams to plan the run of show and highlight specific promotions.\n\n\tMaintain high energy, a positive attitude, and a strong brand image throughout all broadcasts.\n\nQualifications:\n\n\tPrevious experience in livestreaming, on camera hosting, or broadcast sales is preferred.\n\n\tA charismatic, confident, and highly articulate on camera presence.\n\n\tAbility to think quickly, improvise, and engage naturally with a live audience.\n\n\tFamiliarity with social media live shopping trends and best practices.\n\n\tA passion for the fashion industry, particularly children's apparel, is a huge plus.\n\nWhat We Offer:\n\n\tA fully equipped, professional broadcast studio ready for you to use from day one.\n\n\tA supportive team to handle the technical production and logistics so you can focus on presenting.\n\n\tComprehensive benefits package including health, dental, and vision coverage.\n\n\tPaid time off and company holidays.\n\n\tGenerous employee discounts on all of our children's wear lines."}, {"id": "26805", "title": "eCommerce Manager", "bhTitle": "ECommerce Manager", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-09-24", "exp": "2026-12-25", "desc": "Location: Hillside, New Jersey\nJob Type: Full-Time\nSchedule: Monday through Friday\n\nWe are seeking an experienced eCommerce Manager to lead the digital operations for our growing electronics arbitrage business based in the Kenilworth, New Jersey area. In this lead position, you will take complete ownership of our online sales channels, driving growth, optimizing listings, and managing the entire profit and loss statement for our eCommerce division. You will oversee everything from product sourcing and market research to paid advertising, search optimization, and performance reporting. If you possess a deep understanding of the online resale landscape and a proven track record of scaling digital storefronts, we want to hear from you.\n\nLead & Develop Team:\n\n\tTrain, mentor, and coach team members.\n\tConduct performance reviews & address performance gaps.\n\tFoster a positive and productive team environment.\n\nDrive E-commerce Success:\n\n\tOptimize product listings across all marketplaces.\n\tManage inventory and pricing strategies.\n\tAnalyze sales data and identify areas for improvement.\n\nProcess Improvement:\n\n\tIdentify and implement process improvements for efficiency and accuracy.\n\tCollaborate with other departments to achieve shared goals\n\nResponsibilities:\n\n\tStrong leadership and communication skills.\n\tExperience in e-commerce operations (listing optimization, inventory management, etc.).\n\tProficiency in data analysis and reporting tools.\n\tAbility to work independently and as part of a team.\n\nQualifications:\n\n\tManage daily team operations and performance.\n\tAnalyze key performance indicators (KPIs) and report on team progress.\n\tEnsure compliance with all company policies and procedures."}, {"id": "26804", "title": "HR Coordinator", "bhTitle": "Coordinator", "category": "HR, Management & Fundraising", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-24", "exp": "2026-12-24", "desc": "Location: Williamsburg, Brooklyn, NY – In-Person\nEmployment Type: Full-Time\nSchedule: Monday–Friday, 9:00 AM–5:00 PM\nTransportation: Shuttle from Crown Heights Provided\n\nPosition Overview\n\nA growing organization is seeking an organized, personable, and detail-oriented HR Coordinator to support the employee onboarding process.\n\nThe HR Coordinator will serve as a primary point of contact for new hires, guiding them through each stage of onboarding and ensuring all required paperwork, documentation, and steps are completed accurately and on time.\n\nNo prior HR experience is required. This is a great opportunity for someone with strong communication and organizational skills who enjoys working with people, following up, and keeping multiple processes moving forward.\n\nKey Responsibilities\n\n\tGuide new hires through each step of the onboarding process.\n\tServe as a main point of contact for new employees throughout onboarding.\n\tExplain onboarding requirements and next steps clearly.\n\tFollow up on outstanding paperwork, documentation, and incomplete requirements.\n\tTrack document completion and onboarding progress for multiple new hires simultaneously.\n\tCommunicate with new hires through phone, text, and email.\n\tAnswer questions and provide assistance throughout the onboarding process.\n\tTroubleshoot onboarding issues and help resolve delays or missing information.\n\tMaintain accurate and organized employee and onboarding records.\n\tUpdate internal systems with current onboarding information and status changes.\n\tCoordinate with internal departments to ensure new hires complete all necessary requirements.\n\tIdentify potential delays and proactively follow up to keep the onboarding process moving.\n\tMaintain professional and consistent communication with new hires.\n\tEnsure sensitive employee information is handled appropriately and confidentially.\n\nQualifications\n\n\tNo previous HR experience required.\n\tExcellent written and verbal communication skills.\n\tStrong interpersonal and relationship-building abilities.\n\tHighly organized with excellent attention to detail.\n\tStrong follow-up skills and ability to keep processes moving forward.\n\tComfortable communicating frequently by phone, text, and email.\n\tAbility to manage multiple new hires and onboarding cases simultaneously.\n\tComfortable learning new systems and processes.\n\tStrong problem-solving abilities.\n\tDependable, proactive, and able to take ownership of assigned responsibilities.\n\tAbility to maintain confidentiality when handling employee information.\n\tComfortable working in a fast-paced environment.\n\tAbility to work in person in Williamsburg, Brooklyn."}, {"id": "26803", "title": "Patient Enrollment Specialist", "bhTitle": "Sales- Mid Level", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-24", "exp": "2026-12-24", "desc": "Location: Williamsburg, Brooklyn, NY – In-Person\nEmployment Type: Full-Time\nSchedule: Monday–Friday, 9:00 AM–5:00 PM\nTransportation: Shuttle from Crown Heights Provided\n\nPosition Overview\n\nA growing healthcare organization is seeking a motivated and results-driven Patient Enrollment Specialist to help prospective patients and families get started with care.\n\nThis role combines phone sales, relationship building, patient intake, and enrollment coordination. The Patient Enrollment Specialist will speak with prospective patients and families, explain available services, convert qualified leads into enrolled clients, and guide them through each step of the intake and onboarding process.\n\nThe ideal candidate is a strong phone salesperson who is goal-oriented, organized, persuasive, and committed to providing an excellent experience from the first conversation through successful enrollment.\n\nKey Responsibilities\n\nPatient Outreach & Sales\n\n\tSpeak with prospective patients and families about available services.\n\tRespond to incoming leads and conduct consistent follow-up.\n\tBuild relationships with prospective patients and understand their individual needs.\n\tClearly explain services, enrollment requirements, and next steps.\n\tConvert qualified leads into successfully enrolled clients.\n\tAddress questions and concerns that may arise during the enrollment process.\n\tMaintain consistent communication with prospective patients and families.\n\tWork toward individual enrollment and performance goals.\n\nIntake & Enrollment\n\n\tGuide patients and families through the intake and onboarding process from beginning to end.\n\tAssist with collecting necessary information and documentation.\n\tEnsure enrollment requirements are completed accurately and efficiently.\n\tTrack each prospective patient through the enrollment pipeline.\n\tFollow up on incomplete information or outstanding enrollment requirements.\n\tMaintain accurate and organized patient and lead records.\n\nCare Coordination\n\n\tCoordinate with care, staffing, and internal teams to ensure a smooth transition from enrollment to services.\n\tCommunicate important patient information to the appropriate team members.\n\tHelp prevent delays by proactively identifying and addressing enrollment issues.\n\tMaintain ownership of each enrollment until the patient is successfully transitioned to the appropriate care team.\n\nQualifications\n\n\tStrong phone sales and lead-conversion skills.\n\tExcellent verbal and written communication abilities.\n\tConfident and comfortable speaking with prospective patients and families by phone.\n\tGoal-driven and motivated by achieving enrollment and performance targets.\n\tStrong relationship-building and interpersonal skills.\n\tExcellent follow-up and organizational abilities.\n\tAbility to manage multiple leads and prospective patients simultaneously.\n\tPersistent, proactive, and solutions-oriented.\n\tStrong attention to detail.\n\tComfortable working in a fast-paced environment.\n\tAbility to work in person in Williamsburg, Brooklyn.\n\tPrevious experience in sales, enrollment, intake, customer service, healthcare, or a related role is preferred."}, {"id": "26802", "title": "Patient Outreach Coordinator", "bhTitle": "Coordinator", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-24", "exp": "2026-12-24", "desc": "Location: Williamsburg, Brooklyn, NY – In-Person\nEmployment Type: Full-Time\nSchedule: Monday–Friday, 9:00 AM–5:00 PM\n\nPosition Overview\n\nA growing healthcare organization is seeking a personable, persistent, and solutions-oriented Patient Outreach Coordinator to work directly with patients and families whose care has been paused, interrupted, or may be at risk.\n\nThis is not a typical desk-based administrative role. The position is centered around real conversations, relationship building, problem-solving, and consistent follow-up. The Patient Outreach Coordinator will identify what is preventing a patient from receiving care, work with the appropriate internal teams to address the issue, and remain involved until the case is fully resolved.\n\nNo healthcare experience is required. The ideal candidate is an excellent communicator who enjoys working with people, solving problems, and taking ownership of situations from beginning to end.\n\nKey Responsibilities\n\n\tContact patients and families whose care has been paused, interrupted, or may be at risk.\n\tIdentify the underlying reason a patient is experiencing difficulty receiving services.\n\tHave thoughtful and productive conversations with patients and families to understand their concerns.\n\tBuild trust and maintain positive relationships with patients and their families.\n\tWork closely with staffing and clinical teams to identify practical solutions.\n\tAddress concerns and help remove obstacles preventing patients from receiving consistent care.\n\tTake ownership of assigned cases from the initial outreach through final resolution.\n\tFollow up consistently with patients, families, and internal teams until each issue is resolved.\n\tMaintain accurate records of conversations, follow-ups, case updates, and resolutions.\n\tManage multiple active cases and prioritize urgent situations appropriately.\n\tEscalate complex or time-sensitive concerns to the appropriate team members when necessary.\n\tKeep patients and families informed throughout the resolution process.\n\tHelp create a positive patient experience through responsiveness, professionalism, and consistent communication.\n\nQualifications\n\n\tNo previous healthcare experience required.\n\tExcellent verbal and written communication skills.\n\tStrong interpersonal and relationship-building abilities.\n\tComfortable speaking with patients and families by phone.\n\tPersistent and willing to follow up consistently until an issue is resolved.\n\tStrong problem-solving skills and ability to think quickly.\n\tAbility to navigate challenging conversations professionally and respectfully.\n\tHighly organized with strong attention to detail.\n\tAble to manage multiple cases and follow-ups simultaneously.\n\tSelf-motivated and comfortable taking ownership of assigned cases.\n\tPatient, dependable, and solutions-oriented.\n\tGenuine interest in helping people and improving their experience.\n\tComfortable working in person in Williamsburg, Brooklyn."}, {"id": "26801", "title": "Case Manager", "bhTitle": "Case Manager", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-24", "exp": "2026-12-24", "desc": "Location: Williamsburg, Brooklyn, NY – In-Person\nEmployment Type: Full-Time\nSchedule: Monday–Friday, 9:00 AM–5:00 PM\n\nPosition Overview\n\nA growing healthcare organization is seeking an organized and proactive Case Manager to manage a caseload of patients and coordinate caregiver placement and scheduling.\n\nThe Case Manager will work closely with patients, families, and caregivers to ensure each case is appropriately staffed and that day-to-day scheduling needs are handled efficiently. This position requires someone who can communicate effectively, think quickly, stay organized, and respond to last-minute staffing changes in a fast-paced environment.\n\nKey Responsibilities\n\n\tManage an assigned caseload of patients and their ongoing caregiver needs.\n\tMatch caregivers with patients based on each family's specific needs, preferences, and scheduling requirements.\n\tCoordinate schedules between patients, families, and caregivers.\n\tQuickly re-staff cases when caregivers cancel or become unavailable.\n\tIdentify available caregivers and fill open shifts as efficiently as possible.\n\tMaintain regular communication with patients, families, and caregivers.\n\tRespond to scheduling changes, call-outs, and other time-sensitive issues.\n\tFollow up with families to ensure appropriate caregiver coverage.\n\tBuild positive working relationships with caregivers and families.\n\tMaintain accurate records of case assignments, schedules, changes, and communications.\n\tKeep internal systems updated with current patient and caregiver information.\n\tWork closely with internal teams to resolve staffing and scheduling challenges.\n\tEscalate complex case issues to management when necessary.\n\tHelp ensure continuity of care by minimizing gaps in caregiver coverage.\n\tManage multiple cases and priorities while maintaining a high level of professionalism and responsiveness.\n\nQualifications\n\n\tPrevious experience in case management, home care, healthcare staffing, scheduling, coordination, or a related role preferred.\n\tStrong verbal and written communication skills.\n\tExcellent organizational and time-management abilities.\n\tAbility to manage multiple patients, caregivers, and schedules simultaneously.\n\tStrong problem-solving skills and ability to think quickly when unexpected staffing issues arise.\n\tComfortable making and receiving frequent phone calls.\n\tStrong follow-up skills and attention to detail.\n\tAbility to remain calm and professional in a fast-paced environment.\n\tDependable, proactive, and highly responsive.\n\tComfortable working in person in Williamsburg, Brooklyn.\n\tBasic computer skills and ability to learn scheduling, CRM, or case-management systems."}, {"id": "26800", "title": "Customer Support Specialist", "bhTitle": "Customer Service", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-24", "exp": "2026-12-24", "desc": "Location: Brooklyn, NY – In-Office\nEmployment Type: Full-Time\n\nPosition Overview\n\nA growing payments technology company serving retailers is seeking a Merchant Support Specialist to be the first point of contact for its merchant customers.\n\nThis is a hands-on customer support and operations role focused on answering merchant questions, troubleshooting issues, managing follow-ups, and ensuring customers have a smooth experience using the platform. The Merchant Support Specialist will also assist newly onboarded merchants as they transition into ongoing support and work closely with product, development, and sales teams to resolve issues efficiently.\n\nThe ideal candidate is an excellent communicator who is patient, organized, tech-savvy, and solutions-oriented. This person should enjoy helping customers, learning new technology, and taking ownership of issues through resolution.\n\nKey Responsibilities\n\nMerchant Support\n\n\tServe as the first point of contact for merchants seeking assistance.\n\tRespond to merchant questions and support requests through phone, email, and chat.\n\tTroubleshoot and resolve day-to-day platform, account, and payment-related issues.\n\tProvide clear explanations and guidance to merchants who may not have a technical background.\n\tMaintain a warm, professional, and helpful approach during every customer interaction.\n\tFollow up with merchants to ensure issues are fully resolved.\n\nIssue Management & Troubleshooting\n\n\tTrack, document, and prioritize merchant issues.\n\tTroubleshoot problems and identify appropriate solutions.\n\tEscalate technical or complex issues to product or development teams when necessary.\n\tCoordinate internally to ensure escalated issues are addressed and communicated back to merchants.\n\tIdentify recurring merchant issues and share feedback with internal teams.\n\tMaintain ownership of support requests from initial contact through resolution.\n\nMerchant Onboarding & Account Support\n\n\tSupport newly onboarded merchants as they transition into regular platform usage.\n\tAssist with merchant account handoffs between sales, development, and support.\n\tHelp manage trial accounts and follow up with merchants as needed.\n\tAssist with billing details and routine account-related questions.\n\tHelp ensure merchant information and account records remain accurate and up to date.\n\nDocumentation & Systems\n\n\tMaintain accurate support and CRM records.\n\tDocument merchant conversations, issues, resolutions, and follow-up activity.\n\tCreate and maintain help center articles, FAQs, and support documentation.\n\tDevelop resources that allow merchants to quickly answer common questions and self-serve.\n\tKeep internal support documentation current as products and processes change.\n\nQualifications\n\n\tExcellent written and verbal communication skills.\n\tStrong customer service and interpersonal abilities.\n\tComfortable communicating with customers by phone, email, and chat.\n\tAbility to quickly learn new software and technology.\n\tComfortable explaining technical information clearly to non-technical users.\n\tHighly organized and capable of managing multiple merchant accounts, issues, and follow-ups simultaneously.\n\tStrong problem-solving and troubleshooting abilities.\n\tCalm and patient when handling customer questions or problems.\n\tStrong attention to detail and follow-through.\n\tComfortable working independently and taking ownership of customer issues.\n\tAble to work in-office in Brooklyn, NY.\n\tExperience in customer support, merchant services, operations, or a related role is preferred."}, {"id": "26799", "title": "Job Title: Wholesale Sales Associate", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NJ", "added": "2026-09-24", "exp": "2026-12-15", "desc": "Location: Linden or Long Branch, New Jersey\nJob Type: FT/PT\nSchedule: Monday-Friday\n\nAre you a driven, young professional looking to launch a rewarding sales career? We are a dynamic wholesale company with a unique opportunity for individuals ready to learn and grow. We specialize in acquiring a vast array of closeout products from major online retailers and selling them at highly discounted prices. We are expanding rapidly, with new offices and a capacity for over 100 new team members. This is more than just a job; it's a comprehensive training program designed to equip you with essential, lifelong skills in communication, sales, and business.\n\nKey Responsibilities:\n\n\tGenerate new sales leads and prospect for clients using our proven methods.\n\n\tEngage in both written and verbal communication to build and maintain customer relationships.\n\n\tLearn and apply ethical salesmanship and pricing strategies.\n\n\tManage the sales process from initial contact to closing the deal.\n\n\tParticipate in professional development and training sessions.\n\nQualifications:\n\n\tA strong desire to learn and grow in a fast-paced sales environment.\n\n\tExcellent communication skills, both written and verbal.\n\n\tSelf-motivated with a proactive and ethical approach to sales.\n\n\tNo prior sales experience is required; we provide all the necessary training.\n\nWhat We Offer:\n\n\tA comprehensive training program covering sales, communication, and business skills.\n\n\tThe opportunity to sell a wide range of tangible, high-demand products.\n\n\tA supportive and collaborative work environment focused on personal and professional development.\n\n\tWeekly classes led by a community leader, daily Minyanim."}, {"id": "26796", "title": "Product Development", "bhTitle": "Product Development", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-24", "exp": "2026-12-24", "desc": "Location: Midtown Manhattan, NY – On-Site\nEmployment Type: Full-Time\nPortfolio Required\nFitness and/or Accessories Experience Preferred\n\nPosition Overview\n\nA fashion-forward fitness and accessories company is seeking an experienced Product Development professional to join its team. The company designs and manufactures trend-driven yoga, fitness, beauty, and women's lifestyle accessories for the retail market.\n\nThe ideal candidate has an exceptional eye for design, strong attention to detail, and the ability to identify emerging trends and translate them into fashionable, commercially viable products.\n\nThis is a hands-on role that combines design, product development, factory communication, and collaboration with the sales team and retail buyers. You will help take products from initial concept through development and production while ensuring designs meet both the company's aesthetic and the needs of its customers.\n\nKey Responsibilities\n\n• Research fashion, fitness, lifestyle, color, print, and accessory trends and translate them into new product concepts.\n\n• Create CADs, line sheets, presentations, and detailed specifications for factories.\n\n• Develop products from initial concept through sampling and production.\n\n• Communicate directly with factories regarding product development, specifications, revisions, sample approvals, and inventory management.\n\n• Review and approve samples to ensure design intent, quality, color, materials, and construction are accurately executed.\n\n• Partner closely with the Sales Division and its buyers to understand customer needs and develop products tailored to specific retail opportunities.\n\n• Assist in interpreting buyer feedback and translating requests into commercially viable product designs.\n\n• Support packaging design and development as needed.\n\n• Assist with product photography, image retouching, and other visual content.\n\n• Contribute creative copy and design assets for marketing and sales materials.\n\n• Maintain organized design files, specifications, product information, and development timelines.\n\nQualifications\n\n• Product development experience, 3+ years, preferably within fitness, accessories, beauty, fashion, or women's lifestyle products.\n\n• Strong portfolio demonstrating excellent design sensibility and relevant product-development work.\n\n• Proficiency in Adobe Illustrator and Photoshop; broader Adobe Creative Cloud experience required.\n\n• Proficiency with Microsoft Office Suite.\n\n• Experience in creating CADs, line sheets, technical specifications, and factory-ready artwork.\n\n• Experience communicating with overseas factories and managing product development and sample approvals.\n\n• Packaging design, product photography, photo retouching, and creative copywriting experience preferred.\n\n• Shopify, Klaviyo, and social media experience are a plus.\n\n• Strong analytical and problem-solving capabilities.\n\n• Excellent attention to detail and pride in producing high-quality work.\n\n• Proactive, organized, highly motivated, and energetic.\n\n• Professional and positive attitude with strong written and verbal communication skills.\n\n• Ability to self-manage, prioritize multiple projects, and work both independently and collaboratively within a small team.\n\n• Strong understanding of current fashion and consumer trends with the ability to balance creativity with commercial needs.\n\nWork Environment\n\nThis is a full-time, on-site position in the company's Midtown Manhattan showroom. The ideal candidate will enjoy working in a fast-moving, entrepreneurial environment where design, product development, sales, and customer needs are closely connected.\n\nPortfolio submission is required for consideration."}, {"id": "26795", "title": "Automobile Warranty Sales Representative", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-09-23", "exp": "2026-12-23", "desc": "Location: Colts Neck, NJ\nJob Type: Full-time\nSchedule: In-office, Monday through Friday\n\nWe are seeking a motivated, driven Automobile Warranty Sales Representative to join our growing team in Colts Neck, NJ. In this role, you will handle a balanced mix of inbound leads, warm outbound calls, and dedicated customer service to help vehicle owners secure reliable extended coverage options.\n\nIf you thrive in a phone-based sales environment, enjoy educating clients on valuable protection products, and want an opportunity where your earning potential directly reflects your performance, we want to hear from you.\n\nKey Responsibilities:\n\n\tEngage with potential customers through a combination of warm outbound calls and incoming high-intent leads.\n\n\tGuide vehicle owners through available extended warranty and service contract options tailored to their specific needs.\n\n\tProvide exceptional customer service by answering questions, addressing concerns, and maintaining high satisfaction throughout the sales process.\n\n\tFollow up with prospect pipelines consistently to close sales and drive revenue.\n\n\tAccurately track, manage, and report daily sales activities and customer records within our CRM system.\n\nQualifications:\n\n\tPrior experience in a call center, telesales, or inside sales environment is strongly preferred.\n\n\tExperience in automobile warranty, extended service contract, or auto sales is a major plus.\n\n\tStrong communication and active listening skills with a dynamic, customer-focused phone presence.\n\n\tProven ability to build rapport quickly and overcome client objections effectively.\n\n\tReliable, detail-oriented, and capable of working productively in a full-time, in-office setup.\n\nWhat We Offer:\n\n\tConsistent flow of warm, high-quality inbound and outbound lead opportunities.\n\n\tA collaborative and supportive in-office environment located in Colts Neck, NJ.\n\n\tOngoing training and professional growth opportunities within a fast-paced market."}, {"id": "26794", "title": "AGGRESSIVE COMMERCIAL RETAIL LEASING AGENT - NYC & THE BOROS", "bhTitle": "Real Estate Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-23", "exp": "2026-12-30", "desc": "Some Experience Preferred - WILL TRAIN THE SUPERSTAR. We Lease NYC Retail. Stores, Restaurants, Salons, Medical, etc.. .We are a NYC-based commercial real estate brokerage/ownership group with 100s of retail spaces across Manhattan, Brooklyn, Queens, Bronx, Long Island & NJ. We move fast and we close.\nThe Role:\nYou will lease vacant retail spaces - from 500 SF mom-and-pop shops to 5,000 SF flagship spaces. Lease retail storefronts, shopping centers, mixed-use buildings. Show spaces to prospective tenants - restaurant owners, franchisees, retail chains, medical, etc. Canvas neighborhoods - cold call, walk the block, find tenants before they find you. Work directly with landlords to price and market vacancies. Close deals - we need CLOSERS, not tour guides. You Are: AGGRESSIVE SELF-STARTER - you don't wait for listings, you HUNT Money-motivated, ambitious, This is NOT a desk job. Commission"}, {"id": "26793", "title": "E-Commerce Account Manager", "bhTitle": "ECommerce Manager", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-09-23", "exp": "2026-12-28", "desc": "An e-commerce retailer based in New Brunswick, NJ, is seeking an E-Commerce Account Manager to handle day-to-day operations across major online marketplaces. The role covers competitive pricing, deal submissions, listing optimization, sales reporting, and coordinating inventory shipments to fulfillment centers. Ideal for someone with hands-on marketplace experience who is comfortable working with data and moving quickly in a fast-paced online retail environment.\n\nFull Time / Part Time: Full Time\nJob Hours: 9AM-6PM\nAdditional Information: There is a van ride to the office everyday\n\nEssential Duties and Responsibilities:\n\n\tManage day-to-day pricing across major online marketplaces\n\tPrepare and submit deals and promotional offers\n\tOptimize product listings, including titles, descriptions, images, and keywords\n\tGenerate and review sales reports to track performance and identify trends\n\tCoordinate and send inventory shipments to fulfillment centers\n\tMonitor marketplace account health and address listing or compliance issues as they arise\n\nSpecific Qualifications and/or Requirements:\n\n\tPrior experience managing seller accounts on Amazon, Walmart, and eBay strongly preferred\n\tWorking knowledge of marketplace seller platforms (Amazon Seller Central, Walmart Seller Center, eBay Seller Hub)\n\tComfort with spreadsheets and sales data; ability to build and interpret basic reports\n\tStrong attention to detail and accuracy with pricing and product information\n\tAbility to manage multiple listings and deadlines independently\n\tFamiliarity with FBA/WFS or third-party fulfillment processes a plus"}, {"id": "26792", "title": "Personal / Sales Assistant", "bhTitle": "Sales Assistant", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NJ", "added": "2026-09-22", "exp": "2026-12-15", "desc": "Location: Eatontown, NJ\nSchedule: Part-Time or Full-Time (Full-time preferred)\n\nA growing community-based business is looking for a reliable, flexible, and hardworking individual to provide general support with whatever comes up day to day. This could include personal assistant tasks, sales support, organizing, errands, customer communication, and other hands-on business needs.\n\nThe ideal candidate is someone who is motivated, dependable, personable, and willing to jump in wherever needed. The role can start part-time with the potential to grow into a larger or full-time position based on fit and performance."}, {"id": "26791", "title": "Personal Assistant", "bhTitle": "Personal Assistant", "category": "Administrative & Office", "type": "Remote / Hybrid", "typeNote": "Remote/Hybrid/FT", "state": "NJ", "added": "2026-09-22", "exp": "2026-12-10", "desc": "Schedule: Full-time\nLocation: Hybrid, with the option to work remotely at times\nA growing wellness company is seeking an organized and experienced Personal Assistant to help manage day-to-day administrative operations. The ideal candidate is reliable, detail-oriented, comfortable taking initiative, and has experience with Canva."}, {"id": "26790", "title": "Product Manufacturing Assistant", "bhTitle": "Production Assistant", "category": "Production & Product Development", "type": "Part Time", "typeNote": "", "state": "NJ", "added": "2026-09-22", "exp": "2026-12-17", "desc": "Schedule: Part-time\nA growing wellness company is seeking a reliable, hands-on individual to assist with producing and preparing its line of products. The ideal candidate is detail-oriented, follows directions well, and enjoys hands-on work."}, {"id": "26789", "title": "Livestream Sales Representative – Whatnot & TikTok Shop", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-22", "exp": "2026-12-22", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time, In-Person / On-Site\nSchedule: Flexible, Approximately 20–30 Hours per Week\n\nPosition Overview\n\nA Brooklyn-based e-commerce company is seeking an energetic, personable, and sales-driven Livestream Sales Representative to sell a variety of products through Whatnot, TikTok Shop, and other live-selling platforms.\n\nProducts may include electronics, handbags, accessories, jewelry, and other consumer merchandise.\n\nThis is a highly interactive, on-camera sales position for someone who enjoys engaging with customers, presenting products, creating excitement, and closing sales. The ideal candidate is confident, enthusiastic, comfortable speaking live on camera, and capable of creating an engaging shopping experience that converts viewers into customers.\n\nThe position will begin with base pay during training while the candidate learns the merchandise, selling techniques, and live-commerce platforms. Compensation may increase based on experience and demonstrated sales performance.\n\nKey Responsibilities\n\nLivestream Sales\n\n\tHost engaging, entertaining, and sales-focused live streams on Whatnot, TikTok Shop, and other relevant platforms.\n\tPresent and demonstrate a variety of products, including electronics, handbags, accessories, jewelry, and other merchandise.\n\tClearly communicate product features, benefits, pricing, and key selling points.\n\tBuild excitement around products and confidently encourage viewers to make purchases.\n\tCreate an energetic and professional shopping experience throughout each broadcast.\n\tMaintain audience engagement during extended live-selling sessions.\n\nCustomer Engagement\n\n\tInteract directly with viewers during live broadcasts.\n\tAnswer product questions and respond to comments in real time.\n\tBuild rapport with viewers and develop relationships with repeat customers.\n\tHelp grow and maintain a loyal online following.\n\tUse effective sales techniques to overcome objections and close sales.\n\tMaintain a friendly, enthusiastic, and professional on-camera presence.\n\nProduct Knowledge & Preparation\n\n\tLearn detailed information about the company's merchandise, including features, specifications, styles, materials, pricing, and selling points.\n\tPrepare and organize merchandise before each live broadcast.\n\tWork with the team to select products for upcoming streams.\n\tAssist with developing promotions, special offers, product bundles, and livestream themes.\n\tEnsure products are presented accurately and professionally.\n\nSales Performance & Growth\n\n\tWork toward established sales and performance goals.\n\tReview sales results and audience engagement to identify opportunities for improvement.\n\tTest different presentation styles and selling techniques to improve conversions.\n\tStay current on Whatnot, TikTok Shop, social media, e-commerce, and live-shopping trends.\n\tProvide feedback on products and promotions based on customer questions and live audience reactions.\n\nQualifications\n\n\tStrong sales ability and enthusiasm for interacting with customers.\n\tConfident and comfortable speaking and selling live on camera.\n\tEnergetic, personable, outgoing, and engaging communication style.\n\tStrong verbal communication and presentation skills.\n\tAbility to maintain energy and audience engagement throughout a live broadcast.\n\tInterest in electronics, handbags, accessories, jewelry, fashion, e-commerce, and consumer products.\n\tAbility to quickly learn detailed product information and explain it clearly to customers.\n\tSelf-motivated, dependable, and results-oriented.\n\tComfortable working in person in Brooklyn, NY.\n\tPrevious experience in retail sales, e-commerce, social media, live streaming, electronics, accessories, handbags, or jewelry sales is a plus.\n\tExperience with Whatnot, TikTok Shop, or another live-selling platform is strongly preferred but not required."}, {"id": "26787", "title": "Tax Accountant", "bhTitle": "Accountant", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-09-17", "exp": "2026-12-16", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nA large multi-location retail organization is seeking an experienced Tax Accountant to support its tax compliance, reporting, reconciliation, and payment functions.\n\nThe Tax Accountant will have primary responsibility for sales tax returns, corporate tax filings, tax account reconciliations, electronic tax payments, and multi-state tax compliance. This position will work closely with the Tax and Accounting teams to ensure federal, state, and local tax obligations are completed accurately and on schedule.\n\nThe ideal candidate has a strong accounting and tax background, experience working with multi-state tax requirements, and the ability to manage a high volume of filings, payments, and deadlines with accuracy.\n\nKey Responsibilities\n\nTax Compliance & Filings\n\n\tPrepare and assist with filing federal, state, and local corporate tax returns.\n\tPrepare and file monthly, quarterly, and annual sales tax returns in accordance with applicable regulations.\n\tRespond to state and local jurisdictions regarding sales tax notices and inquiries.\n\tMonitor filing requirements and deadlines across multiple jurisdictions.\n\tPrepare annual Puerto Rico personal property tax returns and coordinate quarterly payments.\n\tPrepare information required for annual Puerto Rico municipal tax returns.\n\tMaintain accurate supporting documentation for tax filings and regulatory requirements.\n\nTax Payments & Reconciliations\n\n\tProcess and monitor Electronic Funds Transfers (EFTs) for tax payments to state and local taxing authorities.\n\tManage electronic sales tax payments across multiple jurisdictions.\n\tEnsure tax payments are processed accurately and within required deadlines.\n\tReconcile sales tax accounts and investigate discrepancies.\n\tMaintain accurate supporting records for tax balances and payments.\n\tReview purchase journal activity and prepare required entries related to electronic tax payments and tax reporting.\n\nTax Systems & Data Management\n\n\tMaintain sales tax rates, vendor codes, jurisdictional information, and other tax-related system records.\n\tMaintain and administer tax automation and reporting systems, including Vertex or similar tax software.\n\tHelp ensure the accuracy and integrity of tax data across internal systems.\n\tIdentify and assist with resolving tax system or reporting discrepancies.\n\nReporting, Audits & Research\n\n\tSupport month-end, quarter-end, and year-end tax reporting and reconciliation processes.\n\tAssist with tax research, account analysis, and compliance projects.\n\tPrepare documentation and supporting information for tax audits and regulatory inquiries.\n\tMaintain organized tax records to support internal controls and compliance requirements.\n\tResearch tax-related questions and assist with resolving compliance issues.\n\nCross-Functional Support\n\n\tCollaborate with Accounting, Payroll, Finance, and external agencies regarding tax-related matters.\n\tCommunicate professionally with taxing authorities and other external parties.\n\tAssist with special projects and additional tax or accounting responsibilities as needed.\n\nQualifications\n\n\tBachelor's degree in Accounting, Finance, Taxation, or a related field required.\n\tMinimum of 5 years of accounting or tax experience, preferably involving sales tax, corporate tax, and multi-state tax compliance.\n\tStrong knowledge of sales tax and corporate tax reporting, tax compliance, reconciliations, and electronic tax payments.\n\tExperience preparing or supporting federal, state, and local tax filings.\n\tExperience working with tax software and Microsoft Excel.\n\tFamiliarity with Vertex and Thomson Reuters ONESOURCE preferred.\n\tStrong analytical and problem-solving abilities.\n\tExcellent attention to detail and accuracy.\n\tStrong organizational and time-management skills.\n\tAbility to manage multiple tax deadlines and priorities in a fast-paced environment.\n\tStrong written and verbal communication skills.\n\tAbility to collaborate effectively across multiple departments.\n\tHigh level of professionalism and discretion when handling sensitive financial information."}, {"id": "26784", "title": "Senior Activities Companion", "bhTitle": "Companion", "category": "Healthcare & Human Services", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-17", "exp": "2026-12-16", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\n\nPosition Overview\n\nA senior-focused program in Brooklyn is seeking a caring, energetic, and dependable Senior Activities Companion to spend time with older adults and help keep them socially engaged through games, conversation, and recreational activities.\n\nThe ideal candidate is a hard worker who genuinely enjoys spending time with seniors, has a positive attitude, and can create a fun and welcoming environment. Similar senior-companion roles commonly emphasize conversation, hobbies, games, and social engagement.\n\nKey Responsibilities\n\n\tSpend quality time with seniors and provide friendly companionship.\n\tPlay board games, card games, puzzles, and other recreational games.\n\tEngage seniors in conversation and encourage social interaction.\n\tHelp organize and participate in fun, age-appropriate activities.\n\tEncourage seniors to stay mentally and socially active.\n\tAssist with arts and crafts, music, group activities, and other recreational programs.\n\tHelp set up and clean up activities and games.\n\tEncourage participation while respecting each individual's interests and abilities.\n\tMaintain a positive, patient, and respectful environment.\n\tBuild friendly and professional relationships with seniors.\n\tWork cooperatively with staff and assist with activities as needed.\n\tBe reliable and consistently arrive on time for scheduled shifts.\n\nQualifications\n\n\tCaring, patient, friendly, and dependable.\n\tMust enjoy interacting and spending time with seniors.\n\tHard-working with a positive attitude and strong work ethic.\n\tOutgoing and comfortable starting conversations and activities.\n\tAble to engage seniors in games and recreational activities.\n\tStrong communication and interpersonal skills.\n\tResponsible and able to work independently when needed.\n\tPrevious experience working with seniors, recreation programs, senior centers, companionship, or caregiving is preferred but not required."}, {"id": "26783", "title": "Senior Graphic & Package Designer", "bhTitle": "Graphic Design", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-09-17", "exp": "2026-12-16", "desc": "Location: Eatontown, NJ\nEmployment Type: Full-Time\nSchedule: Monday–Friday, 9:00 AM–5:00 PM or 10:00 AM–6:00 PM\n\nPosition Overview\n\nAn accessories wholesaler is seeking an experienced Senior Graphic & Package Designer to lead the visual design and packaging development of its consumer accessory products.\n\nThis is a senior-level, hands-on role responsible for developing retail-ready packaging, new product concepts, brand assets, and marketing materials from initial concept through final production. The designer will work across multiple product lines and collaborate closely with product development, sales, vendors, and overseas manufacturing partners.\n\nThe ideal candidate combines strong creative abilities with deep technical knowledge of packaging production, print, dielines, Adobe Creative Suite, and AI-powered design tools. This individual should be comfortable working independently, developing new ideas, and managing multiple projects simultaneously.\n\nKey Responsibilities\n\nPackaging & Graphic Design\n\n\tDesign compelling, retail-ready packaging from initial concept through final print-ready production.\n\tDevelop dielines, packaging layouts, mockups, and prototypes for new and existing product lines.\n\tCreate packaging concepts that effectively communicate product features, benefits, and brand positioning.\n\tAdapt designs across multiple products, SKUs, sizes, and retail requirements.\n\tCreate catalogs, sell sheets, digital content, presentations, and other marketing materials.\n\tMaintain consistent branding across packaging, products, and promotional materials.\n\nProduct Development & Innovation\n\n\tCollaborate with the product development team to conceptualize and develop new consumer products.\n\tContribute creative ideas for new products, packaging formats, features, and visual direction.\n\tTranslate product concepts into compelling visual presentations and prototypes.\n\tWork with sales and product teams to understand retailer needs and market opportunities.\n\tSupport new-product development from early-stage concept through production.\n\tUse AI tools and emerging design technologies to accelerate ideation, concept development, visualization, and creative workflows.\n\nProduction & Pre-Press\n\n\tPrepare accurate print-ready production files for printers and manufacturers.\n\tReview dielines, proofs, artwork, and color specifications before production.\n\tApply strong knowledge of pre-press requirements, color management, typography, image preparation, and print production.\n\tReview production samples and proofs for quality and accuracy.\n\tIdentify and resolve artwork or production issues before manufacturing.\n\tCommunicate directly with printers, vendors, and overseas manufacturing partners.\n\nProject Management & Collaboration\n\n\tWork closely with product development, sales, and manufacturing teams.\n\tManage multiple design and product-development projects simultaneously.\n\tMaintain organized artwork, design files, production assets, and version control.\n\tEnsure projects remain on schedule and meet production deadlines.\n\tIncorporate feedback from internal teams, retailers, vendors, and manufacturing partners.\n\tIndependently manage projects from initial creative direction through final execution.\n\nQualifications\n\n\tSeveral years of professional graphic design experience, with significant experience in consumer product packaging.\n\tStrong portfolio demonstrating high-quality retail packaging and consumer product design.\n\tExpert-level proficiency in Adobe Illustrator, Photoshop, and InDesign.\n\tStrong experience using AI tools within the creative and design process is highly important.\n\tStrong understanding of dielines, print production, color management, and pre-press requirements.\n\tExperience preparing production-ready artwork for commercial printing and manufacturing.\n\tStrong typography, layout, branding, and visual-design abilities.\n\tExperience contributing to new product development and product conceptualization preferred.\n\tExperience designing for mass-market or big-box retail environments preferred.\n\tAbility to manage multiple projects and meet demanding production deadlines.\n\tStrong attention to detail and organizational skills.\n\tAbility to work independently while collaborating effectively with multiple departments and external partners."}, {"id": "26782", "title": "Social Media Engagement Assistant – Part-Time", "bhTitle": "Social Media Engagement Assistant – Part-Time", "category": "E-commerce, Marketing & Social Media", "type": "Remote / Hybrid", "typeNote": "Remote/Hybrid/PT", "state": "Not listed", "added": "2026-09-17", "exp": "2026-12-17", "desc": "Location: Remote\nSchedule: 5 hours/week, flexible\n\nLove Instagram and naturally find yourself liking, commenting, and interacting with people online? A growing events company is looking for a fun, social, and creative person to help build its Instagram presence and get more people engaging with the brand.\n\nYou'll spend about 5 hours a week engaging with relevant accounts, leaving thoughtful comments, interacting with followers and potential customers, and helping create buzz around upcoming events and activities.\n\nThe best part? Work whenever it fits your schedule! We're looking for someone who is naturally outgoing online, knows Instagram, is proactive, and can bring their own ideas and personality to the role."}, {"id": "26781", "title": "Event Assistant – Part-Time / Flexible", "bhTitle": "Event Assistant", "category": "Administrative & Office", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-17", "exp": "2026-12-04", "desc": "Location: NYC/Brooklyn\nSchedule: Flexible; varies by event\n\nLove being around people and having fun? A growing events company is looking for fun, outgoing, and reliable Event Assistants to join its team and help bring events to life! You'll help with setup, booths, guest interaction, and fun activities like bracelet making, sweatpant customization, and more.\n\nThe schedule is super flexible—some weeks may have multiple events and other weeks may have none. Events are shared in a group chat, so you can let the team know when you're available. It's a great way to make extra money while doing something social and fun!\n\nLooking for someone who is energetic, personable, dependable, and takes initiative. If you're interested in marketing, there may also be opportunities to help with social media and other marketing projects."}, {"id": "26780", "title": "Babysitter/Nanny", "bhTitle": "Babysitter/Nanny", "category": "Education & Childcare", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-09-17", "exp": "2026-12-17", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\nSchedule: 8:00 AM–4:00 PM\n\nPosition Overview\n\nA family in the Boro Park/Flatbush area of Brooklyn is seeking a reliable, caring, and responsible Nanny to provide attentive care for an 8-month-old baby through June.\n\nThe primary schedule is Monday, Tuesday, and Thursday from 8:00 AM–4:00 PM. There is also an opportunity for a five-day schedule for a nanny who is comfortable caring for two babies. Under the five-day arrangement, three days would involve caring for two babies, while two days would involve caring for one baby.\n\nSchedule Options\n\nPart-Time Option:\n\n\tMonday, Tuesday & Thursday\n\t8:00 AM–4:00 PM\n\tCare for one 8-month-old baby\n\nFive-Day Option:\n\n\tMonday–Friday\n\t8:00 AM–4:00 PM\n\tThree days caring for two babies\n\tTwo days caring for one baby\n\nKey Responsibilities\n\n\tProvide attentive and nurturing care for the baby throughout the day.\n\tHandle feeding, bottles, diaper changes, and nap routines.\n\tEngage the baby in age-appropriate play and developmental activities.\n\tMaintain a safe, clean, and comfortable environment.\n\tFollow established feeding and sleeping schedules.\n\tAssist with basic baby-related cleanup and organization.\n\tProvide regular updates to parents regarding feeding, naps, activities, and the baby's day.\n\tComfort and respond appropriately to the baby's needs.\n\tFor the five-day position, safely and attentively manage the care of two babies on designated days.\n\nQualifications\n\n\tPrevious infant-care or nanny experience strongly preferred.\n\tComfortable caring for an 8-month-old baby.\n\tComfortable caring for two babies simultaneously if interested in the five-day schedule.\n\tReliable, punctual, patient, and caring.\n\tStrong understanding of infant safety and daily routines.\n\tGood communication skills.\n\tAbility to follow parents' instructions and established routines.\n\tReferences from previous families or childcare positions preferred."}, {"id": "26779", "title": "Business Manager – Beauty & Skincare", "bhTitle": "Manager", "category": "Sales & Live Selling", "type": "Remote / Hybrid", "typeNote": "Remote/Hybrid/FT", "state": "NY", "added": "2026-09-16", "exp": "2026-12-16", "desc": "Location: Remote\nEmployment Type: Full-Time\n\nPosition Overview\n\nA growing beauty and skincare brand is s
