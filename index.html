platforms.\n\n\t \tOversee email and SMS marketing campaigns, including scheduling and coordination.\n\n\t \tDevelop creative marketing strategies to increase brand awareness and user engagement.\n\n\t \tGenerate ideas for community events and other growth initiatives.\n\n\t \tCoordinate and execute marketing campaigns, events, and community outreach efforts.\n\n\t \tIdentify new opportunities to grow the platform and strengthen community engagement.\n\n  Specific Qualifications and/or Requirements:\n\n\t \tPrevious experience in marketing, social media management, or digital marketing.\n\n\t \tStrong writing, communication, and organizational skills.\n\n\t \tExperience managing social media platforms and email/SMS campaigns.\n\n\t \tCreative mindset with the ability to develop and execute new ideas.\n\n\t \tSelf-motivated, organized, and able to work independently.\n\n\t \tExperience with event planning or community engagement is a plus.\n\n  Additional Information: This is a flexible, part-time opportunity for someone creative and proactive who enjoys marketing, social media, and finding new ways to engage and grow a community."}, {"id": "27023", "title": "Property Manager", "bhTitle": "Property Manager", "category": "Real Estate & Property", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-16", "exp": "2027-02-10", "desc": "Position Overview\n\n  Well-established Brooklyn property management company is seeking a personable, organized, and computer-literate individual to serve as a Tenant Relations Coordinator.\n\n  The ideal candidate is professional, service-oriented, detail-oriented, and comfortable communicating with tenants, building staff, vendors, and management.\n\n  Responsibilities\n\n\t \tServe as a primary point of contact for tenants and respond to questions and concerns.\n\n\t \tHandle incoming phone calls, emails, and tenant requests.\n\n\t \tCoordinate maintenance requests and follow up to ensure issues are addressed.\n\n\t \tCommunicate with superintendents, maintenance personnel, and outside vendors.\n\n\t \tMaintain accurate tenant records, files, and correspondence.\n\n\t \tAssist with lease documentation, renewals, notices, and general administrative tasks.\n\n\t \tUpdate property management software and maintain spreadsheets.\n\n\t \tHelp resolve tenant concerns professionally and efficiently.\n\n\t \tProvide general administrative support to the property management team.\n\n  Qualifications\n\n\t \tExcellent communication and interpersonal skills.\n\n\t \tStrong computer skills, including Microsoft Word, Excel, and Outlook.\n\n\t \tOrganized, responsible, and able to multitask.\n\n\t \tProfessional telephone and email etiquette.\n\n\t \tAbility to work independently and as part of a team.\n\n\t \tPrevious office administration, customer service, or property management experience preferred, but not necessarily required.\n\n  Schedule: Full-Time, Monday–Friday\n\n  Location: Brooklyn, NY"}, {"id": "27022", "title": "Operations Administrator", "bhTitle": "Operations Manager", "category": "Administrative & Office", "type": "Remote / Hybrid", "typeNote": "Remote/Hybrid/PT", "state": "NY", "added": "2026-11-13", "exp": "2027-02-15", "desc": "Location: Remote (Work from Anywhere)\n Employment Type: Part-Time\n Schedule: Flexible, 15–20 Hours per Week (Set Your Own Hours)\n Industry: Nonprofit\n\n  Job Description\n\n  A growing nonprofit organization impacting thousands of individuals is seeking a highly organized, detail-oriented, and tech-savvy Operations Administrator to support its daily operations.\n\n  The ideal candidate will have excellent technology skills, strong problem-solving abilities, and experience troubleshooting software-related issues. This position also involves basic bookkeeping, image editing, customer service, and applying halachic reasoning to relevant organizational matters.\n\n  This is an excellent opportunity for someone seeking a fully remote, flexible part-time position with the ability to set their own hours while contributing to a meaningful nonprofit mission.\n\n  The organization is seeking a dependable, resourceful, and independent professional who can efficiently manage a variety of administrative and technical responsibilities.\n\n  Key Responsibilities\n\n  Administrative & Operations Support\n\n\t \tAssist with daily administrative and operational responsibilities.\n\n\t \tMaintain organized records, documents, and internal systems.\n\n\t \tCoordinate administrative tasks to ensure smooth organizational operations.\n\n\t \tManage multiple projects and responsibilities independently.\n\n\t \tIdentify opportunities to improve administrative processes and workflows.\n\n\t \tSupport organizational leadership with general operational needs.\n\n  Technology & Software Troubleshooting\n\n\t \tTroubleshoot software issues and resolve common technical problems.\n\n\t \tAssist with maintaining and organizing digital platforms and systems.\n\n\t \tIdentify technical challenges and implement practical solutions.\n\n\t \tSupport staff and users with software-related questions.\n\n\t \tHelp improve efficiency through effective use of technology.\n\n\t \tMaintain accurate digital records and ensure systems function smoothly.\n\n  Bookkeeping & Financial Administration\n\n\t \tAssist with basic bookkeeping and financial recordkeeping.\n\n\t \tOrganize financial transactions, receipts, and related documentation.\n\n\t \tHelp maintain accurate financial records.\n\n\t \tSupport general accounting and administrative tasks as needed.\n\n  Customer Service & Communications\n\n\t \tRespond to inquiries professionally and efficiently.\n\n\t \tProvide helpful customer service and administrative assistance.\n\n\t \tCommunicate clearly with staff, supporters, and other individuals interacting with the organization.\n\n\t \tResolve questions and concerns in a timely manner.\n\n\t \tMaintain a friendly, professional, and service-oriented approach.\n\n  Image Editing & Organizational Support\n\n\t \tPerform basic image editing and formatting for organizational materials.\n\n\t \tAssist with preparing and updating digital content.\n\n\t \tApply appropriate halachic reasoning when addressing relevant organizational questions.\n\n\t \tCoordinate with organizational leadership on matters requiring additional guidance.\n\n\t \tSupport special projects and other operational responsibilities as needed.\n\n  Qualifications\n\n\t \tStrong technology skills and experience troubleshooting software issues required.\n\n\t \tExcellent organizational skills and attention to detail.\n\n\t \tBasic bookkeeping and financial recordkeeping knowledge.\n\n\t \tAbility to perform basic image editing.\n\n\t \tStrong customer service and communication skills.\n\n\t \tUnderstanding of halachic principles and ability to apply halachic reasoning required.\n\n\t \tComfortable working independently in a fully remote environment.\n\n\t \tStrong problem-solving and analytical abilities.\n\n\t \tAbility to manage multiple responsibilities and prioritize tasks effectively.\n\n\t \tReliable, self-motivated, and detail-oriented.\n\n\t \tComfortable learning new software and digital tools.\n\n\t \tAbility to maintain confidentiality when handling sensitive information.\n\n\t \tStrong time-management skills and ability to meet deadlines."}, {"id": "27021", "title": "Accountant / Bookkeeper", "bhTitle": "Bookkeeper", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-13", "exp": "2027-02-15", "desc": "Location: Brooklyn, NY\n Employment Type: Full-Time\n Schedule: Standard Business Hours\n\n  Job Description\n\n  An established company is seeking a highly organized, detail-oriented, and experienced Accountant / Bookkeeper to join its team.\n\n  The ideal candidate must be proficient in QuickBooks and comfortable working in a fast-paced, high-pressure environment. This position requires strong accounting knowledge, excellent organizational skills, and the ability to manage multiple financial responsibilities efficiently.\n\n  The company is looking for a dependable professional who can maintain accurate financial records, meet deadlines, and work independently.\n\n  Key Responsibilities\n\n\t \tMaintain accurate and organized financial records using QuickBooks.\n\n\t \tManage daily bookkeeping and accounting transactions.\n\n\t \tProcess accounts payable and accounts receivable.\n\n\t \tReconcile bank accounts, credit card statements, and financial records.\n\n\t \tPrepare and maintain financial reports and statements.\n\n\t \tRecord invoices, payments, deposits, and expenses.\n\n\t \tMonitor outstanding balances and follow up on discrepancies.\n\n\t \tAssist with month-end and year-end accounting procedures.\n\n\t \tEnsure financial records are accurate and up to date.\n\n\t \tIdentify and resolve accounting discrepancies.\n\n\t \tManage multiple accounting responsibilities while meeting strict deadlines.\n\n\t \tAssist with general accounting and administrative tasks as needed.\n\n  Qualifications\n\n\t \tProficiency in QuickBooks required.\n\n\t \tPrevious accounting or bookkeeping experience required.\n\n\t \tStrong understanding of basic accounting principles and financial recordkeeping.\n\n\t \tExperience with accounts payable, accounts receivable, and bank reconciliations.\n\n\t \tExcellent organizational and time-management skills.\n\n\t \tStrong attention to detail and accuracy.\n\n\t \tAbility to work efficiently in a fast-paced, demanding work environment.\n\n\t \tComfortable managing multiple tasks and meeting deadlines.\n\n\t \tStrong problem-solving and analytical skills.\n\n\t \tProficiency in Microsoft Excel and general computer applications.\n\n\t \tAbility to work independently and take ownership of responsibilities.\n\n\t \tReliable, professional, and dependable."}, {"id": "27018", "title": "Registered Dietitian (RD/RDN)", "bhTitle": "Other", "category": "Other", "type": "Remote / Hybrid", "typeNote": "Remote/Hybrid/PT", "state": "NJ", "added": "2026-11-12", "exp": "2027-02-15", "desc": "Location: Remote / Telehealth (Potential Hybrid Opportunities in Eatontown, NJ)\n Employment Type: Part-Time\n Schedule: Flexible, Based on Practice Needs\n\n  Job Description\n\n  A growing private nutrition practice is seeking a compassionate, motivated, and experienced Registered Dietitian (RD/RDN) to provide maternity leave coverage, with the potential to transition into a permanent part-time position.\n\n  The practice specializes in eating disorders, disordered eating, body image concerns, and weight-inclusive nutrition counseling.\n\n  The ideal candidate is passionate about helping individuals develop healthier relationships with food and their bodies through compassionate, individualized, and evidence-informed nutrition care.\n\n  This position offers the opportunity to work primarily remotely through telehealth, with potential hybrid opportunities in Eatontown, NJ.\n\n  The practice follows the principles of Health at Every Size (HAES®), Intuitive Eating, and a non-diet, weight-inclusive approach to nutrition counseling.\n\n  Key Responsibilities\n\n  Nutrition Counseling & Client Care\n\n\t \tProvide individualized outpatient nutrition counseling to clients experiencing eating disorders, disordered eating, and body image concerns.\n\n\t \tConduct comprehensive nutrition assessments and develop personalized nutrition care plans.\n\n\t \tSupport clients in building balanced and sustainable eating habits.\n\n\t \tProvide meal planning guidance and nutritional education tailored to individual needs.\n\n\t \tHelp clients improve their relationships with food and body image.\n\n\t \tIncorporate weight-inclusive, non-diet approaches into nutrition counseling.\n\n\t \tApply HAES® principles and Intuitive Eating concepts when appropriate.\n\n\t \tMonitor client progress and adjust nutrition recommendations as needed.\n\n\t \tProvide compassionate, supportive, and evidence-informed care.\n\n  Telehealth & Documentation\n\n\t \tConduct outpatient nutrition counseling sessions through telehealth platforms.\n\n\t \tMaintain accurate and timely client documentation.\n\n\t \tDevelop and update individualized nutrition treatment plans.\n\n\t \tTrack client progress and maintain organized records.\n\n\t \tEnsure client confidentiality and follow applicable healthcare privacy requirements.\n\n\t \tManage appointments and client-related responsibilities independently.\n\n  Collaboration & Treatment Coordination\n\n\t \tCollaborate with therapists, physicians, and other healthcare professionals involved in client care.\n\n\t \tCommunicate with interdisciplinary treatment teams regarding nutrition-related goals and progress.\n\n\t \tParticipate in collaborative treatment planning when appropriate.\n\n\t \tProvide nutrition-related insights and recommendations to support comprehensive client care.\n\n\t \tMaintain professional communication with clients and other providers.\n\n  Qualifications\n\n\t \tRegistered Dietitian (RD/RDN) credential required.\n\n\t \tMust hold or be willing to obtain appropriate state licensure in New York, Connecticut, Pennsylvania, Illinois, and/or Florida, as applicable to client care.\n\n\t \tExperience or a strong interest in eating disorders and disordered eating.\n\n\t \tCommitment to a weight-inclusive, non-diet approach to nutrition counseling.\n\n\t \tFamiliarity with Health at Every Size (HAES®) principles and Intuitive Eating.\n\n\t \tComfortable providing outpatient nutrition counseling through telehealth.\n\n\t \tStrong communication, interpersonal, and counseling skills.\n\n\t \tCompassionate, patient, and nonjudgmental approach to client care.\n\n\t \tExcellent organizational and time-management skills.\n\n\t \tAbility to maintain accurate clinical documentation.\n\n\t \tComfortable working independently in a remote environment.\n\n\t \tStrong commitment to evidence-informed nutrition care.\n\n\t \tWillingness to collaborate with interdisciplinary healthcare teams."}, {"id": "27017", "title": "Shul Operations Manager", "bhTitle": "Building Maintenance", "category": "Other", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-11-11", "exp": "2027-02-11", "desc": "Location: New Jersey\n Employment Type: Full-Time\n Schedule: Monday–Friday, 8:00 AM–5:00 PM\n\n Job Description\n A Shul in New Jersey is seeking a hands-on, responsible, and organized Shul Operations Manager to oversee the day-to-day operations and upkeep of the building.\n This role is ideal for someone who is proactive, resourceful, and comfortable being physically present and involved in the daily operations of the Shul. Responsibilities include supervising maintenance staff, identifying and addressing building issues, coordinating repairs, ensuring the facility is properly maintained and stocked for Shabbos and weekends, and assisting with grant and insurance-related matters.\n The ideal candidate is a strong problem-solver who takes initiative, follows through on responsibilities, and makes sure the building and its operations run smoothly.\n Key Responsibilities\n Building Operations & Maintenance\n\n\tOversee the day-to-day upkeep and operations of the Shul building.\n\tSupervise and coordinate maintenance and cleaning staff.\n\tRegularly inspect the building, identify maintenance issues, and arrange for repairs.\n\tTake initiative in finding and resolving building-related problems.\n\tCoordinate with outside contractors, vendors, and service providers as needed.\n\tEnsure the building is clean, organized, safe, and properly maintained.\n\n Shabbos & Weekend Preparation\n\tEnsure the Shul is properly stocked and prepared for Shabbos and the weekend.\n\tCheck that necessary supplies and materials are available and replenished.\n\tCoordinate with staff to ensure the building is ready for scheduled services and activities.\n\n Administrative & Organizational Responsibilities\n\tAssist with grant-related paperwork, documentation, and follow-up.\n\tHelp coordinate insurance matters, records, and communication with providers.\n\tKeep track of building-related needs, schedules, and outstanding projects.\n\tCommunicate with Shul leadership regarding operational needs and concerns.\n\n Qualifications\n\tPrevious experience in building operations, facilities management, maintenance supervision, or general operations preferred.\n\tHands-on, practical approach to problem-solving.\n\tAbility to supervise staff and coordinate vendors and contractors.\n\tStrong organizational and follow-through skills.\n\tProactive and able to identify problems and take steps to resolve them.\n\tComfortable handling basic administrative tasks, including grant and insurance coordination.\n\tReliable, responsible, and able to work independently.\n\tStrong communication skills and attention to detail.\n\n\t \tNote: Bookkeeping and accounting experience are not required."}, {"id": "27016", "title": "Intake Coordinator", "bhTitle": "Intake", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-11", "exp": "2027-02-11", "desc": "Location: Brooklyn, NY\n Employment Type: Full-Time, On-Site\n Schedule: Monday–Friday\n\n  Job Description\n\n  A growing organization in Brooklyn, NY, is seeking a friendly, motivated, and detail-oriented Intake Coordinator to join its team.\n\n  The ideal candidate will be responsible for communicating with clients, assisting with intake paperwork, preparing documentation, and ensuring a smooth and positive client experience.\n\n  This position is ideal for someone who enjoys working with people, has strong organizational skills, and thrives in a collaborative office environment.\n\n  The company offers a welcoming and supportive workplace with opportunities for professional growth and advancement.\n\n  Key Responsibilities\n\n\t \tCommunicate with clients daily to assist with intake procedures and general inquiries.\n\n\t \tGuide clients through the completion of necessary forms and documentation.\n\n\t \tPrepare, review, and submit paperwork accurately and efficiently.\n\n\t \tEnsure all client information is properly recorded and organized.\n\n\t \tMaintain accurate and up-to-date client records.\n\n\t \tFollow up with clients regarding missing information or outstanding documentation.\n\n\t \tBuild and maintain positive, professional relationships with clients.\n\n\t \tCoordinate with internal team members to ensure smooth intake operations.\n\n\t \tRespond to client questions and provide helpful, professional assistance.\n\n\t \tMaintain confidentiality when handling sensitive client information.\n\n\t \tAssist with general administrative and office responsibilities as needed.\n\n  Qualifications\n\n\t \tExcellent verbal and written communication skills required.\n\n\t \tStrong organizational skills and attention to detail.\n\n\t \tFriendly, professional, and welcoming personality.\n\n\t \tAbility to communicate effectively with clients and coworkers.\n\n\t \tStrong customer service and interpersonal skills.\n\n\t \tAbility to manage multiple responsibilities and meet deadlines.\n\n\t \tComfortable working with forms, paperwork, and client documentation.\n\n\t \tBasic computer and data entry skills.\n\n\t \tReliable, responsible, and dependable.\n\n\t \tAbility to work independently and collaboratively.\n\n\t \tPositive attitude and willingness to learn.\n\n\t \tPrevious experience in intake coordination, customer service, or administration is a plus."}, {"id": "27015", "title": "Product Developer", "bhTitle": "Product Development", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-11", "exp": "2027-02-11", "desc": "Location: New York\n Employment Type: Full-Time\n Schedule: Monday–Friday\n Industry: Home Décor / Consumer Products / Retail\n\n  Job Description\n\n  An established home décor and consumer products company is seeking a highly motivated, creative, and results-driven Product Developer / Merchant to join its growing Product Development team.\n\n  The ideal candidate has a strong understanding of retail trends, product development, overseas manufacturing, sourcing, and merchandising, with the ability to move products quickly from initial concept to retail shelves.\n\n  This position focuses on developing trend-forward home décor, soft goods, and apparel collections for major U.S. value retailers.\n\n  The company is seeking someone who thrives in a fast-paced environment, can identify emerging trends, communicate directly with overseas factories, and develop attractive, cost-effective products that appeal to retail buyers.\n\n  Key Responsibilities\n\n  Product Development & Trend Research\n\n\t \tIdentify emerging trends in home décor, soft goods, apparel, and consumer products.\n\n\t \tDevelop innovative, trend-driven product collections for major U.S. retailers.\n\n\t \tManage the product development process from initial concept through production.\n\n\t \tResearch market trends, competitor products, pricing, and consumer preferences.\n\n\t \tCollaborate with design and merchandising teams to develop commercially appealing collections.\n\n\t \tEnsure products meet quality, design, pricing, and retailer expectations.\n\n\t \tIdentify opportunities to expand into new product categories.\n\n  Overseas Vendor & Factory Coordination\n\n\t \tCommunicate directly with overseas factories and manufacturing partners.\n\n\t \tCoordinate product development timelines, sample requests, revisions, and approvals.\n\n\t \tManage communication across international time zones to ensure projects remain on schedule.\n\n\t \tNegotiate product costs and work with vendors to achieve competitive pricing.\n\n\t \tMonitor sample development and resolve production-related challenges.\n\n\t \tMaintain strong relationships with suppliers and manufacturing partners.\n\n\t \tEnsure timely execution of product development projects.\n\n  Cost Engineering & Product Strategy\n\n\t \tDevelop high-perceived-value products while maintaining competitive costs.\n\n\t \tAnalyze product pricing, materials, and manufacturing expenses.\n\n\t \tIdentify cost-saving opportunities without compromising product quality or appearance.\n\n\t \tWork with factories to optimize materials, construction, and packaging.\n\n\t \tEnsure collections align with the pricing requirements of major value retailers.\n\n\t \tBalance product design, quality, and profitability throughout the development process.\n\n  Merchandising & Showroom Management\n\n\t \tAssist with merchandising and presenting product collections in the showroom.\n\n\t \tOrganize and display samples, fabrics, and finished products.\n\n\t \tPrepare collections for retail buyer presentations and line reviews.\n\n\t \tEnsure showroom displays reflect current trends and product development priorities.\n\n\t \tCollaborate with sales teams to present commercially appealing assortments.\n\n\t \tMaintain organized product samples and development materials.\n\n  Project Management & Cross-Functional Collaboration\n\n\t \tManage multiple product development projects simultaneously.\n\n\t \tTrack product samples, approvals, production timelines, and deadlines.\n\n\t \tCoordinate with Sales, Design, Sourcing, and Production departments.\n\n\t \tEnsure products move efficiently from concept to finished collections.\n\n\t \tIdentify potential delays and proactively implement solutions.\n\n\t \tSupport rapid product launches and seasonal collection development.\n\n  Qualifications\n\n\t \tPrevious experience in product development, merchandising, sourcing, or related consumer product roles preferred.\n\n\t \tStrong understanding of home décor, soft goods, apparel, or related retail product categories.\n\n\t \tExperience communicating with overseas factories and vendors.\n\n\t \tKnowledge of product costing, pricing strategies, and manufacturing processes.\n\n\t \tAbility to identify trends and translate them into commercially successful products.\n\n\t \tStrong organizational and project management skills.\n\n\t \tExcellent communication, negotiation, and problem-solving abilities.\n\n\t \tAbility to manage multiple projects and meet tight deadlines.\n\n\t \tComfortable working in a fast-paced, deadline-driven environment.\n\n\t \tStrong attention to detail and understanding of retail buyer expectations.\n\n\t \tAbility to work independently and collaborate with internal teams."}, {"id": "27013", "title": "Assistant", "bhTitle": "Assistant", "category": "Administrative & Office", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-11-11", "exp": "2027-02-11", "desc": "Seeking someone part time, one to two days a week from 9-2.\n\n Scanning Inventory in pharmacies. Scanning barcodes and listing out their inventory.\n\n Will be driven from Brooklyn to Queens from 9-2 once or Twice a week. Either Tuesdays or Thursdays or both."}, {"id": "27011", "title": "Retail Sales Associate – Jewelry Company", "bhTitle": "Retail Sales", "category": "Sales & Live Selling", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-11-10", "exp": "2027-02-02", "desc": "Location: Brooklyn, NY\n Schedule: PT, Flexible\n\n  A growing jewelry company in the heart of Brooklyn is looking for a friendly, outgoing, and bubbly Retail Sales Associate to join its team! This is a great opportunity for someone who loves working with people, has a passion for jewelry and fashion, and enjoys creating a fun shopping experience.\n\n  Responsibilities:\n\n\t \tAssist customers and provide personalized service.\n\n\t \tHelp customers select jewelry and make purchasing decisions.\n\n\t \tMaintain an organized and inviting store.\n\n\t \tSupport daily retail operations and build customer relationships.\n\n  Ideal Candidate:\n\n\t \tFun, bubbly, and personable personality.\n\n\t \tStrong communication and customer service skills.\n\n\t \tSales-driven, motivated, and reliable.\n\n\t \tRetail or sales experience preferred.\n\n  Opportunity: Flexible PT schedule, great work environment, and potential to earn commission based on performance for a strong salesperson."}, {"id": "27010", "title": "Marketing Manager – Jewelry Company", "bhTitle": "Marketing", "category": "E-commerce, Marketing & Social Media", "type": "Remote / Hybrid", "typeNote": "Remote/Hybrid/PT", "state": "NY", "added": "2026-11-10", "exp": "2027-02-04", "desc": "Location: Brooklyn, NY\n Schedule: PT, Flexible\n\n  A growing jewelry company in the heart of Brooklyn is looking for a fun, bubbly, and creative Marketing Manager to help build the brand from the ground up! This is a unique opportunity to work closely with the owner, create fun and engaging social media content and Reels, and bring fresh ideas to the company's marketing. The role offers plenty of flexibility, creative freedom, and the opportunity to grow with the company long-term.\n\n  Responsibilities:\n\n\t \tCreate fun, engaging social media content and Reels alongside the owner.\n\n\t \tHelp develop the company's brand and marketing strategy.\n\n\t \tManage social media and explore creative marketing ideas.\n\n\t \tBuild brand awareness and grow the company's online presence.\n\n  Ideal Candidate:\n\n\t \tOutgoing, bubbly, creative, and full of ideas.\n\n\t \tComfortable on camera and making Reels.\n\n\t \tFamiliar with social media and digital marketing.\n\n\t \tSelf-motivated and excited to help build a brand.\n\n  Opportunity: Great work environment, flexible schedule, creative freedom, and long-term growth potential."}, {"id": "27008", "title": "Recreational Therapist Aide / Recreation Aide", "bhTitle": "Companion", "category": "Healthcare & Human Services", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-11-10", "exp": "2027-02-10", "desc": "Location: Brooklyn, NY\n Employment Type: Part-Time\n Industry: Healthcare / Pediatric Care\n\n  Job Description\n\n  A healthcare facility in Brooklyn, NY, is seeking a caring, energetic, and dependable Recreational Therapist Aide to assist with organizing and leading recreational activities for children.\n\n  The ideal candidate is patient, compassionate, and enthusiastic about working with children in a supportive healthcare environment.\n\n  This position involves helping children participate in age-appropriate games, crafts, and recreational activities while promoting social interaction, inclusion, and overall well-being.\n\n  This is an excellent opportunity for someone who enjoys working with children and wants to make a positive difference in their daily lives.\n\n  Key Responsibilities\n\n\t \tAssist with planning and leading age-appropriate recreational activities, games, and crafts.\n\n\t \tEncourage children to participate in activities and interact positively with others.\n\n\t \tHelp create a welcoming, inclusive, and engaging environment.\n\n\t \tProvide assistance and supervision during recreational activities.\n\n\t \tSupport children's safety, comfort, and well-being.\n\n\t \tPrepare activity areas and organize necessary supplies and materials.\n\n\t \tSet up and clean up recreational spaces before and after activities.\n\n\t \tAssist children who may need additional support participating in activities.\n\n\t \tCommunicate respectfully and professionally with children, families, and staff.\n\n\t \tWork collaboratively with recreational therapy staff and other team members.\n\n\t \tFollow facility safety, privacy, and infection-control procedures.\n\n\t \tPerform additional recreational support duties as needed.\n\n  Qualifications\n\n\t \tPatient, caring, responsible, and dependable personality required.\n\n\t \tGenuine interest in working with children.\n\n\t \tStrong communication and interpersonal skills.\n\n\t \tAbility to work effectively with children, families, and healthcare staff.\n\n\t \tEnergetic, friendly, and enthusiastic about recreational activities.\n\n\t \tAbility to organize and prepare activity spaces and materials.\n\n\t \tStrong teamwork and organizational skills.\n\n\t \tAbility to follow instructions and facility procedures.\n\n\t \tPrevious experience in childcare, recreation, or pediatric care is a plus.\n\n\t \tWillingness to complete any required background checks or certifications, if applicable."}, {"id": "27007", "title": "NOW HIRING – LIVE SELLING STREAMERS!", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-11-10", "exp": "2027-02-11", "desc": "An excellent wholesale company is looking for energetic, engaging, and enthusiastic Live Selling Hosts to showcase and sell a variety of exciting products, including cookware, beauty products, gifts, accessories, and much more!\n\n  Flexible Hours – Perfect Side Hustle!\n\n\t \tWeeknights: Monday–Friday, 5:00 PM–10:00 PM\n\n\t \tWeekends: Daytime shifts available\n\n\t \tLocation: Midtown Manhattan\n\n  Who They're Looking For:\n\n\t \tExperience with live selling, streaming, or on-camera presentations preferred.\n\n\t \tOutgoing, energetic, and engaging personality.\n\n\t \tComfortable speaking to an audience and showcasing products.\n\n\t \tCreative, enthusiastic, and able to keep viewers interested.\n\n  An exciting opportunity to earn great money while having fun!"}, {"id": "27006", "title": "HELP WANTED – PART-TIME OFFICE ASSISTANT", "bhTitle": "Assistant", "category": "Administrative & Office", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-11-10", "exp": "2027-01-20", "desc": "Brooklyn, NY\n\n  We are seeking a responsible, organized, and dependable Part-Time Office Assistant to join our team in Brooklyn.\n\n  Preferred Schedule:\n\n\t3 days per week\n\t9:00 AM – 5:00 PM\n\tSome flexibility with schedule and hours for the right candidate.\n\n  Responsibilities Include:\n\n\tLight bookkeeping\n\tProcessing invoices\n\tPreparing and managing purchase orders\n\tCommunicating regularly with retail stores\n\tGeneral office administration and organizational support\n\n  Qualifications:\n\n\tMust be responsible, dependable, and detail-oriented.\n\tStrong communication and computer skills.\n\tAble to work independently and as part of a team.\n\tMature, professional attitude.\n\tExcellent organizational and follow-through skills."}, {"id": "27005", "title": "Seeking full-time assistant in Brooklyn", "bhTitle": "Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-10", "exp": "2027-01-20", "desc": "4 1/2 days a week\n Good eye for fashion and positive energy\n Self-motivated\n Able to optimize Claude\n Must have strong computer skills including navigating Apparel Magic\n Customer Service\n Invoicing\n Purchase orders"}, {"id": "27004", "title": "Pharmacist", "bhTitle": "Other", "category": "Other", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-11-10", "exp": "2027-02-01", "desc": "Employment Type: Part-Time\n Schedule: Thursdays (10-6), Fridays (10-2), and Sundays (10-4)\n\n  A Brooklyn pharmacy is looking for a licensed Pharmacist to join its team. The position requires availability on Wednesdays, Thursdays, Fridays, and Sundays.\n\n Responsibilities\n\tReview and accurately fill prescriptions in accordance with state and federal regulations.\n\tVerify medication orders, dosages, and potential drug interactions.\n\tCounsel patients on proper medication use, dosage, and possible side effects.\n\tAnswer medication-related questions and provide guidance to patients.\n\tCommunicate with physicians and other healthcare providers when needed.\n\tOversee prescription processing and ensure pharmacy operations meet safety and compliance standards.\n\tMaintain accurate patient records and medication documentation.\n\n Qualifications\n\tActive New York State Pharmacist license required.\n\tStrong attention to detail and organizational skills.\n\tGood communication and customer service skills.\n\tReliable and professional."}, {"id": "27003", "title": "Pharmacy Front-End Customer Service Representative", "bhTitle": "Customer Service", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-10", "exp": "2027-01-25", "desc": "Employment Type: Full-Time, Sunday to Friday\n\n  A Brooklyn pharmacy is looking for a bright, friendly, and energetic individual to join its team as a Front-End Customer Service Representative. The ideal candidate enjoys working with people, has a positive attitude, and is comfortable assisting customers. Training will be provided.\n\n Responsibilities\n\tGreet and assist customers.\n\tProvide friendly and helpful customer service.\n\tAnswer customer questions and direct them as needed.\n\tAssist with front-end store operations.\n\tHelp maintain an organized and welcoming store environment.\n\n Qualifications\n\tFriendly, outgoing, and energetic personality.\n\tStrong communication and customer service skills.\n\tReliable and motivated.\n\tRussian, Spanish, or other multilingual abilities are a major plus.\n\tPrevious experience is helpful but not required; willing to train."}, {"id": "27002", "title": "Fashion Designer – Men's & Women's Apparel", "bhTitle": "Designer", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-10", "exp": "2027-02-02", "desc": "Location: NYC\n Schedule: Monday–Friday, 9:00 AM–6:00 PM\n\n  An NYC-based men's and women's apparel company is seeking an experienced Fashion Designer to develop and design seasonal collections. The ideal candidate will have at least 5 years of apparel design experience, a strong understanding of fashion trends, and the ability to bring concepts from initial sketches through final production.\n\n  Responsibilities & Requirements:\n\n\t \tDesign and develop men's and women's apparel collections.\n\n\t \tCreate sketches, technical drawings, and tech packs.\n\n\t \tSelect fabrics, colors, trims, and materials.\n\n\t \tWork closely with production teams and factories on samples and revisions.\n\n\t \tReview samples and make necessary design adjustments.\n\n\t \tStay up to date on fashion trends and market direction.\n\n\t \tMinimum 5 years of apparel design experience required."}, {"id": "27001", "title": "Production Coordinator – Men's & Women's Apparel", "bhTitle": "Production Manager", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-10", "exp": "2027-02-04", "desc": "Location: NYC\n Schedule: Monday–Friday, 9:00 AM–6:00 PM\n\n  An NYC-based men's and women's apparel company is seeking an experienced Production Coordinator to oversee production processes and communicate directly with factories. The ideal candidate will have at least 5 years of production experience in the apparel industry and be comfortable managing orders, approvals, and production timelines.\n\n  Responsibilities & Requirements:\n\n\t \tCommunicate with factories and oversee production progress.\n\n\t \tManage purchase orders (POs), samples, and production approvals.\n\n\t \tFollow up on deadlines, shipments, and production schedules.\n\n\t \tIdentify and communicate production issues and resolve problems with factories.\n\n\t \tMaintain clear communication between factories and internal teams.\n\n\t \tMinimum 5 years of apparel production experience required."}, {"id": "27000", "title": "Division Head – Men's & Women's Apparel", "bhTitle": "Division Manager", "category": "HR, Management & Fundraising", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-10", "exp": "2027-02-03", "desc": "Location: NYC\n\n  An established NYC-based men's and women's apparel company is seeking an experienced Division Head to launch and lead a new business division. Ideal for an established salesperson with at least 5 years of industry experience who has expertise in a particular product category, such as footwear or another area the company does not currently offer.\n\n  The company will provide the financial backing and resources needed to build and grow the division. This is an opportunity for an experienced sales professional to develop and run their own business division with the support of an established company.\n\n  Requirements:\n\n\t \tMinimum 5 years of relevant sales or industry experience.\n\n\t \tEstablished industry relationships and a strong sales track record.\n\n\t \tEntrepreneurial mindset with the ability to build a business from the ground up.\n\n\t \tExperience in footwear or other complementary product categories is a plus."}, {"id": "26999", "title": "Wholesale Sales Representative – Men's & Women's Apparel", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-10", "exp": "2027-02-03", "desc": "Location: NYC\n Schedule: Monday–Friday, 9:00 AM–6:00 PM\n\n  An NYC-based men's and women's apparel company is seeking an experienced Wholesale Sales Representative to join its team. The ideal candidate will have at least 3 years of wholesale sales experience, strong communication and negotiation skills, and the ability to develop new business and maintain relationships with retail accounts.\n\n  Requirements:\n\n\t \tMinimum 3 years of wholesale sales experience.\n\n\t \tApparel or fashion industry experience preferred.\n\n\t \tStrong relationship-building and sales skills.\n\n\t \tSelf-motivated, organized, and results-driven."}, {"id": "26998", "title": "Senior Sales Executive – Beauty Accessories & Personal Care", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-10", "exp": "2027-02-10", "desc": "Location: New York, NY\n Employment Type: Full-Time\n Schedule: Monday–Friday\n\n  Job Description\n\n  The ideal candidate will have extensive experience selling beauty accessories, hair tools, mirrors, cosmetic accessories, and personal care products, along with established relationships with major retailers, distributors, and wholesale accounts.\n\n  This position is ideal for a successful sales professional who can leverage existing industry relationships, open new accounts, expand current business, and consistently drive significant revenue growth.\n\n  The company is seeking a motivated, well-connected sales executive who understands the retail and wholesale landscape and can independently manage high-value accounts.\n\n  Key Responsibilities\n\n  Sales & Business Development\n\n\t \tDevelop and execute sales strategies to increase revenue and expand market share.\n\n\t \tIdentify, pursue, and secure new retail, wholesale, and distribution accounts.\n\n\t \tLeverage established relationships with major retail buyers and distributors to generate new business.\n\n\t \tConsistently achieve or exceed sales targets and revenue goals.\n\n\t \tBuild a strong sales pipeline and identify high-value business opportunities.\n\n\t \tNegotiate pricing, contracts, and sales agreements with retail and wholesale customers.\n\n\t \tIdentify opportunities to introduce new product categories and expand distribution.\n\n  Retail & Wholesale Account Management\n\n\t \tDevelop and maintain strong relationships with major retailers, distributors, and wholesale customers.\n\n\t \tManage existing accounts while identifying opportunities for additional sales.\n\n\t \tPresent and sell product lines across beauty accessories, hair tools, mirrors, cosmetic accessories, and personal care products.\n\n\t \tConduct sales presentations and product meetings with retail buyers.\n\n\t \tUnderstand customer needs and recommend products that align with market demand.\n\n\t \tMonitor account performance and implement strategies to increase sales.\n\n\t \tProvide excellent customer service and maintain long-term business relationships.\n\n  Sales Strategy & Market Expansion\n\n\t \tResearch market trends, competitors, and emerging opportunities within the beauty and personal care industry.\n\n\t \tIdentify new retail channels and distribution opportunities.\n\n\t \tCollaborate with Product Development, Marketing, and Operations teams to support product launches.\n\n\t \tCoordinate with internal departments regarding inventory planning, customer requirements, and order fulfillment.\n\n\t \tMonitor sales performance and provide updates on revenue, account growth, and business opportunities.\n\n\t \tDevelop strategic plans to expand the company's presence in the beauty accessories and personal care market.\n\n  Qualifications\n\n\t \tExtensive sales experience in beauty accessories, personal care products, or related consumer goods required.\n\n\t \tEstablished relationships with major retail buyers, distributors, and wholesale accounts.\n\n\t \tDemonstrated success opening new accounts and expanding existing business.\n\n\t \tStrong understanding of retail, wholesale, and distribution sales channels.\n\n\t \tExperience selling beauty accessories, hair tools, mirrors, cosmetic accessories, or personal care products.\n\n\t \tExcellent negotiation, communication, and relationship-building skills.\n\n\t \tAbility to independently develop sales strategies and manage high-value accounts.\n\n\t \tStrong business development and account management experience.\n\n\t \tHighly motivated, organized, and results-oriented.\n\n\t \tAbility to consistently meet and exceed ambitious revenue targets.\n\n\t \tStrong understanding of pricing strategies, product positioning, and retail buyer expectations."}, {"id": "26997", "title": "Accounting Clerk – Travel Agency", "bhTitle": "Accountant", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-10", "exp": "2027-02-10", "desc": "Location: New York, NY\n Employment Type: Full-Time\n Schedule: Full-Time, Standard Business Hours\n Industry: Travel / Accounting\n\n  Job Description\n\n  An established travel agency in New York, NY, is seeking a responsible, detail-oriented, and organized Accounting Clerk to join its team.\n\n  The ideal candidate will be responsible for handling daily accounting activities, processing airline ticket transactions, preparing ARC reports, and maintaining accurate financial records.\n\n  This position requires strong organizational skills, attention to detail, and the ability to work independently while managing multiple accounting responsibilities.\n\n  Previous accounting experience is preferred. Familiarity with the travel industry and ARC reporting is a strong plus.\n\n  Key Responsibilities\n\n  Accounting & Financial Reporting\n\n\t \tPerform daily accounting and bookkeeping duties.\n\n\t \tPrepare and process daily ARC reports.\n\n\t \tMaintain accurate and organized financial records.\n\n\t \tReview financial transactions to ensure accuracy and completeness.\n\n\t \tAssist with account reconciliations and general accounting activities.\n\n\t \tIdentify and resolve discrepancies in financial records.\n\n\t \tMaintain organized accounting documentation and transaction reports.\n\n  Airline Ticket Transactions\n\n\t \tProcess and track airline ticket sales and transactions.\n\n\t \tHandle airline ticket refunds, exchanges, and related adjustments.\n\n\t \tVerify ticket transactions and ensure accurate financial reporting.\n\n\t \tMaintain detailed records of ticket purchases, refunds, and exchanges.\n\n\t \tReview transaction information and resolve discrepancies as needed.\n\n\t \tCoordinate with internal staff regarding ticket-related accounting matters.\n\n  Administrative & Recordkeeping Support\n\n\t \tOrganize and maintain financial documents and reports.\n\n\t \tAssist with data entry and transaction tracking.\n\n\t \tEnsure accounting records are updated accurately and on time.\n\n\t \tCommunicate with team members regarding financial information and outstanding transactions.\n\n\t \tPerform additional accounting and administrative tasks as needed.\n\n  Qualifications\n\n\t \tPrevious accounting or bookkeeping experience preferred.\n\n\t \tStrong attention to detail and accuracy.\n\n\t \tExcellent organizational and time-management skills.\n\n\t \tAbility to work independently and manage daily responsibilities.\n\n\t \tBasic understanding of accounting principles and financial recordkeeping.\n\n\t \tStrong computer and data entry skills.\n\n\t \tGood communication and problem-solving abilities.\n\n\t \tReliable, responsible, and dependable.\n\n\t \tAbility to maintain confidentiality when handling financial information."}, {"id": "26996", "title": "Whatnot Live Sales Partner", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-11-09", "exp": "2027-02-08", "desc": "Location: Local Partnership (Monmouth County, New Jersey)\n Job Type: Partnership / Independent Contractor\n Schedule: Flexible / Part-Time (Based on live show schedules)\n Salary: 50/50 Revenue Split Partnership\n\n Partner with us on live Whatnot sales for a select group of clients. We handle the product sourcing and supply, while you help set up and grow the seller accounts and take the lead on running live shows.  Key Responsibilities:\n\n\tHelp set up, structure, and grow Whatnot seller accounts for clients.\n\tTake the lead on hosting and running live Whatnot shows, including on-camera presentation and product pitching.\n\tEngage actively with buyers in the chat, manage auctions, and build an audience over time.\n\tCollaborate on show strategies to maximize viewer retention and sales conversion.\n\n  Qualifications:\n\n\tFamiliarity with the Whatnot platform and a solid understanding of how live selling works.\n\tComfortable and engaging on camera with strong live-streaming presence.\n\tRecently completed the Whatnot class and feel ready to host.\n\tLocal to the area and eager to build and scale an audience over time.\n\n  What We Offer:\n\n\tA true 50/50 partnership structure on live sales revenue.\n\tFully supplied products and inventory sourced for every show so you can focus entirely on hosting and selling.\n\tAn opportunity to step into active live selling with established client backing."}, {"id": "26995", "title": "Direct Support Professional (DSP) – Group Home Staff", "bhTitle": "Companion", "category": "Healthcare & Human Services", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-11-09", "exp": "2027-02-09", "desc": "Location: Brooklyn, NY\n Employment Type: Full-Time / Part-Time\n Schedule: Sunday–Thursday, 3:00 PM–8:00 PM (Flexible Days)\n\n  Job Description\n\n  A group home is seeking compassionate, responsible, and dependable Direct Support Professionals (DSPs) to provide care, companionship, and daily support to adults with special needs.\n\n  The ideal candidate is patient, caring, and dedicated to creating a safe, supportive, and welcoming environment for individuals with developmental or intellectual disabilities.\n\n  This position offers flexible scheduling, allowing candidates to choose which days they would like to work between Sunday and Thursday.\n\n  Both full-time and part-time applicants are welcome.\n\n  Key Responsibilities\n\n\t \tProvide attentive care and companionship to adults with special needs.\n\n\t \tAssist individuals with daily routines and activities as needed.\n\n\t \tCreate a safe, comfortable, and supportive living environment.\n\n\t \tEngage residents in recreational, social, and meaningful activities.\n\n\t \tEncourage independence and promote personal development.\n\n\t \tProvide emotional support and positive social interaction.\n\n\t \tAssist with maintaining a clean and organized living environment.\n\n\t \tMonitor residents' well-being and communicate any concerns to supervisors.\n\n\t \tFollow established care plans, instructions, and group home procedures.\n\n\t \tTreat all residents with dignity, patience, and respect.\n\n\t \tWork cooperatively with other staff members to ensure quality care.\n\n  Qualifications\n\n\t \tCompassionate, patient, and responsible personality required.\n\n\t \tGenuine interest in working with adults with special needs.\n\n\t \tReliable, punctual, and dependable.\n\n\t \tStrong communication and interpersonal skills.\n\n\t \tAbility to provide supportive and respectful care.\n\n\t \tComfortable assisting individuals with daily living activities.\n\n\t \tAbility to follow instructions and established care plans.\n\n\t \tPositive attitude and willingness to help others.\n\n\t \tPrevious experience in a group home, caregiving, or direct support role is a plus."}, {"id": "26994", "title": "Social Media & Content Creation Intern", "bhTitle": "Marketing", "category": "E-commerce, Marketing & Social Media", "type": "Internship", "typeNote": "", "state": "NY", "added": "2026-11-09", "exp": "2027-02-03", "desc": "Location: New York, NY | Part-Time | Unpaid Internship\n\n  A community-focused organization is seeking a creative intern to help grow its social media presence by creating engaging Reels and short-form videos highlighting weekly events, guest speakers, Hafrashat Challah gatherings, and community programs.\n\n  Qualifications: Familiarity with Instagram, TikTok, and video editing. Must be creative, organized, and comfortable creating engaging content. Previous experience preferred."}, {"id": "26993", "title": "Operations Manager", "bhTitle": "Operations Manager", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-09", "exp": "2027-02-05", "desc": "USA-based internet e-commerce business and online retailer offering over 40,000 home, furniture, rug, decor, and tool products seeking a High-Level Operations Manager. Previous experience required."}, {"id": "26992", "title": "Babysitter / Nanny", "bhTitle": "Babysitter/Nanny", "category": "Education & Childcare", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-11-09", "exp": "2027-02-09", "desc": "Location: Brooklyn, NY\n Employment Type: Part-Time\n Schedule: 3:00 PM–6:00 PM\n\n  Job Description\n\n  Seeking a caring, responsible, and reliable Babysitter / Nanny to assist with supervising and caring for children during afternoon hours.\n\n  The ideal candidate is patient, friendly, energetic, and enjoys working with children. This is a great opportunity for someone looking for a part-time childcare position.\n\n  Key Responsibilities\n\n\t \tSupervise and care for children during afternoon hours.\n\n\t \tEngage children in age-appropriate games, activities, and playtime.\n\n\t \tEnsure children's safety and well-being at all times.\n\n\t \tAssist children with daily routines and activities.\n\n\t \tCreate a positive, fun, and nurturing environment.\n\n\t \tHelp organize toys, games, and activity areas.\n\n\t \tMaintain a clean and organized environment.\n\n\t \tCommunicate effectively with parents or guardians.\n\n\t \tAssist with additional childcare responsibilities as needed.\n\n  Qualifications\n\n\t \tEnjoys working with children.\n\n\t \tPatient, caring, friendly, and responsible.\n\n\t \tReliable and punctual.\n\n\t \tStrong communication and interpersonal skills.\n\n\t \tAbility to supervise children and maintain a safe environment.\n\n\t \tEnergetic, attentive, and dependable.\n\n\t \tPrevious babysitting, nanny, or childcare experience is a plus.\n\n\t \tAbility to follow instructions and established routines."}, {"id": "26991", "title": "Job description", "bhTitle": "Medical Assistant", "category": "Healthcare & Human Services", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-11-09", "exp": "2027-02-09", "desc": "Job Description: Part-Time Licensed School Nurse (Early Childhood)\n Position Title: Part-Time School Nurse\n Location: Private Early Childhood School, New York City\n Schedule: Monday to Friday, 9:30 AM - 12:30 PM; September through June\n Age Group: Children Ages 2-5\n Position Overview:\n We are seeking a compassionate, experienced, and licensed nurse to serve as the school nurse for our early childhood program. This part-time role involves providing high-quality healthcare and first aid to children ages 2-5 in a nurturing, private school setting. The ideal candidate will ensure the health and safety of our students while working closely with educators, parents, and staff.\n Key Responsibilities:\n\tDaily Health Management: Monitor and manage the health needs of children, monitoring for signs of illness, and attending to minor injuries.\n\tEmergency Care: Provide prompt care in case of injuries or medical emergencies and communicate effectively with parents/guardians and appropriate personnel.\n\tHealth Records Maintenance: Maintain accurate and up-to-date health records, including immunization records, medical history, and incident reports, in compliance with New York State regulations.\n\tIllness Prevention: Monitor for contagious conditions, follow proper protocols for disease prevention, and educate staff on health and hygiene practices.\n\tCollaboration with Staff and Families: Act as a liaison between the school, families, and healthcare providers to address student health needs. Inform parents about unwell children, and school policies.\n\tCompliance with Policies: Ensure the school is following New York State Department of Health guidelines and private school health policies.\n\n Qualifications:\n\tLicensure and Certification:\n\tValid New York State Registered Nurse (RN) license.\n\tCurrent CPR and First Aid certification (required).\n\tExperience: Previous pediatric or school nursing experience preferred, especially with early childhood populations (ages 2-5).\n\tSkills:\n\tStrong communication and interpersonal skills to effectively interact with young children, parents, and staff.\n\tKnowledge of child development, common childhood illnesses, and injury management.\n\tAbility to remain calm in emergencies and make quick, sound decisions.\n\tPersonal Qualities: Compassionate, patient, and reliable, with a passion for working with young children in an educational setting."}, {"id": "26990", "title": "Sales Audit Clerk", "bhTitle": "Financial Analyst", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-06", "exp": "2027-02-08", "desc": "Location: Brooklyn, NY\n Employment Type: Full-Time\n Department: Sales Audit / Accounting\n\n  Job Description\n\n  An established national retail company with locations throughout the United States and Caribbean is seeking a detail-oriented and organized Sales Audit Clerk to join its corporate Sales Audit Department in Brooklyn, NY.\n\n  The ideal candidate will be responsible for reviewing daily sales transactions, verifying store deposits, identifying discrepancies, and making necessary adjustments to ensure accurate financial records.\n\n  This position requires strong attention to detail, basic accounting knowledge, computer proficiency, and the ability to communicate effectively with store managers and internal departments.\n\n  Key Responsibilities\n\n  Sales Auditing & Transaction Reconciliation\n\n\t \tReview daily store sales transactions, register activity, and deposits for accuracy.\n\n\t \tIdentify and investigate discrepancies, including deposit overages and shortages.\n\n\t \tMake corrections and adjustments to incorrectly entered deposits and sales transactions.\n\n\t \tReview and reconcile debit and credit card transactions.\n\n\t \tInvestigate missing sales, transaction gaps, and incomplete store polling.\n\n\t \tProcess adjustments related to Worldpay reports, including customer credit card corrections and missing transactions.\n\n\t \tPrepare and review daily overage and shortage reports.\n\n\t \tResolve discrepancies to ensure accurate financial reporting.\n\n  Accounting & Financial Reporting\n\n\t \tReview petty cash transactions and request supporting invoices or explanations for payouts.\n\n\t \tAssist with preparing petty cash and balancing reports.\n\n\t \tReview monthly transactions and make necessary corrections before closing.\n\n\t \tEnsure the general ledger (G/L) is balanced for month-end closing.\n\n\t \tMaintain accurate records of sales adjustments, deposits, and reconciliations.\n\n\t \tSupport the Sales Audit Manager with additional financial reporting responsibilities.\n\n  Store & Department Support\n\n\t \tCommunicate with store managers, district managers, and regional managers regarding daily transaction issues.\n\n\t \tInvestigate and resolve store-related sales and deposit discrepancies.\n\n\t \tRespond to inquiries through phone and email.\n\n\t \tCoordinate with internal departments to ensure accurate reporting and timely issue resolution.\n\n\t \tAssist with general data entry and administrative tasks within the Sales Audit Department.\n\n  Qualifications\n\n\t \tHigh school diploma or equivalent required.\n\n\t \tStrong attention to detail and accuracy.\n\n\t \tProficiency in Microsoft Office, particularly Excel.\n\n\t \tData entry skills and experience.\n\n\t \tStrong organizational and time-management abilities.\n\n\t \tExcellent written and verbal communication skills.\n\n\t \tComfortable communicating with store managers and internal departments by phone and email.\n\n\t \tAbility to identify discrepancies and resolve problems efficiently.\n\n\t \tAbility to work independently and manage multiple responsibilities.\n\n\t \tBasic understanding of financial transactions and reconciliations preferred.\n\n\t \tPrevious experience in sales auditing, accounting, bookkeeping, or retail operations is a plus."}, {"id": "26989", "title": "Health Spa Attendant", "bhTitle": "Building Maintenance", "category": "Other", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-11-06", "exp": "2027-02-08", "desc": "Location: Brooklyn, NY\n Employment Type: Part-Time\n Schedule: Monday–Friday, 10:00 AM–3:00 PM\n Open Positions: 2\n\n  Job Description\n\n  An established community fitness and wellness center in Brooklyn, NY, is seeking friendly, reliable, and responsible Health Spa Attendants to join its team.\n\n  This position offers the opportunity to work in a peaceful, quiet, and low-stress environment while helping maintain a clean, organized, and welcoming spa facility.\n\n  The ideal candidate is dependable, organized, and comfortable assisting members while overseeing spa amenities and performing light housekeeping responsibilities.\n\n  The facility features a jacuzzi, steam room, sauna, private weight room, massage room, showers, and locker rooms.\n\n  Key Responsibilities\n\n\t \tSupervise the health spa facility and ensure members have a comfortable and pleasant experience.\n\n\t \tMonitor spa amenities, including the jacuzzi, steam room, sauna, private weight room, massage room, showers, and locker rooms.\n\n\t \tMaintain a clean, organized, and welcoming spa environment.\n\n\t \tWash, dry, fold, and organize towels throughout the day.\n\n\t \tEnsure an adequate supply of clean towels is available for spa members, fitness center users, and group exercise classes.\n\n\t \tAssist members with basic questions and provide friendly customer service.\n\n\t \tOperate the front desk computer system and customer relationship management (CRM) software.\n\n\t \tHelp maintain an orderly and professional welcome desk.\n\n\t \tMonitor supplies and notify management when additional items are needed.\n\n\t \tFollow facility procedures and maintain cleanliness and safety standards.\n\n\t \tPerform additional light housekeeping and spa-related duties as needed.\n\n  Qualifications\n\n\t \tAbility to communicate effectively in English required.\n\n\t \tBasic computer skills required.\n\n\t \tComfortable learning and using CRM software (training provided).\n\n\t \tReliable, punctual, and responsible.\n\n\t \tFriendly personality with strong customer service skills.\n\n\t \tAbility to work independently and follow instructions.\n\n\t \tStrong organizational skills and attention to detail.\n\n\t \tPhysically capable of bending, handling laundry, and folding towels.\n\n\t \tComfortable working in a spa and wellness environment.\n\n\t \tPrevious spa, fitness center, hospitality, or customer service experience is a plus.\n\n\t \tWillingness to maintain a clean and organized facility."}, {"id": "26988", "title": "Herbal Products Production Associate", "bhTitle": "Production Assistant", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-11-05", "exp": "2027-02-01", "desc": "Location: New Jersey\n\n  A family-owned natural wellness business, is looking for a reliable and detail-oriented individual to assist with the in-house production of its herbal wellness products, including tinctures, syrups, balms, oils, creams, and other natural remedies.\n\n  The ideal candidate is hands-on, organized, and able to follow recipes and production procedures carefully while maintaining consistent product quality.\n\n  Responsibilities\n\n\t \tPrepare products according to approved recipes, measurements, and production procedures.\n\n\t \tMeasure, blend, infuse, and process herbs and ingredients accurately.\n\n\t \tBottle, package, seal, label, and date finished products.\n\n\t \tMaintain consistent product quality and accurate batch records.\n\n\t \tMonitor raw ingredient and packaging inventory.\n\n\t \tTrack finished product inventory.\n\n\t \tKeep the production area clean, organized, and properly sanitized.\n\n  Qualifications\n\n\t \tDetail-oriented, organized, and dependable.\n\n\t \tComfortable with hands-on work and product preparation.\n\n\t \tAble to follow recipes, measurements, and instructions accurately.\n\n\t \tStrong time management and organizational skills.\n\n\t \tPrevious experience in production, food preparation, cosmetics, or herbal products is a plus.\n\n\t \tAble to maintain a clean and organized workspace.\n\n\t \tInterest in natural wellness and herbal products is a plus."}, {"id": "26987", "title": "Social Media Manager", "bhTitle": "Social Media Manager", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "Not listed", "added": "2026-11-05", "exp": "2027-01-25", "desc": "Location: Long Branch/Allenhurst , NJ location\n\n  A family-owned natural wellness business, is looking for a creative and motivated Social Media Manager to manage and grow its online presence across Instagram, TikTok, and other social media platforms.\n\n  The goal is to build brand awareness, create engaging content, grow the online community, and drive in-store and online sales.\n\n  Responsibilities\n\n\t \tPlan and manage a consistent social media content calendar.\n\n\t \tCreate, film, edit, and publish engaging reels, stories, and posts.\n\n\t \tDevelop creative content that reflects the brands and aesthetic.\n\n\t \tStay current with social media trends, audio, and marketing strategies.\n\n\t \tManage daily engagement, including comments, messages, and community interactions.\n\n\t \tPromote products, new launches, events, and store activities.\n\n\t \tCollaborate with the team on campaigns, promotions, and creative ideas.\n\n\t \tTrack analytics, engagement, follower growth, and content performance.\n\n  Qualifications\n\n\t \tPrevious social media management or content creation experience.\n\n\t \tStrong creative skills and an eye for visual content.\n\n\t \tExperience with Instagram, TikTok, and other social media platforms.\n\n\t \tAbility to film and edit short-form videos and reels.\n\n\t \tStrong communication and organizational skills.\n\n\t \tSelf-motivated, creative, and able to work independently.\n\n\t \tInterest in natural wellness and holistic products is a plus."}, {"id": "26986", "title": "Executive Assistant to President", "bhTitle": "Executive Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-05", "exp": "2027-01-25", "desc": "Location: Greenpoint, Brooklyn, NY\n Employment Type: Full-Time\n Schedule: Monday–Friday, 9:00 AM–5:00 PM. Occasional weekend tasks (approximately 5–6 times per year).\n Salary Range: Depending on experience\n   A growing fire protection company is looking for a sharp, proactive, and resourceful Executive Assistant to work directly with the President. This is not a typical administrative role. The employer is looking for someone with strong business sense who can think independently, take initiative, anticipate needs, and help manage a fast-paced and sometimes unpredictable environment.\n\n  The ideal candidate is tech-savvy, comfortable using AI tools and technology to improve efficiency, and able to find solutions without needing constant direction.\n\n  Responsibilities\n\n\t \tProvide direct support to the President and assist with day-to-day business operations.\n\n\t \tManage priorities, follow up on important tasks, and ensure deadlines are met.\n\n\t \tAnticipate needs and proactively identify solutions to business challenges.\n\n\t \tCoordinate projects and communicate with employees, clients, and vendors.\n\n\t \tUse AI tools and technology to streamline workflows and improve efficiency.\n\n\t \tHandle sensitive information with discretion and professionalism.\n\n\t \tTake ownership of tasks and help keep daily operations organized and running smoothly.\n\n\t \tAssist with special projects and additional administrative responsibilities as needed.\n\n  Qualifications\n\n\t \tPrevious experience as an Executive Assistant, Business Assistant, Operations Coordinator, or in a similar role.\n\n\t \tStrong business sense and ability to understand how a company operates.\n\n\t \tHighly organized, resourceful, and able to multitask in a fast-paced environment.\n\n\t \tStrong problem-solving skills and ability to think on your feet.\n\n\t \tComfortable using AI tools, technology, and business software.\n\n\t \tSelf-starter who takes initiative and requires minimal supervision.\n\n\t \tExcellent communication and interpersonal skills.\n\n\t \tDiscreet, dependable, and professional.\n\n  Additional Information: Opportunity to work closely with company leadership in a hands-on role with room to take on broader responsibilities."}, {"id": "26985", "title": "Director of Production", "bhTitle": "Production Manager", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-05", "exp": "2027-02-05", "desc": "Location: New York, NY\n Employment Type: Full-Time\n Department: Production / Operations\n Schedule: Full-Time\n\n  Job Description\n\n  An established home décor and home textiles company with over 35 years of industry experience is seeking an experienced, strategic, and hands-on Director of Production to oversee domestic and international production operations.\n\n  This senior leadership position is responsible for managing the entire production lifecycle, from purchase order placement and manufacturing through delivery and payment coordination, while ensuring operational efficiency, cost control, product quality, and on-time execution.\n\n  The ideal candidate has extensive experience in global manufacturing, production management, overseas vendor relationships, supply chain operations, and process improvement.\n\n  This individual will oversee a production team of approximately 5–10 employees, collaborate with executive leadership, and implement scalable systems to support continued business growth.\n\n  Key Responsibilities\n\n  Production Management & Operations\n\n\t \tOversee domestic and international production operations across home textiles, home décor, and consumer product categories.\n\n\t \tManage the complete purchase order lifecycle, ensuring accuracy, efficiency, and timely delivery.\n\n\t \tDevelop production strategies to optimize manufacturing capacity, lead times, costs, and operational performance.\n\n\t \tMonitor production schedules, order statuses, and manufacturing timelines.\n\n\t \tEnsure products are delivered on time and meet major retail customers' requirements.\n\n\t \tIdentify potential production delays and proactively implement solutions.\n\n\t \tCoordinate with Sales, Product Development, Sourcing, Logistics, and Finance departments.\n\n\t \tManage high-volume production operations involving extensive SKU assortments.\n\n  Vendor & International Manufacturing Management\n\n\t \tBuild and maintain strong relationships with domestic and overseas factories and suppliers.\n\n\t \tOversee vendor performance related to product quality, pricing, production timelines, and delivery.\n\n\t \tNegotiate manufacturing schedules, production costs, and vendor agreements.\n\n\t \tEstablish supplier performance metrics and accountability standards.\n\n\t \tResolve manufacturing challenges and address supply chain disruptions.\n\n\t \tIdentify opportunities to improve manufacturing efficiency and reduce operational costs.\n\n\t \tEnsure manufacturing partners meet company standards and customer expectations.\n\n\t \tConduct factory visits and vendor meetings as needed.\n\n  Process Improvement & Operational Efficiency\n\n\t \tEvaluate existing production processes and identify opportunities for improvement.\n\n\t \tImplement standardized procedures to streamline workflows and improve productivity.\n\n\t \tReduce manual processes through automation and technology.\n\n\t \tDevelop reporting systems and dashboards to improve production visibility.\n\n\t \tMonitor production KPIs and operational performance.\n\n\t \tUtilize ERP systems, Excel, and emerging technologies to improve tracking, planning, and decision-making.\n\n\t \tDevelop scalable systems to support increasing order volumes and SKU complexity.\n\n\t \tIdentify cost-saving opportunities throughout production and supply chain operations.\n\n  Team Leadership & Development\n\n\t \tLead, manage, and mentor a production team of approximately 5–10 employees.\n\n\t \tEstablish clear responsibilities, performance expectations, and accountability measures.\n\n\t \tProvide guidance and support to improve team productivity and operational performance.\n\n\t \tCoach employees on vendor management, problem-solving, and production execution.\n\n\t \tFoster a collaborative, proactive, and results-oriented work environment.\n\n\t \tEnsure effective communication between production staff and other departments.\n\n\t \tParticipate in leadership meetings and provide strategic recommendations to senior management.\n\n  Strategic Planning & Cross-Functional Collaboration\n\n\t \tWork closely with executive leadership to align production operations with business objectives.\n\n\t \tDevelop long-term production strategies to support company growth.\n\n\t \tCollaborate with Sales and Product Development to coordinate product launches and customer orders.\n\n\t \tPartner with Logistics to ensure efficient shipping and delivery schedules.\n\n\t \tCoordinate with Finance regarding production costs, vendor payments, and financial planning.\n\n\t \tProvide leadership with regular updates on production performance, challenges, and opportunities.\n\n\t \tIdentify operational risks and develop strategies to minimize disruptions.\n\n  Qualifications\n\n\t \t10+ years of progressive experience in production, manufacturing, supply chain, or operations required.\n\n\t \tPrevious leadership and management experience required.\n\n\t \tProven experience managing domestic and international production operations.\n\n\t \tStrong background in overseas factory management and vendor negotiations.\n\n\t \tExperience managing high-volume production environments with large SKU assortments.\n\n\t \tDemonstrated experience overseeing purchase orders, production schedules, and manufacturing timelines.\n\n\t \tExperience leading and developing teams of approximately 5–10 employees.\n\n\t \tStrong understanding of supply chain management, production planning, and operational efficiency.\n\n\t \tDemonstrated success implementing process improvements, automation, and cost-reduction initiatives.\n\n\t \tAdvanced proficiency in Microsoft Excel required.\n\n\t \tExperience using ERP systems, production tracking software, or supply chain management platforms.\n\n\t \tExcellent analytical, organizational, negotiation, and problem-solving skills.\n\n\t \tAbility to balance strategic planning with hands-on operational responsibilities.\n\n\t \tStrong leadership, communication, and decision-making abilities.\n\n\t \tAbility to manage multiple priorities in a fast-paced environment.\n\n  Preferred Qualifications\n\n\t \tExperience in home textiles, bedding, home décor, consumer products, or consumer packaged goods (CPG).\n\n\t \tFamiliarity with major retail customers and retailer compliance requirements.\n\n\t \tExperience working with international manufacturing partners.\n\n\t \tBilingual English and Chinese preferred.\n\n\t \tExperience implementing technology-driven production improvements and automation.\n\n\t \tStrong understanding of international manufacturing processes and global supply chains."}, {"id": "26984", "title": "Administrative Assistant – Product Development", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-05", "exp": "2027-02-05", "desc": "Location: To Be Determined\n Employment Type: Full-Time\n Schedule: Monday–Friday\n\n  Job Description\n\n  An established consumer products company is seeking a highly organized, detail-oriented, and proactive Administrative Assistant to support product development operations and provide direct administrative assistance to the CEO.\n\n  This position combines product development coordination, project management, vendor communication, and executive administrative support.\n\n  The ideal candidate is motivated, organized, and comfortable managing multiple responsibilities in a fast-paced environment. This individual will work closely with internal departments and overseas factories to ensure product development projects remain on schedule, product information is accurate, and daily operations run efficiently.\n\n  This is an excellent opportunity for someone looking to grow professionally while gaining hands-on experience in product development and business operations.\n\n  Key Responsibilities\n\n  Product Development & Design Support\n\n\t \tAssist designers throughout the product development process, from initial concepts through production and final delivery.\n\n\t \tCreate, update, and maintain tech packs, instruction sheets, and product specifications.\n\n\t \tPrepare product designs, prototypes, packaging materials, and samples for internal and customer reviews.\n\n\t \tAssist with product costing, design documentation, and development tracking.\n\n\t \tEnsure product specifications and packaging requirements are accurate and up to date.\n\n  Project Coordination & Data Management\n\n\t \tTrack product samples, approvals, development timelines, and project milestones.\n\n\t \tCreate and maintain product SKUs, UPCs, and item setup information.\n\n\t \tOrganize and update product databases, reports, and development records.\n\n\t \tMaintain accurate information for product line reviews, cost analysis, and customer feedback.\n\n\t \tMonitor outstanding tasks and follow up to ensure projects remain on schedule.\n\n  Vendor & Factory Coordination\n\n\t \tCommunicate with overseas factories and vendors regarding product development, pricing, samples, and production timelines.\n\n\t \tRequest and track product samples, quotations, and necessary revisions.\n\n\t \tCoordinate sample shipments and maintain organized sample inventories.\n\n\t \tPrepare and manage product and packaging development requests.\n\n\t \tAssist with sourcing materials, obtaining competitive pricing, and coordinating vendor requirements.\n\n\t \tFollow up with suppliers to ensure timely completion of development tasks.\n\n  Executive & Administrative Support\n\n\t \tProvide direct administrative support to the CEO across product development, finance, marketing, and general business operations.\n\n\t \tManage calendars, appointments, reminders, and important deadlines.\n\n\t \tPrepare presentations, reports, summaries, and business documents.\n\n\t \tOrganize meetings, track action items, and follow up on outstanding assignments.\n\n\t \tMaintain organized filing systems, records, and administrative processes.\n\n\t \tAnticipate executive needs and proactively address administrative priorities.\n\n\t \tAssist with general office coordination and additional administrative responsibilities as needed.\n\n  Cross-Functional Collaboration\n\n\t \tWork closely with Sales, Marketing, Design, Production, and Customer Service departments.\n\n\t \tCoordinate communication between internal teams and external vendors.\n\n\t \tParticipate in product development meetings and document key updates.\n\n\t \tTrack departmental follow-ups and ensure timely completion of assigned tasks.\n\n\t \tAssist customer service teams with product-related questions and information requests.\n\n  Market Research & Business Development\n\n\t \tConduct market research to identify consumer trends and new product opportunities.\n\n\t \tResearch competing products, pricing, and market developments.\n\n\t \tAssist with exploring new product categories and business opportunities.\n\n\t \tSupport business development initiatives through research, reporting, and administrative coordination.\n\n  Qua
