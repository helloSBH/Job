ns\n\n\tNo previous business funding experience required.\n\tNo college degree required.\n\tPrevious sales, customer service, call center, business development, or phone-based experience is a plus.\n\tStrong verbal communication and interpersonal skills.\n\tComfortable spending a significant portion of the workday on the phone.\n\tConfident communicating professionally with business owners.\n\tStrong follow-up and organizational skills.\n\tAbility to remain consistent and persistent throughout the sales process.\n\tReceptive to training, coaching, and feedback.\n\tComfortable working in a performance-driven sales environment.\n\tAbility to work independently while collaborating with a team.\n\tMotivated by commission-based compensation and measurable results.\n\tProfessional, dependable, and willing to learn."}, {"id": "26694", "title": "Human Resources Manager", "bhTitle": "Human Resources", "category": "HR, Management & Fundraising", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-26", "exp": "2026-11-06", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday–Friday, On-Site\nBenefits: Competitive benefits package, generous PTO, and on-site employee parking\n\nPosition Overview\n\nA Brooklyn-based nonprofit organization serving the local community is seeking an experienced Human Resources Manager to provide strategic and hands-on HR support across multiple programs. This position will oversee key aspects of the employee lifecycle, including recruitment, employee relations, performance management, compliance, benefits administration, and HR operations.\n\nWorking closely with senior leadership, program directors, supervisors, and employees, the Human Resources Manager will serve as a trusted HR partner, helping foster a positive, inclusive, and mission-driven workplace while ensuring effective and compliant HR practices throughout the organization.\n\nJob Responsibilities\n\n\tEnsure employee compliance with organizational policies and procedures.\n\tServe as a point of contact for employee questions, concerns, and conflict resolution.\n\tAdvise management on employee relations matters and recommend appropriate corrective or disciplinary action.\n\tConduct internal investigations as needed.\n\tFacilitate voluntary and involuntary employee separation processes.\n\tFoster a positive and inclusive workplace culture.\n\tSupport employee engagement and retention initiatives.\n\tMaintain compliance with applicable federal, state, local, and funder regulations.\n\tCoordinate performance reviews and coach managers on feedback, goal setting, and employee development.\n\tOversee personnel records, including I-9s, background checks, and HRIS data.\n\tMaintain and improve HR processes and documentation.\n\tUtilize HRIS systems for recordkeeping, reporting, and process efficiency.\n\tGenerate HR reports and analytics for leadership as needed.\n\tSupport employee training and wellness initiatives.\n\tPartner with leadership on organizational development and workforce planning.\n\nQualifications\n\n\tBachelor's degree in Human Resources, Business Administration, or a related field.\n\tMaster's degree or PHR/SPHR preferred.\n\tMinimum of 5 years of progressive HR experience.\n\tPrior experience in a nonprofit, social services, or community-based organization strongly preferred.\n\tStrong knowledge of employment laws and HR best practices.\n\tExperience with policy development, employee conduct, discipline, and workplace safety.\n\tFamiliarity with full-cycle recruitment, job descriptions, candidate evaluation, and onboarding.\n\tKnowledge of performance management, coaching, and employee development.\n\tExcellent written and verbal communication skills.\n\tStrong employee relations, mediation, and conflict resolution skills.\n\tAbility to manage multiple priorities and deadlines accurately.\n\tStrong problem-solving and organizational skills.\n\tAbility to build trusted relationships with employees and leadership at all levels.\n\tAbility to interpret and apply HR policies and legal requirements fairly and consistently.\n\tCommitment to fostering an equitable, inclusive, and supportive workplace.\n\tProficiency with HRIS systems and Microsoft Office Suite.\n\nThis is an on-site position in Brooklyn, NY. Competitive benefits package, generous PTO, and on-site employee parking provided."}, {"id": "26693", "title": "Sourcing & Business Development Manager", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-26", "exp": "2026-11-26", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nA growing wholesale closeout and liquidation company is seeking an experienced and results-driven Sourcing & Business Development Manager to expand its inventory supply pipeline and buyer network.\n\nThis is a hands-on, mid-level position for someone who understands the closeout, overstock, liquidation, wholesale, or secondary-market business and can begin developing opportunities from day one.\n\nThe ideal candidate is a proactive business developer who knows how to identify opportunities, build industry relationships, negotiate profitable deals, and turn those relationships into consistent, repeat business.\n\nThis is a hybrid position based in Brooklyn, with several days per week in the office and flexibility to work remotely for the remainder of the week.\n\nKey Responsibilities\n\nSourcing & Inventory Acquisition\n\n\tIdentify and develop new sources of closeout, overstock, shelf-pull, excess, and liquidation inventory.\n\tBuild relationships with retailers, manufacturers, distributors, brokers, wholesalers, and other liquidators.\n\tEvaluate potential deals based on product quality, condition, pricing, marketability, and resale potential.\n\tReview manifests, load lists, quantities, costs, and other deal information quickly and accurately.\n\tNegotiate purchasing prices, terms, and conditions with suppliers.\n\tDevelop and maintain a strong pipeline of recurring inventory sources.\n\tMonitor market pricing, demand, and resale opportunities across multiple consumer product categories.\n\tIdentify attractive purchasing opportunities while recognizing potential risks before committing to a deal.\n\tWork closely with leadership when evaluating larger or more complex opportunities.\n\nBusiness Development & Sales\n\n\tDevelop new sales channels for acquired inventory.\n\tBuild relationships with bin stores, export buyers, online resellers, regional wholesalers, discount retailers, and other secondary-market buyers.\n\tProspect for new buyers and business opportunities.\n\tDevelop and manage a book of repeat customers.\n\tMatch available inventory with the most appropriate buyers and sales channels.\n\tNegotiate sales pricing and terms while protecting company margins.\n\tConsistently follow up with prospects, suppliers, and existing accounts.\n\tDevelop repeat business and long-term industry relationships.\n\tAttend trade shows, auctions, industry events, and networking opportunities when appropriate.\n\tWork with leadership to identify new product categories, customer segments, and growth opportunities.\n\nQualifications\n\n\tPrior experience in closeouts, liquidation, overstock, wholesale, secondary-market merchandise, or a closely related industry required.\n\tProven ability to prospect, develop relationships, negotiate, and close deals.\n\tStrong understanding of closeout and liquidation transactions.\n\tComfortable reviewing manifests, load lists, inventory details, quantities, and pricing.\n\tStrong negotiation skills and commercial judgment.\n\tAbility to evaluate both the potential profitability and risks of inventory opportunities.\n\tStrong phone, communication, and relationship-building skills.\n\tHighly motivated, resourceful, persistent, and results-oriented.\n\tComfortable working in a performance-driven environment.\n\tAbility to work independently while collaborating effectively with leadership and other team members.\n\tExisting relationships with retailers, manufacturers, wholesalers, liquidators, brokers, or secondary-market buyers are a strong plus."}, {"id": "26692", "title": "Office Administrator", "bhTitle": "Office Administrator", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-26", "exp": "2026-11-19", "desc": "Location: New York, NY\nEmployment Type: Full-Time\nSchedule: Monday through Friday – Standard Business Hours\n\nDescription\n\nWe're seeking an organized, detail-oriented Office Administrator to help keep our creative studio running smoothly. This role is perfect for someone who enjoys bringing structure to a fast-moving environment, thrives on organization, and takes pride in ensuring that both operational and administrative tasks are handled with care and precision.\n\nThe ideal candidate is proactive, dependable, tech-savvy, and enjoys supporting a collaborative team while helping maintain an efficient and welcoming workplace.\n\nResponsibilities\n\nOffice & Administrative Support\n\n• Manage calendars, scheduling, and day-to-day office coordination\n• Support administrative and organizational needs across the team\n• Handle digital and clerical tasks with accuracy and attention to detail\n• Maintain organized records, files, and internal documentation\n• Assist with general office operations and workflow management\n\nShipping & Fulfillment\n\n• Prepare shipments and print shipping labels\n• Pack orders carefully and professionally\n• Coordinate outgoing deliveries and monitor shipment status\n• Ensure orders are processed accurately and shipped on time\n• Assist with inventory and fulfillment-related tasks as needed\n\nPlatform & Operations Management\n\n• Manage and maintain information across sales and vendor platforms\n• Perform backend updates and administrative tasks within company systems\n• Monitor order and operational workflows to ensure accuracy\n• Assist with data entry and system maintenance\n\nQualifications\n\n• Strong organizational and multitasking abilities\n• Excellent attention to detail and follow-through\n• Comfortable working with computers, online platforms, and digital tools\n• Strong time management skills and ability to prioritize tasks effectively\n• Excellent communication and interpersonal skills\n• Positive, proactive, and team-oriented attitude\n• Ability to work independently while supporting a collaborative team environment"}, {"id": "26690", "title": "Vending Machine Route Driver", "bhTitle": "Driver", "category": "Warehouse, Driving & Logistics", "type": "Part Time", "typeNote": "", "state": "NJ", "added": "2026-08-26", "exp": "2026-11-26", "desc": "Location: Monmouth County, NJ\nEmployment Type: Part-Time\nSchedule: Approximately 15–20 Hours Per Week – Flexible Based on Route Needs\n\nPosition Overview\n\nA growing vending operation in Monmouth County, NJ is seeking a reliable and self-directed Vending Machine Route Driver to service vending machine locations throughout an established route.\n\nThe Route Driver will be responsible for keeping machines properly stocked, clean, organized, and operating smoothly. This is a part-time position to start, with the opportunity for additional routes, hours, and responsibilities as the business grows.\n\nKey Responsibilities\n\n\tTravel to vending machine locations according to an established route and schedule.\n\tRestock snacks, beverages, and other products as needed.\n\tRotate inventory and maintain appropriate stock levels.\n\tCheck machines for cleanliness, damage, or mechanical issues.\n\tAddress basic issues when appropriate and promptly report problems requiring additional service.\n\tCollect and reconcile cash and/or sales information when applicable.\n\tTrack product inventory and communicate low-stock or reorder needs.\n\tKeep vending machines and surrounding areas clean and presentable.\n\tLoad, transport, and organize products efficiently.\n\tMaintain accurate records of route stops, inventory, and servicing.\n\tManage assigned routes independently and efficiently.\n\tCommunicate professionally with clients and contacts at vending locations.\n\tComplete scheduled route responsibilities consistently and on time.\n\nQualifications\n\n\tValid driver's license required.\n\tReliable personal vehicle required.\n\tSafe and responsible driving habits.\n\tAbility to lift and carry up to 50 pounds regularly.\n\tComfortable working independently with minimal supervision.\n\tDependable, trustworthy, and responsible.\n\tPunctual with consistent attendance.\n\tStrong basic organizational and time-management skills.\n\tProfessional when interacting with clients and location staff.\n\tAbility to keep track of inventory, products, and route stops.\n\tPrevious experience in vending, delivery, route driving, retail stocking, merchandising, or similar work is a plus but not required."}, {"id": "26689", "title": "Kitchen Manager", "bhTitle": "Manager", "category": "Restaurant & Food Service", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-08-26", "exp": "2026-11-26", "desc": "Location: Ocean Township, NJ\nEmployment Type: Full-Time\nSchedule: Based on Kitchen Operations and Business Needs\n\nPosition Overview\n\nA growing kosher-certified ghost kitchen in Ocean Township, NJ is seeking an experienced, hands-on Kitchen Manager to take ownership of daily kitchen operations.\n\nThe business serves wholesale accounts, a daily lunch program, meal prep, and catering, with no retail or dine-in operation. The Kitchen Manager will work closely with the owner, who focuses primarily on business development, sales, and other non-kitchen functions.\n\nThis is a leadership role for someone who wants genuine responsibility and autonomy. The Kitchen Manager will be expected to run the kitchen like their own operation, with compensation structured to reward growth through base pay plus a revenue-share opportunity.\n\nKey Responsibilities\n\nKitchen Operations & Production\n\n\tOversee daily kitchen operations across wholesale, lunch program, meal prep, and catering.\n\tActively participate in food preparation and cooking.\n\tEstablish and maintain recipes, portions, preparation methods, and production standards.\n\tStep onto the line and assist with production whenever needed.\n\tCoordinate multiple orders and production schedules with different deadlines and requirements.\n\tEnsure food is prepared accurately, consistently, and on schedule.\n\nKosher Compliance & Food Safety\n\n\tMaintain strict adherence to the kitchen's kosher certification requirements.\n\tCoordinate appropriately with the mashgiach and certifying agency.\n\tMaintain proper kosher kitchen procedures throughout food preparation, storage, and production.\n\tEnsure compliance with applicable health, sanitation, and food safety requirements.\n\tMaintain a clean, organized, and properly functioning kitchen.\n\tEnsure staff consistently follow established food safety procedures.\n\nInventory, Purchasing & Vendors\n\n\tManage food and supply inventory.\n\tPlace, track, and receive vendor orders.\n\tMonitor food costs, usage, and waste.\n\tSource products and supplies as needed.\n\tDevelop and maintain strong relationships with suppliers and vendors.\n\tIdentify opportunities for better pricing, quality, and purchasing efficiency.\n\nStaff Management\n\n\tSchedule, train, supervise, and support kitchen staff.\n\tAssign responsibilities and ensure daily production goals are met.\n\tMaintain accountability for performance, cleanliness, food quality, and safety.\n\tProvide hands-on leadership during busy production periods.\n\tHelp develop efficient kitchen procedures as the business grows.\n\nOperational Management\n\n\tPlan production across multiple simultaneous revenue streams.\n\tImprove kitchen workflow, labor utilization, and overall efficiency.\n\tIdentify opportunities to reduce waste and control costs.\n\tMaintain consistent quality across all orders and programs.\n\tTake ownership of kitchen-related challenges and resolve issues proactively.\n\tWork closely with ownership regarding production needs, growth, staffing, and operational priorities.\n\nQualifications\n\n\tProfessional kitchen management experience required.\n\tStrong hands-on cooking and food preparation skills.\n\tExperience supervising and managing kitchen staff.\n\tExperience with inventory management, purchasing, and vendor relationships.\n\tKnowledge of kosher kitchen practices.\n\tStrong understanding of food safety and sanitation procedures.\n\tAbility to coordinate multiple production streams and deadlines simultaneously.\n\tStrong organizational, leadership, and problem-solving skills.\n\tComfortable taking ownership and making day-to-day operational decisions.\n\tAbility to work independently without constant oversight.\n\tExperience with wholesale food production, catering, meal preparation, or high-volume kitchens is a plus.\n\tServSafe or equivalent food safety certification preferred."}, {"id": "26688", "title": "Delivery Driver/Vending Machine Restocker", "bhTitle": "Delivery", "category": "Warehouse, Driving & Logistics", "type": "Part Time", "typeNote": "", "state": "NJ", "added": "2026-08-25", "exp": "2026-11-25", "desc": "We're a food & vending operation locally based in Ocean Township with distribution throughout NJ (and soon NYC). We are hiring a delivery driver / vending machine restocker.\n\nThe scope of responsibilities would include:\n? Delivery fresh made food products to various locations\n? Restocking / resetting vending machines\n? General vending machine troubleshooting\n? Interfacing with customers on site as needed\n? Assist with the companies general delivery / pick up responsibilities\n\nMust have a valid drivers clean driving record and have your own car. Must be able to lift 50lbs No experience necessary.\nWilling to train the right individualry.\nWilling to train the right individual"}, {"id": "26687", "title": "Assistant", "bhTitle": "Assistant", "category": "Administrative & Office", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-08-25", "exp": "2026-11-25", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\nSchedule: 20–25 Hours Per Week / Half Days, with Opportunity for Additional Hours as Needed\n\nPosition Overview\n\nA Brooklyn-based employer is seeking a reliable, responsible, and highly organized Task Fulfillment / Personal Assistant to provide support with errands, driving, and a variety of day-to-day tasks.\n\nThis position is ideal for someone who is dependable, takes initiative, and is comfortable handling different responsibilities throughout the day. A work vehicle will be provided for job-related driving.\n\nKey Responsibilities\n\n\tComplete daily errands, pickups, drop-offs, and other assigned tasks.\n\tDrive to various locations throughout Brooklyn and surrounding areas as needed.\n\tAssist with general personal and administrative tasks.\n\tCoordinate and complete time-sensitive assignments.\n\tPick up and deliver packages, supplies, documents, and other items.\n\tHelp keep tasks, appointments, and responsibilities organized.\n\tCommunicate updates regarding completed and outstanding assignments.\n\tFollow instructions carefully and ensure tasks are completed accurately.\n\tPrioritize assignments based on urgency and scheduling needs.\n\tAssist with additional responsibilities as needed.\n\tMaintain the provided work vehicle responsibly while in use.\n\nQualifications\n\n\tValid driver's license required.\n\tMust be a safe and responsible driver.\n\tComfortable driving throughout Brooklyn and surrounding areas.\n\tReliable, punctual, and dependable.\n\tStrong organizational and time-management skills.\n\tAbility to work independently and take initiative.\n\tGood communication and follow-up skills.\n\tComfortable handling a variety of tasks and changing priorities.\n\tProfessional and responsible when handling errands and assignments."}, {"id": "26686", "title": "Babysitter/Nanny", "bhTitle": "Babysitter/Nanny", "category": "Education & Childcare", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-08-25", "exp": "2026-11-25", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\nSchedule: 6–8 Hours Per Day, 2–3 Days Per Week\n\nPosition Overview\n\nA family in Brooklyn, NY is seeking a caring, reliable, and responsible Babysitter/Nanny to provide attentive care for their 6-week-old infant.\n\nThe ideal candidate is comfortable caring for a newborn and can provide hands-on support with feeding routines, bathing, naps, developmental activities, and other daily needs. Light meal preparation assistance would also be appreciated.\n\nKey Responsibilities\n\n\tProvide attentive and nurturing care for a 6-week-old infant.\n\tAssist with bathing and general newborn care.\n\tTake the baby for walks as appropriate.\n\tProvide supervised, age-appropriate tummy time.\n\tFollow the baby's established feeding and nap routines.\n\tMaintain a daily log of feedings, diaper changes, naps, and other important information.\n\tChange diapers and keep the baby clean and comfortable.\n\tHelp soothe and settle the baby for naps.\n\tEngage in appropriate interaction and developmental activities.\n\tMaintain a clean, safe, and organized environment for the baby.\n\tClean and organize bottles and baby-related items as needed.\n\tAssist with light meal preparation when time allows.\n\tCommunicate clearly with parents regarding the baby's day, routines, and any concerns.\n\nQualifications\n\n\tPrevious newborn or infant childcare experience strongly preferred.\n\tComfortable caring for a 6-week-old baby.\n\tKnowledge of basic newborn routines and safety.\n\tCaring, patient, attentive, and dependable.\n\tStrong communication skills.\n\tAbility to follow the family's routines and instructions.\n\tOrganized and comfortable maintaining daily care logs.\n\tReliable and punctual.\n\tChildcare references preferred."}, {"id": "26684", "title": "Content Creator", "bhTitle": "Social Media Manager", "category": "E-commerce, Marketing & Social Media", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-08-25", "exp": "2026-11-25", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\nSchedule: Approximately 10 Hours Per Week – Flexible, Hours Vary by Week\n\nPosition Overview\n\nA Brooklyn-based organization is seeking a creative and reliable Content Creator / Video Editor to assist with filming and producing engaging social media content.\n\nThis is a flexible, part-time opportunity for someone with a strong eye for content and visual storytelling who is comfortable filming high-quality content using an iPhone and editing videos for social media.\n\nThe position is approximately 10 hours per week, although hours may vary depending on the week's content needs. Much of the work can be completed independently and on a flexible schedule.\n\nKey Responsibilities\n\n\tFilm high-quality photo and video content using an iPhone.\n\tCreate engaging short-form content for social media.\n\tEdit videos into polished, ready-to-post content.\n\tSelect strong shots, clips, angles, and moments from raw footage.\n\tAdd appropriate transitions, text, music, and other editing elements.\n\tHelp develop creative ideas and concepts for new content.\n\tMaintain a consistent and professional visual style.\n\tOrganize raw footage and completed content.\n\tComplete editing assignments independently and within agreed-upon deadlines.\n\tStay aware of current social media content styles and trends.\n\tCollaborate on content needs while bringing creative ideas to the table.\n\nQualifications\n\n\tStrong eye for visual content, composition, and storytelling.\n\tComfortable filming professional-looking content with an iPhone.\n\tVideo editing skills required.\n\tFamiliarity with editing platforms such as CapCut, Adobe Premiere Pro, Final Cut Pro, or similar software is a plus.\n\tUnderstanding of short-form social media content.\n\tCreative and detail-oriented.\n\tAble to work independently and manage time effectively.\n\tReliable and responsive when coordinating projects.\n\tPrevious content creation, social media, photography, or video experience is preferred.\n\tPortfolio or examples of previous content are a plus."}, {"id": "26683", "title": "School Driver", "bhTitle": "Driver", "category": "Warehouse, Driving & Logistics", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-25", "exp": "2026-11-25", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday through Thursday – 9:00 AM Drop-Off & 3:25 PM Pick-Up Friday 9am drop off and 12:15 pick up.\n\nPosition Overview\n\nA school in Brooklyn, NY is seeking a reliable and responsible School Driver to provide safe and dependable transportation for students.\n\nKey Responsibilities\n\n\tProvide reliable transportation for students to and from school.\n\tFollow designated routes and schedules.\n\tEnsure students enter and exit the vehicle safely.\n\tMaintain punctual and dependable attendance.\n\tFollow all applicable traffic and transportation safety requirements.\n\tMaintain a clean and safe vehicle.\n\tCommunicate professionally regarding scheduling or transportation issues.\n\tNotify the appropriate contact promptly of unexpected delays or emergencies.\n\tPrioritize student safety throughout every trip.\n\nQualifications\n\n\tValid driver's license and clean driving record.\n\tSafe and responsible driving habits.\n\tReliable and punctual.\n\tProfessional and courteous demeanor.\n\tAbility to consistently follow the required morning and afternoon schedule."}, {"id": "26682", "title": "Intake Coordinator", "bhTitle": "Intake", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-25", "exp": "2026-11-25", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time, In-Person\n\nPosition Overview\n\nA growing organization in Brooklyn, NY is seeking a motivated and personable Intake Coordinator to join its team. This is an excellent opportunity for someone who enjoys working with people and wants to be part of a supportive, collaborative, and professional office environment.\n\nThe Intake Coordinator will work directly with clients, assist with the intake process, and ensure required documentation is completed accurately and efficiently.\n\nKey Responsibilities\n\n\tConnect and coordinate with clients on a daily basis.\n\tBuild professional and supportive relationships with clients.\n\tGuide clients through the intake process from initial contact through completion.\n\tAssist clients with completing required forms and documentation.\n\tReview paperwork for accuracy and completeness.\n\tPrepare and submit documentation accurately and efficiently.\n\tFollow up with clients regarding missing information or required documents.\n\tMaintain organized and accurate client records.\n\tCommunicate professionally with clients and internal team members.\n\tHelp ensure a smooth and positive client experience throughout the intake process.\n\tSupport general administrative and intake-related responsibilities as needed.\n\tMaintain appropriate confidentiality when handling client information.\n\nQualifications\n\n\tExcellent verbal and written communication skills.\n\tStrong attention to detail and organizational abilities.\n\tProfessional and personable communication style.\n\tAbility to work effectively in a collaborative team environment.\n\tStrong follow-up and time-management skills.\n\tComfortable communicating directly with clients.\n\tAbility to manage multiple responsibilities and priorities.\n\tDependable, organized, and able to work independently when needed.\n\tPrevious intake, administrative, customer service, healthcare, or client services experience is preferred but not required.\n\tComfortable learning new systems and office procedures."}, {"id": "26681", "title": "Controller", "bhTitle": "Controller", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-24", "exp": "2026-11-04", "desc": "Industry: Real Estate Syndication & Private Lending\nEmployment Type: Full-Time\nCompany is a diversified financial services company engaged in real estate syndication and private lending. We manage complex real estate investment structures and provide tailored lending solutions for investors and borrowers.\nWe are seeking a Controller to oversee the financial operations of both our real estate and lending divisions. This role will be responsible for accounting, financial reporting, cash flow management, and coordinating with internal staff and external partners.\n\nKey Responsibilities\nReal Estate Syndication\n\n\tMaintain and create QuickBooks files for new real estate deals.\n\tManage quarterly investor distributions through TD Bank and Valley National Bank, including preparing and performing waterfall distributions.\n\tAccount for Construction-in-Process projects, including QuickBooks entries and cash flow management.\n\tOversee accounts payable and receivable, coordinating with staff to ensure accurate recording in trackers and ledgers.\n\tCollect funds and investor contributions for new syndications.\n\nLending Division\n\n\tMaintain QuickBooks for the lending company, including journal entries and reconciliations.\n\tUpdate and manage ledgers tracking partner investments and balances.\n\tPrepare and issue 1099-INT forms for external partners.\n\tManage cash flow for the lending fund, including oversight of the company's line of credit with the bank.\n\tCoordinate with staff to draft and finalize lending contracts.\n\tPrepare monthly lending reports utilizing QuickBooks.\n\tCreate and send monthly interest payments to lending partners, along with preparing and distributing partner statements.\n\nGeneral Company-Wide Duties\n\n\tCoordinate with CPA to prepare and file tax returns for all company entities.\n\tManage and train staff (both entry-level and mid-level employees).\n\tOversee accounts receivable and accounts payable for the company's general operations, including office salaries and expenses.\n\nQualifications\n\n\tBachelor's degree in Accounting and a CPA.\n\tMinimum 5+ years of accounting or controller experience, preferably in real estate, lending, or investment management.\n\tStrong proficiency in QuickBooks and Microsoft Excel.\n\tExperience managing cash flow, AP/AR, and banking relationships.\n\tKnowledge of tax compliance and experience preparing financial reports.\n\tAbility to train and manage staff and work collaboratively across teams.\n\tStrong attention to detail, organizational skills, and ability to manage multiple priorities."}, {"id": "26680", "title": "School Nurse", "bhTitle": "Nurse", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-24", "exp": "2026-11-24", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nA school in Brooklyn, NY is seeking a caring, responsible, and professional School Nurse to join its team. The School Nurse will be responsible for supporting the health and well-being of students throughout the school day and responding appropriately to medical needs as they arise.\n\nKey Responsibilities\n\n\tProvide basic nursing care to students during the school day.\n\tAssess students who become sick or injured and determine appropriate next steps.\n\tAdminister medications in accordance with physician orders, parental authorization, and school policies.\n\tProvide first aid and respond to medical situations as needed.\n\tMaintain accurate and confidential student health records.\n\tCommunicate with parents or guardians regarding student health concerns when appropriate.\n\tMonitor students with allergies, asthma, diabetes, and other documented medical needs.\n\tMaintain and organize medications, first-aid supplies, and nursing office materials.\n\tAssist with health screenings and required school health documentation.\n\tFollow established health, safety, confidentiality, and emergency procedures.\n\tCollaborate with teachers, administrators, parents, and healthcare providers as appropriate.\n\tHelp promote a safe and healthy school environment.\n\nQualifications\n\n\tPrevious nursing experience required.\n\tSchool, pediatric, family medicine, or related nursing experience preferred.\n\tCurrent CPR/BLS certification preferred.\n\tStrong assessment and decision-making skills.\n\tExcellent communication and interpersonal skills.\n\tCaring, patient, responsible, and dependable.\n\tStrong organizational and documentation skills.\n\tAbility to respond calmly and professionally to medical situations.\n\tAbility to maintain appropriate confidentiality regarding student health information."}, {"id": "26679", "title": "Assistant Teacher for girl's school", "bhTitle": "Teacher Assistant", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-24", "exp": "2026-11-24", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nA primary school in Brooklyn, NY is seeking Assistant Teachers for the upcoming school year. This is a great opportunity to join a warm, welcoming school environment and work alongside experienced educators while supporting students throughout their school day.\n\nThe ideal candidate is responsible, patient, dependable, and enjoys working with children.\n\nKey Responsibilities\n\n\tAssist the lead teacher with daily lessons and classroom activities.\n\tProvide individual and small-group support to students as needed.\n\tHelp students stay engaged and focused throughout the school day.\n\tAssist with preparing classroom materials, activities, and projects.\n\tSupport classroom routines, transitions, and daily schedules.\n\tHelp maintain a safe, organized, and positive learning environment.\n\tProvide appropriate supervision and assistance to students.\n\tWork collaboratively with teachers, administration, and other school staff.\n\tAssist with classroom organization and general classroom needs.\n\tProvide additional support as directed by the lead teacher.\n\nQualifications\n\n\tInterest in working with primary school-aged children.\n\tPrevious classroom, tutoring, childcare, or educational experience is preferred but not required.\n\tPatient, responsible, and dependable.\n\tStrong communication and interpersonal skills.\n\tAbility to work well as part of a classroom team.\n\tOrganized and able to follow established classroom routines.\n\tPositive attitude and willingness to learn.\n\tCommitment to creating a supportive environment for students."}, {"id": "26677", "title": "On-Camera Livestream Host", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-08-24", "exp": "2026-11-24", "desc": "Location: New York, NY\nEmployment Type: Part-Time, with Opportunity to Grow into Full-Time\nSchedule: Stable Part-Time Hours – Schedule to Be Discussed\n\nPosition Overview\n\nA growing jewelry company in New York City is building its live-commerce team and seeking an engaging On-Camera Livestream Host to showcase and sell jewelry and accessories through Whatnot and other livestreaming platforms.\n\nThis is an excellent opportunity for someone interested in jewelry, fashion, e-commerce, social media, entertainment, or live selling. Previous livestreaming experience is a plus but is not required for the right candidate.\n\nKey Responsibilities\n\n\tHost engaging, high-energy livestream shopping shows on Whatnot and other platforms.\n\tShowcase and sell jewelry and accessories in an authentic and compelling way.\n\tPresent product features, styles, and details clearly to viewers.\n\tInteract with viewers in real time and answer questions throughout livestreams.\n\tBuild relationships with viewers and help develop a loyal online community.\n\tKeep livestreams entertaining, professional, and focused on generating engagement and sales.\n\tLearn the company's products and develop strong verbal and visual presentation skills.\n\tPromote upcoming livestreams and company channels through social media.\n\tCollaborate with the team to plan shows, featured products, promotions, and special events.\n\tStay aware of livestreaming and social media trends that could improve audience engagement.\n\tAssist with additional live-commerce initiatives as the department grows.\n\nQualifications\n\n\tComfortable speaking and presenting on camera.\n\tStrong communication and interpersonal skills.\n\tAble to engage naturally with an online audience.\n\tComfortable thinking on your feet and responding to viewers in real time.\n\tInterest in jewelry, fashion, accessories, social media, entertainment, e-commerce, or sales.\n\tReliable, professional, and comfortable working as part of a team.\n\tAbility to learn product information and communicate it clearly to customers.\n\tPrevious experience with Whatnot, TikTok, Instagram, livestreaming, sales, social media, or hosting is a plus but not required."}, {"id": "26676", "title": "Head Teacher", "bhTitle": "Teacher", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-24", "exp": "2026-11-24", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday through Thursday 9:00 AM–3:00 PM, Friday 9:00 AM–1:00PM\n\nPosition Overview\n\nA new and growing preschool in Brooklyn, NY is seeking a warm, energetic, and responsible Head Teacher to lead a classroom of 3-year-old children.\n\nWe are looking for someone who truly loves working with young children and is excited about creating a nurturing, engaging, and positive classroom environment. This is an excellent opportunity for an enthusiastic educator who wants to play an important role in helping build and develop a wonderful new preschool program.\n\nKey Responsibilities\n\n\tLead the daily classroom experience for a class of 3-year-old children.\n\tCreate a loving, safe, structured, and happy classroom environment.\n\tPlan and lead age-appropriate lessons, activities, crafts, and learning experiences.\n\tLead circle time, songs, stories, games, and interactive activities.\n\tTeach basic preschool skills, routines, and classroom expectations.\n\tEncourage children's social, emotional, cognitive, and developmental growth.\n\tHelp children develop independence and positive classroom habits.\n\tProvide patient and attentive support to each child's individual needs.\n\tMaintain an organized, engaging, and developmentally appropriate classroom.\n\tCommunicate warmly and professionally with parents regarding their children's experiences and progress.\n\tWork closely with classroom assistants and provide appropriate guidance and direction.\n\tCollaborate with preschool administration on curriculum, programming, and classroom needs.\n\tHelp plan special activities, projects, and classroom events.\n\tMaintain a positive attitude and bring creativity and enthusiasm into the classroom each day.\n\nQualifications\n\n\tPrevious experience working with preschool-aged children preferred.\n\tHead teacher, preschool teacher, early childhood, daycare, or similar classroom experience is a plus.\n\tGenuine love for working with young children.\n\tWarm, patient, nurturing, and energetic personality.\n\tStrong classroom leadership and management abilities.\n\tCreative and comfortable developing engaging activities for 3-year-olds.\n\tStrong communication and interpersonal skills.\n\tAbility to communicate professionally and positively with parents.\n\tDependable, responsible, and organized.\n\tAbility to work collaboratively with assistants and school administration.\n\tComfortable taking ownership of the classroom and daily routines.\n\tExcited to contribute ideas and help develop a growing preschool program."}, {"id": "26675", "title": "Whatnot Seller Opportunity", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-08-21", "exp": "", "desc": "Looking for a Whatnot seller who wants flexible hours and enjoys selling across assorted categories!\n\n\tVery flexible schedule\n\tAssorted product categories\n\tGreat opportunity for someone energetic and comfortable going live\n\tExperience with Whatnot selling is a plus\n\tPart-time/ full time or flexible hours available"}, {"id": "26674", "title": "Job Title: Office Support (Construction Experience Preferred)", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-08-21", "exp": "2026-11-20", "desc": "Location: Ocean, NJ\nJob Type: Full-Time\nSchedule: Regular Office Hours\n\nWe are seeking a detail oriented Office Support specialist to assist our project managers and superintendents with daily administrative tasks. The ideal candidate will handle documentation, vendor communications, and project tracking to ensure smooth workflow across multiple construction projects.\n\nKey Responsibilities:\n\n\tSupport project managers and superintendents with day to day administrative tasks.\n\n\tProcess purchase orders, subcontractor invoices, and vendor communications.\n\n\tMaintain project files, permits, contracts, and change orders.\n\n\tAssist with scheduling, RFIs, and submittal tracking.\n\n\tAnswer phones, manage correspondence, and greet clients and vendors.\n\nQualifications:\n\n\tFamiliarity with construction terminology and workflow strongly preferred.\n\n\tExperience with construction software like Buildertrend, Procore, or QuickBooks is a plus.\n\n\tHighly organized and detail oriented.\n\n\tComfortable juggling multiple projects and priorities at once.\n\nWhat We Offer:\n\n\tA collaborative and supportive office environment.\n\n\tOpportunity to work closely with experienced project leaders."}, {"id": "26673", "title": "Job Title: Site Superintendent", "bhTitle": "Construction", "category": "Warehouse, Driving & Logistics", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-08-21", "exp": "2026-11-20", "desc": "Location: Ocean, NJ\nJob Type: Full-Time\nSchedule: Standard Construction Hours\n\nWe are seeking an experienced Site Superintendent to oversee day-to-day operations on custom home job sites for high-end, single-family residential projects. The ideal candidate will manage sub-contractors, track timelines, ensure strict quality standards, and serve as the primary on-site liaison for clients, architects, and inspectors.\n\nKey Responsibilities:\n\n\tOversee day to day operations on custom home job sites for single family, high end residential builds.\n\n\tCoordinate and schedule subcontractors, trades, and material deliveries.\n\n\tEnsure work meets quality standards, plans and specs, and local building codes.\n\n\tManage job site safety compliance and daily site logs.\n\n\tServe as primary on site point of contact for clients, architects, and inspectors.\n\n\tTrack project timelines and flag or resolve delays and issues proactively.\n\nQualifications:\n\n\t5+ years of experience in custom or high end residential construction preferred.\n\n\tStrong communication and leadership skills with the ability to manage multiple trades at once.\n\n\tValid driver's license and reliable transportation between sites.\n\nWhat We Offer:\n\n\tA supportive and professional team environment.\n\n\tOpportunities to manage high end, custom residential projects."}, {"id": "26670", "title": "Sales Representative", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-21", "exp": "2026-11-23", "desc": "Location: New York, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nA growing consumer products company specializing in beauty and home fragrance products is seeking an experienced, ambitious, and energetic Sales Representative to join its team.\n\nWe are looking for a driven salesperson with proven sales experience who understands how to build relationships, open accounts, and generate meaningful revenue. This is a strong opportunity for someone who wants significant earning potential and the ability to grow alongside an expanding business.\n\nKey Responsibilities\n\n\tDevelop and grow sales across beauty and home fragrance categories.\n\tProspect and open new retail, wholesale, and distribution accounts.\n\tBuild strong, long-term relationships with buyers and key decision-makers.\n\tPresent products, collections, and new programs to prospective customers.\n\tManage existing accounts while identifying opportunities to increase sales.\n\tConsistently follow up with buyers, prospects, and existing customers.\n\tNegotiate pricing, programs, and sales opportunities as appropriate.\n\tIdentify new customers, markets, and business opportunities.\n\tMaintain an active sales pipeline and track opportunities from initial outreach through closing.\n\tWork closely with leadership on sales strategy and account development.\n\tStay informed about market trends, competitors, and opportunities within the beauty and home fragrance categories.\n\tMeet and exceed established sales and revenue goals.\n\nQualifications\n\n\tProven sales experience required.\n\tWholesale or consumer products sales experience strongly preferred.\n\tExperience selling beauty, fragrance, home fragrance, personal care, or related consumer products is a major plus.\n\tExisting relationships with retail buyers or wholesale accounts are highly desirable.\n\tStrong track record of developing new business and closing accounts.\n\tExcellent communication, presentation, and negotiation skills.\n\tConfident prospecting and reaching out to new buyers.\n\tStrong relationship-building and account-management abilities.\n\tHighly motivated, competitive, and results-driven.\n\tExcellent follow-up and organizational skills.\n\t ambitious, energetic, and hungry to grow within the business.\n\tComfortable working independently and taking ownership of sales performance."}, {"id": "26668", "title": "Brand Manager", "bhTitle": "ECommerce Manager", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-20", "exp": "2026-11-20", "desc": "Location: New York, NY\nEmployment Type: Full-Time\n\nPosition Overview\n\nA fast-growing apparel and e-commerce company specializing in children's and women's sleepwear is seeking a hands-on Brand Manager to help manage and grow its e-commerce business.\n\nWe are looking for an ambitious, and highly motivated professional with 1–5 years of e-commerce experience who is eager to grow with the company and work directly alongside the founder.\n\nThe ideal candidate understands how digital advertising, product listings, inventory, reporting, merchandising, and overall product performance work together. This is an excellent opportunity for someone early in their e-commerce career who wants significant responsibility and the opportunity to grow into a trusted right-hand role.\n\nKey Responsibilities\n\nE-Commerce Advertising\n\n\tManage and optimize digital advertising campaigns across product lines.\n\tReview search and performance reports to identify opportunities for growth.\n\tMonitor advertising spend and eliminate inefficient or wasteful spending.\n\tAdjust bids, budgets, targeting, and campaign strategies based on performance.\n\tMaintain clean and organized campaign structures.\n\tTrack advertising efficiency and key performance metrics.\n\tIdentify opportunities to improve advertising performance, sales, and profitability.\n\nListings & Catalog Management\n\n\tCreate and optimize product titles, descriptions, bullet points, keywords, and enhanced content.\n\tMaintain accurate size charts, fit guides, product attributes, and listing information.\n\tManage product variations, new SKUs, and catalog updates.\n\tResolve catalog and product-information issues.\n\tConduct keyword, product, and competitive research.\n\tSupport new product launches and listing creation.\n\tMaintain accurate and consistent product information across e-commerce channels.\n\nReporting & Analysis\n\n\tPrepare weekly and monthly reports covering sales, advertising spend, margins, and performance by SKU.\n\tAnalyze returns, sales velocity, inventory health, and product performance.\n\tIdentify potential issues before they become larger problems.\n\tTranslate large datasets into clear and actionable recommendations.\n\tProvide concise updates to the founder regarding performance and recommended next steps.\n\tUse e-commerce data to support inventory, advertising, and product decisions.\n\nInventory & Product Support\n\n\tAssist with purchase order quantities by size, colorway, and SKU.\n\tTrack inbound inventory and current stock levels.\n\tMonitor inventory health and identify potential stockouts or excess inventory.\n\tSupport new product launches from initial specifications through live listings.\n\tAnalyze historical sales and inventory data to support purchasing decisions.\n\tCollaborate directly with the founder on product and assortment decisions.\n\nQualifications\n\n\t1–5 years of professional e-commerce experience required.\n\tHands-on experience managing e-commerce advertising campaigns and product listings.\n\tStrong understanding of digital advertising, product optimization, inventory, and online sales.\n\tStrong Microsoft Excel skills, including pivot tables and lookups.\n\tComfortable working with large datasets and reports containing tens of thousands of rows.\n\tExperience with e-commerce analytics, keyword research, or product research tools preferred.\n\tStrong understanding of e-commerce sales, advertising, inventory, and product performance.\n\tExcellent attention to detail and accuracy.\n\tStrong analytical and problem-solving abilities.\n\tClear and concise written communication.\n\tHighly organized and capable of managing multiple priorities.\n\tYoung, ambitious, energetic, and eager to build a career in e-commerce.\n\tComfortable working directly with the founder and receiving hands-on feedback and guidance.\n\tEager to take on increasing responsibility as the business grows."}, {"id": "26667", "title": "Career Counselor", "bhTitle": "Case Manager", "category": "Healthcare & Human Services", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-08-20", "exp": "2027-01-04", "desc": "Location: Crown Heights, Brooklyn, NY\nEmployment Type: Part-Time\nSchedule: Approximately 4 Hours Per Day\nIndustry: Nonprofit\n\nPosition Overview\n\nA nonprofit organization in Crown Heights, Brooklyn is seeking a compassionate, knowledgeable, and experienced Career Counselor to provide career guidance and workforce support to young women transitioning from seminary into the workforce.\n\nThis is a meaningful opportunity for a professional who enjoys mentoring young adults and helping them identify their strengths, explore career options, and develop practical plans for entering the workforce.\n\nThe ideal candidate has experience in career counseling, workforce development, recruiting, human resources, or a related field and maintains a strong understanding of today's job market and hiring practices.\n\nKey Responsibilities\n\n\tMeet one-on-one with participants to discuss career interests, strengths, skills, and professional goals.\n\tHelp participants identify career paths that align with their interests and abilities.\n\tDevelop realistic and achievable career and employment plans.\n\tEducate participants about different industries, positions, and professional opportunities.\n\tProvide guidance throughout the job-search process.\n\tAssist with resume development and improvement.\n\tHelp participants prepare for interviews and develop strong interviewing skills.\n\tProvide guidance on workplace expectations, professional communication, and appropriate workplace conduct.\n\tHelp participants develop confidence as they transition into professional environments.\n\tStay informed about current employment trends, hiring practices, and career opportunities.\n\tProvide practical guidance on navigating today's job market.\n\tBuild supportive and encouraging relationships with participants.\n\tMonitor progress and provide continued guidance as participants work toward their career goals.\n\tCollaborate with nonprofit staff to support participants and strengthen career programming.\n\tConnect participants with appropriate employment opportunities and professional resources when available.\n\nQualifications\n\n\tRelevant experience in career counseling, workforce development, recruiting, human resources, employment services, or a related field.\n\tStrong understanding of the current job market and hiring practices.\n\tExperience providing career guidance, mentorship, or professional development support.\n\tStrong knowledge of resume writing, interviewing, and job-search strategies.\n\tExcellent interpersonal and communication skills.\n\tPersonable, approachable, patient, and encouraging.\n\tAbility to build positive relationships with young adults.\n\tStrong listening skills and ability to understand each participant's individual goals and circumstances.\n\tAbility to provide practical and realistic career guidance.\n\tOrganized, dependable, and able to work independently.\n\tComfortable collaborating with a nonprofit team.\n\tExperience working with young adults is a plus.\n\tUnderstanding of the transition from seminary into the professional workforce is strongly preferred."}, {"id": "26666", "title": "Live Selling Host – Part-Time to Full-Time", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-08-20", "exp": "", "desc": "We are looking for outgoing, energetic, and personable individuals to host live shopping events and help grow our online kids clothing store.\n\nResponsibilities:\n\n\tHost live sales on Whatnot\n\tPresent products and interact with customers\n\tAnswer questions and create an engaging shopping experience\n\tHelp drive sales and grow our online presence\n\tBe comfortable and confident on camera\n\nIdeal Candidate:\n\n\tFun, outgoing, and energetic personality\n\tComfortable speaking on camera\n\tStrong communication and people skills\n\tSocial-media savvy\n\tReliable and flexible with scheduling\n\tSales-oriented and motivated\n\nSchedule & Compensation:\n\n\tPart-time to start with varying hours\n\tPotential to grow into a full-time position"}, {"id": "26664", "title": "Merchandising & Product Intern", "bhTitle": "Merchandising", "category": "E-commerce, Marketing & Social Media", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-08-20", "exp": "2026-11-20", "desc": "Location: New York, NY\nEmployment Type: Part-Time\nSchedule: Minimum 3 Days Per Week In-Office\n\nPosition Overview\n\nA growing premium fashion brand in New York, NY is seeking a motivated and detail-oriented Merchandising & Product Intern to support its merchandising and product team.\n\nThis is a hands-on opportunity for someone interested in the fashion, retail, merchandising, and product development industries. The intern will gain direct exposure to how a fashion company plans assortments, develops new products, manages inventory, analyzes sales performance, and brings products from concept to market.\n\nThe ideal candidate has a strong eye for fashion, enjoys working with both creative and analytical information, and is highly organized and eager to learn.\n\nKey Responsibilities\n\n\tSupport the merchandising team with assortment planning and product organization.\n\tCreate, update, and maintain line sheets and product trackers.\n\tResearch fashion, retail, market, and competitor trends.\n\tIdentify emerging trends and product opportunities that may influence future assortment decisions.\n\tAssist with sample management and maintain organized product samples.\n\tSupport fit reviews and help coordinate samples throughout the development process.\n\tAssist with preparation for product photography and content shoots.\n\tMaintain and update product information across internal systems, including pricing, inventory, descriptions, and other product details.\n\tHelp coordinate product development and launch timelines between merchandising, design, production, and marketing teams.\n\tTrack important deadlines and follow up on outstanding product-related items.\n\tReview sell-through and inventory reports.\n\tAssist the team in analyzing product performance to support reorder and markdown decisions.\n\tHelp maintain accurate and organized merchandising and product records.\n\tSupport new product launches and seasonal collection development.\n\tAssist with additional merchandising and product-related projects as needed.\n\nQualifications\n\n\tGenuine passion for fashion, retail, merchandising, and product development.\n\tStrong interest in the business side of the fashion industry.\n\tHighly organized with exceptional attention to detail.\n\tComfortable working with numbers, spreadsheets, and product data.\n\tProficiency with Microsoft Excel and/or Google Sheets.\n\tStrong written and verbal communication skills.\n\tAbility to collaborate effectively across merchandising, design, production, and marketing teams.\n\tAbility to manage multiple assignments and deadlines.\n\tFast learner with a proactive and positive attitude.\n\tAvailable to work from the New York City office a minimum of three days per week.\n\tCurrently enrolled in or recently graduated from a merchandising, fashion business, retail management, or related program preferred.\n\tCandidates with equivalent relevant experience are also encouraged to apply.\n\nPreferred Skills\n\n\tPrevious internship or retail experience within the fashion industry.\n\tFamiliarity with PLM, ERP, or inventory management systems.\n\tExperience with Shopify or another e-commerce platform.\n\tUnderstanding of fashion merchandising and assortment planning.\n\tStrong eye for trend forecasting, styling, and product curation.\n\tInterest in analyzing sales and inventory performance.\n\tFamiliarity with the fashion product lifecycle from concept through launch."}, {"id": "26663", "title": "Business Leader / Amazon Guru", "bhTitle": "ECommerce Manager", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-08-20", "exp": "2026-11-05", "desc": "If you are an Amazon \"guru\" who loves building, optimizing, solving problems, and seeing measurable results, this could be a major career opportunity. Location:  Bergen County, NJ\n\nA rapidly growing consumer brand is seeking a smart, resourceful, and highly motivated Amazon expert to take ownership of its Amazon business.\n\nThis is a high-impact leadership opportunity for someone who understands Amazon inside and out and can take an established business to the next level.\n\nTHE ROLE\n\nYou will lead and manage the company's Amazon business, with responsibility for driving growth, optimizing performance, and identifying new opportunities.\n\nWe are looking for someone who is:\n\n\tAn Amazon expert with deep knowledge of Seller Central\n\tHighly analytical and commercially minded\n\tSmart, resourceful, and entrepreneurial\n\tA strong problem-solver who can figure things out and get results\n\tComfortable taking ownership and working independently\n\tExperienced with Amazon advertising, listings, promotions, inventory, analytics, and marketplace strategy\n\tA natural leader who can work cross-functionally and drive initiatives from idea to execution\n\nWHY THIS OPPORTUNITY?\n\nThis is more than an Amazon management position. You will have significant e opportunity to make a real impact on the growth of the business."}, {"id": "26662", "title": "School Paraprofessional", "bhTitle": "Shadow/ Paraprofessional", "category": "Education & Childcare", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-08-19", "exp": "2026-11-19", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\nSchedule: Monday–Thursday: 9:00 AM–1:00 PM\n\nPosition Overview\n\nA family in Brooklyn, NY is seeking a caring, responsible, and dependable Paraprofessional to provide one-on-one support for their son, who will be entering 1st grade for the upcoming school year. All Male environment.\n\nThe student currently requires support Monday through Thursday from9:00 AM–1:00 PM.\n\nKey Responsibilities\n\n\tProvide one-on-one support to a 1st-grade student during the school day.\n\tAssist the student with remaining focused, engaged, and successful in the classroom.\n\tSupport the student in following classroom routines, instructions, and transitions.\n\tProvide encouragement and individualized assistance with classroom activities.\n\tHelp reinforce appropriate classroom behavior and positive social interactions.\n\tAssist the student with organization and completion of age-appropriate tasks.\n\tWork collaboratively with the classroom teacher and other school staff.\n\tHelp the student develop greater confidence and independence.\n\tProvide calm, patient, and consistent support throughout the assigned hours.\n\tCommunicate appropriately with the family and relevant school staff regarding the student's day and progress.\n\tMaintain professionalism, discretion, and appropriate boundaries at all times.\n\nQualifications\n\n\tWarm, patient, responsible, and dependable.\n\tComfortable working one-on-one with an elementary school-aged child.\n\tStrong communication and interpersonal skills.\n\tAbility to follow guidance from teachers, parents, and other professionals.\n\tAttentive and able to provide consistent support in a classroom setting.\n\tReliable and punctual with a commitment to maintaining the agreed-upon schedule.\n\tPrevious experience working with children is preferred but not necessarily required.\n\tExperience as a paraprofessional, teacher's assistant, counselor, tutor, or similar role is a plus.\n\tCollege students and candidates seeking a consistent morning position are encouraged to apply."}, {"id": "26661", "title": "Board Certified Behavior Analyst (BCBA/LBA)", "bhTitle": "Behavior Specialist", "category": "Healthcare & Human Services", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-08-19", "exp": "2026-11-19", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time or Full-Time\nClassification: W-2 Employee\n\nPosition Overview\n\nA growing behavioral services organization in Brooklyn, NY is seeking an approachable, clinically strong, and highly professional Board Certified Behavior Analyst (BCBA/LBA) to develop and oversee individualized services, supervise BTs and RBTs, coach caregivers, analyze clinical data, and support meaningful client outcomes.\n\nThe ideal candidate combines strong clinical judgment with excellent communication, leadership, and organizational skills. All services must remain within the clinician's professional license, certification, competence, authorization, and applicable organizational policies.\n\nKey Responsibilities\n\n\tConduct comprehensive assessments and develop individualized, medically necessary treatment plans.\n\tEstablish meaningful and measurable treatment goals based on client needs, assessment results, and appropriate consent.\n\tAnalyze clinical and behavioral data to evaluate client progress and treatment effectiveness.\n\tModify treatment plans and interventions based on objective outcomes, clinical judgment, and client response.\n\tMaintain ongoing oversight of assigned caseloads and ensure services remain clinically appropriate.\n\tSupervise Behavior Technicians (BTs) and Registered Behavior Technicians (RBTs) through direct observation, modeling, feedback, and competency support.\n\tProvide ongoing clinical guidance, coaching, and professional development to direct-care staff.\n\tMaintain accurate documentation of supervision and clinical activities.\n\tProvide caregiver coaching and education to support consistency and meaningful progress outside of direct sessions.\n\tCollaborate with authorized schools, healthcare professionals, service providers, and other members of the client's care team when appropriate.\n\tReview client progress regularly and identify opportunities to improve treatment outcomes.\n\tComplete treatment plans, progress reports, supervision documentation, incident reports, authorization materials, and other required clinical documentation accurately and on time.\n\tSupport authorization and reauthorization processes as required.\n\tRespond promptly and professionally to clinical, ethical, documentation, and safety concerns.\n\tMaintain appropriate professional and ethical boundaries with clients, families, and staff.\n\tFollow applicable professional ethics, New York State requirements, privacy standards, payer requirements, and organizational policies.\n\nQualifications\n\n\tActive Board Certified Behavior Analyst (BCBA) certification required.\n\tActive and unrestricted New York State Licensed Behavior Analyst (LBA) license in good standing required.\n\tQualifying graduate degree required.\n\tNPI and eligibility for applicable payer credentialing.\n\tRequired professional liability insurance.\n\tStrong clinical assessment and treatment-planning abilities.\n\tExcellent clinical writing and documentation skills.\n\tStrong data-analysis and clinical decision-making abilities.\n\tDemonstrated ability to supervise, coach, and provide constructive feedback to BTs and RBTs.\n\tExcellent written, verbal, and interpersonal communication skills.\n\tStrong organizational and caseload-management abilities.\n\tAbility to work independently while collaborating effectively with caregivers, staff, and other professionals.\n\tRequired background, exclusion, and credentialing screenings must be completed.\n\tExperience working with individuals with autism is preferred.\n\tExperience with clinical authorizations, staff supervision, caregiver coaching, and multidisciplinary coordination is preferred.\n\nRequired Training & Onboarding\n\nCandidates must complete and maintain all required training and professional requirements, which may include:\n\n\tPrivacy and confidentiality training.\n\tFraud, waste, and abuse prevention.\n\tMandated reporting.\n\tSexual harassment prevention.\n\tCultural competency.\n\tIncident reporting and safety procedures.\n\tClinical documentation requirements.\n\tProfessional ethics requirements.\n\tSupervision and competency requirements.\n\tPayer-specific and service-setting training.\n\nPhysical Requirements\n\nWith or without reasonable accommodation, clinicians must be able to observe clients across approved service settings, use required electronic documentation systems, travel to assigned locations when necessary, and respond promptly to clinical or safety needs"}, {"id": "26660", "title": "Registered Behavior Technician", "bhTitle": "Behavior Specialist", "category": "Healthcare & Human Services", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-08-19", "exp": "2026-11-19", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time or Full-Time\nClassification: W-2 Employee\nReports To: Supervising New York Licensed Behavior Analyst / BCBA\n\nPosition Overview\n\nA growing behavioral services organization in Brooklyn, NY is seeking a caring, reliable, and professional Registered Behavior Technician (RBT) to provide direct one-to-one services to clients under ongoing clinical supervision.\n\nThe RBT will follow established treatment protocols, collect accurate data, complete timely documentation, and work collaboratively with clients, caregivers, and the clinical team. This is a supervised position, and the RBT does not practice independently.\n\nKey Responsibilities\n\n\tImplement skill-acquisition and behavior-reduction protocols accurately and within the RBT scope of practice.\n\tProvide direct one-to-one services according to established treatment plans.\n\tFollow written protocols and clinical instructions consistently.\n\tCollect, record, and report accurate client data during sessions.\n\tComplete objective and timely session notes and required documentation.\n\tPrepare materials and resources needed for client sessions.\n\tAssist with delegated assessments, observations, or measurement activities as trained and authorized.\n\tPromote client dignity, choice, assent, and cultural responsiveness.\n\tMaintain appropriate professional boundaries with clients and caregivers.\n\tCommunicate professionally with clients, families, caregivers, supervisors, and other team members.\n\tPromptly report clinical, ethical, safety, or documentation concerns to the supervising LBA/BCBA.\n\tParticipate in required supervision, competency activities, meetings, and ongoing training.\n\tFollow applicable privacy, payer, safety, documentation, and organizational requirements.\n\tMaintain reliable attendance and travel to assigned client locations as required.\n\tAccept and implement feedback and direction from supervising clinicians.\n\nQualifications\n\n\tActive Registered Behavior Technician (RBT) certification in good standing with the BACB required.\n\tHigh school diploma or equivalent required.\n\tMust be at least 18 years of age.\n\tAbility to accurately implement established protocols and collect client data.\n\tComfortable working under ongoing clinical supervision.\n\tAbility to accept feedback and implement supervisor direction.\n\tCaring, patient, dependable, and professional demeanor.\n\tStrong communication and interpersonal skills.\n\tAbility to maintain appropriate professional boundaries.\n\tReliable transportation and ability to travel to assignments as required.\n\tRequired background, exclusion, health, and credentialing clearances must be completed before assignment.\n\tPrevious experience providing behavioral services, working in home or clinic settings, or collaborating with caregivers is preferred.\n\tBilingual skills are a plus.\n\nRequired Training & Onboarding\n\nCandidates must complete and maintain all required training and credentialing, which may include:\n\n\tCompliance and confidentiality training.\n\tCPR and First Aid when applicable.\n\tRequired RBT supervision and competency activities.\n\tSafety and incident-reporting procedures.\n\tDocumentation requirements.\n\tPayer-specific training.\n\tAdditional training required for individual service settings or assignments.\n\nPhysical Requirements\n\nWith or without reasonable accommodation, candidates must be able to perform assigned responsibilities at a child's level, transition between seated and standing positions, model activities, participate appropriately in client programming, and respond promptly to safety needs."}, {"id": "26659", "title": "Café Operator – Rego Park, Queens", "bhTitle": "Restaurant Management", "category": "Restaurant & Food Service", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-19", "exp": "2026-11-12", "desc": "A café located in a residential building in Rego Park, Queens is seeking a Café Operator to run daily operations. This is a great opportunity for someone looking to manage their own hours while building a steady book of business in a built-in residential customer base.\n\nDetails:\n\n\tPay: $19–$25/hour, or revenue share option available\n\tHours: Flexible\n\tLocation: Rego Park, Queens\n\nInterested candidates should reach out to learn more about responsibilities and next steps."}, {"id": "26658", "title": "Behavior Technician", "bhTitle": "Behavior Specialist", "category": "Healthcare & Human Services", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-08-19", "exp": "2026-11-19", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nClassification: W-2 Employee\nReports To: Supervising New York Licensed Behavior Analyst (LBA) / BCBA\n\nPosition Overview\n\nA behavioral health services organization is seeking a dependable, compassionate, and professional Behavior Technician (BT) to provide one-to-one Applied Behavior Analysis (ABA) services under the supervision of a New York Licensed Behavior Analyst (LBA) / BCBA.\n\nThe Behavior Technician will follow established treatment plans, collect accurate data, document sessions, and work directly with clients to support meaningful skill development and greater independence.\n\nThis position is ideal for someone who is patient, reliable, comfortable working directly with children, and interested in developing experience within the ABA field.\n\nKey Responsibilities\n\n\tProvide one-to-one ABA services under the supervision of an LBA/BCBA.\n\tImplement skill-acquisition and behavior-support protocols as written and trained by the supervising clinician.\n\tFollow individualized treatment plans accurately and consistently.\n\tProvide compassionate services while maintaining client dignity and appropriate professional boundaries.\n\tCollect accurate data throughout sessions and maintain complete records of client progress.\n\tComplete objective and timely session documentation.\n\tCommunicate client concerns, behavioral changes, and other relevant observations promptly to the supervising LBA/BCBA.\n\tObtain appropriate clinical approval before making any changes to treatment protocols.\n\tParticipate in required supervision, meetings, and ongoing training.\n\tMaintain reliable attendance and communicate scheduling changes promptly.\n\tFollow established safety, confidentiality, incident-reporting, and documentation procedures.\n\tComply with HIPAA, mandated-reporting requirements, and applicable organizational policies.\n\tRespond appropriately and promptly to client safety needs.\n\nQualifications\n\n\tHigh school diploma or equivalent required.\n\tMust be at least 18 years old.\n\tMust be authorized to work in the United States.\n\tStrong professional and interpersonal communication skills.\n\tPatient, compassionate, dependable, and responsible.\n\tAbility to carefully follow established treatment plans and protocols.\n\tComfortable receiving instruction, supervision, and professional feedback.\n\tStrong attention to detail and ability to maintain accurate documentation.\n\tExperience working with children, individuals with autism, or individuals with developmental disabilities is preferred.\n\tInterest in obtaining Registered Behavior Technician (RBT) certification is welcomed.\n\tRequired background, exclusion, health, and credentialing clearances must be completed before assignment.\n\nRequired Training & Onboarding\n\nCandidates must complete and maintain all required training, which may include:\n\n\tHIPAA and confidentiality.\n\tFraud, waste, and abuse prevention.\n\tMandated reporting.\n\tSexual harassment prevention.\n\tCultural competency.\n\tSafety and incident reporting.\n\tClinical and session documentation.\n\tCPR and First Aid.\n\tAdditional payer-specific or service-setting training as required.\n\nPhysical Requirements\n\nWith or without reasonable accommodation, candidates must be able to perform assigned responsibilities at a child's level, move between seated and standing positions, model activities, participate appropriately in client programming, and respond promptly to safety needs."}, {"id": "26656", "title": "Administrative Assistant", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-08-19", "exp": "", "desc": "We are looking to fill a Bookkeeper/Secretarial position in our company located in Marine Park\nPart time 9:30-2 or 9:30-2:30pm - hours are flexible\nNo Fridays\nNo remote option\nStrong QuickBooks experience\nPayroll\nData entry\nInvoicing\nRemote Landlord- training provided on this program"}, {"id": "26653", "title": "Project Manager", "bhTitle": "Project Manager", "category": "Warehouse, Driving & Logistics", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-08-19", "exp": "2026-11-19", "desc": "Location: Allenhurst, NJ\nJob Type: Full-time\nSchedule: Full-time\n\nSeeking an experienced Project Manager for ground-up multi-family construction projects. This role requires hands-on, field-first leadership to oversee operations from initial groundbreaking through Temporary Certificate of Occupancy (TCO).\n\nKey Responsibilities:\n\n\tOwn the project site from groundbreaking through Temporary Certificate of Occupancy (TCO), providing hands-on, field-first leadership.\n\n\tOversee daily construction operations to ensure work is completed safely, on schedule, and to quality standards.\n\n\tManage subcontractors, monitor performance, and coordinate all on-site activities.\n\n\tDevelop, maintain, and update project schedules to meet key milestones.\n\n\tPrepare and manage monthly draw packages and support project cost tracking.\n\n\tCoordinate with the project team, consultants, and ownership to resolve field issues and maintain project progress.\n\nQualifications:\n\n\tMinimum of 5 years of experience managing ground-up residential or multifamily construction projects.\n\n\tProven experience leading projects from groundbreaking through TCO.\n\n\tStrong knowledge of subcontractor management, project scheduling, and monthly draw processes.\n\n\tExperience with multi-phase developments is required.\n\n\tExperience with both market-rate and affordable housing projects is strongly preferred.\n\n\tExcellent leadership, communication, and problem-solving skills with the ability to manage multiple stakeholders and priorities.\n\nWhat We Offer:\n\n\tOpportunity to lead major ground-up multi-family development projects.\n\n\tProfessional development and collaborative team environment."}, {"id": "26650", "title": "School Driver", "bhTitle": "Driver", "category": "Warehouse, Driving & Logistics", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-08-18", "exp": "2026-11-18", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday–Thursday: 8:30 AM–4:30 PM; Friday: 8:30 AM–12:45 PM\n\nPosition Overview\n\nA school in Brooklyn, NY is seeking a responsible, dependable, and safety-conscious School Driver to provide transportation for a small group of 4–5 elementary school children in grades 2–4.\n\nThe ideal candidate is a safe and cautious driver who is punctual, reliable, patient with children, and committed to providing consistent transportation throughout the school week.\n\nKey Responsibilities\n\n\tSafely transport approximately 4–5 elementary school students in grades 2–4.\n\tProvide reliable transportation according to the school's established schedule.\n\tEnsure students arrive at their destinations safely and on time.\n\tAssist with safe student pickup and drop-off.\n\tMaintain a consistent and dependable daily transportation routine.\n\tEnsure students follow appropriate safety procedures while in the vehicle.\n\tMaintain a clean, safe, and organized vehicle environment.\n\tFollow all applicable traffic laws and passenger safety requirements.\n\tPlan routes appropriately and account for traffic and potential delays.\n\tCommunicate promptly regarding delays, schedule changes, or transportation concerns.\n\tMaintain professional and respectful communication with students, parents, and school staff.\n\tImmediately report any vehicle or safety concerns.\n\nQualifications\n\n\tValid driver's license required.\n\tClean and safe driving record.\n\tResponsible, punctual, and highly dependable.\n\tComfortable transpor
