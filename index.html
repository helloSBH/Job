lifications\n\n\t \tMinimum 1 year of product development experience required.\n\n\t \tBachelor's degree in Business, Fashion, or a related field preferred.\n\n\t \tStrong proficiency in Microsoft Excel required.\n\n\t \tExcellent organizational, administrative, and time-management skills.\n\n\t \tStrong attention to detail and accuracy.\n\n\t \tExcellent written and verbal communication skills.\n\n\t \tAbility to manage multiple projects and deadlines simultaneously.\n\n\t \tComfortable communicating with overseas factories and vendors.\n\n\t \tStrong analytical and problem-solving abilities.\n\n\t \tAbility to work independently while collaborating with multiple departments.\n\n\t \tProactive, dependable, and capable of taking initiative.\n\n\t \tExperience preparing reports, presentations, and maintaining product information.\n\n\t \tAbility to handle confidential business information professionally."}, {"id": "26983", "title": "Senior Sales Executive", "bhTitle": "Sales- Senior Level", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-05", "exp": "2027-02-05", "desc": "Location: Brooklyn, NY (In-Office)\n Job Type: Full-Time\n Schedule: Monday - Friday\n\n We are seeking a high-performing Senior Sales Executive to join our team in Brooklyn. In this role, you will lead top-line growth, develop strategic account relationships, and expand our market presence. The ideal candidate brings a proven track record of driving revenue and managing high-stakes sales pipelines within either the grocer or hardware channel. If you are an ambitious sales leader with deep channel expertise and a hunter mindset, we want to hear from you. Key Responsibilities:\n\n\tDrive end-to-end sales strategy from prospect identification to contract execution and account onboarding.\n\tBuild and maintain strong, long-term relationships with key buyers, distributors, and decision-makers in the grocer or hardware sectors.\n\tMeet and exceed key sales targets, revenue quotas, and account growth metrics.\n\tStore shop, analyze market trends, customer needs, and competitive dynamics to identify new commercial opportunities.\n\tCollaborate closely with internal teams to align inventory, logistics, and product offerings with client demand.\n\tDeliver accurate sales forecasts and maintain pipeline visibility for executive management.\n\n  Qualifications:\n\n\tMinimum of 3 to 5 years of successful sales experience in the grocer or hardware channels.\n\tDemonstrated ability to close high-value business and consistently exceed revenue targets.\n\tStrong network and deep understanding of distribution models, retail dynamics, and buyer expectations in target channels.\n\tExceptional communication, negotiation, and closing skills.\n\tSelf-motivated team player with strong organizational and pipeline management capabilities.\n\tAbility to base out of our Brooklyn office on a full-time basis.\n\n  What We Offer:\n\n\tComprehensive health, dental, and vision insurance options.\n\tPaid time off and company holidays.\n\tOpportunities for career progression and ongoing professional development.\n\tA collaborative work environment centered in Brooklyn."}, {"id": "26982", "title": "Sales Representative", "bhTitle": "Sales- Road Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-11-04", "exp": "2027-02-04", "desc": "Location: NJ and NYC Territory\n Job Type: Full-time\n Schedule: Monday–Friday\n\n Cellular phone Accessory company is seeking an energetic and motivated Sales Representative to service existing accounts at car washes and gas stations. Established accounts and an existing customer base are provided! This is a great opportunity for someone who enjoys working with people, building customer relationships, and growing sales. Key Responsibilities:\n\n\tService existing accounts and place orders.\n\tIncrease sales by securing additional shelf space, improving product displays, and promoting new products.\n\tMerchandise products, maintain organized displays, and rotate inventory as needed.\n\tBuild and maintain strong relationships with store managers and employees.\n\tMaintain existing accounts while identifying opportunities to develop new customers.\n\tOrganize and manage daily routes efficiently to maximize productivity.\n\n  Qualifications:\n\n\tA motivated, energetic, and dependable individual.\n\tStrong organizational skills and attention to detail.\n\tMerchandising experience preferred.\n\tExcellent communication and relationship-building skills.\n\tHigh school diploma or equivalent.\n\tValid driver's license and reliable vehicle required.\n\tAbility to safely lift up to 35 pounds and handle merchandise.\n\tAbility to meet pre-employment background check and drug screening requirements.\n\tMust be at least 18 years old.\n\n  What We Offer:\n\n\tBase pay plus commission based on sales.\n\tCompany fuel card.\n\tMonday–Friday schedule.\n\tEstablished accounts and assigned routes.\n\tOpportunities for career growth and advancement."}, {"id": "26981", "title": "Construction Estimator", "bhTitle": "Construction", "category": "Warehouse, Driving & Logistics", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-04", "exp": "2027-02-04", "desc": "Location: Brooklyn, NY\n Employment Type: Full-Time, On-Site\n Schedule: Monday–Friday\n\n  Job Description\n\n  An established construction company in Brooklyn, NY, is seeking a detail-oriented and analytical Construction Estimator to assist with estimating and bidding for commercial construction projects.\n\n  The position focuses on commercial roofing, waterproofing, stucco/EIFS, and facade projects. The ideal candidate will have strong analytical and computer skills, excellent attention to detail, and the ability to prepare accurate cost estimates and competitive bids.\n\n  Previous construction estimating experience is preferred; however, candidates with related construction experience and a strong willingness to learn will also be considered.\n\n  Key Responsibilities\n\n\t \tReview construction plans, blueprints, drawings, and project specifications.\n\n\t \tPrepare detailed cost estimates for commercial roofing, waterproofing, stucco/EIFS, and facade projects.\n\n\t \tPerform accurate material takeoffs and quantity calculations.\n\n\t \tDevelop project budgets and competitive bids.\n\n\t \tAnalyze labor, material, equipment, and subcontractor costs.\n\n\t \tCommunicate with suppliers and subcontractors to obtain pricing and quotations.\n\n\t \tReview project requirements to ensure estimates are accurate and complete.\n\n\t \tIdentify potential cost-saving opportunities and project risks.\n\n\t \tMaintain organized estimating records, bid documents, and project files.\n\n\t \tCollaborate with project managers and construction teams throughout the bidding process.\n\n\t \tAssist with bid submissions and follow up on outstanding proposals.\n\n\t \tEnsure estimates are completed accurately and within required deadlines.\n\n  Qualifications\n\n\t \tConstruction estimating experience preferred.\n\n\t \tExperience in commercial roofing, waterproofing, stucco/EIFS, or facade construction is a strong plus.\n\n\t \tAbility to read and interpret construction plans, drawings, and specifications.\n\n\t \tStrong computer skills, including proficiency in Microsoft Excel.\n\n\t \tExcellent mathematical, analytical, and problem-solving abilities.\n\n\t \tStrong attention to detail and organizational skills.\n\n\t \tAbility to manage multiple estimates and meet deadlines.\n\n\t \tGood communication and time-management skills.\n\n\t \tAbility to work independently and collaborate with a team.\n\n\t \tCandidates with related construction experience and the ability to learn estimating will be considered."}, {"id": "26980", "title": "Plainview NY", "bhTitle": "Sales Assistant", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-04", "exp": "2027-02-02", "desc": "After 6 months it can be a hybrid Job.\n Fast-growing wholesale company specializing in innovative consumer electronics, novelty gifts, and trending products.\n\n We pride ourselves on bringing exciting, unique, and cutting-edge products to retailers nationwide, including specialty stores, major retail chains, department stores, off-price retailers, and entertainment venues.\n\n As we continue to expand, we are looking for a motivated, energetic, and sales-driven individual to join our growing team.\n\n Key Responsibilities\n\n Follow up on company-provided sales leads and convert opportunities into sales.\n\n Build and maintain strong relationships with new and existing retail customers.\n\n Proactively follow up with buyers regarding product presentations, samples, pricing, and potential orders.\n\n Identify new sales opportunities and help grow existing accounts.\n\n Present and promote our exciting line of consumer electronics and novelty gift products.\n\n Prepare sales presentations, product proposals, and customer correspondence.\n\n Work closely with our sales team to achieve sales goals and drive company growth.\n\n Attend industry trade shows and customer meetings as needed.\n\n Stay informed about new products, retail trends, and emerging sales opportunities.\n\n Qualifications & Skills\n\n Wholesale sales experience is a major plus.\n\n Strong sales skills with the ability to follow up, negotiate, and close deals.\n\n Excellent communication, interpersonal, and customer service skills.\n\n Proficient in Microsoft Excel, Word, and PowerPoint.\n\n Experience using AI tools, including ChatGPT, to improve productivity and efficiency.\n\n Highly organized with strong attention to detail and time-management skills.\n\n Creative thinker who can think outside the box and solve problems.\n\n Comfortable working in a fast-paced, high-energy office environment.\n\n Self-motivated, dependable, and able to work independently as well as part of a team.\n\n Must be willing to travel to industry trade shows and customer meetings.\n\n A positive attitude, strong work ethic, and willingness to learn.\n\n Be part of a growing company in the exciting consumer electronics and novelty gift industry.\n\n Work with innovative, trending products sold by retailers nationwide.\n\n Gain exposure to major retail buyers and industry trade shows.\n\n Join a supportive, entrepreneurial team where your ideas and contributions matter.\n\n Opportunity for professional growth as our company continues to expand.\n\n If you're motivated, energetic, and passionate about sales, we'd love to hear from you!"}, {"id": "26979", "title": "EDI Manager", "bhTitle": "EDI Manager", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-04", "exp": "2027-02-04", "desc": "Wholesale company in Manhattan seeking EDI manager. Must work in office, 5 days a week. No hybrid option."}, {"id": "26978", "title": "Sourcing Manager", "bhTitle": "Sourcing Manager", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-04", "exp": "2027-02-16", "desc": "Wholesale company in Manhattan seeking high level sourcing manager. Must have soft goods experience."}, {"id": "26977", "title": "Production Coordinator", "bhTitle": "Production Coordinator", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-04", "exp": "2027-02-04", "desc": "Wholesale company in Manhattan seeking a production coordinator with soft goods experience. 5 days a week in office in Manhattan. No hybrid option."}, {"id": "26976", "title": "Retail Store Associate", "bhTitle": "Retail Sales", "category": "Sales & Live Selling", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-11-04", "exp": "2027-01-11", "desc": "A retail toy novelty store in Brooklyn is looking for reliable, motivated individuals to help manage the front end of the store and assist with daily operations. The ideal candidate is responsible, attentive, and willing to work.\n Employment Type: Part-Time, with potential to grow into full-time\n Schedule: Sundays required, 10:00 AM–6:00 PM, plus two weekdays\n\n Responsibilities\n\tMonitor the sales floor and assist customers.\n\tKeep an eye on store merchandise and help prevent theft.\n\tRestock shelves and keep the store neat and organized.\n\tMaintain a clean and presentable sales floor.\n\tWork closely with the store manager to support daily operations.\n\n Qualifications\n\tReliable, responsible, and hardworking.\n\tTrustworthy and attentive.\n\tGood communication and customer service skills.\n\tAble to work independently and as part of a team.\n\tPrevious retail experience is a plus, but not required."}, {"id": "26975", "title": "COO- Chief Operations Officer", "bhTitle": "COO- Chief Operations Officer", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-04", "exp": "2027-02-04", "desc": "Whoelsale company seeking high level COO. Must have wholesale experience. Will oversee all operations within the company's multiple divisions."}, {"id": "26973", "title": "Nanny / Housekeeper", "bhTitle": "Babysitter/Nanny", "category": "Education & Childcare", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-11-04", "exp": "2027-02-04", "desc": "Location: Brooklyn, NY\n Employment Type: Part-Time\n Schedule: 2–3 Days per Week, 8:30 AM–3:30 PM (Flexible Days)\n\n  Job Description\n\n  A family in Brooklyn, NY, is seeking a caring, reliable, and responsible Nanny / Housekeeper to provide attentive care for their 4-month-old baby while assisting with household responsibilities.\n\n  The ideal candidate is nurturing, patient, organized, and experienced in caring for infants. This position combines infant childcare with light housekeeping duties during the baby's naps.\n\n  The schedule is approximately 2–3 days per week, from 8:30 AM to 3:30 PM, with flexibility regarding which days are worked.\n\n  Key Responsibilities\n\n  Infant Care\n\n\t \tProvide attentive and loving care for a 4-month-old baby.\n\n\t \tFeed, change diapers, and attend to the baby's daily needs.\n\n\t \tEngage the baby in age-appropriate play and developmental activities.\n\n\t \tFollow established feeding and nap schedules.\n\n\t \tEnsure the baby's safety, comfort, and well-being at all times.\n\n\t \tMaintain a clean and organized environment for the baby.\n\n\t \tCommunicate with parents regarding the baby's daily activities and needs.\n\n  Housekeeping & Household Support\n\n\t \tPerform household cleaning and tidying while the baby is sleeping.\n\n\t \tWash, fold, and organize laundry.\n\n\t \tKeep common areas neat and organized.\n\n\t \tAssist with preparing dinner and basic meal preparation.\n\n\t \tClean and organize kitchen areas as needed.\n\n\t \tHelp maintain an orderly and comfortable home environment.\n\n\t \tAssist with additional household tasks as discussed with the family.\n\n  Qualifications\n\n\t \tPrevious experience caring for infants strongly preferred.\n\n\t \tComfortable caring for a 4-month-old baby.\n\n\t \tResponsible, patient, nurturing, and dependable.\n\n\t \tExperience with light housekeeping and laundry.\n\n\t \tAbility to prepare simple meals and assist with dinner preparation.\n\n\t \tStrong organizational and time-management skills.\n\n\t \tAbility to balance childcare responsibilities with household tasks.\n\n\t \tGood communication skills.\n\n\t \tReliable, punctual, and trustworthy.\n\n\t \tAbility to follow parental instructions and established routines.\n\n\t \tInfant CPR and First Aid certification is a plus."}, {"id": "26972", "title": "Sales Representative", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-04", "exp": "2027-01-11", "desc": "Employment Type: Full Time\n Salary Range: Based on Experience\n\n A family-owned global home goods and textile manufacturer, importer, and distributor is looking for an experienced Sales Representative to develop customer relationships, grow sales, and identify new business opportunities.\n\n Responsibilities\n\tDevelop and maintain relationships with existing and potential customers.\n\tIdentify new sales opportunities and grow existing accounts.\n\tPresent and promote the company's product lines.\n\tNegotiate pricing and sales agreements with customers.\n\tFollow up on leads, customer inquiries, and sales opportunities.\n\tWork with internal teams to coordinate orders and meet customer needs.\n\tMonitor sales activity and work toward achieving sales goals.\n\n Qualifications\n\tPrevious sales experience, preferably in home goods, textiles, wholesale, or consumer products preferred\n\tStrong communication, negotiation, and relationship-building skills.\n\tProven ability to develop business and meet sales targets.\n\tSelf-motivated, organized, and results-driven.\n\tStrong understanding of customer needs and sales processes."}, {"id": "26971", "title": "Sales Assistant", "bhTitle": "Sales Assistant", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-04", "exp": "2027-02-01", "desc": "Employment Type: Full Time\n Salary Range: Based on Experience\n\n A family-owned global home goods and textile manufacturer, importer, and distributor is looking for an organized and motivated Assistant Sales Representative to support its sales team and assist with day-to-day sales operations.\n\n Responsibilities\n\tSupport the sales team with daily administrative and sales-related tasks.\n\tAssist with processing orders and following up with customers.\n\tPrepare sales reports, spreadsheets, and presentations.\n\tCommunicate with customers regarding orders, products, and inquiries.\n\tCoordinate with internal departments to ensure smooth order processing.\n\tHelp maintain customer accounts and sales records.\n\n Qualifications\n\tPrevious administrative or sales support experience preferred.\n\tStrong organizational and communication skills.\n\tComfortable using Microsoft Office, particularly Excel.\n\tDetail-oriented and able to multitask.\n\tPositive attitude and willingness to learn."}, {"id": "26970", "title": "Ecommerce Sales", "bhTitle": "Ecommerce Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-04", "exp": "2027-02-04", "desc": "Wholesale company in Manhattan seeking an ecommerce expert to work under the ecommerce manager.\n\n The main areas we need experience in are:\n\tAmazon: Seller Central, FBA inventory, replenishment, forecasting, shipments, and profitability.\n\tWalmart: Seller Center, WFS, and 1P operations (managing products sold directly to Walmart as a supplier).\n\tExcel: Advanced formulas, reporting, data analysis, and inventory planning.\n\tShopify: Administration, integrations, and troubleshooting."}, {"id": "26969", "title": "Seeking live-sellers", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NJ", "added": "2026-11-03", "exp": "", "desc": "This is not a remote opportunity."}, {"id": "26967", "title": "Wealth Management Intern", "bhTitle": "Intern", "category": "Accounting & Finance", "type": "Internship", "typeNote": "", "state": "NY", "added": "2026-11-03", "exp": "2027-02-04", "desc": "Schedule: Approximately 3 months | Paid Internship\n Location: New York City\n\n  A wealth management team at a large corporate firm is seeking an intern to assist with administrative and operational tasks while gaining exposure to the financial industry.\n\n Responsibilities:\n\n\tUpdate Excel spreadsheets and organize data.\n\tPrepare and send emails.\n\tAssist with general administrative tasks.\n\tFollow instructions and support managers as needed.\n\n  Requirements:\n\n\tProficient in Excel.\n\tOrganized, reliable, and detail-oriented.\n\tAble to follow directions and work independently."}, {"id": "26966", "title": "Live Sales & E-Commerce Associate – Brooklyn, NY", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-11-03", "exp": "2027-02-04", "desc": "A growing company selling custom jewelry, toys, electronics, and more is seeking a motivated, tech-savvy individual to manage online sales through platforms such as Whatnot, TikTok Shop, and other live-selling platforms.\n\n  Responsibilities:\n\n\t \tHost or assist with live-selling sessions, including evenings.\n\n\t \tManage online sales and e-commerce operations.\n\n\t \tShowcase products and engage with viewers to drive sales.\n\n  Requirements:\n\n\t \tPrevious online selling or e-commerce experience.\n\n\t \tProficient in Excel.\n\n\t \tOutgoing, ambitious, and comfortable on camera.\n\n  Schedule: Flexible, with 9 AM–6 PM and evening hours available. Open to part-time or full-time candidates, including students available after school."}, {"id": "26965", "title": "Live Auction Host / Jewelry Sales Associate", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-11-03", "exp": "2027-02-03", "desc": "Location: Brooklyn, NY\n Schedule: Evenings starting at 6 PM; Sundays (day or night)\n\n  Job Description\n\n  Seeking an outgoing, sales-oriented individual to host live jewelry auctions on Whatnot. The ideal candidate is comfortable on camera, enjoys interacting with people, and can create an engaging livestream experience while showcasing products and driving sales.\n\n  Qualifications:\n\n\t \tComfortable speaking on camera.\n\n\t \tStrong communication and sales skills.\n\n\t \tEnergetic, personable, and reliable.\n\n\t \tJewelry or sales experience is a plus."}, {"id": "26964", "title": "Makeup & Hair Styling Trainee", "bhTitle": "HairMakeup Artist", "category": "Design & Creative", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-11-03", "exp": "2027-02-03", "desc": "Location: Brooklyn, NY\n Employment Type: To Be Determined\n Industry: Beauty / Cosmetics / Hair Styling\n\n  Job Description\n\n  A beauty business in Brooklyn, NY, is seeking enthusiastic, creative, and motivated individuals interested in learning makeup application and professional hair styling.\n\n  This is a great opportunity for someone who is passionate about the beauty industry and wants to gain hands-on experience while developing professional skills.\n\n  Training will be provided, making this position ideal for beginners or individuals looking to expand their knowledge of makeup artistry and hair styling.\n\n  The ideal candidate is eager to learn, detail-oriented, reliable, and enjoys working with clients.\n\n  Key Responsibilities\n\n\t \tParticipate in hands-on training for makeup application and hair styling techniques.\n\n\t \tAssist with preparing clients for makeup and hair appointments.\n\n\t \tLearn professional makeup application techniques for different occasions.\n\n\t \tAssist with basic hair styling, blowouts, curls, and other styling techniques.\n\n\t \tMaintain clean and organized makeup and hair styling stations.\n\n\t \tSanitize brushes, tools, and equipment according to hygiene standards.\n\n\t \tAssist experienced makeup artists and hairstylists during appointments.\n\n\t \tHelp organize beauty products, supplies, and equipment.\n\n\t \tProvide friendly and professional customer service.\n\n\t \tFollow instructions and demonstrate a willingness to learn new techniques.\n\n  Qualifications\n\n\t \tInterest in makeup artistry and hair styling required.\n\n\t \tNo prior professional experience necessary.\n\n\t \tWillingness to learn and participate in training.\n\n\t \tCreative mindset and strong attention to detail.\n\n\t \tGood communication and interpersonal skills.\n\n\t \tFriendly, professional, and customer-service oriented.\n\n\t \tReliable, punctual, and responsible.\n\n\t \tAbility to follow instructions and work well with others.\n\n\t \tPassion for beauty, cosmetics, and current styling trends.\n\n\t \tPrevious experience with makeup or hairstyling is a plus."}, {"id": "26963", "title": "Document Scanning / Data Entry", "bhTitle": "Data Entry", "category": "Administrative & Office", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-11-03", "exp": "2027-02-04", "desc": "Location: New York, NY\n Employment Type: Part-Time\n\n  Job Description\n\n  A company in New York, NY, is seeking a reliable, organized, and detail-oriented Document Scanning / Data Entry Clerk to assist with scanning, digitizing, and organizing important documents.\n\n  The ideal candidate will have strong attention to detail, basic computer skills, and the ability to handle paperwork accurately and efficiently.\n\n  This is an excellent opportunity for someone seeking a part-time administrative or clerical position.\n\n  Key Responsibilities\n\n\t \tScan physical documents and convert them into digital files.\n\n\t \tOrganize, label, and save scanned documents in designated folders and systems.\n\n\t \tEnsure all documents are scanned clearly, accurately, and completely.\n\n\t \tReview scanned files for quality and readability.\n\n\t \tMaintain organized physical and electronic filing systems.\n\n\t \tSort, prepare, and organize paperwork before scanning.\n\n\t \tAssist with basic data entry and document management tasks.\n\n\t \tRetrieve and locate documents when requested.\n\n\t \tMaintain confidentiality when handling sensitive information.\n\n\t \tPerform general clerical and administrative tasks as needed.\n\n  Qualifications\n\n\t \tBasic computer skills required.\n\n\t \tFamiliarity with scanners, printers, and office equipment preferred.\n\n\t \tStrong attention to detail and organizational skills.\n\n\t \tAbility to work independently and follow instructions.\n\n\t \tGood time-management skills.\n\n\t \tReliable, punctual, and dependable.\n\n\t \tAbility to handle repetitive tasks accurately and efficiently.\n\n\t \tPrevious experience in document scanning, data entry, filing, or office administration is a plus.\n\n\t \tStrong commitment to maintaining confidentiality."}, {"id": "26962", "title": "Wholesale Sales Representatives", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-03", "exp": "2027-02-03", "desc": "Employment Type: Full-Time\n Industry: Wholesale Distribution / Consumer Goods / Housewares / Fashion Accessories\n\n  Job Description\n\n  An established wholesale distribution company is seeking experienced Wholesale Sales Representatives specializing in three key product categories: Small Kitchen Electrics, Cookware, and Handbags & Wallets.\n\n  The ideal candidates will have a strong background in wholesale sales, established relationships with retail buyers, and experience selling products to major retailers, particularly off-price retail chains such as TJ Maxx, Marshalls, Ross, and Burlington.\n\n  The company is looking for motivated, results-driven sales professionals who can develop new business opportunities, maintain strong buyer relationships, and drive revenue growth within their respective product categories.\n\n  Candidates may specialize in one or more of the following categories.\n\n  Sales Categories\n\n  1. Small Kitchen Electrics\n\n\t \tCoffee makers\n\n\t \tToasters\n\n\t \tSmall kitchen appliances\n\n\t \tOther countertop electrical products\n\n  2. Cookware\n\n\t \tPots and pans\n\n\t \tCookware sets\n\n\t \tNonstick cookware\n\n\t \tOther kitchen and cooking essentials\n\n  3. Handbags & Wallets\n\n\t \tWomen's handbags\n\n\t \tWallets\n\n\t \tFashion accessories\n\n\t \tProducts targeting off-price retailers and discount department stores\n\n  Key Responsibilities\n\n  Wholesale Sales & Business Development\n\n\t \tDevelop and maintain relationships with retail buyers and purchasing teams.\n\n\t \tIdentify new wholesale sales opportunities within assigned product categories.\n\n\t \tPresent product lines and negotiate pricing, terms, and purchase agreements.\n\n\t \tGenerate new business with major retailers, department stores, and off-price chains.\n\n\t \tManage the sales process from initial outreach through closing.\n\n\t \tWork toward achieving sales targets and increasing revenue.\n\n\t \tIdentify opportunities to expand product distribution across retail accounts.\n\n  Retail Buyer Relationship Management\n\n\t \tMaintain strong relationships with existing retail buyers.\n\n\t \tLeverage industry connections to introduce products to new accounts.\n\n\t \tCommunicate regularly with buyers regarding product availability, pricing, and new merchandise.\n\n\t \tFollow up on sales opportunities, purchase orders, and customer inquiries.\n\n\t \tBuild long-term partnerships that generate repeat business.\n\n\t \tMonitor buyer needs and recommend products that align with market demand.\n\n  Product & Market Development\n\n\t \tStay informed about trends in housewares, kitchen appliances, cookware, and fashion accessories.\n\n\t \tIdentify products that appeal to off-price and mass-market retailers.\n\n\t \tCollaborate with internal teams regarding product selection, pricing, and inventory availability.\n\n\t \tProvide feedback on customer demand and emerging market opportunities.\n\n\t \tAssist in developing sales strategies for assigned product categories.\n\n  Qualifications\n\n\t \tPrevious wholesale sales experience required.\n\n\t \tEstablished relationships with retail buyers strongly preferred.\n\n\t \tExperience selling to off-price retailers such as TJ Maxx, Marshalls, Ross, Burlington, or similar chains is highly desirable.\n\n\t \tStrong knowledge of at least one of the following categories:\n\n\t \t\tSmall kitchen electrics\n\n\t \t\tCookware\n\n\t \t\tHandbags and wallets\n\n\t \tProven ability to develop new business and close wholesale sales.\n\n\t \tExcellent communication, negotiation, and relationship-building skills.\n\n\t \tStrong understanding of wholesale pricing, purchasing, and retail distribution.\n\n\t \tSelf-motivated, organized, and results-oriented.\n\n\t \tAbility to manage multiple retail accounts and sales opportunities.\n\n\t \tStrong follow-up skills and attention to detail.\n\n\t \tAbility to work independently and collaborate with internal teams."}, {"id": "26961", "title": "Direct Support Professional (DSP) – Adult Day Habilitation", "bhTitle": "Companion", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-03", "exp": "2027-02-03", "desc": "Employment Type: To Be Determined\n Positions Available: 2\n Industry: Human Services / Developmental Disabilities / Adult Day Habilitation\n\n  Job Description\n\n  An adult day habilitation program is seeking two compassionate, reliable, and dedicated Direct Support Professionals (DSPs) to provide individualized support to adults with developmental and intellectual disabilities.\n\n  The ideal candidates are patient, responsible, and passionate about helping individuals develop life skills, increase independence, and participate in meaningful daily activities.\n\n  This position involves providing hands-on assistance, facilitating recreational and educational programs, and ensuring a safe, supportive, and engaging environment.\n\n  Key Responsibilities\n\n\t \tProvide direct care and individualized support to adults with developmental and intellectual disabilities.\n\n\t \tAssist participants with daily living activities and personal care needs.\n\n\t \tSupport individuals in developing independence, communication, and social skills.\n\n\t \tFacilitate recreational, educational, and community-based activities.\n\n\t \tEncourage participation in structured day habilitation programs.\n\n\t \tAssist with mobility and transportation-related needs as appropriate.\n\n\t \tMonitor participant safety and well-being throughout the day.\n\n\t \tFollow individualized service plans and behavioral support guidelines.\n\n\t \tMaintain accurate documentation of daily activities and participant progress.\n\n\t \tCommunicate effectively with supervisors, coworkers, and program staff.\n\n\t \tPromote a respectful, inclusive, and positive environment for all participants.\n\n  Qualifications\n\n\t \tPrevious experience as a Direct Support Professional, caregiver, or in a related human services position preferred.\n\n\t \tExperience working with adults with developmental or intellectual disabilities is a plus.\n\n\t \tCompassionate, patient, and dependable.\n\n\t \tStrong communication and interpersonal skills.\n\n\t \tAbility to assist with personal care and daily living activities.\n\n\t \tComfortable working in a structured adult day habilitation setting.\n\n\t \tAbility to follow individualized care plans and safety procedures.\n\n\t \tStrong teamwork and problem-solving abilities.\n\n\t \tReliable attendance and professional conduct."}, {"id": "26960", "title": "Sales & Account Coordinator", "bhTitle": "Coordinator", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-02", "exp": "2027-02-01", "desc": "Location: New York, NY\nEmployment Type: Full-Time, In-Office (Potential Hybrid Flexibility)\nSchedule: MondayFriday, with Possible Remote Days to Be Determined\nIndustry: Beauty / Cosmetics / Wholesale Distribution / Consumer Goods\n\nJob Description\n\nA growing beauty and consumer goods company is seeking a highly organized, detail-oriented, and motivated Sales & Account Coordinator to support its sales operations and manage relationships with major retail accounts.\n\nThe company specializes in Korean beauty (K-Beauty) products, working with numerous brands and distributing products to major retailers, including TJX, Ross, Burlington, Walmart, CVS, Walgreens, Ulta, and Amazon.\n\nThe ideal candidate will have experience in sales support, account management, wholesale distribution, or consumer packaged goods (CPG), along with strong organizational skills and the ability to manage multiple accounts simultaneously.\n\nThis position involves working closely with the Director of Sales & Marketing to coordinate purchase orders, maintain account records, communicate with retail buyers, and ensure smooth execution of sales activities.\n\nThe company is open to both experienced candidates and motivated junior professionals who are intelligent, quick learners, and capable of taking initiative.\n\nKey Responsibilities\n\nSales Support & Account Coordination\n\n\tSupport the Director of Sales & Marketing with daily sales operations and account management.\n\n\tAssist in managing relationships with major retail accounts, including off-price and mass-market retailers.\n\n\tCoordinate purchase orders, inventory sheets, deductions, product samples, and account deadlines.\n\n\tMaintain accurate account records and ensure timely follow-up on outstanding tasks.\n\n\tAssist with preparing weekly sales opportunities and product availability reports.\n\n\tHelp create customized product assortments and presentations for retail buyers.\n\n\tMonitor account activity and ensure all sales-related responsibilities are completed efficiently.\n\n\tSupport the management of 15+ retail and wholesale accounts.\n\nRetail Buyer & Vendor Communication\n\n\tCommunicate with retail buyers regarding product availability, pricing, orders, and account updates.\n\n\tSchedule and coordinate buyer meetings, sales presentations, and trade shows.\n\n\tPrepare meeting materials, presentations, and product information.\n\n\tSend meeting recaps and follow up on action items.\n\n\tCoordinate with warehouses, vendors, and internal departments to resolve account-related issues.\n\n\tMaintain strong professional relationships with retail partners.\n\nInternational Sales & Distribution Support\n\n\tAssist with coordinating orders for international distributors.\n\n\tPrepare and organize shipping documents and related paperwork.\n\n\tSupport compliance documentation and international order requirements.\n\n\tCommunicate with overseas partners regarding orders, pricing, and timelines.\n\n\tCoordinate with the company's Korea-based team to ensure smooth operations.\n\n\tHelp resolve order discrepancies and logistical issues.\n\nSales Operations & Administrative Support\n\n\tMaintain and update Excel spreadsheets, Google Sheets, and account tracking documents.\n\n\tAssist with creating and modifying sales presentations, PowerPoint decks, and buyer materials.\n\n\tUse AI tools to support research, drafting, and administrative tasks.\n\n\tTrack deadlines, purchase orders, inventory updates, and account communications.\n\n\tCoordinate with marketing, e-commerce, operations, and international teams.\n\n\tEnsure accurate documentation and timely completion of sales-related projects.\n\n\tIdentify opportunities to improve workflow efficiency and account coordination.\n\nQualifications\n\n\t24 years of experience in sales support, account coordination, sales operations, or a related field preferred.\n\n\tExperience in wholesale distribution, beauty, cosmetics, or consumer packaged goods is a strong plus.\n\n\tStrong organizational skills and exceptional attention to detail.\n\n\tAbility to manage multiple accounts, deadlines, and responsibilities simultaneously.\n\n\tExcellent written and verbal communication skills.\n\n\tConfidence communicating with retail buyers, warehouses, vendors, and international partners.\n\n\tStrong proficiency in Microsoft Excel, Google Sheets, and Google Workspace.\n\n\tExperience creating or modifying presentations and sales materials.\n\n\tComfortable using AI tools for research, drafting, and productivity.\n\n\tStrong problem-solving skills and ability to work independently.\n\n\tProactive, dependable, and capable of following through on assignments.\n\n\tAbility to work in a fast-paced environment and adapt to changing priorities."}, {"id": "26959", "title": "Companion", "bhTitle": "Companion", "category": "Healthcare & Human Services", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-11-02", "exp": "2027-02-02", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\nIndustry: Healthcare / Pediatric Care\n\nJob Description\n\nA pediatric healthcare facility in Brooklyn is seeking a compassionate, creative, and enthusiastic Companion to support children through engaging recreational activities, therapeutic play, and developmental programs.\n\nThe ideal candidate enjoys working with children and has a passion for creating meaningful experiences that promote emotional, social, and developmental well-being.\n\nThis position involves planning and leading age-appropriate activities, creative arts, sensory experiences, and special events for pediatric residents, including children with physical disabilities, developmental challenges, and complex medical needs.\n\nThe Companion will work closely with healthcare professionals, patients, and families to create a safe, nurturing, and enjoyable environment.\n\nExperience working with children is required. Experience supporting children with special needs is preferred but not required.\n\nKey Responsibilities\n\nRecreational Activities & Engagement\n\n\tPlan, organize, and lead age-appropriate recreational activities for pediatric residents.\n\n\tEngage children in creative arts, games, sensory activities, and interactive play.\n\n\tDevelop activities that promote social interaction, emotional well-being, and developmental growth.\n\n\tProvide individualized recreational activities based on each child's abilities and needs.\n\n\tEncourage participation in group activities, special events, and holiday celebrations.\n\n\tCreate positive experiences that help children adjust to the healthcare environment.\n\n\tAdapt activities to accommodate children with different physical, developmental, and communication abilities.\n\nPediatric & Special Needs Support\n\n\tProvide engaging activities for infants, toddlers, and children of varying ages.\n\n\tCreate sensory-rich experiences for children who are nonverbal, wheelchair users, or visually impaired.\n\n\tEncourage participation and interaction among children with physical or developmental limitations.\n\n\tSupport children with complex medical needs in accordance with facility guidelines and staff direction.\n\n\tEstablish positive, supportive relationships with pediatric residents and their families.\n\n\tMaintain appropriate professional boundaries while providing compassionate companionship.\n\n\tEnsure children feel comfortable, included, and supported during recreational activities.\n\nPatient Safety & Facility Support\n\n\tMaintain a safe and organized environment during activities and special events.\n\n\tAssist with transporting children to and from recreational programs as appropriate.\n\n\tFollow facility policies regarding infection control, emergency procedures, and patient safety.\n\n\tMonitor activity areas and ensure equipment is used safely.\n\n\tMaintain recreational supplies, materials, and equipment in an organized manner.\n\n\tIdentify and request necessary supplies for upcoming activities and programs.\n\n\tHelp maintain a clean and welcoming recreational environment.\n\nTeam Collaboration & Communication\n\n\tCollaborate with nurses, therapists, and other healthcare professionals to support patient needs.\n\n\tCommunicate relevant patient observations and concerns to supervisors and treatment team members.\n\n\tMaintain patient confidentiality in accordance with facility policies.\n\n\tParticipate in team discussions regarding recreational programming and patient engagement.\n\n\tAttend training and professional development opportunities to enhance skills.\n\n\tAssist with additional departmental responsibilities as needed.\n\nQualifications\n\n\tHigh School Diploma or equivalent required.\n\n\tExperience working with children and infants required.\n\n\tCompassionate, patient, and enthusiastic about working with pediatric residents.\n\n\tStrong communication and interpersonal skills.\n\n\tCreative and capable of developing engaging recreational activities.\n\n\tAbility to work with children of varying ages, abilities, and developmental needs.\n\n\tStrong organizational and time-management skills.\n\n\tAbility to work independently and collaboratively with healthcare professionals.\n\n\tDependable, responsible, and attentive to patient safety.\n\n\tComfortable working in a pediatric healthcare environment.\n\n\tAvailability to work evenings and weekends required."}, {"id": "26958", "title": "Wholesale Sales Representative", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-02", "exp": "2027-02-02", "desc": "Employment Type: Full-Time\nExperience Level: Entry-Level to Experienced Sales Professionals\n\nJob Description\n\nA growing wholesale distribution company specializing in health, beauty, wellness, supplements, food, and consumer goods is seeking motivated and results-driven Wholesale Sales Representatives to join its team.\n\nThe ideal candidate is an ambitious, entrepreneurial, and relationship-oriented individual who enjoys developing new business opportunities, connecting with buyers, and closing profitable deals.\n\nThis position focuses on business development, wholesale product sourcing, client relationship management, and B2B sales.\n\nThe company welcomes candidates at all experience levels. Previous wholesale sales experience is beneficial but not required, as training and ongoing support will be provided.\n\nThis is a commission-based opportunity with uncapped earning potential, making it an excellent fit for individuals who are motivated to grow their income through sales performance.\n\nKey Responsibilities\n\nWholesale Sales & Business Development\n\n\tIdentify and pursue new wholesale sales opportunities.\n\n\tContact potential buyers through cold calling, email outreach, networking, and other prospecting methods.\n\n\tDevelop relationships with retailers, distributors, wholesalers, and other business clients.\n\n\tPresent available products and identify opportunities that meet customer needs.\n\n\tNegotiate pricing, sales terms, and agreements to close profitable transactions.\n\n\tManage the complete sales process from initial outreach through negotiation and closing.\n\n\tConsistently work toward individual sales goals and revenue targets.\n\nProduct Sourcing & Market Research\n\n\tResearch and identify wholesale products based on buyer demand.\n\n\tSource products across health, beauty, wellness, supplements, food, and consumer goods categories.\n\n\tStay informed about market trends, product availability, and emerging opportunities.\n\n\tIdentify profitable products and potential business partnerships.\n\n\tCoordinate with suppliers to obtain product information, pricing, and availability.\n\n\tMatch buyers with suitable products and wholesale opportunities.\n\nClient Relationship Management\n\n\tBuild and maintain strong relationships with wholesale buyers and retail clients.\n\n\tMaintain regular communication with existing customers to encourage repeat business.\n\n\tUnderstand customer purchasing needs and recommend appropriate products.\n\n\tFollow up on leads, proposals, and potential transactions.\n\n\tAddress client inquiries and coordinate with internal teams when necessary.\n\n\tDevelop long-term business relationships that contribute to ongoing sales growth.\n\nSales Pipeline & Account Management\n\n\tMaintain accurate records of leads, customer communications, and sales opportunities.\n\n\tTrack potential deals and follow up consistently with prospective buyers.\n\n\tManage multiple customer accounts and transactions simultaneously.\n\n\tMonitor sales activity and identify opportunities to increase revenue.\n\n\tWork independently to develop and expand a personal sales pipeline.\n\n\tCollaborate with management to improve sales strategies and business development efforts.\n\nQualifications\n\n\tStrong communication and interpersonal skills required.\n\n\tConfidence in cold calling, prospecting, and developing new business relationships.\n\n\tExcellent negotiation and problem-solving abilities.\n\n\tStrong organizational and time-management skills.\n\n\tSelf-motivated, proactive, and results-oriented.\n\n\tEntrepreneurial mindset with a strong desire to succeed in sales.\n\n\tAbility to work independently and manage multiple sales opportunities.\n\n\tWillingness to learn about wholesale distribution, product sourcing, and B2B sales.\n\n\tComfortable working in a commission-based environment.\n\n\tAbility to build and maintain professional relationships with buyers and suppliers.\n\n\tStrong follow-up skills and attention to detail.\n\nPreferred Qualifications\n\n\tPrevious experience in sales, business development, wholesale distribution, or brokerage.\n\n\tFamiliarity with health, beauty, wellness, supplements, food, or consumer packaged goods.\n\n\tExisting relationships with retailers, distributors, or wholesale buyers.\n\n\tExperience negotiating wholesale pricing and managing B2B transactions.\n\n\tKnowledge of product sourcing and distribution processes."}, {"id": "26957", "title": "Warehouse Associate – Shipping & Order Fulfillment", "bhTitle": "Warehouse- Shipping", "category": "Warehouse, Driving & Logistics", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-30", "exp": "2027-01-29", "desc": "Location: Sunset Park, Brooklyn, NY\nJob Type: Full-time / In person\nSchedule: To be determined\nMedia company is looking for a reliable, energetic team member to join our growing business in Sunset Park, Brooklyn. We sell movies, music, vinyl records, books, Blu-rays, DVDs, CDs, and other collectibles through online marketplaces including Whatnot and eBay.\nThis is not a typical warehouse job. The ideal candidate is physically strong enough to pack hundreds of orders a day and detail-oriented enough to accurately read and fulfill customer orders from a computer screen. We need someone who can move quickly without sacrificing accuracy, as shipping the wrong item is not an option.\nKey Responsibilities:\n\n\tPick and pack customer orders quickly and accurately.\n\tRead order information from a computer screen and match the correct items.\n\tPack orders securely so they arrive safely to customers.\n\tHelp receive, sort, and organize incoming inventory.\n\tKeep the warehouse space clean and organized.\n\tWork efficiently while maintaining a high level of accuracy throughout the shift.\n\nQualifications:\n\n\tAble to repeatedly lift and move boxes weighing up to 40 to 50 lbs.\n\tComfortable being on your feet for most of the workday.\n\tBasic computer skills and the ability to accurately read and follow on-screen orders.\n\tStrong attention to detail and commitment to quality work.\n\tAbility to lift 40-50 lb.\n\tReliable, punctual, and able to work independently.\n\tPositive attitude and willingness to work as part of a team.\n\tFamiliarity with popular artists, bands, movies, vinyl records, or physical media formats is a major plus.\n\nWhat We Offer:\n\n\tDynamic, fast-paced work environment in a growing e-commerce media company.\n\tConsistent hands-on team culture."}, {"id": "26956", "title": "Customer Service Specialist", "bhTitle": "Customer Service", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-30", "exp": "2027-02-01", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nIndustry: Home Services / Customer Service / Billing\n\nJob Description\n\nAn established home services company in Brooklyn is seeking a detail-oriented and customer-focused Customer Service Specialist (Billing) to manage customer payments, vendor reimbursements, and billing-related inquiries.\n\nThe ideal candidate will have experience in customer service, billing, accounts receivable, or accounts payable, along with strong communication, organizational, and problem-solving skills.\n\nThis position involves working directly with customers and home service technicians to process payments, resolve billing discrepancies, coordinate reimbursements, and maintain accurate financial records.\n\nThe successful candidate must be comfortable handling financial transactions, managing multiple responsibilities, and providing excellent customer service in a fast-paced environment.\n\nKey Responsibilities\n\nCustomer Service & Billing Support\n\n\tServe as the primary point of contact for customers and home service technicians regarding billing inquiries.\n\n\tRespond to customer and vendor questions through phone calls, emails, and internal communication platforms.\n\n\tResolve billing concerns, payment discrepancies, and financial inquiries professionally and efficiently.\n\n\tAssist customers with payment arrangements, refunds, and account adjustments.\n\n\tConduct outbound calls to follow up on outstanding payments and resolve billing issues.\n\n\tMaintain positive relationships with customers and vendors while ensuring accurate payment processing.\n\nAccounts Receivable & Payment Processing\n\n\tProcess customer payments accurately and efficiently.\n\n\tMonitor failed or declined payments and follow up with customers to resolve outstanding balances.\n\n\tNegotiate payment arrangements and provide appropriate payment solutions.\n\n\tAssist policyholders with maintaining active coverage by addressing payment issues.\n\n\tProcess refunds and modify payment plans according to company procedures.\n\n\tMaintain accurate records of customer payments and financial transactions.\n\n\tSupport collection efforts while maintaining professional customer relationships.\n\nAccounts Payable & Vendor Coordination\n\n\tCoordinate payments and reimbursements to home service technicians for authorized repairs.\n\n\tVerify service completion and invoice details before processing payments.\n\n\tResolve payment discrepancies between customers, vendors, and internal departments.\n\n\tCommunicate with technicians regarding payment statuses and reimbursement requests.\n\n\tEnsure timely and accurate processing of vendor payments.\n\n\tMaintain organized records of technician payouts and related financial documentation.\n\nFinancial Records & Administrative Support\n\n\tAccurately document financial transactions and billing activities in internal systems.\n\n\tUtilize billing software and internal platforms to track payments, reimbursements, and account activity.\n\n\tAssist with bulk payment processing and financial reconciliation.\n\n\tMaintain detailed records for auditing, reporting, and compliance purposes.\n\n\tFollow established company procedures and financial guidelines.\n\n\tEscalate complex billing concerns to supervisors or appropriate departments.\n\n\tMonitor performance metrics and meet departmental productivity and accuracy goals.\n\nQualifications\n\n\tPrevious experience in customer service, billing, accounts receivable, or accounts payable preferred.\n\n\tExperience in the home services or service-related industry is a plus.\n\n\tStrong understanding of payment processing and financial transactions.\n\n\tExcellent written and verbal communication skills.\n\n\tComfortable handling inbound and outbound customer calls.\n\n\tProficiency with computers, email, electronic payment systems, and communication platforms such as Slack.\n\n\tStrong attention to detail and accuracy when processing financial information.\n\n\tAbility to resolve customer concerns professionally and efficiently.\n\n\tStrong organizational and multitasking abilities.\n\n\tAbility to manage multiple requests and meet deadlines in a fast-paced environment.\n\n\tStrong problem-solving and decision-making skills.\n\n\tAbility to follow established company policies and procedures.\n\n\tReliable, punctual, and dependable.\n\n\tComfortable working independently while collaborating with other departments."}, {"id": "26955", "title": "Babysitter/Nanny", "bhTitle": "Babysitter/Nanny", "category": "Education & Childcare", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-10-29", "exp": "2027-02-01", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time or Part-Time\nSchedule: Flexible, Based on Family Needs\n\nJob Description\n\nA family in Brooklyn, NY, is seeking a reliable, caring, and responsible Nanny / Babysitter to provide attentive childcare in a safe, nurturing, and supportive environment.\n\nThe ideal candidate is patient, trustworthy, organized, and genuinely enjoys working with children. This position is open to both full-time and part-time candidates.\n\nKey Responsibilities\n\n\tProvide attentive and responsible childcare.\n\n\tEnsure children's safety and well-being at all times.\n\n\tSupervise daily activities, playtime, and routines.\n\n\tEngage children in age-appropriate educational and recreational activities.\n\n\tAssist with feeding, meal preparation, and snacks for the children.\n\n\tHelp maintain consistent nap and bedtime routines, as applicable.\n\n\tAssist with dressing, hygiene, and other daily childcare needs.\n\n\tMaintain a clean and organized environment in children's play and activity areas.\n\n\tCommunicate regularly with parents regarding children's activities and needs.\n\n\tFollow family guidelines, schedules, and childcare preferences.\n\nQualifications\n\n\tPrevious babysitting, nannying, or childcare experience preferred.\n\n\tResponsible, dependable, and punctual.\n\n\tPatient, nurturing, and attentive to children's needs.\n\n\tStrong communication and interpersonal skills.\n\n\tAbility to create a safe and positive environment for children.\n\n\tOrganized and capable of managing daily childcare routines.\n\n\tAbility to work independently and follow parental instructions.\n\n\tCPR and First Aid certification is a plus.\n\n\tReferences from previous childcare positions are preferred."}, {"id": "26954", "title": "Luxury Watch Sales Associate", "bhTitle": "Luxury Watch Sales Associate", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-29", "exp": "2027-02-04", "desc": "Location: New York City (Diamond District)\nSchedule: Full-Time\n\nA growing luxury watch dealer in NYC is seeking a motivated and personable Sales Associate to join its team. The company specializes in buying, selling, consigning, and sourcing luxury timepieces from leading brands, working with collectors, clients, and industry professionals in a private showroom environment.\n\nResponsibilities\n\n\tAssist clients with buying, selling, and consigning luxury watches.\n\tBuild and maintain strong relationships with collectors, customers, and industry partners.\n\tFollow up on leads and generate new business opportunities.\n\tEducate clients on watch brands, models, market trends, and pricing.\n\tCoordinate client appointments and provide a personalized, high-end customer experience.\n\tHelp source inventory and communicate with buyers, sellers, and dealers.\n\tMaintain accurate client records and support daily showroom operations.\n\nQualifications\n\n\tPrevious sales, luxury retail, or customer service experience preferred.\n\tStrong communication, interpersonal, and relationship-building skills.\n\tSelf-motivated with a passion for sales and earning commission.\n\tProfessional appearance and demeanor.\n\tInterest in luxury watches, jewelry, or other luxury goods is a plus.\n\tOrganized, detail-oriented, and comfortable working in a fast-paced environment.\n\nThis is a great opportunity for someone looking to build a career in the luxury watch industry while working directly with high-end clients."}, {"id": "26953", "title": "Whatnot Live Sales Host – Watches & Accessories", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-29", "exp": "2027-01-18", "desc": "A Brooklyn-based watch and accessories company is looking for an outgoing, motivated individual to host live sales on Whatnot. This is a great opportunity for someone who enjoys being on camera, engaging with customers, and selling products in a fun, interactive setting.\n\nResponsibilities\n\n\tHost live sales on Whatnot, showcasing watches and accessories.\n\n\tEngage with viewers, answer questions, and encourage purchases.\n\n\tPresent products confidently and professionally.\n\n\tHelp create an energetic and enjoyable shopping experience.\n\n\tBuild customer engagement and drive sales during live streams.\n\nQualifications\n\n\tOutgoing, personable, and comfortable on camera.\n\n\tStrong communication and sales skills.\n\n\tMotivated, reliable, and enthusiastic.\n\n\tInterest in watches, fashion, or accessories is a plus.\n\n\tPrevious live-selling or Whatnot experience is helpful but not required."}, {"id": "26951", "title": "Tuition Assistance", "bhTitle": "Accountant", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-29", "exp": "2027-02-01", "desc": "Employment Type: Full-Time\nIndustry: Education\n\nJob Description\n\nAn established Yeshivah is seeking a highly organized, detail-oriented, and experienced Tuition Assistance Accountant to oversee the day-to-day financial review and administration of its Tuition Assistance program.\n\nThe ideal candidate will have a strong accounting and financial analysis background, excellent organizational skills, and the ability to work professionally and confidentially with families regarding financial matters.\n\nThis position involves reviewing financial aid applications, analyzing financial documentation, managing application workflows, and preparing recommendations for the Tuition Assistance Committee.\n\nThe Tuition Assistance Accountant will independently handle standard applications and routine parent inquiries while working closely with the Tuition Manager on complex financial cases, policy matters, and exceptions.\n\nKey Responsibilities\n\nFinancial Review & Analysis\n\n\tReview and analyze Tuition Assistance applications and supporting financial documentation.\n\n\tEvaluate family financial information, including income, expenses, assets, and other relevant financial details.\n\n\tAssess applications according to established Tuition Assistance guidelines.\n\n\tPrepare financial summaries and recommendations for standard applications.\n\n\tIdentify missing documentation, discrepancies, and inconsistencies in financial submissions.\n\n\tEscalate complex financial cases and exceptions to the Tuition Manager.\n\n\tAssist in preparing financial cases for presentation to the Tuition Assistance Committee.\n\nTuition Assistance Administration\n\n\tManage the day-to-day Tuition Assistance application process.\n\n\tOversee application intake, documentation, tracking, and processing.\n\n\tEnsure applications are complete, accurate, and reviewed in a timely manner.\n\n\tMonitor application statuses, turnaround times, and overall workflow.\n\n\tMaintain organized and confidential financial records.\n\n\tProvide regular updates and reports to the Tuition Manager.\n\n\tSupport improvements to application procedures and financial review processes.\n\nParent & Family Communication\n\n\tCommunicate directly with families regarding Tuition Assistance applications.\n\n\tAssist parents with questions about financial documentation and application requirements.\n\n\tFollow up with families regarding missing or incomplete information.\n\n\tHandle sensitive financial discussions with professionalism, discretion, and empathy.\n\n\tResolve routine parent inquiries independently.\n\n\tRefer complex or exceptional situations to the Tuition Manager.\n\nFinancial Reporting & Coordination\n\n\tPrepare financial reports and application summaries for management.\n\n\tMaintain accurate records of financial aid applications and recommendations.\n\n\tAssist with tracking Tuition Assistance allocations and related financial information.\n\n\tCoordinate with the Tuition Manager and Tuition Assistance Committee.\n\n\tEnsure consistency and accuracy in financial reviews and reporting.\n\n\tHelp maintain efficient internal financial procedures and documentation standards.\n\nQualifications\n\n\tStrong accounting, bookkeeping, or financial analysis background preferred.\n\n\tExperience reviewing financial statements, tax returns, or other financial documentation preferred.\n\n\tStrong analytical skills and attention to detail.\n\n\tProficiency in Microsoft Excel and other accounting or financial management software.\n\n\tExcellent organizational and time-management skills.\n\n\tAbility to manage multiple applications and deadlines simultaneously.\n\n\tStrong written and verbal communication skills.\n\n\tAbility to handle confidential financial information with discretion.\n\n\tComfortable communicating directly with families about sensitive financial matters.\n\n\tAbility to work independently while collaborating with management.\n\n\tPrevious experience in a school, nonprofit organization, accounting office, or financial assistance department is a plus."}, {"id": "26950", "title": "Graphic Designer", "bhTitle": "Graphic Design", "category": "Design & Creative", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-28", "exp": "2027-01-28", "desc": "Employment Type: Part-Time / Freelance / Contract\nSchedule: Flexible, Approximately 10–20 Hours per Month\n\nPosition Overview\n\nA growing company is seeking a creative, detail-oriented, and talented Graphic Designer to assist with packaging design, product mockups, and website graphics.\n\nThe ideal candidate has strong design skills, proficiency in Adobe Photoshop or similar design software, and the ability to transform creative concepts into professional, visually appealing designs.\n\nThis position offers a flexible, part-time schedule of approximately 10–20 hours per month, making it an excellent opportunity for a freelance designer or someone looking for additional creative work.\n\nThe position has the potential to grow into a full-time opportunity as the company's needs expand, with the selected candidate receiving priority consideration.\n\nKey Responsibilities\n\nGraphic Design & Creative Development\n\n\tCreate professional and visually appealing graphic designs for various company projects.\n\n\tDevelop creative concepts and product mockups.\n\n\tDesign and update product packaging and related marketing materials.\n\n\tPrepare visual presentations and design concepts for review.\n\n\tCollaborate with management to understand design requirements and project objectives.\n\n\tRevise and refine designs based on feedback.\n\n\tEnsure all designs are consistent with the company's branding and visual identity.\n\nPackaging & Product Design\n\n\tDesign packaging layouts and product presentations.\n\n\tCreate realistic product mockups to demonstrate packaging concepts.\n\n\tAssist with developing packaging graphics for new and existing products.\n\n\tEnsure packaging designs are visually appealing, accurate, and professionally presented.\n\n\tMake adjustments to existing packaging designs as needed.\n\nWebsite Graphics & Infographics\n\n\tCreate engaging infographics for the company's website.\n\n\tDesign visual content that clearly communicates product features and information.\n\n\tDevelop graphics that enhance website presentation and customer engagement.\n\n\tUpdate existing website graphics and marketing visuals as needed.\n\n\tEnsure digital designs are properly formatted for online use.\n\nQualifications\n\n\tProficiency in Adobe Photoshop or comparable graphic design software required.\n\n\tPrevious graphic design experience preferred.\n\n\tExperience with packaging design and product mockups is a strong plus.\n\n\tAbility to create professional website graphics and infographics.\n\n\tStrong creativity and attention to detail.\n\n\tGood communication skills and ability to understand design instructions.\n\n\tAbility to work independently and manage assignments efficiently.\n\n\tStrong organizational and time-management skills.\n\n\tAbility to incorporate feedback and make revisions promptly.\n\n\tFamiliarity with Adobe Illustrator or other design applications is a plus.\n\n\tAbility to meet deadlines and deliver high-quality work."}, {"id": "26949", "title": "Collections Representative", "bhTitle": "Collections Associate", "category": "Other", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-28", "exp": "2027-01-04", "desc": "Location: NYC\n\tLocation: Full-Time\n\nThe Collections Representative plays a key role in managing customer accounts and ensuring timely collection of outstanding payments. This position is responsible for resolving billing issues, maintaining positive customer relationships, and supporting the overall accounts receivable process.\n\nResponsibilities\n\n\tReview customer accounts to identify outstanding balances and correct account discrepancies.\n\tContact customers regarding past-due invoices and payment arrangements.\n\tInvestigate and resolve billing, credit, and collection issues.\n\tUtilize effective collection strategies to secure timely payments.\n\tCollaborate with Account Managers to address customer concerns and resolve issues promptly.\n\tProcess refunds and apply account credits as needed.\n\tReview and release pending customer orders.\n\tRespond to customer inquiries in a professional and timely manner.\n\nQualifications\n\n\tProfessional and courteous phone presence.\n\tStrong communication and interpersonal skills.\n\tExcellent written communication, grammar, and attention to detail.\n\tAnalytical problem-solving abilities and sound judgment.\n\tAbility to prioritize tasks and perform effectively in a fast-paced environment.\n\tPrevious collections, accounts receivable, customer service, or related experience preferred."}, {"id": "26947", "title": "Operations Manager", "bhTitle": "Operations Manager", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-28", "exp": "2026-12-31", "desc": "A New York managed services firm. For more than 25 years we have supported creative teams in fashion, apparel, accessories, and consumer products, working across Apple, Adobe Creative Cloud, and now AI.\nClients are now asking us to help them adopt AI, both in design work and in other functions like operations, merchandising, and sales. Our AI practice covers three services: AI audits, Claude usage and cost monitoring in the Anthropic Console, and hands-on Claude training. Demand now exceeds what one person can sell, build, and teach. This hire is the first step in building a team that can scale the practice.\nThe Role\nYou will own delivery for our AI engagements. That means leading the training, building and maintaining the curriculum, and running the audits and Console reporting we sell. We can then focus on winning new work.\n\nWhat You Will Do\nDeliver training (about 50% of your time)\n\n\tLead live Claude training for client groups of up to 25: Claude 101 Parts 1 and 2, Advanced: Business & Operations, and Advanced: Creative & Design Teams\n\tRun sessions using each client's own files and tasks, both on-site and remote\n\tAnswer follow-up questions and hold office hours for client teams after training\n\nBuild and own the curriculum (about 25%)\n\n\tMaintain our training materials, quick-reference guides, and exercises, and keep them current as Claude and Anthropic's tools change\n\tBuild a prompt and workflow library for each client\n\tCreate new modules by industry and function, such as design and product development, merchandising, operations, and sales\n\tDocument the curriculum so future trainers can deliver it consistently\n\nRun audits and Console reporting (about 15%)\n\n\tCarry out AI audits: tool inventories, staff surveys, department-lead interviews, and data-risk reviews\n\tWrite assessment reports and present findings to client leadership\n\tConfigure the Anthropic Console and Claude admin settings, and produce reports at 30, 60, and 90 days\n\nSupport sales (about 10%)\n\n\tJoin discovery calls and demos as the subject-matter expert\n\tHelp scope engagements and draft proposals\n\tSpot follow-on work during delivery, such as more teams, advanced tracks, or implementation projects\n\nWhat Success Looks Like\n\n\t\t\tBy\n\t\t\tYou will have\n\n\t\t\t90 days\n\t\t\tDelivered Claude 101 and Advanced sessions on your own. Co-led at least one AI audit with Director\n\n\t\t\t6 months\n\t\t\tOwned delivery end to end on several client engagements. Shipped at least one new curriculum module. Kept client feedback scores high.\n\n\t\t\t12 months\n\t\t\tMade the curriculum documented and repeatable, so a second trainer can deliver it. Helped turn delivery work into follow-on business. Freed Director to spend most of his time on sales.\n\nWhat You Bring\nRequired\n\n\t3+ years in corporate training, technical consulting, or customer enablement, with live instruction to groups of adults\n\tStrong hands-on skill with Claude or another leading AI assistant: writing prompts, Projects, file analysis, and building repeatable workflows\n\tA record of building training content from scratch: lesson plans, exercises, and quick-reference guides\n\tThe ability to explain technical ideas to non-technical audiences, from designers to executives\n\tClear writing for reports, proposals, and client documentation\n\tComfort leading a client meeting and presenting findings to leadership\n\nNice to have\n\n\tExperience in fashion, apparel, accessories, or consumer products, or supporting creative teams\n\tWorking knowledge of Adobe Creative Cloud and Firefly\n\tExperience with the Anthropic Console, Claude admin settings, or other SaaS admin and usage reporting\n\tFamiliarity with AI data governance: what data is safe to use, access controls, and acceptable-use policies\n\tExperience in a consulting or managed services firm, including scoping and pre-sales\n\nWhy Join Us\n\n\tA founding role in a new, fast-growing AI practice, with a path to lead a training and delivery team as it grows\n\tDirect impact on how well-known fashion and consumer brands adopt AI\n\tA small, experienced team with 25+ years of client relationships in NYC's creative industries\n\tTime and budget to stay current on AI tools\n\t[Benefits, PTO, and professional development details]"}, {"id": "26946", "title": "Sunday Transportation Driver for High School Dancers", "bhTitle": "Driver", "category": "Warehouse, Driving & Logistics", "type": "Part Time", "typeNote": "", "state": "NJ", "added": "2026-10-27", "exp": "2026-11-26", "desc": "Location: Oakhurst / Eatontown, NJ to Brooklyn, NY\nJob Type: Part Time / Recurring\nSchedule: Every Sunday, Year Round (approx. 8:30 AM to 2:00 PM)\n\nA local family is seeking a reliable, safety minded driver to provide weekly round trip transportation for two 14 year old girls attending Sunday dance classes in Brooklyn. This is a consistent, year round position ideal for someone looking for steady weekend work.\n\nThe ideal candidate is punctilious, responsible, and possesses a clean driving record and a clean, reliable personal vehicle.\n\nKey Responsibilities:\n\n\tProvide safe and punctual transportation every Sunday morning and afternoon.\n\n\tPick up students in Oakhurst and Eatontown at 8:30 AM.\n\n\tDrop off students at a dance studio in Brooklyn by 10:00 AM.\n\n\tPick up students at the studio promptly at 12:00 PM for the return trip to New Jersey.\n\n\tMaintain clear communication with parents regarding timing, traffic delays, or schedule updates.\n\nQualifications:\n\n\tMust possess a valid driver's license and a clean driving record.\n\n\tMust have a reliable, safe, and well maintained personal vehicle with valid registration and insurance.\n\n\tDemonstrated history of strong punctuality, dependability, and safety awareness.\n\n\tBackground check and personal references required upon request.\n\nWhat We Offer:\n\n\tConsistent, year round Sunday income.\n\n\tPredictable weekly schedule with standard 2 hour break during class time."}, {"id": "26945", "title": "Creator & Community Marketing Manager", "bhTitle": "Marketing", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-27", "exp": "2027-01-27", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time, On-Site\nSchedule: Monday–Friday, 5 Days In-Office\nReports To: Director of Marketing\n\nPosition Overview\n\nAn established outdoor apparel brand is seeking a creative, ambitious, and results-driven Creator & Community Marketing Manager to lead its influencer partnerships, ambassador programs, live selling initiatives, and community engagement efforts.\n\nThe ideal candidate has a strong background in influencer marketing, creator partnerships, digital marketing, and community development, with the ability to turn creative campaigns into measurable sales growth.\n\nThis is a hands-on position that combines marketing strategy, content creation, relationship management, and on-camera brand representation.\n\nThe selected candidate will work closely with company leadership to develop and execute marketing initiatives, build relationships with creators, manage live selling programs, and expand the brand's presence across digital platforms.\n\nThis position requires working on-site in Brooklyn five days per week, with regular involvement in content shoots, product demonstrations, live selling events, and community activities.\n\nKey Responsibilities\n\nInfluencer & Creator Marketing\n\n\tDevelop, manage, and expand the company's influencer and brand ambassador programs.\n\n\tIdentify, recruit, and establish relationships with content creators and influencers.\n\n\tManage paid partnerships and ongoing creator collaborations from initial outreach through campaign completion.\n\n\tDevelop creative briefs and provide direction for content across Instagram, Facebook, YouTube, and other platforms.\n\n\tCoordinate approximately 2–4 influencer campaigns per month.\n\n\tManage creator budgets, campaign timelines, deliverables, and payments.\n\n\tMonitor campaign performance and identify opportunities to improve engagement, conversions, and sales.\n\n\tBuild scalable systems for managing creator relationships and marketing initiatives.\n\nLive Selling & On-Camera Content\n\n\tDevelop and manage the company's live selling program across platforms such as TikTok Shop, YouTube Live, and Amazon Live.\n\n\tHost engaging live shopping events featuring product demonstrations and brand storytelling.\n\n\tPresent products confidently and communicate their features, benefits, and value.\n\n\tCoordinate with creators and brand ambassadors to participate in live selling events.\n\n\tDevelop live show formats, product selections, and promotional strategies.\n\n\tAppear in marketing videos, product demonstrations, creator collaborations, and media interviews.\n\n\tMonitor live selling performance and recommend strategies to increase sales and customer engagement.\n\n\tHelp transform successful live selling content into additional marketing assets.\n\nDigital Marketing & Growth Strategy\n\n\tIdentify new marketing opportunities and present actionable growth strategies to company leadership.\n\n\tDevelop campaign proposals supported by performance data, projected costs, and expected returns.\n\n\tTest approximately 1–2 new marketing channels per quarter.\n\n\tCollaborate across paid social, email marketing, SMS, organic content, website marketing, and public relations.\n\n\tAnalyze marketing performance and identify opportunities to improve customer acquisition and revenue.\n\n\tDevelop monthly forecasts for creator marketing and contribute to broader marketing revenue projections.\n\n\tManage creative testing initiatives, including A/B testing and content optimization.\n\n\tRepurpose high-performing creator content for paid advertisements, landing pages, and email campaigns.\n\n\tPresent marketing results and recommendations during weekly performance meetings.\n\nE-Commerce & Website Merchandising\n\n\tSupport website and Amazon merchandising initiatives.\n\n\tCoordinate product launches, restocks, and presale campaigns.\n\n\tAlign marketing activities with product availability and inventory levels.\n\n\tAssist with optimizing product presentations and promotional content.\n\n\tMonitor website performance and identify opportunities to improve conversions.\n\n\tCollaborate with internal teams to ensure marketing campaigns support sales and inventory objectives.\n\nContent Production & Community Engagement\n\n\tCoordinate product photography, video shoots, and other creative production activities.\n\n\tManage freelance photographers, editors, and external production partners.\n\n\tOrganize product samples and materials for influencer collaborations and content shoots.\n\n\tPlan and execute community events, brand partnerships, and promotional activities throughout the NYC area.\n\n\tDevelop relationships with outdoor enthusiasts, community organizations, and relevant brand partners.\n\n\tIdentify opportunities to strengthen brand awareness and customer loyalty.\n\n\tRepresent the brand professionally at events, shoots, and promotional activities.\n\nQualifications\n\n\t3–5+ years of marketing experience required, preferably
