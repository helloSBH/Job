<script>
const JOBS = [{"id": "27093", "title": "Bookkeeper", "bhTitle": "Bookkeeper", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-25", "exp": "2027-02-25", "desc": "Location: Brooklyn, NY\n Employment Type: Full-Time\n Work Arrangement: Hybrid (In-Office Monday–Thursday, Remote on Fridays)\n\n  Job Description\n\n  An established real estate firm with projects throughout Brooklyn and Manhattan is seeking an experienced, highly organized, and detail-oriented Bookkeeper / Executive Assistant / Office Manager to oversee its financial records, support executive leadership, and manage daily office operations.\n\n  The ideal candidate will have strong bookkeeping, administrative, and office management skills, along with proficiency in QuickBooks and Microsoft Office.\n\n  This multifaceted position involves managing financial activities across multiple real estate entities, tracking project budgets and expenses, providing executive support to company principals, and coordinating with external business partners.\n\n  The company is seeking someone who is dependable, proactive, discreet, and capable of independently managing multiple responsibilities in a professional environment.\n\n  Fluency in both spoken and written Hebrew and English is required.\n\n  Key Responsibilities\n\n  Bookkeeping & Financial Management\n\n\t \tManage day-to-day bookkeeping and financial records across multiple entities.\n\n\t \tOversee accounts payable and accounts receivable.\n\n\t \tPerform bank and account reconciliations.\n\n\t \tManage payroll and related financial documentation.\n\n\t \tPrepare financial reports and maintain accurate accounting records.\n\n\t \tTrack project budgets, expenses, and cash flow across multiple real estate entities.\n\n\t \tCoordinate with the company's outside CPA regarding accounting and financial matters.\n\n\t \tMaintain accurate financial records using QuickBooks.\n\n\t \tMonitor outstanding payments, invoices, and financial obligations.\n\n  Executive & Administrative Support\n\n\t \tProvide comprehensive executive and administrative support to company principals.\n\n\t \tManage executive calendars, appointments, and meeting schedules.\n\n\t \tPrepare and manage correspondence in both English and Hebrew.\n\n\t \tDraft, organize, and maintain business documents and reports.\n\n\t \tCoordinate communications with attorneys, brokers, lenders, and contractors.\n\n\t \tAssist leadership with project-related administrative responsibilities.\n\n\t \tTrack outstanding assignments and ensure timely follow-through.\n\n\t \tHandle sensitive business and financial information with discretion and confidentiality.\n\n  Office Management & Operations\n\n\t \tOversee daily office operations and administrative activities.\n\n\t \tManage vendor relationships, office supplies, and service providers.\n\n\t \tMaintain organized electronic and physical filing systems.\n\n\t \tCoordinate communication between company leadership and external business partners.\n\n\t \tEnsure business records and project-related documentation remain accurate and organized.\n\n\t \tSupport the administrative needs of multiple real estate projects.\n\n\t \tMaintain an efficient, professional, and well-organized office environment.\n\n\t \tProactively identify and address administrative and operational needs.\n\n  Qualifications\n\n\t \tFluency in spoken and written Hebrew required.\n\n\t \tFluency in spoken and written English required.\n\n\t \tMinimum of 5 years of experience in bookkeeping, executive assistance, and/or office management required.\n\n\t \tStrong proficiency in QuickBooks and Microsoft Office, particularly Excel.\n\n\t \tExperience managing accounts payable, accounts receivable, payroll, and account reconciliations.\n\n\t \tAbility to track budgets, expenses, and cash flow across multiple entities.\n\n\t \tStrong administrative and executive support capabilities.\n\n\t \tExcellent written and verbal communication skills.\n\n\t \tStrong organizational skills and exceptional attention to detail.\n\n\t \tAbility to manage multiple responsibilities and competing priorities.\n\n\t \tAbility to work independently and demonstrate strong initiative.\n\n\t \tProfessional demeanor, sound judgment, and discretion when handling confidential information.\n\n\t \tDependable, proactive, and solution-oriented mindset.\n\n\t \tAbility to work in person at the Brooklyn office Monday through Thursday.\n\n\t \tExperience in real estate, property management, or real estate development preferred."}, {"id": "27092", "title": "Sales", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Remote / Hybrid", "typeNote": "Remote/Hybrid/PT", "state": "NY", "added": "2026-11-25", "exp": "2027-01-19", "desc": "Jeweler who specializes in diamonds and lab created diamonds looking for people to bring in sales. Can work your own hours, remotely. Split the profit 50%.\n\n He has a website to show the product and can make any piece buyer has in mind."}, {"id": "27091", "title": "Receptionist / Administrative Assistant", "bhTitle": "Receptionist", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-25", "exp": "2027-02-18", "desc": "Full-Time | NY\n\n  A growing, internationally connected consumer products company is seeking a polished, friendly, and organized Receptionist to serve as the first point of contact for its New York office.\n\n  The company works across multiple consumer product categories, including pet, baby, personal care, and fragrance, partnering with well-known national brands and international manufacturing and sourcing partners.\n\n  This is an excellent opportunity for someone who is professional, personable, detail-oriented, and enjoys working in a busy corporate office environment.\n\n  Responsibilities\n\n\t \tGreet visitors, clients, and business partners in a warm and professional manner.\n\n\t \tAnswer and direct incoming phone calls and manage general inquiries.\n\n\t \tMonitor and distribute incoming mail and deliveries.\n\n\t \tMaintain a neat, organized, and welcoming reception area.\n\n\t \tCoordinate conference room scheduling and meeting arrangements.\n\n\t \tProvide general administrative and clerical support to various departments.\n\n\t \tAssist with office supplies, vendor coordination, and day-to-day office needs.\n\n\t \tSupport scheduling, filing, data entry, and other special projects as needed.\n\n  Qualifications\n\n\t \tPrevious receptionist or administrative experience preferred.\n\n\t \tExcellent communication and interpersonal skills.\n\n\t \tProfessional, polished, and welcoming demeanor.\n\n\t \tStrong organizational skills and attention to detail.\n\n\t \tComfortable with Microsoft Office, Outlook, and general computer applications.\n\n\t \tAbility to multitask, prioritize, and work independently.\n\n\t \tReliable, punctual, and service-oriented."}, {"id": "27090", "title": "Human Resources & Recruiting Manager", "bhTitle": "Human Resources", "category": "HR, Management & Fundraising", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-25", "exp": "2027-02-10", "desc": "NY | Full-Time\n\n  A growing, internationally connected consumer products organization is seeking a hands-on, people-oriented HR & Recruiting Manager to oversee recruitment, employee relations, company culture, and human resources operations.\n\n  The organization operates across several consumer product categories, including pet, baby, personal care, and fragrance. With headquarters in New York and manufacturing and sourcing partnerships throughout the United States, Mexico, India, Pakistan, Bangladesh, and China, the company offers a dynamic, fast-paced, and collaborative work environment.\n\n  This is an excellent opportunity for someone who enjoys building relationships, attracting top talent, strengthening company culture, and helping an organization grow.\n\n  Key Responsibilities\n\n  Recruiting & Talent Acquisition\n\n\t \tOversee full-cycle recruitment for corporate, sales, operations, sourcing, and administrative positions.\n\n\t \tDevelop creative sourcing strategies to attract and retain qualified talent.\n\n\t \tManage job postings, candidate screening, interviews, references, and offer processes.\n\n\t \tBuild relationships with recruiting agencies, universities, and other talent sources as needed.\n\n\t \tPartner with department heads to understand staffing needs and hiring priorities.\n\n  Human Resources & Employee Relations\n\n\t \tServe as a resource for employees and management on HR-related matters.\n\n\t \tOversee onboarding, orientation, employee documentation, and offboarding.\n\n\t \tHelp develop and implement HR policies, procedures, and best practices.\n\n\t \tSupport performance management, employee development, and retention initiatives.\n\n\t \tMaintain compliance with applicable employment laws and regulations.\n\n  Company Culture & Employee Engagement\n\n\t \tFoster a positive, professional, and collaborative workplace culture.\n\n\t \tDevelop employee engagement initiatives, company events, and recognition programs.\n\n\t \tPromote communication and teamwork across departments.\n\n\t \tHelp build an environment where employees feel valued, supported, and motivated.\n\n\t \tWork closely with leadership to strengthen the overall employee experience.\n\n  Qualifications\n\n\t \t5+ years of experience in Human Resources, recruiting, talent acquisition, or a related role.\n\n\t \tStrong full-cycle recruiting experience and ability to manage multiple searches simultaneously.\n\n\t \tExcellent interpersonal, communication, and organizational skills.\n\n\t \tComfortable working directly with senior management and department heads.\n\n\t \tProactive, resourceful, and solutions-oriented personality.\n\n\t \tAbility to balance strategic HR initiatives with hands-on day-to-day responsibilities.\n\n\t \tExperience in a growing, fast-paced corporate environment preferred.\n\n  Ideal Candidate\n\n  A personable, energetic HR professional who enjoys working with people, has excellent judgment, and can take ownership of recruiting and employee culture. Someone who is equally comfortable interviewing candidates, advising management, organizing employee initiatives, and putting effective HR processes in place."}, {"id": "27089", "title": "Social Media Manager", "bhTitle": "Social Media Manager", "category": "E-commerce, Marketing & Social Media", "type": "Temporary", "typeNote": "", "state": "NY", "added": "2026-11-25", "exp": "2026-12-15", "desc": "Temp Social Media. Great for College kid or extra side hustle! Retail Stores specializing in Squishy's seeking Temp till X-mas social media person to drive biz!"}, {"id": "27088", "title": "Bookkeeper", "bhTitle": "Bookkeeper", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-25", "exp": "2027-02-25", "desc": "Location: Manhattan, NY\n Employment Type: Full-Time\n Work Arrangement: Initially in-office, with the opportunity to transition to a hybrid schedule once established in the role.\n\n  Job Description\n\n  An established company in Manhattan is seeking an experienced, highly organized, and detail-oriented Full Charge Bookkeeper to oversee its day-to-day accounting and financial operations.\n\n  The ideal candidate will have strong bookkeeping and accounting experience, proficiency in QuickBooks, knowledge of factoring, and the ability to independently manage all aspects of bookkeeping through year-end closing.\n\n  This position involves managing accounts payable and receivable, performing financial reconciliations, handling chargebacks, preparing financial reports, and coordinating with the company's CPA.\n\n  The company is seeking someone who demonstrates strong analytical abilities, accuracy, accountability, and the ability to independently manage multiple financial responsibilities.\n\n  Experience in the wholesale or apparel industry is preferred.\n\n  Key Responsibilities\n\n  Bookkeeping & Account Reconciliation\n\n\t \tPerform bank, factoring, loan account, American Express, and financial statement reconciliations.\n\n\t \tManage accounts payable, accounts receivable, cash applications, billing, and bank deposits.\n\n\t \tReview and approve accounts payable invoices for posting.\n\n\t \tGenerate accounts payable reports and prepare checks.\n\n\t \tProcess and accurately record wire transfers.\n\n\t \tTransfer account activity into QuickBooks using data transfer tools.\n\n\t \tMaintain accurate and up-to-date accounting records.\n\n  Factoring & Chargeback Management\n\n\t \tSubmit customer credit line requests through the factoring portal.\n\n\t \tMaintain accurate factoring records and account information.\n\n\t \tInvestigate, research, and dispute customer chargebacks.\n\n\t \tMaintain and reconcile a separate chargeback account in QuickBooks.\n\n\t \tMonitor and resolve discrepancies related to factoring and chargebacks.\n\n  Financial Reporting & Accounting\n\n\t \tCompile and generate commission and royalty reports.\n\n\t \tCoordinate with the company's CPA and assist with bank audits.\n\n\t \tManage year-end closings, adjusting entries, and journal entries.\n\n\t \tEnsure financial activities comply with Generally Accepted Accounting Principles (GAAP).\n\n\t \tPrepare financial and management reports as needed.\n\n\t \tMaintain bookkeeping for an affiliated small real estate company.\n\n\t \tEnsure the accuracy and completeness of financial documentation.\n\n  Administrative Responsibilities\n\n\t \tMaintain accurate and organized financial records.\n\n\t \tMaintain electronic and physical filing systems.\n\n\t \tEnsure financial documentation is properly organized and accessible.\n\n\t \tHandle confidential financial information with professionalism and discretion.\n\n  Qualifications\n\n\t \tMinimum of 3 years of relevant bookkeeping experience required.\n\n\t \tExperience in the wholesale or apparel industry preferred.\n\n\t \tStrong proficiency in QuickBooks and Microsoft Excel.\n\n\t \tExperience working with factoring companies and factoring portals.\n\n\t \tExperience investigating, disputing, and resolving customer chargebacks.\n\n\t \tStrong understanding of accounting principles and GAAP.\n\n\t \tExperience managing accounts payable and accounts receivable.\n\n\t \tExperience with financial reporting, account reconciliations, and year-end closings.\n\n\t \tAbility to prepare journal entries and adjusting entries.\n\n\t \tExcellent organizational skills and attention to detail.\n\n\t \tStrong analytical and problem-solving abilities.\n\n\t \tAbility to independently manage multiple accounting responsibilities.\n\n\t \tAbility to prioritize assignments and meet deadlines.\n\n\t \tExcellent communication and interpersonal skills.\n\n\t \tDependable, proactive, and capable of taking ownership of daily financial operations."}, {"id": "27086", "title": "Restaurant Cashier", "bhTitle": "Cashier", "category": "Restaurant & Food Service", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-24", "exp": "2027-01-19", "desc": "Job Description\n\n  An established restaurant is seeking a friendly, reliable, and organized Cashier / Phone Order Associate to handle customer transactions, answer incoming phone calls, and process food orders.\n\n  The ideal candidate will have excellent communication and customer service skills, strong attention to detail, and the ability to multitask in a fast-paced restaurant environment.\n\n  This position involves interacting directly with customers, accurately entering orders, processing payments, and coordinating with kitchen staff to ensure orders are prepared correctly and efficiently.\n\n  Key Responsibilities\n\n\t \tGreet customers and provide friendly, professional customer service.\n\n\t \tAnswer incoming telephone calls and accurately take food orders.\n\n\t \tProcess in-person and telephone orders using the restaurant's point-of-sale (POS) system.\n\n\t \tHandle cash, credit card, and other payment transactions.\n\n\t \tAnswer customer questions regarding menu items, pricing, and availability.\n\n\t \tCommunicate special requests and order modifications to kitchen staff.\n\n\t \tCoordinate takeout orders and ensure they are ready for pickup.\n\n\t \tVerify order accuracy before providing orders to customers.\n\n\t \tAddress customer inquiries and concerns professionally.\n\n\t \tMaintain an organized and clean cashier and front-counter area.\n\n\t \tWork collaboratively with restaurant management and kitchen staff.\n\n\t \tAssist with general front-of-house responsibilities as needed.\n\n  Qualifications\n\n\t \tExcellent customer service and interpersonal skills.\n\n\t \tStrong verbal communication and telephone etiquette.\n\n\t \tAbility to multitask in a fast-paced restaurant environment.\n\n\t \tStrong attention to detail and order accuracy.\n\n\t \tComfortable handling cash and processing customer payments.\n\n\t \tBasic computer and mathematical skills.\n\n\t \tFriendly, professional, and positive demeanor.\n\n\t \tDependable, punctual, and responsible.\n\n\t \tAbility to work independently and as part of a team.\n\n\t \tStrong organizational and time-management skills."}, {"id": "27085", "title": "Restaurant Cashier", "bhTitle": "Cashier", "category": "Restaurant & Food Service", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-24", "exp": "2027-02-24", "desc": "Job Description\n\n  An established restaurant is seeking a friendly, reliable, and organized Cashier / Phone Order Associate to handle customer transactions, answer incoming phone calls, and process food orders.\n\n  The ideal candidate will have excellent communication and customer service skills, strong attention to detail, and the ability to multitask in a fast-paced restaurant environment.\n\n  This position involves interacting directly with customers, accurately entering orders, processing payments, and coordinating with kitchen staff to ensure orders are prepared correctly and efficiently.\n\n  Key Responsibilities\n\n\t \tGreet customers and provide friendly, professional customer service.\n\n\t \tAnswer incoming telephone calls and accurately take food orders.\n\n\t \tProcess in-person and telephone orders using the restaurant's point-of-sale (POS) system.\n\n\t \tHandle cash, credit card, and other payment transactions.\n\n\t \tAnswer customer questions regarding menu items, pricing, and availability.\n\n\t \tCommunicate special requests and order modifications to kitchen staff.\n\n\t \tCoordinate takeout orders and ensure they are ready for pickup.\n\n\t \tVerify order accuracy before providing orders to customers.\n\n\t \tAddress customer inquiries and concerns professionally.\n\n\t \tMaintain an organized and clean cashier and front-counter area.\n\n\t \tWork collaboratively with restaurant management and kitchen staff.\n\n\t \tAssist with general front-of-house responsibilities as needed.\n\n  Qualifications\n\n\t \tExcellent customer service and interpersonal skills.\n\n\t \tStrong verbal communication and telephone etiquette.\n\n\t \tAbility to multitask in a fast-paced restaurant environment.\n\n\t \tStrong attention to detail and order accuracy.\n\n\t \tComfortable handling cash and processing customer payments.\n\n\t \tBasic computer and mathematical skills.\n\n\t \tFriendly, professional, and positive demeanor.\n\n\t \tDependable, punctual, and responsible.\n\n\t \tAbility to work independently and as part of a team.\n\n\t \tStrong organizational and time-management skills."}, {"id": "27082", "title": "Assistant Manager", "bhTitle": "Manager", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-24", "exp": "2027-02-24", "desc": "Employment Type: Full-Time\n Schedule: Sunday–Thursday, 11:30 AM–10:00/10:30 PM, and Saturday evenings when sundown is early. One night per week go home earlier than 10pm.\n\n  Job Description\n\n  An established restaurant is seeking a motivated, dependable, and organized Assistant Manager to help oversee daily restaurant operations, supervise staff, and maintain a high standard of customer service.\n\n  The ideal candidate will have strong leadership, communication, and organizational skills, with the ability to manage multiple responsibilities in a fast-paced restaurant environment.\n\n  This position involves working closely with management to ensure smooth daily operations, coordinate employees, address customer concerns, and maintain a positive dining experience.\n\n  Key Responsibilities\n\n\t \tAssist management with overseeing daily restaurant operations.\n\n\t \tSupervise and coordinate restaurant staff throughout each shift.\n\n\t \tEnsure excellent customer service and overall guest satisfaction.\n\n\t \tAddress customer inquiries, concerns, and complaints professionally.\n\n\t \tCoordinate communication between front-of-house and kitchen staff.\n\n\t \tMonitor employee performance and productivity.\n\n\t \tEnsure restaurant cleanliness, organization, and operational efficiency.\n\n\t \tAssist with employee scheduling and shift coverage.\n\n\t \tSupport opening and closing procedures.\n\n\t \tHelp resolve operational challenges in a timely and professional manner.\n\n\t \tMaintain a positive, productive, and team-oriented work environment.\n\n\t \tEnsure restaurant policies and food safety standards are followed.\n\n  Qualifications\n\n\t \tStrong leadership and team management abilities.\n\n\t \tExcellent communication and interpersonal skills.\n\n\t \tStrong organizational and multitasking abilities.\n\n\t \tAbility to work efficiently in a fast-paced restaurant environment.\n\n\t \tProfessional and customer-service-oriented demeanor.\n\n\t \tStrong problem-solving and decision-making skills.\n\n\t \tDependable, punctual, and responsible.\n\n\t \tAbility to work independently and collaboratively with management.\n\n\t \tAvailability to work the required schedule, including Saturday evenings when applicable."}, {"id": "27081", "title": "Administrative Assistant", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "Not listed", "added": "2026-11-24", "exp": "2027-02-24", "desc": "Location: New York, NY\n Schedule: Must be available to work overtime and extended hours, including Sundays, during busy periods, tax season, and quarter-end closings.\n\n  Job Description\n\n  An established and growing Certified Public Accounting (CPA) firm in New York, NY, is seeking a highly organized, detail-oriented, and professional Administrative Assistant to join its team.\n\n  The ideal candidate will have strong administrative and computer skills, excellent written and verbal communication abilities, and a commitment to providing exceptional customer service.\n\n  This position involves supporting accountants, managers, and executive leadership with daily administrative responsibilities, tax return preparation and assembly, electronic filing, client communications, financial documentation, and general office operations.\n\n  The firm is looking for someone who is proactive, dependable, technologically proficient, and capable of managing multiple responsibilities in a fast-paced professional environment.\n\n  The candidate must be flexible and available to work extended hours during tax season and other peak business periods.\n\n  Key Responsibilities\n\n  Administrative & Executive Support\n\n\t \tProvide comprehensive administrative support to accountants, managers, and executive leadership.\n\n\t \tAssist with daily office operations and administrative responsibilities.\n\n\t \tPrepare correspondence, letters, reports, and professional documents.\n\n\t \tReview, organize, and route incoming correspondence.\n\n\t \tCollect, research, and organize information for management.\n\n\t \tInterface with executive leadership and clients on key projects and initiatives.\n\n\t \tMaintain organized files, records, and administrative documentation.\n\n\t \tHandle confidential client and company information with discretion.\n\n  Client Communication & Customer Service\n\n\t \tAnswer multi-line telephone systems professionally and promptly.\n\n\t \tScreen unsolicited calls politely and direct legitimate inquiries to appropriate staff members.\n\n\t \tProvide excellent customer service to existing and prospective clients.\n\n\t \tCommunicate with clients regarding outstanding information and documentation needed by accounting staff.\n\n\t \tAssist clients with electronically signing required documents and forms.\n\n\t \tRespond to client inquiries professionally and ensure timely follow-through.\n\n\t \tMaintain positive relationships with clients and external business partners.\n\n\t \tRepresent the firm professionally in all client-facing interactions.\n\n  Tax Return Processing & Electronic Filing\n\n\t \tAssemble completed client tax returns and financial statements.\n\n\t \tFollow specific document assembly requirements based on individual client needs.\n\n\t \tTrack and electronically file tax returns using ProSystem fx Tax software.\n\n\t \tPrepare paper filing copies when applicable.\n\n\t \tPackage completed tax returns and financial statements for presentation to clients.\n\n\t \tAssist with scanning, copying, organizing, and assembling financial documents.\n\n\t \tPrepare labels, index tabs, binders, and supporting materials for financial reports.\n\n\t \tEnsure accuracy, completeness, and professional presentation of client documentation.\n\n  Computer & Administrative Reporting\n\n\t \tCreate and maintain Microsoft Excel spreadsheets for managers to track accounting, tax, and other professional services.\n\n\t \tPrepare and edit documents using Microsoft Word, Excel, Outlook, and Adobe applications.\n\n\t \tMaintain accurate administrative records and tracking systems.\n\n\t \tAssist with organizing and managing electronic and physical documents.\n\n\t \tSupport accounting staff with administrative and technology-related tasks.\n\n\t \tMaintain strong attention to detail when processing financial and administrative information.\n\n  Billing & Accounts Receivable Support\n\n\t \tAssist with accounts receivable, billing, collections, and reconciliations as needed.\n\n\t \tRespond to client inquiries regarding billing history and outstanding balances.\n\n\t \tAccept and process customer payments by check, credit card, and cash.\n\n\t \tProcess credit card transactions and provide payment receipts.\n\n\t \tAssist with maintaining accurate billing and payment records.\n\n\t \tCoordinate with accounting staff regarding outstanding payments and billing discrepancies.\n\n\t \tSupport general financial administrative responsibilities as assigned.\n\n  Qualifications\n\n\t \tHigh school diploma required; bachelor's degree preferred.\n\n\t \tStrong proficiency in Microsoft Word, Excel, Outlook, and Adobe required.\n\n\t \tExperience with ProSystem fx Tax and QuickBooks is a plus.\n\n\t \tExcellent written and verbal English communication skills.\n\n\t \tAbility to communicate clearly and professionally with senior leadership, clients, and external business partners.\n\n\t \tStrong administrative and organizational abilities.\n\n\t \tExceptional attention to detail and accuracy.\n\n\t \tStrong technical and computer skills.\n\n\t \tAbility to manage multiple assignments and competing priorities.\n\n\t \tExcellent customer service and interpersonal skills.\n\n\t \tProfessional demeanor and strong client-facing abilities.\n\n\t \tAbility to work efficiently in a fast-paced accounting office.\n\n\t \tStrong problem-solving skills and ability to think quickly.\n\n\t \tAbility to maintain confidentiality when handling sensitive financial and client information.\n\n\t \tDependable, proactive, and capable of working independently and collaboratively.\n\n\t \tAvailability to work overtime and extended hours, including Sundays, during tax season, quarter-end closings, and other busy periods."}, {"id": "27080", "title": "Medical Assistant", "bhTitle": "Medical Assistant", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-24", "exp": "2027-02-24", "desc": "Location:  Queens, NY\n Employment Type: Four Days per Week\n Schedule: Monday, Tuesday & Thursday, 9:00 AM–6:00 PM; Friday, 9:00 AM–2:00 PM\n\n  Job Description\n\n  An established pediatric medical practice in Inwood, NY, is seeking an experienced, compassionate, and detail-oriented Medical Assistant (MA) to serve as the primary Medical Assistant in its office.\n\n  The ideal candidate will have previous experience working in a physician's office or outpatient clinic, strong clinical and organizational skills, and hands-on experience with eClinicalWorks (eCW).\n\n  This position involves preparing pediatric patients for examinations, obtaining vital signs, maintaining accurate electronic medical records, assisting the physician during patient visits and procedures, and coordinating with office staff to ensure appointments run smoothly.\n\n  The practice is looking for someone who enjoys working with children and families, demonstrates dependable attendance, and can independently manage daily clinical responsibilities while maintaining a welcoming and professional environment.\n\n  Key Responsibilities\n\n  Patient Care & Clinical Support\n\n\t \tRoom pediatric patients and prepare them for medical examinations.\n\n\t \tObtain and accurately document patient vital signs.\n\n\t \tReview and update patient medications, allergies, and medical histories.\n\n\t \tPrepare examination rooms for patient appointments and procedures.\n\n\t \tAssist the physician during patient visits and medical procedures as needed.\n\n\t \tCommunicate professionally and compassionately with children and their families.\n\n\t \tHelp maintain a comfortable and positive patient experience.\n\n  Electronic Medical Records & Documentation\n\n\t \tMaintain accurate and up-to-date patient records using eClinicalWorks (eCW).\n\n\t \tDocument patient vital signs, medications, allergies, and medical histories.\n\n\t \tEnsure patient charts remain organized and current.\n\n\t \tTrack outstanding patient follow-up tasks within eClinicalWorks.\n\n\t \tMaintain patient confidentiality and handle sensitive medical information professionally.\n\n\t \tEnsure accurate and timely completion of clinical documentation.\n\n  Clinical Office Operations\n\n\t \tCoordinate with the front desk and clinical team to ensure appointments run efficiently.\n\n\t \tMaintain an organized and consistent patient flow throughout the day.\n\n\t \tPrepare, clean, organize, and restock examination rooms.\n\n\t \tMonitor examination room supplies and replenish them as needed.\n\n\t \tMaintain a clean, professional, and organized clinical workspace.\n\n\t \tIndependently manage the daily responsibilities of the primary Medical Assistant.\n\n\t \tWork collaboratively with the physician and administrative staff.\n\n  Qualifications\n\n\t \tPrevious Medical Assistant experience in a physician's office or outpatient clinic required.\n\n\t \tHands-on experience with eClinicalWorks (eCW) required.\n\n\t \tExperience obtaining and documenting patient vital signs.\n\n\t \tStrong attention to detail and organizational abilities.\n\n\t \tAbility to maintain accurate electronic medical records.\n\n\t \tExcellent communication and interpersonal skills.\n\n\t \tProfessional, friendly, and compassionate manner when working with children and families.\n\n\t \tDependable attendance and strong work ethic.\n\n\t \tAbility to independently manage daily Medical Assistant responsibilities.\n\n\t \tStrong multitasking and time-management abilities.\n\n\t \tAbility to collaborate effectively with physicians, clinical staff, and front desk personnel."}, {"id": "27079", "title": "Full job description", "bhTitle": "Purchasing", "category": "Other", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-24", "exp": "2027-02-01", "desc": "About Us\n\n  Full-service apartment building supply company with 5 locations throughout Brooklyn, Bronx, Manhattan and New Jersey. Our distribution center is located in the Bronx with our own fleet of trucks and all of our locations stock a multitude of items. For over 35 years, we have been providing world class service to our customers and pride ourselves on being the industry standard for apartment building supply.\n\n  Purchasing Manager Responsibilities\n\n  The Purchasing Manager position essential duties and responsibilities include:\n\n\tMaintaining inventory for Main Warehouse and 5 Locations\n\tKeeping up with Industry Trends by sourcing new items to stock and discontinuing obsolete items\n\tCultivating relationships with existing and new vendors\n\tNegotiating optimal pricing with vendors to maximize revenue\n\tCoordinating daily transfers of stock between locations\n\tCommunicating with vendors regarding deliveries, pricing, availability, etc.\n\tManaging staff in the Purchasing Dept. as well as supporting and assisting Special Orders staff to ensure Purchasing Dept. running smoothly.\n\tWorking with the Distribution Dept. and Customer Service Dept. to ensure customer satisfaction in regards to items, pricing and availability.\n\n  Qualifications\n\n\tStrong ability to cultivate relationships & negotiate\n\tMaintain a high level of organization\n\tTime management\n\tStrong eye for detail and follow through. Accountability is key.\n\tExcellent communication & interpersonal skills; written and verbal\n\tStrong data entry skills with experience in email correspondence\n\n  Benefits\n\n\tOffice Hours: Monday – Thursday 8:00 AM – 5 PM. Friday: 8:00 AM – 2 PM\n\tStable company that's been in business for over 35 years\n\tPaid sick/ vacation and holiday time\n\tMedical benefits\n\tPersonalized Attention and Very Friendly atmosphere\n\tAdvancement/ Growth Opportunities\n\tStrong emphasis on team work, collaborative work environment\n\n  Job Type: Full-time"}, {"id": "27078", "title": "Studio & Operations Manager", "bhTitle": "Manager", "category": "Administrative & Office", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-11-24", "exp": "2027-02-24", "desc": "Location: Brooklyn, NY (In-Office)\n Job Type: Full-Time\n Schedule: Flexible / Includes opening, closing, and event hours\n\n Our studio is seeking a dedicated and organized Studio & Operations Manager to oversee daily operations, team scheduling, community events, and administrative reporting. The ideal candidate will take ownership of front desk and sauna operations, foster strong member retention, and ensure a seamless, high-quality experience for our community.  Key Responsibilities:\n\n\tRecruit, interview, and onboard instructors while creating and maintaining the weekly class schedule and coordinating instructor substitutions.\n\tManage studio booking software and memberships, oversee front desk and sauna operations, and maintain overall cleanliness along with opening/closing procedures.\n\tManage customer service and member retention initiatives, coordinate community events and Rooted Conversations, and handle private rentals and birthday bookings.\n\tMonitor class attendance, studio revenue, and payroll reporting.\n\tEnsure all classes are fully staffed and run on time, with no missed shifts without coverage.\n\tMaintain accurate booking and customer records, deliver weekly revenue and attendance reports, and resolve customer complaints promptly.\n\n  Qualifications:\n\n\tStrong leadership, team management, and staff scheduling capabilities.\n\tHands-on experience with studio booking software, membership management, and administrative tracking.\n\tExcellent customer service skills with a proven track record of handling client relations and resolving issues quickly.\n\tExceptional organizational skills and detail orientation across operations, cleanliness, and opening/closing protocols.\n\tAbility to manage community events, private rentals, and collaborative studio programming.\n\n  What We Offer:\n\n\tDynamic and supportive community studio culture.\n\tHands-on leadership role with direct impact on daily operations and growth.\n\tStable, ongoing management role supporting team members and clients alike."}, {"id": "27077", "title": "Sales", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-24", "exp": "2027-02-04", "desc": "Company Overview\n\n  Full-service apartment building supply company with 5 locations throughout Brooklyn, Bronx, Manhattan and New Jersey. Our distribution center is located in the Bronx with our own fleet of trucks and all of our locations stock a multitude of items. For over 35 years, we have been providing world class service to our customers and pride ourselves on being the industry standard for apartment building supply.\n\n  Account-Based Marketing & Sales Specialist Responsibilities\n\n\tProactively source and engage prospective customers via phone and email to introduce  and identify new business opportunities.\n\tFollow up promptly on leads, ask relevant questions, and determine customer needs and next steps.\n\tExplain our product selection and delivery services, and direct detailed product or pricing questions to the appropriate team member.\n\tBuild and maintain relationships with customers through regular, professional contact and reliable follow-up, or schedule appointments for and hand customer off to an outside sales representative.\n\tRecord customer information, conversations, lead status, appointments, and follow-up tasks accurately in our CRM software.\n\tCommunicate effectively with all departments within the company.\n\tCreative freedom to innovate and expand new ideas from concept to deployment.\n\n  Requirements\n\n\tFriendly, Enthusiastic & Self-Motivated\n\tExperience in Sales\n\tClear English speaking; Spanish speaking a plus\n\tBasic computer skills\n\n  Benefits\n\n\tOffice Hours: Monday – Thursday 9 AM – 5 PM. Friday: 9 AM – 2 PM\n\tStable company that's been in business for over 35 years\n\tPaid sick/ vacation and holiday time\n\tMedical benefits\n\tPersonalized Attention and Very Friendly atmosphere\n\tAdvancement/ Growth Opportunities\n\tStrong emphasis on teamwork, collaborative work environment\n\n  Benefits:\n\n\tEmployee discount\n\tHealth insurance\n\n  Ability to Commute:\n\n\tBrooklyn, NY (Required)"}, {"id": "27076", "title": "Job details", "bhTitle": "Business Developer", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-24", "exp": "2027-03-05", "desc": "Brooklyn, NY Full job description\n\n A consumer electronics manufacturer and wholesaler based in Brooklyn, is hiring a B2B New Business Development / Sales Manager to open new wholesale accounts and grow revenue across retail, e-commerce and distribution channels. This is a hunter role: you will own the full cycle from prospecting to first purchase order, then grow and manage the account.Key responsibilities\n\tIdentify, qualify and close new B2B accounts across the target channels below:\n\n  National and regional retail\n\n  Big-box, electronics specialty, mass merchants, supermarkets, drug and convenience chains\n\n  E-commerce\n\n  Online marketplaces, \"retailer .com\" sites, D2C and Amazon resellers\n\n  Distributors and wholesalers\n\n  Regional distributors, buying groups, export and dollar-store distributors\n\n  Off-price and value retail\n\n  Off-price chains, discount and closeout buyers\n\n  Specialty and independent\n\n\tTravel retail, airport stores, college bookstores, telecom dealers\n\n\tRecord prospects in the pipeline within organization's CRM system,\n\tRun outreach by phone, email, LinkedIn and in-person visits to buyers, category managers and procurement teams.\n\tPresent the product line, build tailored line reviews, and negotiate pricing, terms, MOQs, MAP and margin structure.\n\tRespond to RFPs and vendor onboarding requirements (EDI, compliance, routing guides, chargebacks).\n\tWork with operations, logistics and product teams on samples, forecasting, private label and launch timing.\n\tRepresent  at trade shows and customer meetings; turn show leads into closed business.\n\tTrack market trends, competitor pricing and category gaps to find new opportunities.\n\tHit quarterly new-revenue and new-account targets.\n\n Qualifications: Required\n\t5+ years of B2B sales or business development, with at least 3 years of new-account hunting.\n\tA track record of opening retail, e-commerce or distributor accounts in consumer electronics, accessories, small appliances or a related CPG category.\n\tExperience negotiating wholesale pricing, margins, terms and vendor agreements with retail buyers.\n\tComfortable with a CRM (Salesforce, HubSpot or similar) and Excel or Google Sheets for pricing and forecasts.\n\tStrong presentation, writing and follow-up skills.\n\tAble to travel and work trade shows (see below).\n\n  Preferred\n\n\tAn existing network of buyers at national retailers, marketplaces or distributors.\n\tKnowledge of retail vendor compliance: EDI, routing guides, chargebacks, retail link portals.\n\tExperience with Amazon Vendor/Seller Central or marketplace wholesale programs.\n\tExperience with private label or OEM programs and import / FOB pricing.\n\tBachelor's degree in business, marketing or a related field, or equivalent experience."}, {"id": "27075", "title": "Wholesale Home Products", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-24", "exp": "2027-02-18", "desc": "Job details\n\n 401(k), Health insurance, Paid time off, Vision insurance, Dental insurance\n Full-time\n New York, NY Full job description\n\n  Job Overview\n\n  Seeking a driven sales professional who thrives on building relationships, identifying new opportunities, and growing wholesale key retail accounts.\n\n  Responsibilities\n\n\tDevelop and grow sales with major retailers, off-price accounts, and clubs.\n\tPresent seasonal assortments, new product concepts, and licensed collections.\n\tWork closely with design, branding, merchandising, and sourcing teams to develop customer-specific programs.\n\tManage customer meetings, follow-up, pricing negotiations, and order execution.\n\tAnalyze market trends and competitive activity to identify growth opportunities.\n\n  Qualifications\n\n\t3-5+ years of sales experience in home textiles and/or hard home with off-price retailers and clubs.\n\tEntrepreneurial mindset with the ability to work collaboratively.\n\tStrong relationship building skills.\n\tExcellent communication and organizational skills.\n\n  If you have a passion for home products, enjoy developing new business and nurturing existing relationship, and want to help shape the future of a growing company, we'd love to hear from you.\n\n  Benefits:\n\n\t401(k)\n\tDental insurance\n\tHealth insurance\n\tPaid time off\n\tVision insurance\n\n  Experience:\n\n\twholesale: 3 years (Required)\n\toff price: 3 years (Required)\n\n  Work Location: In person"}, {"id": "27074", "title": "Sales Executive", "bhTitle": "Sales- Senior Level", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-24", "exp": "2027-02-24", "desc": "Location: New York, NY\n Employment Type: Full-Time (In-Person)\n Schedule: Monday–Friday\n\n  Job Description\n\n  An established company in the home goods industry is seeking a motivated, experienced, and results-driven Sales Executive to manage and grow business across a portfolio of national brick-and-mortar retail accounts.\n\n  The ideal candidate will have previous wholesale or retail-facing sales experience, strong relationship-building skills, and a proven track record of achieving and exceeding sales targets.\n\n  This position involves developing relationships with retail buyers, identifying opportunities to expand product placement, increasing sales within existing accounts, and working closely with internal product development teams to meet customer needs.\n\n  The company is looking for someone who is adaptable, entrepreneurial, collaborative, and comfortable working in a fast-paced environment. A successful candidate will demonstrate strong initiative, creative thinking, and the ability to identify new opportunities that contribute to long-term business growth.\n\n  Previous sales experience working with brick-and-mortar retailers in the home goods or related product categories is required.\n\n  Key Responsibilities\n\n  Sales & Account Management\n\n\t \tManage, maintain, and grow business relationships with national retail accounts.\n\n\t \tDevelop strong, long-term relationships with retail buyers and business partners.\n\n\t \tIdentify opportunities to increase sales and expand product placement within existing accounts.\n\n\t \tUnderstand customer needs, purchasing priorities, and merchandise requirements.\n\n\t \tDevelop sales strategies to achieve and exceed revenue targets.\n\n\t \tMaintain consistent communication and follow-up with retail customers.\n\n\t \tIdentify opportunities to strengthen account performance and customer retention.\n\n\t \tPresent relevant products and merchandise opportunities to retail buyers.\n\n\t \tSupport the company's overall sales and revenue growth objectives.\n\n  Product Development & Retail Partnerships\n\n\t \tWork closely with internal product development teams to meet retailer requirements.\n\n\t \tCommunicate customer feedback, product requests, and emerging market trends.\n\n\t \tCollaborate with internal teams to develop product offerings that align with customer needs.\n\n\t \tIdentify opportunities to introduce new products and expand existing product categories.\n\n\t \tMaintain a strong understanding of retail purchasing trends and customer preferences.\n\n\t \tSupport successful product presentations and retail account initiatives.\n\n\t \tCoordinate with relevant departments to ensure customer expectations are met.\n\n  Business Development & Sales Strategy\n\n\t \tIdentify new opportunities to expand business with national brick-and-mortar retailers.\n\n\t \tResearch market trends, product categories, and potential growth opportunities.\n\n\t \tMonitor sales performance and identify areas for improvement.\n\n\t \tAnalyze customer purchasing patterns and category performance.\n\n\t \tContribute to strategic sales planning and business development initiatives.\n\n\t \tDevelop creative and practical approaches to increasing sales.\n\n\t \tProactively identify challenges and implement effective solutions.\n\n\t \tMaintain a results-oriented approach to account development and revenue growth.\n\n  Internal Collaboration & Leadership\n\n\t \tWork collaboratively across departments to support successful execution of sales initiatives.\n\n\t \tMaintain clear communication with product development and other internal teams.\n\n\t \tDemonstrate leadership qualities, initiative, and accountability.\n\n\t \tManage multiple accounts, projects, and sales priorities simultaneously.\n\n\t \tMaintain organized records of customer communications and sales activities.\n\n\t \tContribute ideas and recommendations to improve sales strategies and business performance.\n\n\t \tRepresent the company professionally during customer meetings and business interactions.\n\n  Required Experience\n\n  Candidates must have previous wholesale or retail-facing sales experience working with brick-and-mortar retailers in one or more of the following product categories:\n\n\t \tHome Textiles\n\n\t \tSeasonal Products\n\n\t \tMirrors & Home Décor\n\n\t \tPet Products\n\n\t \tBaby & Kids Products\n\n\t \tTabletop\n\n\t \tKitchen Products\n\n\t \tBath Products\n\n\t \tPaper Goods\n\n\t \tBath & Body\n\n\t \tElectronics\n\n  Qualifications\n\n\t \tPrevious wholesale or retail-facing sales experience in the specified product categories required.\n\n\t \tExperience working with major brick-and-mortar retail accounts.\n\n\t \tProven track record of achieving and exceeding sales targets.\n\n\t \tStrong understanding of retail buyer relationships and wholesale sales.\n\n\t \tExcellent communication, negotiation, and interpersonal skills.\n\n\t \tStrong account management and relationship-building abilities.\n\n\t \tAbility to identify opportunities for product placement and sales growth.\n\n\t \tStrong analytical skills and ability to evaluate sales performance and market trends.\n\n\t \tExcellent organizational and time-management skills.\n\n\t \tAbility to manage multiple customer accounts and business priorities.\n\n\t \tSelf-motivated, achievement-driven, and results-oriented.\n\n\t \tCreative thinker with a proactive, solution-driven mindset.\n\n\t \tAbility to work independently while collaborating effectively with internal teams.\n\n\t \tComfortable working in a fast-paced, entrepreneurial environment.\n\n\t \tStrong attention to detail and consistent follow-through.\n\n\t \tAbility to commute to New York, NY.\n\n\t \tWillingness to travel up to 25% preferred."}, {"id": "27073", "title": "Sales", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-11-23", "exp": "2027-02-17", "desc": "Trucking company seeking sales person to help broker trucks. They do not have trucks throughout the country. When someone is interested in a truck in an area they do not service, they are looking for someone to find a trucking company that does service that area, and broker a deal with the client. Full time, in Newark, NJ."}, {"id": "27072", "title": "Account Manager", "bhTitle": "Account Manager", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-23", "exp": "2027-02-23", "desc": "Location: Brooklyn, NY\n Employment Type: Full-Time\n\n  Job Description\n\n  An established company serving the renovation and construction industries is seeking a highly motivated, experienced, and results-driven Account Manager to oversee and grow its existing customer relationships while identifying opportunities to reactivate inactive accounts and develop new business.\n\n  The ideal candidate will have strong account management experience, excellent relationship-building skills, and a proven ability to grow customer accounts and generate new business opportunities.\n\n  This position involves managing a portfolio of approximately 40 active customer accounts and 40 inactive accounts, with a primary focus on increasing business from existing customers, reestablishing relationships with past clients, and developing new connections with general contractors and hotel management companies.\n\n  The company is looking for someone who is proactive, organized, personable, and comfortable taking ownership of a large account portfolio while consistently identifying opportunities for growth.\n\n  A successful candidate will be able to strengthen existing relationships, reconnect with inactive customers, and develop new business opportunities within the renovation industry.\n\n  Key Responsibilities\n\n  Existing Account Management\n\n\t \tManage and maintain relationships with approximately 40 existing customer accounts.\n\n\t \tServe as the primary point of contact for assigned clients.\n\n\t \tDevelop strong, long-term relationships with customers and key decision-makers.\n\n\t \tMaintain regular communication with existing accounts to understand their needs and upcoming projects.\n\n\t \tIdentify opportunities to increase sales and expand business within current accounts.\n\n\t \tProvide excellent customer service and ensure timely follow-through on client requests.\n\n\t \tMonitor account activity and identify opportunities for additional business.\n\n\t \tAddress customer concerns and work toward effective solutions.\n\n\t \tMaintain a proactive approach to account management and customer satisfaction.\n\n  Inactive Account Reactivation\n\n\t \tTake responsibility for approximately 40 inactive customer accounts.\n\n\t \tReach out to previous customers to reestablish communication and business relationships.\n\n\t \tIdentify reasons for inactivity and explore opportunities to regain business.\n\n\t \tDevelop strategies to reactivate dormant accounts and encourage repeat business.\n\n\t \tResearch past account activity to identify potential opportunities.\n\n\t \tMaintain consistent follow-up with inactive customers.\n\n\t \tRebuild relationships with previous clients and key contacts.\n\n\t \tTrack account reactivation progress and identify opportunities for long-term growth.\n\n\t \tWork toward converting inactive accounts into active, revenue-generating customers.\n\n  Business Development & Relationship Building\n\n\t \tIdentify and pursue new business opportunities within the renovation industry.\n\n\t \tDevelop relationships with general contractors and hotel management companies.\n\n\t \tResearch potential customers and identify key decision-makers.\n\n\t \tEstablish new business connections and introduce the company's services to prospective clients.\n\n\t \tBuild relationships with contractors, property-related businesses, and hospitality industry professionals.\n\n\t \tIdentify upcoming renovation projects and potential business opportunities.\n\n\t \tExpand the company's network of customers and industry contacts.\n\n\t \tMaintain regular communication with prospective clients and follow up on business opportunities.\n\n\t \tSupport the company's overall revenue growth and customer acquisition objectives.\n\n  Sales Growth & Account Development\n\n\t \tDevelop strategies to increase revenue from existing and reactivated accounts.\n\n\t \tIdentify opportunities for additional projects and repeat business.\n\n\t \tWork toward account growth and performance goals.\n\n\t \tMonitor customer activity and recognize opportunities to strengthen relationships.\n\n\t \tMaintain a strong understanding of customer needs and business priorities.\n\n\t \tProactively follow up on potential projects and sales opportunities.\n\n\t \tCollaborate with internal teams to ensure customer needs are addressed.\n\n\t \tContribute to the company's overall business development and sales objectives.\n\n  Account Organization & Internal Coordination\n\n\t \tMaintain accurate and organized records of customer interactions and account activity.\n\n\t \tTrack active accounts, inactive accounts, and new business opportunities.\n\n\t \tDocument follow-up activities and relationship development progress.\n\n\t \tCoordinate with internal departments regarding customer needs and ongoing projects.\n\n\t \tProvide updates on account performance and business development activities.\n\n\t \tManage multiple customer relationships and priorities efficiently.\n\n\t \tEnsure consistent communication and timely resolution of account-related matters.\n\n  Qualifications\n\n\t \tPrevious experience in account management, sales, or business development required.\n\n\t \tProven ability to manage and grow existing customer accounts.\n\n\t \tStrong experience building and maintaining long-term business relationships.\n\n\t \tExcellent communication, negotiation, and interpersonal skills.\n\n\t \tStrong sales abilities with a focus on account growth and customer retention.\n\n\t \tAbility to reactivate inactive accounts and rebuild customer relationships.\n\n\t \tComfortable managing a portfolio of approximately 80 active and inactive accounts.\n\n\t \tStrong organizational and time-management skills.\n\n\t \tSelf-motivated, proactive, and results-oriented.\n\n\t \tAbility to identify new business opportunities and develop relationships with prospective customers.\n\n\t \tStrong follow-up skills and attention to detail.\n\n\t \tExcellent problem-solving and customer service abilities.\n\n\t \tAbility to work independently and take ownership of assigned accounts.\n\n\t \tComfortable communicating with business owners, contractors, and management professionals.\n\n\t \tStrong understanding of customer relationship management and business development.\n\n\t \tAbility to manage multiple priorities and maintain consistent account communication.\n\n\t \tFamiliarity with renovation projects, general contractors, or the hospitality industry is beneficial.\n\n\t \tProfessional, dependable, and motivated to achieve performance goals."}, {"id": "27071", "title": "Business Development Specialist", "bhTitle": "Business Developer", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-23", "exp": "2027-02-23", "desc": "Location: Brooklyn, NY\n Employment Type: Full-Time\n\n  Job Description\n\n  An established company serving the renovation and new construction industries is seeking two highly motivated, proactive, and research-driven Business Development Specialists to identify new business opportunities, research construction projects, and support the company's continued growth.\n\n  The company is hiring for two separate positions: one Business Development Specialist focused on Renovation and one Business Development Specialist focused on New Construction.\n\n  Both individuals will work closely with the Head of Strategic Accounts to identify potential projects, research business opportunities, coordinate meetings, and develop relationships with key decision-makers in the construction industry.\n\n  The ideal candidates will have strong research and analytical skills, excellent organizational abilities, and experience working with CRM systems and large lead databases.\n\n  These positions require individuals who are comfortable conducting in-depth research, identifying potential customers, tracking construction projects, and consistently generating new business opportunities.\n\n  The company is looking for professionals who are resourceful, detail-oriented, persistent, and capable of independently identifying valuable leads and business prospects.\n\n  Key Responsibilities\n\n  Business Development & Lead Generation\n\n\t \tIdentify and research new business opportunities within the renovation and new construction industries.\n\n\t \tGenerate qualified leads and identify potential customers and business partners.\n\n\t \tResearch upcoming, active, and recently awarded construction projects.\n\n\t \tIdentify key decision-makers within target companies and organizations.\n\n\t \tDevelop strategies to uncover new projects and potential business opportunities.\n\n\t \tWork through a large database of leads to identify high-potential prospects.\n\n\t \tMaintain consistent research and prospecting efforts to support business growth.\n\n\t \tIdentify opportunities to establish relationships with general contractors and other relevant industry professionals.\n\n\t \tSupport the development of new business relationships and long-term growth opportunities.\n\n  Construction Project Research\n\n\t \tConduct detailed research on renovation and new construction projects.\n\n\t \tIdentify companies and general contractors involved in relevant projects.\n\n\t \tTrack project activity and research potential business opportunities.\n\n\t \tInvestigate projects that the company did not secure due to general contractor selection.\n\n\t \tIdentify the general contractors awarded those projects and evaluate potential opportunities to establish new relationships.\n\n\t \tResearch project stakeholders, contractors, and key decision-makers.\n\n\t \tGather relevant project information to support business development efforts.\n\n\t \tMaintain organized records of project research and findings.\n\n\t \tCommunicate valuable project intelligence to the Head of Strategic Accounts.\n\n  CRM Management & Lead Research\n\n\t \tWork extensively within the company's CRM system and lead database.\n\n\t \tReview, organize, and research large volumes of prospective business leads.\n\n\t \tIdentify qualified prospects and prioritize potential opportunities.\n\n\t \tMaintain accurate and updated records of leads, contacts, and project information.\n\n\t \tResearch companies, decision-makers, and relevant business opportunities.\n\n\t \tTrack outreach activity, meeting coordination, and lead development progress.\n\n\t \tIdentify patterns and opportunities within existing CRM data.\n\n\t \tEnsure important information is documented and accessible to the business development team.\n\n\t \tFollow up on research findings and outstanding opportunities.\n\n  Meeting Coordination & Strategic Account Support\n\n\t \tWork closely with the Head of Strategic Accounts to support business development initiatives.\n\n\t \tCoordinate and schedule meetings with prospective customers, contractors, and business partners.\n\n\t \tAssist with organizing meeting schedules and maintaining communication with relevant contacts.\n\n\t \tPrepare background research and relevant information ahead of business meetings.\n\n\t \tIdentify appropriate decision-makers and help facilitate introductions.\n\n\t \tTrack meeting outcomes and coordinate necessary follow-up activities.\n\n\t \tSupport strategic account development and relationship-building efforts.\n\n\t \tMaintain organized records of meetings, contacts, and business opportunities.\n\n  Renovation Business Development Specialist\n\n\t \tFocus on identifying and researching renovation-related projects and business opportunities.\n\n\t \tResearch contractors, companies, and decision-makers involved in renovation projects.\n\n\t \tIdentify potential renovation clients and opportunities for new business.\n\n\t \tMonitor renovation project activity and relevant industry developments.\n\n\t \tSupport outreach and meeting coordination with renovation-related prospects.\n\n\t \tWork with the Head of Strategic Accounts to expand the company's renovation business.\n\n  New Construction Business Development Specialist\n\n\t \tFocus on identifying and researching new construction projects and business opportunities.\n\n\t \tResearch general contractors and other decision-makers involved in new construction projects.\n\n\t \tIdentify potential customers and opportunities within the new construction sector.\n\n\t \tTrack project awards and investigate opportunities involving selected general contractors.\n\n\t \tSupport outreach and meeting coordination with new construction prospects.\n\n\t \tWork with the Head of Strategic Accounts to expand the company's new construction business.\n\n  Qualifications\n\n\t \tStrong experience in business development, lead generation, research, or a related field preferred.\n\n\t \tExperience working with CRM systems and managing large lead databases.\n\n\t \tStrong research and analytical abilities.\n\n\t \tExcellent organizational skills and attention to detail.\n\n\t \tAbility to conduct in-depth research on companies, projects, and industry contacts.\n\n\t \tStrong understanding of lead generation and business opportunity identification.\n\n\t \tAbility to identify key decision-makers and relevant business contacts.\n\n\t \tExcellent written and verbal communication skills.\n\n\t \tStrong time-management and multitasking abilities.\n\n\t \tComfortable coordinating meetings and managing follow-up responsibilities.\n\n\t \tSelf-motivated, proactive, and results-oriented.\n\n\t \tAbility to work independently and take initiative.\n\n\t \tStrong problem-solving skills and resourcefulness.\n\n\t \tAbility to organize, analyze, and maintain detailed business information.\n\n\t \tComfortable working with large amounts of data and researching multiple opportunities simultaneously.\n\n\t \tStrong follow-through and commitment to generating new business opportunities.\n\n\t \tAbility to collaborate effectively with senior leadership.\n\n\t \tFamiliarity with renovation, construction, general contractors, or construction project research is beneficial.\n\n\t \tProfessional, dependable, and highly motivated."}, {"id": "27070", "title": "Senior Account Executive", "bhTitle": "Account Manager", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-23", "exp": "2027-02-23", "desc": "Location: Brooklyn, NY\n Employment Type: Full-Time\n\n  Job Description\n\n  An established company serving the renovation and new construction industries is seeking two highly experienced, motivated, and results-driven Senior Account Executives to manage and grow its portfolio of key accounts.\n\n  The company is hiring for two separate positions: one Senior Account Executive specializing in Renovation and one Senior Account Executive specializing in New Construction.\n\n  Each Account Executive will assume responsibility for the day-to-day management of approximately 30 established key accounts, focusing on maintaining strong client relationships, identifying growth opportunities, and increasing overall account performance.\n\n  The ideal candidates will have strong account management experience, excellent relationship-building abilities, and a proven track record of growing and retaining high-value business accounts.\n\n  These positions require professionals who can independently manage important client relationships, understand customer needs, and develop strategies to maximize account growth and long-term business opportunities.\n\n  Key Responsibilities\n\n  Key Account Management\n\n\t \tTake ownership of approximately 30 established key accounts.\n\n\t \tManage daily account activities and tion to detail and consistent follow-through.\n\n\t \tFamiliarity with the renovation or new construction industries is beneficial, depending on the position."}, {"id": "27068", "title": "Women's Retail Apparel Sales Manager", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-11-23", "exp": "2027-02-23", "desc": "Location: Brooklyn, NY\n Employment Type: Full-Time or Part-Time\n\n  Job Description\n\n  An established women's retail apparel store in Boro Park, Brooklyn, is seeking an experienced, personable, and motivated Women's Retail Apparel Sales Manager to join its team.\n\n  The ideal candidate will have a strong background in women's fashion retail, excellent customer service skills, and the ability to manage daily sales operations while building lasting relationships with customers.\n\n  This position involves assisting customers with clothing selections, overseeing sales activities, supervising staff, maintaining an organized and attractive store environment, and helping drive overall sales performance.\n\n  The store is looking for someone who is fashion-conscious, outgoing, organized, and passionate about providing an exceptional shopping experience.\n\n  Both full-time and part-time opportunities are available.\n\n  Key Responsibilities\n\n  Retail Sales & Customer Service\n\n\t \tGreet customers and provide friendly, professional, and personalized assistance.\n\n\t \tHelp customers select clothing based on their preferences, needs, and personal style.\n\n\t \tOffer styling suggestions and product recommendations.\n\n\t \tBuild strong relationships with customers and encourage repeat business.\n\n\t \tProvide knowledgeable assistance regarding merchandise, sizing, and available styles.\n\n\t \tCreate a welcoming and enjoyable shopping experience.\n\n\t \tAddress customer questions and concerns professionally.\n\n\t \tHelp achieve individual and overall store sales goals.\n\n ntinuing care.\n\n\t \tWork toward reactivating inactive cases and restoring consistent services.\n\n\t \tMaintain regular communication with patients throughout the resolution process.\n\n\t \tUse strong relationship-building and communication skills to encourage continued engagement.\n\n\t \tTrack case progress and follow through until concerns are resolved.\n\n\t \tWork toward patient retention and case reactivation goals.\n\n  Conflict Resolution & Problem-Solving\n\n\t \tHandle challenging conversations with patience, professionalism, and confidence.\n\n\t \tUse effective communication techniques to de-escalate difficult situations.\n\n\t \tIdentify the underlying causes of patient dissatisfaction or service interruptions.\n\n\t \tThink creatively to develop practical solutions to complex concerns.\n\n\t \tAddress issues promptly and work to prevent further disruptions in care.\n\n\t \tBalance patient needs with organizational procedures and available resources.\n\n\t \tRemain calm, resourceful, and solution-oriented under pressure.\n\n  Team Collaboration & Administrative Responsibilities\n\n\t \tCoordinate with internal care teams to address patient concerns and service-related issues.\n\n\t \tCommunicate updates and relevant information to appropriate team members.\n\n\t \tMaintain accurate records of patient communications, concerns, and case progress.\n\n\t \tDocument follow-up efforts and resolutions.\n\n\t \tTrack active, inactive, and at-risk cases.\n\n\t \tCollaborate with colleagues to improve patient satisfaction and continuity of care.\n\n\t \tEnsure timely follow-through on outstanding concerns and assigned cases.\n\n\t \tSupport the organization's overall patient retention and service improvement efforts.\n\n  Qualifications\n\n\t \tExcellent communication and interpersonal skills required.\n\n\t \tStrong problem-solving and conflict-resolution abilities.\n\n\t \tAbility to handle challenging conversations and de-escalate difficult situations.\n\n\t \tResourceful, creative, and solution-oriented mindset.\n\n\t \tStrong relationship-building skills and ability to establish trust.\n\n\t \tSelf-motivated, persistent, and goal-driven.\n\n\t \tAbility to manage multiple patient cases and follow-up responsibilities.\n\n\t \tExcellent organizational and time-management skills.\n\n\t \tStrong attention to detail and ability to maintain accurate records.\n\n\t \tComfortable communicating with patients and families over the phone.\n\n\t \tAbility to work independently while collaborating with internal teams.\n\n\t \tProfessional, patient, and empathetic approach to sensitive situations.\n\n\t \tAbility to remain calm and focused under pressure.\n\n\t \tStrong follow-through and commitment to resolving concerns.\n\n\t \tComfortable working in a fast-paced healthcare environment."}, {"id": "27065", "title": "Recruitment Specialist", "bhTitle": "Human Resources", "category": "HR, Management & Fundraising", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-23", "exp": "2027-02-23", "desc": "Location: Williamsburg, Brooklyn, NY\n Employment Type: Full-Time\n Schedule: Monday–Friday, 9:00 AM–5:00 PM\n\n  Job Description\n\n  A growing home care organization in Williamsburg, Brooklyn, is seeking an energetic, personable, and goal-driven Recruitment Specialist to join its team.\n\n  The ideal candidate is confident on the phone, enthusiastic about connecting with people, and motivated to help prospective caregivers discover new career opportunities.\n\n  This position involves reaching out to potential caregivers, explaining available employment opportunities, answering questions, and guiding applicants through the recruitment and application process.\n\n  The company is looking for someone with excellent communication skills, a positive attitude, strong follow-up abilities, and a desire to succeed in a goal-oriented environment.\n\n  No previous human resources or recruitment experience is required. Paid naging IT budgets, vendors, and technology resources.\n\n\t \tAbility to work independently and make important technical decisions.\n\n\t \tStrong attention to detail and ability to manage multiple priorities.\n\n\t \tProfessional, dependable, and capable of handling confidential information."}, {"id": "27062", "title": "Deal Area", "bhTitle": "Marketing", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-11-23", "exp": "2027-02-04", "desc": "Copy Editor/Writer\n\n   The focus here is for a short-form content creator, more video tiktok/reals.\n\tCollaborate with the internal team to write copy for blogs, websites, graphics, promotions, emails, and social media with a focus on increasing engagement, expanding brand reach, promoting trial, and/or fostering advocacy.\n\n\tWork with the marketing department to write creative copy to support the marketing, editorial, and social media calendars for multiple brands.\n\n\tMaintain a flexible creative writing range and switch between the unique voice/tone of each of the brands we represent.\n\n\tWrite content targeted towards a variety of different audiences, while remaining within the brand voice.\n\n\tBe a resource for the internal team for all things related to copywriting best practices.\n\n Tactical Responsibilities\n\tCompose copy for blogs, website content, marketing campaigns, paid search, display ads, and social media.\n\n\tExecute social media posts and blogs across multiple platforms for multiple brands, as defined in social media playbooks and editorial calendars.\n\n\tCopyediting, report review, and assistance for internal team members."}, {"id": "27061", "title": "Administrative Assistant / Bookkeeper", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-11-23", "exp": "2027-02-23", "desc": "Location: Brooklyn, NY\n Employment Type: Full-Time\n\n  Job ool's office.\n\n\t \tMaintain organized financial files, documents, and records.\n\n\t \tAssist with data entry, spreadsheets, and administrative reporting.\n\n\t \tPrepare and update documents using Microsoft Excel and other office programs.\n\n\t \tHandle office correspondence and communications as needed.\n\n\t \tSupport school administration with various daily office responsibilities.\n\n\t \tCoordinate with staff to obtain necessary financial and administrative information.\n\n\t \tEnsure assigned tasks are completed accurately and on schedule.\n\n  Qualifications\n\n\t \tPrevious bookkeeping or accounting experience required.\n\n\t \tPayroll processing experience required.\n\n\t \tProficiency in QuickBooks and Microsoft Excel required.\n\n\t \tStrong understanding of bookkeeping procedures and financial recordkeeping.\n\n\t \tExcellent organizational skills and attention to detail.\n\n\t \tStrong written and verbal communication skills.\n\n\t \tAbility to maintain accurate financial records.\n\n\t \tComfortable working independently and managing multiple responsibilities.\n\n\t \tStrong time-management and problem-solving abilities.\n\n\t \tDependable, professional, and trustworthy.\n\n\t \tAbility to handle confidential financial and employee information.\n\n\t \tStrong computer skills and ability to learn new administrative systems.\n\n\t \tPrevious bookkeeping experience in a school or educational institution is a plus."}, {"id": "27059", "title": "Live Stream Host – Baby Accessories", "bhTitle": "Sales - LiveSelling", "category": "Sales & Live Selling", "type": "Part Time", "typeNote": "", "state": "NJ", "added": "2026-11-20", "exp": "2027-02-22", "desc": "Location: Ocean Township, NJ\n Employment Type: Part-Time, On-Site\n Schedule: Flexible Day, Evening, and Weekend Hours\n\n  Job Description\n\n  A growing baby accessories retailer in Ocean Township, NJ, is seeking enthusiastic, outgoing, and energetic Live Stream Hosts to present and sell baby products through live shopping platforms, including Whatnot and TikTok.\n\n  The company specializes in baby blankets, loveys, plush soothers, robes, hooded towels, swaddles, bibs, and gift bundles.\n\n  The ideal candidate is confident on camera, personable, sales-driven, and comfortable engaging with a live online audience.\n\n  This is an exciting opportunity for someone who enjoys interacting with customers, presenting products, and creating an engaging shopping experience through live video.\n\n  No previous live-streaming experience is required for candidates who are naturally comfortable on camera and have strong sales abilities.\n\n  This is an on-site position at the company's studio in Ocean Township, NJ.\n\n  Key Responsibilities\n\n  Live Streaming & Product Sales\n\n\t \tHost engaging live selling shows on Whatnot, TikTok, and other social commerce platforms.\n\n\t \tPresent and demonstrate baby accessories to online viewers.\n\n\t \tExplain product features, materials, and gift options in an engaging and informative manner.\n\n\t \tRun live auctions, promotional offers, and product bundle deals.\n\n\t \tEncourage customer participation and generate excitement during live shows.\n\n\t \tPromote products effectively to increase sales and customer engagement.\n\n\t \tMaintain an energetic, friendly, and professional on-camera presence.\n\n\t \tHelp customers select suitable baby products and gifts.\n\n  Customer Engagement & Communication\n\n\t \tInteract with viewers through live chats and respond to questions in real time.\n\n\t \tBuild positive relationships with customers and repeat viewers.\n\n\t \tProvide knowledgeable and friendly customer service.\n\n\t \tCreate an enjoyable and interactive live shopping experience.\n\n\t \tCommunicate product details, pricing, and promotions clearly.\n\n\t \tEncourage audience participation and repeat purchases.\n\n  Product Knowledge & Show Preparation\n\n\t \tLearn the company's baby accessory collections and product
