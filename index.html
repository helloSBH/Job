earning environment.\n\n\tCommunicate observations and student progress to supervising professionals.\n\nQualifications\n\n\tExperience working with children with autism or developmental disabilities preferred.\n\n\tFamiliarity with ABA principles is a plus.\n\n\tPatient, compassionate, energetic, and dependable.\n\n\tStrong communication and interpersonal skills.\n\n\tAbility to follow instructions and accept constructive feedback from supervisors.\n\n\tComfortable working collaboratively with teachers and BCBAs.\n\n\tStrong interest in early childhood education and special education.\n\n\tWillingness to learn and develop professionally."}, {"id": "26866", "title": "Designer", "bhTitle": "Designer", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-08", "exp": "", "desc": "About the Role\n\nWe are seeking an experienced Technical Designer specializing in Infant and Layette apparel to join our growing team. This role is ideal for a detail-oriented professional with a strong understanding of fit, garment construction, grading, and technical development.\n\nThe Technical Designer will work closely with our design team and overseas manufacturing partners to ensure each garment meets our standards for fit, quality, and production accuracy.\n\nKey Responsibilities\n\n\tDevelop block specifications based on established size ranges.\n\tPartner with designers throughout the sample development process to achieve the intended fit and aesthetic.\n\tPrepare detailed specifications for all stages of development, including first fit, second fit, PP, and shipping samples.\n\tIndependently coordinate and lead fit sessions.\n\tCommunicate fit comments, corrections, and technical revisions clearly to overseas patternmakers.\n\tDevelop grading for costing and pricing purposes.\n\tCreate bulk grading for production.\n\tMaintain accuracy and consistency across technical packages and production specifications.\n\tCollaborate with design and production teams to resolve technical challenges and ensure timely execution.\n\nQualifications & Experience\n\n\tMinimum 2 years of professional experience as a Technical Designer specializing in Infant and Layette apparel.\n\tStrong knowledge of infant garment construction, fit, grading, and technical specifications.\n\tExperience working with overseas factories and patternmakers.\n\tAbility to independently manage fit sessions and communicate technical corrections.\n\tStrong organizational skills and attention to detail.\n\tAbility to manage multiple styles and deadlines in a fast-paced environment.\n\nBased on experience and qualifications."}, {"id": "26864", "title": "Designer", "bhTitle": "Designer", "category": "Design & Creative", "type": "Remote / Hybrid", "typeNote": "Remote/Hybrid/FT", "state": "NJ", "added": "2026-10-08", "exp": "", "desc": "About the Role\n\nWe are seeking a talented and detail-oriented Layette Designer to join our creative team. This position is ideal for a designer who combines a strong aesthetic sensibility with technical expertise and a comprehensive understanding of infant apparel development.\n\nThe Layette Designer will be responsible for translating creative concepts into fully developed, production-ready garments while ensuring every design detail is clearly communicated and aligned with our quality, cost, and brand standards.\n\nKey Responsibilities\n\nDesign Development & Technical Execution\n\n\tTranslate creative concepts into comprehensive technical specifications.\n\tProvide all necessary information to execute each design, including:\n\n\t\tFabrication and material selection\n\t\tTrims and embellishments\n\t\tColor specifications\n\t\tSewing techniques\n\t\tGarment construction\n\t\tLabel placement\n\t\tArtwork and print design\n\t\tBudget adherence\n\t\tFit instructions\n\n\tEnsure all design information is accurately documented within the Tech Pack and PLM system.\n\tCreate and maintain complete, accurate, and production-ready tech packs.\n\tProvide original samples to support the development of new styles.\n\tMaintain the fabric library within the PLM system, including clear and accurate supplier information.\n\nCross-Functional Collaboration\n\n\tCollaborate closely with the Technical Designer to develop accurate development specifications.\n\tPartner with the Graphic Designer to create artwork, prints, and technical packages.\n\tIdentify and resolve design and construction challenges before sample development.\n\tWork collaboratively with overseas manufacturing partners to ensure design intent is maintained.\n\tAttend design meetings and adhere to established development deadlines and TIA calendar guidelines.\n\nQualifications & Experience\n\n\tExperience in layette, infant, or children's apparel design.\n\tStrong understanding of fabrications, trims, garment construction, and fit.\n\tAbility to independently create complete tech packs and artwork prints is required.\n\tExperience with PLM systems and apparel development processes.\n\tStrong attention to detail and ability to manage multiple projects.\n\tExcellent communication and problem-solving skills.\n\tAbility to balance creative vision with production feasibility and budget requirements.\n\n\tHybrid schedule: 2 days per week in-house, with the option to work remotely on remaining days."}, {"id": "26863", "title": "Product Development Intern – Fashion", "bhTitle": "Product Development Intern – Fashion", "category": "Production & Product Development", "type": "Internship", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-20", "desc": "Location: New York, NY\nEmployment Type: Part-Time/Full-Time, Paid\nSchedule: Monday–Thursday, 9:30 AM–5:00 PM (No Fridays)\n\nA growing fashion retail brand is seeking a creative and motivated Product Development Intern to join the team ASAP. This is a paid, hands-on opportunity for someone interested in fashion, product development, and the retail industry. The ideal candidate is organized, detail-oriented, and excited to help develop new products and collections.\n\nResponsibilities:\n\n\tResearch fashion trends, styles, fabrics, and materials\n\tAssist with developing new products and collections\n\tCreate product concepts, mood boards, and presentations\n\tResearch competitors, pricing, and market trends\n\tAssist with product samples, revisions, and organization\n\tCommunicate with vendors and support product development tasks\n\tMaintain product information and development files\n\tAssist with additional projects as needed\n\nQualifications:\n\n\tPassion for fashion and retail\n\tStrong creative and organizational skills\n\tDetail-oriented and eager to learn\n\tStrong communication skills\n\tInterest in product development, merchandising, or fashion business\n\tFashion, marketing, merchandising, or related experience is a plus\n\nRequirements: Must be able to work in person in New York City Monday through Thursday, 9:30 AM–5:00 PM, and be available to start ASAP."}, {"id": "26862", "title": "Teaching Assistant – Early Childhood & Elementary School", "bhTitle": "Teacher Assistant", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-07", "desc": "Location: Brooklyn, NY\nSchedule: Monday–Thursday, 8:15 AM–4:00 PM; Friday, 8:15 AM–12:30 PM\n\nSeeking Teaching Assistants to support lead classroom teachers in an early childhood and elementary school setting. Responsibilities include assisting with classroom activities, supporting students throughout the school day, helping with lessons and assignments, and maintaining a positive and organized classroom environment.\n\nThe ideal candidate is responsible, patient, caring, and enjoys working with children. Previous experience working with children or in a classroom setting is a plus."}, {"id": "26861", "title": "Shadow/ Paraprofessional", "bhTitle": "Shadow/ Paraprofessional", "category": "Education & Childcare", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2026-12-30", "desc": "We have a few classes that can use extra support. The school is in Brooklyn. The Hours are from 9:00am - 12:00pm - Duties, help engage with children, be a positive role model. Requirements, Yeshiva professional dress code. Great for someone under 40 years old looking for a meaningful part time position."}, {"id": "26860", "title": "Day Habilitation Coordinator", "bhTitle": "Coordinator", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-11", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nAn established organization providing services to individuals with developmental disabilities is seeking an organized, experienced, and hands-on Day Habilitation Coordinator to oversee the daily operations of its OPWDD-certified Day Habilitation program.\n\nThe Day Habilitation Coordinator will ensure the program operates smoothly, safely, and in compliance with New York State Office for People With Developmental Disabilities (OPWDD) regulations while providing meaningful, person-centered experiences for participants.\n\nThis role combines daily program management, staff supervision, regulatory compliance, and program development. The ideal candidate is a dependable leader who can manage multiple responsibilities, support staff, and contribute to the continued growth of the program.\n\nKey Responsibilities\n\nProgram Operations & Management\n\n\tOversee daily operations of the Day Habilitation program, ensuring activities and schedules run smoothly.\n\n\tCoordinate meaningful, age-appropriate activities aligned with each participant's individual goals and needs.\n\n\tEnsure services and activities follow person-centered planning principles.\n\n\tManage morning arrivals and afternoon dismissals.\n\n\tCoordinate transportation logistics with residences, families, and transportation providers.\n\n\tMaintain a safe, clean, organized, and welcoming program environment.\n\n\tServe as the primary on-site contact for operational issues and concerns.\n\n\tAddress daily challenges promptly and professionally.\n\n\tWork closely with program leadership to maintain efficient operations.\n\nStaff Supervision & Development\n\n\tSupervise, schedule, and support Direct Support Professionals (DSPs).\n\n\tProvide ongoing training, coaching, and performance feedback.\n\n\tAssist with onboarding and training new staff members.\n\n\tConduct staff meetings and communicate program expectations.\n\n\tMonitor staff performance and ensure responsibilities are completed appropriately.\n\n\tAddress staffing concerns and performance issues professionally.\n\n\tFoster a positive, collaborative, and supportive work environment.\n\nRegulatory Compliance & Documentation\n\n\tEnsure program operations comply with applicable OPWDD regulations and requirements.\n\n\tOversee accurate and timely completion of Day Habilitation documentation.\n\n\tMonitor staff compliance with documentation and service delivery procedures.\n\n\tSupport proper incident reporting, documentation, and follow-up.\n\n\tIdentify potential compliance concerns and assist with corrective actions.\n\n\tHelp maintain program readiness for inspections and regulatory reviews.\n\nProgram Growth & Community Engagement\n\n\tSupport the continued development and expansion of the Day Habilitation program.\n\n\tEstablish and maintain relationships with community organizations and local partners.\n\n\tAssist with new participant enrollments and intake coordination.\n\n\tIdentify opportunities for meaningful community-based activities.\n\n\tCollaborate with families, residential programs, and service providers.\n\n\tContribute ideas to improve program quality, participant engagement, and staff development.\n\nQualifications\n\n\tMinimum 2 years of experience working in OPWDD-regulated services required.\n\n\tAt least 1 year of supervisory or team leadership experience required.\n\n\tBachelor's degree in Human Services, Social Work, Psychology, or a related field preferred; equivalent relevant experience considered.\n\n\tStrong knowledge of OPWDD regulations, Day Habilitation documentation, and incident management.\n\n\tExperience supervising Direct Support Professionals or similar staff.\n\n\tExcellent organizational, communication, and leadership skills.\n\n\tStrong problem-solving abilities and sound professional judgment.\n\n\tAbility to manage multiple responsibilities in a fast-paced environment.\n\n\tAbility to remain calm and professional when handling challenges.\n\n\tUnderstanding of person-centered services for individuals with developmental disabilities.\n\n\tValid New York State driver's license preferred.\n\n\tSCIP-R/PROMOTE, CPR, and First Aid certification, or willingness to obtain.\n\n\tMust successfully complete required OPWDD background checks, including Justice Center Staff Exclusion List screening."}, {"id": "26859", "title": "Residential Support & Recreation Coordinator", "bhTitle": "Coordinator", "category": "Administrative & Office", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-11", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\nSchedule: 25–30 Hours per Week, Afternoon & Evening Hours\n\nPosition Overview\n\nA residential group home in Brooklyn is seeking a compassionate, organized, and dependable Residential Support & Recreation Coordinator to support adults with developmental disabilities.\n\nThis part-time position combines household organization, resident support, and recreational programming to help create a comfortable, welcoming, and engaging living environment.\n\nThe ideal candidate is patient, creative, and personable, with a genuine interest in supporting individuals with developmental disabilities and helping residents enjoy meaningful daily activities.\n\nKey Responsibilities\n\nResidential & Household Support\n\n\tHelp maintain a clean, organized, comfortable, and welcoming group home environment.\n\n\tEnsure resident bedrooms are tidy and assist with laundry, clothing organization, and labeling personal belongings.\n\n\tSupport residents in appropriately decorating and personalizing their bedrooms.\n\n\tAssist with seasonal clothing changes and wardrobe organization.\n\n\tKeep common areas organized, clean, and stocked with necessary supplies.\n\n\tHelp decorate and prepare the home for holidays and Yom Tov.\n\n\tIdentify and report maintenance or safety concerns to management.\n\n\tWork closely with residential staff to support daily routines and household needs.\n\nRecreation & Resident Engagement\n\n\tPlan, organize, and lead recreational activities for residents.\n\n\tFacilitate engaging activities such as games, music, arts and crafts, and group activities.\n\n\tEncourage residents to participate in activities based on their interests and abilities.\n\n\tPromote positive social interaction, inclusion, and meaningful engagement.\n\n\tBuild supportive, respectful relationships with residents.\n\n\tProvide light supervision during recreational activities and help maintain a safe environment.\n\n\tCoordinate activities and schedules with residential staff.\n\n\tHelp create a positive, enjoyable, and home-like atmosphere for all residents.\n\nQualifications\n\n\tExperience working with individuals with developmental disabilities preferred but not required.\n\n\tPatient, compassionate, respectful, and dependable.\n\n\tStrong organizational skills and attention to detail.\n\n\tCreative and comfortable planning and leading recreational activities.\n\n\tExcellent communication and interpersonal skills.\n\n\tAbility to build positive relationships with residents and coworkers.\n\n\tComfortable assisting with household organization, laundry, and daily routines.\n\n\tAbility to work independently and as part of a team.\n\n\tCPR/First Aid certification preferred, or willingness to obtain.\n\n\tTraining provided.\n\n\tMust be able to complete required background checks and medical/TB screening."}, {"id": "26858", "title": "CFO- Chief Financial Officer", "bhTitle": "CFO- Chief Financial Officer", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-04", "desc": "This role is for a CFO who will take financial leadership across multiple businesses and the Owner's personal finances. They will be responsible to ensure stronger control, clearer reporting, and more proactive decision-making. The right person will be fiscally responsible, hands-on, and thoughtful about protecting company resources. They should be comfortable questioning expenses, compensation increases, and other financial decisions when appropriate, with the goal of safeguarding company finances and improving long-term performance.\n\nWhat You Will Do\nThis person will oversee financial operations and strategy across multiple businesses (software company, e-commerce business, real estate operations, investments) as well as handling personal financial matters for the Owner.\n\nDay-to-day responsibilities include:\n\n\tOwn bookkeeping across all entities (directly or by supervising a bookkeeper) and ensure the monthly close is completed accurately and on time.\n\tReconcile bank, credit card, and loan accounts, and manage AP/AR, payroll, invoicing, collections, and aging end to end.\n\tMaintain a clean, consistent chart of accounts and handle intercompany transactions and allocations properly and in real time. Enforce clean separation between personal and business and maintain a personal budget and new worth statement.\n\tDeliver financial statements and consolidated reporting, with breakdowns by entity, property, business line, project, or customer as needed.\n\tBuild and maintain budgets, cash flow forecasts, and projections, and monitor\n\tperformance against plan.\n\tTrack key business and SaaS metrics, perform variance analysis, and provide proactive insights to leadership.\n\tAnalyze customer, account, pricing, and margin performance to support better business decisions.\n\tReview spending and vendor activity with a strong cost-conscious mindset, and identify waste or control weaknesses.\n\tTrack investments and portfolio performance and flag what needs attention\n\tLead financial cleanup and improvement efforts, including taxes, grants, R&D credits, and stronger processes and controls.\n\tCoordinate with attorneys and advisors as needed, driving the conversations rather than relying on them\n\tEnsure financial information is organized, accurate, and easy to access\n\nWhat We're Looking For\nThe ideal candidate:\n\n\tIs highly responsible, proactive, discreet and trustworthy. This is a role for someone ready to take complete financial responsibility. Owner will not be checking in on everything, it is the CFO's responsibility to initiate conversation and alert Owner to any pressing matters.\n\tIs proactive and fiscally responsible — thinks ahead, questions unnecessary\n\tspending, and helps protect company finances\n\tHas prior experience in a CFO, finance leadership, accounting, or similar senior financial role"}, {"id": "26857", "title": "Part-Time Social Media Manager", "bhTitle": "Social Media Manager", "category": "E-commerce, Marketing & Social Media", "type": "Remote / Hybrid", "typeNote": "Remote/Hybrid/PT", "state": "NJ", "added": "2026-10-08", "exp": "2026-12-31", "desc": "Seeking a creative and motivated Social Media Manager to join a growing team on a part-time basis. This role will focus on managing social media content, creating engaging visuals, and helping capture and edit content for clients.\n\nResponsibilities:\n\n\tManage and post Instagram Stories and social media content\n\tCreate graphics and other visual content\n\tFilm and edit social media content\n\tHelp develop engaging content that aligns with each client's brand\n\tOccasionally travel locally to film content for clients\n\nLocation: Remote, with occasional in-person filming in Deal, NJ. Ideally, candidates should be based in or near Deal due to the location of most clients.\n\nSchedule: Part-time, flexible"}, {"id": "26856", "title": "Sales Representative", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-11", "desc": "Location: New York, NY\nEmployment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nAn established off-price wholesale apparel company is seeking a motivated and results-driven Sales Representative to join its growing team.\n\nThe ideal candidate is a confident, personable, and hardworking sales professional who understands the wholesale apparel industry and enjoys building strong customer relationships. This position focuses on developing new business, opening accounts, maintaining existing customers, and driving sales growth.\n\nThis is an excellent opportunity for someone looking to build a long-term career in wholesale apparel sales while increasing their earning potential through commissions.\n\nKey Responsibilities\n\n\tIdentify and develop new business opportunities with retailers, wholesalers, and off-price buyers.\n\n\tProspect for potential customers, generate leads, and open new accounts.\n\n\tBuild and maintain strong relationships with existing and prospective customers.\n\n\tPresent available merchandise, negotiate pricing, and close sales.\n\n\tUnderstand customer needs and recommend appropriate products and inventory opportunities.\n\n\tMaintain consistent communication and follow-up to encourage repeat business.\n\n\tCollaborate with management and the purchasing team to stay informed about available merchandise and inventory.\n\n\tManage customer accounts and identify opportunities to increase sales.\n\n\tWork toward individual sales goals and company revenue targets.\n\n\tMonitor market trends, customer demand, and new business opportunities.\n\nQualifications\n\n\tPrevious sales experience required.\n\n\tWholesale apparel or off-price industry experience strongly preferred.\n\n\tUnderstanding of wholesale pricing, profit margins, and customer relationships.\n\n\tStrong communication, negotiation, and interpersonal skills.\n\n\tConfident and comfortable reaching out to prospective customers.\n\n\tSelf-motivated, persistent, and results-oriented.\n\n\tStrong work ethic and willingness to actively pursue new business.\n\n\tExcellent organizational and follow-up skills.\n\n\tAbility to work independently while contributing to a team environment.\n\n\tExisting relationships with retail or wholesale buyers are a plus."}, {"id": "26855", "title": "Administrative Assistant", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-04", "desc": "Food/Catering Services company is looking for a reliable, motivated Administrative Assistant to support the business with customer service, online and in-store sales, purchasing, and general administrative tasks.\n\nFull-Time / Monday–Friday\nHours to be discussed.\n\nEssential Duties & Responsibilities\n\n\tProvide customer service to online and in-store customers.\n\tAssist with the online store and customer orders.\n\tAssist with purchasing and ordering.\n\tHandle general administrative and office tasks.\n\tHelp with day-to-day business operations.\n\tAssist with other tasks and projects as needed.\n\nQualifications & Requirements\n\n\tMust be available to work Monday through Friday.\n\tMust be able to drive.\n\tNo specific experience required — training will be provided.\n\tMust be motivated, reliable, and willing to learn.\n\tGood communication and organizational skills.\n\tMust be comfortable working in a fast-paced environment.\n\nDepending on experience and ability.\n\nAdditional Information\n\nDriving requirement is not for deliveries. The candidate must be able to drive occasionally if needed to visit another location in New Jersey or another location the company may be opening.\n\nThis is a great opportunity for someone who is motivated, wants to learn, and is looking to grow with the company."}, {"id": "26853", "title": "Part-Time Medical Office Front Desk", "bhTitle": "Part-Time Medical Office Front Desk", "category": "Healthcare & Human Services", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-07", "exp": "2027-01-08", "desc": "Medical office seeking a part-time Front Desk candidate to assist with patient reception, scheduling, and general office support.\n\nSchedule:\nMonday–Thursday starting at 2 PM\nFriday 10 AM–1 PM\nSunday 9 AM–12 PM\n\nQualifications: College student or graduate preferred; strong communication, organization, and customer service skills. Medical or office experience is a plus."}, {"id": "26851", "title": "IT Support Associate", "bhTitle": "Computers IT", "category": "Technology & IT", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-07", "exp": "2027-01-13", "desc": "Department: Administration\nLocations: Lower East Side, NY & Dyker Heights, Brooklyn\n\nSeeking an IT Support Associate to provide first-level technical support to staff and programs. This position will help users troubleshoot and resolve technical issues, escalating when needed, while providing strong customer service and supporting the day-to-day operations of the IT department.\n\nResponsibilities:\n\n\tProvide first-level IT support and troubleshoot user issues.\n\n\tInstall, maintain, and support Windows systems, software, and hardware.\n\n\tManage users and accounts through Active Directory and Office 365.\n\n\tParticipate in system upgrades, replacements, and other IT projects.\n\n\tProvide IT support across various locations throughout the five boroughs.\n\n\tManage multiple tasks and projects while prioritizing work with limited supervision.\n\n\tSupport program initiatives as needed, including outside standard working hours.\n\n\tPerform other job-related duties as assigned.\n\nQualifications:\n\n\tHigh school diploma or GED required; Associate or College degree preferred.\n\n\t3+ years of experience supporting computer systems, with a strong background and interest in helpdesk support.\n\n\tStrong knowledge of Windows PCs, Active Directory, and Office 365.\n\n\tA+ certification is a plus.\n\n\tExcellent verbal and written communication and customer service skills.\n\n\tStrong analytical and troubleshooting abilities.\n\n\tAble to work under pressure, meet deadlines, and maintain a positive attitude.\n\n\tAbility to work independently and complete assignments with limited supervision.\n\n\tValid NYS Driver's License and clean driving record required.\n\nPhysical Requirements:\n\n\tAbility to maintain regular and punctual attendance and meet job performance standards.\n\n\tMust be able to lift and carry up to 35 lbs.\n\n\tMust be able to communicate clearly by speaking, listening, and talking.\n\n\tReasonable accommodations may be made to enable individuals with disabilities to perform essential job functions."}, {"id": "26850", "title": "Senior Sales Manager (Toy Division)", "bhTitle": "Division Manager", "category": "HR, Management & Fundraising", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-07", "exp": "2027-01-07", "desc": "Location: Brooklyn, NY\nJob Type: Full-Time\nSchedule: Monday to Friday\n\nWe are seeking an ambitious, mid to senior level Sales Manager to lead and scale our Toy Division. With an established foundation of existing licenses, open accounts, and a newly secured major brand license, this role offers an incredible growth trajectory. You will take ownership of developing new retail partnerships, driving revenue across major accounts, and expanding brand distribution. While prior experience in the toy industry is preferred, experienced sales professionals with a strong background in general consumer hardlines are encouraged to apply.\n\nKey Responsibilities:\n\n\tLead overall sales strategy and account development for our growing Toy Division.\n\n\tTarget, pitch, and secure new retail accounts across mass market, specialty, and e-commerce channels.\n\n\tCapitalize on our newly acquired major brand license to maximize distribution and shelf placement.\n\n\tMaintain strong relationships with active retail buyers while re-engaging open accounts.\n\n\tCollaborate closely with internal product development and management teams to align product lines with market demand.\n\n\tAnalyze sales metrics, forecast order volume, and hit aggressive sales targets.\n\nQualifications:\n\n\t5+ years of successful B2B sales experience in consumer hardlines or the toy industry.\n\n\tProven track record of opening new accounts, building key buyer relationships, and driving volume growth.\n\n\tStrong presentation, negotiation, and contract closing skills.\n\n\tAbility to work independently, prioritize sales leads, and manage multiple retail pipelines.\n\n\tHigh energy and entrepreneurial mindset with a commitment to scaling a brand division.\n\nWhat We Offer:\n\n\tSignificant career advancement potential as you build and run a primary category driver.\n\n\tA strong portfolio of active licenses and major brand partnerships.\n\n\tCollaborative, creative work environment based in Brooklyn, NY."}, {"id": "26849", "title": "WHAT YOU'LL DO", "bhTitle": "Interior Design Intern", "category": "Design & Creative", "type": "Internship", "typeNote": "", "state": "NY", "added": "2026-10-07", "exp": "", "desc": "• Help create furniture packages, room layouts, mood boards, and design concepts.\n• Work with floor plans and tools such as Rayon, AutoCAD, SketchUp, Canva, or similar software.\n• Create social media content, graphics, photography, and marketing materials.\n• Help develop Instagram, LinkedIn, and other marketing campaigns.\n• Assist with product presentations, renderings, and visual presentations.\n• Bring fresh creative ideas to our brand, products, and marketing strategy.\n• Work directly with our leadership team on real-world projects.\nWHO WE'RE LOOKING FOR\n• Current college student studying Design, Marketing, Architecture, Interior Design, Graphic Design, Business, or a related field.\n• Creative, energetic, entrepreneurial, and eager to learn.\n• Strong eye for design, aesthetics, and visual storytelling.\n• Social media savvy and comfortable creating content.\n• Organized, proactive, and able to manage multiple projects.\n• Experience with Canva, Adobe, CAD, or similar tools is a plus — not required.\n• Portfolio or examples of your work are a plus.\nWHY JOIN?\nReal work. Real projects. Real responsibility. You'll work alongside an entrepreneurial team, contribute to projects across the country, and have the chance to see your creative work become part of real spaces.\n\n\t\t\tPAID INTERNSHIP  •  BROOKLYN / NEW YORK  •  FLEXIBLE AROUND CLASS SCHEDULE"}, {"id": "26846", "title": "Technical Designer / Spec Technician", "bhTitle": "Product Development", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-07", "exp": "2027-01-07", "desc": "Employment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nAn apparel company is seeking an experienced Technical Designer / Spec Technician specializing in children's apparel. This position will focus primarily on boys' and girls' sleepwear, swimwear, and intimates, covering sizes from 12 months through size 16.\n\nThe ideal candidate has extensive experience in the budget children's sleepwear market and a strong technical understanding of fit, grading, pattern-making, sewing, garment construction, and fabrications.\n\nKey Responsibilities\n\n\tCreate accurate size specifications for children's apparel ranging from 12 months through size 16.\n\tDevelop specifications for boys' and girls' sleepwear, swimwear, and intimates.\n\tPerform grading across applicable size ranges.\n\tEvaluate fit samples and provide detailed fit and construction comments.\n\tIdentify fit, measurement, and garment construction issues.\n\tCommunicate corrections and revisions clearly to factories.\n\tCreate diagrams and technical instructions showing factories how garment construction should be corrected.\n\tReview garments for proper fit, proportion, construction, and consistency.\n\tWork with design, production, and factory teams throughout the development process.\n\tMaintain accurate technical specifications and product documentation.\n\tEnsure corrections and approvals are communicated accurately and in a timely manner.\n\nQualifications\n\n\tMinimum 5 years of direct experience in the budget children's sleepwear market required.\n\tStrong product knowledge of children's sleepwear.\n\tExperience working with both boys' and girls' sleepwear.\n\tStrong knowledge of pattern-making, sewing, grading, and garment construction.\n\tExperience creating and maintaining garment size specifications.\n\tStrong understanding of both knit and woven fabrications.\n\tExperience working with a variety of fabrics and fabric finishes.\n\tAbility to evaluate fit samples and provide clear, detailed technical comments.\n\tAbility to communicate garment corrections effectively to overseas factories.\n\tIntermediate proficiency in Microsoft Excel and Adobe Illustrator required.\n\tKnowledge of FileMaker Pro is a plus.\n\tStrong computer skills with the ability to learn new systems quickly.\n\tHighly organized and detail-oriented.\n\tExcellent written and verbal communication skills.\n\tAbility to manage multiple styles and deadlines in a fast-paced apparel environment."}, {"id": "26845", "title": "Lead Designer / Merchandiser", "bhTitle": "Designer", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-07", "exp": "2027-01-07", "desc": "Employment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nA growing apparel company is seeking an experienced Lead Designer / Merchandiser – Children's Apparel to lead the merchandising and design of children's fashion apparel across multiple categories.\n\nThe position will focus on boys' and girls' newborn, infant, and toddler sportswear, as well as Toddler–20 sleepwear, swimwear, and intimates. The Lead Designer / Merchandiser will oversee products throughout the design and development lifecycle, from initial trend research, fabric selection, and body development through style creation, line adoption, and pre-production approval.\n\nThis role requires a strong combination of creative design, merchandising, technical apparel knowledge, trend awareness, and product development expertise.\n\nKey Responsibilities\n\nDesign & Merchandising\n\n\tIdentify market and fashion trends and translate them into commercially viable children's apparel.\n\tDesign branded, licensed, and private-label collections for mass merchants and specialty retailers.\n\tDevelop products across newborn, infant, toddler, and children's categories, including sportswear, sleepwear, swimwear, and intimates.\n\tSelect trend-right fabrics, silhouettes, colors, prints, graphics, and garment bodies.\n\tEnsure designs are appropriate for the intended age group, customer, price point, and retail channel.\n\tMaintain awareness of children's trends, including relevant toys, entertainment, movies, shows, graphics, and cultural influences.\n\tManage seasonal projects and help build cohesive product assortments.\n\nProduct Development\n\n\tWork closely with the Sales team and other designers to conceptualize complete garment designs and develop seasonal product lines.\n\tPrepare materials for design overview meetings, fabric meetings, and seasonal presentations.\n\tPresent and review trends, styles, fabrics, artwork, and product concepts with Sales and Sourcing.\n\tPartner with the Sourcing team to ensure fabrics, garment bodies, and constructions meet the requirements and price points of each line.\n\tPrepare detailed production packages containing garment specifications, trims, labeling, artwork, and other required information.\n\tEnsure designs and development materials are properly uploaded to the company database and server.\n\nSamples, Approvals & Production\n\n\tReview and approve fabrics, lab dips, artwork, garments, trims, and other development submissions.\n\tCommunicate comments, corrections, and approvals directly to factories.\n\tWork with Technical Design to evaluate garment construction, styling, and execution.\n\tMaintain strong technical knowledge of fabrics, garment construction, printing, and washing techniques.\n\tManage development schedules to ensure approvals are completed with sufficient lead time for production.\n\tMonitor projects from initial concept through pre-production approval.\n\nQualifications\n\n\t3–5 years of experience in children's apparel within a similar market required.\n\tBachelor's degree in Art, Design, Fashion Design, or a related field preferred.\n\tExperience designing for boys' and girls' newborn, infant, toddler, and children's apparel.\n\tAbility to develop a broad range of designs while working within customer and price-point requirements.\n\tStrong knowledge of children's fashion, graphics, prints, typography, illustration, and market trends.\n\tExperience with branded, licensed, and/or private-label apparel preferred.\n\tStrong technical understanding of garment construction, fabrics, printing, and washing techniques.\n\tProficiency in Adobe Illustrator, Photoshop, and InDesign required.\n\tExperience with Acrobat, Excel, FileMaker Pro, or additional design and digital tools is a plus.\n\tStrong organizational skills and exceptional attention to detail.\n\tAbility to manage multiple seasonal projects and priorities simultaneously.\n\tAbility to work effectively in a fast-paced, deadline-driven environment.\n\tAbility to take creative direction while bringing strong independent judgment and design intuition.\n\tExcellent written and verbal communication skills.\n\tStrong collaborative and team-oriented approach."}, {"id": "26844", "title": "Associate Designer", "bhTitle": "Designer", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-07", "exp": "2027-01-07", "desc": "Employment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nA fashion company is seeking an experienced and highly organized Associate Designer to support the Graphic Designer in developing and executing seasonal product lines for a graphic-focused fashion brand.\n\nThe Associate Designer will collaborate closely with the Sales, Design, Sourcing, Production, and Technical Design teams throughout the product development process. This role requires a strong understanding of fashion, graphics, color, trends, garment construction, and production, along with excellent organizational and follow-up skills.\n\nKey Responsibilities\n\nDesign & Product Development\n\n\tPartner with the Sales team and Graphic Designer to conceptualize complete garment designs and develop seasonal product lines.\n\tConduct trend shopping and research seasonal fashion trends, graphics, artwork, colors, fabrics, and styling.\n\tHelp translate seasonal concepts and trends into commercially viable apparel designs.\n\tPrepare materials for design overview meetings, fabric meetings, and seasonal product reviews.\n\tPresent and organize information related to styles, graphics, artwork, fabrics, and trends.\n\tCollaborate with Sales and Sourcing throughout the development process.\n\nSourcing & Production\n\n\tWork closely with the Sourcing team to ensure fabrics, body types, and garment constructions are appropriate and achievable for each product line.\n\tPrepare detailed production packages containing all required garment specifications.\n\tDevelop and maintain tech packs, color cards, artwork, trims, labeling, and garment details.\n\tEnsure designs, artwork, tech packs, and development materials are accurately uploaded to the company database and server.\n\tCommunicate development comments and updates directly with factories.\n\nSamples & Approvals\n\n\tReview and approve fabrics, lab dips, artwork, garments, trims, and strike-offs.\n\tProvide clear and timely comments to factories regarding required revisions.\n\tPartner with the Technical Design team to evaluate garment construction, fit, and styling.\n\tFollow samples and development materials through the approval process.\n\tMaintain accuracy and consistency across designs and production specifications.\n\nTimeline Management\n\n\tManage development schedules and track multiple styles simultaneously.\n\tEnsure approvals are completed according to established deadlines.\n\tMaintain sufficient lead time for garment production.\n\tFollow up with internal teams and factories to keep projects moving forward.\n\tIdentify potential delays and communicate issues proactively.\n\nQualifications\n\n\t3–5 years of fashion design, graphic design, apparel design, or product development experience.\n\tStrong understanding of fashion, graphics, color, trends, and apparel.\n\tExperience creating and maintaining detailed tech packs and production materials.\n\tKnowledge of garment construction, fabrics, trims, artwork, and product development.\n\tProficiency in Adobe Illustrator and Photoshop.\n\tExcellent organizational and follow-up skills.\n\tStrong attention to detail.\n\tAbility to manage multiple styles, projects, and deadlines simultaneously.\n\tAbility to collaborate effectively across Sales, Design, Sourcing, Production, and Technical Design teams.\n\tComfortable working in a fast-paced fashion environment."}, {"id": "26843", "title": "Social Media & Creative Studio Intern – Brooklyn/NYC", "bhTitle": "Art & Creative Intern", "category": "Design & Creative", "type": "Internship", "typeNote": "", "state": "NY", "added": "2026-10-07", "exp": "2027-01-21", "desc": "Creative studio in Brooklyn/NYC is looking for a motivated, creative intern to join their team! This is a great opportunity for a college student interested in social media, branding, content creation, marketing, or the creative industry to gain hands-on experience in a fun and collaborative environment.\n\nThe intern will have the opportunity to assist with social media, branding projects, content creation, creative brainstorming, and day-to-day studio projects while learning how a creative business operates. 5–10 hours per week, with flexibility around a student's schedule. This can be completed for college credit or as an unpaid internship.\n\nLocation: Brooklyn/NYC\nHours: 5–10 hours/week\nIdeal Candidate: Creative, motivated, organized, and interested in social media, branding, and the creative industry."}, {"id": "26842", "title": "Intake Coordinator", "bhTitle": "Intake", "category": "Healthcare & Human Services", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-06", "exp": "2027-01-06", "desc": "Location: Flatbush, Brooklyn, NY\nEmployment Type: Full-Time, In-Person\nExperience Level: Entry Level\n\nPosition Overview\n\nA growing organization in Brooklyn is seeking a motivated and personable Intake Coordinator to join its team. This is an excellent entry-level opportunity for someone who is organized, friendly, and interested in building a career in a supportive professional environment.\n\nThe Intake Coordinator will work directly with clients, assist with forms and documentation, and help ensure the intake process is handled accurately and efficiently. The ideal candidate is a strong communicator who enjoys helping people and can maintain excellent attention to detail.\n\nKey Responsibilities\n\n\tCommunicate and coordinate with clients on a daily basis.\n\tGuide clients through the intake process from start to completion.\n\tAssist clients with completing required forms and paperwork.\n\tReview documentation for accuracy and completeness.\n\tPrepare and submit required documents in a timely manner.\n\tFollow up with clients regarding missing information or outstanding paperwork.\n\tMaintain accurate and organized client records.\n\tRespond to client questions and provide clear, professional assistance.\n\tBuild positive and supportive relationships with clients.\n\tCoordinate with other team members to ensure client needs are addressed.\n\tAssist with general administrative and intake-related responsibilities as needed.\n\nQualifications\n\n\tEntry-level candidates are welcome to apply.\n\tExcellent verbal and written communication skills.\n\tStrong organizational abilities and attention to detail.\n\tFriendly, professional, and personable approach when working with clients.\n\tAbility to accurately handle forms, documentation, and client information.\n\tStrong follow-up skills.\n\tComfortable communicating with clients by phone, email, and in person.\n\tAbility to manage multiple responsibilities efficiently.\n\tTeam-oriented attitude with a willingness to learn.\n\tDependable, responsible, and motivated to grow professionally."}, {"id": "26841", "title": "Office Manager", "bhTitle": "Office Manager", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-06", "exp": "2027-01-06", "desc": "Employment Type: Full-Time\nSchedule: Monday–Friday, with Flexibility for the Right Candidate\n\nPosition Overview\n\nA nonprofit organization is seeking an experienced, highly organized, and tech-savvy Office Manager to oversee day-to-day office operations and work closely with the Finance, Development, and Executive teams.\n\nThis is more than a traditional Office Manager position. The role offers an opportunity for a proactive self-starter to take ownership of office operations, improve internal processes, support donor and fundraising activities, and contribute across multiple areas of a growing nonprofit organization.\n\nThe ideal candidate is detail-oriented, technologically capable, an excellent communicator, and comfortable working in a small-team environment where responsibilities may overlap.\n\nKey Responsibilities\n\nOffice Management & Operations\n\n\tOversee the smooth day-to-day operation of the office.\n\tManage the office space and maintain relationships with building service providers.\n\tCoordinate office technology, equipment, and technical support.\n\tOrganize and maintain electronic and physical files.\n\tDevelop, maintain, and improve office policies and procedures.\n\tIdentify opportunities to streamline processes and improve organizational efficiency.\n\tManage relationships with external vendors and service providers.\n\tMonitor and replenish office supplies and equipment.\n\tHelp ensure the office remains organized, professional, and fully operational.\n\nFinancial & Administrative Support\n\n\tProcess checks, wire transfers, and credit card donations.\n\tEnter and maintain accurate credit card expense information.\n\tCoordinate with Finance on financial and administrative matters.\n\tMaintain accurate records and supporting documentation.\n\tAssist with additional administrative and financial responsibilities as needed.\n\nDonor Communications & Database Management\n\n\tPrepare and monitor communications with donors.\n\tMaintain accurate digital and direct-mail donor lists.\n\tUpdate and further customize the organization's donor database.\n\tMaintain the accuracy and integrity of donor information.\n\tPerform data entry and database maintenance.\n\tWork closely with the Development team to support donor engagement and fundraising initiatives.\n\nBoard & Event Support\n\n\tSchedule and organize Board meetings.\n\tAttend Board meetings and prepare meeting minutes.\n\tAssist with meeting materials and follow-up as needed.\n\tProvide logistical and on-site support for fundraising events.\n\tCoordinate with staff, vendors, and other stakeholders to support successful events.\n\nCommunications & Marketing Support\n\n\tAssist with placing advertisements and press releases in relevant publications.\n\tSupport organizational communications and outreach initiatives.\n\tProvide basic social media and digital support as needed.\n\tAssist with additional projects across the organization.\n\nQualifications\n\n\tMinimum 5 years of relevant professional experience required.\n\tBachelor's degree required.\n\tPrevious office management, administration, nonprofit operations, or related experience.\n\tExcellent organizational skills and attention to detail.\n\tStrong writing and professional communication skills.\n\tProficiency with Microsoft Office 365.\n\tStrong general technology skills and ability to learn new systems.\n\tExperience with CRM systems and data entry.\n\tExperience with Donorbox, Stripe, PayPal, NetSuite, or similar platforms is a plus.\n\tComfortable working with databases, digital systems, and social media.\n\tAbility to develop and improve processes rather than simply follow existing procedures.\n\tStrong work ethic and ability to take ownership of responsibilities.\n\tCreative, resourceful, and solutions-oriented.\n\tAbility to manage multiple priorities in a fast-paced environment.\n\tCollaborative team player who is willing to assist across different areas of the organization."}, {"id": "26840", "title": "Social Media Manager", "bhTitle": "Social Media Manager", "category": "E-commerce, Marketing & Social Media", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-06", "exp": "2027-01-06", "desc": "Employment Type: Part-Time\nSchedule: Flexible / Part-Time Hours\n\nPosition Overview\n\nA community-based nonprofit organization is seeking a creative and thoughtful Part-Time Social Media Manager to develop engaging, informative, and educational content focused on mental health and community awareness.\n\nThis role is ideal for someone who understands social media, enjoys creating meaningful content, and can communicate sensitive mental health topics in a clear, respectful, and approachable way. The Social Media Manager will help strengthen the organization's online presence while providing useful resources and education to the community.\n\nKey Responsibilities\n\n\tDevelop and manage the organization's social media content and presence.\n\tCreate informative and educational content related to mental health, wellness, and community resources.\n\tDevelop posts, graphics, short-form videos, stories, and other engaging social content.\n\tCreate and maintain a consistent social media content calendar.\n\tWrite clear, engaging, and audience-appropriate captions and messaging.\n\tTranslate complex or sensitive mental health topics into accessible and easy-to-understand content.\n\tEnsure content is respectful, responsible, and aligned with the nonprofit's mission.\n\tCollaborate with organizational leadership and mental health professionals when developing content.\n\tPromote programs, events, educational initiatives, and community resources.\n\tMonitor engagement and respond or escalate messages and comments appropriately.\n\tTrack social media performance and identify opportunities to improve reach and engagement.\n\tStay current on social media trends and identify appropriate ways to incorporate them into the organization's content.\n\tMaintain a consistent and professional voice across social platforms.\n\nQualifications\n\n\tPrevious experience in social media management, content creation, digital marketing, communications, or a related area preferred.\n\tStrong writing and communication skills.\n\tAbility to create engaging social media content for different audiences.\n\tComfortable creating or coordinating graphics, videos, reels, and other digital content.\n\tStrong understanding of major social media platforms and current content trends.\n\tExcellent judgment when communicating about sensitive topics.\n\tOrganized, creative, dependable, and able to work independently.\n\tStrong attention to detail and ability to maintain a consistent content schedule.\n\tInterest or experience in mental health, nonprofit, community, or educational content is strongly preferred.\n\tFamiliarity with Canva or similar content-creation tools is a plus."}, {"id": "26838", "title": "Sales Operations Specialist", "bhTitle": "Sales Operations Specialist", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-06", "exp": "2027-01-21", "desc": "Location: Brooklyn, NY\nSchedule: Monday - Thursday in-office, Fridays generally remote.\n\nAn established beauty and personal care company is seeking a highly organized, hands-on Sales Operations Specialist to help coordinate our growing retail and e-commerce business. This person will work closely with our sales and operations teams to ensure incoming orders are entered accurately, inventory and product availability are coordinated, and retail buyers and planners receive timely follow-up and support. The role will also help manage new item launches, pricing updates, sell sheets, and broker communications.\n\nKey responsibilities include:\n\n\tCoordinate sales orders with Operations, including inventory and product availability\n\tEnter and maintain orders and sales information using our internal systems and AI tools\n\tFollow up with retail buyers and planners regarding orders, new items, pricing and other needs\n\tCoordinate with independent sales brokers on new products, updated pricing, presentations and sell sheets\n\tConduct targeted outreach to prospective retail accounts and manage virtual assistants supporting outreach\n\tOversee virtual assistants handling routine buyer and consumer customer-service inquiries, including Amazon-related inquiries\n\tHelp prepare for and occasionally attend trade shows, including booth setup, customer meetings and selling\n\tMaintain accurate sales information and ensure follow-ups don't fall through the cracks\n\nWhat we're looking for: A highly organized, detail-oriented self-starter with strong computer skills who is comfortable using AI and learning new technology. The ideal candidate has experience in sales operations, consumer products or retail/wholesale sales and is comfortable communicating directly with buyers, brokers and internal teams. Beauty, skincare or personal-care experience is strongly preferred but not required. Experience managing or delegating work to virtual assistants is a plus."}, {"id": "26836", "title": "Vice President of Human Resources", "bhTitle": "Human Resources", "category": "HR, Management & Fundraising", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-06", "exp": "2027-01-06", "desc": "Location: Manhattan, New York, NY\nEmployment Type: Full-Time\nWork Arrangement: Hybrid – In Office 4 Days per Week\n\nPosition Overview\n\nA healthcare organization specializing in payment integrity and clinical review solutions is seeking an accomplished Vice President of Human Resources to lead the HR function and serve as a strategic partner to senior leadership.\n\nThe organization partners with health plans and other healthcare payers nationwide to improve claims accuracy, reduce unnecessary healthcare spending, and identify opportunities for cost savings.\n\nThis is a senior leadership position with broad responsibility across employee relations, performance management, compensation, Talent Acquisition, employee engagement, compliance, HR technology, and organizational effectiveness.\n\nThe ideal candidate is a strategic HR leader who is equally comfortable advising executives, developing an HR team, and taking a hands-on approach to complex day-to-day HR matters.\n\nKey Responsibilities\n\nHR Strategy & Executive Partnership\n\n\tServe as a trusted strategic HR partner to senior executives and business leaders.\n\tDevelop and execute HR strategies aligned with organizational objectives and growth.\n\tAdvise leadership on workforce planning, organizational structure, employee performance, and talent needs.\n\tProvide HR leadership and guidance during periods of organizational growth and change.\n\tIdentify opportunities to strengthen HR operations, policies, processes, and organizational effectiveness.\n\nEmployee Relations & Performance Management\n\n\tLead complex employee relations matters and workplace investigations.\n\tProvide guidance to managers regarding employee performance, disciplinary matters, and workplace concerns.\n\tOversee performance management programs and processes.\n\tDevelop strategies to improve accountability, employee performance, and manager effectiveness.\n\tEnsure employee matters are handled consistently, professionally, and appropriately documented.\n\nTalent Acquisition & Workforce Planning\n\n\tOversee the organization's Talent Acquisition and recruiting operations.\n\tPartner with leadership to identify current and future hiring needs.\n\tEvaluate recruiting strategies, processes, and performance.\n\tEnsure the organization attracts and retains high-quality talent.\n\tDevelop and improve onboarding and employee integration processes.\n\tMonitor recruiting metrics and identify opportunities to improve efficiency and hiring outcomes.\n\nCompensation & Employee Programs\n\n\tLead and evaluate compensation programs and practices.\n\tPartner with leadership on compensation planning and related workforce decisions.\n\tHelp ensure compensation practices remain competitive, consistent, and aligned with business objectives.\n\tSupport employee retention and recognition strategies.\n\tEvaluate HR programs and recommend improvements based on organizational needs and workforce data.\n\nEmployee Engagement & Organizational Effectiveness\n\n\tDevelop initiatives that strengthen employee engagement, communication, and organizational culture.\n\tPartner with leadership to identify employee experience opportunities and organizational challenges.\n\tUse employee feedback and HR data to guide decisions and initiatives.\n\tDevelop managers and HR team members to strengthen leadership capabilities throughout the organization.\n\tLead organizational initiatives designed to improve effectiveness, collaboration, and employee retention.\n\nCompliance & HR Operations\n\n\tEnsure compliance with applicable federal, state, and local employment laws and HR requirements.\n\tOversee HR policies, procedures, documentation, and employment practices.\n\tIdentify and address potential HR and employment-related risks.\n\tMaintain appropriate standards for confidentiality, documentation, and employee information.\n\tEnsure HR processes are consistent, scalable, and aligned with organizational requirements.\n\nHR Technology & Analytics\n\n\tEvaluate and optimize HR technology, systems, and workflows.\n\tIdentify opportunities to automate and streamline HR processes.\n\tEnsure HR systems provide accurate and useful workforce information.\n\tDevelop and monitor HR metrics and reporting.\n\tUse workforce data to support executive decision-making and identify trends or areas requiring attention.\n\nTeam Leadership\n\n\tLead, coach, and develop the HR team.\n\tEstablish clear responsibilities, priorities, and performance expectations.\n\tBuild a high-performing, responsive, and service-oriented HR function.\n\tPromote accountability, professional development, and strong collaboration across the team.\n\nQualifications\n\n\tSignificant progressive Human Resources leadership experience, including experience at a senior or executive level.\n\tDemonstrated experience leading and developing HR teams.\n\tStrong experience advising senior executives and business leaders.\n\tExtensive experience managing complex employee relations matters and workplace investigations.\n\tExperience leading performance management and compensation programs.\n\tStrong knowledge of Talent Acquisition and recruiting operations.\n\tExperience developing employee engagement and organizational effectiveness initiatives.\n\tStrong understanding of employment law, HR compliance, policies, and employee relations best practices.\n\tExperience evaluating and implementing HR technology and systems.\n\tStrong business judgment and ability to balance employee needs with organizational objectives.\n\tExcellent leadership, communication, interpersonal, and problem-solving skills.\n\tAbility to operate strategically while remaining comfortable with hands-on execution.\n\tHealthcare or healthcare-services industry experience is a plus."}, {"id": "26835", "title": "Sales Representative – Pet Apparel", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-06", "exp": "2027-01-06", "desc": "We are looking for an experienced Sales Representative with strong Pet Apparel experience and established industry relationships to help us develop and grow our business.\n\nWe currently have two exciting opportunities in the Pet category and are looking for the right person to bring their expertise, relationships, and sales experience to help build these businesses.\n\nResponsibilities\n\n\tDevelop and grow sales within the pet apparel and pet products market\n\n\tLeverage existing relationships with pet retailers, specialty stores, distributors, wholesalers, and buyers\n\n\tIdentify and develop new accounts and business opportunities\n\n\tPresent products to buyers and retail partners\n\n\tManage the sales process from initial outreach through order placement\n\n\tBuild and maintain strong, long-term customer relationships\n\n\tProvide market feedback and insight on trends, pricing, products, and customer needs\n\n\tWork closely with the company to develop sales strategies and expand the business\n\nIdeal Candidate\n\n\tProven experience in pet apparel, pet products, or a closely related category\n\n\tEstablished relationships with pet-industry buyers and retailers\n\n\tStrong wholesale sales and business-development background"}, {"id": "26833", "title": "Retail Sales Associate", "bhTitle": "Retail Sales", "category": "Sales & Live Selling", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-10-05", "exp": "2027-01-05", "desc": "Employment Type: Full-Time or Part-Time\nSchedule: Flexible Schedule – Business Open 7 Days a Week, 9:00 AM–6:00 PM\n\nPosition Overview\n\nA retail business is seeking a responsible, friendly, and dependable Retail Sales Associate to join its team. Both full-time and part-time opportunities are available.\n\nThis is a customer-facing position ideal for someone who enjoys interacting with people, provides excellent service, and can be trusted to handle day-to-day responsibilities independently. Previous retail experience is preferred but not required.\n\nKey Responsibilities\n\n\tGreet customers and provide friendly, professional service.\n\tAssist customers with questions and product selections.\n\tHelp create a welcoming and positive shopping experience.\n\tMaintain an organized and presentable retail environment.\n\tAssist with basic sales transactions and customer purchases.\n\tAnswer customer questions in person and over the phone as needed.\n\tHelp organize and maintain merchandise.\n\tAssist with general day-to-day store responsibilities.\n\tCommunicate professionally with customers and coworkers.\n\tProvide dependable coverage during scheduled shifts.\n\tAssist with additional store responsibilities as needed.\n\nQualifications\n\n\tPrevious retail or customer service experience is preferred but not required.\n\tFriendly, personable, and comfortable interacting with customers.\n\tResponsible, reliable, and punctual.\n\tStrong communication and interpersonal skills.\n\tProfessional and customer-service oriented.\n\tAbility to work independently and as part of a team.\n\tWillingness to learn store procedures and product information.\n\tComfortable working a flexible schedule based on store needs."}, {"id": "26832", "title": "Executive Assistant", "bhTitle": "Executive Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-05", "exp": "", "desc": "Employment Type: Full-Time\n\nPosition Overview\n\nA growing wholesale company is seeking a highly organized, professional, and proactive Executive Assistant to provide direct support to senior management.\n\nThe ideal candidate is dependable, detail-oriented, and an excellent communicator who can effectively manage multiple priorities in a fast-paced environment. This individual should be comfortable taking initiative, anticipating executive needs, and handling both routine responsibilities and time-sensitive matters with discretion and professionalism.\n\nKey Responsibilities\n\n\tProvide day-to-day administrative and organizational support to senior management.\n\tManage executive calendars, appointments, meetings, and scheduling.\n\tCoordinate meetings and ensure timely follow-up on outstanding items.\n\tManage emails, correspondence, phone calls, and other communications as needed.\n\tPrepare documents, reports, presentations, and other business materials.\n\tMaintain organized files, records, and important information.\n\tCoordinate travel arrangements, itineraries, reservations, and related logistics as needed.\n\tTrack deadlines, priorities, projects, and action items to ensure timely completion.\n\tCommunicate and coordinate with employees, customers, vendors, and other business contacts.\n\tHandle confidential and sensitive business information with discretion.\n\tAssist with special projects and additional administrative responsibilities as needed.\n\tAnticipate executive needs and proactively address issues before they arise.\n\tHelp ensure day-to-day executive and office operations run efficiently.\n\nQualifications\n\n\tPrevious experience as an Executive Assistant, Administrative Assistant, or in a similar professional support role.\n\tExcellent organizational skills and strong attention to detail.\n\tStrong written and verbal communication skills.\n\tExcellent follow-up and time-management abilities.\n\tAbility to prioritize and manage multiple responsibilities simultaneously.\n\tProfessional, dependable, and comfortable working in a fast-paced business environment.\n\tProactive problem-solver who takes initiative and follows through on responsibilities.\n\tStrong computer skills, including Microsoft Office and general business applications.\n\tAbility to communicate professionally with internal and external contacts.\n\tAbility to maintain confidentiality and exercise sound judgment.\n\tComfortable working independently while collaborating with senior management and other team members."}, {"id": "26831", "title": "E-Commerce Operations Associate", "bhTitle": "ECommerce Manager", "category": "E-commerce, Marketing & Social Media", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-05", "exp": "2027-01-05", "desc": "Location: Brooklyn, NY – In Office\nEmployment Type: Full-Time\nSchedule: Monday–Thursday, 9:30 AM–6:30 PM\n\nPosition Overview\n\nA growing e-commerce linen company in Brooklyn is seeking a reliable and organized E-Commerce Operations Associate to join its team full-time.\n\nThis is a hands-on position that combines e-commerce operations, order management, general office responsibilities, and occasional warehouse support. The ideal candidate is comfortable working on a computer throughout the day while also being willing to assist with packaging and preparing products for shipment when needed.\n\nKey Responsibilities\n\n\tAssist with the day-to-day operation of the company's e-commerce business.\n\tProcess and manage online customer orders.\n\tReview orders for accuracy and ensure they are properly prepared for fulfillment.\n\tUpdate product, order, customer, and inventory information as needed.\n\tAssist with general e-commerce administrative responsibilities.\n\tMonitor orders and help resolve fulfillment or shipping issues.\n\tCoordinate with the warehouse to ensure orders are processed and shipped accurately.\n\tAssist with inventory and product organization.\n\tOccasionally package, label, and prepare products for shipment in the warehouse.\n\tHelp maintain an organized and efficient order fulfillment process.\n\tProvide general office and operational support as needed.\n\tAssist the team with additional e-commerce projects and responsibilities as the business grows.\n\nQualifications\n\n\tPrevious experience in e-commerce, online retail, order processing, fulfillment, or office operations is preferred.\n\tComfortable working with computers and learning e-commerce platforms and systems.\n\tStrong organizational skills and attention to detail.\n\tAbility to accurately process orders and maintain records.\n\tReliable, punctual, and responsible.\n\tAbility to manage multiple responsibilities in a fast-paced environment.\n\tComfortable assisting with hands-on packaging and warehouse tasks when necessary.\n\tStrong communication and problem-solving skills.\n\tAbility to work effectively both independently and as part of a team."}, {"id": "26830", "title": "Director of Development", "bhTitle": "Development/ Fundraiser", "category": "HR, Management & Fundraising", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-05", "exp": "2027-01-05", "desc": "Location: Brooklyn, NY – On-Site\nEmployment Type: Full-Time, Exempt\nSchedule: Monday–Friday, Standard Business Hours\n\nPosition Overview\n\nA vibrant community-based nonprofit organization is seeking a commercially minded Director of Development to build and lead a disciplined, data-driven, and accountable fundraising operation.\n\nThe Director will have two primary mandates: strengthen the strategy, infrastructure, and support that enable Board and lay leadership to successfully raise significant funds within the community, while also developing new revenue from corporations, foundations, family offices, government funding, sponsorships, institutional partners, and other opportunities.\n\nThis is both a leadership and hands-on individual contributor role. The Director will own the organization's development strategy and fundraising goals while personally researching prospects, developing proposals, managing the fundraising pipeline, and participating in donor and partner conversations.\n\nKey Responsibilities\n\nFundraising Strategy & Growth\n\n\tOwn the annual and multi-year development plan and take accountability for achieving fundraising goals.\n\tBuild and manage a disciplined fundraising pipeline from prospect identification through cultivation, solicitation, commitment, and collection.\n\tDevelop a diversified fundraising strategy that strengthens community giving while expanding outside revenue sources.\n\tDesign and manage digital donor acquisition funnels across email, social media, and web landing pages.\n\tDevelop strategies to convert prospective donors into recurring contributors.\n\tEvaluate fundraising opportunities based on potential revenue, probability, required investment, and strategic fit.\n\tPartner with Finance to maintain visibility into pledges, payments, and outstanding commitments.\n\tDevelop strategies to reduce the time between donor pledges and payment.\n\nBoard & Community Fundraising\n\n\tDevelop the strategy, structure, tools, and accountability needed to support successful Board and lay-led fundraising.\n\tTranslate existing relationships and community connections into actionable fundraising plans.\n\tEstablish clear prospect ownership, recommended asks, next steps, and follow-up.\n\tPartner with the CEO, Board President, and other leadership to identify and prioritize prospective donors.\n\tDetermine the appropriate strategy and solicitor for major fundraising opportunities.\n\tPrepare Board members and other solicitors for donor conversations with research, giving history, relationship context, talking points, and recommended ask strategies.\n\tTrack fundraising activity and ensure opportunities continue moving through the pipeline.\n\tParticipate in and, when appropriate, directly lead fundraising conversations.\n\nInstitutional Giving & New Revenue\n\n\tDevelop new revenue opportunities with corporations, foundations, family offices, government agencies, and other funding partners.\n\tManage the complete grant lifecycle, including prospecting, qualification, applications, submissions, reporting, and renewals.\n\tIdentify and pursue appropriate government funding opportunities.\n\tCoordinate government applications, relationships, reporting, and compliance as needed.\n\tDevelop sponsorship opportunities around programs, events, facilities, audiences, and community reach.\n\tCollaborate with program and organizational leaders to identify initiatives that may attract outside funding.\n\tContinuously identify new partnerships and revenue opportunities.\n\nDevelopment Operations, Data & Technology\n\n\tEstablish and maintain the CRM, prospect data, and reporting infrastructure needed to effectively manage fundraising.\n\tImplement consistent processes for prospect management, gift tracking, and donor follow-up.\n\tBuild and manage a disciplined pledge collection process.\n\tTrack outstanding commitments, aging, follow-up, and escalation.\n\tDevelop a consistent donor stewardship and engagement strategy designed to strengthen relationships and improve retention.\n\tUse technology, automation, and AI to improve prospect research, relationship mapping, grant discovery, reporting, and team productivity.\n\tEstablish meaningful fundraising KPIs.\n\tMaintain accurate fundraising forecasts and identify potential performance gaps early.\n\tRegularly report fundraising performance, pipeline activity, collections, risks, and opportunities to senior leadership.\n\nLeadership & Cross-Functional Partnership\n\n\tServe as the organization's internal leader on fundraising strategy and development.\n\tPartner closely with the CEO, Board leadership, Finance, Marketing, and program teams.\n\tBring coordination, structure, and accountability to fundraising efforts across the organization.\n\tBuild strong relationships with donors, prospective donors, partners, and community stakeholders.\n\tNavigate a close-knit, relationship-driven community with discretion, cultural sensitivity, and sound judgment.\n\tOperate effectively as both a strategic leader and hands-on contributor.\n\nKey Performance Indicators\n\nSuccess in this position will be measured through:\n\n\tAchievement of annual fundraising goals\n\tCash collections against fundraising commitments\n\tGrowth and quality of the fundraising pipeline\n\tBoard and lay leadership fundraising effectiveness\n\tCorporate and institutional revenue growth\n\tFoundation and family office funding\n\tGovernment funding\n\tSponsorship revenue\n\tDonor retention and stewardship\n\tPledge collection rates\n\tAging of outstanding commitments\n\tAverage time between pledge and payment\n\tFundraising ROI and pipeline conversion\n\tForecasting accuracy\n\tCRM and technology utilization\n\nQualifications\n\n\t7+ years of relevant experience in development, fundraising, institutional advancement, partnerships, business development, or a related field.\n\tDemonstrated success building and executing fundraising or revenue-growth strategies.\n\tExperience supporting Board members, executives, senior leaders, or volunteers in successful fundraising efforts.\n\tDemonstrated experience managing multi-channel digital fundraising campaigns.\n\tExperience with institutional giving, corporate partnerships, sponsorships, grants, and major gifts.\n\tStrong financial and analytical skills.\n\tExperience with pipeline management, forecasting, budgeting, and performance measurement.\n\tStrong project-management and organizational abilities.\n\tExcellent follow-through and accountability.\n\tExperience with nonprofit CRM platforms such as Bloomerang or comparable systems.\n\tComfortable using data, technology, automation, AI, and modern fundraising tools.\n\tExcellent writing, presentation, and communication skills.\n\tProfessional presence and sound judgment when working with significant donors and partners.\n\tEntrepreneurial approach with the ability to identify and develop new revenue opportunities.\n\tAbility to introduce structure and accountability into a relationship-driven environment.\n\tWillingness to personally execute fundraising activities rather than solely managing or delegating them."}, {"id": "26829", "title": "Director of Membership", "bhTitle": "Director", "category": "HR, Management & Fundraising", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-05", "exp": "2027-01-05", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday–Friday, Standard Business Hours\n\nPosition Overview\n\nA community-based nonprofit organization is seeking an experienced Director of Membership to lead the full membership lifecycle, from acquisition and onboarding through engagement, renewal, retention, and reactivation.\n\nThis is a senior leadership role with responsibility for membership growth, revenue, pricing, member experience, technology, operations, and team performance. The Director will evaluate the current membership function, identify opportunities for improvement, and build scalable systems that strengthen both membership growth and the overall member experience.\n\nThe ideal candidate combines strong business and operational judgment with an understanding of how to build trust and relationships within a close-knit community.\n\nKey Responsibilities\n\nMembership Growth & Revenue\n\n\tOwn annual goals for membership growth, acquisition, retention, renewals, reactivation, and revenue.\n\tDevelop and execute membership growth and acquisition strategies in partnership with Marketing and senior leadership.\n\tBuild and manage a structured prospect pipeline from initial inquiry through conversion.\n\tDevelop targeted prospect segments and consistent follow-up strategies.\n\tCreate and optimize digital recruitment funnels across email, social media, and web landing pages.\n\tEvaluate membership pricing, categories, packages, and promotional strategies.\n\tAnalyze the financial and membership impact of pricing and packaging changes.\n\tOwn the membership budget and forecast membership units, revenue, retention, and pipeline performance.\n\tMonitor campaign performance, acquisition costs, conversion rates, and ROI.\n\nMember Experience & Retention\n\n\tOversee the complete member journey from initial inquiry and onboarding through engagement, renewal, retention, and reactivation.\n\tDevelop strategies that make joining and participating in the organization easier and more welcoming.\n\tBuild strong relationships with members, prospective members, community stakeholders, and organizational leadership.\n\tUse member feedback, data, and direct outreach to identify changing needs and opportunities.\n\tDevelop strategies to increase member engagement and satisfaction.\n\tIdentify members at risk of leaving and develop appropriate retention and reactivation strategies.\n\tOversee membership policies, categories, eligibility standards, and exception processes.\n\tEnsure membership policies are applied consistently and professionally.\n\nTechnology, Data & AI\n\n\tOversee the organization's membership technology platforms, systems, and workflows.\n\tEnsure membership data is accurate, organized, and useful for decision-making.\n\tDevelop and maintain dashboards and reporting for key membership metrics.\n\tUse technology, automation, and AI to improve lead management, communications, reporting, personalization, and member service.\n\tIdentify opportunities to automate repetitive admi
