communication skills.\n\n\tStrong organizational skills and attention to detail.\n\n\tWarm, friendly, and professional attitude.\n\n\tAbility to communicate effectively with clients and coworkers.\n\n\tStrong follow-up skills and ability to manage multiple responsibilities.\n\n\tComfortable working with forms, documentation, and computer systems.\n\n\tDependable, responsible, and eager to learn.\n\n\tAbility to work independently while contributing to a team environment.\n\n\tPrevious intake, customer service, or administrative experience is a plus but not required."}, {"id": "26887", "title": "Graphic Designer & Social Media Manager", "bhTitle": "Graphic Design", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-13", "exp": "2027-01-04", "desc": ""}, {"id": "26883", "title": "Special Education Teacher", "bhTitle": "Teacher", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-13", "exp": "2027-01-13", "desc": "Employment Type: Full-Time\nSchedule: Monday–Thursday, 9:00 AM–3:00 PM | Friday, 9:00 AM–12:30 PM\n\nPosition Overview\n\nA welcoming and supportive school is seeking a dedicated and compassionate Special Education Teacher to join its team.\n\nThis is an excellent opportunity for an educator who is passionate about working with children with diverse learning needs and making a meaningful difference in their academic, social, and emotional development.\n\nThe ideal candidate is patient, creative, organized, and committed to creating a positive and engaging learning environment where every student can thrive.\n\nKey Responsibilities\n\n\tDevelop and implement individualized lesson plans tailored to students' learning needs and abilities.\n\n\tProvide specialized instruction and support to students with diverse developmental and educational needs.\n\n\tCreate a structured, nurturing, and inclusive classroom environment.\n\n\tAdapt teaching methods and classroom materials to accommodate different learning styles.\n\n\tSupport students in developing academic, social, communication, and independent living skills.\n\n\tMonitor student progress and adjust instructional strategies as needed.\n\n\tImplement Individualized Education Programs (IEPs) and track student goals.\n\n\tCollaborate with teachers, therapists, support staff, and school administration.\n\n\tMaintain open and professional communication with parents and families.\n\n\tEncourage positive behavior, independence, and student engagement.\n\n\tMaintain accurate student records and progress documentation.\n\n\tParticipate in staff meetings and professional development activities.\n\nQualifications\n\n\tMaster's degree in Special Education or a related field required.\n\n\tPrevious experience working with students with special needs preferred.\n\n\tStrong understanding of special education teaching methods and individualized instruction.\n\n\tFamiliarity with IEP development and implementation.\n\n\tExcellent classroom management and organizational skills.\n\n\tPatient, compassionate, and adaptable teaching approach.\n\n\tStrong written and verbal communication skills.\n\n\tAbility to collaborate effectively with other educators and support professionals.\n\n\tPassion for helping students reach their full potential.\n\n\tDependable, professional, and committed to student success."}, {"id": "26882", "title": "Shipping & Office Operations Associate", "bhTitle": "Warehouse Assistant Manager", "category": "Warehouse, Driving & Logistics", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-12", "exp": "2027-01-04", "desc": "Flatiron District, NYC, Full-Time | In-Person\n\nA creative jewelry, accessories, and home décor company, is seeking a hardworking, reliable, and highly organized team member to support their daily shipping, packing, and office operations.\n\nThis is a hands-on, physically active position for someone who enjoys staying busy, working efficiently, and keeping things running smoothly.\n\nResponsibilities\n\n\tPick, pack, and prepare daily customer orders\n\tPack and ship bulk wholesale orders to retailers\n\tProcess orders and print shipping labels, packing slips, and documentation\n\tTransport and drop off packages at UPS, FedEx, and USPS\n\tLift, carry, move, and organize boxes and merchandise\n\tReceive deliveries and assist with inventory management\n\tMaintain a clean, organized, and efficient workspace\n\tSupport general office operations and organizational tasks\n\nQualifications\n\n\tComputer savvy, comfortable navigating order systems, processing shipments, and printing shipping documents\n\tExcellent organizational skills and strong attention to detail\n\tPhysically capable of lifting, carrying, and moving boxes throughout the workday\n\tHonest, reliable, punctual, and responsible\n\tEfficient, proactive, and able to multitask\n\tPositive attitude, good energy, and strong work ethic\n\tTeam player willing to jump in wherever needed\n\tPrevious shipping, packing, or warehouse experience is a plus\n\nThe Ideal Candidate\nSomeone who is dependable, resourceful, organized, and takes pride in their work. We value initiative, efficiency, attention to detail, and a positive, can-do attitude."}, {"id": "26881", "title": "Job Title: Administrative Assistant", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Full or Part Time", "typeNote": "", "state": "NJ", "added": "2026-10-12", "exp": "2027-01-12", "desc": "Location: North Brunswick, NJ\nJob Type: Part-Time to Full-Time (25 - 35 Hours / Week)\nSchedule: Monday through Friday (Flexible daytime hours)\n\nWe are seeking an articulate, organized, and reliable Administrative Assistant to join our office team in North Brunswick, NJ. This role is essential to keeping our day-to-day business operations and financial processes running smoothly.\nThe ideal candidate possesses strong written and verbal communication skills, a high level of professionalism, and hands-on experience handling basic accounting tasks in QuickBooks and Microsoft Excel. If you are detail-oriented, comfortable managing accounts payable and receivable, and excel at drafting clear business correspondence, we would love to connect with you.\nKey Responsibilities:\n\n\tManage accounts payable and accounts receivable processes, including entering bills, issuing invoices, and tracking incoming payments.\n\tUtilize QuickBooks to log daily transactions, reconcile accounts, and support financial recordkeeping.\n\tMaintain accurate Microsoft Excel spreadsheets for tracking orders, client accounts, and internal logs.\n\tDraft, proofread, and send professional, clear, and articulate email communications to clients, vendors, and team members.\n\tAssist with general office administration tasks, including filing, answering inquiries, and organizing records.\n\tCollaborate closely with management and department heads to support daily workflow and operational needs.\n\nQualifications:\n\n\tProven experience working with QuickBooks and Microsoft Excel.\n\tDemonstrated experience handling accounts payable (A/P) and accounts receivable (A/R).\n\tExceptional written communication skills with the ability to write polished, professional emails.\n\tArticulate, professional verbal communication skills for phone and in-person interactions.\n\tHigh attention to detail, accuracy with numbers, and strong organizational skills.\n\tAbility to work independently and manage daily office tasks efficiently.\n\n What We Offer:\n\n\tFree commuter transportation via company van service providing round-trip transit from two locations in Brooklyn directly to the warehouse facility.\n\tFlexible schedule within a 25 to 35 hour work week.\n\tA clean, professional, and supportive office environment.\n\tOpportunities to build and expand administrative and financial skill sets."}, {"id": "26880", "title": "Shipping Supervisor – Shipping Department", "bhTitle": "Warehouse- Shipping", "category": "Warehouse, Driving & Logistics", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-12", "exp": "2027-01-12", "desc": "Location: North Brunswick, NJ\nJob Type: Full-Time\nSchedule: Monday through Friday\n\nWe are seeking a reliable, articulate, and trustworthy shipping supervosor to join our shipping team in North Brunswick, NJ. In this role, you will play a vital part in our daily operations by coordinating and overseeing the smooth loading of outbound orders onto transport trucks.\n\nThis position focuses on accuracy, communication, and order verification rather than physical heavy lifting. If you are dependable, detail-oriented, and possess basic computer skills, we encourage you to apply.\n\nKey Responsibilities:\n\n\tCoordinate with drivers and internal logistics teams to manage daily outbound loading schedules.\n\n\tVerify order manifests, shipping labels, and paperwork for high accuracy before goods are loaded.\n\n\tAssist truck drivers with the smooth and organized loading process of outgoing shipments.\n\n\tUse basic computer applications and inventory software to log loaded orders and update shipping statuses.\n\n\tMaintain clear, polite, and professional communication with delivery drivers, warehouse staff, and management.\n\n\tEnsure all warehouse safety and operational guidelines are strictly followed during the loading process.\n\nQualifications:\n\n\tStrong, articulate verbal communication skills with a professional demeanor.\n\n\tHigh level of personal integrity, reliability, and trustworthiness.\n\n\tBasic computer skills, including comfort using data entry software, spreadsheets, or shipping portals.\n\n\tStrong attention to detail with an emphasis on inventory and order accuracy.\n\n\tPrior experience in a warehouse, shipping, or logistics environment is a plus, but not required.\n\n\tNo heavy lifting required for this position.\n\nWhat We Offer:\n\n\tA clean, safe, and supportive team environment\n\tVans available from 2 locations in BRooklyn\n\n\tPaid time off and holiday pay.\n\n\tOpportunities for career growth and ongoing skill development within the company."}, {"id": "26879", "title": "Influencer Marketing Manager", "bhTitle": "Social Media Manager", "category": "E-commerce, Marketing & Social Media", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-10-12", "exp": "2027-01-13", "desc": "Luxury Jewelry Brand | Part-Time | Potential to Grow into Full-Time\n\nWhat We're Looking For\n\nWe want someone who is already connected to the influencer world and understands what makes a collaboration successful. You should be able to identify the right people, open doors, negotiate deals, and develop creative campaigns that feel authentic to both the influencer and the brand.\n\nThis is an exciting opportunity for a motivated influencer marketing professional to take ownership of a growing program and make a measurable impact on a premium jewelry brand.\n\nAbout the Company\n\nWe are a high-end jewelry brand specializing in fine gold jewelry, combining exceptional quality, timeless design, and accessible luxury. With more than 65 years of industry experience, we are committed to using genuine precious metals, maintaining ethical sourcing practices, and delivering outstanding value directly to our customers.\n\nAs we continue to grow our online presence and retail business, we are looking for a creative, entrepreneurial, and well-connected Influencer Marketing Manager to help expand our brand awareness and drive sales through strategic influencer partnerships.\n\nThe Opportunity\n\nWe are seeking someone who genuinely lives and breathes the world of influencers, fashion, beauty, lifestyle, and luxury jewelry. The ideal candidate understands the influencer landscape, knows how to identify the right creators for a premium brand, and has experience building relationships and negotiating successful brand collaborations.\n\nThis is a hands-on role for someone who can turn creative ideas into impactful campaigns, develop mutually beneficial influencer partnerships, and create engaging content that brings the brand to life.\n\nThe position is initially part-time, with the potential to grow into a full-time opportunity as the business expands.\n\nKey Responsibilities\n\n\tInfluencer Partnerships & Brand Deals: Identify, approach, and negotiate collaborations with influencers, content creators, and brand ambassadors across relevant social media platforms.\n\n\tRelationship Building: Develop and maintain strong relationships with influencers, agents, and talent managers to establish ongoing partnerships.\n\n\tCampaign Development: Create and execute influencer marketing campaigns that increase brand awareness, engagement, website traffic, and sales.\n\n\tContent Strategy: Collaborate with influencers to develop compelling content featuring the brand's fine jewelry, including Instagram Reels, TikTok videos, social posts, and other digital content.\n\n\tInfluencer Research: Identify creators whose audiences, aesthetic, and personal brands align with the company's luxury positioning and target customers.\n\n\tNegotiation & Budget Management: Negotiate fees, gifted collaborations, affiliate arrangements, and other partnership terms to maximize campaign value.\n\n\tCampaign Management: Coordinate product gifting, content timelines, deliverables, approvals, and campaign execution.\n\n\tPerformance Tracking: Monitor campaign results, engagement, conversions, and return on investment to identify successful partnerships and opportunities for growth.\n\n\tTrend Awareness: Stay current on social media trends, emerging influencers, luxury fashion, fine jewelry, and digital marketing strategies.\n\nQualifications\n\n\tPrior experience in influencer marketing is required, including developing and executing influencer collaborations or brand deals.\n\n\tAn established understanding of the influencer ecosystem, including how creators, agents, and brand partnerships operate.\n\n\tStrong networking, communication, and negotiation skills, with the confidence to initiate outreach and build relationships.\n\n\tA genuine interest in fine jewelry, luxury fashion, beauty, lifestyle, and social media culture.\n\n\tCreative instincts and the ability to develop engaging content ideas that align with a premium brand.\n\n\tFamiliarity with Instagram, TikTok, and other relevant social media platforms.\n\n\tA results-oriented mindset with the ability to connect influencer activity to brand growth and sales.\n\n\tHighly organized, self-motivated, resourceful, and comfortable working independently in a growing business.\n\nPosition: Part-Time, with potential to grow into Full-Time"}, {"id": "26878", "title": "Chef/ Cook", "bhTitle": "Chef/ Cook", "category": "Restaurant & Food Service", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-10-12", "exp": "", "desc": "Energetic and motivated Grill man needed for a restaurant in Brooklyn.\n12pm-10pm. Can be divided into 2 shifts."}, {"id": "26877", "title": "Mother's Helper / Infant Caregiver", "bhTitle": "Babysitter/Nanny", "category": "Education & Childcare", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-12", "exp": "2027-01-12", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time / Schedule to Be Discussed\n\nPosition Overview\n\nA family in Brooklyn is seeking a warm, responsible, and dependable Mother's Helper / Infant Caregiver to assist with caring for their 3-month-old baby while the mother is working.\n\nThe ideal candidate is patient, nurturing, and experienced with infants. This position focuses on providing attentive, loving care while ensuring the baby's safety, comfort, and daily needs are met.\n\nKey Responsibilities\n\n\tProvide attentive and nurturing care for a 3-month-old infant.\n\n\tPrepare and feed bottles according to the baby's feeding schedule.\n\n\tChange diapers and maintain proper infant hygiene.\n\n\tEngage the baby in age-appropriate play, interaction, and developmental activities.\n\n\tFollow the baby's established feeding and nap routines.\n\n\tSoothe and comfort the baby as needed.\n\n\tPut the baby down for naps following safe sleep practices.\n\n\tMaintain a clean and organized environment in areas used for infant care.\n\n\tCommunicate with the mother regarding the baby's needs, routines, and activities.\n\n\tEnsure the baby's safety and well-being at all times.\n\nQualifications\n\n\tPrevious experience caring for infants, particularly newborns or young babies, preferred.\n\n\tPatient, gentle, nurturing, and responsible.\n\n\tComfortable with bottle feeding, diaper changes, and infant nap routines.\n\n\tKnowledge of basic infant safety and development.\n\n\tReliable, punctual, and trustworthy.\n\n\tStrong communication skills.\n\n\tAbility to follow parental instructions and established routines.\n\n\tInfant CPR and First Aid certification preferred."}, {"id": "26876", "title": "Head of Sales", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-12", "exp": "2027-01-12", "desc": "Employment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nA growing company is seeking an experienced and results-driven Head of Sales – Beauty Industry to lead its sales efforts, develop new business opportunities, and drive revenue growth.\n\nThe ideal candidate has a strong background in the beauty, cosmetics, personal care, or beauty accessories industry, along with proven experience developing customer relationships, managing key accounts, and leading sales initiatives.\n\nThis is an excellent opportunity for a motivated sales leader who understands the beauty market, has established industry relationships, and can take ownership of the company's sales strategy and growth.\n\nKey Responsibilities\n\nSales Leadership & Business Development\n\n\tLead and oversee the company's sales efforts within the beauty industry.\n\n\tDevelop and execute sales strategies to increase revenue and expand market presence.\n\n\tIdentify new business opportunities with retailers, distributors, wholesalers, and beauty industry buyers.\n\n\tBuild and maintain strong relationships with key accounts and prospective customers.\n\n\tProspect for new business and open new retail and wholesale accounts.\n\n\tNegotiate pricing, contracts, and sales agreements.\n\n\tManage the sales pipeline and oversee opportunities from initial outreach through closing.\n\n\tEstablish sales goals and monitor performance against revenue targets.\n\n\tProvide leadership, guidance, and support to sales team members as applicable.\n\nAccount Management & Industry Relationships\n\n\tDevelop and maintain relationships with major beauty retailers, distributors, and industry partners.\n\n\tLeverage existing industry connections to generate new sales opportunities.\n\n\tManage key customer accounts and identify opportunities for account expansion.\n\n\tMaintain regular communication with buyers and decision-makers.\n\n\tAttend buyer meetings, industry events, and trade shows as needed.\n\n\tStay informed about beauty industry trends, competitors, and market developments.\n\nSales Strategy & Growth\n\n\tCollaborate with management, product development, and merchandising teams to identify market opportunities.\n\n\tProvide feedback on customer demand, product trends, pricing, and assortment opportunities.\n\n\tHelp develop sales presentations and proposals for prospective accounts.\n\n\tAnalyze sales performance and identify areas for improvement.\n\n\tDevelop strategies to strengthen customer retention and increase repeat business.\n\n\tSupport the introduction of new products and expansion into additional retail channels.\n\nQualifications\n\n\tPrevious sales experience in the beauty industry required.\n\n\tStrong background in beauty, cosmetics, personal care, beauty tools, or related consumer products.\n\n\tProven ability to generate new business and grow sales revenue.\n\n\tExperience managing key accounts and developing retailer or distributor relationships.\n\n\tExisting relationships with beauty industry buyers and retailers strongly preferred.\n\n\tStrong leadership, negotiation, and business development skills.\n\n\tExcellent communication and interpersonal abilities.\n\n\tUnderstanding of wholesale sales, pricing, margins, and retail distribution.\n\n\tSelf-motivated, strategic, and results-oriented.\n\n\tAbility to work independently and take ownership of sales growth.\n\n\tStrong organizational, analytical, and follow-up skills.\n\n\tPrevious sales management or team leadership experience preferred."}, {"id": "26875", "title": "Investment Sales Associate", "bhTitle": "Investment Sales Associate", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-12", "exp": "2027-01-05", "desc": "Location: Brooklyn, NY\nPosition Type: Full-Time\nSchedule: Monday through Friday, 8:45 AM–6:00 PM\n\nAbout the Role\nA real estate brokerage in Brooklyn is seeking a highly motivated, self-driven individual to join the team as an Investment Sales Associate. This is an excellent opportunity to launch or grow a career in real estate investment sales within a fast-paced, performance-driven environment.\n\nNo prior experience is required, though backgrounds in sales, real estate, finance, or investments are a plus. Comprehensive training is provided to equip candidates with the tools, knowledge, and support needed to succeed.\n\nKey Responsibilities\nAssist in sourcing and identifying industrial investment properties across the U.S.\nSupport senior team members with market research and investment analysis\nDevelop and maintain relationships with clients, investors, and property owners\nConduct outreach, follow-ups, and relationship-building initiatives\nAssist in preparing sales materials, financial analyses, and investment presentations\nTrack deal activity and support transaction processes from start to finish\nStay informed on market trends, pricing, and investment opportunities\n\nQualifications\nHighly motivated, self-driven, and eager to grow professionally\nStrong communication, negotiation, and interpersonal skills\nExcellent organizational and time-management abilities\nComfortable working in a fast-paced, goal-oriented environment\nWillingness to learn and take initiative\nPrior experience in sales, real estate, or investments is a plus, but not required\n\nWhy This Opportunity\nHands-on training and mentorship in real estate investment sales\nExposure to national industrial real estate markets\nClear path for professional growth and advancement\nDynamic, entrepreneurial work environment"}, {"id": "26873", "title": "Sales Representative", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-12", "exp": "2027-01-12", "desc": "Employment Type: Full-Time\nSchedule: Monday–Friday, Standard Business Hours\n\nPosition Overview\n\nA growing company is seeking a motivated, hardworking, and results-driven Sales Representative to join its team.\n\nThe ideal candidate is a confident and personable sales professional who enjoys building relationships, developing new business, and identifying opportunities for growth.\n\nThis position is ideal for someone with strong communication skills, a positive attitude, and the drive to succeed in a fast-paced sales environment.\n\nKey Responsibilities\n\n\tIdentify and develop new business opportunities.\n\n\tReach out to prospective customers through phone calls, emails, and other outreach methods.\n\n\tBuild and maintain strong relationships with new and existing clients.\n\n\tGenerate leads, follow up with prospects, and convert opportunities into sales.\n\n\tUnderstand customer needs and recommend appropriate products or services.\n\n\tPresent offerings, negotiate pricing, and close sales.\n\n\tMaintain consistent communication with customers to encourage repeat business.\n\n\tManage and organize a pipeline of prospective and existing accounts.\n\n\tWork closely with management to develop sales strategies and identify growth opportunities.\n\n\tMeet and exceed individual sales goals and revenue targets.\n\n\tProvide excellent customer service throughout the sales process.\n\nQualifications\n\n\tPrevious sales experience preferred.\n\n\tStrong communication, negotiation, and interpersonal skills.\n\n\tSelf-motivated, ambitious, and results-oriented.\n\n\tStrong work ethic and willingness to actively pursue new business.\n\n\tConfident and comfortable speaking with prospective customers.\n\n\tExcellent relationship-building and follow-up skills.\n\n\tOrganized, dependable, and detail-oriented.\n\n\tAbility to work independently while contributing to a team environment.\n\n\tPositive attitude and willingness to learn.\n\n\tAbility to manage multiple customers and sales opportunities simultaneously."}, {"id": "26872", "title": "Executive & Personal Assistant to Founder", "bhTitle": "Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-12", "exp": "2027-01-12", "desc": "Employment Type: Full-Time, In-Person\nSchedule: Monday–Friday, Full Workdays (Exact Hours to Be Discussed)\n\nPosition Overview\n\nA growing luxury real estate company is seeking a highly organized, proactive, and dependable Executive & Personal Assistant to work directly with its founder.\n\nThis position combines executive administrative support, personal assistance, scheduling, client communication, and business operations. The ideal candidate is detail-oriented, resourceful, professional, and comfortable managing multiple responsibilities in a fast-paced environment.\n\nThis is an excellent opportunity for a motivated individual or recent graduate looking to gain hands-on experience in business operations, client relations, executive management, and luxury real estate while working closely with company leadership.\n\nKey Responsibilities\n\nExecutive & Administrative Support\n\n\tManage and coordinate the founder's calendar, appointments, meetings, and daily schedule.\n\n\tOrganize emails, correspondence, and routine communications.\n\n\tDraft professional emails and assist with written communications.\n\n\tTrack important deadlines, action items, and follow-ups.\n\n\tMaintain organized files, contact records, and task lists.\n\n\tUtilize Google Workspace and Monday.com to manage schedules, projects, and administrative responsibilities.\n\n\tAssist with research, presentations, client materials, and special projects.\n\n\tHelp prioritize daily responsibilities and ensure important tasks are completed on time.\n\nPersonal Assistance & Coordination\n\n\tCoordinate travel arrangements, reservations, and personal appointments.\n\n\tAssist with personal scheduling and errands as needed.\n\n\tAnticipate upcoming needs and proactively address scheduling conflicts or outstanding tasks.\n\n\tMaintain confidentiality when handling personal and professional information.\n\n\tProvide flexible support to help the founder manage a busy schedule efficiently.\n\nClient & Business Operations Support\n\n\tCommunicate professionally with clients, vendors, and internal team members.\n\n\tAssist with coordinating meetings and client-related activities.\n\n\tSupport administrative projects related to luxury real estate operations.\n\n\tMaintain accurate records and ensure timely follow-up on outstanding matters.\n\n\tWork closely with the founder to support business priorities and daily operations.\n\n\tIdentify opportunities to improve organization, efficiency, and workflow.\n\nQualifications\n\n\tEntry-level candidates and recent college graduates are encouraged to apply.\n\n\tPrevious executive assistant or real estate experience is not required.\n\n\tExcellent organizational skills and strong attention to detail.\n\n\tStrong written and verbal communication skills.\n\n\tAbility to manage multiple priorities and adapt to changing schedules.\n\n\tProfessional, dependable, and resourceful.\n\n\tStrong follow-through and ability to complete tasks independently.\n\n\tAbility to handle confidential information with discretion and sound judgment.\n\n\tComfortable using technology and learning new software.\n\n\tFamiliarity with Google Workspace and Monday.com is a plus.\n\n\tPrevious internship, administrative, customer service, or campus leadership experience is valued.\n\n\tStrong work ethic, positive attitude, and willingness to learn.\n\n\tAbility to anticipate needs, take initiative, and solve problems proactively."}, {"id": "26871", "title": "Account Executive (Women's Wholesale Apparel)", "bhTitle": "Sales- Mid Level", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-09", "exp": "2027-01-08", "desc": "Location: New York, NY\nJob Type: Full-time\nSchedule: Standard Business Hours\n\nWe are seeking a proven Account Executive with an established network in women's wholesale apparel to drive growth and expand our retail footprint. This role offers a dedicated sales professional full ownership of their accounts, direct influence over growth strategy, and the opportunity to scale alongside a growing fashion brand. In this position, you will showcase branded and private label wholesale collections to fashion-forward retailers who value quality product, reliable delivery, and strong, long-term partnerships.\nKey Responsibilities:\n\n\tBuild and maintain client relationships, bringing in new accounts from your existing network.\n\tDeliver compelling sales presentations showcasing the latest women's wholesale apparel collections.\n\tMeet and exceed sales targets through the execution of effective sales strategies.\n\tProvide exceptional customer service by assisting clients with product selection and handling inquiries.\n\tUtilize strong negotiation skills to secure favorable terms and agreements with clients.\n\tCollaborate with internal teams to ensure accurate, timely delivery and high levels of customer satisfaction.\n\nQualifications:\n\n\tMinimum of 2 years of experience in wholesale ladies apparel sales, preferably within the Junior, Missy, or Girls fashion industry.\n\tProven track record of consistently meeting or exceeding sales targets.\n\tStrong existing network and established client base within the fashion industry.\n\tExcellent communication, interpersonal, and negotiation skills.\n\tSelf-motivated and results-oriented with a passion for sales and fashion.\n\nWhat We Offer:\n\n\tHealth benefits package.\n\tPaid time off.\n\tDirect ownership of accounts and substantial opportunity for career growth."}, {"id": "26870", "title": "Administrative Assistant", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Full or Part Time", "typeNote": "", "state": "NJ", "added": "2026-10-09", "exp": "2027-01-06", "desc": "Location: Ocean Township, NJ\nJob Type: Full-Time or Part-Time\nSchedule: Monday through Friday (Flexible hours available)\n\nWe are seeking a reliable, organized, and detail-oriented Administrative Assistant to join our team in Ocean Township, NJ. This position is ideal for an individual who excels at routine administrative workflows, data entry, and day-to-day office organization. Whether you are seeking a full-time position or a flexible part-time schedule, this role provides a supportive work environment where your precision directly contributes to smooth daily operations.\n\nKey Responsibilities:\n\n\tBuild, update, and manage detailed listings across internal databases and online platforms.\n\n\tFormat, verify, and print mailing, shipping, and product labels accurately.\n\n\tMaintain accurate digital and physical records to keep office files organized.\n\n\tPerform routine data entry and assist with basic document preparation.\n\n\tAudit listings and label queues regularly to catch and correct discrepancies promptly.\n\n\tProvide general administrative support to management and team members as needed.\n\nQualifications:\n\n\tHigh school diploma or equivalent required; prior office or administrative experience preferred.\n\n\tProficiency with basic computer systems, Microsoft Office (Word, Excel), and web platforms.\n\n\tStrong attention to detail with an emphasis on accuracy and quality control.\n\n\tSolid organizational skills and the ability to manage time effectively.\n\n\tGood communication skills and a reliable work ethic.\n\n\tAbility to work independently as well as collaboratively with a team.\n\nWhat We Offer:\n\n\tFlexible full-time or part-time scheduling options.\n\n\tPaid time off and holiday pay for eligible schedules.\n\n\tA clean, professional, and welcoming work environment.\n\n\tOngoing training and support."}, {"id": "26869", "title": "Product Developer / Merchandiser", "bhTitle": "Product Development", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-11", "desc": "Location: New York, NY\nEmployment Type: Full-Time\nWork Arrangement: In-Office\n\nPosition Overview\n\nA growing beauty and consumer products company is seeking a creative, detail-oriented, and highly organized Product Developer / Merchandiser to join its New York City team.\n\nThe company specializes in developing and importing hair tools, beauty tools, mirrors, and cosmetic accessories for major national retailers.\n\nThis position combines product development, trend research, merchandising, sourcing, and overseas factory coordination. The ideal candidate has a strong understanding of consumer products, retail trends, pricing, and packaging, with the ability to manage product development from initial concept through sampling, approvals, and production.\n\nKey Responsibilities\n\nProduct Development & Merchandising\n\n\tResearch market trends, competitor products, and emerging opportunities in the beauty and consumer products industry.\n\n\tConduct competitive shopping and identify new product ideas.\n\n\tDevelop product assortments based on retailer needs, target pricing, brand positioning, and seasonal trends.\n\n\tCollaborate with designers to develop product concepts, colors, packaging, and presentations.\n\n\tIdentify opportunities to introduce new products and expand existing product categories.\n\n\tEnsure products align with customer expectations, retail trends, and target price points.\n\nSourcing & Factory Coordination\n\n\tCommunicate directly with overseas factories regarding product sourcing, pricing, specifications, and development.\n\n\tCoordinate product samples, revisions, and production requirements.\n\n\tReview product samples and provide feedback to factories.\n\n\tWork with suppliers to ensure product quality, functionality, and design expectations are met.\n\n\tCoordinate product and packaging approvals.\n\n\tFollow up with factories to maintain development timelines and resolve outstanding issues.\n\nProduct Management & Buyer Support\n\n\tMaintain accurate costing sheets, product specifications, and development records.\n\n\tTrack product development calendars and ensure projects remain on schedule.\n\n\tCoordinate with internal teams to prepare product assortments and samples.\n\n\tAssist in preparing buyer presentations and product proposals.\n\n\tOrganize merchandise and samples for buyer meetings and trade shows.\n\n\tManage multiple product development projects simultaneously.\n\n\tEnsure accurate communication between design, sourcing, merchandising, and production teams.\n\nQualifications\n\n\t3+ years of experience in product development, merchandising, or a related field preferred.\n\n\tExperience in beauty, personal care, accessories, or consumer products strongly preferred.\n\n\tExperience communicating and coordinating directly with overseas factories.\n\n\tStrong understanding of product development, sourcing, pricing, and retail merchandising.\n\n\tExcellent eye for product trends, packaging, colors, and design.\n\n\tAbility to develop commercially viable products within target price points.\n\n\tProficiency in Microsoft Excel, including costing sheets and product tracking.\n\n\tStrong organizational and project management skills.\n\n\tExcellent written and verbal communication skills.\n\n\tExceptional attention to detail and follow-up.\n\n\tAbility to manage multiple projects and deadlines in a fast-paced environment.\n\n\tCreative, proactive, and comfortable working independently and collaboratively."}, {"id": "26868", "title": "Preschool Paraprofessional", "bhTitle": "Shadow/ Paraprofessional", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-11", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday–Friday, 9:00 AM–4:00 PM\n\nPosition Overview\n\nA preschool in Brooklyn is seeking two dedicated and compassionate Paraprofessionals / ABA Support Staff to work with children ages 3–6 on the autism spectrum.\n\nThe position involves supporting children in a structured classroom environment while working closely with teachers, Board Certified Behavior Analysts (BCBAs), and other educational professionals.\n\nThe ideal candidate is patient, energetic, dependable, and comfortable following guidance from supervising teachers and clinical professionals.\n\nKey Responsibilities\n\n\tProvide individualized classroom support to children ages 3–6 with Autism Spectrum Disorder (ASD).\n\n\tAssist children with classroom activities, daily routines, and transitions.\n\n\tSupport the development of communication, social, behavioral, and independent living skills.\n\n\tImplement individualized educational and behavioral strategies under the direction of teachers and BCBAs.\n\n\tEncourage positive interactions and participation in classroom activities.\n\n\tAssist with structured learning activities, play, and skill development.\n\n\tFollow established behavior support plans and classroom procedures.\n\n\tCollaborate closely with teachers, BCBAs, and other staff members.\n\n\tMaintain a safe, supportive, and positive learning environment.\n\n\tCommunicate observations and student progress to supervising professionals.\n\nQualifications\n\n\tExperience working with children with autism or developmental disabilities preferred.\n\n\tFamiliarity with ABA principles is a plus.\n\n\tPatient, compassionate, energetic, and dependable.\n\n\tStrong communication and interpersonal skills.\n\n\tAbility to follow instructions and accept constructive feedback from supervisors.\n\n\tComfortable working collaboratively with teachers and BCBAs.\n\n\tStrong interest in early childhood education and special education.\n\n\tWillingness to learn and develop professionally."}, {"id": "26867", "title": "Preschool Paraprofessional", "bhTitle": "Shadow/ Paraprofessional", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-11", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday–Friday, 9:00 AM–4:00 PM\n\nPosition Overview\n\nA preschool in Brooklyn is seeking two dedicated and compassionate Paraprofessionals / ABA Support Staff to work with children ages 3–6 on the autism spectrum.\n\nThe position involves supporting children in a structured classroom environment while working closely with teachers, Board Certified Behavior Analysts (BCBAs), and other educational professionals.\n\nThe ideal candidate is patient, energetic, dependable, and comfortable following guidance from supervising teachers and clinical professionals.\n\nKey Responsibilities\n\n\tProvide individualized classroom support to children ages 3–6 with Autism Spectrum Disorder (ASD).\n\n\tAssist children with classroom activities, daily routines, and transitions.\n\n\tSupport the development of communication, social, behavioral, and independent living skills.\n\n\tImplement individualized educational and behavioral strategies under the direction of teachers and BCBAs.\n\n\tEncourage positive interactions and participation in classroom activities.\n\n\tAssist with structured learning activities, play, and skill development.\n\n\tFollow established behavior support plans and classroom procedures.\n\n\tCollaborate closely with teachers, BCBAs, and other staff members.\n\n\tMaintain a safe, supportive, and positive learning environment.\n\n\tCommunicate observations and student progress to supervising professionals.\n\nQualifications\n\n\tExperience working with children with autism or developmental disabilities preferred.\n\n\tFamiliarity with ABA principles is a plus.\n\n\tPatient, compassionate, energetic, and dependable.\n\n\tStrong communication and interpersonal skills.\n\n\tAbility to follow instructions and accept constructive feedback from supervisors.\n\n\tComfortable working collaboratively with teachers and BCBAs.\n\n\tStrong interest in early childhood education and special education.\n\n\tWillingness to learn and develop professionally."}, {"id": "26866", "title": "Designer", "bhTitle": "Designer", "category": "Design & Creative", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-08", "exp": "", "desc": "About the Role\n\nWe are seeking an experienced Technical Designer specializing in Infant and Layette apparel to join our growing team. This role is ideal for a detail-oriented professional with a strong understanding of fit, garment construction, grading, and technical development.\n\nThe Technical Designer will work closely with our design team and overseas manufacturing partners to ensure each garment meets our standards for fit, quality, and production accuracy.\n\nKey Responsibilities\n\n\tDevelop block specifications based on established size ranges.\n\tPartner with designers throughout the sample development process to achieve the intended fit and aesthetic.\n\tPrepare detailed specifications for all stages of development, including first fit, second fit, PP, and shipping samples.\n\tIndependently coordinate and lead fit sessions.\n\tCommunicate fit comments, corrections, and technical revisions clearly to overseas patternmakers.\n\tDevelop grading for costing and pricing purposes.\n\tCreate bulk grading for production.\n\tMaintain accuracy and consistency across technical packages and production specifications.\n\tCollaborate with design and production teams to resolve technical challenges and ensure timely execution.\n\nQualifications & Experience\n\n\tMinimum 2 years of professional experience as a Technical Designer specializing in Infant and Layette apparel.\n\tStrong knowledge of infant garment construction, fit, grading, and technical specifications.\n\tExperience working with overseas factories and patternmakers.\n\tAbility to independently manage fit sessions and communicate technical corrections.\n\tStrong organizational skills and attention to detail.\n\tAbility to manage multiple styles and deadlines in a fast-paced environment.\n\nBased on experience and qualifications."}, {"id": "26865", "title": "Product Development", "bhTitle": "Product Development", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NJ", "added": "2026-10-08", "exp": "", "desc": "About the Role\n\nWe are seeking an organized, proactive, and detail-oriented Product Development professional to oversee the development process from initial design through production handoff.\n\nThis role is responsible for maintaining development timelines, ensuring technical accuracy, coordinating sample requests, and facilitating communication between our design team, overseas manufacturing partners, and production department.\n\nThe ideal candidate thrives in a fast-paced environment, has strong project management skills, and understands the importance of precision and accountability in children's apparel development.\n\nKey Responsibilities\n\nDevelopment Planning & Timeline Management\n\n\tEstablish and implement development goals and timelines to ensure the design team has sufficient time to complete each stage of the product development process.\n\tManage and maintain the TIA calendar, ensuring key deadlines and milestones are met.\n\tMonitor development progress and proactively identify potential delays or challenges.\n\tCoordinate communication across design, technical, and production teams.\n\nTechnical Review & Problem-Solving\n\n\tReview all tech pack information for accuracy, completeness, and clarity before submitting to overseas factories.\n\tIdentify and resolve issues within the design room prior to sample development.\n\tAttend design meetings to track design changes, revisions, and technical updates.\n\tEnsure all revisions are accurately implemented and communicated to the appropriate teams.\n\tSupport the design team in maintaining consistent and accurate development documentation.\n\nSample Development & Factory Communication\n\n\tPrepare and send sample requests to overseas factories.\n\tCommunicate comments, corrections, and revisions to factories for the creation of PP (Pre-Production) samples.\n\tFollow up on sample development to ensure timelines and quality expectations are met.\n\tCoordinate the transfer of finalized development information to the Production Department.\n\tEnsure all relevant technical and development details are properly communicated during the production handoff.\n\nAdministrative & Financial Management\n\n\tTrack sample purchases and related expenses.\n\tPrepare and submit expense reports to Accounting, including supporting receipts.\n\tMaintain accurate records of sample requests, revisions, and development status.\n\tEnsure development-related expenses are properly documented and submitted on time.\n\nQualifications & Experience\n\n\tExperience in apparel product development, production coordination, or a related field.\n\tStrong understanding of tech packs, sample development, and garment manufacturing.\n\tExperience communicating with overseas factories and manufacturing partners.\n\tStrong organizational, project management, and time management skills.\n\tAbility to manage multiple styles, deadlines, and revisions simultaneously.\n\tExcellent written and verbal communication skills.\n\tStrong attention to detail and problem-solving abilities.\n\tAbility to work collaboratively across design, technical, and production departments.\n\nBased on experience and qualifications."}, {"id": "26864", "title": "Designer", "bhTitle": "Designer", "category": "Design & Creative", "type": "Remote / Hybrid", "typeNote": "Remote/Hybrid/FT", "state": "NJ", "added": "2026-10-08", "exp": "", "desc": "About the Role\n\nWe are seeking a talented and detail-oriented Layette Designer to join our creative team. This position is ideal for a designer who combines a strong aesthetic sensibility with technical expertise and a comprehensive understanding of infant apparel development.\n\nThe Layette Designer will be responsible for translating creative concepts into fully developed, production-ready garments while ensuring every design detail is clearly communicated and aligned with our quality, cost, and brand standards.\n\nKey Responsibilities\n\nDesign Development & Technical Execution\n\n\tTranslate creative concepts into comprehensive technical specifications.\n\tProvide all necessary information to execute each design, including:\n\n\t\tFabrication and material selection\n\t\tTrims and embellishments\n\t\tColor specifications\n\t\tSewing techniques\n\t\tGarment construction\n\t\tLabel placement\n\t\tArtwork and print design\n\t\tBudget adherence\n\t\tFit instructions\n\n\tEnsure all design information is accurately documented within the Tech Pack and PLM system.\n\tCreate and maintain complete, accurate, and production-ready tech packs.\n\tProvide original samples to support the development of new styles.\n\tMaintain the fabric library within the PLM system, including clear and accurate supplier information.\n\nCross-Functional Collaboration\n\n\tCollaborate closely with the Technical Designer to develop accurate development specifications.\n\tPartner with the Graphic Designer to create artwork, prints, and technical packages.\n\tIdentify and resolve design and construction challenges before sample development.\n\tWork collaboratively with overseas manufacturing partners to ensure design intent is maintained.\n\tAttend design meetings and adhere to established development deadlines and TIA calendar guidelines.\n\nQualifications & Experience\n\n\tExperience in layette, infant, or children's apparel design.\n\tStrong understanding of fabrications, trims, garment construction, and fit.\n\tAbility to independently create complete tech packs and artwork prints is required.\n\tExperience with PLM systems and apparel development processes.\n\tStrong attention to detail and ability to manage multiple projects.\n\tExcellent communication and problem-solving skills.\n\tAbility to balance creative vision with production feasibility and budget requirements.\n\n\tHybrid schedule: 2 days per week in-house, with the option to work remotely on remaining days."}, {"id": "26863", "title": "Product Development Intern – Fashion", "bhTitle": "Product Development Intern – Fashion", "category": "Production & Product Development", "type": "Internship", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-20", "desc": "Location: New York, NY\nEmployment Type: Part-Time/Full-Time, Paid\nSchedule: Monday–Thursday, 9:30 AM–5:00 PM (No Fridays)\n\nA growing fashion retail brand is seeking a creative and motivated Product Development Intern to join the team ASAP. This is a paid, hands-on opportunity for someone interested in fashion, product development, and the retail industry. The ideal candidate is organized, detail-oriented, and excited to help develop new products and collections.\n\nResponsibilities:\n\n\tResearch fashion trends, styles, fabrics, and materials\n\tAssist with developing new products and collections\n\tCreate product concepts, mood boards, and presentations\n\tResearch competitors, pricing, and market trends\n\tAssist with product samples, revisions, and organization\n\tCommunicate with vendors and support product development tasks\n\tMaintain product information and development files\n\tAssist with additional projects as needed\n\nQualifications:\n\n\tPassion for fashion and retail\n\tStrong creative and organizational skills\n\tDetail-oriented and eager to learn\n\tStrong communication skills\n\tInterest in product development, merchandising, or fashion business\n\tFashion, marketing, merchandising, or related experience is a plus\n\nRequirements: Must be able to work in person in New York City Monday through Thursday, 9:30 AM–5:00 PM, and be available to start ASAP."}, {"id": "26862", "title": "Teaching Assistant – Early Childhood & Elementary School", "bhTitle": "Teacher Assistant", "category": "Education & Childcare", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-07", "desc": "Location: Brooklyn, NY\nSchedule: Monday–Thursday, 8:15 AM–4:00 PM; Friday, 8:15 AM–12:30 PM\n\nSeeking Teaching Assistants to support lead classroom teachers in an early childhood and elementary school setting. Responsibilities include assisting with classroom activities, supporting students throughout the school day, helping with lessons and assignments, and maintaining a positive and organized classroom environment.\n\nThe ideal candidate is responsible, patient, caring, and enjoys working with children. Previous experience working with children or in a classroom setting is a plus."}, {"id": "26861", "title": "Shadow/ Paraprofessional", "bhTitle": "Shadow/ Paraprofessional", "category": "Education & Childcare", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2026-12-30", "desc": "We have a few classes that can use extra support. The school is in Brooklyn. The Hours are from 9:00am - 12:00pm - Duties, help engage with children, be a positive role model. Requirements, Yeshiva professional dress code. Great for someone under 40 years old looking for a meaningful part time position."}, {"id": "26860", "title": "Day Habilitation Coordinator", "bhTitle": "Coordinator", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-11", "desc": "Location: Brooklyn, NY\nEmployment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nAn established organization providing services to individuals with developmental disabilities is seeking an organized, experienced, and hands-on Day Habilitation Coordinator to oversee the daily operations of its OPWDD-certified Day Habilitation program.\n\nThe Day Habilitation Coordinator will ensure the program operates smoothly, safely, and in compliance with New York State Office for People With Developmental Disabilities (OPWDD) regulations while providing meaningful, person-centered experiences for participants.\n\nThis role combines daily program management, staff supervision, regulatory compliance, and program development. The ideal candidate is a dependable leader who can manage multiple responsibilities, support staff, and contribute to the continued growth of the program.\n\nKey Responsibilities\n\nProgram Operations & Management\n\n\tOversee daily operations of the Day Habilitation program, ensuring activities and schedules run smoothly.\n\n\tCoordinate meaningful, age-appropriate activities aligned with each participant's individual goals and needs.\n\n\tEnsure services and activities follow person-centered planning principles.\n\n\tManage morning arrivals and afternoon dismissals.\n\n\tCoordinate transportation logistics with residences, families, and transportation providers.\n\n\tMaintain a safe, clean, organized, and welcoming program environment.\n\n\tServe as the primary on-site contact for operational issues and concerns.\n\n\tAddress daily challenges promptly and professionally.\n\n\tWork closely with program leadership to maintain efficient operations.\n\nStaff Supervision & Development\n\n\tSupervise, schedule, and support Direct Support Professionals (DSPs).\n\n\tProvide ongoing training, coaching, and performance feedback.\n\n\tAssist with onboarding and training new staff members.\n\n\tConduct staff meetings and communicate program expectations.\n\n\tMonitor staff performance and ensure responsibilities are completed appropriately.\n\n\tAddress staffing concerns and performance issues professionally.\n\n\tFoster a positive, collaborative, and supportive work environment.\n\nRegulatory Compliance & Documentation\n\n\tEnsure program operations comply with applicable OPWDD regulations and requirements.\n\n\tOversee accurate and timely completion of Day Habilitation documentation.\n\n\tMonitor staff compliance with documentation and service delivery procedures.\n\n\tSupport proper incident reporting, documentation, and follow-up.\n\n\tIdentify potential compliance concerns and assist with corrective actions.\n\n\tHelp maintain program readiness for inspections and regulatory reviews.\n\nProgram Growth & Community Engagement\n\n\tSupport the continued development and expansion of the Day Habilitation program.\n\n\tEstablish and maintain relationships with community organizations and local partners.\n\n\tAssist with new participant enrollments and intake coordination.\n\n\tIdentify opportunities for meaningful community-based activities.\n\n\tCollaborate with families, residential programs, and service providers.\n\n\tContribute ideas to improve program quality, participant engagement, and staff development.\n\nQualifications\n\n\tMinimum 2 years of experience working in OPWDD-regulated services required.\n\n\tAt least 1 year of supervisory or team leadership experience required.\n\n\tBachelor's degree in Human Services, Social Work, Psychology, or a related field preferred; equivalent relevant experience considered.\n\n\tStrong knowledge of OPWDD regulations, Day Habilitation documentation, and incident management.\n\n\tExperience supervising Direct Support Professionals or similar staff.\n\n\tExcellent organizational, communication, and leadership skills.\n\n\tStrong problem-solving abilities and sound professional judgment.\n\n\tAbility to manage multiple responsibilities in a fast-paced environment.\n\n\tAbility to remain calm and professional when handling challenges.\n\n\tUnderstanding of person-centered services for individuals with developmental disabilities.\n\n\tValid New York State driver's license preferred.\n\n\tSCIP-R/PROMOTE, CPR, and First Aid certification, or willingness to obtain.\n\n\tMust successfully complete required OPWDD background checks, including Justice Center Staff Exclusion List screening."}, {"id": "26859", "title": "Residential Support & Recreation Coordinator", "bhTitle": "Coordinator", "category": "Administrative & Office", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-11", "desc": "Location: Brooklyn, NY\nEmployment Type: Part-Time\nSchedule: 25–30 Hours per Week, Afternoon & Evening Hours\n\nPosition Overview\n\nA residential group home in Brooklyn is seeking a compassionate, organized, and dependable Residential Support & Recreation Coordinator to support adults with developmental disabilities.\n\nThis part-time position combines household organization, resident support, and recreational programming to help create a comfortable, welcoming, and engaging living environment.\n\nThe ideal candidate is patient, creative, and personable, with a genuine interest in supporting individuals with developmental disabilities and helping residents enjoy meaningful daily activities.\n\nKey Responsibilities\n\nResidential & Household Support\n\n\tHelp maintain a clean, organized, comfortable, and welcoming group home environment.\n\n\tEnsure resident bedrooms are tidy and assist with laundry, clothing organization, and labeling personal belongings.\n\n\tSupport residents in appropriately decorating and personalizing their bedrooms.\n\n\tAssist with seasonal clothing changes and wardrobe organization.\n\n\tKeep common areas organized, clean, and stocked with necessary supplies.\n\n\tHelp decorate and prepare the home for holidays and Yom Tov.\n\n\tIdentify and report maintenance or safety concerns to management.\n\n\tWork closely with residential staff to support daily routines and household needs.\n\nRecreation & Resident Engagement\n\n\tPlan, organize, and lead recreational activities for residents.\n\n\tFacilitate engaging activities such as games, music, arts and crafts, and group activities.\n\n\tEncourage residents to participate in activities based on their interests and abilities.\n\n\tPromote positive social interaction, inclusion, and meaningful engagement.\n\n\tBuild supportive, respectful relationships with residents.\n\n\tProvide light supervision during recreational activities and help maintain a safe environment.\n\n\tCoordinate activities and schedules with residential staff.\n\n\tHelp create a positive, enjoyable, and home-like atmosphere for all residents.\n\nQualifications\n\n\tExperience working with individuals with developmental disabilities preferred but not required.\n\n\tPatient, compassionate, respectful, and dependable.\n\n\tStrong organizational skills and attention to detail.\n\n\tCreative and comfortable planning and leading recreational activities.\n\n\tExcellent communication and interpersonal skills.\n\n\tAbility to build positive relationships with residents and coworkers.\n\n\tComfortable assisting with household organization, laundry, and daily routines.\n\n\tAbility to work independently and as part of a team.\n\n\tCPR/First Aid certification preferred, or willingness to obtain.\n\n\tTraining provided.\n\n\tMust be able to complete required background checks and medical/TB screening."}, {"id": "26858", "title": "CFO- Chief Financial Officer", "bhTitle": "CFO- Chief Financial Officer", "category": "Accounting & Finance", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-04", "desc": "This role is for a CFO who will take financial leadership across multiple businesses and the Owner's personal finances. They will be responsible to ensure stronger control, clearer reporting, and more proactive decision-making. The right person will be fiscally responsible, hands-on, and thoughtful about protecting company resources. They should be comfortable questioning expenses, compensation increases, and other financial decisions when appropriate, with the goal of safeguarding company finances and improving long-term performance.\n\nWhat You Will Do\nThis person will oversee financial operations and strategy across multiple businesses (software company, e-commerce business, real estate operations, investments) as well as handling personal financial matters for the Owner.\n\nDay-to-day responsibilities include:\n\n\tOwn bookkeeping across all entities (directly or by supervising a bookkeeper) and ensure the monthly close is completed accurately and on time.\n\tReconcile bank, credit card, and loan accounts, and manage AP/AR, payroll, invoicing, collections, and aging end to end.\n\tMaintain a clean, consistent chart of accounts and handle intercompany transactions and allocations properly and in real time. Enforce clean separation between personal and business and maintain a personal budget and new worth statement.\n\tDeliver financial statements and consolidated reporting, with breakdowns by entity, property, business line, project, or customer as needed.\n\tBuild and maintain budgets, cash flow forecasts, and projections, and monitor\n\tperformance against plan.\n\tTrack key business and SaaS metrics, perform variance analysis, and provide proactive insights to leadership.\n\tAnalyze customer, account, pricing, and margin performance to support better business decisions.\n\tReview spending and vendor activity with a strong cost-conscious mindset, and identify waste or control weaknesses.\n\tTrack investments and portfolio performance and flag what needs attention\n\tLead financial cleanup and improvement efforts, including taxes, grants, R&D credits, and stronger processes and controls.\n\tCoordinate with attorneys and advisors as needed, driving the conversations rather than relying on them\n\tEnsure financial information is organized, accurate, and easy to access\n\nWhat We're Looking For\nThe ideal candidate:\n\n\tIs highly responsible, proactive, discreet and trustworthy. This is a role for someone ready to take complete financial responsibility. Owner will not be checking in on everything, it is the CFO's responsibility to initiate conversation and alert Owner to any pressing matters.\n\tIs proactive and fiscally responsible — thinks ahead, questions unnecessary\n\tspending, and helps protect company finances\n\tHas prior experience in a CFO, finance leadership, accounting, or similar senior financial role"}, {"id": "26857", "title": "Part-Time Social Media Manager", "bhTitle": "Social Media Manager", "category": "E-commerce, Marketing & Social Media", "type": "Remote / Hybrid", "typeNote": "Remote/Hybrid/PT", "state": "NJ", "added": "2026-10-08", "exp": "2026-12-31", "desc": "Seeking a creative and motivated Social Media Manager to join a growing team on a part-time basis. This role will focus on managing social media content, creating engaging visuals, and helping capture and edit content for clients.\n\nResponsibilities:\n\n\tManage and post Instagram Stories and social media content\n\tCreate graphics and other visual content\n\tFilm and edit social media content\n\tHelp develop engaging content that aligns with each client's brand\n\tOccasionally travel locally to film content for clients\n\nLocation: Remote, with occasional in-person filming in Deal, NJ. Ideally, candidates should be based in or near Deal due to the location of most clients.\n\nSchedule: Part-time, flexible"}, {"id": "26856", "title": "Sales Representative", "bhTitle": "Sales", "category": "Sales & Live Selling", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-11", "desc": "Location: New York, NY\nEmployment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nAn established off-price wholesale apparel company is seeking a motivated and results-driven Sales Representative to join its growing team.\n\nThe ideal candidate is a confident, personable, and hardworking sales professional who understands the wholesale apparel industry and enjoys building strong customer relationships. This position focuses on developing new business, opening accounts, maintaining existing customers, and driving sales growth.\n\nThis is an excellent opportunity for someone looking to build a long-term career in wholesale apparel sales while increasing their earning potential through commissions.\n\nKey Responsibilities\n\n\tIdentify and develop new business opportunities with retailers, wholesalers, and off-price buyers.\n\n\tProspect for potential customers, generate leads, and open new accounts.\n\n\tBuild and maintain strong relationships with existing and prospective customers.\n\n\tPresent available merchandise, negotiate pricing, and close sales.\n\n\tUnderstand customer needs and recommend appropriate products and inventory opportunities.\n\n\tMaintain consistent communication and follow-up to encourage repeat business.\n\n\tCollaborate with management and the purchasing team to stay informed about available merchandise and inventory.\n\n\tManage customer accounts and identify opportunities to increase sales.\n\n\tWork toward individual sales goals and company revenue targets.\n\n\tMonitor market trends, customer demand, and new business opportunities.\n\nQualifications\n\n\tPrevious sales experience required.\n\n\tWholesale apparel or off-price industry experience strongly preferred.\n\n\tUnderstanding of wholesale pricing, profit margins, and customer relationships.\n\n\tStrong communication, negotiation, and interpersonal skills.\n\n\tConfident and comfortable reaching out to prospective customers.\n\n\tSelf-motivated, persistent, and results-oriented.\n\n\tStrong work ethic and willingness to actively pursue new business.\n\n\tExcellent organizational and follow-up skills.\n\n\tAbility to work independently while contributing to a team environment.\n\n\tExisting relationships with retail or wholesale buyers are a plus."}, {"id": "26855", "title": "Administrative Assistant", "bhTitle": "Administrative Assistant", "category": "Administrative & Office", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-04", "desc": "Food/Catering Services company is looking for a reliable, motivated Administrative Assistant to support the business with customer service, online and in-store sales, purchasing, and general administrative tasks.\n\nFull-Time / Monday–Friday\nHours to be discussed.\n\nEssential Duties & Responsibilities\n\n\tProvide customer service to online and in-store customers.\n\tAssist with the online store and customer orders.\n\tAssist with purchasing and ordering.\n\tHandle general administrative and office tasks.\n\tHelp with day-to-day business operations.\n\tAssist with other tasks and projects as needed.\n\nQualifications & Requirements\n\n\tMust be available to work Monday through Friday.\n\tMust be able to drive.\n\tNo specific experience required — training will be provided.\n\tMust be motivated, reliable, and willing to learn.\n\tGood communication and organizational skills.\n\tMust be comfortable working in a fast-paced environment.\n\nDepending on experience and ability.\n\nAdditional Information\n\nDriving requirement is not for deliveries. The candidate must be able to drive occasionally if needed to visit another location in New Jersey or another location the company may be opening.\n\nThis is a great opportunity for someone who is motivated, wants to learn, and is looking to grow with the company."}, {"id": "26854", "title": "Legal Assistant – Temporary", "bhTitle": "Legal Assistant", "category": "Legal", "type": "Temporary", "typeNote": "", "state": "NY", "added": "2026-10-08", "exp": "2027-01-07", "desc": "Schedule: Monday–Friday, 40 hours/week\nDuration: Approximately 3 months\n\nSeeking a temporary Legal Assistant for approximately three months to support the legal team with drafting, preparing, and filing legal documents. Responsibilities will include assisting with day-to-day legal administrative tasks, organizing documents and files, and providing general support to the office as needed."}, {"id": "26853", "title": "Part-Time Medical Office Front Desk", "bhTitle": "Part-Time Medical Office Front Desk", "category": "Healthcare & Human Services", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-07", "exp": "2027-01-08", "desc": "Medical office seeking a part-time Front Desk candidate to assist with patient reception, scheduling, and general office support.\n\nSchedule:\nMonday–Thursday starting at 2 PM\nFriday 10 AM–1 PM\nSunday 9 AM–12 PM\n\nQualifications: College student or graduate preferred; strong communication, organization, and customer service skills. Medical or office experience is a plus."}, {"id": "26852", "title": "Executive Assistant", "bhTitle": "Executive Assistant", "category": "Administrative & Office", "type": "Full or Part Time", "typeNote": "", "state": "NY", "added": "2026-10-07", "exp": "2027-01-04", "desc": "Hours: Part/Full Time 5/6 hours/day (minimum 25 hours/week)\n\nRole Overview:\nThis Executive Assistant role was formed to take work off the CEO's desk. The right person will proactively bring order across multiple businesses, manage priorities and keep projects moving. The ideal candidate is capable, proactive (doesn't wait for tasks to be handed over), sharp and highly trustworthy. This has the potential to be a long-term opportunity for someone who wants to become an integral part of the team and can be relied on with sensitive business and financial information.\n\nWhat you will do:\nThis person will own day-to-day schedule and support tasks and projects across three businesses:\n- A software company\n- An e-commerce business\n- Real estate operations\n\nDay-to-day responsibilities include:\n\n\tManaging calendars, scheduling meetings, and coordinating across multiple parties\n\tTriaging inboxes, identifying priorities, and clearing non-urgent items\n\tDrafting and sending emails\n\tMaintaining task lists and ensuring open items are completed\n\tFollowing up on outstanding items waiting for others\n\tTurning meetings into clear action items and next steps\n\tTracking deadlines across multiple businesses\n\tOrganizing files, contracts, and shared drives so information is easy to find\n\tPreparing documents, decks, spreadsheets, and letters as needed\n\tRunning various projects end to end\n\nWhat We're Looking For:\nThe ideal candidate is:\n\n\tSomeone who takes ownership of their work - takes responsibility to drive it to completion; they do not require check ins/follow-ups.\n\tProactive and self-directed - sees what needs to be done and takes responsibility for it without being asked; takes tasks off CEO's plate that are not necessary for him to be doing. They should be comfortable asking questions, pushing back when appropriate, and figuring out how to move things forward.\n\tOutcome oriented - understands the end goal of their tasks, not just the instructions; able to think critically and adjust their approach if necessary in order to get to the desired outcome.\n\tSmart, Resourceful, a Problem Solver - someone who can quickly grasp context, think independently, and run with a task on their own.\n\tDiscreet and trustworthy - candidate must be trustworthy, have excellent judgement and be able to handle sensitive matters with discretion\n\tSomeone who genuinely wants to support and make life easier for the person they work with\n\nExperience:\nA few years of workplace experience is preferred. Specific experience as an Executive Assistant is a big plus."}, {"id": "26851", "title": "IT Support Associate", "bhTitle": "Computers IT", "category": "Technology & IT", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-07", "exp": "2027-01-13", "desc": "Department: Administration\nLocations: Lower East Side, NY & Dyker Heights, Brooklyn\n\nSeeking an IT Support Associate to provide first-level technical support to staff and programs. This position will help users troubleshoot and resolve technical issues, escalating when needed, while providing strong customer service and supporting the day-to-day operations of the IT department.\n\nResponsibilities:\n\n\tProvide first-level IT support and troubleshoot user issues.\n\n\tInstall, maintain, and support Windows systems, software, and hardware.\n\n\tManage users and accounts through Active Directory and Office 365.\n\n\tParticipate in system upgrades, replacements, and other IT projects.\n\n\tProvide IT support across various locations throughout the five boroughs.\n\n\tManage multiple tasks and projects while prioritizing work with limited supervision.\n\n\tSupport program initiatives as needed, including outside standard working hours.\n\n\tPerform other job-related duties as assigned.\n\nQualifications:\n\n\tHigh school diploma or GED required; Associate or College degree preferred.\n\n\t3+ years of experience supporting computer systems, with a strong background and interest in helpdesk support.\n\n\tStrong knowledge of Windows PCs, Active Directory, and Office 365.\n\n\tA+ certification is a plus.\n\n\tExcellent verbal and written communication and customer service skills.\n\n\tStrong analytical and troubleshooting abilities.\n\n\tAble to work under pressure, meet deadlines, and maintain a positive attitude.\n\n\tAbility to work independently and complete assignments with limited supervision.\n\n\tValid NYS Driver's License and clean driving record required.\n\nPhysical Requirements:\n\n\tAbility to maintain regular and punctual attendance and meet job performance standards.\n\n\tMust be able to lift and carry up to 35 lbs.\n\n\tMust be able to communicate clearly by speaking, listening, and talking.\n\n\tReasonable accommodations may be made to enable individuals with disabilities to perform essential job functions."}, {"id": "26850", "title": "Senior Sales Manager (Toy Division)", "bhTitle": "Division Manager", "category": "HR, Management & Fundraising", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-07", "exp": "2027-01-07", "desc": "Location: Brooklyn, NY\nJob Type: Full-Time\nSchedule: Monday to Friday\n\nWe are seeking an ambitious, mid to senior level Sales Manager to lead and scale our Toy Division. With an established foundation of existing licenses, open accounts, and a newly secured major brand license, this role offers an incredible growth trajectory. You will take ownership of developing new retail partnerships, driving revenue across major accounts, and expanding brand distribution. While prior experience in the toy industry is preferred, experienced sales professionals with a strong background in general consumer hardlines are encouraged to apply.\n\nKey Responsibilities:\n\n\tLead overall sales strategy and account development for our growing Toy Division.\n\n\tTarget, pitch, and secure new retail accounts across mass market, specialty, and e-commerce channels.\n\n\tCapitalize on our newly acquired major brand license to maximize distribution and shelf placement.\n\n\tMaintain strong relationships with active retail buyers while re-engaging open accounts.\n\n\tCollaborate closely with internal product development and management teams to align product lines with market demand.\n\n\tAnalyze sales metrics, forecast order volume, and hit aggressive sales targets.\n\nQualifications:\n\n\t5+ years of successful B2B sales experience in consumer hardlines or the toy industry.\n\n\tProven track record of opening new accounts, building key buyer relationships, and driving volume growth.\n\n\tStrong presentation, negotiation, and contract closing skills.\n\n\tAbility to work independently, prioritize sales leads, and manage multiple retail pipelines.\n\n\tHigh energy and entrepreneurial mindset with a commitment to scaling a brand division.\n\nWhat We Offer:\n\n\tSignificant career advancement potential as you build and run a primary category driver.\n\n\tA strong portfolio of active licenses and major brand partnerships.\n\n\tCollaborative, creative work environment based in Brooklyn, NY."}, {"id": "26849", "title": "WHAT YOU'LL DO", "bhTitle": "Interior Design Intern", "category": "Design & Creative", "type": "Internship", "typeNote": "", "state": "NY", "added": "2026-10-07", "exp": "", "desc": "• Help create furniture packages, room layouts, mood boards, and design concepts.\n• Work with floor plans and tools such as Rayon, AutoCAD, SketchUp, Canva, or similar software.\n• Create social media content, graphics, photography, and marketing materials.\n• Help develop Instagram, LinkedIn, and other marketing campaigns.\n• Assist with product presentations, renderings, and visual presentations.\n• Bring fresh creative ideas to our brand, products, and marketing strategy.\n• Work directly with our leadership team on real-world projects.\nWHO WE'RE LOOKING FOR\n• Current college student studying Design, Marketing, Architecture, Interior Design, Graphic Design, Business, or a related field.\n• Creative, energetic, entrepreneurial, and eager to learn.\n• Strong eye for design, aesthetics, and visual storytelling.\n• Social media savvy and comfortable creating content.\n• Organized, proactive, and able to manage multiple projects.\n• Experience with Canva, Adobe, CAD, or similar tools is a plus — not required.\n• Portfolio or examples of your work are a plus.\nWHY JOIN?\nReal work. Real projects. Real responsibility. You'll work alongside an entrepreneurial team, contribute to projects across the country, and have the chance to see your creative work become part of real spaces.\n\n\t\t\tPAID INTERNSHIP  •  BROOKLYN / NEW YORK  •  FLEXIBLE AROUND CLASS SCHEDULE"}, {"id": "26847", "title": "Registered Nurse – Adult Group Homes | Boro Park", "bhTitle": "Nurse", "category": "Healthcare & Human Services", "type": "Part Time", "typeNote": "", "state": "NY", "added": "2026-10-07", "exp": "2027-01-05", "desc": "Healthcare organization is seeking a Registered Nurse (RN) to provide nursing support for adults living in group home settings. This is a great opportunity for an experienced and compassionate RN looking for a flexible schedule and a meaningful role working directly with individuals in a supportive residential environment.\n\nLocation: Boro Park\nHours: Approximately 9 AM–3/5 PM, flexible"}, {"id": "26846", "title": "Technical Designer / Spec Technician", "bhTitle": "Product Development", "category": "Production & Product Development", "type": "Full Time", "typeNote": "", "state": "NY", "added": "2026-10-07", "exp": "2027-01-07", "desc": "Employment Type: Full-Time\nSchedule: Monday–Friday\n\nPosition Overview\n\nAn apparel company is seeking an experienced Technical Designer / Spec Technician specializing in children's apparel. This position will focus primarily on boys' and girls' sleepwear, swimwear, and intimates, covering sizes from 12 months through size 16.\n\nThe ideal candidate has extensive experience in the budget children's sleepwear market and a strong technical understa
